name: Auto-Label Issues

# Suggests or applies labels to new issues based on semantic matching
# Uses label_matcher.py for embedding-based similarity

on:
  issues:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write
  models: read

env:
  # Threshold for auto-applying labels (very high confidence)
  AUTO_APPLY_THRESHOLD: "0.90"
  # Threshold for suggesting labels (lower, for comments)
  SUGGEST_THRESHOLD: "0.75"
  # Keep embedding queries bounded for large issue bodies.
  AUTO_LABEL_QUERY_MAX_CHARS: "6000"

concurrency:
  group: >-
    agents-auto-label-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  auto-label:
    runs-on: ubuntu-latest
    # Skip issues already routed by agents or machine-managed campaign issues.
    if: |
      !contains(github.event.issue.labels.*.name, 'agents:auto-pilot') &&
      !contains(github.event.issue.labels.*.name, 'agents:formatted') &&
      !contains(github.event.issue.labels.*.name, 'agents:autofix') &&
      !contains(github.event.issue.labels.*.name, 'agent:codex') &&
      !contains(github.event.issue.labels.*.name, 'agent:claude') &&
      !contains(github.event.issue.labels.*.name, 'agent:auto') &&
      !contains(join(github.event.issue.labels.*.name, ','), 'campaign:') &&
      !contains(github.event.issue.labels.*.name, 'automated')

    steps:
      - name: Checkout eligibility action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ github.event.pull_request.base.sha ||
            github.sha ||
            github.event.repository.default_branch ||
            github.event.workflow_run.repository.default_branch }}
          sparse-checkout: .github/actions/agent-event-eligibility
          sparse-checkout-cone-mode: false
          path: eligibility-source

      # Escape hatch: set mode: warning if false-negative skips appear post-merge.
      - name: Check event eligibility
        id: eligibility
        uses: ./eligibility-source/.github/actions/agent-event-eligibility
        with:
          expected-actions: opened,reopened,edited
          custom-predicate: >-
            sender.type != 'Bot' && !ends_with(sender.login, '[bot]')

      - name: Checkout repository
        if: steps.eligibility.outputs.should-run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup API client
        if: steps.eligibility.outputs.should-run == 'true'
        uses: ./.github/actions/setup-api-client
        with:
          # Named secret inputs instead of `secrets: ${{ toJSON(secrets) }}`.
          # setup-api-client jq-extracts exactly these keys from that blob and
          # already declares each as an individual input, so this is
          # behaviour-preserving: an absent secret resolves to empty either way.
          # Removing the whole-secrets-context handoff is what cleared GitHub's
          # suspicious-workflow hold on agents-dedup (#3185): it then ran at
          # run_attempt 1 with nothing approved, after 22 days held.
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}

      - name: Set up Python
        if: steps.eligibility.outputs.should-run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        if: steps.eligibility.outputs.should-run == 'true'
        run: |
          # Guarded: a consumer need not be an installable package (the template
          # ships no pyproject.toml), and one that is need not declare a
          # `langchain` extra. Fall back to the fleet's canonical LLM pins, which
          # the sync manifest delivers to every consumer, so the langchain imports
          # below still resolve instead of failing at import time.
          if [ -f pyproject.toml ] || [ -f setup.py ] || [ -f setup.cfg ]; then
            pip install -e ".[langchain]" --quiet
          elif [ -f tools/requirements-llm.txt ]; then
            echo "No packaging metadata; installing LLM pins from tools/requirements-llm.txt."
            python -m pip install -r tools/requirements-llm.txt --quiet
          else
            echo "No packaging metadata and no tools/requirements-llm.txt; skipping install."
          fi

      - name: Get repo labels
        if: steps.eligibility.outputs.should-run == 'true'
        id: get-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { paginateWithRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'agents-auto-label',
              capabilities: ['issues:read'],
            });

            // Paginate to get all labels (handles repos with >100 labels)
            const labels = await paginateWithRetry(
              github.rest.issues.listLabelsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const labelData = labels.map(l => ({
              name: l.name,
              description: l.description || ''
            }));

            core.setOutput('labels_json', JSON.stringify(labelData));
            core.info(`Found ${labels.length} labels in repo`);

      - name: Match labels
        if: steps.eligibility.outputs.should-run == 'true'
        id: match
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_STRANSKE: ${{ secrets.CLAUDE_API_STRANSKE }}
          LABELS_JSON: ${{ steps.get-labels.outputs.labels_json }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          import json
          import os
          import sys

          # Add scripts to path
          sys.path.insert(0, '.')

          from scripts.langchain.label_matcher import (
              bounded_diverse_matches,
              build_label_vector_store,
              find_similar_labels,
              issue_auto_apply_matches,
              LabelRecord,
          )

          # Get issue content
          issue_title = os.environ.get('ISSUE_TITLE', '')
          issue_body = os.environ.get('ISSUE_BODY', '')
          query_max_chars_raw = os.environ.get('AUTO_LABEL_QUERY_MAX_CHARS', '6000')
          try:
              query_max_chars = int(query_max_chars_raw)
          except ValueError:
              query_max_chars = 6000
              print(
                  "Invalid AUTO_LABEL_QUERY_MAX_CHARS value "
                  f"{query_max_chars_raw!r}; using 6000"
              )
          if query_max_chars <= 0:
              query_max_chars = 6000
              print("AUTO_LABEL_QUERY_MAX_CHARS must be positive; using 6000")
          query = f"{issue_title}\n\n{issue_body}"
          if len(query) > query_max_chars:
              query = query[:query_max_chars]
              print(f"Truncated issue query to {query_max_chars} characters")

          # Get thresholds
          auto_threshold = float(os.environ.get('AUTO_APPLY_THRESHOLD', '0.90'))
          suggest_threshold = float(os.environ.get('SUGGEST_THRESHOLD', '0.75'))

          # Parse labels
          labels_json = os.environ.get('LABELS_JSON', '[]')
          labels = json.loads(labels_json)

          if not labels:
              print("No labels found in repo")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('has_suggestions=false\n')
              sys.exit(0)

          # Build vector store
          label_records = [
              LabelRecord(name=l['name'], description=l['description'])
              for l in labels
          ]
          store = build_label_vector_store(label_records)

          if store is None:
              print("Could not build label vector store (missing embeddings)")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('has_suggestions=false\n')
              sys.exit(0)

          # Find matches — diverse=False so same-family competitors are visible
          # to issue_auto_apply_matches for correct margin evaluation.
          matches = find_similar_labels(store, query, threshold=suggest_threshold, k=10, diverse=False)

          if not matches:
              print("No label matches found above threshold")
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('has_suggestions=false\n')
              sys.exit(0)

          # Auto-apply: margin check must see same-family competitors.
          auto_apply = issue_auto_apply_matches(matches, threshold=auto_threshold)
          # Suggestions display: apply family diversity so each family shows once.
          diverse_matches = bounded_diverse_matches(matches, 5)
          suggestions = [m for m in diverse_matches if m not in auto_apply]

          print(f"Auto-apply labels ({auto_threshold}+ confidence):")
          for m in auto_apply:
              print(f"  - {m.label.name}: {m.score:.2%}")

          print(f"Suggested labels ({suggest_threshold}-{auto_threshold} confidence):")
          for m in suggestions:
              print(f"  - {m.label.name}: {m.score:.2%}")

          # Output results
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('has_suggestions=true\n')
              auto_json = json.dumps([m.label.name for m in auto_apply])
              f.write(f'auto_apply_labels={auto_json}\n')
              sugg_data = [
                  {"name": m.label.name, "score": f"{m.score:.0%}"}
                  for m in suggestions
              ]
              f.write(f'suggested_labels={json.dumps(sugg_data)}\n')

          PYTHON_SCRIPT

      - name: Apply high-confidence labels
        if: |
          steps.eligibility.outputs.should-run == 'true' &&
          steps.match.outputs.has_suggestions == 'true' &&
          steps.match.outputs.auto_apply_labels != '[]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'agents-auto-label',
              capabilities: ['issues:read', 'issues:write'],
            });
            const autoApplyLabels = JSON.parse('${{ steps.match.outputs.auto_apply_labels }}');

            if (autoApplyLabels.length === 0) {
              core.info('No labels to auto-apply');
              return;
            }

            // Get current labels
            const { data: issue } = await withRetry((client) => client.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            }));

            const currentLabels = issue.labels.map(l => l.name);
            const newLabels = autoApplyLabels.filter(l => !currentLabels.includes(l));

            if (newLabels.length === 0) {
              core.info('All suggested labels already present');
              return;
            }

            // Add labels
            await withRetry((client) => client.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: newLabels
            }));

            core.info(`Applied labels: ${newLabels.join(', ')}`);

      - name: Post suggestion comment
        if: |
          steps.eligibility.outputs.should-run == 'true' &&
          steps.match.outputs.has_suggestions == 'true' &&
          steps.match.outputs.suggested_labels != '[]'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry, paginateWithRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'agents-auto-label',
              capabilities: ['issues:read', 'issues:write'],
            });
            const suggestedLabels = JSON.parse('${{ steps.match.outputs.suggested_labels }}');
            const autoApplied = JSON.parse('${{ steps.match.outputs.auto_apply_labels }}');

            if (suggestedLabels.length === 0) {
              core.info('No suggestions to post');
              return;
            }

            // Build suggestion list
            const suggestions = suggestedLabels
              .map(l => `- \`${l.name}\` (${l.score} confidence)`)
              .join('\n');

            let body = `### 🏷️ Label Suggestions\n\n`;
            body += `Based on the issue content, these labels might be relevant:\n\n`;
            body += `${suggestions}\n\n`;

            if (autoApplied.length > 0) {
              const applied = autoApplied.map(l => `\`${l}\``).join(', ');
              body += `**Auto-applied:** ${applied}\n\n`;
            }

            body += `<details>\n<summary>How to use these suggestions</summary>\n\n`;
            body += `- Click the label name in the sidebar to add it\n`;
            const editCmd = `gh issue edit ${context.issue.number} --add-label "label-name"`;
            body += `- Or use the GitHub CLI: \`${editCmd}\`\n`;
            body += `</details>\n\n`;
            body += `---\n*Auto-generated by label matcher*`;

            // Check for existing suggestion comment
            const comments = await paginateWithRetry(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 30
              }
            );

            const existingComment = comments.find(c =>
              c.body.includes('### 🏷️ Label Suggestions') &&
              c.user.type === 'Bot'
            );

            if (existingComment) {
              // Update existing comment
              await withRetry((client) => client.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: body
              }));
              core.info('Updated existing suggestion comment');
            } else {
              // Create new comment
              await withRetry((client) => client.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              }));
              core.info('Posted label suggestions');
            }
