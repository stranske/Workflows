name: Agents Gate Followups

on:
  workflow_run:
    workflows: ["Gate"]
    types: [completed]
  # Keep privileged PR wakeups on the base-defined workflow. The guarded jobs
  # never execute or check out the pull request head.
  pull_request_target:
    types:
      - labeled
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to force retry'
        required: true
        type: number
      force_retry:
        description: 'Force retry even if gate is cancelled/deferred'
        required: false
        default: true
        type: boolean
      authority_challenge_fingerprint:
        description: 'Internal sweep provenance for one due authority challenge'
        required: false
        default: ''
        type: string
      authority_challenge_claim:
        description: 'Internal signed sweep claim metadata for one due authority challenge'
        required: false
        default: ''
        type: string
      sweep_recheck:
        description: 'Internal hourly sweep wakeup; re-evaluates without forcing Gate bypass'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  models: read

concurrency:
  group: >-
    agents-gate-followups-${{ github.event.workflow_run.pull_requests[0].number ||
      github.event.pull_request.number ||
      github.event.inputs.pr_number ||
      github.run_id }}
  cancel-in-progress: false

env:
  WRITE_TOKEN: >-
    ${{ secrets.AGENTS_AUTOMATION_PAT ||
        secrets.ACTIONS_BOT_PAT ||
        secrets.SERVICE_BOT_PAT ||
        github.token }}

jobs:
  evaluate:
    name: Evaluate keepalive loop
    if: >-
      ${{
        (vars.USE_CONSOLIDATED_WORKFLOWS == 'true' || github.event_name == 'workflow_dispatch') &&
        (github.event_name != 'pull_request_target' || github.event.action != 'synchronize')
      }}
    runs-on: ubuntu-latest
    environment: agent-standard
    outputs:
      pr_number: ${{ steps.evaluate.outputs.pr_number }}
      pr_ref: ${{ steps.evaluate.outputs.pr_ref }}
      head_sha: ${{ steps.evaluate.outputs.head_sha }}
      action: ${{ steps.evaluate.outputs.action }}
      reason: ${{ steps.evaluate.outputs.reason }}
      gate_conclusion: ${{ steps.evaluate.outputs.gate_conclusion }}
      iteration: ${{ steps.evaluate.outputs.iteration }}
      max_iterations: ${{ steps.evaluate.outputs.max_iterations }}
      failure_threshold: ${{ steps.evaluate.outputs.failure_threshold }}
      tasks_total: ${{ steps.evaluate.outputs.tasks_total }}
      tasks_unchecked: ${{ steps.evaluate.outputs.tasks_unchecked }}
      keepalive_enabled: ${{ steps.evaluate.outputs.keepalive_enabled }}
      autofix_enabled: ${{ steps.evaluate.outputs.autofix_enabled }}
      has_agent_label: ${{ steps.evaluate.outputs.has_agent_label }}
      agent_type: ${{ steps.evaluate.outputs.agent_type }}
      task_appendix: ${{ steps.evaluate.outputs.task_appendix }}
      trace: ${{ steps.evaluate.outputs.trace }}
      prompt_mode: ${{ steps.evaluate.outputs.prompt_mode }}
      prompt_file: ${{ steps.evaluate.outputs.prompt_file }}
      start_ts: ${{ steps.timestamps.outputs.start_ts }}
      delegation_reason: ${{ steps.evaluate.outputs.delegation_reason }}
      delegation_should_switch: ${{ steps.evaluate.outputs.delegation_should_switch }}
      delegation_source: ${{ steps.evaluate.outputs.delegation_source }}
      agent_routing_mode: ${{ steps.evaluate.outputs.agent_routing_mode }}
      security_blocked: ${{ steps.security_gate.outputs.blocked }}
      security_reason: ${{ steps.security_gate.outputs.reason }}
      dispatch_should_run: ${{ steps.runner_dispatch.outputs.should_dispatch || 'true' }}
      dispatch_reason: ${{ steps.runner_dispatch.outputs.reason }}
      fingerprint_should_run: ${{ steps.fingerprint.outputs.should_run || 'true' }}
      fingerprint_reason: ${{ steps.fingerprint.outputs.reason }}
      fingerprint_current_hash: ${{ steps.fingerprint.outputs.current_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}
          github_token: ${{ github.token }}

      - name: Compute state fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: >-
            ${{
              github.event.workflow_run.pull_requests[0].number ||
              github.event.pull_request.number ||
              github.event.inputs.pr_number ||
              ''
            }}
          GATE_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          FORCE_RETRY: ${{ github.event.inputs.force_retry || 'false' }}
          AUTHORITY_CHALLENGE_FINGERPRINT: >-
            ${{ github.event_name == 'workflow_dispatch' &&
              github.actor == 'github-actions[bot]' &&
              github.event.inputs.sweep_recheck == 'true' &&
              github.event.inputs.authority_challenge_fingerprint || '' }}
          SWEEP_RECHECK: >-
            ${{ github.event_name == 'workflow_dispatch' &&
              github.actor == 'github-actions[bot]' &&
              github.event.inputs.sweep_recheck == 'true' }}
        run: |
          if [ -z "${PR_NUMBER:-}" ]; then
            {
              echo "should_run=true"
              echo "reason=no-pr-context"
              echo "current_hash="
              echo "prior_hash="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${SWEEP_RECHECK:-false}" = "true" ]; then
            {
              echo "should_run=true"
              if [ -n "${AUTHORITY_CHALLENGE_FINGERPRINT:-}" ]; then
                echo "reason=due-authority-challenge"
              else
                echo "reason=scheduled-sweep-recheck"
              fi
              echo "current_hash="
              echo "prior_hash="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' > /tmp/state-fingerprint-inputs.json
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = os.environ["PR_NUMBER"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          api_root = (os.environ.get("GITHUB_API_URL") or "https://api." + "github.com").rstrip("/")

          def api(path):
              request = urllib.request.Request(f"{api_root}{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          pr = api(f"/repos/{repo}/pulls/{pr_number}")
          labels = api(f"/repos/{repo}/issues/{pr_number}/labels")
          label_names = sorted(label.get("name", "") for label in labels if label.get("name"))
          payload = {
              "pr_number": int(pr_number),
              "head_sha": pr.get("head", {}).get("sha", ""),
              "gate_conclusion": os.environ.get("GATE_CONCLUSION", ""),
              "force_retry": os.environ.get("FORCE_RETRY", "").lower() == "true",
              "automation_label_state": [
                  name for name in label_names
                  if (
                      name.startswith("autofix")
                      or name.startswith("agent:")
                      or name in {
                          "agents:auto-pilot",
                          "agents:keepalive",
                          "agents:paused",
                          "needs-human",
                      }
                  )
              ],
          }
          print(json.dumps(payload, sort_keys=True))
          PY

          python scripts/state_fingerprint.py compare \
            --workflow "${GITHUB_WORKFLOW}" \
            --inputs "$(cat /tmp/state-fingerprint-inputs.json)" \
            --storage pr-comment

      - name: Report unchanged state skip
        if: steps.fingerprint.outputs.should_run == 'false'
        run: echo "Skipped - ${{ steps.fingerprint.outputs.reason }}"

      - name: Capture timestamps
        id: timestamps
        if: steps.fingerprint.outputs.should_run == 'true'
        run: echo "start_ts=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - name: Security gate - prompt injection guard
        id: security_gate
        if: steps.fingerprint.outputs.should_run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({ github, core });

            const { evaluatePromptInjectionGuard } = require(
              './.github/scripts/prompt_injection_guard.js'
            );

            // Resolve PR from event context
            const payload = context.payload || {};
            let prNumber = 0;
            let pr = null;

            if (context.eventName === 'pull_request_target' && payload.pull_request) {
              prNumber = payload.pull_request.number;
              pr = payload.pull_request;
            } else if (context.eventName === 'workflow_run' && payload.workflow_run) {
              const prs = payload.workflow_run.pull_requests || [];
              if (prs[0]?.number) {
                prNumber = prs[0].number;
                const { data } = await withRetry((client) => client.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                }));
                pr = data;
              }
            }

            if (!pr) {
              core.setOutput('blocked', 'false');
              core.setOutput('reason', 'no-pr-context');
              return;
            }

            const result = await evaluatePromptInjectionGuard({
              github,
              context,
              pr,
              actor: context.actor,
              promptContent: pr.body || '',
              core,
            });

            core.setOutput('blocked', String(result.blocked));
            core.setOutput('reason', result.reason);

            if (result.blocked) {
              core.setFailed(`Security gate blocked: ${result.reason}`);
            }

      - name: Evaluate keepalive state
        id: evaluate
        if: steps.fingerprint.outputs.should_run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          INPUT_PR_NUMBER: ${{ github.event.inputs.pr_number || '' }}
          INPUT_FORCE_RETRY: ${{ github.event.inputs.force_retry || 'false' }}
          ROUTE_WEIGHTS_URL: ${{ vars.ROUTE_WEIGHTS_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { evaluateKeepaliveLoop } = require('./.github/scripts/keepalive_loop.js');
            const options = { github, context, core };
            // Pass workflow_dispatch inputs if present
            const inputPrNumber = process.env.INPUT_PR_NUMBER;
            const forceRetry = process.env.INPUT_FORCE_RETRY === 'true';
            if (inputPrNumber) {
              options.overridePrNumber = parseInt(inputPrNumber, 10);
            }
            if (forceRetry) {
              options.forceRetry = true;
            }
            const result = await evaluateKeepaliveLoop(options);
            const output = {
              pr_number: String(result.prNumber || ''),
              pr_ref: String(result.prRef || ''),
              head_sha: String(result.headSha || ''),
              action: result.action || '',
              reason: result.reason || '',
              gate_conclusion: result.gateConclusion || '',
              iteration: String(result.iteration ?? ''),
              max_iterations: String(result.maxIterations ?? ''),
              failure_threshold: String(result.failureThreshold ?? ''),
              tasks_total: String(result.checkboxCounts?.total ?? ''),
              tasks_unchecked: String(result.checkboxCounts?.unchecked ?? ''),
              keepalive_enabled: String(result.keepaliveEnabled ?? ''),
              autofix_enabled: String(result.config?.autofix_enabled ?? ''),
              has_agent_label: String(result.hasAgentLabel ?? ''),
              agent_type: String(result.agentType || ''),
              trace: String(result.config?.trace || result.state?.trace || ''),
              prompt_mode: String(result.promptMode || 'normal'),
                prompt_file: String(
                  result.promptFile || '.github/codex/prompts/keepalive_next_task.md'
                ),
              delegation_reason: String(result.delegationReason || ''),
              delegation_should_switch: String(result.delegationShouldSwitch || 'false'),
              delegation_source: String(result.delegationSource || ''),
              agent_routing_mode: String(result.agentRoutingMode || ''),
            };
            for (const [key, value] of Object.entries(output)) {
              core.setOutput(key, value);
            }
            // Task appendix needs special handling due to multiline content
            core.setOutput('task_appendix', result.taskAppendix || '');

      - name: Check runner dispatch debounce
        id: runner_dispatch
        if: >
          steps.fingerprint.outputs.should_run == 'true' &&
          (steps.evaluate.outputs.action == 'run' ||
          steps.evaluate.outputs.action == 'fix' ||
          steps.evaluate.outputs.action == 'conflict')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.evaluate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.evaluate.outputs.head_sha }}
          PROVIDER: ${{ steps.evaluate.outputs.agent_type || 'codex' }}
          AUTHORITY_CHALLENGE_FINGERPRINT: >-
            ${{ github.event_name == 'workflow_dispatch' &&
              github.actor == 'github-actions[bot]' &&
              github.event.inputs.sweep_recheck == 'true' &&
              github.event.inputs.authority_challenge_fingerprint || '' }}
          AUTHORITY_CHALLENGE_CLAIM: >-
            ${{ github.event_name == 'workflow_dispatch' &&
              github.actor == 'github-actions[bot]' &&
              github.event.inputs.sweep_recheck == 'true' &&
              github.event.inputs.authority_challenge_claim || '' }}
          AUTHORITY_CHALLENGE_SIGNING_KEY: >-
            ${{ secrets.KEEPALIVE_AUTHORITY_SIGNING_KEY || '' }}
        run: |
          set -euo pipefail
          if node <<'NODE'
          const { verifyAuthorityChallengeEnvelope } =
            require('./.github/scripts/keepalive_challenge_due.js');
          const verified = verifyAuthorityChallengeEnvelope({
            claimJson: process.env.AUTHORITY_CHALLENGE_CLAIM,
            signingKey: process.env.AUTHORITY_CHALLENGE_SIGNING_KEY,
            repository: process.env.GITHUB_REPOSITORY,
            prNumber: process.env.PR_NUMBER,
            boundaryFingerprint: process.env.AUTHORITY_CHALLENGE_FINGERPRINT,
          });
          process.exitCode = verified ? 0 : 1;
          NODE
          then
            {
              echo "should_dispatch=true"
              echo "reason=due-authority-challenge"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            {
              echo "should_dispatch=true"
              echo "reason=missing-pr-or-sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m scripts.runner_lib should-dispatch \
            --provider "$PROVIDER" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --storage auto

  preflight:
    name: Verify secrets available
    needs: evaluate
    if: |
      needs.evaluate.outputs.dispatch_should_run == 'true' &&
      (needs.evaluate.outputs.action == 'run' ||
      needs.evaluate.outputs.action == 'fix' ||
      needs.evaluate.outputs.action == 'conflict')
    runs-on: ubuntu-latest
    environment: agent-standard
    outputs:
      secrets_ok: ${{ steps.check.outputs.secrets_ok }}
      failure_summary: ${{ steps.check.outputs.failure_summary }}
    steps:
      - name: Check secrets
        id: check
        env:
          HAS_CODEX_AUTH: ${{ secrets.CODEX_AUTH_JSON != '' }}
          HAS_CLAUDE_AUTH: ${{ secrets.CLAUDE_AUTH_JSON != '' }}
          HAS_CLAUDE_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
          HAS_CURSOR_AUTH: ${{ secrets.CURSOR_API_KEY != '' }}
          HAS_GEMINI_AUTH: ${{ secrets.GEMINI_API_KEY != '' }}
          AGENT_TYPE: ${{ needs.evaluate.outputs.agent_type || 'codex' }}
          HAS_APP_ID: >-
            ${{ secrets.KEEPALIVE_APP_ID != '' ||
                secrets.WORKFLOWS_APP_ID != '' }}
          HAS_APP_KEY: >-
            ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY != '' ||
                secrets.WORKFLOWS_APP_PRIVATE_KEY != '' }}
        run: |
          echo "CODEX_AUTH_JSON present: $HAS_CODEX_AUTH"
          echo "CLAUDE_AUTH_JSON present: $HAS_CLAUDE_AUTH"
          echo "CLAUDE_CODE_OAUTH_TOKEN present: $HAS_CLAUDE_OAUTH"
          echo "CURSOR_API_KEY present: $HAS_CURSOR_AUTH"
          echo "GEMINI_API_KEY present: $HAS_GEMINI_AUTH"
          echo "KEEPALIVE_APP or WORKFLOWS_APP present: $HAS_APP_ID"
          echo "WORKFLOWS_APP_PRIVATE_KEY present: $HAS_APP_KEY"
          case "$AGENT_TYPE" in
            claude)
              if [ "$HAS_CLAUDE_AUTH" = "true" ] || [ "$HAS_CLAUDE_OAUTH" = "true" ]; then
                agent_auth_ok=true
              else
                agent_auth_ok=false
              fi
              ;;
            codex) agent_auth_ok=$HAS_CODEX_AUTH ;;
            cursor) agent_auth_ok=$HAS_CURSOR_AUTH ;;
            gemini) agent_auth_ok=$HAS_GEMINI_AUTH ;;
            *) agent_auth_ok=false ;;
          esac
          if [ "$agent_auth_ok" = "true" ]; then
            echo "secrets_ok=true" >> "$GITHUB_OUTPUT"
          else
            case "$AGENT_TYPE" in
              claude)
                missing_msg="Missing Claude auth: set CLAUDE_CODE_OAUTH_TOKEN or CLAUDE_AUTH_JSON"
                ;;
              codex)
                missing_msg="Missing Codex auth: set CODEX_AUTH_JSON"
                ;;
              cursor)
                missing_msg="Missing Cursor auth: set the CURSOR_API_KEY secret"
                ;;
              gemini)
                missing_msg="Missing Gemini auth: set the GEMINI_API_KEY secret"
                ;;
              *)
                missing_msg="Missing ${AGENT_TYPE} auth: set the routed agent credential"
                ;;
            esac
            echo "::error::$missing_msg"
            echo "secrets_ok=false" >> "$GITHUB_OUTPUT"
            echo "failure_summary=$missing_msg" >> "$GITHUB_OUTPUT"
            exit 1
          fi

  test-job:
    name: Test job creation
    needs: evaluate
    if: needs.evaluate.outputs.fingerprint_should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Test job ran!"
            echo "Action was ${{ needs.evaluate.outputs.action }}"
            echo "Agent was ${{ needs.evaluate.outputs.agent_type }}"

  # Mark agent as running before starting the actual work
  # This provides real-time visibility that the agent is actively engaged
  mark-running:
    name: Mark agent running
    needs:
      - evaluate
      - preflight
    if: |
      needs.evaluate.outputs.dispatch_should_run == 'true' &&
      (needs.evaluate.outputs.action == 'run' ||
      needs.evaluate.outputs.action == 'fix' ||
      needs.evaluate.outputs.action == 'conflict')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}
          github_token: ${{ github.token }}

      - name: Mint KEEPALIVE_APP running token
        id: running_keepalive_app_token
        if: ${{ env.KEEPALIVE_APP_ID != '' && env.KEEPALIVE_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        continue-on-error: true
        env:
          KEEPALIVE_APP_ID: ${{ secrets.KEEPALIVE_APP_ID || '' }}
          KEEPALIVE_APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY || '' }}
        with:
          client-id: ${{ env.KEEPALIVE_APP_ID }}
          private-key: ${{ env.KEEPALIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Mint WORKFLOWS_APP running token
        id: running_workflows_app_token
        if: |
          steps.running_keepalive_app_token.outputs.token == '' &&
          env.WORKFLOWS_APP_ID != '' &&
          env.WORKFLOWS_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        env:
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
        with:
          client-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Select trusted keepalive running writer
        id: running_token_writer
        env:
          KEEPALIVE_APP_TOKEN: ${{ steps.running_keepalive_app_token.outputs.token || '' }}
          WORKFLOWS_APP_TOKEN: ${{ steps.running_workflows_app_token.outputs.token || '' }}
          ACTIONS_TOKEN: ${{ secrets.ACTIONS_BOT_PAT || '' }}
          SERVICE_TOKEN: ${{ secrets.SERVICE_BOT_PAT || '' }}
        run: |
          set -euo pipefail
          if [ -n "$KEEPALIVE_APP_TOKEN" ]; then
            echo 'source=KEEPALIVE_APP_TOKEN' >>"$GITHUB_OUTPUT"
          elif [ -n "$WORKFLOWS_APP_TOKEN" ]; then
            echo 'source=WORKFLOWS_APP_TOKEN' >>"$GITHUB_OUTPUT"
          elif [ -n "$ACTIONS_TOKEN" ]; then
            echo 'source=ACTIONS_BOT_PAT' >>"$GITHUB_OUTPUT"
          elif [ -n "$SERVICE_TOKEN" ]; then
            echo 'source=SERVICE_BOT_PAT' >>"$GITHUB_OUTPUT"
          else
            echo 'source=none' >>"$GITHUB_OUTPUT"
          fi

      - name: Probe PAT keepalive running identity
        if: >-
          steps.running_token_writer.outputs.source == 'ACTIONS_BOT_PAT' ||
          steps.running_token_writer.outputs.source == 'SERVICE_BOT_PAT'
        id: running_pat_identity
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: >-
            ${{
              (steps.running_token_writer.outputs.source == 'ACTIONS_BOT_PAT' &&
                secrets.ACTIONS_BOT_PAT) ||
              secrets.SERVICE_BOT_PAT
            }}
          script: |
            const { withRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { data } = await withRetry(() => github.rest.users.getAuthenticated());
            const login = (data?.login || '').trim();
            if (!login) {
              core.setFailed('Unable to determine identity for the mark-running PAT.');
              return;
            }
            core.setOutput('login', login);

      - name: Enforce PAT keepalive running identity
        if: >-
          steps.running_token_writer.outputs.source == 'ACTIONS_BOT_PAT' ||
          steps.running_token_writer.outputs.source == 'SERVICE_BOT_PAT'
        env:
          TOKEN_SOURCE: ${{ steps.running_token_writer.outputs.source }}
          TOKEN_LOGIN: ${{ steps.running_pat_identity.outputs.login || '' }}
        run: |
          set -euo pipefail
          case "$TOKEN_SOURCE:$TOKEN_LOGIN" in
            'ACTIONS_BOT_PAT:stranske'|\
            'ACTIONS_BOT_PAT:stranske-automation-bot'|\
            'SERVICE_BOT_PAT:stranske-automation-bot') ;;
            *)
              echo "::error::$TOKEN_SOURCE has unexpected identity '$TOKEN_LOGIN'."
              exit 1 ;;
          esac

      - name: Require trusted keepalive running writer
        env:
          KEEPALIVE_RUNNING_TOKEN: >-
            ${{
              steps.running_keepalive_app_token.outputs.token ||
              steps.running_workflows_app_token.outputs.token ||
              secrets.ACTIONS_BOT_PAT ||
              secrets.SERVICE_BOT_PAT ||
              ''
            }}
        run: |
          if [ -z "$KEEPALIVE_RUNNING_TOKEN" ]; then
            echo "::error::A keepalive/Workflows App token or an approved PAT is required to mark the agent running."
            exit 1
          fi

      - name: Update summary with running status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          KEEPALIVE_RUNNING_WRITER: >-
            ${{
              steps.running_keepalive_app_token.outputs.token != '' &&
              'stranske-keepalive[bot]' ||
              steps.running_workflows_app_token.outputs.token != '' &&
              'agents-workflows-bot[bot]' ||
              steps.running_pat_identity.outputs.login ||
              ''
            }}
        with:
          github-token: >-
            ${{
              steps.running_keepalive_app_token.outputs.token ||
              steps.running_workflows_app_token.outputs.token ||
              secrets.ACTIONS_BOT_PAT ||
              secrets.SERVICE_BOT_PAT
            }}
          script: |
            const { markAgentRunning } = require('./.github/scripts/keepalive_loop.js');
              const runUrl =
                `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                `/actions/runs/${context.runId}`;
            const inputs = {
              pr_number: '${{ needs.evaluate.outputs.pr_number }}',
              agent_type: '${{ needs.evaluate.outputs.agent_type }}',
              iteration: '${{ needs.evaluate.outputs.iteration }}',
              max_iterations: '${{ needs.evaluate.outputs.max_iterations }}',
              tasks_total: '${{ needs.evaluate.outputs.tasks_total }}',
              tasks_unchecked: '${{ needs.evaluate.outputs.tasks_unchecked }}',
              trace: '${{ needs.evaluate.outputs.trace }}',
              run_url: runUrl,
              trusted_summary_author: process.env.KEEPALIVE_RUNNING_WRITER || '',
            };
            await markAgentRunning({ github, context, core, inputs });

  # Route to appropriate agent based on agent:* label
  # Supports: agent:codex -> CLI Codex, agent:claude -> Claude API
  run-codex:
    name: Keepalive next task (Codex)
    needs:
      - evaluate
      - preflight
      - mark-running
    # Only run for agent:codex label
    if: >-
      needs.evaluate.outputs.agent_type == 'codex' &&
      needs.evaluate.outputs.dispatch_should_run == 'true'
    uses: stranske/Workflows/.github/workflows/reusable-codex-run.yml@main
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      # Use dedicated KEEPALIVE_APP for isolated rate limit pool (5000/hr)
      # Falls back to WORKFLOWS_APP if KEEPALIVE_APP not configured
      WORKFLOWS_APP_ID: >-
        ${{ secrets.KEEPALIVE_APP_ID || secrets.WORKFLOWS_APP_ID }}
      WORKFLOWS_APP_PRIVATE_KEY: >-
        ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY ||
            secrets.WORKFLOWS_APP_PRIVATE_KEY }}
    with:
      skip: >-
        ${{ needs.evaluate.outputs.action != 'run' &&
            needs.evaluate.outputs.action != 'fix' &&
            needs.evaluate.outputs.action != 'conflict' }}
      prompt_file: ${{ needs.evaluate.outputs.prompt_file }}
      mode: keepalive
      pr_number: ${{ needs.evaluate.outputs.pr_number }}
      pr_ref: ${{ needs.evaluate.outputs.pr_ref }}
      appendix: ${{ needs.evaluate.outputs.task_appendix }}
      iteration: ${{ needs.evaluate.outputs.iteration }}

  run-claude:
    name: Keepalive next task (Claude)
    needs:
      - evaluate
      - preflight
      - mark-running
    if: |
      needs.evaluate.outputs.agent_type == 'claude' &&
      needs.evaluate.outputs.dispatch_should_run == 'true' &&
      (needs.evaluate.outputs.action == 'run' ||
       needs.evaluate.outputs.action == 'fix' ||
       needs.evaluate.outputs.action == 'conflict')
    uses: stranske/Workflows/.github/workflows/reusable-claude-run.yml@main
    secrets: inherit
    with:
      skip: >-
        ${{ needs.evaluate.outputs.action != 'run' &&
            needs.evaluate.outputs.action != 'fix' &&
            needs.evaluate.outputs.action != 'conflict' }}
      prompt_file: ${{ needs.evaluate.outputs.prompt_file }}
      mode: keepalive
      pr_number: ${{ needs.evaluate.outputs.pr_number }}
      pr_ref: ${{ needs.evaluate.outputs.pr_ref }}
      appendix: ${{ needs.evaluate.outputs.task_appendix }}
      iteration: ${{ needs.evaluate.outputs.iteration }}

  run-cursor:
    name: Keepalive next task (Cursor)
    needs:
      - evaluate
      - preflight
      - mark-running
    if: |
      needs.evaluate.outputs.agent_type == 'cursor' &&
      needs.evaluate.outputs.dispatch_should_run == 'true' &&
      (needs.evaluate.outputs.action == 'run' ||
       needs.evaluate.outputs.action == 'fix' ||
       needs.evaluate.outputs.action == 'conflict')
    uses: stranske/Workflows/.github/workflows/reusable-cursor-run.yml@main
    secrets:
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      WORKFLOWS_APP_ID: >-
        ${{ secrets.KEEPALIVE_APP_ID || secrets.WORKFLOWS_APP_ID }}
      WORKFLOWS_APP_PRIVATE_KEY: >-
        ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY ||
            secrets.WORKFLOWS_APP_PRIVATE_KEY }}
    with:
      skip: >-
        ${{ needs.evaluate.outputs.action != 'run' &&
            needs.evaluate.outputs.action != 'fix' &&
            needs.evaluate.outputs.action != 'conflict' }}
      prompt_file: ${{ needs.evaluate.outputs.prompt_file }}
      mode: keepalive
      pr_number: ${{ needs.evaluate.outputs.pr_number }}
      pr_ref: ${{ needs.evaluate.outputs.pr_ref }}
      appendix: ${{ needs.evaluate.outputs.task_appendix }}
      iteration: ${{ needs.evaluate.outputs.iteration }}

  run-gemini:
    name: Keepalive next task (Gemini)
    needs:
      - evaluate
      - preflight
      - mark-running
    if: |
      needs.evaluate.outputs.agent_type == 'gemini' &&
      needs.evaluate.outputs.dispatch_should_run == 'true' &&
      (needs.evaluate.outputs.action == 'run' ||
       needs.evaluate.outputs.action == 'fix' ||
       needs.evaluate.outputs.action == 'conflict')
    uses: stranske/Workflows/.github/workflows/reusable-gemini-run.yml@main
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      WORKFLOWS_APP_ID: >-
        ${{ secrets.KEEPALIVE_APP_ID || secrets.WORKFLOWS_APP_ID }}
      WORKFLOWS_APP_PRIVATE_KEY: >-
        ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY ||
            secrets.WORKFLOWS_APP_PRIVATE_KEY }}
    with:
      skip: >-
        ${{ needs.evaluate.outputs.action != 'run' &&
            needs.evaluate.outputs.action != 'fix' &&
            needs.evaluate.outputs.action != 'conflict' }}
      prompt_file: ${{ needs.evaluate.outputs.prompt_file }}
      mode: keepalive
      pr_number: ${{ needs.evaluate.outputs.pr_number }}
      pr_ref: ${{ needs.evaluate.outputs.pr_ref }}
      appendix: ${{ needs.evaluate.outputs.task_appendix }}
      iteration: ${{ needs.evaluate.outputs.iteration }}

  record-keepalive-completion:
    name: Record keepalive dispatch completion
    needs:
      - evaluate
      - run-codex
      - run-claude
      - run-cursor
      - run-gemini
    if: >-
      always() &&
      needs.evaluate.outputs.dispatch_should_run == 'true' &&
      (needs.run-codex.result != 'skipped' || needs.run-claude.result != 'skipped' ||
       needs.run-cursor.result != 'skipped' || needs.run-gemini.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner library
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            scripts/runner_lib
            scripts/state_fingerprint.py
            scripts/reference_packs.py
          sparse-checkout-cone-mode: false

      - name: Record completion
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROVIDER: ${{ needs.evaluate.outputs.agent_type || 'codex' }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
          HEAD_SHA: ${{ needs.evaluate.outputs.head_sha }}
          SUMMARY: >-
            ${{ needs.run-codex.outputs.final-message-summary ||
                needs.run-claude.outputs.final-message-summary ||
                needs.run-cursor.outputs.final-message-summary ||
                needs.run-gemini.outputs.final-message-summary || '' }}
          EXIT_CODE: >-
            ${{ needs.run-codex.outputs.exit-code ||
                needs.run-claude.outputs.exit-code ||
                needs.run-cursor.outputs.exit-code ||
                needs.run-gemini.outputs.exit-code || '' }}
          JOB_RESULT: >-
            ${{ needs.run-codex.result != 'skipped' && needs.run-codex.result ||
                (needs.run-claude.result != 'skipped' && needs.run-claude.result ||
                 (needs.run-cursor.result != 'skipped' && needs.run-cursor.result ||
                  needs.run-gemini.result)) }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "Runner completion state missing PR or SHA; skipping."
            exit 0
          fi
          if [ -z "${EXIT_CODE:-}" ]; then
            if [ "${JOB_RESULT:-}" = "success" ]; then
              EXIT_CODE=0
            else
              EXIT_CODE=1
            fi
          fi
          python -m scripts.runner_lib record-completion \
            --provider "$PROVIDER" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --summary "$SUMMARY" \
            --exit-code "$EXIT_CODE" \
            --storage auto

  summary:
    name: Update keepalive summary
    needs:
      - evaluate
      - preflight
      - run-codex
      - run-claude
      - run-cursor
      - run-gemini
    # Run always if PR exists, handle skipped agent jobs gracefully
    if: |
      always() &&
      needs.evaluate.outputs.pr_number != '' &&
      needs.evaluate.outputs.pr_number != '0'
    runs-on: ubuntu-latest
    environment: agent-standard
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}
          github_token: ${{ github.token }}

      - name: Emit keepalive metrics
        id: keepalive-metrics
        env:
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
          ACTION: ${{ needs.evaluate.outputs.action }}
          REASON: ${{ needs.evaluate.outputs.reason }}
          GATE_CONCLUSION: ${{ needs.evaluate.outputs.gate_conclusion }}
          ITERATION: ${{ needs.evaluate.outputs.iteration }}
          MAX_ITERATIONS: ${{ needs.evaluate.outputs.max_iterations }}
          TASKS_TOTAL: ${{ needs.evaluate.outputs.tasks_total }}
          TASKS_UNCHECKED: ${{ needs.evaluate.outputs.tasks_unchecked }}
          START_TS: ${{ needs.evaluate.outputs.start_ts }}
        run: |
          set -euo pipefail

          now=$(date -u +%s)
          if [[ "${START_TS:-}" =~ ^[0-9]+$ ]]; then
            duration=$(( now - START_TS ))
            if [ "$duration" -lt 0 ]; then duration=0; fi
          else
            duration=0
          fi

          tasks_total=${TASKS_TOTAL:-0}
          tasks_unchecked=${TASKS_UNCHECKED:-0}
          if ! [[ "$tasks_total" =~ ^-?[0-9]+$ ]]; then tasks_total=0; fi
          if ! [[ "$tasks_unchecked" =~ ^-?[0-9]+$ ]]; then tasks_unchecked=0; fi
          tasks_completed=$(( tasks_total - tasks_unchecked ))
          if [ "$tasks_completed" -lt 0 ]; then tasks_completed=0; fi

          metrics_json=$(jq -cn \
            --arg pr "${PR_NUMBER:-0}" \
            --arg iteration "${ITERATION:-0}" \
            --arg action "${ACTION:-}" \
            --arg stop_reason "${REASON:-}" \
            --arg gate_conclusion "${GATE_CONCLUSION:-}" \
            --arg tasks_total "$tasks_total" \
            --arg tasks_completed "$tasks_completed" \
            --arg duration "$duration" \
            '{
              pr_number: ($pr | tonumber? // 0),
              iteration_count: ($iteration | tonumber? // 0),
              action: $action,
              stop_reason: $stop_reason,
              gate_conclusion: $gate_conclusion,
              tasks_total: ($tasks_total | tonumber? // 0),
              tasks_completed: ($tasks_completed | tonumber? // 0),
              duration_seconds: ($duration | tonumber? // 0)
            }')

          {
            echo '### Keepalive metrics'
            echo ''
            echo '| Field | Value |'
            echo '| --- | --- |'
            echo "| pr_number | $(echo "$metrics_json" | jq -r '.pr_number') |"
            echo "| iteration_count | $(echo "$metrics_json" | jq -r '.iteration_count') |"
            echo "| action | $(echo "$metrics_json" | jq -r '.action') |"
            echo "| stop_reason | $(echo "$metrics_json" | jq -r '.stop_reason') |"
            echo "| gate_conclusion | $(echo "$metrics_json" | jq -r '.gate_conclusion') |"
            echo "| tasks_total | $(echo "$metrics_json" | jq -r '.tasks_total') |"
            echo "| tasks_completed | $(echo "$metrics_json" | jq -r '.tasks_completed') |"
            echo "| duration_seconds | $(echo "$metrics_json" | jq -r '.duration_seconds') |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "$metrics_json" >> keepalive-metrics.ndjson

      - name: Upload keepalive metrics artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: keepalive-metrics
          path: keepalive-metrics.ndjson
          retention-days: 30
          if-no-files-found: error

      - name: Auto-reconcile task checkboxes
        if: |
          needs.run-codex.outputs.changes-made == 'true' ||
          needs.run-claude.outputs.changes-made == 'true' ||
          needs.run-cursor.outputs.changes-made == 'true' ||
          needs.run-gemini.outputs.changes-made == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          LLM_COMPLETED_TASKS: >-
            ${{
              needs.run-codex.outputs.llm-completed-tasks ||
              needs.run-claude.outputs.llm-completed-tasks ||
              needs.run-cursor.outputs.llm-completed-tasks ||
              needs.run-gemini.outputs.llm-completed-tasks ||
              '[]'
            }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { autoReconcileTasks } = require('./.github/scripts/keepalive_loop.js');

            const prNumber = Number('${{ needs.evaluate.outputs.pr_number }}') || 0;
            const beforeSha = '${{ needs.evaluate.outputs.head_sha }}';  // SHA before agent ran
            const headSha =
              '${{ needs.run-codex.outputs.commit-sha }}' ||
              '${{ needs.run-claude.outputs.commit-sha }}' ||
              '${{ needs.run-cursor.outputs.commit-sha }}' ||
              '${{ needs.run-gemini.outputs.commit-sha }}';

            // LLM analysis metadata
            const llmProvider =
              '${{ needs.run-codex.outputs.llm-provider }}' ||
              '${{ needs.run-claude.outputs.llm-provider }}' ||
              '${{ needs.run-cursor.outputs.llm-provider }}' ||
              '${{ needs.run-gemini.outputs.llm-provider }}' ||
              '';
            const llmConfidence =
              '${{ needs.run-codex.outputs.llm-confidence }}' ||
              '${{ needs.run-claude.outputs.llm-confidence }}' ||
              '${{ needs.run-cursor.outputs.llm-confidence }}' ||
              '${{ needs.run-gemini.outputs.llm-confidence }}' ||
              '';
            const llmAnalysisRun =
              '${{ needs.run-codex.outputs.llm-analysis-run }}' === 'true' ||
              '${{ needs.run-claude.outputs.llm-analysis-run }}' === 'true' ||
              '${{ needs.run-cursor.outputs.llm-analysis-run }}' === 'true' ||
              '${{ needs.run-gemini.outputs.llm-analysis-run }}' === 'true';

              // Parse LLM completed tasks if available
              // Use env var to avoid JS string escaping issues
            let llmCompletedTasks = [];
            const llmTasksJson = process.env.LLM_COMPLETED_TASKS || '[]';
            try {
              llmCompletedTasks = JSON.parse(llmTasksJson);
              if (llmCompletedTasks.length > 0) {
                core.info(`LLM analysis found ${llmCompletedTasks.length} completed task(s)`);
                if (llmProvider) {
                  core.info(`LLM provider: ${llmProvider} (confidence: ${llmConfidence})`);
                }
              }
            } catch (e) {
              core.debug(`Failed to parse LLM tasks: ${e.message}`);
            }

            if (!prNumber || !beforeSha || !headSha) {
              core.info('Missing required inputs for task reconciliation');
              return;
            }

            core.info(`Auto-reconciling tasks for PR #${prNumber}`);
            core.info(`Comparing ${beforeSha.slice(0, 7)} → ${headSha.slice(0, 7)}`);

            const result = await autoReconcileTasks({
              github, context, prNumber, baseSha: beforeSha, headSha, llmCompletedTasks, core
            });

            if (result.updated) {
              core.info(`✅ ${result.details}`);
              core.notice(`Auto-checked ${result.tasksChecked} task(s) based on analysis`);
            } else {
              core.info(`ℹ️ ${result.details}`);
            }

            // Output for step summary and downstream reporting
            core.setOutput('tasks_checked', result.tasksChecked);
            core.setOutput('reconciliation_details', result.details);
            core.setOutput('llm_provider', llmProvider);
            core.setOutput('llm_confidence', llmConfidence);
            core.setOutput('llm_analysis_run', llmAnalysisRun);
            core.setOutput('llm_tasks_count', llmCompletedTasks.length);
            core.setOutput('commit_tasks_count', result.sources?.commit || 0);

      - name: Mint KEEPALIVE_APP summary token
        id: summary_keepalive_app_token
        if: ${{ env.KEEPALIVE_APP_ID != '' && env.KEEPALIVE_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        continue-on-error: true
        env:
          KEEPALIVE_APP_ID: ${{ secrets.KEEPALIVE_APP_ID || '' }}
          KEEPALIVE_APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY || '' }}
        with:
          client-id: ${{ env.KEEPALIVE_APP_ID }}
          private-key: ${{ env.KEEPALIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Mint WORKFLOWS_APP summary token
        id: summary_workflows_app_token
        if: |
          steps.summary_keepalive_app_token.outputs.token == '' &&
          env.WORKFLOWS_APP_ID != '' &&
          env.WORKFLOWS_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        env:
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
        with:
          client-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Require trusted keepalive summary writer
        env:
          KEEPALIVE_SUMMARY_TOKEN: >-
            ${{
              steps.summary_keepalive_app_token.outputs.token ||
              steps.summary_workflows_app_token.outputs.token ||
              ''
            }}
        run: |
          if [ -z "$KEEPALIVE_SUMMARY_TOKEN" ]; then
            echo "::error::A dedicated keepalive or Workflows App token is required to persist trusted keepalive state."
            exit 1
          fi

      - name: Update summary comment
        id: update-summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          AGENT_SUMMARY: >-
            ${{
              needs.run-codex.outputs.final-message-summary ||
              needs.run-claude.outputs.final-message-summary ||
              needs.run-cursor.outputs.final-message-summary ||
              needs.run-gemini.outputs.final-message-summary ||
              needs.run-codex.outputs.error-summary ||
              needs.run-claude.outputs.error-summary ||
              needs.run-cursor.outputs.error-summary ||
              needs.run-gemini.outputs.error-summary ||
              needs.preflight.outputs.failure_summary ||
              ''
            }}
          PREFLIGHT_FAILURE_SUMMARY: ${{ needs.preflight.outputs.failure_summary || '' }}
          DELEGATION_SOURCE: ${{ needs.evaluate.outputs.delegation_source }}
          FORCE_RETRY: ${{ github.event.inputs.force_retry || 'false' }}
          AUTHORITY_CHALLENGE_FINGERPRINT: >-
            ${{ github.event_name == 'workflow_dispatch' &&
              github.actor == 'github-actions[bot]' &&
              github.event.inputs.sweep_recheck == 'true' &&
              github.event.inputs.authority_challenge_fingerprint || '' }}
          AUTHORITY_CHALLENGE_CLAIM: >-
            ${{ github.event_name == 'workflow_dispatch' &&
              github.actor == 'github-actions[bot]' &&
              github.event.inputs.sweep_recheck == 'true' &&
              github.event.inputs.authority_challenge_claim || '' }}
          AUTHORITY_CHALLENGE_SIGNING_KEY: >-
            ${{ secrets.KEEPALIVE_AUTHORITY_SIGNING_KEY || '' }}
          KEEPALIVE_SUMMARY_WRITER: >-
            ${{
              steps.summary_keepalive_app_token.outputs.token != '' &&
              'stranske-keepalive[bot]' ||
              'agents-workflows-bot[bot]'
            }}
        with:
          github-token: >-
            ${{
              steps.summary_keepalive_app_token.outputs.token ||
              steps.summary_workflows_app_token.outputs.token
            }}
          script: |
            const { updateKeepaliveLoopSummary } =
              require('./.github/scripts/keepalive_loop.js');

            const claudeResult = '${{ needs.run-claude.result }}';
            const codexResult = '${{ needs.run-codex.result }}';
            const cursorResult = '${{ needs.run-cursor.result }}';
            const geminiResult = '${{ needs.run-gemini.result }}';
            const runnerResult = claudeResult && claudeResult !== 'skipped' ? claudeResult :
              (cursorResult && cursorResult !== 'skipped' ? cursorResult :
                (geminiResult && geminiResult !== 'skipped' ? geminiResult : codexResult));
            const preflightFailureSummary = process.env.PREFLIGHT_FAILURE_SUMMARY || '';
            const allRunnersSkipped = [claudeResult, codexResult, cursorResult, geminiResult]
              .every((result) => !result || result === 'skipped');
            const agentExecutionStarted = [
              '${{ needs.run-codex.outputs.agent-execution-started }}',
              '${{ needs.run-claude.outputs.agent-execution-started }}',
              '${{ needs.run-cursor.outputs.agent-execution-started }}',
              '${{ needs.run-gemini.outputs.agent-execution-started }}',
            ].some((value) => value === 'true');
            const runResult = preflightFailureSummary && allRunnersSkipped
              ? 'failure'
              : runnerResult;

            const agentExitCode =
              '${{ needs.run-codex.outputs.exit-code }}' ||
              '${{ needs.run-claude.outputs.exit-code }}' ||
              '${{ needs.run-cursor.outputs.exit-code }}' ||
              '${{ needs.run-gemini.outputs.exit-code }}';
            const agentChangesMade =
              '${{ needs.run-codex.outputs.changes-made }}' ||
              '${{ needs.run-claude.outputs.changes-made }}' ||
              '${{ needs.run-cursor.outputs.changes-made }}' ||
              '${{ needs.run-gemini.outputs.changes-made }}';
            const agentCommitSha =
              '${{ needs.run-codex.outputs.commit-sha }}' ||
              '${{ needs.run-claude.outputs.commit-sha }}' ||
              '${{ needs.run-cursor.outputs.commit-sha }}' ||
              '${{ needs.run-gemini.outputs.commit-sha }}';
            const agentFilesChanged =
              '${{ needs.run-codex.outputs.files-changed }}' ||
              '${{ needs.run-claude.outputs.files-changed }}' ||
              '${{ needs.run-cursor.outputs.files-changed }}' ||
              '${{ needs.run-gemini.outputs.files-changed }}';

            const llmProvider =
              '${{ needs.run-codex.outputs.llm-provider }}' ||
              '${{ needs.run-claude.outputs.llm-provider }}' ||
              '${{ needs.run-cursor.outputs.llm-provider }}' ||
              '${{ needs.run-gemini.outputs.llm-provider }}' ||
              '';
            const llmConfidence =
              '${{ needs.run-codex.outputs.llm-confidence }}' ||
              '${{ needs.run-claude.outputs.llm-confidence }}' ||
              '${{ needs.run-cursor.outputs.llm-confidence }}' ||
              '${{ needs.run-gemini.outputs.llm-confidence }}' ||
              '';
            const llmAnalysisRun =
              '${{ needs.run-codex.outputs.llm-analysis-run }}' === 'true' ||
              '${{ needs.run-claude.outputs.llm-analysis-run }}' === 'true' ||
              '${{ needs.run-cursor.outputs.llm-analysis-run }}' === 'true' ||
              '${{ needs.run-gemini.outputs.llm-analysis-run }}' === 'true';

            const inputs = {
              pr_number: Number('${{ needs.evaluate.outputs.pr_number }}') || 0,
              action: '${{ needs.evaluate.outputs.action }}',
              reason: '${{ needs.evaluate.outputs.reason }}',
              gate_conclusion: '${{ needs.evaluate.outputs.gate_conclusion }}',
              iteration: Number('${{ needs.evaluate.outputs.iteration }}') || 0,
              max_iterations: Number('${{ needs.evaluate.outputs.max_iterations }}') || 0,
              failure_threshold: Number('${{ needs.evaluate.outputs.failure_threshold }}') || 3,
              tasks_total: Number('${{ needs.evaluate.outputs.tasks_total }}') || 0,
              tasks_unchecked: Number('${{ needs.evaluate.outputs.tasks_unchecked }}') || 0,
              keepalive_enabled: '${{ needs.evaluate.outputs.keepalive_enabled }}',
              autofix_enabled: '${{ needs.evaluate.outputs.autofix_enabled }}',
              agent_type: '${{ needs.evaluate.outputs.agent_type }}',
              trace: '${{ needs.evaluate.outputs.trace }}',
              // Delegation policy outputs (agent:auto mode)
              delegation_reason: '${{ needs.evaluate.outputs.delegation_reason }}',
              delegation_should_switch: '${{ needs.evaluate.outputs.delegation_should_switch }}',
              delegation_source: process.env.DELEGATION_SOURCE || '',
              agent_routing_mode: '${{ needs.evaluate.outputs.agent_routing_mode }}',
              // Agent run result - check which agent ran
              run_result: runResult,
              agent_execution_started: agentExecutionStarted,
              // Agent output details (merged from whichever agent ran)
              agent_exit_code: agentExitCode,
              agent_changes_made: agentChangesMade,
              agent_commit_sha: agentCommitSha,
              agent_files_changed: agentFilesChanged,
              agent_summary: process.env.AGENT_SUMMARY || '',
              // LLM analysis details for task completion reporting
              llm_provider: llmProvider,
              llm_confidence: llmConfidence,
              llm_analysis_run: llmAnalysisRun,
              force_retry: process.env.FORCE_RETRY === 'true',
              authority_challenge_fingerprint:
                process.env.AUTHORITY_CHALLENGE_FINGERPRINT || '',
              authority_challenge_claim:
                process.env.AUTHORITY_CHALLENGE_CLAIM || '',
              authority_challenge_signing_key:
                process.env.AUTHORITY_CHALLENGE_SIGNING_KEY || '',
              trusted_summary_author: process.env.KEEPALIVE_SUMMARY_WRITER || '',
              retry_workflow_id: 'agents-81-gate-followups.yml',
            };
            await updateKeepaliveLoopSummary({ github, context, core, inputs });

      - name: Persist state fingerprint
        if: >-
          needs.evaluate.outputs.fingerprint_should_run == 'true' &&
          needs.evaluate.outputs.fingerprint_current_hash != '' &&
          needs.evaluate.outputs.pr_number != '' &&
          steps.update-summary.outcome == 'success' &&
          (
            (
              needs.evaluate.outputs.action != 'run' &&
              needs.evaluate.outputs.action != 'fix' &&
              needs.evaluate.outputs.action != 'conflict'
            ) ||
            (
              needs.preflight.result == 'success' &&
              (needs.run-codex.result == 'success' || needs.run-codex.result == 'skipped') &&
              (needs.run-claude.result == 'success' || needs.run-claude.result == 'skipped') &&
              (needs.run-cursor.result == 'success' || needs.run-cursor.result == 'skipped') &&
              (needs.run-gemini.result == 'success' || needs.run-gemini.result == 'skipped')
            )
          )
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.evaluate.outputs.pr_number }}
        run: |
          python scripts/state_fingerprint.py store \
            --workflow "${GITHUB_WORKFLOW}" \
            --hash "${{ needs.evaluate.outputs.fingerprint_current_hash }}" \
            --storage pr-comment

  prepare:
    name: Prepare autofix context
    if: >-
      ${{
        vars.USE_CONSOLIDATED_WORKFLOWS == 'true' &&
        (github.event_name != 'pull_request_target' || github.event.action != 'synchronize')
      }}
    runs-on: ubuntu-latest
    environment: agent-standard
    outputs:
      should_run: ${{ steps.evaluate.outputs.should_run }}
      pr_number: ${{ steps.evaluate.outputs.pr_number }}
      head_ref: ${{ steps.evaluate.outputs.head_ref }}
      head_sha: ${{ steps.evaluate.outputs.head_sha }}
      appendix: ${{ steps.evaluate.outputs.appendix }}
      stop_reason: ${{ steps.evaluate.outputs.stop_reason }}
      attempts: ${{ steps.evaluate.outputs.attempts }}
      max_attempts: ${{ steps.evaluate.outputs.max_attempts }}
      trigger_reason: ${{ steps.evaluate.outputs.trigger_reason }}
      trigger_job: ${{ steps.evaluate.outputs.trigger_job }}
      trigger_step: ${{ steps.evaluate.outputs.trigger_step }}
      agent_type: ${{ steps.evaluate.outputs.agent_type }}
      has_high_privilege: ${{ steps.evaluate.outputs.has_high_privilege }}
      gate_conclusion: ${{ steps.evaluate.outputs.gate_conclusion }}
      gate_run_id: ${{ steps.evaluate.outputs.gate_run_id }}
      security_blocked: ${{ steps.security_gate.outputs.blocked }}
      security_reason: ${{ steps.security_gate.outputs.reason }}
      dispatch_should_run: ${{ steps.runner_dispatch.outputs.should_dispatch || 'true' }}
      dispatch_reason: ${{ steps.runner_dispatch.outputs.reason }}
    steps:
      - name: Checkout (for security gate + agent registry)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/prompt_injection_guard.js
            .github/scripts/github-rate-limited-wrapper.js
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
            scripts/runner_lib
            scripts/state_fingerprint.py
            scripts/reference_packs.py
            .github/scripts/agent_registry.js
            .github/agents/registry.yml
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}
          github_token: ${{ github.token }}

      - name: Security gate - prompt injection guard
        id: security_gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.WRITE_TOKEN }}
          script: |
            const fs = require('fs');
            const retryPath = './.github/scripts/github-api-with-retry.js';
            const { createTokenAwareRetry } = fs.existsSync(retryPath)
              ? require(retryPath)
              : { createTokenAwareRetry: async () => ({ withRetry: (fn) => fn(github) }) };
            const { withRetry } = await createTokenAwareRetry({ github, core });

            const guardPath = './.github/scripts/prompt_injection_guard.js';

            // Check if guard exists (may not exist on older branches)
            if (!fs.existsSync(guardPath)) {
              core.info('Prompt injection guard not found, skipping security check.');
              core.setOutput('blocked', 'false');
              core.setOutput('reason', 'guard-not-found');
              return;
            }

            const { evaluatePromptInjectionGuard } = require(guardPath);

            const run = context.payload.workflow_run;
            if (!run) {
              core.setOutput('blocked', 'false');
              core.setOutput('reason', 'no-workflow-run');
              return;
            }

            const prInfo = Array.isArray(run.pull_requests) ? run.pull_requests[0] : undefined;
            if (!prInfo?.number) {
              core.setOutput('blocked', 'false');
              core.setOutput('reason', 'no-pr-context');
              return;
            }

            const { data: pr } = await withRetry((client) => client.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prInfo.number,
            }));

            const result = await evaluatePromptInjectionGuard({
              github,
              context,
              pr,
              actor: run.actor?.login || context.actor,
              promptContent: pr.body || '',
              core,
            });

            core.setOutput('blocked', String(result.blocked));
            core.setOutput('reason', result.reason);

            if (result.blocked) {
              core.setFailed(`Security gate blocked: ${result.reason}`);
            }

      - name: Evaluate workflow_run
        id: evaluate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.WRITE_TOKEN }}
          script: |
            const fs = require('fs');
            const retryPath = './.github/scripts/github-api-with-retry.js';
            const { createTokenAwareRetry } = fs.existsSync(retryPath)
              ? require(retryPath)
              : { createTokenAwareRetry: async () => ({ withRetry: (fn) => fn(github) }) };
            const { withRetry, paginateWithRetry } = await createTokenAwareRetry({ github, core });

            const run = context.payload.workflow_run;
            const outputs = {
              should_run: 'false',
              pr_number: '',
              head_ref: '',
              head_sha: '',
              appendix: '',
              agent_type: '',
              has_high_privilege: 'false',
              stop_reason: '',
              attempts: '0',
              max_attempts: '3',
              trigger_reason: 'unknown',
              trigger_job: '',
              trigger_step: '',
              gate_conclusion: String(run?.conclusion || run?.status || ''),
              gate_run_id: String(run?.id || ''),
            };

            const stop = (reason, stopReason = '') => {
              core.info(`Autofix loop skipped: ${reason}.`);
              outputs.stop_reason = stopReason || reason;
              for (const [key, value] of Object.entries(outputs)) {
                core.setOutput(key, value);
              }
            };

            if (!run) {
              return stop('missing workflow_run payload');
            }

            if ((run.conclusion || '').toLowerCase() === 'success') {
              return stop('upstream Gate succeeded');
            }

            if ((run.event || '').toLowerCase() !== 'pull_request') {
              return stop(`unsupported event type: ${run.event || 'unknown'}`);
            }

            const prInfo = Array.isArray(run.pull_requests) ? run.pull_requests[0] : undefined;
            if (!prInfo?.number) {
              return stop('no pull request context on workflow_run');
            }

            outputs.pr_number = String(prInfo.number);

            const { owner, repo } = context.repo;
            const prNumber = Number(prInfo.number);
            const pr = await withRetry((client) =>
              client.rest.pulls.get({ owner, repo, pull_number: prNumber })
            );
            const prData = pr.data;

            if (!prData || prData.state !== 'open') {
              return stop('pull request is not open');
            }

            if (prData.draft) {
              return stop('draft pull request');
            }

            const headSha = prData.head?.sha;
            if (!headSha || headSha !== run.head_sha) {
              return stop('head SHA drifted since Gate started');
            }

            const sameRepo = prData.head?.repo?.full_name === `${owner}/${repo}`;
            if (!sameRepo) {
              return stop('head repository mismatch (likely fork)');
            }

            const headRef = String(prData.head?.ref || '');
            if (headRef.startsWith('sync/workflows-')) {
              return stop(
                'generated sync PR is Maint 71-owned; ' +
                  'intentional delivery holds are not autofix work',
                'generated_sync_pr',
              );
            }

            const labels = Array.isArray(prData.labels)
              ? prData.labels
                  .map((label) => (label?.name || '').toLowerCase())
                  .filter(Boolean)
              : [];
            const nonRoutingAgentLabels = new Set([
              'agent:rate-limited',
              'agent:needs-attention',
              'agent:retry',
            ]);
            const hasAgentLabel = labels.some(
              l => l.startsWith('agent:') && !nonRoutingAgentLabels.has(l)
            );
            const routingLabelObjects = Array.isArray(prData.labels)
              ? prData.labels.filter((label) => {
                  const normalized = (label?.name || '').toLowerCase();
                  if (!normalized.startsWith('agent:')) {
                    return true;
                  }
                  return !nonRoutingAgentLabels.has(normalized);
                })
              : [];

            // Resolve agent type from PR labels (for routing autofix to correct runner)
            try {
              const { resolveAgentFromLabels } = require('./.github/scripts/agent_registry.js');
              outputs.agent_type = resolveAgentFromLabels(routingLabelObjects, {
                registryPath: './.github/agents/registry.yml',
              });
            } catch (err) {
              core.warning(`Failed to resolve agent type: ${err.message}; defaulting to codex`);
              outputs.agent_type = 'codex';
            }

            outputs.has_high_privilege = String(labels.includes('agent-high-privilege'));

            const body = prData.body || '';
            const configMatch = body.match(/autofix\s*:\s*(true|false)/i);
            let autofixEnabled = configMatch
              ? configMatch[1].toLowerCase() === 'true'
              : hasAgentLabel;

            // Auto-escalation: Escalate to agent CLI when Gate fails
            // Triggers if: (1) basic autofix ran but insufficient, OR (2) no basic autofix applied
            // Note: We do NOT add agent:* label here because that triggers external agent UI
            // which would conflict with our internal agent CLI run. Only add autofix:escalated.
            if (!autofixEnabled && !configMatch) {
                const hasAutofixLabel =
                  labels.includes('autofix:applied') || labels.includes('autofix');
              const hasEscalatedLabel = labels.includes('autofix:escalated');
              const gateConclusion = (run.conclusion || '').toLowerCase();
              const gateFailed = gateConclusion === 'failure';

              // Escalate if Gate failed and we haven't already escalated
              if (gateFailed && !hasEscalatedLabel) {
                const reason = hasAutofixLabel
                  ? 'Basic autofix ran but Gate still failing'
                  : 'No basic autofix (non-Python PR?) and Gate failing';
                core.info(`🔄 Auto-escalation: ${reason}. Escalating to agent CLI...`);
                try {
                  await withRetry((client) => client.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: prNumber,
                    labels: ['autofix:escalated'],
                  }));
                    core.info(
                      '✅ Added autofix:escalated label - agent CLI will run in this workflow'
                    );
                  autofixEnabled = true;
                } catch (error) {
                  core.warning(`Failed to add escalation labels: ${error.message}`);
                }
              }
            }
            if (!autofixEnabled) {
              return stop('autofix disabled for this pull request');
            }

            const jobs = await paginateWithRetry(github.rest.actions.listJobsForWorkflowRun, {
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
            });

            const workflowFile = 'agents-81-gate-followups.yml';
            // Reduce attempts for auto-escalated PRs (they weren't agent-initiated)
            const isEscalated = labels.includes('autofix:escalated');
              const maxAttempts = isEscalated
                ? Math.min(2, Number(outputs.max_attempts))
                : Number(outputs.max_attempts);
            const previousRuns = await paginateWithRetry(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: workflowFile,
              head_sha: run.head_sha,
              per_page: 100,
              status: 'completed',
            });

            const attemptCount = previousRuns.length + 1;
            outputs.attempts = String(attemptCount);
            outputs.max_attempts = String(maxAttempts);

            const failingJobs = [];
            let triggerJob = null;
            let triggerStep = null;
            for (const job of jobs) {
              const conclusion = (job.conclusion || job.status || '').toLowerCase();
              if (!conclusion || ['success', 'skipped'].includes(conclusion)) {
                continue;
              }

              const failingSteps =
                Array.isArray(job.steps)
                  ? job.steps
                      .filter((step) => {
                        const stepConclusion = (step.conclusion || step.status || '').toLowerCase();
                        return stepConclusion && !['success', 'skipped'].includes(stepConclusion);
                      })
                        .map((step) =>
                          `${step.name} (${step.conclusion || step.status || 'unknown'})`
                        )
                  : [];

              const detailLines = [`- ${job.name} (${job.conclusion || job.status || 'unknown'})`];
              if (failingSteps.length > 0) {
                detailLines.push(`  - steps: ${failingSteps.join('; ')}`);
              }
              failingJobs.push(detailLines.join('\n'));

              if (!triggerJob) {
                triggerJob = job;
                const failingStep = Array.isArray(job.steps)
                  ? job.steps.find((step) => {
                      const stepConclusion = (step.conclusion || step.status || '').toLowerCase();
                      return stepConclusion && !['success', 'skipped'].includes(stepConclusion);
                    })
                  : null;
                triggerStep = failingStep || null;
              }
            }

            const inferTriggerReason = (job, step) => {
              const text = [job?.name, step?.name]
                .filter(Boolean)
                .map((value) => String(value).toLowerCase())
                .join(' ');

              if (!text) return 'unknown';
              if (text.includes('mypy')) return 'mypy';
                if (
                  text.includes('lint') ||
                  text.includes('flake8') ||
                  text.includes('ruff')
                ) {
                  return 'lint';
                }
              if (text.includes('pytest') || text.includes('test')) return 'pytest';
              return 'unknown';
            };

            outputs.trigger_reason = inferTriggerReason(triggerJob, triggerStep);
            outputs.trigger_job = triggerJob?.name || triggerJob?.id || '';
            outputs.trigger_step = triggerStep?.name || '';

            const appendixLines = [
              `Gate run: ${run.html_url || run.id}`,
              `Conclusion: ${run.conclusion || run.status || 'unknown'}`,
              `PR: #${prNumber}`,
              `Head SHA: ${headSha}`,
              `Autofix attempts for this head: ${attemptCount} / ${maxAttempts}`,
              'Fix scope: src/, tests/, tools/, scripts/, agents/, templates/, .github/',
            ];

            if (failingJobs.length > 0) {
              appendixLines.push('Failing jobs:', ...failingJobs);
            } else {
              appendixLines.push('Failing jobs: none reported.');
            }

            outputs.appendix = appendixLines.join('\n');

            if (attemptCount > maxAttempts) {
                return stop(
                  `autofix attempt limit reached (${attemptCount} > ${maxAttempts})`,
                  'max_attempts'
                );
            }

            outputs.should_run = 'true';
            outputs.head_ref = prData.head.ref || '';
            outputs.head_sha = headSha;

            for (const [key, value] of Object.entries(outputs)) {
              core.setOutput(key, value);
            }

      - name: Check runner dispatch debounce
        id: runner_dispatch
        if: steps.evaluate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ env.WRITE_TOKEN }}
          GITHUB_TOKEN: ${{ env.WRITE_TOKEN }}
          PR_NUMBER: ${{ steps.evaluate.outputs.pr_number }}
          HEAD_SHA: ${{ steps.evaluate.outputs.head_sha }}
          PROVIDER: ${{ steps.evaluate.outputs.agent_type || 'codex' }}
        run: |
          set -euo pipefail
          if [ -z "${PR_NUMBER:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            {
              echo "should_dispatch=true"
              echo "reason=missing-pr-or-sha"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python -m scripts.runner_lib should-dispatch \
            --provider "$PROVIDER" \
            --pr-number "$PR_NUMBER" \
            --head-sha "$HEAD_SHA" \
            --storage auto

  autofix:
    needs: prepare
    if: >-
      needs.prepare.outputs.should_run == 'true' &&
      needs.prepare.outputs.dispatch_should_run == 'true' &&
      needs.prepare.outputs.agent_type == 'codex'
    name: Run Codex autofix
    uses: stranske/Workflows/.github/workflows/reusable-codex-run.yml@main
    with:
      prompt_file: .github/codex/prompts/autofix_from_ci_failure.md
      mode: autofix
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_ref: ${{ needs.prepare.outputs.head_ref }}
      appendix: ${{ needs.prepare.outputs.appendix }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID }}
      WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

  autofix-claude:
    needs: prepare
    if: >-
      needs.prepare.outputs.should_run == 'true' &&
      needs.prepare.outputs.dispatch_should_run == 'true' &&
      needs.prepare.outputs.agent_type == 'claude'
    name: Run Claude autofix
    uses: stranske/Workflows/.github/workflows/reusable-claude-run.yml@main
    with:
      prompt_file: .github/codex/prompts/autofix_from_ci_failure.md
      mode: autofix
      pr_number: ${{ needs.prepare.outputs.pr_number }}
      pr_ref: ${{ needs.prepare.outputs.head_ref }}
      appendix: ${{ needs.prepare.outputs.appendix }}
    secrets:
      CLAUDE_AUTH_JSON: ${{ secrets.CLAUDE_AUTH_JSON }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID }}
      WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

  needs-human:
    needs: prepare
    if: needs.prepare.outputs.stop_reason == 'max_attempts'
    name: Flag for human follow-up
    runs-on: ubuntu-latest
    environment: agent-standard
    steps:
      - name: Checkout (for retry helpers)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Add needs-human label and comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.WRITE_TOKEN }}
          script: |
            const fs = require('fs');
            const retryPath = './.github/scripts/github-api-with-retry.js';
            const { createTokenAwareRetry } = fs.existsSync(retryPath)
              ? require(retryPath)
              : { createTokenAwareRetry: async () => ({ withRetry: (fn) => fn(github) }) };
            const { withRetry } = await createTokenAwareRetry({ github, core });

            const prNumber = Number('${{ needs.prepare.outputs.pr_number }}');
            if (!prNumber) {
              core.info('No PR number available; skipping comment/label.');
              return;
            }

            const appendix = `${{ toJSON(needs.prepare.outputs.appendix) }}`.replace(/^"|"$/g, '');
            const attempts = ${{ needs.prepare.outputs.attempts || 0 }};
            const maxAttempts = ${{ needs.prepare.outputs.max_attempts || 0 }};

            const { owner, repo } = context.repo;

            await withRetry((client) => client.rest.issues.addLabels({
              owner,
              repo,
              issue_number: prNumber,
              labels: ['needs-human'],
            })).catch((error) => {
              core.warning(`Failed to add label: ${error.message}`);
            });

            const body = [
              'Autofix attempts exhausted for this head.',
              `Attempts: ${attempts} / ${maxAttempts}`,
              '',
              'Latest Gate summary:',
              '```',
              appendix || 'No run context available.',
              '```',
              '',
              'Please investigate manually.',
            ].join('\n');

            await withRetry((client) => client.rest.issues.createComment({
              owner,
              repo,
              issue_number: prNumber,
              body,
            }));

  metrics:
    name: Record autofix metrics
    needs:
      - prepare
      - autofix
      - autofix-claude
    if: >-
      ${{
        always() &&
        (github.event_name != 'pull_request_target' || github.event.action != 'synchronize')
      }}
    runs-on: ubuntu-latest
    environment: agent-standard
    steps:
      - name: Checkout (for retry helpers)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Collect metrics
        id: collect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.WRITE_TOKEN }}
          script: |
            const fs = require('fs');
            const retryPath = './.github/scripts/github-api-with-retry.js';
            const { createTokenAwareRetry } = fs.existsSync(retryPath)
                ? require(retryPath)
                : { createTokenAwareRetry: async () => ({
                  withRetry: (fn) => fn(github),
                  paginateWithRetry: async (method, params) => {
                    const perPage = params?.per_page || 100;
                    const items = [];
                    let page = params?.page || 1;
                    while (true) {
                      const response = await method({ ...params, per_page: perPage, page });
                      const data = response?.data;
                      const pageItems = Array.isArray(data)
                        ? data
                        : Object.values(data || {}).find((value) => Array.isArray(value)) || [];
                      items.push(...pageItems);
                      if (pageItems.length < perPage) break;
                      page += 1;
                    }
                    return items;
                  }
                }) };
            const { withRetry, paginateWithRetry } = await createTokenAwareRetry({ github, core });

            const prNumber = Number('${{ needs.prepare.outputs.pr_number || 0 }}') || 0;
            const attemptNumber = Number('${{ needs.prepare.outputs.attempts || 0 }}') || 0;
            const attemptLimit = Number('${{ needs.prepare.outputs.max_attempts || 0 }}') || 0;
            const headShaBefore = '${{ needs.prepare.outputs.head_sha }}';
            const gateConclusionBefore =
              '${{ needs.prepare.outputs.gate_conclusion }}' ||
              (context.payload.workflow_run?.conclusion || '');
            const gateRunId =
              '${{ needs.prepare.outputs.gate_run_id }}' ||
              String(context.payload.workflow_run?.id || '');
            const triggerReason = '${{ needs.prepare.outputs.trigger_reason || 'unknown' }}';
            const triggerJob = '${{ needs.prepare.outputs.trigger_job }}';
            const triggerStep = '${{ needs.prepare.outputs.trigger_step }}';
            const stopReason = '${{ needs.prepare.outputs.stop_reason }}';
            const codexAutofixResult = '${{ needs.autofix.result }}';
            const claudeAutofixResult = '${{ needs.autofix-claude.result }}';
            const autofixResult =
              codexAutofixResult && codexAutofixResult !== 'skipped'
                ? codexAutofixResult
                : claudeAutofixResult;

            const { owner, repo } = context.repo;
            let fixApplied = false;
            let headShaAfter = headShaBefore;
            let gateResultAfter = gateConclusionBefore || 'unknown';

            if (prNumber) {
              try {
                const { data: pr } = await withRetry((client) => client.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                }));
                headShaAfter = pr.head?.sha || headShaAfter;
                  fixApplied = Boolean(
                    headShaBefore && headShaAfter && headShaBefore !== headShaAfter
                  );

                // Remove autofix:escalated label when fixes are applied
                // This allows re-escalation to the agent if Gate fails again
                if (fixApplied) {
                  const prLabels = pr.labels?.map(l => l.name) || [];
                  if (prLabels.includes('autofix:escalated')) {
                    try {
                      await withRetry((client) => client.rest.issues.removeLabel({
                        owner,
                        repo,
                        issue_number: prNumber,
                        name: 'autofix:escalated',
                      }));
                      core.info(
                        '✅ Removed autofix:escalated label - allows re-escalation ' +
                          'if Gate fails again'
                      );
                    } catch (labelError) {
                      core.warning(
                        `Failed to remove autofix:escalated label: ${labelError.message}`
                      );
                    }
                  }
                }

                const gateWorkflow = 'pr-00-gate.yml';
                const runs = await paginateWithRetry(github.rest.actions.listWorkflowRuns, {
                  owner,
                  repo,
                  workflow_id: gateWorkflow,
                  head_sha: headShaAfter,
                  per_page: 20,
                });
                const latestGateRun = runs[0];
                if (latestGateRun) {
                  gateResultAfter = latestGateRun.conclusion || latestGateRun.status || 'unknown';
                } else {
                  gateResultAfter = 'not-found';
                }
              } catch (error) {
                core.warning(`Failed to resolve PR or gate status: ${error.message}`);
              }
            }

            const metrics = {
              workflow_run_id: gateRunId,
              pr_number: prNumber,
              attempt_number: attemptNumber,
              attempt_limit: attemptLimit,
              trigger_reason: triggerReason || 'unknown',
              trigger_job: triggerJob,
              trigger_step: triggerStep,
              fix_applied: fixApplied,
              gate_result_after: gateResultAfter || 'unknown',
              gate_conclusion_before: gateConclusionBefore || 'unknown',
              stop_reason: stopReason || '',
              autofix_result: autofixResult || 'unknown',
              head_sha_before: headShaBefore,
              head_sha_after: headShaAfter,
              recorded_at: new Date().toISOString(),
            };

            core.setOutput('metrics_json', JSON.stringify(metrics));

      - name: Write summary and artifact
        env:
          METRICS_JSON: ${{ steps.collect.outputs.metrics_json }}
        run: |
          set -euo pipefail
          if [ -z "${METRICS_JSON:-}" ]; then
            echo "No metrics JSON captured; skipping summary."
            exit 0
          fi

          python - <<'PY'
          import json
          import os

          metrics = json.loads(os.environ["METRICS_JSON"])
          order = [
              "pr_number",
              "attempt_number",
              "attempt_limit",
              "trigger_reason",
              "trigger_job",
              "trigger_step",
              "fix_applied",
              "gate_conclusion_before",
              "gate_result_after",
              "autofix_result",
              "stop_reason",
              "workflow_run_id",
              "head_sha_before",
              "head_sha_after",
              "recorded_at",
          ]

          lines = ["## Autofix loop metrics", ""] + ["| Field | Value |", "| --- | --- |"]
          for key in order:
              value = metrics.get(key, "")
              lines.append(f"| {key} | `{value}` |")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as fp:
                  fp.write("\n".join(lines) + "\n")

          out_path = "autofix-metrics.ndjson"
          with open(out_path, "a", encoding="utf-8") as fp:
              fp.write(json.dumps(metrics) + "\n")
          print(f"Wrote metrics to {out_path}")
          PY

      - name: Upload metrics artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agents-autofix-metrics
          path: autofix-metrics.ndjson
          retention-days: 30

  generated-delivery-wakeup:
    name: Wake generated delivery reconciler
    if: >-
      ${{
        github.event_name == 'workflow_run' &&
        (github.event.workflow_run.head_branch == 'sync/workflows-candidate' ||
         github.event.workflow_run.head_branch == 'sync/workflows-delivery' ||
         startsWith(github.event.workflow_run.head_branch, 'deps/sync-dev-versions-'))
      }}
    runs-on: ubuntu-latest
    environment: agent-standard
    permissions:
      contents: read
    steps:
      - name: Dispatch exact generated lane to Workflows
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.WRITE_TOKEN }}
          script: |
            const branch = String(context.payload.workflow_run?.head_branch || '');
            const activeSyncHash = branch === 'sync/workflows-candidate'
              ? 'candidate'
              : branch === 'sync/workflows-delivery'
                ? 'delivery'
                : 'dev-tool';
            const clientPayload = {
              source_repository: `${context.repo.owner}/${context.repo.repo}`,
              source_run_id: String(context.payload.workflow_run?.id || ''),
            };
            clientPayload.active_sync_hash = activeSyncHash;
            const withRetry = async (operation) => {
              let lastError;
              for (let attempt = 0; attempt < 3; attempt += 1) {
                try {
                  return await operation();
                } catch (error) {
                  lastError = error;
                  if (![429, 500, 502, 503, 504].includes(Number(error?.status))) throw error;
                  await new Promise((resolve) => setTimeout(resolve, 1000 * (attempt + 1)));
                }
              }
              core.setFailed(
                `Generated-delivery wakeup failed: ${lastError?.message || lastError}`,
              );
              throw lastError;
            };
            await withRetry(() => github.rest.repos.createDispatchEvent({
              owner: 'stranske',
              repo: 'Workflows',
              event_type: 'merge-sync-prs',
              client_payload: clientPayload,
            }));
            core.notice(`Woke Maint 71 lane ${activeSyncHash} from ${branch}`);

  guarded-merge:
    name: Merge automerge-labelled agent PRs
    # #2270 (FO-5): in-repo guarded merger for consumer repos. Runs on the same
    # events as the rest of this workflow (Gate completion / label / dispatch) and
    # evaluates the triggering PR when it carries the `automerge` label. Mirrors the reusable-70
    # automerge sweep guards (combined status + all check-runs success) and adds
    # exact-head, review-window, review-thread, bootstrap-only, and unchecked-task
    # refusals. Replaces the guardless native auto-merge previously enabled by the
    # belt worker (removed in #2270).
    if: >-
      ${{ github.event_name != 'pull_request_target' ||
          github.event.action == 'synchronize' ||
          github.event.label.name == 'automerge' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: agent-standard
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Do not remove checkout; the retry helper is required.
      - name: Checkout (for retry helpers)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/runtime_ac_merge_guard.js
            .github/scripts/source_context.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false
      - name: Merge labelled agent PRs (guarded)
        id: guarded_merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ env.WRITE_TOKEN }}
          script: |
            const fs = require('fs');
            const label = 'automerge';
            const retryPath = './.github/scripts/github-api-with-retry.js';
            const {
              GENERATED_DELIVERY_HOLD_LABEL,
              assertRuntimeAcMergeAllowed,
              runtimeAcRequirement,
            } = require('./.github/scripts/runtime_ac_merge_guard.js');
            const {
              extractClosingIssueNumbersFromText,
              extractIssueNumberFromPull,
              extractIssueNumbersFromText,
            } = require('./.github/scripts/source_context.js');
            const { createTokenAwareRetry } = fs.existsSync(retryPath)
              ? require(retryPath)
              : {
                  createTokenAwareRetry: async () => ({
                    withRetry: (fn) => fn(github),
                    paginateWithRetry: async (method, params) => {
                      const perPage = params?.per_page || 100;
                      const items = [];
                      let page = params?.page || 1;
                      while (true) {
                        const response = await method({ ...params, per_page: perPage, page });
                        const data = response?.data;
                        const pageItems = Array.isArray(data)
                          ? data
                          : Object.values(data || {}).find((value) => Array.isArray(value)) || [];
                        items.push(...pageItems);
                        if (pageItems.length < perPage) break;
                        page += 1;
                      }
                      return items;
                    },
                  }),
                };
            const { withRetry, paginateWithRetry } = await createTokenAwareRetry({ github, core });
            const summary = core.summary;
            const { owner, repo } = context.repo;

            // Resolve the default branch (agent PRs must target it).
            let defaultBranch = (context.payload.repository && context.payload.repository.default_branch) || '';
            if (!defaultBranch) {
              const { data: repoInfo } = await withRetry((client) => client.rest.repos.get({ owner, repo }));
              defaultBranch = repoInfo.default_branch || '';
            }
            if (!defaultBranch) {
              core.setFailed('Repository default branch not available');
              return;
            }

            // #2270 (FO-5): consumer in-repo guarded merger. Mirrors the reusable-70
            // automerge sweep guards (combined status + all check-runs success), REFUSES
            // bootstrap-only placeholder PRs, and REFUSES PRs whose linked issue/PR still
            // has unchecked tasks. This gives consumers an in-repo merge leg instead of
            // depending on the local closer lane, now that the belt worker no longer
            // enables guardless native auto-merge.
            const placeholder = /^agents\/[a-z][a-z0-9_-]*-\d+\.md$/i;
            const okConclusions = ['success', 'neutral', 'skipped'];
            const reviewWindowMs = 7 * 60 * 1000;
            let reviewSleepBudgetMs = reviewWindowMs + 60 * 1000;
            const reviewWindowMarker = '<!-- agents-guarded-merge-review-window:v1 ';
            // THE WINDOW EXISTS TO GIVE REVIEWERS A CHANCE, NOT TO COLLECT A QUORUM.
            // `reviewWindowMs` is a flat 7-minute grace period after the head settles, and it was
            // waited out even when a review had ALREADY landed on that exact head. With more than
            // one review bot configured that reads as "waiting for the others", which is not what
            // the guard is for: one review on the current head means the opportunity was taken, and
            // the remaining minutes buy nothing. Multiple reviewers stay valuable — a merge just
            // stops being contingent on a second one arriving.
            // Scoped to the EXACT head on purpose: a review of an older commit says nothing about
            // the code being merged, so it must not short-circuit the window. When no review has
            // landed the full grace period still applies, unchanged.
            const reviewPresenceCache = new Map();
            async function headHasReview(prNumber, headSha) {
              if (!headSha) return false;
              const key = `${prNumber}@${headSha}`;
              if (reviewPresenceCache.has(key)) return reviewPresenceCache.get(key);
              let present = false;
              try {
                const reviews = await paginateWithRetry(github.rest.pulls.listReviews, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                present = (reviews || []).some((review) => {
                  if (String(review?.commit_id || '') !== headSha) return false;
                  // COMMENTED counts: an advisory bot review is exactly the signal being waited
                  // for. A PENDING (unsubmitted) review is not a review yet.
                  return ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(
                    String(review?.state || '').toUpperCase(),
                  );
                });
              } catch (error) {
                // Fail toward the EXISTING behaviour: if the question cannot be answered, wait the
                // full window rather than merging early on an unverified assumption.
                core.info(`headHasReview(${prNumber}) unavailable: ${error?.message || error}`);
                present = false;
              }
              reviewPresenceCache.set(key, present);
              return present;
            }
            async function reviewWindowRemainingMs(prNumber, headSha, observedAtMs) {
              const remaining = reviewWindowMs - (Date.now() - observedAtMs);
              if (remaining <= 0) return remaining;
              if (await headHasReview(prNumber, headSha)) {
                core.info(
                  `Review window satisfied early for #${prNumber}: a review is already in on ${headSha.slice(0, 12)}.`,
                );
                return 0;
              }
              return remaining;
            }
            let authenticatedLogin = '';
            const reviewWindowObservations = new Map();

            // Count unchecked GitHub task checkboxes ("- [ ]") in real (non-quoted) lines.
            // Quoted lines ("> - [ ]", e.g. the belt PR's mirrored issue body) are ignored
            // so they do not block a merge; the linked issue's own body is the source of truth.
            function countUnchecked(text) {
              if (!text) return 0;
              let count = 0;
              for (const rawLine of String(text).split('\n')) {
                const line = rawLine.replace(/\r$/, '');
                if (/^\s*>/.test(line)) continue; // skip blockquoted (mirrored) content
                if (/^\s*(?:[-*+]|\d+[.)])\s+\[\s\]/.test(line)) count += 1;
              }
              return count;
            }

            function inferIssue(pr) {
              if (issueReferenceFailure(pr)) return 0;
              return extractIssueNumberFromPull(pr || {});
            }

            function issueReferenceFailure(pr) {
              const body = String(pr?.body || '');
              const metaIssueNumbers = new Set(
                Array.from(body.matchAll(/<!--\s*meta:issue:([0-9]+)\s*-->/gi), (match) =>
                  Number.parseInt(match[1], 10)
                )
              );
              if (metaIssueNumbers.size > 1) {
                return 'Ambiguous linked issue references; refusing to merge blind.';
              }
              if (metaIssueNumbers.size === 1) return '';
              const bodyIssueNumbers = extractIssueNumbersFromText(body);
              if (bodyIssueNumbers.size <= 1) return '';
              const closingIssueNumbers = extractClosingIssueNumbersFromText(body);
              return closingIssueNumbers.size === 1
                ? ''
                : 'Ambiguous linked issue references; refusing to merge blind.';
            }

            async function linkedIssueTaskSnapshot(pr) {
              const issueNumber = inferIssue(pr);
              if (!issueNumber) {
                return { issueNumber: 0, body: '', updatedAt: '', failure: '' };
              }
              try {
                const { data: linked } = await withRetry((client) => client.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                }));
                const updatedAt = String(linked?.updated_at || '');
                if (!updatedAt) {
                  return {
                    issueNumber,
                    body: String(linked?.body || ''),
                    updatedAt: '',
                    failure: `Linked issue #${issueNumber} has no version; refusing to merge blind.`,
                  };
                }
                return {
                  issueNumber,
                  body: String(linked?.body || ''),
                  updatedAt,
                  failure: '',
                };
              } catch (error) {
                return {
                  issueNumber,
                  body: '',
                  updatedAt: '',
                  failure: `Unable to read linked issue #${issueNumber}; refusing to merge blind: ${error.message || error}`,
                };
              }
            }

            function uncheckedTaskFailure(pr, linkedIssueSnapshot) {
              const referenceFailure = issueReferenceFailure(pr);
              if (referenceFailure) return referenceFailure;
              let unchecked = countUnchecked(pr?.body);
              const linkedIssue = inferIssue(pr);
              if (linkedIssue) {
                if (
                  !linkedIssueSnapshot
                  || Number(linkedIssueSnapshot.issueNumber || 0) !== linkedIssue
                ) {
                  return `Unable to bind linked issue #${linkedIssue}; refusing to merge blind.`;
                }
                if (linkedIssueSnapshot.failure) {
                  return linkedIssueSnapshot.failure;
                }
                unchecked += countUnchecked(linkedIssueSnapshot.body);
              }
              return unchecked > 0
                ? 'Refusing auto-merge: linked issue/PR has unchecked tasks.'
                : '';
            }

            async function loadPullRequest(prNumber) {
              let latest = null;
              for (let attempt = 0; attempt < 2; attempt += 1) {
                const { data: pr } = await withRetry((client) => client.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                }));
                latest = pr;
                const mergeableState = String(pr?.mergeable_state || '').toLowerCase();
                if (mergeableState && mergeableState !== 'unknown') {
                  return pr;
                }
                if (attempt === 0) {
                  await new Promise((resolve) => setTimeout(resolve, 2000));
                }
              }
              return latest;
            }

            async function reviewWindowObservation(prNumber, headSha, { forceReset = false } = {}) {
              try {
                if (!authenticatedLogin) {
                  const { data: authenticated } = await withRetry((client) => {
                    return client.rest.users.getAuthenticated();
                  });
                  authenticatedLogin = String(authenticated?.login || '').toLowerCase();
                }
                if (!authenticatedLogin) {
                  return { failure: 'Unable to identify the review-window state owner.' };
                }

                const comments = await paginateWithRetry(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100,
                });
                let latestHeadTransitionAtMs = 0;
                let transitionCursor = null;
                do {
                  const transitionResult = await withRetry((client) => client.graphql(`
                    query($owner: String!, $repo: String!, $prNumber: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $prNumber) {
                          timelineItems(
                            first: 100,
                            after: $cursor,
                            itemTypes: [HEAD_REF_FORCE_PUSHED_EVENT]
                          ) {
                            nodes {
                              ... on HeadRefForcePushedEvent {
                                createdAt
                                afterCommit { oid }
                              }
                            }
                            pageInfo { hasNextPage endCursor }
                          }
                        }
                      }
                    }
                  `, { owner, repo, prNumber, cursor: transitionCursor }));
                  const transitions = transitionResult?.repository?.pullRequest?.timelineItems;
                  if (!transitions) {
                    return { failure: 'Unable to read persisted head transitions.' };
                  }
                  for (const event of transitions.nodes || []) {
                    const transitionedHeadSha = String(event?.afterCommit?.oid || '');
                    if (transitionedHeadSha !== headSha) continue;
                    const eventAtMs = Date.parse(event.createdAt || '');
                    if (!Number.isFinite(eventAtMs)) {
                      return { failure: 'Persisted head-transition time is invalid.' };
                    }
                    latestHeadTransitionAtMs = Math.max(latestHeadTransitionAtMs, eventAtMs);
                  }
                  transitionCursor = transitions.pageInfo?.hasNextPage
                    ? transitions.pageInfo.endCursor
                    : null;
                } while (transitionCursor);
                const stateComment = comments
                  .filter((comment) => {
                    const author = String(comment?.user?.login || '').toLowerCase();
                    return author === authenticatedLogin
                      && String(comment?.body || '').includes(reviewWindowMarker);
                  })
                  .sort((left, right) => Number(right.id || 0) - Number(left.id || 0))[0];
                const marker = `${reviewWindowMarker}head=${headSha} -->`;
                if (!forceReset && stateComment && String(stateComment.body || '').includes(marker)) {
                  const observedAtMs = Date.parse(
                    stateComment.updated_at || stateComment.created_at || ''
                  );
                  if (!Number.isFinite(observedAtMs)) {
                    return { failure: 'Stored review-window observation time is invalid.' };
                  }
                  if (observedAtMs >= latestHeadTransitionAtMs) {
                    return { observedAtMs };
                  }
                }

                const body = [
                  marker,
                  'Automated exact-head review-window state. Each eligible merge wakeup re-observes the current head.',
                ].join('\n');
                const response = stateComment
                  ? await withRetry((client) => client.rest.issues.updateComment({
                      owner,
                      repo,
                      comment_id: stateComment.id,
                      body,
                    }))
                  : await withRetry((client) => client.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: prNumber,
                      body,
                    }));
                const observedAtMs = Date.parse(
                  response?.data?.updated_at || response?.data?.created_at || ''
                );
                return Number.isFinite(observedAtMs)
                  ? { observedAtMs }
                  : { failure: 'Unable to persist the exact-head review-window start.' };
              } catch (error) {
                return {
                  failure: `Unable to persist the exact-head review-window state: ${error.message || error}`,
                };
              }
            }

            function reviewObservationKey(prNumber, headSha) {
              return `${prNumber}:${headSha}`;
            }

            async function primeReviewWindows(candidateIssues) {
              let maxRemainingMs = 0;
              for (const issue of candidateIssues) {
                if (!issue?.pull_request) continue;
                const prNumber = Number(issue.number);
                const pr = await loadPullRequest(prNumber);
                const headSha = pr?.head?.sha || '';
                if (!headSha) continue;
                const observationKey = reviewObservationKey(prNumber, headSha);
                const observation = reviewWindowObservations.get(observationKey)
                  || await reviewWindowObservation(prNumber, headSha);
                reviewWindowObservations.set(observationKey, observation);
                if (Number.isFinite(observation.observedAtMs)) {
                  // Short-circuit here too, or the job SLEEPS the full window before reaching the
                  // per-PR checks that would have passed immediately — the wait this change is
                  // about is mostly spent in that sleep.
                  maxRemainingMs = Math.max(
                    maxRemainingMs,
                    await reviewWindowRemainingMs(prNumber, headSha, observation.observedAtMs),
                  );
                }
              }

              if (maxRemainingMs <= 0) return;
              const requestedSleepMs = maxRemainingMs + 1000;
              if (requestedSleepMs > reviewSleepBudgetMs) {
                core.warning('Review-window wait exceeds the bounded run budget; deferring.');
                return;
              }
              reviewSleepBudgetMs -= requestedSleepMs;
              core.info(
                `Waiting ${Math.ceil(maxRemainingMs / 1000)}s for all exact-head review windows.`
              );
              await new Promise((resolve) => setTimeout(resolve, requestedSleepMs));
            }

            async function activeReviewThreadFailure(prNumber) {
              try {
                let cursor = null;
                let activeThreads = 0;
                do {
                  const result = await withRetry((client) => client.graphql(
                    `query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          reviewThreads(first: 100, after: $cursor) {
                            nodes { isResolved isOutdated }
                            pageInfo { hasNextPage endCursor }
                          }
                        }
                      }
                    }`,
                    { owner, repo, number: prNumber, cursor }
                  ));
                  const threads = result?.repository?.pullRequest?.reviewThreads;
                  if (!threads) {
                    return 'Unable to read review threads; refusing to merge blind.';
                  }
                  activeThreads += (threads.nodes || []).filter(
                    (thread) => !thread.isResolved && !thread.isOutdated
                  ).length;
                  cursor = threads.pageInfo?.hasNextPage ? threads.pageInfo.endCursor : null;
                } while (cursor);
                return activeThreads > 0
                  ? `${activeThreads} active non-outdated review thread(s) remain.`
                  : '';
              } catch (error) {
                return `Unable to read review threads: ${error.message || error}`;
              }
            }

            async function checkStateFailure(headSha) {
              try {
                const { data: combined } = await withRetry((client) => {
                  return client.rest.repos.getCombinedStatusForRef({
                    owner,
                    repo,
                    ref: headSha,
                  });
                });
                if (!combined || combined.state !== 'success') {
                  const statusCount = Number(combined?.total_count ?? 0);
                  if (!combined || statusCount > 0 || combined.state !== 'pending') {
                    return 'Required status checks have not all succeeded.';
                  }
                }
                const checkRuns = await paginateWithRetry(
                  github.rest.checks.listForRef,
                  { owner, repo, ref: headSha, per_page: 100 }
                );
                if (Number(combined?.total_count || 0) === 0 && checkRuns.length === 0) {
                  return 'No commit statuses or check runs found.';
                }
                for (const run of checkRuns) {
                  const conclusion = (run.conclusion || '').toLowerCase();
                  const statusName = run.name || run.id || 'unknown check';
                  if (!conclusion && run.status !== 'completed') {
                    return `${statusName} pending`;
                  }
                  if (conclusion && !okConclusions.includes(conclusion)) {
                    return `${statusName} concluded ${conclusion}`;
                  }
                }
                return '';
              } catch (error) {
                return `Unable to revalidate checks: ${error.message || error}`;
              }
            }

            async function reviewGuardFailure(prNumber, pr) {
              let guardedPr = pr;
              const originalHead = pr.head?.sha || '';
              if (!originalHead) {
                return { pr: guardedPr, failure: 'Missing head SHA for the review window.' };
              }
              const observationKey = reviewObservationKey(prNumber, originalHead);
              const observation = reviewWindowObservations.get(observationKey)
                || await reviewWindowObservation(prNumber, originalHead);
              if (observation.failure || !Number.isFinite(observation.observedAtMs)) {
                return {
                  pr: guardedPr,
                  failure: observation.failure || 'Unable to establish the exact-head review window.',
                };
              }
              const remainingMs = await reviewWindowRemainingMs(
                prNumber, originalHead, observation.observedAtMs,
              );
              if (remainingMs > 0) {
                const requestedSleepMs = remainingMs + 1000;
                if (requestedSleepMs > reviewSleepBudgetMs) {
                  return {
                    pr: guardedPr,
                    failure: 'Review window not elapsed; deferring to a later run.',
                  };
                }
                reviewSleepBudgetMs -= requestedSleepMs;
                core.info(`Waiting ${Math.ceil(remainingMs / 1000)}s for the exact-head review window.`);
                await new Promise((resolve) => setTimeout(resolve, requestedSleepMs));
                const refreshedPr = await loadPullRequest(prNumber);
                const refreshedHead = refreshedPr?.head?.sha || '';
                if (!originalHead || refreshedHead !== originalHead) {
                  return { pr: refreshedPr || guardedPr, failure: 'Head changed during the review window.' };
                }
                const refreshedMergeableState = String(refreshedPr.mergeable_state || '').toLowerCase();
                if (refreshedPr.draft || refreshedMergeableState !== 'clean') {
                  return {
                    pr: refreshedPr,
                    failure: `Post-window mergeable state ${refreshedMergeableState || '(unknown)'} is not clean.`,
                  };
                }
                const refreshedLabels = (refreshedPr.labels || []).map(
                  (item) => String(item.name || '').toLowerCase()
                );
                if (!refreshedLabels.includes(label)) {
                  return {
                    pr: refreshedPr,
                    failure: 'Post-window pull request no longer carries the automerge label.',
                  };
                }
                guardedPr = refreshedPr;
              }

              return {
                pr: guardedPr,
                failure: await activeReviewThreadFailure(prNumber),
              };
            }

            async function finalMergeGuardFailure(prNumber, expectedHead) {
              try {
                const finalObservation = await reviewWindowObservation(prNumber, expectedHead);
                if (finalObservation.failure || !Number.isFinite(finalObservation.observedAtMs)) {
                  return finalObservation.failure
                    || 'Unable to revalidate the exact-head review window before merge.';
                }
                const finalReviewRemainingMs = await reviewWindowRemainingMs(
                  prNumber, expectedHead, finalObservation.observedAtMs,
                );
                if (finalReviewRemainingMs > 0) {
                  return 'A newer head transition restarted the review window before merge.';
                }

                const finalPr = await loadPullRequest(prNumber);
                if (!finalPr) {
                  return 'Unable to load the final pull request snapshot.';
                }
                const finalHead = finalPr?.head?.sha || '';
                if (!finalHead || finalHead !== expectedHead) {
                  return 'Head changed before the merge request.';
                }
                const { data: finalRepoInfo } = await withRetry((client) => {
                  return client.rest.repos.get({ owner, repo });
                });
                const finalDefaultBranch = finalRepoInfo?.default_branch || '';
                if (!finalDefaultBranch) {
                  return 'Repository default branch not available in the final snapshot.';
                }
                const finalBase = finalPr?.base?.ref || '';
                if (!finalBase || finalBase !== finalDefaultBranch) {
                  return `Final base branch ${finalBase || '(unknown)'} does not match ${finalDefaultBranch}.`;
                }
                const finalMergeableState = String(finalPr.mergeable_state || '').toLowerCase();
                if (finalPr.draft || finalMergeableState !== 'clean') {
                  return `Final mergeable state ${finalMergeableState || '(unknown)'} is not clean.`;
                }
                const finalLabels = (finalPr.labels || []).map(
                  (item) => String(item.name || '').toLowerCase()
                );
                if (!finalLabels.includes(label)) {
                  return 'Pull request no longer carries the automerge label.';
                }
                if (finalLabels.includes(GENERATED_DELIVERY_HOLD_LABEL)) {
                  return `Generated delivery hold ${GENERATED_DELIVERY_HOLD_LABEL} was added before merge.`;
                }
                const finalRuntimeRequirement = runtimeAcRequirement(finalPr.labels || []);
                if (finalRuntimeRequirement.required) {
                  return `Runtime acceptance label(s) ${finalRuntimeRequirement.labels.join(', ')} were added before merge.`;
                }
                const finalLinkedIssue = inferIssue(finalPr);
                const finalLinkedIssueSnapshot = await linkedIssueTaskSnapshot(finalPr);
                const finalTaskFailure = uncheckedTaskFailure(finalPr, finalLinkedIssueSnapshot);
                if (finalTaskFailure) {
                  return finalTaskFailure;
                }
                const finalCheckFailure = await checkStateFailure(expectedHead);
                if (finalCheckFailure) {
                  return `Final check-state validation failed: ${finalCheckFailure}`;
                }
                const finalThreadFailure = await activeReviewThreadFailure(prNumber);
                if (finalThreadFailure) {
                  return finalThreadFailure;
                }

                // Bind both mutable target snapshots at the last network boundary.
                // The merge API binds the head SHA but does not bind the base branch.
                const [
                  mergeBoundaryPr,
                  mergeBoundaryRepoResponse,
                  mergeBoundaryLinkedIssueSnapshot,
                  mergeBoundaryCheckFailure,
                  mergeBoundaryThreadFailure,
                ] = await Promise.all([
                  loadPullRequest(prNumber),
                  withRetry((client) => client.rest.repos.get({ owner, repo })),
                  finalLinkedIssue
                    ? linkedIssueTaskSnapshot(finalPr)
                    : Promise.resolve({ issueNumber: 0, body: '', updatedAt: '', failure: '' }),
                  checkStateFailure(expectedHead),
                  activeReviewThreadFailure(prNumber),
                ]);
                if (!mergeBoundaryPr) {
                  return 'Unable to load the merge-boundary pull request snapshot.';
                }
                if (mergeBoundaryCheckFailure) {
                  return `Merge-boundary check-state validation failed: ${mergeBoundaryCheckFailure}`;
                }
                if (mergeBoundaryThreadFailure) {
                  return mergeBoundaryThreadFailure;
                }
                const mergeBoundaryHead = mergeBoundaryPr?.head?.sha || '';
                if (!mergeBoundaryHead || mergeBoundaryHead !== expectedHead) {
                  return 'Head changed at the final merge boundary.';
                }
                const mergeBoundaryDefaultBranch =
                  mergeBoundaryRepoResponse?.data?.default_branch || '';
                if (!mergeBoundaryDefaultBranch) {
                  return 'Repository default branch not available at the final merge boundary.';
                }
                const mergeBoundaryBase = mergeBoundaryPr?.base?.ref || '';
                if (!mergeBoundaryBase || mergeBoundaryBase !== mergeBoundaryDefaultBranch) {
                  return `Merge-boundary base ${mergeBoundaryBase || '(unknown)'} does not match ${mergeBoundaryDefaultBranch}.`;
                }
                const mergeBoundaryMergeableState = String(
                  mergeBoundaryPr.mergeable_state || ''
                ).toLowerCase();
                if (mergeBoundaryPr.draft || mergeBoundaryMergeableState !== 'clean') {
                  return `Merge-boundary state ${mergeBoundaryMergeableState || '(unknown)'} is not clean.`;
                }
                const mergeBoundaryLabels = (mergeBoundaryPr.labels || []).map(
                  (item) => String(item.name || '').toLowerCase()
                );
                if (!mergeBoundaryLabels.includes(label)) {
                  return 'Pull request lost the automerge label at the final merge boundary.';
                }
                if (mergeBoundaryLabels.includes(GENERATED_DELIVERY_HOLD_LABEL)) {
                  return `Generated delivery hold ${GENERATED_DELIVERY_HOLD_LABEL} was added at the final merge boundary.`;
                }
                const mergeBoundaryRuntimeRequirement = runtimeAcRequirement(
                  mergeBoundaryPr.labels || []
                );
                if (mergeBoundaryRuntimeRequirement.required) {
                  return `Runtime acceptance label(s) ${mergeBoundaryRuntimeRequirement.labels.join(', ')} were added at the final merge boundary.`;
                }
                const mergeBoundaryLinkedIssue = inferIssue(mergeBoundaryPr);
                if (mergeBoundaryLinkedIssue !== finalLinkedIssue) {
                  return 'Linked issue changed at the final merge boundary.';
                }
                const mergeBoundaryTaskFailure = uncheckedTaskFailure(
                  mergeBoundaryPr,
                  mergeBoundaryLinkedIssueSnapshot
                );
                if (mergeBoundaryTaskFailure) {
                  return `Final merge-boundary task validation failed: ${mergeBoundaryTaskFailure}`;
                }
                if (
                  mergeBoundaryLinkedIssueSnapshot.body !== finalLinkedIssueSnapshot.body
                  || mergeBoundaryLinkedIssueSnapshot.updatedAt !== finalLinkedIssueSnapshot.updatedAt
                ) {
                  return 'Linked issue changed during final merge validation.';
                }
                return '';
              } catch (error) {
                return `Unable to complete final merge guard: ${error.message || error}`;
              }
            }

            const listedIssues = await paginateWithRetry(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              labels: label,
              per_page: 100,
            });
            const triggeringPrNumber = Number(
              context.payload.pull_request?.number
              || context.payload.workflow_run?.pull_requests?.[0]?.number
              || context.payload.inputs?.pr_number
              || 0
            );
            if (triggeringPrNumber <= 0) {
              core.warning('No triggering PR number; refusing a repository-wide merge scan.');
            }
            const issues = listedIssues.filter(
              (issue) => Number(issue.number) === triggeringPrNumber
            );

            const rows = [];
            const merged = [];

            summary.addHeading('Consumer agent auto-merge scan');
            if (!issues.length) {
              summary.addRaw(`No open pull requests carry the "${label}" label.`).addEOL();
              await summary.write();
              core.setOutput('merged', JSON.stringify(merged));
              return;
            }

            // Every merge-capable wakeup establishes a fresh observation before it can
            // consume review-window state. This deliberately does not rely on a pending
            // synchronize run: GitHub may replace that pending run when another event
            // enters the same cancel-in-progress:false concurrency group.
            const triggeringPr = await loadPullRequest(triggeringPrNumber);
            const triggeringHeadSha = triggeringPr?.head?.sha || '';
            if (!triggeringHeadSha) {
              core.setFailed('Unable to establish the triggering exact head.');
              return;
            }
            const triggeringObservation = await reviewWindowObservation(
              triggeringPrNumber,
              triggeringHeadSha,
              { forceReset: true }
            );
            reviewWindowObservations.set(
              reviewObservationKey(triggeringPrNumber, triggeringHeadSha),
              triggeringObservation
            );

            await primeReviewWindows(issues);

            for (const issue of issues) {
              if (!issue || !issue.pull_request) continue;
              const prNumber = Number(issue.number);
              let note = '';
              let status = 'skipped';
              try {
                let pr = await loadPullRequest(prNumber);
                if (!pr) {
                  note = 'Unable to load pull request data.';
                } else {
                  const labelNames = (pr.labels || []).map((l) => String(l.name || '').toLowerCase());
                  const isBot = pr.user && pr.user.type === 'Bot';
                  const looksAgentAuthored = isBot
                    || labelNames.some((n) => n.startsWith('from:') || n.startsWith('agent:'));
                  const baseRef = (pr.base && pr.base.ref) || '(unknown)';
                  const mergeableState = (pr.mergeable_state || '').toLowerCase();
                  if (!looksAgentAuthored) {
                    note = `Author @${(pr.user && pr.user.login) || 'unknown'} is not an agent/automation account.`;
                  } else if (baseRef !== defaultBranch) {
                    note = `Base branch ${baseRef} does not match ${defaultBranch}.`;
                  } else if (pr.draft) {
                    note = 'Draft pull requests are not eligible for auto-merge.';
                  } else if (mergeableState !== 'clean') {
                    note = `Mergeable state ${mergeableState || '(unknown)'} is not clean.`;
                  } else {
                    const headSha = (pr.head && pr.head.sha) || '';
                    if (!headSha) {
                      note = 'Missing head SHA for pull request.';
                    } else {
                      const reviewGuard = await reviewGuardFailure(prNumber, pr);
                      pr = reviewGuard.pr;
                      if (reviewGuard.failure) {
                        note = reviewGuard.failure;
                      } else {
                        let failingCheck = await checkStateFailure(headSha);
                        let checksOk = !failingCheck;

                        // Bootstrap-only refusal (mirrors belt conveyor + reusable-70 sweep).
                        let bootstrapOnly = false;
                        if (checksOk) {
                          try {
                            const prFiles = await paginateWithRetry(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
                            bootstrapOnly = prFiles.length > 0 && prFiles.every((f) => placeholder.test(f.filename));
                          } catch (error) {
                            bootstrapOnly = true; // do NOT merge blind
                            failingCheck = `Unable to list PR files: ${error.message || error}`;
                          }
                        }

                        // Unchecked-task refusal: inspect the PR body and, when resolvable,
                        // the linked issue body. Either carrying an open "- [ ]" blocks merge.
                        let taskFailure = '';
                        if (checksOk && !bootstrapOnly) {
                          const linkedIssueSnapshot = await linkedIssueTaskSnapshot(pr);
                          taskFailure = uncheckedTaskFailure(pr, linkedIssueSnapshot);
                        }

                        if (!checksOk) {
                          note = failingCheck || 'Checks have not completed successfully.';
                        } else if (bootstrapOnly) {
                          note = failingCheck || 'Refusing auto-merge: bootstrap-only placeholder PR (no work landed).';
                        } else if (taskFailure) {
                          note = taskFailure;
                        } else {
                          try {
                            await assertRuntimeAcMergeAllowed({
                              github,
                              core,
                              owner,
                              repo,
                              prNumber,
                              withRetry,
                              source: 'agents-81-gate-followups guarded merge',
                            });
                            const finalMergeFailure = await finalMergeGuardFailure(prNumber, headSha);
                            if (finalMergeFailure) {
                              throw new Error(finalMergeFailure);
                            }
                            const response = await withRetry((client) => client.rest.pulls.merge({
                              owner,
                              repo,
                              pull_number: prNumber,
                              merge_method: 'squash',
                              sha: headSha,
                            }));
                            if (response && response.data && response.data.merged) {
                              status = 'merged';
                              note = `Merged via ${response.data.merge_method || 'squash'}.`;
                              merged.push(prNumber);
                              let linkedIssue = 0;
                              try {
                                const cleanupPr = await loadPullRequest(prNumber);
                                linkedIssue = inferIssue(cleanupPr);
                              } catch (error) {
                                core.warning(`Merged PR #${prNumber}, but could not reload its final linked issue: ${error.message || error}`);
                              }
                              if (linkedIssue) {
                                try {
                                  await withRetry((client) => client.rest.issues.removeLabel({
                                    owner,
                                    repo,
                                    issue_number: linkedIssue,
                                    name: 'status:in-progress',
                                  }));
                                } catch (error) {
                                  if (error.status !== 404) {
                                    core.warning(`Merged PR #${prNumber}, but could not clear status:in-progress from issue #${linkedIssue}: ${error.message || error}`);
                                  }
                                }
                              }
                            } else {
                              status = 'error';
                              note = 'Merge API returned an unexpected response.';
                            }
                          } catch (error) {
                            status = 'error';
                            const responseData = error && error.response ? error.response.data : undefined;
                            const detail = responseData && responseData.message ? responseData.message : (error.message || String(error));
                            note = `Merge failed: ${detail}`;
                          }
                        }
                      }
                    }
                  }
                }
              } catch (error) {
                status = 'error';
                note = `Unhandled error: ${error.message || error}`;
              }
              rows.push([`#${prNumber}`, status, note || '']);
            }

            summary.addTable([
              [{ data: 'PR', header: true }, { data: 'Result', header: true }, { data: 'Note', header: true }],
              ...rows,
            ]);
            await summary.write();
            core.setOutput('merged', JSON.stringify(merged));
