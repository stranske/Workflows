name: Keepalive Loop Reporter

on:
  workflow_run:
    workflows: ["Agents Gate Followups"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: >-
    keepalive-loop-reporter-${{ github.event.workflow_run.pull_requests[0].number ||
    github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    name: Report keepalive completion
    if: vars.USE_CONSOLIDATED_WORKFLOWS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout keepalive scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            scripts/state_fingerprint.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Compute state fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          if [ -z "${PR_NUMBER:-}" ]; then
            {
              echo "should_run=true"
              echo "reason=no-pr-context"
              echo "current_hash="
              echo "prior_hash="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' > /tmp/state-fingerprint-inputs.json
          import hashlib
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          run = event.get("workflow_run") or {}
          run_state = {
              "pr_number": int(os.environ["PR_NUMBER"]),
              "head_sha": run.get("head_sha") or "",
              "status": run.get("status") or "",
              "conclusion": run.get("conclusion") or "",
          }
          state_hash = hashlib.sha256(
              json.dumps(run_state, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          print(json.dumps({"keepalive_run_state_hash": state_hash}, sort_keys=True))
          PY

          python scripts/state_fingerprint.py compare \
            --workflow "${GITHUB_WORKFLOW}" \
            --inputs "$(cat /tmp/state-fingerprint-inputs.json)" \
            --storage pr-comment

      - name: Report unchanged state skip
        if: steps.fingerprint.outputs.should_run == 'false'
        run: echo "Skipped - ${{ steps.fingerprint.outputs.reason }}"

      - name: Mint KEEPALIVE_APP reporter token
        id: reporter_keepalive_app_token
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.pull_requests[0].number &&
          env.KEEPALIVE_APP_ID != '' &&
          env.KEEPALIVE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        continue-on-error: true
        env:
          KEEPALIVE_APP_ID: ${{ secrets.KEEPALIVE_APP_ID || '' }}
          KEEPALIVE_APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY || '' }}
        with:
          app-id: ${{ env.KEEPALIVE_APP_ID }}
          private-key: ${{ env.KEEPALIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Mint WORKFLOWS_APP reporter token
        id: reporter_workflows_app_token
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.pull_requests[0].number &&
          steps.reporter_keepalive_app_token.outputs.token == '' &&
          env.WORKFLOWS_APP_ID != '' &&
          env.WORKFLOWS_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        env:
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
        with:
          app-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: read
          permission-issues: write
          permission-pull-requests: read

      - name: Require trusted keepalive reporter writer
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.pull_requests[0].number
        env:
          KEEPALIVE_REPORTER_TOKEN: >-
            ${{
              steps.reporter_keepalive_app_token.outputs.token ||
              steps.reporter_workflows_app_token.outputs.token ||
              ''
            }}
        run: |
          if [ -z "$KEEPALIVE_REPORTER_TOKEN" ]; then
            echo "::error::A dedicated keepalive or Workflows App token is required to report trusted keepalive state."
            exit 1
          fi

      - name: Update summary for cancelled/failed runs
        id: update-summary
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          github.event.workflow_run.conclusion != 'success' &&
          github.event.workflow_run.pull_requests[0].number
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          KEEPALIVE_SUMMARY_WRITER: >-
            ${{
              steps.reporter_keepalive_app_token.outputs.token != '' &&
              'stranske-keepalive[bot]' ||
              'agents-workflows-bot[bot]'
            }}
        with:
          github-token: >-
            ${{
              steps.reporter_keepalive_app_token.outputs.token ||
              steps.reporter_workflows_app_token.outputs.token
            }}
          script: |
            const run = context.payload?.workflow_run || {};
            const prNumber = Number(run.pull_requests?.[0]?.number || 0);
            if (!prNumber) {
              core.info('No PR context found; skipping keepalive post summary.');
              return;
            }

            const conclusion = String(run.conclusion || run.status || '').toLowerCase();
            if (!conclusion || conclusion === 'success') {
              core.info(
                `Keepalive run conclusion=${conclusion || 'unknown'}; ` +
                'no post summary needed.'
              );
              return;
            }

            const { loadKeepaliveState } = require('./.github/scripts/keepalive_state.js');
            const { updateKeepaliveLoopSummary } = require('./.github/scripts/keepalive_loop.js');

            const { state } = await loadKeepaliveState({ github, context, prNumber, trace: '' });
            if (!state || state.running !== true) {
              core.info('Keepalive state not marked as running; skipping post summary.');
              return;
            }

            const inputs = {
              pr_number: prNumber,
              action: 'run',
              reason: '',
              gate_conclusion: state.gate_conclusion || '',
              iteration: state.iteration || 0,
              max_iterations: state.max_iterations || 0,
              failure_threshold: state.failure_threshold || 3,
              tasks_total: state.tasks?.total ?? 0,
              tasks_unchecked: state.tasks?.unchecked ?? 0,
              keepalive_enabled: state.keepalive_enabled ?? 'true',
              autofix_enabled: state.autofix_enabled ?? '',
              agent_type: state.agent_type || 'codex',
              trace: state.trace || '',
              run_result: conclusion,
              run_url: run.html_url || '',
              rounds_without_task_completion: state.rounds_without_task_completion || 0,
              trusted_summary_author: process.env.KEEPALIVE_SUMMARY_WRITER || '',
            };

            await updateKeepaliveLoopSummary({ github, context, core, inputs });

      - name: Persist state fingerprint
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          steps.fingerprint.outputs.current_hash != '' &&
          steps.update-summary.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/state_fingerprint.py store \
            --workflow "${GITHUB_WORKFLOW}" \
            --hash "${{ steps.fingerprint.outputs.current_hash }}" \
            --storage pr-comment
