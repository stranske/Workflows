name: Keepalive Loop Reporter

on:
  workflow_run:
    workflows: ["Agents Gate Followups"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: >-
    keepalive-loop-reporter-${{ github.event.workflow_run.pull_requests[0].number ||
    github.run_id }}
  cancel-in-progress: false

jobs:
  report:
    name: Report keepalive completion
    if: vars.USE_CONSOLIDATED_WORKFLOWS == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout keepalive scripts
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: |
            .github/scripts
            scripts/state_fingerprint.py
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Compute state fingerprint
        id: fingerprint
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: |
          if [ -z "${PR_NUMBER:-}" ]; then
            {
              echo "should_run=true"
              echo "reason=no-pr-context"
              echo "current_hash="
              echo "prior_hash="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY' > /tmp/state-fingerprint-inputs.json
          import hashlib
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              event = json.load(handle)
          run = event.get("workflow_run") or {}
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          pr_number = int(os.environ["PR_NUMBER"])
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          api_root = (os.environ.get("GITHUB_API_URL") or "https://api." + "github.com").rstrip("/")
          state_re = re.compile(r"<!--\s*keepalive-state(?::[\w.-]+)?\s+(.*?)\s*-->", re.S)

          def api(path):
              request = urllib.request.Request(f"{api_root}{path}", headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def paged(path):
              results = []
              page = 1
              while True:
                  separator = "&" if "?" in path else "?"
                  query = urllib.parse.urlencode({"per_page": 100, "page": page})
                  batch = api(f"{path}{separator}{query}")
                  results.extend(batch)
                  if len(batch) < 100:
                      return results
                  page += 1

          def stable_keepalive_state():
              comments = paged(f"/repos/{repo}/issues/{pr_number}/comments")
              for comment in reversed(comments):
                  match = state_re.search(comment.get("body") or "")
                  if not match:
                      continue
                  try:
                      state = json.loads(match.group(1))
                  except json.JSONDecodeError:
                      continue
                  tasks = state.get("tasks") if isinstance(state.get("tasks"), dict) else {}
                  failure = state.get("failure") if isinstance(state.get("failure"), dict) else {}
                  return {
                      "running": state.get("running"),
                      "iteration": state.get("iteration"),
                      "max_iterations": state.get("max_iterations"),
                      "failure_threshold": state.get("failure_threshold"),
                      "failure": {
                          "reason": failure.get("reason"),
                          "count": failure.get("count"),
                      },
                      "tasks": {
                          "total": tasks.get("total"),
                          "unchecked": tasks.get("unchecked"),
                      },
                      "keepalive_enabled": state.get("keepalive_enabled"),
                      "autofix_enabled": state.get("autofix_enabled"),
                      "agent_type": state.get("agent_type"),
                      "trace": state.get("trace"),
                      "rounds_without_task_completion": state.get(
                          "rounds_without_task_completion"
                      ),
                  }
              return {}

          run_state = {
              "pr_number": pr_number,
              "head_sha": run.get("head_sha") or "",
              "status": run.get("status") or "",
              "conclusion": run.get("conclusion") or "",
              "keepalive_state": stable_keepalive_state(),
          }
          state_hash = hashlib.sha256(
              json.dumps(run_state, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          print(json.dumps({"keepalive_run_state_hash": state_hash}, sort_keys=True))
          PY

          python scripts/state_fingerprint.py compare \
            --workflow "${GITHUB_WORKFLOW}" \
            --inputs "$(cat /tmp/state-fingerprint-inputs.json)" \
            --storage pr-comment

      - name: Report unchanged state skip
        if: steps.fingerprint.outputs.should_run == 'false'
        run: echo "Skipped - ${{ steps.fingerprint.outputs.reason }}"

      - name: Update summary for cancelled/failed runs
        id: update-summary
        if: steps.fingerprint.outputs.should_run == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const run = context.payload?.workflow_run || {};
            const prNumber = Number(run.pull_requests?.[0]?.number || 0);
            if (!prNumber) {
              core.info('No PR context found; skipping keepalive post summary.');
              return;
            }

            const conclusion = String(run.conclusion || run.status || '').toLowerCase();
            if (!conclusion || conclusion === 'success') {
              core.info(
                `Keepalive run conclusion=${conclusion || 'unknown'}; ` +
                'no post summary needed.'
              );
              return;
            }

            const { loadKeepaliveState } = require('./.github/scripts/keepalive_state.js');
            const { updateKeepaliveLoopSummary } = require('./.github/scripts/keepalive_loop.js');

            const { state } = await loadKeepaliveState({ github, context, prNumber, trace: '' });
            if (!state || state.running !== true) {
              core.info('Keepalive state not marked as running; skipping post summary.');
              return;
            }

            const inputs = {
              pr_number: prNumber,
              action: 'run',
              reason: '',
              gate_conclusion: state.gate_conclusion || '',
              iteration: state.iteration || 0,
              max_iterations: state.max_iterations || 0,
              failure_threshold: state.failure_threshold || 3,
              tasks_total: state.tasks?.total ?? 0,
              tasks_unchecked: state.tasks?.unchecked ?? 0,
              keepalive_enabled: state.keepalive_enabled ?? 'true',
              autofix_enabled: state.autofix_enabled ?? '',
              agent_type: state.agent_type || 'codex',
              trace: state.trace || '',
              run_result: conclusion,
              run_url: run.html_url || '',
              rounds_without_task_completion: state.rounds_without_task_completion || 0,
            };

            await updateKeepaliveLoopSummary({ github, context, core, inputs });

      - name: Persist state fingerprint
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          steps.fingerprint.outputs.current_hash != '' &&
          steps.update-summary.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/state_fingerprint.py store \
            --workflow "${GITHUB_WORKFLOW}" \
            --hash "${{ steps.fingerprint.outputs.current_hash }}" \
            --storage pr-comment
