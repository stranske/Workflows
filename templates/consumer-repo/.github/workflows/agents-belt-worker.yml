# Agent-agnostic alias for agents-72-codex-belt-worker.
# Keeps the old filename working while new callers use this name.
name: Agents Belt Worker

on:
  workflow_call:
    inputs:
      agent_key:
        description: 'Agent key for this belt run'
        required: false
        default: 'codex'
        type: string
      issue:
        description: 'Issue number'
        required: true
        type: string
      branch:
        description: 'Branch to prepare'
        required: true
        type: string
      base:
        description: 'Base branch'
        required: false
        default: ''
        type: string
      source:
        description: 'Source of invocation'
        required: false
        default: 'orchestrator'
        type: string
      dry_run:
        description: 'Preview actions without writes'
        required: false
        default: false
        type: boolean
      use_step_branch:
        description: 'Allow fallback step branch'
        required: false
        default: false
        type: boolean
      max_parallel:
        description: 'Max concurrent runs'
        required: false
        default: 1
        type: number
      keepalive:
        description: 'Keepalive sweep origin'
        required: false
        default: false
        type: boolean
    secrets:
      ACTIONS_BOT_PAT:
        required: false
      SERVICE_BOT_PAT:
        required: false
      OWNER_PR_PAT:
        required: false
      OPENAI_API_KEY:
        required: false
      CODEX_AUTH_JSON:
        required: false
      CLAUDE_AUTH_JSON:
        required: false
      WORKFLOWS_APP_ID:
        required: false
      WORKFLOWS_APP_PRIVATE_KEY:
        required: false
      KEEPALIVE_APP_ID:
        required: false
      KEEPALIVE_APP_PRIVATE_KEY:
        required: false
    outputs:
      pr_number:
        description: 'PR number'
        value: ${{ jobs.delegate.outputs.pr_number }}
      pr_url:
        description: 'PR URL'
        value: ${{ jobs.delegate.outputs.pr_url }}
      head_sha:
        description: 'Head SHA'
        value: ${{ jobs.delegate.outputs.head_sha }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  delegate:
    uses: ./.github/workflows/agents-72-codex-belt-worker.yml
    with:
      agent_key: ${{ inputs.agent_key }}
      issue: ${{ inputs.issue }}
      branch: ${{ inputs.branch }}
      base: ${{ inputs.base }}
      source: ${{ inputs.source }}
      dry_run: ${{ inputs.dry_run }}
      use_step_branch: ${{ inputs.use_step_branch }}
      max_parallel: ${{ inputs.max_parallel }}
      keepalive: ${{ inputs.keepalive }}
    secrets: inherit
