name: List LLM Models

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'OpenAI catalog lookup (both and github-models are legacy choices)'
        required: true
        type: choice
        options:
          - both
          - github-models
          - openai
        default: 'both'

permissions:
  contents: read

jobs:
  list-models:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve provider choice
        id: provider
        env:
          PROVIDER: ${{ inputs.provider }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          set -euo pipefail
          case "$PROVIDER" in
            both|github-models)
              echo 'GitHub Models and its catalog retired on July 30, 2026.' | tee -a "$GITHUB_STEP_SUMMARY"
              if [[ "$PROVIDER" == 'github-models' ]]; then
                exit 1
              fi
              ;;
            openai) ;;
            *)
              echo 'Select openai to look up the OpenAI catalog.' | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
          esac
          if [[ "$ON_DEFAULT_BRANCH" != 'true' ]]; then
            echo 'Run the OpenAI lookup from the repository default branch.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Determine catalog visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PRIVATE: ${{ github.event.repository.private }}
        run: |
          set -euo pipefail
          private_catalog=false
          if [[ "$EVENT_PRIVATE" == 'true' ]]; then
            visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility 2>/dev/null) || visibility=unknown
            if [[ "$visibility" == 'private' ]]; then
              private_catalog=true
            else
              echo 'Private visibility could not be confirmed. Using the public verifier subset.' | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          printf 'private=%s\n' "$private_catalog" >> "$GITHUB_OUTPUT"

      - name: Checkout public verifier registry
        if: steps.visibility.outputs.private != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: config/model_registry.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: List OpenAI Models
        id: openai
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PRIVATE_CATALOG: ${{ steps.visibility.outputs.private }}
        run: |
          set -euo pipefail
          umask 077
          report() { printf '%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          if [[ -z "$OPENAI_API_KEY" ]]; then
            report 'OpenAI lookup unavailable. Configure the OPENAI_API_KEY secret.'
            exit 1
          fi
          response=$(mktemp "$RUNNER_TEMP/openai-models.XXXXXX")
          trap 'rm -f "$response"' EXIT
          if ! curl --disable --fail --silent --max-time 30 --output "$response" \
            --header "Authorization: Bearer $OPENAI_API_KEY" https://api.openai.com/v1/models; then
            report 'OpenAI model lookup failed. Check the configured key and provider access.'
            exit 1
          fi
          if ! jq -se 'length == 1 and (.[0] | type == "object" and .error == null and
            (.data | type == "array") and all(.data[]; type == "object" and (.id | type == "string" and length > 0)))' \
            "$response" >/dev/null 2>&1; then
            report 'OpenAI returned an invalid model catalog response.'
            exit 1
          fi
          if jq -e '.data | length == 0' "$response" >/dev/null; then
            report 'OpenAI returned no models for the configured key.'
            exit 0
          fi
          if [[ "$PRIVATE_CATALOG" == 'true' ]]; then
            cp "$response" "$RUNNER_TEMP/openai-model-catalog.json"
            echo 'artifact=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          registry="$GITHUB_WORKSPACE/config/model_registry.json"
          if ! jq -e '.models | type == "array"' "$registry" >/dev/null 2>&1; then
            report 'The public verifier registry is missing or invalid.'
            exit 1
          fi
          models=$(jq -r --slurpfile registry "$registry" '
            [$registry[0].models[] | select(type == "object" and .provider == "openai") | .model_id |
              select(type == "string" and test("^[a-zA-Z0-9._-]+$"))] as $allowlist |
            [.data[].id | select(. as $id | $allowlist | index($id) != null)] | unique | .[] |
            "- `\(.)`"
          ' "$response")
          report '### OpenAI models in the public verifier subset'
          if [[ -z "$models" ]]; then
            report 'OpenAI returned no models that match the public verifier registry.'
          else
            report "$models"
          fi

      - name: Confirm private catalog destination
        id: confirm_private
        if: github.event.repository.private == true && steps.visibility.outputs.private == 'true' && steps.openai.outputs.artifact == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility 2>/dev/null) || visibility=unknown
          if [[ "$visibility" != 'private' ]]; then
            rm -f "$RUNNER_TEMP/openai-model-catalog.json"
            echo 'Private visibility could not be confirmed at upload. No full catalog was published.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'confirmed=true' >> "$GITHUB_OUTPUT"

      - name: Upload private OpenAI model catalog
        id: upload
        if: steps.confirm_private.outputs.confirmed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openai-model-catalog
          path: ${{ runner.temp }}/openai-model-catalog.json
          if-no-files-found: error
          retention-days: 1

      - name: Report uploaded private catalog
        if: steps.upload.outcome == 'success'
        run: echo 'Download the full catalog from the private OpenAI model catalog artifact.' | tee -a "$GITHUB_STEP_SUMMARY"
