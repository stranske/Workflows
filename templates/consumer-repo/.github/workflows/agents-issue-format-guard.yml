name: Agents Issue Format Guard

# Fleet-wide gate: an issue that the automated lanes cannot process must not sit
# silently in a repo.
#
# Every lane reaches an issue through a LABEL. An issue filed with no label and
# no Tasks/Acceptance block is therefore invisible to the whole pipeline —
# nothing validates it, nothing optimises it, nothing claims it. Local
# automation that files *findings* rather than *work orders* produces exactly
# that: good evidence, permanently unactionable. (Observed in Fine-Art-Archive
# #406-409 — four audit findings, zero labels, no Tasks section between them.)
#
# This guard deliberately does NOT rewrite the issue. It applies `agents:format`,
# the label the existing Agents Issue Optimizer already listens for, so a
# non-conforming issue is ROUTED to the machinery that repairs it. `agents:formatted`
# marks an issue already handled so the guard never fights the optimizer's edits.
#
# Self-contained: the validator is pure-stdlib Python synced alongside this file
# at .github/scripts/issue_format.py, so there is no install step and no
# dependency on the consumer repo's own language or packaging.

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to (re)check"
        required: true
        type: string

permissions:
  issues: write
  contents: read

concurrency:
  group: issue-format-guard-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve issue
        id: iss
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          set -euo pipefail
          gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" \
            --json number,body,labels,state,author > issue.json
          jq -r '.body // ""' issue.json > body.md
          # Not every issue is meant to be a work order, and a guard that nags on
          # ones that never will be is a guard people learn to ignore. Exempt:
          #   * tracker:durable / wontfix — deliberately long-lived records
          #   * bot authors (Renovate's Dependency Dashboard, Dependabot)
          #   * bodies that declare themselves undispatchable
          EXEMPT=false
          if jq -e '[.labels[].name] | any(. == "tracker:durable" or . == "wontfix")' \
               issue.json >/dev/null; then EXEMPT=true; fi
          if jq -er '.author.login // ""' issue.json 2>/dev/null \
               | grep -qiE '(\[bot\]|^renovate$|^dependabot$)'; then EXEMPT=true; fi
          if grep -qiE 'do not dispatch|not a (repo|cloud) coding task' body.md; then EXEMPT=true; fi
          {
            echo "number=$NUM"
            echo "exempt=$EXEMPT"
            echo "formatted=$(jq -r '[.labels[].name] | index("agents:formatted") != null' issue.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate against AGENT_ISSUE_FORMAT
        id: validate
        if: steps.iss.outputs.formatted != 'true' && steps.iss.outputs.exempt != 'true'
        run: |
          set +e
          if [[ ! -f .github/scripts/issue_format.py ]]; then
            # The validator syncs with this workflow; if it is absent the repo is
            # mid-sync. Skip rather than block issue filing on a partial sync.
            echo "validator absent — skipping (repo mid-sync?)"
            echo "rc=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/issue_format.py body.md > report.md
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat report.md

      - name: Route non-conforming issue to the optimizer
        if: steps.iss.outputs.formatted != 'true' && steps.iss.outputs.exempt != 'true' && steps.validate.outputs.rc == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.iss.outputs.number }}
        run: |
          set -euo pipefail
          # Comment once per body revision, so an edit burst cannot spam the thread.
          FP="$(sha256sum body.md | cut -c1-12)"
          if gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json comments \
               --jq '.comments[].body' | grep -qF "format-guard:$FP"; then
            echo "Already reported for this body revision ($FP)."
          else
            {
              cat report.md
              echo
              echo "Applying \`agents:format\` so the Agents Issue Optimizer can"
              echo "restructure this into an agent-processable work order."
              echo
              echo "<!-- format-guard:$FP -->"
            } | gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body-file -
          fi
          # Tolerate a repo whose label set predates agents:format rather than failing.
          gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --add-label "agents:format" \
            || echo "::warning::could not apply agents:format (label missing in this repo?)"

      - name: Clear the flag when an issue now conforms
        if: steps.iss.outputs.formatted != 'true' && steps.iss.outputs.exempt != 'true' && steps.validate.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ steps.iss.outputs.number }}
        run: |
          set -euo pipefail
          if gh issue view "$NUM" --repo "$GITHUB_REPOSITORY" --json labels \
               --jq '.labels[].name' | grep -qx 'agents:format'; then
            gh issue edit "$NUM" --repo "$GITHUB_REPOSITORY" --remove-label "agents:format" \
              || true
            echo "Conforms now — cleared agents:format."
          fi
