# Protects the agents workflow suite. This guard runs on pull_request for normal
# checks and on pull_request_target to apply safety gates before any privileged
# context is used. Do not remove the safety step – it ensures we never checkout
# untrusted refs or log repository secrets when running with elevated tokens.
name: Health 45 Agents Guard

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  pull_request_target:
    types:
      - labeled
      - unlabeled

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: agents-guard-status-${{ github.event.pull_request.head.sha || github.run_id }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout eligibility action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: >-
            ${{ github.event.pull_request.base.sha ||
            github.sha ||
            github.event.repository.default_branch ||
            github.event.workflow_run.repository.default_branch }}
          sparse-checkout: .github/actions/agent-event-eligibility
          sparse-checkout-cone-mode: false

      # Escape hatch: set mode: warning if false-negative skips appear post-merge.
      - name: Resolve trusted registry routing labels
        id: registry
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            async function readTrustedRegistry(parameters) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  return await github.rest.repos.getContent(parameters);
                } catch (error) {
                  const status = error?.status || error?.response?.status;
                  const headers = error?.response?.headers || {};
                  const limited = status === 403 && String(headers['x-ratelimit-remaining']) === '0';
                  const retryable = !status || status === 429 || limited || (status >= 500 && status < 600);
                  if (!retryable || attempt === 3) throw error;
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }
            }
            function routingLabelsFromRegistry(text) {
              // Parse only the canonical agents mapping, never execute registry contents.
              const labels = new Set(['agent:auto', 'agent:copilot', 'agents:auto-pilot', 'agents:keepalive']);
              const agents = new Map();
              let inAgents = false;
              let sections = 0;
              let key = null;
              let enabledSeen = false;
              for (const raw of String(text).split(/\r?\n/)) {
                const line = raw.replace(/\s+#.*$/, '').replace(/\s+$/, '');
                if (!line.trim() || line.trimStart().startsWith('#')) continue;
                if (line.includes('\t')) throw new Error('Agent registry tabs are unsupported');
                if (/^agents:\s*$/.test(line)) { inAgents = true; sections++; key = null; continue; }
                if (/^\S/.test(line)) { inAgents = false; key = null; continue; }
                if (!inAgents) continue;
                const entry = line.match(/^  ([a-z][a-z0-9_-]*):\s*$/);
                if (entry) {
                  key = entry[1];
                  if (agents.has(key)) throw new Error('Duplicate agent registry entry');
                  agents.set(key, true);
                  enabledSeen = false;
                  continue;
                }
                if (/^  \S/.test(line) || !key) throw new Error('Malformed agent registry entry');
                if (/^    enabled:/.test(line)) {
                  const value = line.match(/^    enabled:\s*(true|false)$/);
                  if (!value || enabledSeen) throw new Error('Malformed agent enabled flag');
                  enabledSeen = true;
                  agents.set(key, value[1] === 'true');
                }
              }
              if (sections !== 1 || agents.size === 0) throw new Error('Agent registry mapping is incomplete');
              for (const [agent, enabled] of agents) if (enabled) labels.add(`agent:${agent}`);
              return labels;
            }
            try {
              const ref = context.payload.pull_request?.base?.sha;
              if (!/^[0-9a-f]{40}$/.test(ref || '')) throw new Error('Trusted registry base SHA is missing');
              const registry = (await readTrustedRegistry({
                ...context.repo, path: '.github/agents/registry.yml', ref,
              })).data;
              if (registry?.type !== 'file' || registry.encoding !== 'base64') throw new Error('Agent registry evidence is incomplete');
              const routing = routingLabelsFromRegistry(Buffer.from(registry.content, 'base64').toString('utf8'));
              core.setOutput('routing_labels', [...routing].sort().join(','));
            } catch (error) {
              core.setFailed(`Unable to resolve trusted routing labels: ${error.message}`);
              throw error;
            }

      - name: Check event eligibility
        id: eligibility
        uses: ./.github/actions/agent-event-eligibility
        with:
          expected-labels: ${{ steps.registry.outputs.routing_labels }}
          expected-actions: opened,reopened,synchronize,ready_for_review,labeled,unlabeled
          custom-predicate: pull_request

      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        if: steps.eligibility.outputs.should-run == 'true'
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Checkout base ref for safety validation
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/agents-guard.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/error_classifier.js
            .github/scripts/package.json
            .github/scripts/package-lock.json
            .github/scripts/node_modules/minimatch
            .github/scripts/node_modules/minimatch/**
            .github/scripts/token_load_balancer.js
            .github/workflows/agents-guard.yml

      - name: Check API client action (base)
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          github.event_name == 'pull_request_target'
        id: api_client_base
        run: |
          if [ -f .github/actions/setup-api-client/action.yml ] || \
            [ -f .github/actions/setup-api-client/action.yaml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup API client
        if: >-
          github.event_name == 'pull_request_target' &&
          steps.eligibility.outputs.should-run == 'true' &&
          steps.api_client_base.outputs.available == 'true'
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}

      - name: Setup API client (Workflows fallback)
        if: >-
          github.event_name == 'pull_request_target' &&
          steps.eligibility.outputs.should-run == 'true' &&
          steps.api_client_base.outputs.available != 'true'
        uses: "stranske/Workflows/.github/actions/setup-api-client@d6c9961a3498e89ca6c1ce6fccc1c0dbb773d8db" # v1.30.4
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}

      - name: Verify pull_request_target safety invariants
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          github.event_name == 'pull_request_target'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const guardPath = path.resolve(workspace, '.github/scripts/agents-guard.js');
            const { validatePullRequestTargetSafety } = require(guardPath);

            validatePullRequestTargetSafety({
              eventName: context.eventName,
              workflowPath: '.github/workflows/agents-guard.yml',
              workspaceRoot: workspace,
            });

      - name: Checkout PR head for pull_request event
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/agents-guard.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/error_classifier.js
            .github/scripts/package.json
            .github/scripts/package-lock.json
            .github/scripts/node_modules/minimatch
            .github/scripts/node_modules/minimatch/**
            .github/scripts/token_load_balancer.js
            .github/workflows/agents-guard.yml
      - name: Check API client action (head)
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          github.event_name == 'pull_request'
        id: api_client_head
        run: |
          if [ -f .github/actions/setup-api-client/action.yml ] || \
            [ -f .github/actions/setup-api-client/action.yaml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup API client
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          github.event_name == 'pull_request' &&
          steps.api_client_head.outputs.available == 'true'
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}

      - name: Setup API client (Workflows fallback)
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          github.event_name == 'pull_request' &&
          steps.api_client_head.outputs.available != 'true'
        uses: "stranske/Workflows/.github/actions/setup-api-client@d6c9961a3498e89ca6c1ce6fccc1c0dbb773d8db" # v1.30.4
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}
      - name: Evaluate protected file changes
        if: steps.eligibility.outputs.should-run == 'true'
        id: evaluate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const guardRelativePath = '.github/scripts/agents-guard.js';
            const guardPath = path.resolve(workspace, guardRelativePath);
            const gh = github;
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { github: api, withRetry, paginateWithRetry } = await createTokenAwareRetry({
              github: gh,
              core,
              env: process.env,
              task: 'agents-guard',
              capabilities: ['contents:read', 'issues:read', 'pull-requests:read'],
            });
            const prNumber = context.payload.pull_request.number;
            const authorLogin =
              context.payload.pull_request.user &&
              context.payload.pull_request.user.login;
            const authorAssociation =
              context.payload.pull_request.author_association || '';
            const { owner, repo } = context.repo;
            const baseRef = context.payload.pull_request.base.sha;
            const labelName = 'agents:allow-change';
            const protectedPaths = [
              '.github/workflows/agents-*.yml',
            ];
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            async function withApiRetry(
              fn,
              { label = 'operation', maxAttempts = 5, baseDelay = 1000 } = {},
            ) {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await withRetry((client) => fn(client));
                } catch (error) {
                  const status = error?.status || error?.response?.status;
                  const headers = error?.response?.headers || {};
                  const remainingRaw =
                    headers['x-ratelimit-remaining'] ?? headers['X-RateLimit-Remaining'];
                  const resetRaw = headers['x-ratelimit-reset'] ?? headers['X-RateLimit-Reset'];
                  const remaining = Number(remainingRaw);
                  const reset = Number(resetRaw);
                  const hasRemainingValue = Number.isFinite(remaining);
                  const hasResetValue = Number.isFinite(reset);
                  const isRateLimit = status === 403 && hasRemainingValue && remaining <= 0;
                  const retryable =
                    isRateLimit ||
                    status === 429 ||
                    !status ||
                    (status >= 500 && status < 600);
                  if (!retryable || attempt === maxAttempts) {
                    core.error(`Failed ${label}: ${error.message}`);
                    throw error;
                  }
                  let delay = baseDelay * attempt;
                  const retryAfterRaw = headers['retry-after'] ?? headers['Retry-After'];
                  const retryAfterSeconds = Number(retryAfterRaw);
                  if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0) {
                    delay = Math.max(delay, retryAfterSeconds * 1000);
                  } else if (isRateLimit && hasResetValue) {
                    const nowSeconds = Math.floor(Date.now() / 1000);
                    if (reset > nowSeconds) {
                      const untilReset = (reset - nowSeconds) * 1000 + 500;
                      delay = Math.max(delay, untilReset);
                    }
                  }
                  delay = Math.max(delay, 1000);
                  const humanDelay = delay >= 60000
                    ? `${(delay / 60000).toFixed(2)}m`
                    : `${Math.round(delay)}ms`;
                  core.warning(
                    `Retrying ${label} after ${humanDelay} ` +
                      `(attempt ${attempt + 1}/${maxAttempts}).`
                  );
                  await sleep(delay);
                }
              }
              throw new Error(`Failed ${label} after ${maxAttempts} attempts.`);
            }

            const rateLimitNotes = [];
            const isRateLimitError = (error) => {
              if (!error) {
                return false;
              }
              const status = Number(error?.status || error?.code || error?.response?.status || 0);
              if (status === 429) {
                return true;
              }
              if (status === 403) {
                const message = String(
                  error.message || error?.response?.data?.message || ''
                ).toLowerCase();
                return message.includes('rate limit');
              }
              return false;
            };

            const warnRateLimit = (stage, fallbackDetail = 'continuing with partial data') => {
              const note = `Rate limit encountered while ${stage}; ${fallbackDetail}.`;
              core.warning(note);
              rateLimitNotes.push(`- ${note}`);
            };

            async function loadGuardModule() {
              if (fs.existsSync(guardPath)) {
                return require(guardPath);
              }

              core.info(
                `Guard script missing locally; fetching ${guardRelativePath} at ${baseRef}`
              );
              try {
                const response = await withApiRetry(
                  (client) => client.rest.repos.getContent({
                    owner,
                    repo,
                    path: guardRelativePath,
                    ref: baseRef,
                  }),
                  { label: `load ${guardRelativePath}` },
                );

                if (Array.isArray(response.data) || response.data.type !== 'file') {
                  throw new Error(`Unable to load ${guardRelativePath} from ${baseRef}`);
                }

                const encoding = response.data.encoding || 'base64';
                const source = Buffer.from(response.data.content || '', encoding).toString('utf-8');

                fs.mkdirSync(path.dirname(guardPath), { recursive: true });
                fs.writeFileSync(guardPath, source, { encoding: 'utf-8' });
                return require(guardPath);
              } catch (error) {
                if (isRateLimitError(error)) {
                  warnRateLimit(
                    'loading the guard script from the default branch',
                    'using the checkout copy instead',
                  );
                  if (fs.existsSync(guardPath)) {
                    return require(guardPath);
                  }
                }
                throw error;
              }
            }

            const guardModule = await loadGuardModule();
            const { evaluateGuard, DEFAULT_MARKER } = guardModule;
            const marker = DEFAULT_MARKER || '<!-- agents-guard-marker -->';

            async function safePaginate(label, fn, params) {
              try {
                return await withApiRetry(
                  () => paginateWithRetry(fn, params),
                  { label },
                );
              } catch (error) {
                if (isRateLimitError(error)) {
                  warnRateLimit(label, 'falling back to an empty result set');
                  return [];
                }
                throw error;
              }
            }

            const files = await safePaginate(
              'listing pull request files',
              api.rest.pulls.listFiles,
              {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
              },
            );

            const labels = await safePaginate(
              'enumerating labels on the pull request',
              api.rest.issues.listLabelsOnIssue,
              {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
              },
            );

            const reviews = await safePaginate(
              'enumerating reviews',
              api.rest.pulls.listReviews,
              {
              owner,
              repo,
              pull_number: prNumber,
              per_page: 100,
              },
            );

            let codeownersContent = '';
            try {
              const response = await withApiRetry(
                (client) => client.rest.repos.getContent({
                  owner,
                  repo,
                  path: '.github/CODEOWNERS',
                  ref: baseRef,
                }),
                { label: 'load CODEOWNERS' },
              );

              if (!Array.isArray(response.data) && response.data.type === 'file') {
                const encoding = response.data.encoding || 'utf-8';
                const rawContent = response.data.content || '';
                codeownersContent = Buffer.from(rawContent, encoding).toString('utf-8');
              }
            } catch (error) {
              if (isRateLimitError(error)) {
                warnRateLimit('loading CODEOWNERS', 'continuing without CODEOWNERS context');
              } else {
                core.warning(`Failed to load CODEOWNERS: ${error.message}`);
              }
            }

            const result = evaluateGuard({
              files,
              labels,
              reviews,
              codeownersContent,
              protectedPaths,
              labelName,
              authorLogin,
              authorAssociation,
              marker,
            });

            core.setOutput('blocked', result.blocked ? 'true' : 'false');
            core.setOutput('evaluated_labels', JSON.stringify(labels));
            async function readTrustedRegistry(parameters) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  return await github.rest.repos.getContent(parameters);
                } catch (error) {
                  const status = error?.status || error?.response?.status;
                  const headers = error?.response?.headers || {};
                  const limited = status === 403 && String(headers['x-ratelimit-remaining']) === '0';
                  const retryable = !status || status === 429 || limited || (status >= 500 && status < 600);
                  if (!retryable || attempt === 3) throw error;
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }
            }
            function routingLabelsFromRegistry(text) {
              // Parse only the canonical agents mapping, never execute registry contents.
              const labels = new Set(['agent:auto', 'agent:copilot', 'agents:auto-pilot', 'agents:keepalive']);
              const agents = new Map();
              let inAgents = false;
              let sections = 0;
              let key = null;
              let enabledSeen = false;
              for (const raw of String(text).split(/\r?\n/)) {
                const line = raw.replace(/\s+#.*$/, '').replace(/\s+$/, '');
                if (!line.trim() || line.trimStart().startsWith('#')) continue;
                if (line.includes('\t')) throw new Error('Agent registry tabs are unsupported');
                if (/^agents:\s*$/.test(line)) { inAgents = true; sections++; key = null; continue; }
                if (/^\S/.test(line)) { inAgents = false; key = null; continue; }
                if (!inAgents) continue;
                const entry = line.match(/^  ([a-z][a-z0-9_-]*):\s*$/);
                if (entry) {
                  key = entry[1];
                  if (agents.has(key)) throw new Error('Duplicate agent registry entry');
                  agents.set(key, true);
                  enabledSeen = false;
                  continue;
                }
                if (/^  \S/.test(line) || !key) throw new Error('Malformed agent registry entry');
                if (/^    enabled:/.test(line)) {
                  const value = line.match(/^    enabled:\s*(true|false)$/);
                  if (!value || enabledSeen) throw new Error('Malformed agent enabled flag');
                  enabledSeen = true;
                  agents.set(key, value[1] === 'true');
                }
              }
              if (sections !== 1 || agents.size === 0) throw new Error('Agent registry mapping is incomplete');
              for (const [agent, enabled] of agents) if (enabled) labels.add(`agent:${agent}`);
              return labels;
            }
            const registryRef = baseRef;
            if (!/^[0-9a-f]{40}$/.test(registryRef || '')) throw new Error('Trusted registry base SHA is missing');
            let registry;
            try {
              registry = (await readTrustedRegistry({
                owner, repo, path: '.github/agents/registry.yml', ref: registryRef,
              })).data;
            } catch (error) {
              core.setFailed(`Unable to read trusted agent registry: ${error.message}`);
              throw error;
            }
            if (registry?.type !== 'file' || registry.encoding !== 'base64') throw new Error('Agent registry evidence is incomplete');
            const evaluatedRoutingLabels = routingLabelsFromRegistry(Buffer.from(registry.content, 'base64').toString('utf8'));
            if (!Array.isArray(labels)) throw new Error('Evaluated labels are incomplete.');
            const evaluatedPolicyLabels = [...new Set(labels.map(label => {
              if (typeof label?.name !== 'string') throw new Error('Evaluated labels are malformed.');
              const raw = label.name;
              const routing = raw.trim().toLowerCase();
              return evaluatedRoutingLabels.has(routing) ? routing
                : raw.toLowerCase() === 'agents:allow-change' ? 'agents:allow-change' : '';
            }).filter(Boolean))].sort();
            core.setOutput('evaluated_policy_sha256', require('crypto').createHash('sha256')
              .update(evaluatedPolicyLabels.join(String.fromCharCode(10))).digest('hex'));
            let summary = result.summary;
            if (rateLimitNotes.length) {
              const noteBlock = `\n\nRate limit notices:\n${rateLimitNotes.join('\n')}`;
              summary = summary
                ? `${summary}${noteBlock}`
                : `Rate limit notices:\n${rateLimitNotes.join('\n')}`;
            }

            core.setOutput('summary', summary);
            core.setOutput('marker', marker);

            if (result.commentBody) {
              core.setOutput(
                'comment_body_b64',
                Buffer.from(result.commentBody).toString('base64')
              );
            }

            for (const warning of result.warnings || []) {
              core.warning(warning);
            }

      - name: Post guard failure comment
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          steps.evaluate.outputs.blocked == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          COMMENT_BODY_B64: ${{ steps.evaluate.outputs.comment_body_b64 }}
          COMMENT_MARKER: ${{ steps.evaluate.outputs.marker }}
        with:
          script: |
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const guardPath = path.resolve(workspace, '.github/scripts/agents-guard.js');
            const gh = github;
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry, paginateWithRetry } = await createTokenAwareRetry({
              github: gh,
              core,
              env: process.env,
              task: 'agents-guard',
              capabilities: ['issues:read', 'issues:write'],
            });

            let defaultMarker = '<!-- agents-guard-marker -->';
            try {
              const loaded = require(guardPath);
              if (
                loaded &&
                typeof loaded.DEFAULT_MARKER === 'string' &&
                loaded.DEFAULT_MARKER.trim()
              ) {
                defaultMarker = loaded.DEFAULT_MARKER.trim();
              }
            } catch (error) {
              core.warning(`Failed to load guard marker; using default: ${error.message}`);
            }

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            async function withApiRetry(
              fn,
              { label = 'operation', maxAttempts = 5, baseDelay = 1000 } = {},
            ) {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await withRetry(fn);
                } catch (error) {
                  const status = error?.status || error?.response?.status;
                  const headers = error?.response?.headers || {};
                  const remainingRaw =
                    headers['x-ratelimit-remaining'] ?? headers['X-RateLimit-Remaining'];
                  const resetRaw = headers['x-ratelimit-reset'] ?? headers['X-RateLimit-Reset'];
                  const remaining = Number(remainingRaw);
                  const reset = Number(resetRaw);
                  const isRateLimit =
                    status === 403 && Number.isFinite(remaining) && remaining <= 0;
                  const retryable =
                    isRateLimit ||
                    status === 429 ||
                    !status ||
                    (status >= 500 && status < 600);
                  if (!retryable || attempt === maxAttempts) {
                    core.error(`Failed ${label}: ${error.message}`);
                    throw error;
                  }
                  let delay = baseDelay * attempt;
                  const retryAfterRaw = headers['retry-after'] ?? headers['Retry-After'];
                  const retryAfterSeconds = Number(retryAfterRaw);
                  if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0) {
                    delay = Math.max(delay, retryAfterSeconds * 1000);
                  } else if (isRateLimit && Number.isFinite(reset)) {
                    const nowSeconds = Math.floor(Date.now() / 1000);
                    if (reset > nowSeconds) {
                      const untilReset = (reset - nowSeconds) * 1000 + 500;
                      delay = Math.max(delay, untilReset);
                    }
                  }
                  delay = Math.max(delay, 1000);
                  const humanDelay = delay >= 60000
                    ? `${(delay / 60000).toFixed(2)}m`
                    : `${Math.round(delay)}ms`;
                  core.warning(
                    `Retrying ${label} after ${humanDelay} ` +
                      `(attempt ${attempt + 1}/${maxAttempts}).`
                  );
                  await sleep(delay);
                }
              }
              throw new Error(`Failed ${label} after ${maxAttempts} attempts.`);
            }

            const marker = (process.env.COMMENT_MARKER || '').trim() || defaultMarker;
            if (!marker) {
              core.warning('Resolved guard marker is empty; comment updates may duplicate.');
            }
            const body = Buffer.from(
              process.env.COMMENT_BODY_B64 || '',
              'base64'
            ).toString('utf-8');
            if (!body) {
              core.warning('No comment body was provided.');
              return;
            }

            const markedBody = marker && !body.includes(marker)
              ? `${marker}\n\n${body}`
              : body;

            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;

            const existingComments = await withApiRetry(
              () => paginateWithRetry(
                gh.rest.issues.listComments,
                {
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100,
                }
              ),
              { label: 'list guard comments' },
            );

            const alreadyPosted = marker
              ? existingComments.find((comment) => comment.body && comment.body.includes(marker))
              : null;
            if (alreadyPosted) {
              if (alreadyPosted.body !== markedBody) {
                await withApiRetry(
                  (client) => client.rest.issues.updateComment({
                    owner,
                    repo,
                    comment_id: alreadyPosted.id,
                    body: markedBody,
                  }),
                  { label: 'update guard comment' },
                );
              }
              return;
            }

            await withApiRetry(
              (client) => client.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body: markedBody,
              }),
              { label: 'create guard comment' },
            );

      - name: "Evaluated policy labels sha256:${{ steps.evaluate.outputs.evaluated_policy_sha256 }}"
        if: ${{ steps.evaluate.outcome == 'success' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: core.info('Evaluated policy label digest is bound to this run attempt.');

      - name: Report agents guard commit status
        if: >-
          always() && (github.event_name == 'pull_request_target' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ELIGIBLE: ${{ steps.eligibility.outputs.should-run }}
          EVALUATE_OUTCOME: ${{ steps.evaluate.outcome }}
          JOB_STATUS: ${{ job.status }}
          BLOCKED: ${{ steps.evaluate.outputs.blocked }}
          EVALUATED_LABELS: ${{ steps.evaluate.outputs.evaluated_labels }}
          SUMMARY: ${{ steps.evaluate.outputs.summary }}
          TARGET_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          # The publisher executes no checkout code and needs no pooled secrets.
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pullRequest = context.payload.pull_request;
            const sha = pullRequest?.head?.sha;

            if (!sha) {
              core.setFailed('PR head SHA unavailable; cannot publish authoritative guard result.');
              return;
            }

            async function readTrustedRegistry(parameters) {
              for (let attempt = 1; attempt <= 3; attempt += 1) {
                try {
                  return await github.rest.repos.getContent(parameters);
                } catch (error) {
                  const status = error?.status || error?.response?.status;
                  const headers = error?.response?.headers || {};
                  const limited = status === 403 && String(headers['x-ratelimit-remaining']) === '0';
                  const retryable = !status || status === 429 || limited || (status >= 500 && status < 600);
                  if (!retryable || attempt === 3) throw error;
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }
            }
            function routingLabelsFromRegistry(text) {
              // Parse only the canonical agents mapping, never execute registry contents.
              const labels = new Set(['agent:auto', 'agent:copilot', 'agents:auto-pilot', 'agents:keepalive']);
              const agents = new Map();
              let inAgents = false;
              let sections = 0;
              let key = null;
              let enabledSeen = false;
              for (const raw of String(text).split(/\r?\n/)) {
                const line = raw.replace(/\s+#.*$/, '').replace(/\s+$/, '');
                if (!line.trim() || line.trimStart().startsWith('#')) continue;
                if (line.includes('\t')) throw new Error('Agent registry tabs are unsupported');
                if (/^agents:\s*$/.test(line)) { inAgents = true; sections++; key = null; continue; }
                if (/^\S/.test(line)) { inAgents = false; key = null; continue; }
                if (!inAgents) continue;
                const entry = line.match(/^  ([a-z][a-z0-9_-]*):\s*$/);
                if (entry) {
                  key = entry[1];
                  if (agents.has(key)) throw new Error('Duplicate agent registry entry');
                  agents.set(key, true);
                  enabledSeen = false;
                  continue;
                }
                if (/^  \S/.test(line) || !key) throw new Error('Malformed agent registry entry');
                if (/^    enabled:/.test(line)) {
                  const value = line.match(/^    enabled:\s*(true|false)$/);
                  if (!value || enabledSeen) throw new Error('Malformed agent enabled flag');
                  enabledSeen = true;
                  agents.set(key, value[1] === 'true');
                }
              }
              if (sections !== 1 || agents.size === 0) throw new Error('Agent registry mapping is incomplete');
              for (const [agent, enabled] of agents) if (enabled) labels.add(`agent:${agent}`);
              return labels;
            }
            const targetUrl =
              process.env.TARGET_URL ||
              `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            async function withApiRetry(
              fn,
              { label = 'operation', maxAttempts = 5, baseDelay = 1000 } = {},
            ) {
              for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
                try {
                  return await fn(github);
                } catch (error) {
                  const status = error?.status || error?.response?.status;
                  const headers = error?.response?.headers || {};
                  const remainingRaw =
                    headers['x-ratelimit-remaining'] ?? headers['X-RateLimit-Remaining'];
                  const resetRaw = headers['x-ratelimit-reset'] ?? headers['X-RateLimit-Reset'];
                  const remaining = Number(remainingRaw);
                  const reset = Number(resetRaw);
                  const isRateLimit =
                    status === 403 && Number.isFinite(remaining) && remaining <= 0;
                  const retryable =
                    isRateLimit ||
                    status === 429 ||
                    !status ||
                    (status >= 500 && status < 600);
                  if (!retryable || attempt === maxAttempts) {
                    core.error(`Failed ${label}: ${error.message}`);
                    throw error;
                  }
                  let delay = baseDelay * attempt;
                  const retryAfterRaw = headers['retry-after'] ?? headers['Retry-After'];
                  const retryAfterSeconds = Number(retryAfterRaw);
                  if (Number.isFinite(retryAfterSeconds) && retryAfterSeconds > 0) {
                    delay = Math.max(delay, retryAfterSeconds * 1000);
                  } else if (isRateLimit && Number.isFinite(reset)) {
                    const nowSeconds = Math.floor(Date.now() / 1000);
                    if (reset > nowSeconds) {
                      const untilReset = (reset - nowSeconds) * 1000 + 500;
                      delay = Math.max(delay, untilReset);
                    }
                  }
                  delay = Math.max(delay, 1000);
                  const humanDelay = delay >= 60000
                    ? `${(delay / 60000).toFixed(2)}m`
                    : `${Math.round(delay)}ms`;
                  core.warning(
                    `Retrying ${label} after ${humanDelay} ` +
                      `(attempt ${attempt + 1}/${maxAttempts}).`
                  );
                  await sleep(delay);
                }
              }
              throw new Error(`Failed ${label} after ${maxAttempts} attempts.`);
            }

            try {
              let routingLabels;
              try {
                const registryRef = pullRequest?.base?.sha;
                if (!/^[0-9a-f]{40}$/.test(registryRef || '')) throw new Error('Trusted registry base SHA is missing');
                const registry = (await readTrustedRegistry({
                  owner, repo, path: '.github/agents/registry.yml', ref: registryRef,
                })).data;
                if (registry?.type !== 'file' || registry.encoding !== 'base64') throw new Error('Agent registry evidence is incomplete');
                routingLabels = routingLabelsFromRegistry(Buffer.from(registry.content, 'base64').toString('utf8'));
              } catch (error) {
                // Missing trusted policy evidence must replace any earlier
                // same-head success, even after every bounded read retry fails.
                await withApiRetry(client => client.rest.repos.createCommitStatus({
                  owner, repo, sha, state: 'failure',
                  context: 'Health 45 Agents Guard / guard',
                  description: `[guard-pr:${pullRequest.number}] Trusted registry evidence unavailable; fresh evaluation required.`,
                  target_url: targetUrl,
                }), {label: 'invalidate guard status without trusted registry evidence'});
                core.setFailed(`Trusted registry evidence unavailable: ${error.message}`);
                return;
              }
              const permissionLabel = 'agents:allow-change';
              const policyLabelNames = (labels) => {
                if (!Array.isArray(labels)) {
                  throw new Error('PR label evidence is incomplete.');
                }
                const names = labels.map((label) => {
                  if (typeof label?.name !== 'string') {
                    throw new Error('PR label evidence is malformed.');
                  }
                  const raw = label.name;
                  const routing = raw.trim().toLowerCase();
                  if (routingLabels.has(routing)) return routing;
                  return raw.toLowerCase() === permissionLabel ? permissionLabel : '';
                }).filter(Boolean);
                return [...new Set(names)].sort();
              };
              const snapshotLabels = policyLabelNames(pullRequest?.labels);

              const blocked = (process.env.BLOCKED || '').toLowerCase() === 'true';
              const summary = process.env.SUMMARY || '';
              const evaluated = process.env.ELIGIBLE === 'true'
                && process.env.EVALUATE_OUTCOME === 'success'
                && process.env.BLOCKED === 'false';
              const safelySkipped = process.env.ELIGIBLE === 'false';
              const passed = process.env.JOB_STATUS === 'success'
                && (safelySkipped || evaluated) && !blocked;
              let state = passed ? 'success' : 'failure';
              let description = summary || (!passed
                ? 'Health 45 Agents Guard blocked this pull request.'
                : 'Health 45 Agents Guard passed.');

              function setFailure(reason) {
                state = 'failure';
                description = reason;
              }

              async function policyFingerprint(labels) {
                const canonical = labels.join('\n');
                const digest = await crypto.subtle.digest(
                  'SHA-256', new TextEncoder().encode(canonical),
                );
                return Array.from(new Uint8Array(digest))
                  .map((byte) => byte.toString(16).padStart(2, '0'))
                  .join('');
              }

              function finalizeDescription(fingerprint) {
                if (!Number.isSafeInteger(pullRequest.number) || pullRequest.number <= 0) {
                  throw new Error('Current pull request number is missing or invalid.');
                }
                const prefix = `[guard-pr:${pullRequest.number}] `;
                const receipt = state === 'success'
                  ? ` [guard-policy-sha256:${fingerprint}]`
                  : '';
                const maximum = 140 - prefix.length - receipt.length;
                if (description.length > maximum) {
                  description = `${description.slice(0, maximum - 3)}...`;
                }
                description = `${prefix}${description}${receipt}`;
              }

              const currentLabels = await withApiRetry(
                (client) => client.paginate(client.rest.issues.listLabelsOnIssue, {
                  owner, repo, issue_number: pullRequest.number, per_page: 100,
                }),
                { label: 'read current PR labels before publishing guard status' },
              );
              if (!Array.isArray(currentLabels)) {
                throw new Error('Current PR label evidence is incomplete.');
              }
              const currentLabelNames = policyLabelNames(currentLabels);
              const currentPolicyFingerprint = await policyFingerprint(currentLabelNames);
              const labelsChanged =
                JSON.stringify(currentLabelNames) !== JSON.stringify(snapshotLabels);
              if (evaluated && state === 'success') {
                let evaluatedLabelNames;
                try {
                  const evaluatedLabels = JSON.parse(process.env.EVALUATED_LABELS || '');
                  evaluatedLabelNames = policyLabelNames(evaluatedLabels);
                } catch (error) {
                  setFailure('Agents Guard evaluated label evidence is missing or malformed; fresh evaluation required.');
                }
                if (evaluatedLabelNames &&
                    JSON.stringify(evaluatedLabelNames) !== JSON.stringify(currentLabelNames)) {
                  setFailure('PR labels changed after guard evaluation; fresh evaluation required.');
                }
              }
              if (labelsChanged) {
                // Never let a stale eligible evaluation retain a green required
                // context after its routing labels have changed.
                setFailure('PR labels changed after guard evaluation; fresh evaluation required.');
              }
              if (!labelsChanged && process.env.ELIGIBLE === 'false') {
                const statuses = await withApiRetry(
                  (client) => client.paginate(client.rest.repos.listCommitStatusesForRef, {
                    owner, repo, ref: sha, per_page: 100,
                  }),
                  { label: 'read existing exact-head guard status' },
                );
                if (!Array.isArray(statuses)) {
                  throw new Error('Incomplete exact-head status inventory.');
                }
                const existing = statuses.find(
                  (status) => status.context === 'Health 45 Agents Guard / guard',
                );
                if (existing) {
                  if (context.eventName === 'pull_request_target' && existing.state === 'success') {
                    if (typeof existing.description === 'string'
                        && existing.description.startsWith(`[guard-pr:${pullRequest.number}] `)
                        && existing.description.endsWith(` [guard-policy-sha256:${currentPolicyFingerprint}]`)) {
                      core.info('Ineligible PR event: preserving policy-bound exact-head success.');
                      return;
                    }
                    // A changed, missing, or malformed policy receipt cannot
                    // retain a green context. A fresh eligible run may recover it.
                    setFailure('Health 45 Agents Guard policy changed; fresh evaluation required.');
                  } else {
                    core.info('Ineligible PR event: preserving existing exact-head guard verdict.');
                    return;
                  }
                } else if (context.eventName === 'pull_request_target') {
                  core.info('Ineligible PR event: leaving absent exact-head guard verdict absent.');
                  return;
                }
              }
              finalizeDescription(currentPolicyFingerprint);
              await withApiRetry(
                (client) => client.rest.repos.createCommitStatus({
                  owner,
                  repo,
                  sha,
                  state,
                  context: 'Health 45 Agents Guard / guard',
                  description,
                  target_url: targetUrl,
                }),
                { label: 'update guard commit status' },
              );
              core.info(`Updated Health 45 Agents Guard commit status to ${state}.`);
            } catch (error) {
              core.setFailed(
                `Failed to update Health 45 Agents Guard commit status: ${error.message}`
              );
            }

      - name: Fail when guard blocks the pull request
        if: >-
          steps.eligibility.outputs.should-run == 'true' &&
          steps.evaluate.outputs.blocked == 'true'
        env:
          GUARD_SUMMARY: ${{ steps.evaluate.outputs.summary }}
        run: |
          printf '%s\n' "$GUARD_SUMMARY"
          exit 1
