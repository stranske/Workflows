# Consumer-local source-of-truth docs for the weekly docs-drift fix agent.
#
# The fleet registry and scorecard configuration remain Workflows-owned in the
# root config/source_of_truth_docs.yml. Consumers receive only this local
# configuration, so a consumer never inventories unrelated repositories.
consumer:
  docs:
    - path: README.md
      focus: operational overview and execution entry points
    - path: AGENTS.md
      case_insensitive: true
      focus: agent runtime constraints and repo-specific guardrails
