# Insert after the "Set up Python" step in .github/workflows/agents-auto-pilot.yml.
- name: Cache pip (LLM requirements)
  if: steps.check_enabled.outputs.enabled == 'true'
  uses: actions/cache@v4
  with:
    path: |
      ~/.cache/pip
    key: >-
      pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('tools/requirements-llm.txt') }}
    restore-keys: |
      pip-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-
      pip-${{ runner.os }}-

# Replace the existing "Install Python dependencies" step.
- name: Install Python dependencies
  if: steps.check_enabled.outputs.enabled == 'true'
  run: |
    python -m pip install --upgrade pip
    python -m pip install -r tools/requirements-llm.txt
