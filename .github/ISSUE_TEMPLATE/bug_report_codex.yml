name: Bug report
description: Something broke. Keep it factual.
labels: ["bug","risk:low","agent:codex","automerge","codex-ready"]
body:
  - type: markdown
    attributes:
      value: |
        **Agent routing:** This form requests Codex. If you can edit issue labels,
        replace `agent:codex` with `agent:copilot` to request Copilot. Keep one agent label.
  - type: checkboxes
    id: agent_label
    attributes:
      label: Agent label confirmation
      description: Confirm the issue has the label for the agent you want.
      options:
        - label: I verified the issue uses either `agent:codex` or `agent:copilot`, whichever matches the help I need.
          required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Python version, OS, commit hash
      placeholder: "Python 3.14, macOS 14.5, commit abc123"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps, expected vs actual behavior.
      placeholder: |
        1. Action that triggers the problem
        2. What you expected
        3. What happened instead
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for the fix? Call out files, systems, or workflows to touch.
      placeholder: Describe the intended scope.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List concrete tasks for the selected agent and name a file, symbol, or command in each item.
      placeholder: "- [ ] Task 1\n- [ ] Task 2"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Name a regression test or runnable command and the expected result after the fix.
    validations:
      required: true
