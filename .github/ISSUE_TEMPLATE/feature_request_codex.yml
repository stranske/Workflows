name: Feature request
description: Propose a focused change to Workflows or its consumer templates.
labels: ["enhancement","risk:low","agent:codex","automerge","codex-ready"]
body:
  - type: markdown
    attributes:
      value: |
        **Agent routing:** This form requests Codex. If you can edit issue labels,
        replace `agent:codex` with `agent:copilot` to request Copilot. Keep one agent label.
  - type: checkboxes
    id: agent_label
    attributes:
      label: Agent label confirmation
      description: Confirm the issue has the label for the agent you want.
      options:
        - label: I confirmed the labels sidebar shows the appropriate agent (`agent:codex` or `agent:copilot`).
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One-sentence description of the feature.
      placeholder: "Example: Add run status to the weekly metrics report"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for this change? Mention files, systems, or workflows to touch.
      placeholder: Describe the intended scope.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List concrete tasks for the selected agent and name a file, symbol, or command in each item.
      placeholder: "- [ ] Task 1\n- [ ] Task 2"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Name a test or runnable command and the result that confirms the feature works.
    validations:
      required: true
