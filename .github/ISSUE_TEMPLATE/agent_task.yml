name: Agent task
description: Plan a Codex automation task and trigger the issue bridge.
title: "[Agent task] <summary>"
labels:
  - agents
  - agent:codex
body:
  - type: markdown
    attributes:
      value: |
        This form applies the `agents` and `agent:codex` labels. When the issue
        passes intake checks, the bridge posts an invitation with instructions
        for opening the PR. See the [issue format guide](https://github.com/stranske/Workflows/blob/main/docs/ci/ISSUE_FORMAT_GUIDE.md#required-sections)
        for examples of tasks and acceptance criteria.
  - type: textarea
    id: context
    attributes:
      label: Background
      description: What problem are we solving? Link any prior discussions or runs.
      placeholder: Provide the context and link supporting material.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope for this work? Call out files, systems, or workflows to touch.
      placeholder: Describe the intended scope.
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: List the tasks as checkboxes and name a concrete file, symbol, or command in each item.
      placeholder: "- [ ] Task 1\n- [ ] Task 2"
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Acceptance criteria
      description: Name a test or runnable command and the result that shows the work is complete.
      placeholder: "- [ ] Criterion 1\n- [ ] Criterion 2"
    validations:
      required: true
  - type: textarea
    id: guardrails
    attributes:
      label: Out of scope / guardrails
      description: Clarify any boundaries Codex must respect (files to avoid, limits, etc.).
      placeholder: Optional but recommended so the automation stays on track.
  - type: input
    id: target_branch
    attributes:
      label: Target base branch
      description: Optional request for the person opening the PR. The bridge uses the repository default branch. Choose a different base when opening the PR if needed.
      placeholder: "Example: release/1.x"
  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Anything else maintainers should know before Codex runs.
      placeholder: Optional diagnostics, credentials hand-off, or follow-up tasks.
