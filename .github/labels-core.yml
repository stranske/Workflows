# .github/labels-core.yml
# Core functional labels required for the workflow system to operate.
# These labels MUST exist in all consumer repos for agent automation to work.
# Synced via maint-sync-labels.yml workflow.
#
# This is the ONLY label inventory file. Maint 69 Sync Labels applies it to every
# registered consumer plus stranske/Workflows and stranske/Workflows-Integration-Tests
# (the repos that run the label-reading automation). The former .github/labels.yml had
# no reader; its five labels missing here were folded in on 2026-11-28 (round-2 A5).

# Agent assignment labels
- name: agent:codex
  color: "0e8a16"
  description: Assign to Codex agent
- name: agent:claude
  color: "5319e7"
  description: Assign to Claude agent
- name: agent:cursor
  color: "00b8d9"
  description: Assign to Cursor agent (cursor-agent CLI)
- name: agent:gemini
  color: "1a73e8"
  description: Assign to Gemini agent (gemini CLI)
- name: agent:muse
  color: "f66a0a"
  description: Assign to Muse agent (muse CLI)
- name: runner:codex
  color: "6f42c1"
  description: "Retired runner override: codex"
- name: runner:claude
  color: "6f42c1"
  description: "Retired runner override: claude"
- name: runner:cursor
  color: "6f42c1"
  description: "Retired runner override: cursor"
- name: runner:gemini
  color: "6f42c1"
  description: "Retired runner override: gemini"
- name: runner:muse
  color: "6f42c1"
  description: "Retired runner override: muse"
- name: agent:copilot
  color: "1d76db"
  description: Assign to Copilot
- name: agent:auto
  color: "ededed"
  description: Let the system choose an agent (policy-driven)

# Belt queue state labels
- name: status:ready
  color: "0052cc"
  description: Ready for agent pickup
- name: status:in-progress
  color: "fbca04"
  description: Agent work in progress

# Opener priority labels (required before a consumer becomes fleet-ready)
- name: priority:high
  color: "b60205"
  description: High-priority weekly repo-review work
- name: priority:normal
  color: "fbca04"
  description: Normal-priority weekly repo-review work
- name: priority:low
  color: "0e8a16"
  description: Low-priority weekly repo-review work

# Agent status labels (for human visibility and retry mechanism)
- name: agent:rate-limited
  color: "d93f0b"
  description: Agent paused due to API rate limits
- name: agent:retry
  color: "0e8a16"
  description: Add to trigger agent retry after rate limit or pause
- name: agent:needs-attention
  color: "fbca04"
  description: Agent needs human review or intervention

# Agent workflow control labels
- name: agents
  color: "fbca04"
  description: Agent automation
- name: agents:activated
  color: "ededed"
  description: Agent has been activated
- name: agents:keepalive
  color: "1d76db"
  description: Enable keepalive monitoring on PR
- name: agents:pause
  color: "b60205"
  description: Pause agent work
- name: agents:paused
  color: "c2e0c6"
  description: Pause keepalive for this PR
- name: agents:allow-change
  color: "ededed"
  description: Permit workflow edits when justification provided

# PR origin labels (used by agent workflows)
- name: from:codex
  color: "0e8a16"
  description: PR was created by or for Codex
- name: from:claude
  color: "5319e7"
  description: PR was created by or for Claude
- name: from:cursor
  color: "1d76db"
  description: PR was created by or for Cursor
- name: from:muse
  color: "f66a0a"
  description: PR was created by or for Muse
- name: from:copilot
  color: "0366d6"
  description: PR was created by or for Copilot

# Workflow source labels (used when a PR has no GitHub issue)
- name: workflow:source-issue
  color: "0e8a16"
  description: PR source is a GitHub issue
- name: workflow:source-local-request
  color: "0e8a16"
  description: PR source is a local Codex or user request
- name: workflow:source-automation
  color: "ededed"
  description: PR source is an automation or workflow run
- name: workflow:source-sync
  color: "1d76db"
  description: PR source is a sync or maintenance campaign
# Sync delivery labels. Maint 68 applies these to its consumer PRs and only checks that they
# exist; this file is their single definition (written by Maint 69 Sync Labels and Maint 83).
- name: sync
  color: "0e8a16"
  description: Automated sync from Workflows
- name: automated
  color: "0e8a16"
  description: Automated sync from Workflows
- name: sync:delivery-staging
  color: "d93f0b"
  description: Generated delivery is mutable and must not merge
- name: sync:delivery-ready
  color: "0e8a16"
  description: Generated delivery is sealed to its exact reviewed head
- name: workflow:source-dependabot
  color: "0366d6"
  description: PR source is Dependabot or dependency automation
- name: dependency:repair-promotion
  color: "5319e7"
  description: Agent-owned replacement preserving a dependency-bot delta
- name: workflow:source-review-followup
  color: "5319e7"
  description: PR source is follow-up from review feedback
- name: workflow:source-direct-pr
  color: "fbca04"
  description: PR was started directly on GitHub without a source issue
- name: workflow:no-automation
  color: "b60205"
  description: Do not let workflow automation manage this PR unless checks fail
- name: workflow:source-needed
  color: "d93f0b"
  description: Workflow source context is missing or ambiguous

# Autofix labels (required for autofix workflow)
- name: autofix
  color: "0366d6"
  description: Let bots format/lint automatically
- name: autofix:applied
  color: "7057ff"
  description: Autofix was applied
- name: autofix:clean
  color: "0e8a16"
  description: Autofix passed - no changes needed
- name: autofix:patch
  color: "ededed"
  description: Autofix patch available

# Automerge label (required for automerge workflow)
- name: automerge
  color: "0052cc"
  description: Eligible for auto-merge when checks pass

# Verification follow-up labels
- name: verify:create-new-pr
  color: "5319e7"
  description: Create a follow-up issue and new PR from verification results
- name: verify:pr-handoff
  color: "0e8a16"
  description: Auto-pilot recorded a PR-bound verification handoff

# ROUTING LABELS — load-bearing for lane dispatch (synced to consumers via Maint 69).
- name: refactor
  color: '5319e7'
  description: Mechanical/codemod-style change; routes to the codemod lane
- name: cross-repo
  color: '1d76db'
  description: Coordinated change spanning multiple fleet repos
- name: epic
  color: 'b60205'
  description: Parent issue decomposed into child issues
- name: runtime-ac
  color: '0e8a16'
  description: Acceptance criteria verified by executing the runtime, not by inspection
- name: testgen
  color: 'fbca04'
  description: Test generation / coverage work; routes to the testgen lane
- name: tracker:durable
  color: 'c5def5'
  description: Permanently-open tracker; excluded from open-issue backlog counts

# Issue formatting labels (agents:format workflow and its optimizer)
- name: agents:format
  color: "0E8A16"
  description: Triggers direct issue formatting to AGENT_ISSUE_TEMPLATE
- name: agents:formatted
  color: "1D76DB"
  description: Issue has been formatted to AGENT_ISSUE_TEMPLATE
- name: agents:optimize
  color: "FBCA04"
  description: Triggers issue analysis with optimization suggestions
- name: agents:apply-suggestions
  color: "0E8A16"
  description: Applies optimization suggestions from agents:optimize

# PR environment and risk labels (folded in from the retired .github/labels.yml)
- name: agent-high-privilege
  color: "d93f0b"
  description: Marks PRs that require high-privilege agent environments
- name: risk:low
  color: "0e8a16"
  description: Small, safe change (automerge candidate)
- name: risk:medium
  color: "fbca04"
  description: Moderate change
- name: risk:high
  color: "d73a4a"
  description: Large or sensitive change
- name: reminder
  color: "d4c5f9"
  description: Reminder for future action
