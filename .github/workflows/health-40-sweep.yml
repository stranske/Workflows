name: Health 40 Sweep

on:
  workflow_dispatch:
  schedule:
    # Weekly: the full sweep (actionlint of main + liveness + belt claims).
    - cron: '5 5 * * 1'
    # Daily: workflow liveness only. A suspicious-workflow hold can appear within
    # hours of any workflow-file edit, so a weekly-only check leaves a workflow
    # silently dead for up to seven days. The liveness job is ~1 API call per
    # workflow, so daily is cheap; actionlint stays weekly (the `if:` below).
    - cron: '25 6 * * *'
  # No pull_request or push trigger (cohesion review round 2, D10): Maint 52
  # Validate Workflows already runs actionlint on every PR and every push to
  # main, without the paths-filter API call this sweep needed, so running Health
  # 42 here as well linted each workflow PR twice.
  #
  # No branch-protection leg (round 2, A6): it called Health 44 and was never
  # created on ten Mondays in a row (09-28..11-23), failing the whole sweep.
  # Health 40 Repo Selfcheck reads the protection state every Monday and
  # dispatches Health 44, the only writer, when it finds drift.

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: workflow lint (maint-36)
    # Excluded from the daily liveness tick so its cadence is unchanged.
    if: github.event.schedule != '25 6 * * *'
    uses: ./.github/workflows/health-42-actionlint.yml
    with:
      reporter: github-check
    secrets: inherit

  workflow-liveness:
    name: workflow liveness (zero-job approval holds)
    # Schedule/dispatch only (the only triggers). The sweep costs ~1 API call
    # per active workflow, so it must never run on a workflow-file push.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install the API client dependency
        run: |
          set -euo pipefail
          # scripts/api_client imports requests. The pin is read from
          # requirements.txt so it cannot drift from the fleet's version, and only
          # that one package is installed: `pip install -r requirements.txt` would
          # drag in langchain, faiss, pandas and numpy for a read-only sweep.
          pin=$(grep -E '^requests==' requirements.txt)
          if [ -z "${pin}" ]; then
            echo "::error::no requests== pin found in requirements.txt"
            exit 1
          fi
          python -m pip install --quiet "${pin}"

      # Deliberately hosted here rather than in a workflow of its own, and
      # deliberately NOT given setup-api-client or `toJSON(secrets)`: every
      # workflow held by GitHub's suspicious-workflow protection carries that
      # pattern. A detector that can be held by the condition it detects reports
      # nothing and looks green - which is exactly how maint-46-post-ci, the
      # repo's own CI failure reporter, went dark for 11 days.
      - name: Confirm every active workflow still executes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/workflow_startup_failure_diagnostic.py \
            --sweep --repo "${GITHUB_REPOSITORY}"

  belt-claim-reclaim:
    name: reclaim stale belt claims
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reclaim stale in-progress issues without PRs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { sweepClaims } = require('./.github/scripts/belt_claim_reclaim.js');
            const { owner, repo } = context.repo;
            const retry = await createTokenAwareRetry({
              github,
              core,
              task: 'health40-belt-claim-reclaim',
            });
            const result = await sweepClaims({ withRetry: retry.withRetry, owner, repo });
            core.info(result.summary);
            core.info(`Belt claims reclaimed: ${result.reclaimedCount}.`);
            await core.summary
              .addHeading('Belt claim reclaim')
              .addRaw(`${result.summary}\nBelt claims reclaimed: ${result.reclaimedCount}.`)
              .write();
