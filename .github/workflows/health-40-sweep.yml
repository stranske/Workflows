name: Health 40 Sweep

on:
  workflow_dispatch:
    inputs:
      run_branch_protection:
        description: 'Run branch-protection verification during manual sweeps'
        type: boolean
        default: true
  schedule:
    - cron: '5 5 * * 1'
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**/*.yml'

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect workflow edits
    runs-on: ubuntu-latest
    outputs:
      workflows: ${{ steps.result.outputs.workflows }}
      run_branch_protection: ${{ steps.result.outputs.run_branch_protection || 'true' }}
    steps:
      - name: Detect workflow file changes
        id: filter
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: |
            workflows:
              - '.github/workflows/**/*.yml'
      - name: Publish change decision
        id: result
        env:
          EVENT_NAME: ${{ github.event_name }}
          FILTER_OUTCOME: ${{ steps.filter.outcome }}
          FILTER_WORKFLOWS: ${{ steps.filter.outputs.workflows }}
          EVENT_INPUTS_JSON: ${{ toJSON(github.event.inputs) }}
        run: |
          set -euo pipefail
          note() {
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              printf '%s\n' "$1" >>"$GITHUB_STEP_SUMMARY"
            else
              printf '%s\n' "$1"
            fi
          }

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if [ "${FILTER_OUTCOME}" = "failure" ]; then
              note 'WARNING: paths-filter failed (likely rate limited); defaulting workflows=true'
              echo "workflows=true" >> "$GITHUB_OUTPUT"
            elif [ "${FILTER_WORKFLOWS}" = "true" ]; then
              echo "workflows=true" >> "$GITHUB_OUTPUT"
            else
              echo "workflows=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "workflows=true" >> "$GITHUB_OUTPUT"
          fi

          run_branch_protection="true"
          inputs_json="${EVENT_INPUTS_JSON:-null}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${inputs_json}" != "null" ]; then
            parsed=$(echo "${inputs_json}" | jq -r '.run_branch_protection // empty')
            if [ -n "${parsed}" ]; then
              run_branch_protection="${parsed}"
            fi
          fi
          echo "run_branch_protection=${run_branch_protection}" >> "$GITHUB_OUTPUT"

  actionlint:
    name: workflow lint (maint-36)
    needs: detect
    if: needs.detect.outputs.workflows == 'true'
    uses: ./.github/workflows/health-42-actionlint.yml
    with:
      reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
    secrets: inherit

  workflow-liveness:
    name: workflow liveness (zero-job approval holds)
    needs: detect
    # Schedule/dispatch only. The sweep costs ~1 API call per active workflow,
    # so it must not run on every workflow-file push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      # Deliberately hosted here rather than in a workflow of its own, and
      # deliberately NOT given setup-api-client or `toJSON(secrets)`: every
      # workflow held by GitHub's suspicious-workflow protection carries that
      # pattern. A detector that can be held by the condition it detects reports
      # nothing and looks green - which is exactly how maint-46-post-ci, the
      # repo's own CI failure reporter, went dark for 11 days.
      - name: Confirm every active workflow still executes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/workflow_startup_failure_diagnostic.py \
            --sweep --repo "${GITHUB_REPOSITORY}"

  branch-protection-verify:
    name: branch protection sweep
    needs: detect
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      needs.detect.outputs.run_branch_protection != 'false'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/health-44-gate-branch-protection.yml
    secrets: inherit
