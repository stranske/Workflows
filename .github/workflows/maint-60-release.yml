name: Maint 60 Release

# Moves the floating v1 tag to each new v1.x tag. The release itself is written by
# release-please (maint-61), whose App-token tag push is what triggers this workflow.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One group for every tag (cohesion review round 2, D11): per-tag groups let an
# older tag's run finish after a newer one's. Queued, not cancelled, so a
# running push is never interrupted; update-floating-tag.sh also refuses to
# move v1 to anything but the highest v1.x tag.
concurrency:
  group: ${{ github.workflow }}-floating-tag
  cancel-in-progress: false

jobs:
  release:
    name: Move floating tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update floating v1 tag
        if: startsWith(github.ref_name, 'v1.')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scripts/update-floating-tag.sh v1 v1. "$GITHUB_SHA"

      # No release step: release-please (maint-61) already creates the GitHub
      # release for every tag it pushes. A second writer here (softprops) only
      # re-edited that release and failed 2 of the last 6 tags on the token
      # rate limit (cohesion review B15).
