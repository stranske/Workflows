# Reusable workflow to address bot review comments on PRs
#
# Collects unresolved review comments from known bot authors (Copilot, CodeRabbit, etc.)
# and dispatches the configured agent to address them.
#
# Triggers:
# - Called by consumer repo workflows (label trigger or keepalive integration)
# - Manual dispatch for testing
#
# Agent selection:
# - Reads PR labels (agent:codex, agent:claude, etc.) to determine which agent
# - Falls back to Codex if no agent label found
#
# Outputs:
# - comments_found: 'true' if unresolved bot comments were found
# - comments_count: Number of unresolved bot comments found
# - agent_triggered: 'true' if the agent was triggered to address comments
# - app_auth_mode: 'client-id', 'legacy-app-id', or 'none' for App auth selection

name: Reusable Bot Comment Handler

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: string
      dry_run:
        description: 'Preview what would be done without making changes'
        required: false
        type: boolean
        default: true
      bot_authors:
        description: >-
          Comma-separated list of bot login names (default includes Copilot,
          github-actions, coderabbitai, chatgpt-codex-connector)
        required: false
        type: string
        default: >-
          Copilot,copilot[bot],github-actions[bot],coderabbitai[bot],
          chatgpt-codex-connector,chatgpt-codex-connector[bot]
      skip_if_human_replied:
        description: 'Legacy option: skip active threads after any non-bot reply'
        required: false
        type: boolean
        default: false
      ignored_paths:
        description: 'Comma-separated list of path prefixes to ignore in bot review comments'
        required: false
        type: string
        default: '.agents/'
  workflow_call:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: string
      dry_run:
        description: 'Preview what would be done without making changes'
        required: false
        type: boolean
        default: false
      bot_authors:
        description: >-
          Comma-separated list of bot login names (default includes Copilot,
          github-actions, coderabbitai, chatgpt-codex-connector)
        required: false
        type: string
        default: >-
          Copilot,copilot[bot],github-actions[bot],coderabbitai[bot],
          chatgpt-codex-connector,chatgpt-codex-connector[bot]
      skip_if_human_replied:
        description: 'Legacy option: skip active threads after any non-bot reply'
        required: false
        type: boolean
        default: false
      ignored_paths:
        description: 'Comma-separated list of path prefixes to ignore in bot review comments'
        required: false
        type: string
        default: '.agents/'
    outputs:
      comments_found:
        description: 'Whether unresolved bot comments were found'
        value: ${{ jobs.collect.outputs.comments_found }}
      comments_count:
        description: 'Number of unresolved bot comments found'
        value: ${{ jobs.collect.outputs.comments_count }}
      agent_triggered:
        description: 'Whether the agent was triggered to address comments'
        value: ${{ jobs.dispatch.outputs.triggered }}
      app_auth_mode:
        description: 'Selected App auth mode: client-id, legacy-app-id, or none'
        value: ${{ jobs.collect.outputs.app_auth_mode }}
    secrets:
      service_bot_pat:
        description: 'PAT for service bot (comments, labels)'
        required: false
      gh_app_client_id:
        description: 'GitHub App client ID for authentication'
        required: false
      gh_app_id:
        description: 'Legacy GitHub App ID fallback; prefer gh_app_client_id'
        required: false
      gh_app_private_key:
        description: 'GitHub App private key'
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Collect unresolved bot comments
  collect:
    name: Collect bot comments
    runs-on: ubuntu-latest
    outputs:
      comments_found: ${{ steps.collect.outputs.found }}
      comments_count: ${{ steps.collect.outputs.count }}
      comments_json: ${{ steps.collect.outputs.comments }}
      head_sha: ${{ steps.collect.outputs.head_sha }}
      active_thread_fingerprint: ${{ steps.collect.outputs.active_thread_fingerprint }}
      agent: ${{ steps.agent.outputs.agent }}
      agent_workflow: ${{ steps.agent.outputs.workflow }}
      app_auth_mode: ${{ steps.app-creds.outputs.app_auth_mode }}
    steps:
      - name: Detect App credentials
        id: app-creds
        env:
          GH_APP_CLIENT_ID: ${{ secrets.gh_app_client_id }}
          GH_APP_ID: ${{ secrets.gh_app_id }}
          GH_APP_PRIVATE_KEY: ${{ secrets.gh_app_private_key }}
        run: |
          client_id_configured=false
          legacy_app_id_configured=false
          private_key_configured=false
          use_client=false
          use_legacy=false
          app_auth_mode=none
          if [ -n "${GH_APP_CLIENT_ID}" ]; then
            client_id_configured=true
          fi
          if [ -n "${GH_APP_ID}" ]; then
            legacy_app_id_configured=true
          fi
          if [ -n "${GH_APP_PRIVATE_KEY}" ]; then
            private_key_configured=true
          fi
          if [ -n "${GH_APP_CLIENT_ID}" ] && [ -n "${GH_APP_PRIVATE_KEY}" ]; then
            use_client=true
            app_auth_mode=client-id
          elif [ -n "${GH_APP_ID}" ] && [ -n "${GH_APP_PRIVATE_KEY}" ]; then
            use_legacy=true
            app_auth_mode=legacy-app-id
            echo "::warning title=Legacy GitHub App ID fallback::Configure GH_APP_CLIENT_ID"
            echo "and pass gh_app_client_id to avoid the deprecated app-id path."
          fi
          {
            echo "client_id_configured=${client_id_configured}"
            echo "legacy_app_id_configured=${legacy_app_id_configured}"
            echo "private_key_configured=${private_key_configured}"
            echo "use_client=${use_client}"
            echo "use_legacy=${use_legacy}"
            echo "app_auth_mode=${app_auth_mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate token (if App client ID configured)
        id: token-client
        if: steps.app-creds.outputs.use_client == 'true'
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.gh_app_client_id }}
          private-key: ${{ secrets.gh_app_private_key }}

      - name: Generate token (if legacy App ID configured)
        id: token-legacy
        if: steps.app-creds.outputs.use_legacy == 'true'
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.gh_app_id }}
          private-key: ${{ secrets.gh_app_private_key }}

      - name: Resolve token
        id: auth
        env:
          TOKEN_OUTPUT: ${{ steps.token-client.outputs.token || steps.token-legacy.outputs.token }}
          SERVICE_PAT: ${{ secrets.service_bot_pat }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${TOKEN_OUTPUT}" ]; then
            echo "token=${TOKEN_OUTPUT}" >> "$GITHUB_OUTPUT"
          elif [ -n "${SERVICE_PAT}" ]; then
            echo "token=${SERVICE_PAT}" >> "$GITHUB_OUTPUT"
          else
            echo "token=${GITHUB_TOKEN}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write App auth coverage
        if: always()
        env:
          APP_AUTH_MODE: ${{ steps.app-creds.outputs.app_auth_mode }}
          APP_CLIENT_ID_CONFIGURED: ${{ steps.app-creds.outputs.client_id_configured }}
          APP_LEGACY_APP_ID_CONFIGURED: ${{ steps.app-creds.outputs.legacy_app_id_configured }}
          APP_PRIVATE_KEY_CONFIGURED: ${{ steps.app-creds.outputs.private_key_configured }}
        run: |
          mkdir -p bot-comment-auth-coverage
          node <<'NODE'
          const fs = require('fs');
          const truthy = (value) => String(value || '').toLowerCase() === 'true';
          const record = {
            schema: 'workflows-bot-comment-auth-coverage/v1',
            component: 'reusable-bot-comment-handler',
            repository: process.env.GITHUB_REPOSITORY || '',
            workflow: process.env.GITHUB_WORKFLOW || '',
            run_id: process.env.GITHUB_RUN_ID || '',
            run_attempt: process.env.GITHUB_RUN_ATTEMPT || '',
            event_name: process.env.GITHUB_EVENT_NAME || '',
            auth_mode: process.env.APP_AUTH_MODE || 'none',
            client_id_configured: truthy(process.env.APP_CLIENT_ID_CONFIGURED),
            legacy_app_id_configured: truthy(process.env.APP_LEGACY_APP_ID_CONFIGURED),
            private_key_configured: truthy(process.env.APP_PRIVATE_KEY_CONFIGURED),
            fallback_warning_active: process.env.APP_AUTH_MODE === 'legacy-app-id',
          };
          fs.writeFileSync(
            'bot-comment-auth-coverage/reusable.json',
            `${JSON.stringify(record, null, 2)}\n`
          );
          NODE

      - name: Upload App auth coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-comment-auth-coverage-reusable-${{ github.run_id }}
          path: bot-comment-auth-coverage/reusable.json
          if-no-files-found: error
          retention-days: 14

      - name: Checkout retry helpers
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/agents/registry.yml
            .github/actions/setup-api-client
            .github/scripts/agent_registry.js
            .github/scripts/bot-comment-handler.js
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/terminal_disposition.js
            .github/scripts/token_load_balancer.js
            .github/scripts/bot-comment-dismiss.js
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Detect agent from PR labels
        id: agent
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;
            const prNumber = Number.parseInt(process.env.PR_NUMBER || '', 10);

            let pr;
            try {
              const response = await withRetry(() => github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              }));
              pr = response.data;
            } catch (error) {
              console.log(`Failed to fetch PR #${prNumber}: ${error.message}`);
              core.setFailed(`Could not fetch PR #${prNumber}`);
              return;
            }

            const botHandler = require('./.github/scripts/bot-comment-handler.js');
            let agent;
            let workflow;
            if (typeof botHandler.resolveBotCommentAgent === 'function') {
              const route = botHandler.resolveBotCommentAgent(pr.labels);
              agent = route.agent;
              workflow = route.workflow;
            } else {
              const labels = pr.labels.map(l => l.name);
              agent = 'codex';
              workflow = 'reusable-codex-run.yml';
              const labelSet = new Set(labels.map((value) => String(value || '').toLowerCase()));
              if (labelSet.has('agent:claude')) {
                agent = 'claude';
                workflow = 'reusable-claude-run.yml';
              } else if (labelSet.has('agent:gemini')) {
                agent = 'gemini';
                workflow = 'reusable-gemini-run.yml';
              } else if (labelSet.has('agent:codex')) {
                agent = 'codex';
                workflow = 'reusable-codex-run.yml';
              }
            }

            core.setOutput('agent', agent);
            core.setOutput('workflow', workflow);
            console.log(`Detected agent: ${agent}, workflow: ${workflow}`);

      - name: Collect unresolved bot comments
        id: collect
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          BOT_AUTHORS: ${{ inputs.bot_authors }}
          SKIP_IF_HUMAN_REPLIED: ${{ inputs.skip_if_human_replied }}
          IGNORED_PATHS: ${{ inputs.ignored_paths }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const dispositionHelperPath = './.github/scripts/terminal_disposition.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const {
              normalizeTerminalDisposition,
              formatTerminalDispositionMarkdown,
            } = fs.existsSync(dispositionHelperPath)
              ? require(dispositionHelperPath)
              : {
                  normalizeTerminalDisposition: (value) => value,
                  formatTerminalDispositionMarkdown: () =>
                    'Terminal disposition helper unavailable.',
                };
            const botHandler = require('./.github/scripts/bot-comment-handler.js');
            const collectActiveBotReviewThreads = botHandler.collectActiveBotReviewThreads;
            const buildReviewThreadTerminalDisposition =
              botHandler.buildReviewThreadTerminalDisposition;
            const { withRetry } = retryHelpers;
            const prNumber = Number.parseInt(process.env.PR_NUMBER || '', 10);
            const botAuthors = process.env.BOT_AUTHORS || '';
            const skipIfHumanReplied = process.env.SKIP_IF_HUMAN_REPLIED === 'true';
            const ignoredPaths = (process.env.IGNORED_PATHS || '')
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);

            console.log(`Collecting comments for PR #${prNumber}`);
            console.log(`Bot authors: ${botAuthors}`);

            // REST review comments do not expose thread resolution or outdated state.
            // Query the complete active review-thread set and paginate long nested
            // comment connections so one busy thread cannot hide the rest.
            const query = `
              query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    headRefOid
                    reviewThreads(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        isResolved
                        isOutdated
                        path
                        line
                        comments(first: 100) {
                          pageInfo { hasNextPage endCursor }
                          nodes {
                            id
                            databaseId
                            body
                            url
                            diffHunk
                            line
                            originalLine
                            author { login }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            const threadCommentsQuery = `
              query($threadId: ID!, $cursor: String) {
                node(id: $threadId) {
                  ... on PullRequestReviewThread {
                    comments(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        databaseId
                        body
                        url
                        diffHunk
                        line
                        originalLine
                        author { login }
                      }
                    }
                  }
                }
              }
            `;
            const reviewThreads = [];
            let cursor = null;
            let headSha = '';
            do {
              const data = await withRetry(() => github.graphql(query, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                number: prNumber,
                cursor,
              }));
              const pullRequest = data.repository?.pullRequest;
              if (!pullRequest) {
                throw new Error(`PR #${prNumber} was not returned by GraphQL`);
              }
              if (headSha && pullRequest.headRefOid !== headSha) {
                throw new Error(
                  `PR head changed during collection: ${headSha} -> ` +
                  `${pullRequest.headRefOid}`
                );
              }
              headSha = pullRequest.headRefOid;
              const page = pullRequest.reviewThreads;
              for (const thread of page.nodes || []) {
                let commentsPage = thread.comments;
                const comments = [...(commentsPage?.nodes || [])];
                while (commentsPage?.pageInfo?.hasNextPage) {
                  const commentData = await withRetry(() => github.graphql(
                    threadCommentsQuery,
                    {
                      threadId: thread.id,
                      cursor: commentsPage.pageInfo.endCursor,
                    }
                  ));
                  commentsPage = commentData.node?.comments;
                  if (!commentsPage) {
                    throw new Error(`Review thread ${thread.id} pagination failed`);
                  }
                  comments.push(...(commentsPage.nodes || []));
                }
                reviewThreads.push({
                  ...thread,
                  comments: {
                    nodes: comments,
                    pageInfo: commentsPage?.pageInfo || {
                      hasNextPage: false,
                      endCursor: null,
                    },
                  },
                });
              }
              cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
            } while (cursor);

            let botComments;
            if (typeof collectActiveBotReviewThreads === 'function') {
              botComments = collectActiveBotReviewThreads(reviewThreads, {
                botAuthors,
                skipIfHumanReplied,
                ignoredPaths,
              });
            } else {
              const botAuthorSet = new Set(
                botAuthors.split(',').map(value => value.trim().toLowerCase()).filter(Boolean)
              );
              botComments = reviewThreads
                .filter(thread => !thread.isResolved && !thread.isOutdated)
                .filter(thread => !ignoredPaths.some(
                  prefix => (thread.path || '').startsWith(prefix)
                ))
                .map(thread => ({ thread, comments: thread.comments?.nodes || [] }))
                .filter(({ comments }) => botAuthorSet.has(
                  String(comments[0]?.author?.login || '').toLowerCase()
                ))
                .filter(({ comments }) => !skipIfHumanReplied || !comments.slice(1).some(
                  comment => !botAuthorSet.has(String(comment.author?.login || '').toLowerCase())
                ))
                .map(({ thread, comments }) => ({
                  id: comments[0]?.databaseId || comments[0]?.id,
                  thread_id: thread.id,
                  path: thread.path,
                  line: thread.line ?? comments[0]?.line ?? comments[0]?.originalLine,
                  body: comments[0]?.body,
                  author: comments[0]?.author?.login,
                  url: comments[0]?.url,
                  diff_hunk: comments[0]?.diffHunk,
                }));
            }

            const found = botComments.length > 0;
            const activeThreadFingerprint = JSON.stringify(
              reviewThreads
                .filter(thread => !thread.isResolved && !thread.isOutdated)
                .map(thread => thread.id)
                .sort()
            );
            core.setOutput('found', found ? 'true' : 'false');
            core.setOutput('count', botComments.length);
            core.setOutput('comments', JSON.stringify(botComments));
            core.setOutput('head_sha', headSha);
            core.setOutput('active_thread_fingerprint', activeThreadFingerprint);

            console.log(`Found ${botComments.length} active bot review threads`);

            if (botComments.length > 0) {
              console.log('Comments to address:');
              for (const c of botComments) {
                const preview = c.body.substring(0, 100).replace(/\n/g, ' ');
                console.log(`- ${c.path}:${c.line} (${c.author}): ${preview}...`);
              }
            }

            const record = typeof buildReviewThreadTerminalDisposition === 'function'
              ? buildReviewThreadTerminalDisposition({
                  prNumber,
                  found,
                  workflow: context.workflow,
                  runId: context.runId,
                  runAttempt: context.runAttempt,
                  artifactName: `review-thread-terminal-disposition-${context.runId}`,
                  artifactFamily: 'review-thread-terminal-disposition',
                  actor: context.actor,
                })
              : normalizeTerminalDisposition({
                  source_type: 'review-thread',
                  source_id: prNumber,
                  pr_number: prNumber,
                  disposition: found ? 'unresolved-bot-comments' : 'no-unresolved-bot-comments',
                  reason: found
                    ? 'Active bot review threads remain and agent handling is eligible.'
                    : 'No active bot review threads matched the handler filters.',
                  workflow: context.workflow,
                  run_id: context.runId,
                  run_attempt: context.runAttempt,
                  artifact_name: `review-thread-terminal-disposition-${context.runId}`,
                  artifact_family: 'review-thread-terminal-disposition',
                  actor: context.actor,
                });
            fs.mkdirSync('agent-metrics', { recursive: true });
            fs.writeFileSync(
              'agent-metrics/review-thread-terminal-disposition.ndjson',
              `${JSON.stringify(record)}\n`
            );
            fs.writeFileSync(
              'terminal-disposition-summary.md',
              `${formatTerminalDispositionMarkdown([record])}\n`
            );

      - name: Auto-dismiss review comments on ignored paths
        if: steps.collect.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          IGNORED_PATHS: ${{ inputs.ignored_paths }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const { autoDismissReviewComments } = require(
              './.github/scripts/bot-comment-dismiss.js'
            );
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { withRetry } = await createTokenAwareRetry({
              github, core,
              env: process.env,
              task: 'bot-comment-dismiss',
              capabilities: ['pull-requests:write'],
            });
            const prNumber = Number.parseInt(process.env.PR_NUMBER || '', 10);
            const ignoredPaths = (process.env.IGNORED_PATHS || '')
              .split(',')
              .map(s => s.trim())
              .filter(Boolean);
            const botAuthors = [
              'copilot-pull-request-reviewer',
              'chatgpt-codex-connector',
              'github-actions[bot]',
            ];

            const result = await autoDismissReviewComments({
              github, withRetry, core,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pullNumber: prNumber,
              ignoredPaths,
              botAuthors,
            });

            const dismissedCount = Array.isArray(result.dismissed)
              ? result.dismissed.length
              : 0;
            const failedCount = Array.isArray(result.failed) ? result.failed.length : 0;
            core.info(
              `Auto-dismissed ${dismissedCount} review comment(s) on ignored paths ` +
              `(failed: ${failedCount})`
            );

      - name: Post summary
        if: steps.collect.outputs.found == 'true'
        uses: actions/github-script@v9
        env:
          COMMENTS_JSON: ${{ steps.collect.outputs.comments }}
          DRY_RUN: ${{ inputs.dry_run }}
          AGENT: ${{ steps.agent.outputs.agent }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const comments = JSON.parse(process.env.COMMENTS_JSON);
            const count = comments.length;
            const agent = process.env.AGENT || '';
            const dryRun = process.env.DRY_RUN === 'true';

            let summary = `## 🤖 Bot Comment Handler\n\n`;
            summary += `Found **${count}** active bot review thread(s) to address.\n\n`;
            summary += `| File | Line | Bot | Preview |\n`;
            summary += `|------|------|-----|--------|\n`;

            for (const c of comments.slice(0, 10)) {
              const preview = c.body.substring(0, 50).replace(/\n/g, ' ') + '...';
              summary += `| \`${c.path}\` | ${c.line || 'N/A'} | ${c.author} | ${preview} |\n`;
            }

            if (comments.length > 10) {
              summary += `\n*...and ${comments.length - 10} more*\n`;
            }

            if (dryRun) {
              summary += `\n⚠️ **Dry run** - agent will not be triggered.\n`;
            } else {
              summary += `\n🚀 Dispatching **${agent}** to address these comments...\n`;
            }

            await core.summary.addRaw(summary).write();

      - name: Post terminal disposition summary
        if: always()
        run: |
          if [ -f terminal-disposition-summary.md ]; then
            {
              echo "## Terminal Disposition"
              cat terminal-disposition-summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review-thread disposition artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-thread-terminal-disposition-${{ github.run_id }}
          path: |
            agent-metrics/review-thread-terminal-disposition.ndjson
            terminal-disposition-summary.md
          if-no-files-found: error
          retention-days: 14

  # Generate prompt file with bot comments
  prepare:
    name: Prepare agent prompt
    needs: collect
    if: needs.collect.outputs.comments_found == 'true' && inputs.dry_run == false
    runs-on: ubuntu-latest
    outputs:
      prompt_ready: ${{ steps.prompt.outputs.ready }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate bot comments prompt
        id: prompt
        env:
          COMMENTS_JSON: ${{ needs.collect.outputs.comments_json }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
        run: |
          set -euo pipefail

          mkdir -p .github/codex/prompts

          node <<'NODE'
          const fs = require('fs');
          const botHandler = require('./.github/scripts/bot-comment-handler.js');
          const fallbackPrompt = (comments) => {
            const lines = [
              '# Fix Bot Review Comments',
              '',
              'Review bots have left suggestions on this PR. Address each one:',
              '',
              '## Instructions',
              '',
              '1. Read each bot comment below',
              '2. Implement the suggested fix if it improves the code',
              "3. If a suggestion is incorrect or doesn't apply, skip it and note why",
              '4. After fixing, summarize what you addressed in your commit message',
              '',
              '## Bot Comments to Address',
              '',
            ];
            for (const comment of comments) {
              lines.push(
                `### ${comment.path}:${comment.line ?? 'N/A'}`,
                '',
                `**From:** ${comment.author}`,
                '',
                '```',
                String(comment.body ?? ''),
                '```',
                '',
                '**Context (diff hunk):**',
                '```diff',
                String(comment.diff_hunk ?? ''),
                '```',
                '',
                '---',
                ''
              );
            }
            lines.push(
              '## After Addressing Comments',
              '',
              '- Commit your changes with message: "fix: address bot review comments"',
              '- Include which suggestions you addressed vs skipped in the commit message',
              ''
            );
            return lines.join('\n');
          };
          const buildBotCommentsPrompt =
            typeof botHandler.buildBotCommentsPrompt === 'function'
              ? botHandler.buildBotCommentsPrompt
              : fallbackPrompt;
          const comments = JSON.parse(process.env.COMMENTS_JSON || '[]');
          fs.writeFileSync(
            '.github/codex/prompts/fix_bot_comments_dynamic.md',
            buildBotCommentsPrompt(comments, { headSha: process.env.HEAD_SHA })
          );
          NODE

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Generated prompt with $(echo "${COMMENTS_JSON}" | jq length) comments"

      - name: Upload prompt artifact
        uses: actions/upload-artifact@v7
        with:
          name: bot-comments-prompt-${{ github.run_id }}
          path: .github/codex/prompts/fix_bot_comments_dynamic.md
          retention-days: 1

  # Dispatch to agent
  dispatch:
    name: Dispatch to agent
    needs: [collect, prepare]
    if: needs.collect.outputs.comments_found == 'true' && inputs.dry_run == false
    runs-on: ubuntu-latest
    outputs:
      triggered: ${{ steps.dispatch.outputs.triggered }}
    steps:
      - name: Detect App credentials
        id: app-creds
        env:
          GH_APP_CLIENT_ID: ${{ secrets.gh_app_client_id }}
          GH_APP_ID: ${{ secrets.gh_app_id }}
          GH_APP_PRIVATE_KEY: ${{ secrets.gh_app_private_key }}
        run: |
          client_id_configured=false
          legacy_app_id_configured=false
          private_key_configured=false
          use_client=false
          use_legacy=false
          app_auth_mode=none
          if [ -n "${GH_APP_CLIENT_ID}" ]; then
            client_id_configured=true
          fi
          if [ -n "${GH_APP_ID}" ]; then
            legacy_app_id_configured=true
          fi
          if [ -n "${GH_APP_PRIVATE_KEY}" ]; then
            private_key_configured=true
          fi
          if [ -n "${GH_APP_CLIENT_ID}" ] && [ -n "${GH_APP_PRIVATE_KEY}" ]; then
            use_client=true
            app_auth_mode=client-id
          elif [ -n "${GH_APP_ID}" ] && [ -n "${GH_APP_PRIVATE_KEY}" ]; then
            use_legacy=true
            app_auth_mode=legacy-app-id
            echo "::warning title=Legacy GitHub App ID fallback::Configure GH_APP_CLIENT_ID"
            echo "and pass gh_app_client_id to avoid the deprecated app-id path."
          fi
          {
            echo "client_id_configured=${client_id_configured}"
            echo "legacy_app_id_configured=${legacy_app_id_configured}"
            echo "private_key_configured=${private_key_configured}"
            echo "use_client=${use_client}"
            echo "use_legacy=${use_legacy}"
            echo "app_auth_mode=${app_auth_mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Generate token (if App client ID configured)
        id: token-client
        if: steps.app-creds.outputs.use_client == 'true'
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.gh_app_client_id }}
          private-key: ${{ secrets.gh_app_private_key }}

      - name: Generate token (if legacy App ID configured)
        id: token-legacy
        if: steps.app-creds.outputs.use_legacy == 'true'
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.gh_app_id }}
          private-key: ${{ secrets.gh_app_private_key }}

      - name: Resolve token
        id: auth
        env:
          TOKEN_OUTPUT: ${{ steps.token-client.outputs.token || steps.token-legacy.outputs.token }}
          APP_SLUG: >-
            ${{ steps.token-client.outputs.app-slug || steps.token-legacy.outputs.app-slug }}
          SERVICE_PAT: ${{ secrets.service_bot_pat }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -n "${TOKEN_OUTPUT}" ]; then
            {
              echo "token=${TOKEN_OUTPUT}"
              echo "auth_kind=app-installation"
              echo "controller_login=${APP_SLUG}[bot]"
            } >> "$GITHUB_OUTPUT"
          elif [ -n "${SERVICE_PAT}" ]; then
            {
              echo "token=${SERVICE_PAT}"
              echo "auth_kind=service-pat"
              echo "controller_login="
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "token=${GITHUB_TOKEN}"
              echo "auth_kind=github-token"
              echo "controller_login=github-actions[bot]"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout retry helpers
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/bot-comment-handler.js
            .github/actions/setup-api-client
            .github/scripts/github-rate-limited-wrapper.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Assign agent and post context comment
        id: dispatch
        uses: actions/github-script@v9
        env:
          COMMENTS_JSON: ${{ needs.collect.outputs.comments_json }}
          HEAD_SHA: ${{ needs.collect.outputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          AGENT: ${{ needs.collect.outputs.agent }}
          COMMENTS_COUNT: ${{ needs.collect.outputs.comments_count }}
          ACTIVE_THREAD_FINGERPRINT: ${{ needs.collect.outputs.active_thread_fingerprint }}
          AUTH_KIND: ${{ steps.auth.outputs.auth_kind }}
          CONTROLLER_LOGIN: ${{ steps.auth.outputs.controller_login }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry, paginateWithRetry } = retryHelpers;
            const prNumber = Number.parseInt(process.env.PR_NUMBER || '', 10);
            const agent = process.env.AGENT || '';
            const count = process.env.COMMENTS_COUNT || '0';
            const comments = JSON.parse(process.env.COMMENTS_JSON || '[]');
            const headSha = process.env.HEAD_SHA || '';
            const activeThreadFingerprint = process.env.ACTIVE_THREAD_FINGERPRINT || '';
            const authKind = process.env.AUTH_KIND || '';
            const controllerLogin = process.env.CONTROLLER_LOGIN || '';
            const {owner, repo} = context.repo;
            const botHandler = require('./.github/scripts/bot-comment-handler.js');
            const getBotCommentAssignees = botHandler.getBotCommentAssignees;
            const buildBotCommentDispatchComments = botHandler.buildBotCommentDispatchComments;
            const fallbackAssignees = {
              'codex': ['chatgpt-codex-connector'],
              'claude': ['copilot'],
              'gemini': ['copilot']
            };
            const assignees = typeof getBotCommentAssignees === 'function'
              ? getBotCommentAssignees(agent)
              : (fallbackAssignees[agent] || fallbackAssignees['codex']);

            // Persist exact-head, thread-specific context before assignment. Assignment
            // is the trigger, so reversing this order can start a context-free generic review.
            const marker = '<!-- bot-comment-handler -->';
            const buildFallbackDispatchComments = () => {
              const maxLength = 60000;
              const entries = comments.map(item => {
                const threadId = String(item.thread_id || item.id || 'unknown-thread')
                  .slice(0, 200);
                const path = String(item.path || 'unknown').slice(0, 260);
                const url = String(item.url || 'URL unavailable').slice(0, 500);
                const criterion = String(item.body || 'Read the linked review thread')
                  .replace(/\s+/g, ' ').slice(0, 350);
                return `- ${threadId} — ${path}:${item.line ?? 'N/A'}\n` +
                  `  - ${url}\n  - Acceptance criterion: ${criterion}`;
              });
              const pages = [[]];
              let length = 0;
              for (const entry of entries) {
                if (pages.at(-1).length > 0 && length + entry.length + 2 > 58000) {
                  pages.push([]);
                  length = 0;
                }
                pages.at(-1).push(entry);
                length += entry.length + 2;
              }
              return pages.map((page, index) => [
                marker,
                `<!-- bot-comment-handler-part:${index + 1}/${pages.length} -->`,
                '## 🤖 Bot Comment Handler',
                '',
                `- Agent: ${agent}`,
                `- Bot comments to address: ${count}`,
                `- Exact PR head: ${headSha || 'unavailable'}`,
                `- Controller part: ${index + 1} of ${pages.length}`,
                '',
                ...page.flatMap(entry => [entry, '']),
                'Address or disposition every linked thread. A generic review is not completion.'
              ].join('\n')).map(body => {
                if (body.length > maxLength) {
                  throw new Error(`Fallback controller comment exceeds ${maxLength} characters`);
                }
                return body;
              });
            };
            const controllerBodies = typeof buildBotCommentDispatchComments === 'function'
              ? buildBotCommentDispatchComments({ agent, count, comments, headSha })
              : buildFallbackDispatchComments();

            // Find existing bot-comment-handler comment to avoid duplicates
            const existingComments = await paginateWithRetry(
              github,
              github.rest.issues.listComments,
              { owner, repo, issue_number: prNumber, per_page: 100 }
            );
            // Installation tokens cannot call the user-only authenticated-user
            // endpoint. App and GITHUB_TOKEN identities are deterministic; only
            // a user PAT needs the authenticated-user lookup.
            let authenticatedLogin = String(controllerLogin).toLowerCase();
            if (authKind === 'service-pat') {
              const { data: authenticated } = await withRetry(() =>
                github.rest.users.getAuthenticated()
              );
              authenticatedLogin = String(authenticated?.login || '').toLowerCase();
            }
            if (!authenticatedLogin) {
              core.setOutput('triggered', 'false');
              core.setFailed('Could not determine the controller comment identity');
              return;
            }
            const existing = existingComments.filter(c =>
              c.body?.includes(marker)
              && !c.body?.includes('<!-- bot-comment-handler-retired -->')
              && String(c.user?.login || '').toLowerCase() === authenticatedLogin
            ).sort((left, right) => left.id - right.id);

            for (const [index, body] of controllerBodies.entries()) {
              const prior = existing[index];
              if (prior) {
                await withRetry(() => github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: prior.id,
                  body,
                }));
                core.info(`Updated controller part ${index + 1} in comment #${prior.id}`);
              } else {
                await withRetry(() => github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: prNumber,
                  body,
                }));
                core.info(`Created controller part ${index + 1} on PR #${prNumber}`);
              }
            }
            for (const stale of existing.slice(controllerBodies.length)) {
              await withRetry(() => github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: stale.id,
                body: [
                  marker,
                  '<!-- bot-comment-handler-retired -->',
                  'This controller part was superseded by a smaller exact-head thread set.'
                ].join('\n'),
              }));
              core.info(`Retired stale controller comment #${stale.id}`);
            }

            // Reassignment creates a fresh trigger even when a prior attempt left the
            // connector assigned. The exact context above is durable before either edge.
            try {
              const activeThreadsQuery = `
                query($owner: String!, $repo: String!, $number: Int!, $cursor: String) {
                  repository(owner: $owner, name: $repo) {
                    pullRequest(number: $number) {
                      headRefOid
                      reviewThreads(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes { id isResolved isOutdated }
                      }
                    }
                  }
                }
              `;
              const assertExactDispatchSnapshot = async (stage) => {
                const threadIds = [];
                let cursor = null;
                let observedHeadSha = '';
                do {
                  const data = await withRetry(() => github.graphql(activeThreadsQuery, {
                    owner,
                    repo,
                    number: prNumber,
                    cursor,
                  }));
                  const pullRequest = data.repository?.pullRequest;
                  if (!pullRequest) {
                    throw new Error(`PR #${prNumber} was not returned while ${stage}`);
                  }
                  if (observedHeadSha && pullRequest.headRefOid !== observedHeadSha) {
                    throw new Error(`PR head changed while reading active threads ${stage}`);
                  }
                  observedHeadSha = pullRequest.headRefOid;
                  const page = pullRequest.reviewThreads;
                  threadIds.push(...(page.nodes || [])
                    .filter(thread => !thread.isResolved && !thread.isOutdated)
                    .map(thread => thread.id));
                  cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
                } while (cursor);
                if (!headSha || observedHeadSha !== headSha) {
                  throw new Error(
                    `PR head changed ${stage}: expected ${headSha || 'missing'}, ` +
                    `observed ${observedHeadSha || 'missing'}. ` +
                    'Recollect before assignment.'
                  );
                }
                const observedFingerprint = JSON.stringify(threadIds.sort());
                if (!activeThreadFingerprint || observedFingerprint !== activeThreadFingerprint) {
                  throw new Error(
                    `Active review-thread set changed ${stage}: expected ` +
                    `${activeThreadFingerprint || 'missing'}, observed ${observedFingerprint}. ` +
                    'Recollect before assignment.'
                  );
                }
              };
              const { data: pr } = await withRetry(() => github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              }));
              await assertExactDispatchSnapshot('before assignment');
              const assigned = new Set(
                (pr.assignees || []).map(item => String(item.login || '').toLowerCase())
              );
              const alreadyAssigned = assignees.filter(login => assigned.has(login.toLowerCase()));
              if (alreadyAssigned.length > 0) {
                await withRetry(() => github.rest.issues.removeAssignees({
                  owner,
                  repo,
                  issue_number: prNumber,
                  assignees: alreadyAssigned,
                }));
                core.info(`Removed stale assignment for ${alreadyAssigned.join(', ')}`);
                await assertExactDispatchSnapshot('after stale assignment removal');
              }
              await withRetry(() => github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: prNumber,
                assignees,
              }));
              core.info(`Assigned ${assignees.join(', ')} to PR #${prNumber}`);
            } catch (error) {
              core.setOutput('triggered', 'false');
              core.setFailed(`Failed to trigger agent assignment: ${error.message}`);
              return;
            }

            core.setOutput('triggered', 'true');
            console.log(`Posted exact thread context, then assigned ${assignees.join(', ')}`);

  # Summary
  summary:
    name: Generate summary
    needs: [collect, dispatch]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Final summary
        env:
          COMMENTS_COUNT: ${{ needs.collect.outputs.comments_count }}
          AGENT: ${{ needs.collect.outputs.agent }}
          TRIGGERED: ${{ needs.dispatch.outputs.triggered }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Bot Comment Handler Results"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Comments Found | ${COMMENTS_COUNT:-0} |"
            echo "| Agent | ${AGENT:-N/A} |"
            echo "| Agent Triggered | ${TRIGGERED:-false} |"
            echo "| Dry Run | ${DRY_RUN} |"
          } >> "$GITHUB_STEP_SUMMARY"
