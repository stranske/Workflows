name: Auto-lock dependency PRs
# Backstop that regenerates requirements.lock when a dependency bot updates a
# declared lock input file, so the checked-in lock stays in sync.
#
# Primary mechanism is now the fleet Renovate preset's pip-compile manager
# (renovate-presets/fleet.json), which regenerates the lock IN the same PR by
# re-running the command recorded in the lock header. This workflow is a
# Workflows-local backstop for when that in-PR regeneration is unavailable
# (e.g. Dependabot PRs, or a Renovate run that could not run uv). To avoid
# fighting Renovate it re-runs the SAME header command verbatim, producing
# byte-identical output. (Not synced to consumers; consumers rely on the preset.)

on:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'tools/requirements-llm.txt'
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-lock:
    name: Regenerate requirements.lock
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.user.login == 'dependabot[bot]' && startsWith(github.head_ref, 'dependabot/')) ||
       (github.event.pull_request.user.login == 'renovate[bot]' && startsWith(github.head_ref, 'renovate/')))
    outputs:
      needs_update: ${{ steps.check.outputs.needs_update }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - name: Regenerate requirements.lock from its recorded header command
        id: check
        run: |
          set -euo pipefail
          if [ ! -f requirements.lock ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "No requirements.lock present; nothing to regenerate."
            exit 0
          fi

          # Re-run the EXACT command recorded in the lock header. Renovate's
          # pip-compile manager regenerates the lock the same way (it reads this
          # header), so producing byte-identical output keeps this backstop from
          # fighting Renovate with flip-flop commits. The header carries only
          # flags/paths (including the --output-file / -o target), so the
          # unquoted word-splitting below is intentional.
          args=$(sed -n 's/^#[[:space:]]*uv pip compile[[:space:]]\{1,\}\(.*\)$/\1/p' requirements.lock | head -n1)
          if [ -z "${args}" ]; then
            echo "::error::Could not parse a 'uv pip compile' command from the requirements.lock header."
            exit 1
          fi
          echo "Recorded command: uv pip compile ${args}"

          # shellcheck disable=SC2086
          uv pip compile ${args} 2>&1 | tee compile.log || {
            echo "❌ Compilation failed:"
            cat compile.log
            exit 1
          }

          if git diff --exit-code requirements.lock > /dev/null 2>&1; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "✓ Lock file is already up to date"
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "⚠ Lock file regenerated; committing the refreshed lock"
          fi

      - name: Save the regenerated lock
        if: steps.check.outputs.needs_update == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-lock-${{ github.event.pull_request.head.sha }}
          path: requirements.lock
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-lock:
    needs: regenerate-lock
    if: needs.regenerate-lock.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Only the trusted base supplies the API client on the writer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
      - uses: stranske/Workflows/.github/actions/setup-api-client@34762b63d36b76a48a83d869e7448b1410c3e80f # trusted client
        with:
          github_token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regenerated-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/regenerated-lock
      - name: Commit only to the checked bot PR head
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { withRetry } = require('./.github/scripts/github-api-with-retry.js');
            const expected = context.payload.pull_request;
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const { data: pr } = await withRetry(() => github.rest.pulls.get({
              ...context.repo, pull_number: expected.number,
            }));
            if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== repo || pr.user.login !== expected.user.login ||
                pr.head.ref !== expected.head.ref || pr.head.sha !== expected.head.sha) {
              core.notice('The dependency PR closed or changed since regeneration. Skipping this lock.');
              return;
            }
            const lock = path.join(process.env.RUNNER_TEMP, 'regenerated-lock', 'requirements.lock');
            if (!fs.lstatSync(lock).isFile()) throw new Error('Expected a regular requirements.lock');
            const contents = fs.readFileSync(lock).toString('base64');
            const { createCommitOnBranch } = await github.graphql(
              `mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) { commit { oid } }
              }`,
              { input: {
                branch: { repositoryNameWithOwner: repo, branchName: pr.head.ref },
                expectedHeadOid: expected.head.sha,
                message: { headline: 'chore(deps): regenerate requirements.lock' },
                fileChanges: { additions: [{ path: 'requirements.lock', contents }] },
              } }
            );
            core.info(`Updated requirements.lock at ${createCommitOnBranch.commit.oid}`);
