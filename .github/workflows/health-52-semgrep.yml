name: Health 52 Semgrep Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_security_relevant: ${{ steps.classify.outputs.is-security-relevant || 'true' }}
      is_python_code: ${{ steps.classify.outputs.is-python-code || 'true' }}
      classification_rationale: >-
        ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/path-classifier
        with:
          force-full: ${{ github.event_name == 'schedule' }}

  semgrep:
    name: Semgrep
    needs: classify
    if: >-
      ${{
        needs.classify.outputs.is_security_relevant == 'true' ||
        needs.classify.outputs.is_python_code == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        id: semgrep_scan
        continue-on-error: true
        run: >-
          semgrep scan
          --config p/default
          --config p/python
          --config p/github-actions
          --config p/secrets
          --sarif
          --output semgrep.sarif

      - name: Upload SARIF
        id: upload_sarif
        if: ${{ hashFiles('semgrep.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
          category: semgrep
