name: Maint 45 Cosmetic Repair

on:
  workflow_dispatch:
    inputs:
      base-branch:
        description: Base branch to target when opening the repair PR
        default: main
        required: false
      python-version:
        description: Python version to use for pytest
        default: '3.14'
        required: false
      dry-run:
        description: Run the repair helper in dry-run mode without creating commits
        default: 'false'
        required: false
      branch-suffix:
        description: Optional suffix appended to the repair branch name
        default: ''
        required: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      PYTHON_VERSION: ${{ inputs['python-version'] }}
      BASE_BRANCH: ${{ inputs['base-branch'] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.BASE_BRANCH }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --requirement requirements.lock

      - name: Run pytest (allow failures)
        id: pytest
        run: |
          exit_code=0
          # The classifier reads testcase marker properties from this report.
          .venv/bin/python -m pytest -q -o junit_family=xunit1 \
            --junitxml="$RUNNER_TEMP/pytest-report.xml" || exit_code=$?
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Run cosmetic repair on original report
        id: repair
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
          DRY_RUN: ${{ inputs['dry-run'] }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/pytest-report.xml"
          .venv/bin/python - "$report" <<'PYCODE'
          import os
          import sys
          from xml.etree import ElementTree

          try:
              root = ElementTree.parse(sys.argv[1]).getroot()
          except (OSError, ElementTree.ParseError) as exc:
              sys.exit(f"Cannot read the original pytest report: {exc}")
          cases = list(root.iter("testcase"))
          if root.tag not in {"testsuites", "testsuite"} or not cases:
              sys.exit("The original pytest report contains no test cases.")
          exit_code = os.environ["PYTEST_EXIT_CODE"]
          failures = any(case.find("failure") is not None for case in cases)
          errors = any(case.find("error") is not None for case in cases)
          if errors or exit_code not in {"0", "1"} or failures != (exit_code == "1"):
              sys.exit(f"Original pytest result is unresolved (exit {exit_code}).")
          PYCODE

          mode=--apply
          if [ "$DRY_RUN" = "true" ]; then
            mode=--dry-run
          fi
          .venv/bin/python -m scripts.ci_cosmetic_repair "$mode" --skip-pr \
            --report "$report" --base "$BASE_BRANCH"

          .venv/bin/python - <<'PYCODE'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          data = json.loads(Path(".cosmetic-repair-summary.json").read_text(encoding="utf-8"))
          status = data["status"]
          if os.environ["PYTEST_EXIT_CODE"] == "0" and status == "clean":
              sys.exit(0)
          if os.environ["DRY_RUN"] == "true" and status == "dry-run" and data.get("instructions"):
              sys.exit(0)
          if os.environ["DRY_RUN"] == "true" or status != "applied-no-pr":
              sys.exit(f"The original pytest failures remain unresolved (repair status: {status}).")

          paths = data.get("changed_files")
          changed = subprocess.check_output(["git", "diff", "--name-only", "-z", "HEAD"], text=True)
          if not paths or set(paths) != set(changed.rstrip("\0").split("\0")):
              sys.exit("The tracked diff does not match the reported repair files.")
          if any(path != path.strip() or any(c in path for c in ",\r\n") for path in paths):
              sys.exit("A repair path cannot be passed exactly to the pull request action.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print("add_paths<<REPAIR_PATHS", file=output)
              for path in paths:
                  print(f":(literal){path}", file=output)
              print("REPAIR_PATHS", file=output)
          PYCODE

      - name: Create cosmetic repair PR
        if: steps.repair.outputs.add_paths != ''
        id: publish
        uses: peter-evans/create-pull-request@v8
        with:
          branch: cosmetic-repair/${{ github.run_id }}${{ inputs['branch-suffix'] && format('-{0}', inputs['branch-suffix']) || '' }}
          base: ${{ env.BASE_BRANCH }}
          add-paths: ${{ steps.repair.outputs.add_paths }}
          title: Cosmetic repair from original pytest report
          commit-message: "ci: apply cosmetic repairs"
          labels: 'testing,autofix:applied'
          body: |
            The original pytest report contains guarded cosmetic failures.
            This PR applies the reported changes for review. The workflow did
            not rerun pytest after applying the repair.

      - name: Upload cosmetic repair evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          retention-days: 30
          name: cosmetic-repair-artifacts
          path: |
            ${{ runner.temp }}/pytest-report.xml
            .cosmetic-repair-summary.json
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Summarize cosmetic repair
        if: always()
        env:
          PYTEST_EXIT_CODE: ${{ steps.pytest.outputs.exit_code }}
          REPAIR_OUTCOME: ${{ steps.repair.outcome }}
          PR_URL: ${{ steps.publish.outputs.pull-request-url }}
          ADD_PATHS: ${{ steps.repair.outputs.add_paths }}
        run: |
          {
            echo "### Cosmetic repair summary"
            echo
            echo "- Original pytest exit: ${PYTEST_EXIT_CODE:-unavailable}"
            if [ -f .cosmetic-repair-summary.json ]; then
              .venv/bin/python .github/scripts/render_cosmetic_summary.py .cosmetic-repair-summary.json
            fi
            if [ "$REPAIR_OUTCOME" != "success" ]; then
              echo "- Repair did not complete. See the original report and step logs."
            elif [ -n "$PR_URL" ]; then
              echo "- Repair pull request: $PR_URL"
            elif [ -n "$ADD_PATHS" ]; then
              echo "- A repair was applied locally, but no pull request was confirmed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ADD_PATHS" ] && [ -z "$PR_URL" ]; then
            exit 1
          fi
