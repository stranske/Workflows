name: Health 68 Consumer Sync Drift Check

# Validates that registered consumer repos stay in sync with templates and manifest entries.
# Skips files marked with sync_mode: create_only.

on:
  push:
    branches: [main]
    paths:
      - 'templates/consumer-repo/**'
      - '.github/sync-manifest.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'tools/**'
  schedule:
    - cron: '10 5 * * *'  # Daily at 5:10 UTC
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos to check (empty for registered list)'
        type: string
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: consumer-sync-drift-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Validate consumer repo drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@v7

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Compare consumer repos to templates
        id: compare
        env:
          CONSUMER_SYNC_DRIFT_REPORT_JSON: artifacts/consumer-sync-drift-report.json
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          mkdir -p artifacts
          repos_input="${INPUT_REPOS:-}"
          if [ -z "$repos_input" ]; then
          repos_input=$(python3 scripts/list_registered_consumer_repos.py --separator=,)
          fi
          python3 scripts/check_consumer_sync_drift.py \
            --repos "$repos_input" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report-json "$CONSUMER_SYNC_DRIFT_REPORT_JSON"

      - name: Upload drift report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: consumer-sync-drift-report
          path: artifacts/consumer-sync-drift-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Create drift issue
        if: ${{ failure() }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const {
              formatIssueBody,
              formatIssueComment,
            } = require('./.github/scripts/consumer_sync_drift_issue_body.js');
            const {
              appendTrackerComment,
              findOrCreateTracker,
              updateTrackerBody,
            } = require('./.github/scripts/sync_tracker_state');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;
            const isRateLimitError = (error) => {
              const status = error?.status || error?.response?.status;
              const message = String(
                error?.message || error?.response?.data?.message || ''
              ).toLowerCase();
              const remaining = Number.parseInt(
                error?.response?.headers?.['x-ratelimit-remaining'] ||
                  error?.headers?.['x-ratelimit-remaining'] ||
                  '',
                10
              );
              return (
                status === 429 ||
                (status === 403 &&
                  (message.includes('rate limit') || message.includes('api rate limit exceeded'))) ||
                (Number.isFinite(remaining) && remaining <= 0)
              );
            };
            const skipOnRateLimit = async (label, fn) => {
              try {
                return await withRetry(fn, { maxRetries: 0 });
              } catch (error) {
                if (isRateLimitError(error)) {
                  core.warning(
                    `Skipped consumer drift issue ${label} because GitHub REST Core is exhausted. ` +
                    'The drift report artifact remains available for remote and manual consumers.'
                  );
                  return null;
                }
                throw error;
              }
            };
            const title = '🔄 Consumer repo drift detected';
            const label = 'consumer-sync';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const reportPath = 'artifacts/consumer-sync-drift-report.json';
            let report = {};
            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } else {
              console.log(`Drift report missing at ${reportPath}; creating generic issue body.`);
            }

            const body = formatIssueBody(report, {
              runUrl,
              runId: process.env.GITHUB_RUN_ID,
              runNumber: process.env.GITHUB_RUN_NUMBER,
            });

            const tracker = await skipOnRateLimit('tracker lookup/create', () => findOrCreateTracker({
              github,
              context,
              label,
              titlePattern: /^🔄 Consumer repo drift detected$/,
              markerPattern: /consumer-sync-drift:v1/,
              title,
              body,
              labels: ['automation'],
              core,
              withRetry,
            }));
            if (!tracker) {
              return;
            }

            if (tracker.sync_tracker_created) {
              console.log(`Created issue #${tracker.number}`);
            } else {
              const updateResult = await skipOnRateLimit('body update', () => updateTrackerBody({
                github,
                context,
                tracker,
                newBody: body,
                core,
                withRetry,
              }));
              if (!updateResult) {
                return;
              }
              console.log(`Refreshed drift issue body for #${tracker.number}`);
              const commentResult = await skipOnRateLimit('comment', () => appendTrackerComment({
                github,
                context,
                tracker,
                comment: formatIssueComment(report, {
                  runUrl,
                  runId: process.env.GITHUB_RUN_ID,
                  runNumber: process.env.GITHUB_RUN_NUMBER,
                }),
                core,
                withRetry,
              }));
              if (!commentResult) {
                return;
              }
              console.log(`Added comment to existing issue #${tracker.number}`);
            }
