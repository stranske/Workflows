name: Health 68 Consumer Sync Drift Check

# Validates that registered consumer repos stay in sync with templates and manifest entries.
# Skips files marked with sync_mode: create_only for actionable drift;
# reports Gate pull_request.types differences separately as FYI.

on:
  # Measure on the drain's cadence, not on every push. Maint 68 (the drain) delivers on
  # its 05:00 schedule plus dispatches; a push to main is not drift until Maint 68 has
  # had its lease to deliver it, so a push-triggered comparison only ever re-measured
  # undelivered work. The comparison classifies "main moved after the last Maint 68
  # delivery" as pending_delivery (see scripts/check_consumer_sync_drift.py).
  workflow_run:
    workflows: [Merge Sync PRs]
    types: [completed]
  schedule:
    # Daily, after the 05:00 Maint 68 delivery and the 05:30 Maint 71 janitor.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos to check (empty for registered list)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  # A scoped manual report must not interrupt a fleet comparison.
  group: >-
    ${{ inputs.repos != '' && format('health-68-consumer-sync-drift-scoped-{0}', github.run_id) ||
        'health-68-consumer-sync-drift' }}
  cancel-in-progress: true

jobs:
  check-drift:
    name: Validate consumer repo drift
    # Only the daily scheduled Maint 71 janitor pass re-measures. Its dispatched
    # continuations (several an hour) end this run `skipped` at the job level, so a run
    # that did not compare can never conclude `success`. This replaces the cache-marker
    # debounce, whose debounced runs concluded `success` with the comparison skipped.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event == 'schedule')
    runs-on: ubuntu-latest
    outputs:
      drift_failed: ${{ steps.compare.outcome == 'failure' }}
      drift_clean: ${{ steps.compare.outcome == 'success' }}
      compared: ${{ steps.compare.outcome != 'skipped' }}
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Restore the uncovered clock
        # When each repo was first seen uncovered. It resets only when the repo is
        # converged or covered, so neither a later (or scoped) Maint 68 promotion nor
        # delivery history falling off the listed page can renew an expired lease.
        # A cache miss starts the clock now; delivery-anchored ages still apply.
        if: inputs.repos == ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/health-68-uncovered
          key: health-68-uncovered-${{ github.run_id }}
          restore-keys: |
            health-68-uncovered-

      - name: Read Maint 68 delivery history
        # The drain's own record: successful promote runs and the plan each delivered.
        # A failed read leaves no file, which the comparison treats as unreadable
        # (uncovered drift blocking at once), never as "no deliveries".
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check_consumer_sync_drift.py \
            --write-deliveries artifacts/maint-68-deliveries.json

      - name: Compare consumer repos to templates
        id: compare
        env:
          CONSUMER_SYNC_DRIFT_REPORT_JSON: artifacts/consumer-sync-drift-report.json
          CONSUMER_SYNC_DELIVERIES_JSON: artifacts/maint-68-deliveries.json
          CONSUMER_SYNC_UNCOVERED_CLOCK: >-
            ${{ inputs.repos == '' && '.cache/health-68-uncovered/first-seen.json' || '' }}
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          mkdir -p artifacts
          repos_input="${INPUT_REPOS:-}"
          if [ -z "$repos_input" ]; then
          repos_input=$(python3 scripts/list_registered_consumer_repos.py --separator=,)
          fi
          python3 scripts/check_consumer_sync_drift.py \
            --repos "$repos_input" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report-json "$CONSUMER_SYNC_DRIFT_REPORT_JSON"

      - name: Save the uncovered clock
        if: >-
          ${{ always() && inputs.repos == '' &&
              (steps.compare.outcome == 'success' || steps.compare.outcome == 'failure') &&
              hashFiles('.cache/health-68-uncovered/first-seen.json') != '' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .cache/health-68-uncovered
          key: health-68-uncovered-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: consumer-sync-drift-report
          path: artifacts/consumer-sync-drift-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload rate limit incidents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: health-68-check-drift-rate-limit-incidents
          path: artifacts/rate-limit-incidents.ndjson
          if-no-files-found: ignore
          retention-days: 14

  publish-drift:
    name: Publish actionable drift alert
    needs: check-drift
    if: ${{ always() && inputs.repos == '' && needs.check-drift.outputs.drift_failed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}

      - name: Download drift report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: consumer-sync-drift-report
          path: artifacts

      - name: Create drift issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const {
              formatIssueBody,
              formatIssueComment,
              parseIssueMarker,
            } = require('./.github/scripts/consumer_sync_drift_issue_body.js');
            const {
              appendTrackerComment,
              findOrCreateTracker,
              updateTrackerBody,
            } = require('./.github/scripts/sync_tracker_state.js');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;
            const isRateLimitError = (error) => {
              const status = error?.status || error?.response?.status;
              const message = String(
                error?.message || error?.response?.data?.message || ''
              ).toLowerCase();
              const remaining = Number.parseInt(
                error?.response?.headers?.['x-ratelimit-remaining'] ||
                  error?.headers?.['x-ratelimit-remaining'] ||
                  '',
                10
              );
              return (
                status === 429 ||
                (status === 403 &&
                  (message.includes('rate limit') || message.includes('api rate limit exceeded'))) ||
                (Number.isFinite(remaining) && remaining <= 0)
              );
            };
            const skipOnRateLimit = async (label, fn) => {
              try {
                return await withRetry(fn, { maxRetries: 0 });
              } catch (error) {
                if (isRateLimitError(error)) {
                  core.warning(
                    `Skipped consumer drift issue ${label} because GitHub REST Core is exhausted. ` +
                    'The drift report artifact remains available for remote and manual consumers.'
                  );
                  return null;
                }
                throw error;
              }
            };
            const title = '🔄 Consumer repo drift detected';
            const label = 'consumer-sync';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const reportPath = 'artifacts/consumer-sync-drift-report.json';
            let report = {};
            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } else {
              console.log(`Drift report missing at ${reportPath}; creating generic issue body.`);
            }

            const now = new Date().toISOString();
            const bodyOptions = {
              runUrl,
              runId: process.env.GITHUB_RUN_ID,
              runNumber: process.env.GITHUB_RUN_NUMBER,
              now,
              updatedAt: now,
            };
            // A new issue starts a new episode: every uncovered repo is aged from now.
            const body = formatIssueBody(report, bodyOptions);

            const tracker = await skipOnRateLimit('tracker lookup/create', () => findOrCreateTracker({
              github,
              context,
              label,
              titlePattern: /^🔄 Consumer repo drift detected$/,
              markerPattern: /consumer-sync-drift:v1/,
              title,
              body,
              labels: ['automation'],
              durable: false,
              core,
              withRetry,
            }));
            if (!tracker) {
              return;
            }

            if (tracker.sync_tracker_created) {
              console.log(`Created issue #${tracker.number}`);
            } else {
              // Carry each repo's "uncovered since" forward from this issue's own marker, so
              // only drift that stays uncovered past the coverage lease asks for action.
              const previousMarker = parseIssueMarker(tracker.body);
              bodyOptions.previousMarker = previousMarker;
              const refreshedBody = formatIssueBody(report, bodyOptions);
              const updateResult = await skipOnRateLimit('body update', () => updateTrackerBody({
                github,
                context,
                tracker,
                newBody: refreshedBody,
                preserveDurableHeader: false,
                core,
                withRetry,
              }));
              if (!updateResult) {
                return;
              }
              console.log(`Refreshed drift issue body for #${tracker.number}`);
              const comment = formatIssueComment(report, bodyOptions);
              if (!comment.trim()) {
                console.log(`Skipped empty comment for existing issue #${tracker.number}`);
                return;
              }
              const commentResult = await skipOnRateLimit('comment', () => appendTrackerComment({
                github,
                context,
                tracker,
                comment,
                core,
                withRetry,
              }));
              if (!commentResult) {
                return;
              }
              console.log(`Added comment to existing issue #${tracker.number}`);
            }

      - name: Upload rate limit incidents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: health-68-publish-drift-rate-limit-incidents
          path: artifacts/rate-limit-incidents.ndjson
          if-no-files-found: ignore
          retention-days: 14

  resolve-drift:
    name: Resolve recovered drift alert
    needs: check-drift
    if: >-
      ${{ always() && needs.check-drift.result == 'success' &&
          inputs.repos == '' &&
          needs.check-drift.outputs.drift_clean == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}

      - name: Close recovered drift alert
        uses: actions/github-script@v9
        with:
          script: |
            const {
              appendTrackerComment,
              findOrCreateTracker,
            } = require('./.github/scripts/sync_tracker_state.js');
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'health-68-resolve-drift-alert',
              capabilities: ['issues:write'],
            });
            const alert = await findOrCreateTracker({
              github,
              context,
              label: 'consumer-sync',
              titlePattern: /^🔄 Consumer repo drift detected$/,
              markerPattern: /consumer-sync-drift:v1/,
              createIfMissing: false,
              durable: false,
              core,
              withRetry,
            });
            if (!alert) {
              core.info('No open consumer drift alert to close.');
              return;
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await appendTrackerComment({
              github,
              context,
              tracker: alert,
              comment: `### ✅ Consumer sync drift resolved\n\nHealth 68 found no drift past the coverage lease in [run ${process.env.GITHUB_RUN_ID}](${runUrl}). Anything still uncovered is covered by a delivery PR, waits for the next Maint 68 delivery, or is younger than the lease.`,
              core,
              withRetry,
            });
            try {
              await withRetry((client) => client.rest.issues.removeLabel({
                ...context.repo,
                issue_number: alert.number,
                name: 'tracker:durable',
              }));
            } catch (error) {
              if ((error.status || error?.response?.status) !== 404) {
                throw error;
              }
            }
            await withRetry((client) => client.rest.issues.update({
              ...context.repo,
              issue_number: alert.number,
              state: 'closed',
              state_reason: 'completed',
            }));
            core.notice(`Closed recovered consumer drift alert #${alert.number}`);

      - name: Upload rate limit incidents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: health-68-resolve-drift-rate-limit-incidents
          path: artifacts/rate-limit-incidents.ndjson
          if-no-files-found: ignore
          retention-days: 14
