name: Health 68 Consumer Sync Drift Check

# Validates that registered consumer repos stay in sync with templates and manifest entries.
# Skips files marked with sync_mode: create_only.

on:
  push:
    branches: [main]
    paths:
      - 'templates/consumer-repo/**'
      - '.github/sync-manifest.yml'
      - '.github/scripts/**'
      - 'scripts/**'
      - 'tools/**'
  workflow_run:
    workflows: [Merge Sync PRs]
    types: [completed]
  schedule:
    # Daily self-healing cadence; workflow_run remains debounced below.
    - cron: '15 6 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos to check (empty for registered list)'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: health-68-consumer-sync-drift
  cancel-in-progress: true

jobs:
  check-drift:
    name: Validate consumer repo drift
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      drift_failed: ${{ steps.compare.outcome == 'failure' }}
      drift_clean: ${{ steps.compare.outcome == 'success' }}
      compared: ${{ steps.compare.outcome != 'skipped' }}
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}

      - name: Debounce workflow_run fan-out
        id: debounce
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          DEBOUNCE_MINUTES: '30'
        run: |
          set -euo pipefail
          latest_created="$(
            node -e '
            const { Octokit } = require("@octokit/rest");
            const { createTokenAwareRetry } = require("./.github/scripts/github-api-with-retry.js");
            const core = { info: () => {}, warning: console.warn, debug: () => {} };
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split("/");

            (async () => {
              const github = new Octokit({ auth: process.env.GH_TOKEN || process.env.GITHUB_TOKEN });
              const { withRetry } = await createTokenAwareRetry({
                github,
                core,
                env: process.env,
                task: "health-68-consumer-sync-drift-debounce",
                capabilities: ["actions:read"],
              });
              const response = await withRetry(() => github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "health-68-consumer-sync-drift.yml",
                branch: "main",
                per_page: 20,
              }));
              for (const run of response.data.workflow_runs) {
                if (run.id === Number(process.env.GITHUB_RUN_ID)) continue;
                if (!["success", "failure", "timed_out"].includes(run.conclusion)) continue;
                const jobs = await withRetry(() => github.rest.actions.listJobsForWorkflowRun({
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                }));
                const compared = jobs.data.jobs.some((job) => job.steps?.some(
                  (step) => step.name === "Compare consumer repos to templates" && step.conclusion !== "skipped",
                ));
                if (compared) {
                  process.stdout.write(run.created_at);
                  return;
                }
              }
            })().catch((error) => {
              console.error(error);
              process.exit(1);
            });
            '
          )"
          if [ -z "$latest_created" ]; then
            echo "No prior executable Health 68 run; continuing."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest_epoch="$(date -d "$latest_created" +%s)"
          now_epoch="$(date -u +%s)"
          age_minutes=$(( (now_epoch - latest_epoch) / 60 ))
          echo "Last executable Health 68 run was ${age_minutes} minutes ago at ${latest_created}."
          if [ "$age_minutes" -lt "$DEBOUNCE_MINUTES" ]; then
            echo "Skipping debounced workflow_run fan-out (< ${DEBOUNCE_MINUTES} minutes)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        if: steps.debounce.outputs.skip != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        if: steps.debounce.outputs.skip != 'true'
        run: pip install pyyaml requests

      - name: Compare consumer repos to templates
        id: compare
        if: steps.debounce.outputs.skip != 'true'
        env:
          CONSUMER_SYNC_DRIFT_REPORT_JSON: artifacts/consumer-sync-drift-report.json
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          mkdir -p artifacts
          repos_input="${INPUT_REPOS:-}"
          if [ -z "$repos_input" ]; then
          repos_input=$(python3 scripts/list_registered_consumer_repos.py --separator=,)
          fi
          python3 scripts/check_consumer_sync_drift.py \
            --repos "$repos_input" \
            --summary "$GITHUB_STEP_SUMMARY" \
            --report-json "$CONSUMER_SYNC_DRIFT_REPORT_JSON"

      - name: Upload drift report
        if: ${{ always() && steps.debounce.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: consumer-sync-drift-report
          path: artifacts/consumer-sync-drift-report.json
          if-no-files-found: warn
          retention-days: 14

  publish-drift:
    name: Publish actionable drift alert
    needs: check-drift
    if: ${{ always() && needs.check-drift.outputs.drift_failed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}

      - name: Download drift report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: consumer-sync-drift-report
          path: artifacts

      - name: Create drift issue
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const {
              formatIssueBody,
              formatIssueComment,
            } = require('./.github/scripts/consumer_sync_drift_issue_body.js');
            const {
              appendTrackerComment,
              findOrCreateTracker,
              updateTrackerBody,
            } = require('./.github/scripts/sync_tracker_state');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;
            const isRateLimitError = (error) => {
              const status = error?.status || error?.response?.status;
              const message = String(
                error?.message || error?.response?.data?.message || ''
              ).toLowerCase();
              const remaining = Number.parseInt(
                error?.response?.headers?.['x-ratelimit-remaining'] ||
                  error?.headers?.['x-ratelimit-remaining'] ||
                  '',
                10
              );
              return (
                status === 429 ||
                (status === 403 &&
                  (message.includes('rate limit') || message.includes('api rate limit exceeded'))) ||
                (Number.isFinite(remaining) && remaining <= 0)
              );
            };
            const skipOnRateLimit = async (label, fn) => {
              try {
                return await withRetry(fn, { maxRetries: 0 });
              } catch (error) {
                if (isRateLimitError(error)) {
                  core.warning(
                    `Skipped consumer drift issue ${label} because GitHub REST Core is exhausted. ` +
                    'The drift report artifact remains available for remote and manual consumers.'
                  );
                  return null;
                }
                throw error;
              }
            };
            const title = '🔄 Consumer repo drift detected';
            const label = 'consumer-sync';
            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const reportPath = 'artifacts/consumer-sync-drift-report.json';
            let report = {};
            if (fs.existsSync(reportPath)) {
              report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            } else {
              console.log(`Drift report missing at ${reportPath}; creating generic issue body.`);
            }

            const body = formatIssueBody(report, {
              runUrl,
              runId: process.env.GITHUB_RUN_ID,
              runNumber: process.env.GITHUB_RUN_NUMBER,
            });

            const tracker = await skipOnRateLimit('tracker lookup/create', () => findOrCreateTracker({
              github,
              context,
              label,
              titlePattern: /^🔄 Consumer repo drift detected$/,
              markerPattern: /consumer-sync-drift:v1/,
              title,
              body,
              labels: ['automation'],
              durable: false,
              core,
              withRetry,
            }));
            if (!tracker) {
              return;
            }

            if (tracker.sync_tracker_created) {
              console.log(`Created issue #${tracker.number}`);
            } else {
              const updateResult = await skipOnRateLimit('body update', () => updateTrackerBody({
                github,
                context,
                tracker,
                newBody: body,
                preserveDurableHeader: false,
                core,
                withRetry,
              }));
              if (!updateResult) {
                return;
              }
              console.log(`Refreshed drift issue body for #${tracker.number}`);
              const comment = formatIssueComment(report, {
                runUrl,
                runId: process.env.GITHUB_RUN_ID,
                runNumber: process.env.GITHUB_RUN_NUMBER,
              });
              if (!comment.trim()) {
                console.log(`Skipped empty comment for existing issue #${tracker.number}`);
                return;
              }
              const commentResult = await skipOnRateLimit('comment', () => appendTrackerComment({
                github,
                context,
                tracker,
                comment,
                core,
                withRetry,
              }));
              if (!commentResult) {
                return;
              }
              console.log(`Added comment to existing issue #${tracker.number}`);
            }

  resolve-drift:
    name: Resolve recovered drift alert
    needs: check-drift
    if: >-
      ${{ always() && needs.check-drift.result == 'success' &&
          inputs.repos == '' &&
          needs.check-drift.outputs.drift_clean == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}

      - name: Close recovered drift alert
        uses: actions/github-script@v9
        with:
          script: |
            const {
              appendTrackerComment,
              findOrCreateTracker,
            } = require('./.github/scripts/sync_tracker_state');
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'health-68-resolve-drift-alert',
              capabilities: ['issues:write'],
            });
            const alert = await findOrCreateTracker({
              github,
              context,
              label: 'consumer-sync',
              titlePattern: /^🔄 Consumer repo drift detected$/,
              markerPattern: /consumer-sync-drift:v1/,
              createIfMissing: false,
              durable: false,
              core,
              withRetry,
            });
            if (!alert) {
              core.info('No open consumer drift alert to close.');
              return;
            }

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            await appendTrackerComment({
              github,
              context,
              tracker: alert,
              comment: `### ✅ Consumer sync drift resolved\n\nHealth 68 completed a clean comparison in [run ${process.env.GITHUB_RUN_ID}](${runUrl}).`,
              core,
              withRetry,
            });
            try {
              await withRetry((client) => client.rest.issues.removeLabel({
                ...context.repo,
                issue_number: alert.number,
                name: 'tracker:durable',
              }));
            } catch (error) {
              if ((error.status || error?.response?.status) !== 404) {
                throw error;
              }
            }
            await withRetry((client) => client.rest.issues.update({
              ...context.repo,
              issue_number: alert.number,
              state: 'closed',
              state_reason: 'completed',
            }));
            core.notice(`Closed recovered consumer drift alert #${alert.number}`);
