name: Maint 50 Tool Version Check

# Check for new versions of CI/autofix tools and create an issue if updates are available
# Runs weekly on Mondays at 8:00 AM UTC

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Mondays
  workflow_dispatch:
    inputs:
      force_issue:
        description: 'Force issue creation even if versions are current'
        required: false
        default: 'false'

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-versions:
    name: Check for tool updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}


      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check current versions
        id: current
        run: |
          source .github/workflows/autofix-versions.env
          {
            echo "black_current=${BLACK_VERSION}"
            echo "ruff_current=${RUFF_VERSION}"
            echo "isort_current=${ISORT_VERSION}"
            echo "docformatter_current=${DOCFORMATTER_VERSION}"
            echo "mypy_current=${MYPY_VERSION}"
            echo "pytest_current=${PYTEST_VERSION}"
            echo "pytest_cov_current=${PYTEST_COV_VERSION}"
            echo "coverage_current=${COVERAGE_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Check latest PyPI versions
        id: latest
        run: |
          python scripts/maint_tool_version_check.py latest

      - name: Compare versions and generate report
        id: compare
        env:
          BLACK_CURRENT: ${{ steps.current.outputs.black_current }}
          RUFF_CURRENT: ${{ steps.current.outputs.ruff_current }}
          DOCFORMATTER_CURRENT: ${{ steps.current.outputs.docformatter_current }}
          ISORT_CURRENT: ${{ steps.current.outputs.isort_current }}
          MYPY_CURRENT: ${{ steps.current.outputs.mypy_current }}
          PYTEST_CURRENT: ${{ steps.current.outputs.pytest_current }}
          PYTEST_COV_CURRENT: ${{ steps.current.outputs.pytest_cov_current }}
          COVERAGE_CURRENT: ${{ steps.current.outputs.coverage_current }}
          BLACK_LATEST: ${{ steps.latest.outputs.black_latest }}
          RUFF_LATEST: ${{ steps.latest.outputs.ruff_latest }}
          DOCFORMATTER_LATEST: ${{ steps.latest.outputs.docformatter_latest }}
          ISORT_LATEST: ${{ steps.latest.outputs.isort_latest }}
          MYPY_LATEST: ${{ steps.latest.outputs.mypy_latest }}
          PYTEST_LATEST: ${{ steps.latest.outputs.pytest_latest }}
          PYTEST_COV_LATEST: ${{ steps.latest.outputs.pytest_cov_latest }}
          COVERAGE_LATEST: ${{ steps.latest.outputs.coverage_latest }}
          WORKFLOW_URL: >-
            ${{ github.event.repository.html_url
            }}/actions/workflows/maint-50-tool-version-check.yml
        run: |
          python scripts/maint_tool_version_check.py compare

      - name: Create or update issue
        if: steps.compare.outputs.has_updates == 'true' || github.event.inputs.force_issue == 'true'
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;
            const body = fs.readFileSync('tool-version-issue-body.md', 'utf8');

            const title = '🔧 CI/Autofix Tool Updates Available';

            // Search for existing open issues with this title
            const issues = await withRetry(() =>
              github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'maintenance,dependencies',
                per_page: 100,
              })
            );

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (existingIssue) {
              // Update existing issue
              await withRetry(() => github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: body
              }));

              await withRetry(() => github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `🔄 Updated with latest version check results.`
              }));

              core.notice(`Updated existing issue #${existingIssue.number}`);
            } else {
              // Create new issue
              const issue = await withRetry(() => github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['maintenance', 'dependencies']
              }));

              core.notice(`Created issue #${issue.data.number}`);
            }

      - name: Summary
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ${{ steps.compare.outputs.report }}
          EOF
