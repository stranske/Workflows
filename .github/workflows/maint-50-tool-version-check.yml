name: Maint 50 Tool Version Check

# Read-only freshness evidence for CI/autofix tools.
# Source proposals belong to maint-auto-update-pypi-versions.yml, which owns
# the weekly batch window and any explicit security override.

on:
  schedule:
    - cron: '0 8 * * 1'  # Weekly on Mondays
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-versions:
    name: Check for tool updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Compare versions and generate report
        id: compare
        # Current versions come from autofix-versions.env and latest from PyPI, for every
        # tool the env file pins (scripts/maint_tool_version_check.py derives the list).
        env:
          WORKFLOW_URL: >-
            ${{ github.event.repository.html_url
            }}/actions/workflows/maint-50-tool-version-check.yml
        run: |
          python scripts/maint_tool_version_check.py compare

      - name: Summary
        run: |
          echo "Source proposals belong to maint-auto-update-pypi-versions.yml." >> "$GITHUB_STEP_SUMMARY"
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ${{ steps.compare.outputs.report }}
          EOF
