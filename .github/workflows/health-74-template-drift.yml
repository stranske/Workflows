name: Health 74 Template Drift

on:
  push:
    paths:
      - '.github/workflows/agents-*.yml'
      - 'templates/consumer-repo/.github/workflows/*.yml'
      - 'scripts/check_template_drift.py'
      - 'config/template-drift-allowlist.txt'
  pull_request:
    paths:
      - '.github/workflows/agents-*.yml'
      - 'templates/consumer-repo/.github/workflows/*.yml'
      - 'scripts/check_template_drift.py'
      - 'config/template-drift-allowlist.txt'

jobs:
  check-drift:
    name: Check Template Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install checker dependencies
        run: pip install pyyaml

      - name: Check for template drift
        id: drift
        run: |
          set -euo pipefail
          set +e
          python scripts/check_template_drift.py \
            --allowlist config/template-drift-allowlist.txt \
            --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e

          if [[ "$status" -eq 0 ]]; then
            echo "drift_found=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift_found=true" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
