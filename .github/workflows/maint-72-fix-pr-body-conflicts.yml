# Maintenance workflow to fix pr_body.md merge conflicts across consumer repos
#
# Problem: pr_body.md is created per-PR and should never be committed to main.
# When PRs merge, they sometimes bring pr_body.md into main, causing conflicts
# with other PR branches that have their own version.
#
# Solution: This workflow:
# 1. Removes pr_body.md from main branch (if it exists)
# 2. Ensures pr_body.md is in .gitignore
# 3. Can be run manually or scheduled to clean up repos
#
# The root cause fix is in reusable-codex-run.yml which unstages pr_body.md
# before committing. This workflow handles the cleanup of historical commits.

name: Maint 72 Fix PR Body Conflicts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run - show what would be changed without making changes'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      target_repo:
        description: 'Specific repo to fix (leave empty for all consumer repos)'
        required: false
        default: ''
        type: string
  schedule:
    # Run weekly on Sunday at 3am UTC to catch any repos that need cleanup
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: fix-pr-body-conflicts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-repos:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo:
          - stranske/Trend_Model_Project
          - stranske/Portable-Alpha-Extension-Model
          - stranske/Collab-Admin
          - stranske/trip-planner
          - stranske/Manager-Database
          - stranske/Travel-Plan-Permission
          - stranske/Template
    steps:
      - name: Check if should process this repo
        id: check
        run: |
          TARGET="${{ inputs.target_repo }}"
          CURRENT="${{ matrix.repo }}"
          if [ -n "$TARGET" ] && [ "$TARGET" != "$CURRENT" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Skipping $CURRENT (target is $TARGET)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract repo name
        if: steps.check.outputs.skip != 'true'
        id: repo-info
        run: |
          echo "repo_name=$(echo '${{ matrix.repo }}' | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        if: steps.check.outputs.skip != 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: stranske
          repositories: ${{ steps.repo-info.outputs.repo_name }}

      - name: Checkout retry helpers
        if: steps.check.outputs.skip != 'true'
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts/github-api-with-retry.js
          sparse-checkout-cone-mode: false

      - name: Check and fix pr_body.md
        if: steps.check.outputs.skip != 'true'
        uses: actions/github-script@v8
        env:
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          REPO_FULL: ${{ matrix.repo }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPO_FULL.split('/');
            const dryRun = process.env.DRY_RUN === 'true';
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (method, params) => github.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            console.log(`\n${'='.repeat(60)}`);
            console.log(`Processing ${owner}/${repo} (dry_run=${dryRun})`);
            console.log(`${'='.repeat(60)}\n`);

            let needsFix = false;
            let actions = [];

            // Step 1: Check if pr_body.md exists on main
            let prBodyExists = false;
            let prBodySha = null;
            try {
              const { data } = await withRetry(() => github.rest.repos.getContent({
                owner,
                repo,
                path: 'pr_body.md',
                ref: 'main'
              }));
              prBodyExists = true;
              prBodySha = data.sha;
              console.log(`⚠️  pr_body.md EXISTS on main (sha: ${prBodySha.substring(0, 8)})`);
              needsFix = true;
              actions.push('delete pr_body.md from main');
            } catch (e) {
              if (e.status === 404) {
                console.log(`✅ pr_body.md does not exist on main - good!`);
              } else {
                console.log(`❌ Error checking pr_body.md: ${e.message}`);
              }
            }

            // Step 2: Check if pr_body.md is in .gitignore
            let gitignoreContent = '';
            let gitignoreSha = null;
            let prBodyInGitignore = false;
            try {
              const { data } = await withRetry(() => github.rest.repos.getContent({
                owner,
                repo,
                path: '.gitignore',
                ref: 'main'
              }));
              gitignoreContent = Buffer.from(data.content, 'base64').toString('utf8');
              gitignoreSha = data.sha;

              // Check for pr_body.md pattern
              const lines = gitignoreContent.split('\n');
              prBodyInGitignore = lines.some(line => {
                const trimmed = line.trim();
                return trimmed === 'pr_body.md' || trimmed === '/pr_body.md';
              });

              if (prBodyInGitignore) {
                console.log(`✅ pr_body.md is in .gitignore`);
              } else {
                console.log(`⚠️  pr_body.md is NOT in .gitignore`);
                needsFix = true;
                actions.push('add pr_body.md to .gitignore');
              }
            } catch (e) {
              if (e.status === 404) {
                console.log(`⚠️  No .gitignore file found - will create one`);
                needsFix = true;
                actions.push('create .gitignore with pr_body.md');
              } else {
                console.log(`❌ Error checking .gitignore: ${e.message}`);
              }
            }

            // Summary
            console.log(`\n--- Summary ---`);
            if (!needsFix) {
              console.log(`✅ ${owner}/${repo} is already configured correctly`);
              return;
            }

            console.log(`Actions needed: ${actions.join(', ')}`);

            if (dryRun) {
              console.log(`\n🔍 DRY RUN - no changes made`);
              core.notice(`${owner}/${repo}: Would ${actions.join(' and ')}`);
              return;
            }

            // Step 3: Make the fixes
            console.log(`\n--- Applying fixes ---`);

            // Delete pr_body.md if it exists
            if (prBodyExists && prBodySha) {
              try {
                await withRetry(() => github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path: 'pr_body.md',
                  message: 'chore: remove pr_body.md from main\n\nThis file should not be tracked. It is PR-specific and causes merge conflicts.',
                  sha: prBodySha,
                  branch: 'main'
                }));
                console.log(`✅ Deleted pr_body.md from main`);
              } catch (e) {
                console.log(`❌ Failed to delete pr_body.md: ${e.message}`);
                core.error(`${owner}/${repo}: Failed to delete pr_body.md: ${e.message}`);
              }
            }

            // Add to .gitignore if not present
            if (!prBodyInGitignore) {
              const ignoreEntry = '\n# PR-specific file - should not be tracked\npr_body.md\n';
              const newContent = gitignoreSha
                ? gitignoreContent + ignoreEntry
                : `# Auto-generated .gitignore\n${ignoreEntry}`;

              try {
                if (gitignoreSha) {
                  await withRetry(() => github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: '.gitignore',
                    message: 'chore: add pr_body.md to .gitignore\n\nPrevent merge conflicts from PR-specific content.',
                    content: Buffer.from(newContent).toString('base64'),
                    sha: gitignoreSha,
                    branch: 'main'
                  }));
                } else {
                  await withRetry(() => github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: '.gitignore',
                    message: 'chore: create .gitignore with pr_body.md\n\nPrevent merge conflicts from PR-specific content.',
                    content: Buffer.from(newContent).toString('base64'),
                    branch: 'main'
                  }));
                }
                console.log(`✅ Updated .gitignore`);
              } catch (e) {
                console.log(`❌ Failed to update .gitignore: ${e.message}`);
                core.error(`${owner}/${repo}: Failed to update .gitignore: ${e.message}`);
              }
            }

            core.notice(`${owner}/${repo}: Fixed - ${actions.join(' and ')}`);
