# Maintenance workflow to fix pr_body.md merge conflicts across consumer repos
#
# Problem: pr_body.md is created per-PR and should never be committed to main.
# When PRs merge, they sometimes bring pr_body.md into main, causing conflicts
# with other PR branches that have their own version.
#
# Solution: This workflow:
# 1. Previews the tracked PR body and ignore rule on main
# 2. On explicit apply, opens a cleanup PR for protected main
# 3. Retains direct apply for confirmed unprotected main
#
# The root cause fix is in reusable-codex-run.yml which unstages pr_body.md
# before committing. This workflow handles the cleanup of historical commits.

name: Maint 72 Fix PR Body Conflicts

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (false applies directly on unprotected main or opens a cleanup PR)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      target_repo:
        description: 'Specific repo to fix (leave empty for all consumer repos)'
        required: false
        default: ''
        type: string
  schedule:
    # Run weekly on Sunday at 3am UTC to catch any repos that need cleanup
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: fix-pr-body-conflicts-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      repo_matrix: ${{ steps.repos.outputs.matrix }}
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@v7

      - name: Build repo matrix from canonical list
        id: repos
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          repos_json=$(python3 - <<'PY'
          from __future__ import annotations

          import json
          import os
          import re
          from pathlib import Path

          path = Path('.github/workflows/maint-68-sync-consumer-repos.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          start_index = None
          for index, line in enumerate(lines):
            if re.search(r'\bREGISTERED_CONSUMER_REPOS\s*:\s*\|\s*$', line):
              start_index = index + 1
              break

          if start_index is None:
            raise SystemExit('Could not find REGISTERED_CONSUMER_REPOS: | block')

          block_indent = None
          repos: list[str] = []
          for raw_line in lines[start_index:]:
            if raw_line.strip() == '':
              continue

            indent = len(raw_line) - len(raw_line.lstrip(' '))
            if block_indent is None:
              block_indent = indent

            if indent < (block_indent or 0):
              break

            value = raw_line.strip()
            if value:
              repos.append(value)

          target = os.environ.get('TARGET_REPO', '').strip()
          if target:
            if target not in repos:
              raise SystemExit(f'Target repository is not registered: {target}')
            repos = [target]
          print(json.dumps(repos))
          PY
          )
          echo "matrix=$repos_json" >> "$GITHUB_OUTPUT"

  fix-repos:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.prepare.outputs.repo_matrix) }}
    steps:
      - name: Extract repo name
        id: repo-info
        run: |
          echo "repo_name=$(echo '${{ matrix.repo }}' | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: stranske
          repositories: ${{ steps.repo-info.outputs.repo_name }}

      - name: Checkout retry helpers
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/maint72-pr-body-cleanup.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}



      - name: Check and fix pr_body.md
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run || 'true' }}
          REPO_FULL: ${{ matrix.repo }}
        with:
          github-token: ${{ steps.app_token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPO_FULL.split('/');
            const dryRun = process.env.DRY_RUN !== 'false';
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            console.log(`\n${'='.repeat(60)}`);
            console.log(`Processing ${owner}/${repo} (dry_run=${dryRun})`);
            console.log(`${'='.repeat(60)}\n`);

            let base;
            try {
              ({ data: base } = await withRetry(() => github.rest.repos.getBranch({
                owner, repo, branch: 'main'
              })));
              if (!base.commit?.sha || typeof base.protected !== 'boolean') {
                throw new Error('missing exact main head or protection status');
              }
            } catch (e) {
              core.setFailed(`${owner}/${repo}: unable to determine main head and protection: ${e.message}`);
              return;
            }
            const ref = base.commit.sha;
            const actions = [];
            const readFailures = [];
            const mutationFailures = [];

            // Step 1: Check if pr_body.md exists on main
            let prBodySha = null;
            try {
              const { data } = await withRetry(() => github.rest.repos.getContent({
                owner,
                repo,
                path: 'pr_body.md',
                ref
              }));
              if (data.type !== 'file' || !data.sha) throw new Error('expected a tracked pr_body.md file');
              prBodySha = data.sha;
              console.log(`⚠️  pr_body.md EXISTS on main (sha: ${prBodySha.substring(0, 8)})`);
              actions.push('delete pr_body.md from main');
            } catch (e) {
              if (e.status === 404) {
                console.log(`✅ pr_body.md does not exist on main - good!`);
              } else {
                console.log(`❌ Error checking pr_body.md: ${e.message}`);
                readFailures.push(`pr_body.md (${e.message})`);
              }
            }

            // Step 2: Check if pr_body.md is in .gitignore
            let gitignoreContent = '';
            let gitignoreSha = null;
            let prBodyInGitignore = false;
            try {
              const { data } = await withRetry(() => github.rest.repos.getContent({
                owner,
                repo,
                path: '.gitignore',
                ref
              }));
              const ignoreBytes = Buffer.from(data.content, 'base64');
              gitignoreContent = ignoreBytes.toString('utf8');
              if (data.type !== 'file' || data.encoding !== 'base64' || !data.sha ||
                  !Buffer.from(gitignoreContent).equals(ignoreBytes)) {
                throw new Error('expected a readable UTF-8 .gitignore file');
              }
              gitignoreSha = data.sha;

              // Check for pr_body.md pattern
              const lines = gitignoreContent.split('\n');
              prBodyInGitignore = lines.some(line => {
                const trimmed = line.trim();
                return trimmed === 'pr_body.md' || trimmed === '/pr_body.md';
              });

              if (prBodyInGitignore) {
                console.log(`✅ pr_body.md is in .gitignore`);
              } else {
                console.log(`⚠️  pr_body.md is NOT in .gitignore`);
                actions.push('add pr_body.md to .gitignore');
              }
            } catch (e) {
              if (e.status === 404) {
                console.log(`⚠️  No .gitignore file found - will create one`);
                actions.push('create .gitignore with pr_body.md');
              } else {
                console.log(`❌ Error checking .gitignore: ${e.message}`);
                readFailures.push(`.gitignore (${e.message})`);
              }
            }

            if (readFailures.length) {
              core.setFailed(`${owner}/${repo}: unable to determine PR body configuration: ${readFailures.join('; ')}`);
              return;
            }

            // Summary
            console.log(`\n--- Summary ---`);
            if (!actions.length) {
              console.log(`✅ ${owner}/${repo} is already configured correctly`);
              return;
            }

            console.log(`Actions needed: ${actions.join(', ')}`);

            if (dryRun) {
              console.log(`\n🔍 DRY RUN - no changes made`);
              core.notice(`${owner}/${repo}: Would ${actions.join(' and ')}`);
              return;
            }

            const ignoreEntry = '\n# PR-specific file - should not be tracked\npr_body.md\n';
            const newIgnore = prBodyInGitignore ? null :
              (gitignoreSha ? gitignoreContent : '# Auto-generated .gitignore\n') + ignoreEntry;
            if (base.protected) {
              const { openCleanupPullRequest } = require('./.github/scripts/maint72-pr-body-cleanup.js');
              try {
                const url = await openCleanupPullRequest({
                  github, withRetry, owner, repo, baseSha: ref, prBodySha, gitignoreSha, newIgnore
                });
                core.notice(`${owner}/${repo}: Cleanup PR ready for normal review: ${url}`);
              } catch (e) {
                core.setFailed(`${owner}/${repo}: unable to publish cleanup PR: ${e.message}`);
              }
              return;
            }

            // Retain the existing direct maintenance behavior on unprotected main.
            const { data: current } = await withRetry(() => github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            }));
            if (current.commit.sha !== ref || current.protected !== false) {
              core.setFailed(`${owner}/${repo}: main changed; preview the current head again`);
              return;
            }
            console.log(`\n--- Applying fixes ---`);

            const deletePrBodyMessage =
              'chore: remove pr_body.md from main\n\n' +
              'This file should not be tracked. It is PR-specific and causes merge conflicts.';

            const addIgnoreMessage =
              'chore: add pr_body.md to .gitignore\n\n' +
              'Prevent merge conflicts from PR-specific content.';

            const createIgnoreMessage =
              'chore: create .gitignore with pr_body.md\n\n' +
              'Prevent merge conflicts from PR-specific content.';

            // Delete pr_body.md if it exists
            if (prBodySha) {
              try {
                await withRetry(() => github.rest.repos.deleteFile({
                  owner,
                  repo,
                  path: 'pr_body.md',
                  message: deletePrBodyMessage,
                  sha: prBodySha,
                  branch: 'main'
                }));
                console.log(`✅ Deleted pr_body.md from main`);
              } catch (e) {
                console.log(`❌ Failed to delete pr_body.md: ${e.message}`);
                core.error(`${owner}/${repo}: Failed to delete pr_body.md: ${e.message}`);
                mutationFailures.push(`delete pr_body.md (${e.message})`);
              }
            }

            // Add to .gitignore if not present
            if (newIgnore !== null) {
              try {
                if (gitignoreSha) {
                  await withRetry(() => github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: '.gitignore',
                    message: addIgnoreMessage,
                    content: Buffer.from(newIgnore).toString('base64'),
                    sha: gitignoreSha,
                    branch: 'main'
                  }));
                } else {
                  await withRetry(() => github.rest.repos.createOrUpdateFileContents({
                    owner,
                    repo,
                    path: '.gitignore',
                    message: createIgnoreMessage,
                    content: Buffer.from(newIgnore).toString('base64'),
                    branch: 'main'
                  }));
                }
                console.log(`✅ Updated .gitignore`);
              } catch (e) {
                console.log(`❌ Failed to update .gitignore: ${e.message}`);
                core.error(`${owner}/${repo}: Failed to update .gitignore: ${e.message}`);
                mutationFailures.push(`update .gitignore (${e.message})`);
              }
            }

            if (mutationFailures.length) {
              core.setFailed(
                `${owner}/${repo}: incomplete repair: ${mutationFailures.join('; ')}`,
              );
              return;
            }
            core.notice(`${owner}/${repo}: Fixed - ${actions.join(' and ')}`);
