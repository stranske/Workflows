            if [ "$core_limit" -gt 0 ]; then
              core_pct=$(echo "scale=1; ($core_used * 100) / $core_limit" | bc)
            else
              core_pct="0"
            fi

            if [ "$graphql_limit" -gt 0 ]; then
              graphql_pct=$(echo "scale=1; ($graphql_used * 100) / $graphql_limit" | bc)
            else
              graphql_pct="0"
            fi

            if [ "$search_limit" -gt 0 ]; then
              search_pct=$(echo "scale=1; ($search_used * 100) / $search_limit" | bc)
            else
              search_pct="0"
            fi

            reset_time=$(date -d "@$core_reset" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown")

            echo "SERVICE_BOT_PAT (stranske-automation-bot)"
            echo "  Core API: ${core_used}/${core_limit} (${core_pct}% used)"
            echo "  GraphQL:  ${graphql_used}/${graphql_limit} (${graphql_pct}% used)"
            echo "  Search:   ${search_used}/${search_limit} (${search_pct}% used)"
            echo "  Reset at: ${reset_time}"

