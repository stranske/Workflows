name: Health 75 API Rate Diagnostic

# Evaluates API rate limit utilization across all repos for PATs and GitHub Apps.
# Purpose: Identify which processes are consuming API limits and how well the combined
# authentication methods share the load to prevent rate limit exhaustion.

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours for continuous monitoring
  workflow_dispatch:
    inputs:
      include_consumer_repos:
        description: 'Include consumer repos in diagnostic (true/false)'
        type: boolean
        required: false
        default: true
      verbose:
        description: 'Include detailed resource breakdown'
        type: boolean
        required: false
        default: false
      report_mode:
        description: 'Report mode: current (live snapshot) or historical (date range)'
        type: choice
        required: false
        default: 'current'
        options:
          - current
          - historical
      start_date:
        description: 'Start date for historical report (YYYY-MM-DD or relative: 1d, 1w, 1m)'
        type: string
        required: false
        default: '1w'
      end_date:
        description: 'End date for historical report (YYYY-MM-DD or "now")'
        type: string
        required: false
        default: 'now'

permissions:
  contents: read
  issues: write
  actions: read  # Required for querying historical workflow runs

env:
  # Consumer repos to check - these use CODESPACES_WORKFLOWS PAT
  REGISTERED_CONSUMER_REPOS: |
    stranske/Travel-Plan-Permission
    stranske/Template
    stranske/trip-planner
    stranske/Manager-Database
    stranske/Portable-Alpha-Extension-Model
    stranske/Trend_Model_Project
    stranske/Collab-Admin

concurrency:
  group: api-rate-diagnostic-${{ github.repository }}
  cancel-in-progress: true

jobs:
  collect-rate-limits:
    name: Collect API Rate Limits
    runs-on: ubuntu-latest
    # Only run for current mode or scheduled triggers (not historical reports)
    if: ${{ inputs.report_mode != 'historical' }}
    outputs:
      github_token_rate: ${{ steps.github_token.outputs.rate_json }}
      pat_rate: ${{ steps.pat.outputs.rate_json }}
      service_bot_rate: ${{ steps.service_bot.outputs.rate_json }}
      app_rate: ${{ steps.app.outputs.rate_json }}
      keepalive_app_rate: ${{ steps.keepalive_app.outputs.rate_json }}
      gh_app_rate: ${{ steps.gh_app.outputs.rate_json }}
      summary_json: ${{ steps.aggregate.outputs.summary }}
    env:
      CODESPACES_WORKFLOWS: ${{ secrets.CODESPACES_WORKFLOWS || '' }}
      SERVICE_BOT_PAT: ${{ secrets.SERVICE_BOT_PAT || '' }}
      WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
      WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
      KEEPALIVE_APP_ID: ${{ secrets.KEEPALIVE_APP_ID || '' }}
      KEEPALIVE_APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY || '' }}
      GH_APP_ID: ${{ secrets.GH_APP_ID || '' }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check GITHUB_TOKEN rate limits
        id: github_token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::group::GITHUB_TOKEN Rate Limits"

          rate_data=$(gh api rate_limit 2>/dev/null || echo '{}')

          if [ -n "$rate_data" ] && [ "$rate_data" != "{}" ]; then
            # Extract key metrics
            core_limit=$(echo "$rate_data" | jq -r '.resources.core.limit // 0')
            core_remaining=$(echo "$rate_data" | jq -r '.resources.core.remaining // 0')
            core_used=$(echo "$rate_data" | jq -r '.resources.core.used // 0')
            core_reset=$(echo "$rate_data" | jq -r '.resources.core.reset // 0')

            graphql_limit=$(echo "$rate_data" | jq -r '.resources.graphql.limit // 0')
            graphql_remaining=$(echo "$rate_data" | jq -r '.resources.graphql.remaining // 0')
            graphql_used=$(echo "$rate_data" | jq -r '.resources.graphql.used // 0')

            search_limit=$(echo "$rate_data" | jq -r '.resources.search.limit // 0')
            search_remaining=$(echo "$rate_data" | jq -r '.resources.search.remaining // 0')
            search_used=$(echo "$rate_data" | jq -r '.resources.search.used // 0')

            # Calculate utilization percentages
            if [ "$core_limit" -gt 0 ]; then
              core_pct=$(echo "scale=1; ($core_used * 100) / $core_limit" | bc)
            else
              core_pct="0"
            fi

            if [ "$graphql_limit" -gt 0 ]; then
              graphql_pct=$(echo "scale=1; ($graphql_used * 100) / $graphql_limit" | bc)
            else
              graphql_pct="0"
            fi

            if [ "$search_limit" -gt 0 ]; then
              search_pct=$(echo "scale=1; ($search_used * 100) / $search_limit" | bc)
            else
              search_pct="0"
            fi

            reset_time=$(date -d "@$core_reset" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown")

            echo "GITHUB_TOKEN (Installation Token)"
            echo "  Core API: ${core_used}/${core_limit} (${core_pct}% used)"
            echo "  GraphQL:  ${graphql_used}/${graphql_limit} (${graphql_pct}% used)"
            echo "  Search:   ${search_used}/${search_limit} (${search_pct}% used)"
            echo "  Reset at: ${reset_time}"

            # Output JSON for aggregation (compact single-line for safe passing)
            rate_json=$(jq -cn \
              --arg source "GITHUB_TOKEN" \
              --argjson core_limit "$core_limit" \
              --argjson core_remaining "$core_remaining" \
              --argjson core_used "$core_used" \
              --arg core_pct "$core_pct" \
              --argjson graphql_limit "$graphql_limit" \
              --argjson graphql_remaining "$graphql_remaining" \
              --argjson graphql_used "$graphql_used" \
              --arg graphql_pct "$graphql_pct" \
              --argjson search_limit "$search_limit" \
              --argjson search_remaining "$search_remaining" \
              --argjson search_used "$search_used" \
              --arg search_pct "$search_pct" \
              --arg reset_time "$reset_time" \
              '{
                source: $source,
                core: { limit: $core_limit, remaining: $core_remaining, used: $core_used, pct: $core_pct },
                graphql: { limit: $graphql_limit, remaining: $graphql_remaining, used: $graphql_used, pct: $graphql_pct },
                search: { limit: $search_limit, remaining: $search_remaining, used: $search_used, pct: $search_pct },
                reset: $reset_time
              }')

            # Use single-line format to avoid heredoc parsing issues
            printf 'rate_json=%s\n' "$rate_json" >> "$GITHUB_OUTPUT"
          else
            echo "Failed to retrieve GITHUB_TOKEN rate limits"
            echo 'rate_json={}' >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Check PAT (CODESPACES_WORKFLOWS) rate limits
        id: pat
        if: ${{ env.CODESPACES_WORKFLOWS != '' }}
        env:
          GH_TOKEN: ${{ env.CODESPACES_WORKFLOWS }}
        run: |
          set -euo pipefail
          echo "::group::PAT Rate Limits"

          rate_data=$(gh api rate_limit 2>/dev/null || echo '{}')

          if [ -n "$rate_data" ] && [ "$rate_data" != "{}" ]; then
            core_limit=$(echo "$rate_data" | jq -r '.resources.core.limit // 0')
            core_remaining=$(echo "$rate_data" | jq -r '.resources.core.remaining // 0')
            core_used=$(echo "$rate_data" | jq -r '.resources.core.used // 0')
            core_reset=$(echo "$rate_data" | jq -r '.resources.core.reset // 0')

            graphql_limit=$(echo "$rate_data" | jq -r '.resources.graphql.limit // 0')
            graphql_remaining=$(echo "$rate_data" | jq -r '.resources.graphql.remaining // 0')
            graphql_used=$(echo "$rate_data" | jq -r '.resources.graphql.used // 0')

            search_limit=$(echo "$rate_data" | jq -r '.resources.search.limit // 0')
            search_remaining=$(echo "$rate_data" | jq -r '.resources.search.remaining // 0')
            search_used=$(echo "$rate_data" | jq -r '.resources.search.used // 0')

            if [ "$core_limit" -gt 0 ]; then
              core_pct=$(echo "scale=1; ($core_used * 100) / $core_limit" | bc)
            else
              core_pct="0"
            fi

            if [ "$graphql_limit" -gt 0 ]; then
              graphql_pct=$(echo "scale=1; ($graphql_used * 100) / $graphql_limit" | bc)
            else
              graphql_pct="0"
            fi

            if [ "$search_limit" -gt 0 ]; then
              search_pct=$(echo "scale=1; ($search_used * 100) / $search_limit" | bc)
            else
              search_pct="0"
            fi

            reset_time=$(date -d "@$core_reset" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown")

            echo "CODESPACES_WORKFLOWS PAT"
            echo "  Core API: ${core_used}/${core_limit} (${core_pct}% used)"
            echo "  GraphQL:  ${graphql_used}/${graphql_limit} (${graphql_pct}% used)"
            echo "  Search:   ${search_used}/${search_limit} (${search_pct}% used)"
            echo "  Reset at: ${reset_time}"

            rate_json=$(jq -cn \
              --arg source "CODESPACES_WORKFLOWS_PAT" \
              --argjson core_limit "$core_limit" \
              --argjson core_remaining "$core_remaining" \
              --argjson core_used "$core_used" \
              --arg core_pct "$core_pct" \
              --argjson graphql_limit "$graphql_limit" \
              --argjson graphql_remaining "$graphql_remaining" \
              --argjson graphql_used "$graphql_used" \
              --arg graphql_pct "$graphql_pct" \
              --argjson search_limit "$search_limit" \
              --argjson search_remaining "$search_remaining" \
              --argjson search_used "$search_used" \
              --arg search_pct "$search_pct" \
              --arg reset_time "$reset_time" \
              '{
                source: $source,
                core: { limit: $core_limit, remaining: $core_remaining, used: $core_used, pct: $core_pct },
                graphql: { limit: $graphql_limit, remaining: $graphql_remaining, used: $graphql_used, pct: $graphql_pct },
                search: { limit: $search_limit, remaining: $search_remaining, used: $search_used, pct: $search_pct },
                reset: $reset_time
