            printf 'rate_json=%s\n' "$rate_json" >> "$GITHUB_OUTPUT"
          else
            echo "KEEPALIVE_APP not configured or failed"
            echo 'rate_json={}' >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      # Check GH_APP (general purpose app used by some workflows)
      - name: Mint GH_APP token
        id: gh_app_token
        if: ${{ env.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check GH_APP rate limits
        id: gh_app
        if: ${{ steps.gh_app_token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.gh_app_token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::group::GH_APP Rate Limits"

          rate_data=$(gh api rate_limit 2>/dev/null || echo '{}')

          if [ -n "$rate_data" ] && [ "$rate_data" != "{}" ]; then
            core_limit=$(echo "$rate_data" | jq -r '.resources.core.limit // 0')
            core_remaining=$(echo "$rate_data" | jq -r '.resources.core.remaining // 0')
            core_used=$(echo "$rate_data" | jq -r '.resources.core.used // 0')
