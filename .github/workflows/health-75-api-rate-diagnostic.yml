              core_pct=$(echo "scale=1; ($core_used * 100) / $core_limit" | bc)
            else
              core_pct="0"
            fi

            if [ "$graphql_limit" -gt 0 ]; then
              graphql_pct=$(echo "scale=1; ($graphql_used * 100) / $graphql_limit" | bc)
            else
              graphql_pct="0"
            fi

            if [ "$search_limit" -gt 0 ]; then
              search_pct=$(echo "scale=1; ($search_used * 100) / $search_limit" | bc)
            else
              search_pct="0"
            fi

            reset_time=$(date -d "@$core_reset" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown")

            echo "GH_APP (GitHub App - General Purpose)"
            echo "  Core API: ${core_used}/${core_limit} (${core_pct}% used)"
            echo "  GraphQL:  ${graphql_used}/${graphql_limit} (${graphql_pct}% used)"
            echo "  Search:   ${search_used}/${search_limit} (${search_pct}% used)"
            echo "  Reset at: ${reset_time}"

            rate_json=$(jq -cn \
              --arg source "GH_APP" \
              --argjson core_limit "$core_limit" \
              --argjson core_remaining "$core_remaining" \
              --argjson core_used "$core_used" \
              --arg core_pct "$core_pct" \
              --argjson graphql_limit "$graphql_limit" \
              --argjson graphql_remaining "$graphql_remaining" \
              --argjson graphql_used "$graphql_used" \
              --arg graphql_pct "$graphql_pct" \
              --argjson search_limit "$search_limit" \
              --argjson search_remaining "$search_remaining" \
              --argjson search_used "$search_used" \
              --arg search_pct "$search_pct" \
              --arg reset_time "$reset_time" \
              '{
                source: $source,
                core: { limit: $core_limit, remaining: $core_remaining, used: $core_used, pct: $core_pct },
                graphql: { limit: $graphql_limit, remaining: $graphql_remaining, used: $graphql_used, pct: $graphql_pct },
                search: { limit: $search_limit, remaining: $search_remaining, used: $search_used, pct: $search_pct },
                reset: $reset_time
              }')

            printf 'rate_json=%s\n' "$rate_json" >> "$GITHUB_OUTPUT"
          else
            echo "GH_APP not configured or failed"
            echo 'rate_json={}' >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Verify Actions runs access per token
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          CODESPACES_WORKFLOWS_TOKEN: ${{ secrets.CODESPACES_WORKFLOWS || '' }}
          SERVICE_BOT_TOKEN: ${{ secrets.SERVICE_BOT_PAT || '' }}
          WORKFLOWS_APP_TOKEN: ${{ steps.app_token.outputs.token || '' }}
          KEEPALIVE_APP_TOKEN: ${{ steps.keepalive_app_token.outputs.token || '' }}
          GH_APP_TOKEN: ${{ steps.gh_app_token.outputs.token || '' }}
        run: |
          set -u

          echo "::group::Actions runs access checks"

          check_token() {
            local label="$1"
            local token="$2"
            if [ -z "$token" ]; then
              echo "$label: not set"
              return 0
            fi

            local output
            output=$(GH_TOKEN="$token" gh api -i "repos/$GITHUB_REPOSITORY/actions/workflows/health-75-api-rate-diagnostic.yml/runs" -F per_page=1 2>&1 || true)
            local status
            status=$(echo "$output" | head -n1)
            local accepted
            accepted=$(echo "$output" | awk -F': ' '/^X-Accepted-GitHub-Permissions/ {print $2; exit}')

            if [ -n "$accepted" ]; then
              echo "$label: $status | perms: $accepted"
            else
              echo "$label: $status"
            fi
          }

          check_token "GITHUB_TOKEN" "$GITHUB_TOKEN_VALUE"
          check_token "CODESPACES_WORKFLOWS" "$CODESPACES_WORKFLOWS_TOKEN"
          check_token "SERVICE_BOT_PAT" "$SERVICE_BOT_TOKEN"
          check_token "WORKFLOWS_APP" "$WORKFLOWS_APP_TOKEN"
          check_token "KEEPALIVE_APP" "$KEEPALIVE_APP_TOKEN"
          check_token "GH_APP" "$GH_APP_TOKEN"

          echo "::endgroup::"

      - name: Aggregate and analyze results
        id: aggregate
        env:
          GITHUB_TOKEN_RATE: ${{ steps.github_token.outputs.rate_json }}
          PAT_RATE: ${{ steps.pat.outputs.rate_json }}
          SERVICE_BOT_RATE: ${{ steps.service_bot.outputs.rate_json || '{}' }}
          APP_RATE: ${{ steps.app.outputs.rate_json }}
          KEEPALIVE_APP_RATE: ${{ steps.keepalive_app.outputs.rate_json || '{}' }}
          GH_APP_RATE: ${{ steps.gh_app.outputs.rate_json || '{}' }}
        run: |
          set -uo pipefail  # Note: removed -e to handle errors manually

          echo "::group::Rate data aggregation"

          # Debug: show raw values (lengths and first 100 chars)
          svc_rate="${SERVICE_BOT_RATE:-}"
          ka_rate="${KEEPALIVE_APP_RATE:-}"
          gh_rate="${GH_APP_RATE:-}"
          echo "Raw env var lengths: gt=${#GITHUB_TOKEN_RATE}, pat=${#PAT_RATE}, svc=${#svc_rate}, app=${#APP_RATE}, ka=${#ka_rate}, gh=${#gh_rate}"
          echo "GITHUB_TOKEN_RATE first 100: ${GITHUB_TOKEN_RATE:0:100}"
          echo "PAT_RATE first 100: ${PAT_RATE:0:100}"
          echo "SERVICE_BOT_RATE first 100: ${SERVICE_BOT_RATE:0:100}"
          echo "APP_RATE first 100: ${APP_RATE:0:100}"
          echo "KEEPALIVE_APP_RATE first 100: ${KEEPALIVE_APP_RATE:0:100}"
          echo "GH_APP_RATE first 100: ${GH_APP_RATE:0:100}"

          # Use jq to safely extract and re-emit valid JSON
          # The -R flag reads raw input, and we use try-catch to handle invalid JSON
          safe_json() {
            local input="$1"
            local default="${2:-{}}"
            # Try to parse with jq, fall back to default
            if [ -z "$input" ]; then
              echo "$default"
            elif result=$(echo "$input" | jq -c '.' 2>/dev/null) && [ -n "$result" ]; then
              echo "$result"
            else
              echo "$default"
            fi
          }

          gt_json=$(safe_json "$GITHUB_TOKEN_RATE" "{}")
          pat_json=$(safe_json "$PAT_RATE" "{}")
          svc_json=$(safe_json "${SERVICE_BOT_RATE:-}" "{}")
          app_json=$(safe_json "$APP_RATE" "{}")
          ka_json=$(safe_json "${KEEPALIVE_APP_RATE:-}" "{}")
          gh_json=$(safe_json "${GH_APP_RATE:-}" "{}")

          echo "Parsed JSON lengths: gt=${#gt_json}, pat=${#pat_json}, svc=${#svc_json}, app=${#app_json}, ka=${#ka_json}, gh=${#gh_json}"
          echo "gt_json: $gt_json"
          echo "pat_json: $pat_json"
          echo "svc_json: $svc_json"
          echo "app_json: $app_json"
          echo "ka_json: $ka_json"
          echo "gh_json: $gh_json"

          # Write to temp files
          echo "$gt_json" > /tmp/gt_rate.json
          echo "$pat_json" > /tmp/pat_rate.json
          echo "$svc_json" > /tmp/svc_rate.json
          echo "$app_json" > /tmp/app_rate.json
          echo "$ka_json" > /tmp/ka_rate.json
          echo "$gh_json" > /tmp/gh_rate.json

          # Create summary JSON using file slurp (avoids shell quoting entirely)
          summary=$(jq -cn \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --slurpfile gt /tmp/gt_rate.json \
            --slurpfile pat /tmp/pat_rate.json \
            --slurpfile svc /tmp/svc_rate.json \
            --slurpfile app /tmp/app_rate.json \
            --slurpfile ka /tmp/ka_rate.json \
            --slurpfile gh /tmp/gh_rate.json \
            '{
              timestamp: $timestamp,
              tokens: {
                github_token: $gt[0],
                codespaces_workflows_pat: $pat[0],
                service_bot_pat: $svc[0],
                workflows_app: $app[0],
                keepalive_app: $ka[0],
                gh_app: $gh[0]
              },
              total_pools: (
                (if $gt[0].source then 1 else 0 end) +
                (if $pat[0].source then 1 else 0 end) +
                (if $svc[0].source then 1 else 0 end) +
                (if $app[0].source then 1 else 0 end) +
                (if $ka[0].source then 1 else 0 end) +
                (if $gh[0].source then 1 else 0 end)
              ),
              total_remaining: (
                ($gt[0].core.remaining // 0) +
                ($pat[0].core.remaining // 0) +
                ($svc[0].core.remaining // 0) +
                ($app[0].core.remaining // 0) +
                ($ka[0].core.remaining // 0) +
                ($gh[0].core.remaining // 0)
              ),
              total_limit: (
                ($gt[0].core.limit // 0) +
                ($pat[0].core.limit // 0) +
                ($svc[0].core.limit // 0) +
                ($app[0].core.limit // 0) +
                ($ka[0].core.limit // 0) +
                ($gh[0].core.limit // 0)
              )
            }')

          echo "Summary: $summary"
          echo "::endgroup::"

          # Use single-line format to avoid heredoc parsing issues
          printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"

  check-consumer-repos:
    name: Check Consumer Repo Activity
    runs-on: ubuntu-latest
    # Only run for current mode with consumer repos enabled
    if: ${{ inputs.report_mode != 'historical' && inputs.include_consumer_repos != false }}
    needs: collect-rate-limits
    outputs:
      consumer_activity: ${{ steps.activity.outputs.activity_json }}
    env:
      CODESPACES_WORKFLOWS: ${{ secrets.CODESPACES_WORKFLOWS || '' }}

    steps:
      - name: Check recent workflow runs across consumer repos
        id: activity
        if: ${{ env.CODESPACES_WORKFLOWS != '' }}
        env:
          GH_TOKEN: ${{ env.CODESPACES_WORKFLOWS }}
          REGISTERED_CONSUMER_REPOS: |
            stranske/Travel-Plan-Permission
            stranske/Template
            stranske/trip-planner
            stranske/Manager-Database
            stranske/Portable-Alpha-Extension-Model
            stranske/Trend_Model_Project
            stranske/Collab-Admin
        run: |
          set -euo pipefail
          echo "::group::Consumer Repo Activity"

          activity_json='[]'

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            repo=$(echo "$repo" | xargs)  # trim whitespace

            echo "Checking $repo..."

            # Get recent workflow runs (last hour)
            since=$(date -u -d '1 hour ago' +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u +"%Y-%m-%dT%H:%M:%SZ")

            runs_data=$(gh api "repos/${repo}/actions/runs?per_page=100&created=>=${since}" 2>/dev/null || echo '{"workflow_runs":[]}')

            total_runs=$(echo "$runs_data" | jq '.total_count // 0')
            in_progress=$(echo "$runs_data" | jq '[.workflow_runs[] | select(.status == "in_progress")] | length')
            queued=$(echo "$runs_data" | jq '[.workflow_runs[] | select(.status == "queued")] | length')
            completed=$(echo "$runs_data" | jq '[.workflow_runs[] | select(.status == "completed")] | length')

            # Get most common workflows (use -c for compact output)
            workflow_counts=$(echo "$runs_data" | jq -c '[.workflow_runs[].name] | group_by(.) | map({name: .[0], count: length}) | sort_by(-.count) | .[0:5]')

            repo_json=$(jq -cn \
              --arg repo "$repo" \
              --argjson total_runs "$total_runs" \
              --argjson in_progress "$in_progress" \
              --argjson queued "$queued" \
              --argjson completed "$completed" \
              --argjson workflows "$workflow_counts" \
              '{
                repo: $repo,
                runs_last_hour: $total_runs,
                in_progress: $in_progress,
                queued: $queued,
                completed: $completed,
                top_workflows: $workflows
              }')

            activity_json=$(echo "$activity_json" | jq -c --argjson repo "$repo_json" '. + [$repo]')

            echo "  Runs (last hour): $total_runs (in_progress: $in_progress, queued: $queued)"

          done <<< "$REGISTERED_CONSUMER_REPOS"

          # Compact the final JSON and output
          activity_json=$(echo "$activity_json" | jq -c '.')
          printf 'activity_json=%s\n' "$activity_json" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

  generate-report:
    name: Generate Diagnostic Report
    runs-on: ubuntu-latest
    needs: [collect-rate-limits, check-consumer-repos]
    # Only run for current mode (not historical reports)
    if: ${{ always() && inputs.report_mode != 'historical' }}
    env:
      SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}
      CONSUMER_ACTIVITY: ${{ needs.check-consumer-repos.outputs.consumer_activity }}

    steps:
      - name: Generate comprehensive report
        id: report
        run: |
          set -euo pipefail

          echo "# 📊 API Rate Limit Diagnostic Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Sanitize JSON by re-parsing with jq to remove any trailing chars
          raw_json="${SUMMARY_JSON:-{}}"
          summary=$(echo "$raw_json" | jq -c '.' 2>/dev/null || echo '{}')

          echo "## 🔑 Authentication Token Rate Limits" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Token | Core API | GraphQL | Search | Reset Time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----------|---------|--------|------------|" >> "$GITHUB_STEP_SUMMARY"

          # GITHUB_TOKEN
          gt=$(echo "$summary" | jq '.tokens.github_token // {}')
          if [ "$gt" != "{}" ] && [ "$gt" != "null" ]; then
            gt_core=$(echo "$gt" | jq -r '"\(.core.used)/\(.core.limit) (\(.core.pct)%)"')
            gt_graphql=$(echo "$gt" | jq -r '"\(.graphql.used)/\(.graphql.limit) (\(.graphql.pct)%)"')
            gt_search=$(echo "$gt" | jq -r '"\(.search.used)/\(.search.limit) (\(.search.pct)%)"')
            gt_reset=$(echo "$gt" | jq -r '.reset // "N/A"')
            echo "| GITHUB_TOKEN | $gt_core | $gt_graphql | $gt_search | $gt_reset |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # PAT
          pat=$(echo "$summary" | jq '.tokens.codespaces_workflows_pat // {}')
          if [ "$pat" != "{}" ] && [ "$pat" != "null" ]; then
            pat_core=$(echo "$pat" | jq -r '"\(.core.used)/\(.core.limit) (\(.core.pct)%)"')
            pat_graphql=$(echo "$pat" | jq -r '"\(.graphql.used)/\(.graphql.limit) (\(.graphql.pct)%)"')
            pat_search=$(echo "$pat" | jq -r '"\(.search.used)/\(.search.limit) (\(.search.pct)%)"')
            pat_reset=$(echo "$pat" | jq -r '.reset // "N/A"')
            echo "| CODESPACES_WORKFLOWS | $pat_core | $pat_graphql | $pat_search | $pat_reset |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # App
          app=$(echo "$summary" | jq '.tokens.workflows_app // {}')
          if [ "$app" != "{}" ] && [ "$app" != "null" ]; then
            app_core=$(echo "$app" | jq -r '"\(.core.used)/\(.core.limit) (\(.core.pct)%)"')
            app_graphql=$(echo "$app" | jq -r '"\(.graphql.used)/\(.graphql.limit) (\(.graphql.pct)%)"')
            app_search=$(echo "$app" | jq -r '"\(.search.used)/\(.search.limit) (\(.search.pct)%)"')
            app_reset=$(echo "$app" | jq -r '.reset // "N/A"')
            echo "| WORKFLOWS_APP | $app_core | $app_graphql | $app_search | $app_reset |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Utilization warnings
          echo "## ⚠️ Utilization Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          warnings=0

          # Check for high utilization
          for token_path in ".tokens.github_token" ".tokens.codespaces_workflows_pat" ".tokens.workflows_app"; do
            token_data=$(echo "$summary" | jq "$token_path // {}")
            if [ "$token_data" != "{}" ] && [ "$token_data" != "null" ]; then
              source=$(echo "$token_data" | jq -r '.source // "unknown"')
              core_pct=$(echo "$token_data" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
              graphql_pct=$(echo "$token_data" | jq -r '.graphql.pct // "0"' | sed 's/[^0-9.]//g')

              # Bash doesn't handle floats well, so use bc for comparison
              if [ -n "$core_pct" ] && [ "$(echo "$core_pct > 80" | bc -l)" = "1" ]; then
                echo "- 🔴 **$source** Core API is at ${core_pct}% utilization - HIGH RISK" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ -n "$core_pct" ] && [ "$(echo "$core_pct > 50" | bc -l)" = "1" ]; then
                echo "- 🟡 **$source** Core API is at ${core_pct}% utilization - MODERATE" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              fi

              if [ -n "$graphql_pct" ] && [ "$(echo "$graphql_pct > 80" | bc -l)" = "1" ]; then
                echo "- 🔴 **$source** GraphQL is at ${graphql_pct}% utilization - HIGH RISK" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ -n "$graphql_pct" ] && [ "$(echo "$graphql_pct > 50" | bc -l)" = "1" ]; then
                echo "- 🟡 **$source** GraphQL is at ${graphql_pct}% utilization - MODERATE" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              fi
            fi
          done

          if [ "$warnings" -eq 0 ]; then
            echo "✅ All tokens are within normal utilization ranges (<50%)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Consumer repo activity - sanitize JSON first
          raw_activity="${CONSUMER_ACTIVITY:-[]}"
          activity=$(echo "$raw_activity" | jq -c '.' 2>/dev/null || echo '[]')
          if [ "$activity" != "[]" ] && [ "$activity" != "null" ]; then
            echo "## 📦 Consumer Repository Activity (Last Hour)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repository | Total Runs | In Progress | Queued | Top Workflow |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------------|------------|-------------|--------|--------------|" >> "$GITHUB_STEP_SUMMARY"

            echo "$activity" | jq -r '.[] | "\(.repo)|\(.runs_last_hour)|\(.in_progress)|\(.queued)|\(.top_workflows[0].name // "N/A") (\(.top_workflows[0].count // 0))"' | while IFS='|' read -r repo runs in_prog queued top_wf; do
              echo "| $repo | $runs | $in_prog | $queued | $top_wf |" >> "$GITHUB_STEP_SUMMARY"
            done

            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Total activity summary
            total_runs=$(echo "$activity" | jq '[.[].runs_last_hour] | add // 0')
            total_in_progress=$(echo "$activity" | jq '[.[].in_progress] | add // 0')
            total_queued=$(echo "$activity" | jq '[.[].queued] | add // 0')

            echo "**Total across all repos:** $total_runs runs, $total_in_progress in progress, $total_queued queued" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Load balancing analysis
          echo "## ⚖️ Load Balancing Assessment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Count available tokens
          available_tokens=0
          [ "$gt" != "{}" ] && [ "$gt" != "null" ] && available_tokens=$((available_tokens + 1))
          [ "$pat" != "{}" ] && [ "$pat" != "null" ] && available_tokens=$((available_tokens + 1))
          [ "$app" != "{}" ] && [ "$app" != "null" ] && available_tokens=$((available_tokens + 1))

          echo "**Available Authentication Methods:** $available_tokens" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$available_tokens" -ge 2 ]; then
            echo "✅ Multiple authentication methods are configured for load distribution" >> "$GITHUB_STEP_SUMMARY"

            # Check if load is balanced
            gt_core_pct=$(echo "$gt" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
            pat_core_pct=$(echo "$pat" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
            app_core_pct=$(echo "$app" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')

            # Use defaults if empty
            gt_core_pct=${gt_core_pct:-0}
            pat_core_pct=${pat_core_pct:-0}
            app_core_pct=${app_core_pct:-0}

            # Calculate max difference
            max_pct=$(echo "$gt_core_pct $pat_core_pct $app_core_pct" | tr ' ' '\n' | sort -rn | head -1)
            min_pct=$(echo "$gt_core_pct $pat_core_pct $app_core_pct" | tr ' ' '\n' | grep -v '^$' | sort -n | head -1)

            if [ -n "$max_pct" ] && [ -n "$min_pct" ]; then
              diff=$(echo "$max_pct - $min_pct" | bc -l 2>/dev/null || echo "0")
              if [ "$(echo "$diff > 30" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                echo "⚠️ Load is unevenly distributed (${diff}% difference). Consider reviewing token usage in workflows." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "✅ Load appears to be reasonably balanced across tokens" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "⚠️ Only $available_tokens authentication method(s) configured. Consider adding:" >> "$GITHUB_STEP_SUMMARY"
            [ "$pat" = "{}" ] || [ "$pat" = "null" ] && echo "  - CODESPACES_WORKFLOWS PAT for cross-repo operations" >> "$GITHUB_STEP_SUMMARY"
            [ "$app" = "{}" ] || [ "$app" = "null" ] && echo "  - WORKFLOWS_APP GitHub App for higher rate limits" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Recommendations
          echo "## 💡 Recommendations" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. **GitHub App tokens** have higher rate limits (5000-15000/hour) than PATs (5000/hour)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. **Installation tokens** (GITHUB_TOKEN) have even higher limits but limited scope" >> "$GITHUB_STEP_SUMMARY"
          echo "3. For high-volume operations, prefer GitHub App authentication" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Implement retry logic with exponential backoff for rate-limited requests" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Use conditional requests (ETags) to reduce API consumption" >> "$GITHUB_STEP_SUMMARY"

      - name: Set job status based on utilization
        env:
          SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}
        run: |
          # Sanitize JSON by re-parsing with jq to remove any trailing chars
          raw_json="${SUMMARY_JSON:-{}}"
          summary=$(echo "$raw_json" | jq -c '.' 2>/dev/null || echo '{}')

          for token_path in ".tokens.github_token" ".tokens.codespaces_workflows_pat" ".tokens.workflows_app"; do
            token_data=$(echo "$summary" | jq "$token_path // {}")
            if [ "$token_data" != "{}" ] && [ "$token_data" != "null" ]; then
              core_pct=$(echo "$token_data" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
              if [ -n "$core_pct" ] && [ "$(echo "$core_pct > 90" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                echo "::warning::Critical API rate limit utilization detected (${core_pct}%)"
              fi
            fi
          done

  alert-on-high-usage:
    name: Alert on High Usage
    runs-on: ubuntu-latest
    needs: [collect-rate-limits]
    # Only run for current mode (not historical reports)
    if: ${{ always() && inputs.report_mode != 'historical' }}
    env:
      SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}

    steps:
      - name: Check for critical utilization
        id: check
        run: |
          # Sanitize JSON by re-parsing with jq to remove any trailing chars
          raw_json="${SUMMARY_JSON:-{}}"
          summary=$(echo "$raw_json" | jq -c '.' 2>/dev/null || echo '{}')
          alert_needed=false

          for token_path in ".tokens.github_token" ".tokens.pat" ".tokens.app"; do
            token_data=$(echo "$summary" | jq "$token_path // {}")
            if [ "$token_data" != "{}" ] && [ "$token_data" != "null" ]; then
              core_pct=$(echo "$token_data" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
              graphql_pct=$(echo "$token_data" | jq -r '.graphql.pct // "0"' | sed 's/[^0-9.]//g')

              if [ -n "$core_pct" ] && [ "$(echo "$core_pct > 85" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                alert_needed=true
              fi
              if [ -n "$graphql_pct" ] && [ "$(echo "$graphql_pct > 85" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                alert_needed=true
              fi
            fi
          done

          echo "alert_needed=$alert_needed" >> "$GITHUB_OUTPUT"

      - name: Create issue for high usage (if needed)
        if: steps.check.outputs.alert_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if an open issue already exists
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "api-rate-limit" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ API Rate Limit Alert: High Utilization Detected" \
              --label "api-rate-limit,automated" \
              --body "## API Rate Limit Alert

          The Health 75 API Rate Diagnostic workflow has detected high API rate limit utilization (>85%).

          **Detected at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ### Recommended Actions

          1. Review recent workflow activity for unusual patterns
          2. Check if any workflows are making excessive API calls
          3. Consider implementing caching or reducing polling frequency
          4. Verify load is properly distributed across authentication methods

          This issue was automatically created and will be referenced if high usage persists."
            echo "Created new alert issue"
          else
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "🔄 **Update:** High API rate limit utilization continues.

          **Checked at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Updated existing issue #$existing"
          fi

  alert-on-repeat-failure:
    name: Alert on Repeated Failure
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Create issue on repeated failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.conclusion // ""')
          if [ "$conclusion" != "failure" ]; then
            echo "Run conclusion is '$conclusion' - no failure alert needed."
            exit 0
          fi

          workflow_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/health-75-api-rate-diagnostic.yml" --jq '.id // empty')
          if [ -z "$workflow_id" ]; then
            echo "Could not resolve workflow id; skipping repeat failure check."
            exit 0
          fi

          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs?per_page=2" \
            --jq '[.workflow_runs[] | {id: .id, conclusion: .conclusion}]')

          first=$(echo "$runs" | jq -r '.[0].conclusion // ""')
          second=$(echo "$runs" | jq -r '.[1].conclusion // ""')

          if [ "$first" != "failure" ] || [ "$second" != "failure" ]; then
            echo "No consecutive failures detected (latest: $first, previous: $second)."
            exit 0
          fi

          issue_title="⚠️ Health 75 API Rate Diagnostic failing repeatedly"
          issue_label="workflow-failure,automated,api-rate-limit"

          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label "workflow-failure" \
            --state open \
            --limit 1 \
            --json number \
            --jq '.[0].number // empty')

          body=$(printf '%s\n' \
            "## Repeated workflow failures detected" \
            "" \
            "The Health 75 API Rate Diagnostic workflow has failed in two consecutive runs." \
            "" \
            "- **Current run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "- **Detected at:** $(date -u +\"%Y-%m-%d %H:%M:%S UTC\")" \
            "" \
            "### Next steps" \
            "1. Review the run logs to identify the failing step(s)." \
            "2. Validate that API credentials and required secrets are configured." \
            "3. Re-run the workflow after applying fixes." \
            "" \
            "This issue was created automatically to ensure repeated failures are tracked.")

          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$issue_title" \
              --label "$issue_label" \
              --body "$body"
            echo "Created failure alert issue."
          else
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "Repeated failure detected again. Latest run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Updated existing failure alert issue #$existing."
          fi

  # Historical report job - runs when report_mode is 'historical'
  generate-historical-report:
    name: Generate Historical Report
    runs-on: ubuntu-latest
    if: ${{ inputs.report_mode == 'historical' }}

    steps:
      - name: Parse date range
        id: dates
        run: |
          set -euo pipefail

          START_INPUT="${{ inputs.start_date }}"
          END_INPUT="${{ inputs.end_date }}"

          echo "Parsing date range: start='$START_INPUT', end='$END_INPUT'"

          # Parse end date
          if [ "$END_INPUT" = "now" ] || [ -z "$END_INPUT" ]; then
            END_DATE=$(date -u +"%Y-%m-%d")
          else
            END_DATE="$END_INPUT"
          fi

          # Parse start date (supports relative: 1d, 1w, 1m, or absolute YYYY-MM-DD)
          case "$START_INPUT" in
            *d)
              days="${START_INPUT%d}"
              START_DATE=$(date -u -d "$END_DATE - $days days" +"%Y-%m-%d")
              ;;
            *w)
              weeks="${START_INPUT%w}"
              START_DATE=$(date -u -d "$END_DATE - $weeks weeks" +"%Y-%m-%d")
              ;;
            *m)
              months="${START_INPUT%m}"
              START_DATE=$(date -u -d "$END_DATE - $months months" +"%Y-%m-%d")
              ;;
            *)
              START_DATE="$START_INPUT"
              ;;
          esac

          echo "Resolved date range: $START_DATE to $END_DATE"

          # Validate resolved dates: format YYYY-MM-DD, real dates, and ordering
          date_regex='^[0-9]{4}-[0-9]{2}-[0-9]{2}$'

          if ! [[ "$START_DATE" =~ $date_regex ]]; then
            echo "::error::Invalid START_DATE format: '$START_DATE'. Expected YYYY-MM-DD or a supported relative value (e.g., 7d, 1w, 1m)."
            exit 1
          fi

          if ! [[ "$END_DATE" =~ $date_regex ]]; then
            echo "::error::Invalid END_DATE format: '$END_DATE'. Expected YYYY-MM-DD or 'now'."
            exit 1
          fi

          if ! date -u -d "$START_DATE" >/dev/null 2>&1; then
            echo "::error::START_DATE is not a valid calendar date: '$START_DATE'."
            exit 1
          fi

          if ! date -u -d "$END_DATE" >/dev/null 2>&1; then
            echo "::error::END_DATE is not a valid calendar date: '$END_DATE'."
            exit 1
          fi

          start_epoch=$(date -u -d "$START_DATE" +%s)
          end_epoch=$(date -u -d "$END_DATE" +%s)

          if [ "$start_epoch" -gt "$end_epoch" ]; then
            echo "::error::START_DATE ('$START_DATE') must not be after END_DATE ('$END_DATE')."
            exit 1
          fi

          echo "start_date=$START_DATE" >> "$GITHUB_OUTPUT"
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"

      - name: Mint workflows app token
        id: workflows_app_token
        env:
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
        if: ${{ env.WORKFLOWS_APP_ID != '' && env.WORKFLOWS_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch historical workflow runs
        id: history
        env:
          APP_GH_TOKEN: ${{ steps.workflows_app_token.outputs.token || '' }}
          PRIMARY_GH_TOKEN: ${{ secrets.CODESPACES_WORKFLOWS || '' }}
          FALLBACK_GH_TOKEN: ${{ github.token }}
          START_DATE: ${{ steps.dates.outputs.start_date }}
          END_DATE: ${{ steps.dates.outputs.end_date }}
        run: |
          set -euo pipefail

          echo "Fetching Health 75 workflow runs from $START_DATE to $END_DATE"

          primary_token="$APP_GH_TOKEN"
          if [ -z "$primary_token" ]; then
            primary_token="$PRIMARY_GH_TOKEN"
          fi
          if [ -z "$primary_token" ]; then
            primary_token="$FALLBACK_GH_TOKEN"
          fi

          # Get workflow ID for Health 75 (direct path lookup avoids pagination limits)
          if ! workflow_id=$(GH_TOKEN="$primary_token" gh api "repos/$GITHUB_REPOSITORY/actions/workflows/health-75-api-rate-diagnostic.yml" \
            --jq '.id // empty'); then
            echo "Primary token could not access workflow metadata. Retrying with GITHUB_TOKEN." >&2
            workflow_id=$(GH_TOKEN="$FALLBACK_GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/workflows/health-75-api-rate-diagnostic.yml" \
              --jq '.id // empty')
          fi

          if [ -z "$workflow_id" ]; then
            echo "::error::Could not find Health 75 workflow"
            exit 1
          fi

          echo "Workflow ID: $workflow_id"

          # Fetch runs in date range (GitHub API uses created filter)
          if ! runs=$(GH_TOKEN="$primary_token" gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs" \
            --paginate \
            -F "created=>=$START_DATE" \
            -F "status=completed" \
            --jq '[.workflow_runs[] | select(.conclusion == "success") | {
              id: .id,
              created_at: .created_at,
              run_number: .run_number
            }]'); then
            echo "Primary token could not access workflow runs. Retrying with GITHUB_TOKEN." >&2
            runs=$(GH_TOKEN="$FALLBACK_GH_TOKEN" gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_id/runs" \
              --paginate \
              -F "created=>=$START_DATE" \
              -F "status=completed" \
              --jq '[.workflow_runs[] | select(.conclusion == "success") | {
                id: .id,
                created_at: .created_at,
                run_number: .run_number
              }]')
          fi

          # Normalize END_DATE to an ISO 8601 end-of-day timestamp
          if [[ "$END_DATE" == *T* ]]; then
            END_BOUND="$END_DATE"
          else
            END_BOUND="${END_DATE}T23:59:59Z"
          fi

          # Filter to end date (inclusive)
          runs=$(echo "$runs" | jq --arg end "$END_BOUND" '[.[] | select(.created_at <= $end)]')

          run_count=$(echo "$runs" | jq 'length')
          echo "Found $run_count successful runs in date range"

          echo "$runs" > /tmp/runs.json
          echo "run_count=$run_count" >> "$GITHUB_OUTPUT"

      - name: List historical workflow runs
        id: list_runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Read runs from previous step
          runs=$(cat /tmp/runs.json)
          run_count=$(echo "$runs" | jq 'length')

          echo "Found $run_count successful runs in date range"

          # Limit to 50 runs for display (avoid excessive output)
          max_runs=50
          if [ "$run_count" -gt "$max_runs" ]; then
            echo "Limiting display to $max_runs most recent runs"
            jq ".[:$max_runs]" /tmp/runs.json > /tmp/runs_limited.json
            mv /tmp/runs_limited.json /tmp/runs.json
          fi

          # Output run count for summary step
          echo "processed_count=$(jq 'length' /tmp/runs.json)" >> "$GITHUB_OUTPUT"

      - name: Generate historical summary report
        env:
          START_DATE: ${{ steps.dates.outputs.start_date }}
          END_DATE: ${{ steps.dates.outputs.end_date }}
          RUN_COUNT: ${{ steps.history.outputs.run_count }}
        run: |
          set -euo pipefail

          echo "# 📊 Historical API Rate Limit Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Report Period:** $START_DATE to $END_DATE" >> "$GITHUB_STEP_SUMMARY"
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$GITHUB_STEP_SUMMARY"
          echo "**Data Points:** $RUN_COUNT successful diagnostic runs" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$RUN_COUNT" -eq 0 ]; then
            echo "⚠️ **No diagnostic data available for this period.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The Health 75 API Rate Diagnostic workflow collects snapshots every 4 hours." >> "$GITHUB_STEP_SUMMARY"
            echo "Historical data is only available for periods when the workflow ran successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**Tip:** Run the workflow in 'current' mode to start collecting data." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## 📈 Summary Statistics" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            # Calculate period duration safely
            PERIOD_DAYS="unknown"
            if start_epoch=$(date -d "$START_DATE" +%s 2>/dev/null) && end_epoch=$(date -d "$END_DATE" +%s 2>/dev/null); then
              PERIOD_DAYS=$(( (end_epoch - start_epoch) / 86400 ))
            fi

            echo "| Metric | Value |" >> "$GITHUB_STEP_SUMMARY"
            echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
            echo "| Total Data Points | $RUN_COUNT |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Collection Frequency | Every 4 hours |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Period Duration | $PERIOD_DAYS days |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            echo "## 📋 Available Run History" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Recent successful diagnostic runs in this period:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"

            # List recent runs with links
            jq -r '.[:10][] | "- [\(.created_at | split("T")[0])] Run #\(.run_number) - [View Details]('"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"'/actions/runs/\(.id))"' /tmp/runs.json >> "$GITHUB_STEP_SUMMARY"

            if [ "$RUN_COUNT" -gt 10 ]; then
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "_...and $((RUN_COUNT - 10)) more runs_" >> "$GITHUB_STEP_SUMMARY"
            fi

            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## 💡 Usage Notes" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- Each run captures a point-in-time snapshot of API rate limits" >> "$GITHUB_STEP_SUMMARY"
            echo "- Click on individual runs above to view detailed rate limit data" >> "$GITHUB_STEP_SUMMARY"
            echo "- Rate limits reset hourly; snapshots show utilization at collection time" >> "$GITHUB_STEP_SUMMARY"
            echo "- For trend analysis, review multiple consecutive runs" >> "$GITHUB_STEP_SUMMARY"
          fi
