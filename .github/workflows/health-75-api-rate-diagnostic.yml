name: Health 75 API Rate Diagnostic

# Evaluates API rate limit utilization across all repos for PATs and GitHub Apps.
# Purpose: Identify which processes are consuming API limits and how well the combined
# authentication methods share the load to prevent rate limit exhaustion.

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours for continuous monitoring
  workflow_dispatch:
    inputs:
      include_consumer_repos:
        description: 'Include consumer repos in diagnostic (true/false)'
        type: boolean
        required: false
        default: true
      verbose:
        description: 'Include detailed resource breakdown'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

env:
  # Consumer repos to check - these use CODESPACES_WORKFLOWS PAT
  REGISTERED_CONSUMER_REPOS: |
    stranske/Travel-Plan-Permission
    stranske/Template
    stranske/trip-planner
    stranske/Manager-Database
    stranske/Portable-Alpha-Extension-Model
    stranske/Trend_Model_Project
    stranske/Collab-Admin

concurrency:
  group: api-rate-diagnostic-${{ github.repository }}
  cancel-in-progress: true

jobs:
  collect-rate-limits:
    name: Collect API Rate Limits
    runs-on: ubuntu-latest
    outputs:
      github_token_rate: ${{ steps.github_token.outputs.rate_json }}
      pat_rate: ${{ steps.pat.outputs.rate_json }}
      app_rate: ${{ steps.app.outputs.rate_json }}
      summary_json: ${{ steps.aggregate.outputs.summary }}
    env:
      CODESPACES_WORKFLOWS: ${{ secrets.CODESPACES_WORKFLOWS || '' }}
      WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
      WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check GITHUB_TOKEN rate limits
        id: github_token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "::group::GITHUB_TOKEN Rate Limits"

          rate_data=$(gh api rate_limit 2>/dev/null || echo '{}')

          if [ -n "$rate_data" ] && [ "$rate_data" != "{}" ]; then
            # Extract key metrics
            core_limit=$(echo "$rate_data" | jq -r '.resources.core.limit // 0')
            core_remaining=$(echo "$rate_data" | jq -r '.resources.core.remaining // 0')
            core_used=$(echo "$rate_data" | jq -r '.resources.core.used // 0')
            core_reset=$(echo "$rate_data" | jq -r '.resources.core.reset // 0')

            graphql_limit=$(echo "$rate_data" | jq -r '.resources.graphql.limit // 0')
            graphql_remaining=$(echo "$rate_data" | jq -r '.resources.graphql.remaining // 0')
            graphql_used=$(echo "$rate_data" | jq -r '.resources.graphql.used // 0')

            search_limit=$(echo "$rate_data" | jq -r '.resources.search.limit // 0')
            search_remaining=$(echo "$rate_data" | jq -r '.resources.search.remaining // 0')
            search_used=$(echo "$rate_data" | jq -r '.resources.search.used // 0')

            # Calculate utilization percentages
            if [ "$core_limit" -gt 0 ]; then
              core_pct=$(echo "scale=1; ($core_used * 100) / $core_limit" | bc)
            else
              core_pct="0"
            fi

            if [ "$graphql_limit" -gt 0 ]; then
              graphql_pct=$(echo "scale=1; ($graphql_used * 100) / $graphql_limit" | bc)
            else
              graphql_pct="0"
            fi

            if [ "$search_limit" -gt 0 ]; then
              search_pct=$(echo "scale=1; ($search_used * 100) / $search_limit" | bc)
            else
              search_pct="0"
            fi

            reset_time=$(date -d "@$core_reset" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown")

            echo "GITHUB_TOKEN (Installation Token)"
            echo "  Core API: ${core_used}/${core_limit} (${core_pct}% used)"
            echo "  GraphQL:  ${graphql_used}/${graphql_limit} (${graphql_pct}% used)"
            echo "  Search:   ${search_used}/${search_limit} (${search_pct}% used)"
            echo "  Reset at: ${reset_time}"

            # Output JSON for aggregation (compact single-line for safe passing)
            rate_json=$(jq -cn \
              --arg source "GITHUB_TOKEN" \
              --argjson core_limit "$core_limit" \
              --argjson core_remaining "$core_remaining" \
              --argjson core_used "$core_used" \
              --arg core_pct "$core_pct" \
              --argjson graphql_limit "$graphql_limit" \
              --argjson graphql_remaining "$graphql_remaining" \
              --argjson graphql_used "$graphql_used" \
              --arg graphql_pct "$graphql_pct" \
              --argjson search_limit "$search_limit" \
              --argjson search_remaining "$search_remaining" \
              --argjson search_used "$search_used" \
              --arg search_pct "$search_pct" \
              --arg reset_time "$reset_time" \
              '{
                source: $source,
                core: { limit: $core_limit, remaining: $core_remaining, used: $core_used, pct: $core_pct },
                graphql: { limit: $graphql_limit, remaining: $graphql_remaining, used: $graphql_used, pct: $graphql_pct },
                search: { limit: $search_limit, remaining: $search_remaining, used: $search_used, pct: $search_pct },
                reset: $reset_time
              }')

            echo "rate_json<<EOF" >> "$GITHUB_OUTPUT"
            echo "$rate_json" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "Failed to retrieve GITHUB_TOKEN rate limits"
            echo 'rate_json={}' >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Check PAT (CODESPACES_WORKFLOWS) rate limits
        id: pat
        if: ${{ env.CODESPACES_WORKFLOWS != '' }}
        env:
          GH_TOKEN: ${{ env.CODESPACES_WORKFLOWS }}
        run: |
          set -euo pipefail
          echo "::group::PAT Rate Limits"

          rate_data=$(gh api rate_limit 2>/dev/null || echo '{}')

          if [ -n "$rate_data" ] && [ "$rate_data" != "{}" ]; then
            core_limit=$(echo "$rate_data" | jq -r '.resources.core.limit // 0')
            core_remaining=$(echo "$rate_data" | jq -r '.resources.core.remaining // 0')
            core_used=$(echo "$rate_data" | jq -r '.resources.core.used // 0')
            core_reset=$(echo "$rate_data" | jq -r '.resources.core.reset // 0')

            graphql_limit=$(echo "$rate_data" | jq -r '.resources.graphql.limit // 0')
            graphql_remaining=$(echo "$rate_data" | jq -r '.resources.graphql.remaining // 0')
            graphql_used=$(echo "$rate_data" | jq -r '.resources.graphql.used // 0')

            search_limit=$(echo "$rate_data" | jq -r '.resources.search.limit // 0')
            search_remaining=$(echo "$rate_data" | jq -r '.resources.search.remaining // 0')
            search_used=$(echo "$rate_data" | jq -r '.resources.search.used // 0')

            if [ "$core_limit" -gt 0 ]; then
              core_pct=$(echo "scale=1; ($core_used * 100) / $core_limit" | bc)
            else
              core_pct="0"
            fi

            if [ "$graphql_limit" -gt 0 ]; then
              graphql_pct=$(echo "scale=1; ($graphql_used * 100) / $graphql_limit" | bc)
            else
              graphql_pct="0"
            fi

            if [ "$search_limit" -gt 0 ]; then
              search_pct=$(echo "scale=1; ($search_used * 100) / $search_limit" | bc)
            else
              search_pct="0"
            fi

            reset_time=$(date -d "@$core_reset" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown")

            echo "CODESPACES_WORKFLOWS PAT"
            echo "  Core API: ${core_used}/${core_limit} (${core_pct}% used)"
            echo "  GraphQL:  ${graphql_used}/${graphql_limit} (${graphql_pct}% used)"
            echo "  Search:   ${search_used}/${search_limit} (${search_pct}% used)"
            echo "  Reset at: ${reset_time}"

            rate_json=$(jq -cn \
              --arg source "CODESPACES_WORKFLOWS_PAT" \
              --argjson core_limit "$core_limit" \
              --argjson core_remaining "$core_remaining" \
              --argjson core_used "$core_used" \
              --arg core_pct "$core_pct" \
              --argjson graphql_limit "$graphql_limit" \
              --argjson graphql_remaining "$graphql_remaining" \
              --argjson graphql_used "$graphql_used" \
              --arg graphql_pct "$graphql_pct" \
              --argjson search_limit "$search_limit" \
              --argjson search_remaining "$search_remaining" \
              --argjson search_used "$search_used" \
              --arg search_pct "$search_pct" \
              --arg reset_time "$reset_time" \
              '{
                source: $source,
                core: { limit: $core_limit, remaining: $core_remaining, used: $core_used, pct: $core_pct },
                graphql: { limit: $graphql_limit, remaining: $graphql_remaining, used: $graphql_used, pct: $graphql_pct },
                search: { limit: $search_limit, remaining: $search_remaining, used: $search_used, pct: $search_pct },
                reset: $reset_time
              }')

            echo "rate_json<<EOF" >> "$GITHUB_OUTPUT"
            echo "$rate_json" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "Failed to retrieve PAT rate limits"
            echo 'rate_json={}' >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Mint GitHub App token
        id: app_token
        if: ${{ env.WORKFLOWS_APP_ID != '' && env.WORKFLOWS_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check GitHub App rate limits
        id: app
        if: ${{ steps.app_token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          echo "::group::GitHub App Rate Limits"

          rate_data=$(gh api rate_limit 2>/dev/null || echo '{}')

          if [ -n "$rate_data" ] && [ "$rate_data" != "{}" ]; then
            core_limit=$(echo "$rate_data" | jq -r '.resources.core.limit // 0')
            core_remaining=$(echo "$rate_data" | jq -r '.resources.core.remaining // 0')
            core_used=$(echo "$rate_data" | jq -r '.resources.core.used // 0')
            core_reset=$(echo "$rate_data" | jq -r '.resources.core.reset // 0')

            graphql_limit=$(echo "$rate_data" | jq -r '.resources.graphql.limit // 0')
            graphql_remaining=$(echo "$rate_data" | jq -r '.resources.graphql.remaining // 0')
            graphql_used=$(echo "$rate_data" | jq -r '.resources.graphql.used // 0')

            search_limit=$(echo "$rate_data" | jq -r '.resources.search.limit // 0')
            search_remaining=$(echo "$rate_data" | jq -r '.resources.search.remaining // 0')
            search_used=$(echo "$rate_data" | jq -r '.resources.search.used // 0')

            if [ "$core_limit" -gt 0 ]; then
              core_pct=$(echo "scale=1; ($core_used * 100) / $core_limit" | bc)
            else
              core_pct="0"
            fi

            if [ "$graphql_limit" -gt 0 ]; then
              graphql_pct=$(echo "scale=1; ($graphql_used * 100) / $graphql_limit" | bc)
            else
              graphql_pct="0"
            fi

            if [ "$search_limit" -gt 0 ]; then
              search_pct=$(echo "scale=1; ($search_used * 100) / $search_limit" | bc)
            else
              search_pct="0"
            fi

            reset_time=$(date -d "@$core_reset" -u +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || echo "unknown")

            echo "WORKFLOWS_APP (GitHub App)"
            echo "  Core API: ${core_used}/${core_limit} (${core_pct}% used)"
            echo "  GraphQL:  ${graphql_used}/${graphql_limit} (${graphql_pct}% used)"
            echo "  Search:   ${search_used}/${search_limit} (${search_pct}% used)"
            echo "  Reset at: ${reset_time}"

            rate_json=$(jq -cn \
              --arg source "WORKFLOWS_APP" \
              --argjson core_limit "$core_limit" \
              --argjson core_remaining "$core_remaining" \
              --argjson core_used "$core_used" \
              --arg core_pct "$core_pct" \
              --argjson graphql_limit "$graphql_limit" \
              --argjson graphql_remaining "$graphql_remaining" \
              --argjson graphql_used "$graphql_used" \
              --arg graphql_pct "$graphql_pct" \
              --argjson search_limit "$search_limit" \
              --argjson search_remaining "$search_remaining" \
              --argjson search_used "$search_used" \
              --arg search_pct "$search_pct" \
              --arg reset_time "$reset_time" \
              '{
                source: $source,
                core: { limit: $core_limit, remaining: $core_remaining, used: $core_used, pct: $core_pct },
                graphql: { limit: $graphql_limit, remaining: $graphql_remaining, used: $graphql_used, pct: $graphql_pct },
                search: { limit: $search_limit, remaining: $search_remaining, used: $search_used, pct: $search_pct },
                reset: $reset_time
              }')

            echo "rate_json<<EOF" >> "$GITHUB_OUTPUT"
            echo "$rate_json" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "Failed to retrieve GitHub App rate limits"
            echo 'rate_json={}' >> "$GITHUB_OUTPUT"
          fi
          echo "::endgroup::"

      - name: Aggregate and analyze results
        id: aggregate
        env:
          GITHUB_TOKEN_RATE: ${{ steps.github_token.outputs.rate_json }}
          PAT_RATE: ${{ steps.pat.outputs.rate_json }}
          APP_RATE: ${{ steps.app.outputs.rate_json }}
        run: |
          set -uo pipefail  # Note: removed -e to handle errors manually

          echo "::group::Rate data aggregation"

          # Strip any trailing whitespace/newlines that GitHub Actions heredoc might add
          # and extract just the JSON object (from first { to last })
          gt_raw="${GITHUB_TOKEN_RATE:-{}}"
          pat_raw="${PAT_RATE:-{}}"
          app_raw="${APP_RATE:-{}}"

          # Debug: show raw values
          echo "Raw env var lengths: gt=${#gt_raw}, pat=${#pat_raw}, app=${#app_raw}"

          # Extract JSON object - find first { and last } to handle any extra chars
          extract_json() {
            local input="$1"
            local start end
            # Find first { and last }
            start="${input%%\{*}"
            if [[ "$input" == *"{"* ]] && [[ "$input" == *"}"* ]]; then
              # Get substring from first { to end, then trim after last }
              local from_start="${input:${#start}}"
              echo "${from_start%\}*}}"
            else
              echo "{}"
            fi
          }

          gt_json=$(extract_json "$gt_raw")
          pat_json=$(extract_json "$pat_raw")
          app_json=$(extract_json "$app_raw")

          echo "Extracted JSON lengths: gt=${#gt_json}, pat=${#pat_json}, app=${#app_json}"

          # Write clean JSON to temp files
          printf '%s\n' "$gt_json" > /tmp/gt_rate.json
          printf '%s\n' "$pat_json" > /tmp/pat_rate.json
          printf '%s\n' "$app_json" > /tmp/app_rate.json

          # Validate JSON with jq
          validate_json() {
            local file="$1"
            local name="$2"
            if ! jq -e '.' "$file" > /dev/null 2>&1; then
              echo "Warning: $name is not valid JSON, using empty object"
              echo "Content: $(cat "$file")"
              echo '{}' > "$file"
            fi
          }

          validate_json /tmp/gt_rate.json "GITHUB_TOKEN_RATE"
          validate_json /tmp/pat_rate.json "PAT_RATE"
          validate_json /tmp/app_rate.json "APP_RATE"

          echo "Validated JSON sizes:"
          wc -c /tmp/gt_rate.json /tmp/pat_rate.json /tmp/app_rate.json

          # Create summary JSON using file slurp (avoids shell quoting entirely)
          summary=$(jq -cn \
            --arg timestamp "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --slurpfile gt /tmp/gt_rate.json \
            --slurpfile pat /tmp/pat_rate.json \
            --slurpfile app /tmp/app_rate.json \
            '{
              timestamp: $timestamp,
              tokens: {
                github_token: $gt[0],
                pat: $pat[0],
                app: $app[0]
              }
            }')

          echo "Summary created successfully"
          echo "::endgroup::"

          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  check-consumer-repos:
    name: Check Consumer Repo Activity
    runs-on: ubuntu-latest
    if: ${{ inputs.include_consumer_repos != false }}
    needs: collect-rate-limits
    outputs:
      consumer_activity: ${{ steps.activity.outputs.activity_json }}
    env:
      CODESPACES_WORKFLOWS: ${{ secrets.CODESPACES_WORKFLOWS || '' }}

    steps:
      - name: Check recent workflow runs across consumer repos
        id: activity
        if: ${{ env.CODESPACES_WORKFLOWS != '' }}
        env:
          GH_TOKEN: ${{ env.CODESPACES_WORKFLOWS }}
          REGISTERED_CONSUMER_REPOS: |
            stranske/Travel-Plan-Permission
            stranske/Template
            stranske/trip-planner
            stranske/Manager-Database
            stranske/Portable-Alpha-Extension-Model
            stranske/Trend_Model_Project
            stranske/Collab-Admin
        run: |
          set -euo pipefail
          echo "::group::Consumer Repo Activity"

          activity_json='[]'

          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            repo=$(echo "$repo" | xargs)  # trim whitespace

            echo "Checking $repo..."

            # Get recent workflow runs (last hour)
            since=$(date -u -d '1 hour ago' +"%Y-%m-%dT%H:%M:%SZ" 2>/dev/null || date -u +"%Y-%m-%dT%H:%M:%SZ")

            runs_data=$(gh api "repos/${repo}/actions/runs?per_page=100&created=>=${since}" 2>/dev/null || echo '{"workflow_runs":[]}')

            total_runs=$(echo "$runs_data" | jq '.total_count // 0')
            in_progress=$(echo "$runs_data" | jq '[.workflow_runs[] | select(.status == "in_progress")] | length')
            queued=$(echo "$runs_data" | jq '[.workflow_runs[] | select(.status == "queued")] | length')
            completed=$(echo "$runs_data" | jq '[.workflow_runs[] | select(.status == "completed")] | length')

            # Get most common workflows
            workflow_counts=$(echo "$runs_data" | jq -r '[.workflow_runs[].name] | group_by(.) | map({name: .[0], count: length}) | sort_by(-.count) | .[0:5]')

            repo_json=$(jq -n \
              --arg repo "$repo" \
              --argjson total_runs "$total_runs" \
              --argjson in_progress "$in_progress" \
              --argjson queued "$queued" \
              --argjson completed "$completed" \
              --argjson workflows "$workflow_counts" \
              '{
                repo: $repo,
                runs_last_hour: $total_runs,
                in_progress: $in_progress,
                queued: $queued,
                completed: $completed,
                top_workflows: $workflows
              }')

            activity_json=$(echo "$activity_json" | jq --argjson repo "$repo_json" '. + [$repo]')

            echo "  Runs (last hour): $total_runs (in_progress: $in_progress, queued: $queued)"

          done <<< "$REGISTERED_CONSUMER_REPOS"

          echo "activity_json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$activity_json" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          echo "::endgroup::"

  generate-report:
    name: Generate Diagnostic Report
    runs-on: ubuntu-latest
    needs: [collect-rate-limits, check-consumer-repos]
    if: always()
    env:
      SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}
      CONSUMER_ACTIVITY: ${{ needs.check-consumer-repos.outputs.consumer_activity }}

    steps:
      - name: Generate comprehensive report
        id: report
        run: |
          set -euo pipefail

          echo "# 📊 API Rate Limit Diagnostic Report" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Generated:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Parse summary data
          summary="${SUMMARY_JSON:-{}}"

          echo "## 🔑 Authentication Token Rate Limits" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Token | Core API | GraphQL | Search | Reset Time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|----------|---------|--------|------------|" >> "$GITHUB_STEP_SUMMARY"

          # GITHUB_TOKEN
          gt=$(echo "$summary" | jq '.tokens.github_token // {}')
          if [ "$gt" != "{}" ] && [ "$gt" != "null" ]; then
            gt_core=$(echo "$gt" | jq -r '"\(.core.used)/\(.core.limit) (\(.core.pct)%)"')
            gt_graphql=$(echo "$gt" | jq -r '"\(.graphql.used)/\(.graphql.limit) (\(.graphql.pct)%)"')
            gt_search=$(echo "$gt" | jq -r '"\(.search.used)/\(.search.limit) (\(.search.pct)%)"')
            gt_reset=$(echo "$gt" | jq -r '.reset // "N/A"')
            echo "| GITHUB_TOKEN | $gt_core | $gt_graphql | $gt_search | $gt_reset |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # PAT
          pat=$(echo "$summary" | jq '.tokens.pat // {}')
          if [ "$pat" != "{}" ] && [ "$pat" != "null" ]; then
            pat_core=$(echo "$pat" | jq -r '"\(.core.used)/\(.core.limit) (\(.core.pct)%)"')
            pat_graphql=$(echo "$pat" | jq -r '"\(.graphql.used)/\(.graphql.limit) (\(.graphql.pct)%)"')
            pat_search=$(echo "$pat" | jq -r '"\(.search.used)/\(.search.limit) (\(.search.pct)%)"')
            pat_reset=$(echo "$pat" | jq -r '.reset // "N/A"')
            echo "| CODESPACES_WORKFLOWS | $pat_core | $pat_graphql | $pat_search | $pat_reset |" >> "$GITHUB_STEP_SUMMARY"
          fi

          # App
          app=$(echo "$summary" | jq '.tokens.app // {}')
          if [ "$app" != "{}" ] && [ "$app" != "null" ]; then
            app_core=$(echo "$app" | jq -r '"\(.core.used)/\(.core.limit) (\(.core.pct)%)"')
            app_graphql=$(echo "$app" | jq -r '"\(.graphql.used)/\(.graphql.limit) (\(.graphql.pct)%)"')
            app_search=$(echo "$app" | jq -r '"\(.search.used)/\(.search.limit) (\(.search.pct)%)"')
            app_reset=$(echo "$app" | jq -r '.reset // "N/A"')
            echo "| WORKFLOWS_APP | $app_core | $app_graphql | $app_search | $app_reset |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Utilization warnings
          echo "## ⚠️ Utilization Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          warnings=0

          # Check for high utilization
          for token_path in ".tokens.github_token" ".tokens.pat" ".tokens.app"; do
            token_data=$(echo "$summary" | jq "$token_path // {}")
            if [ "$token_data" != "{}" ] && [ "$token_data" != "null" ]; then
              source=$(echo "$token_data" | jq -r '.source // "unknown"')
              core_pct=$(echo "$token_data" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
              graphql_pct=$(echo "$token_data" | jq -r '.graphql.pct // "0"' | sed 's/[^0-9.]//g')

              # Bash doesn't handle floats well, so use bc for comparison
              if [ -n "$core_pct" ] && [ "$(echo "$core_pct > 80" | bc -l)" = "1" ]; then
                echo "- 🔴 **$source** Core API is at ${core_pct}% utilization - HIGH RISK" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ -n "$core_pct" ] && [ "$(echo "$core_pct > 50" | bc -l)" = "1" ]; then
                echo "- 🟡 **$source** Core API is at ${core_pct}% utilization - MODERATE" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              fi

              if [ -n "$graphql_pct" ] && [ "$(echo "$graphql_pct > 80" | bc -l)" = "1" ]; then
                echo "- 🔴 **$source** GraphQL is at ${graphql_pct}% utilization - HIGH RISK" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              elif [ -n "$graphql_pct" ] && [ "$(echo "$graphql_pct > 50" | bc -l)" = "1" ]; then
                echo "- 🟡 **$source** GraphQL is at ${graphql_pct}% utilization - MODERATE" >> "$GITHUB_STEP_SUMMARY"
                warnings=$((warnings + 1))
              fi
            fi
          done

          if [ "$warnings" -eq 0 ]; then
            echo "✅ All tokens are within normal utilization ranges (<50%)" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Consumer repo activity
          activity="${CONSUMER_ACTIVITY:-[]}"
          if [ "$activity" != "[]" ] && [ "$activity" != "null" ]; then
            echo "## 📦 Consumer Repository Activity (Last Hour)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Repository | Total Runs | In Progress | Queued | Top Workflow |" >> "$GITHUB_STEP_SUMMARY"
            echo "|------------|------------|-------------|--------|--------------|" >> "$GITHUB_STEP_SUMMARY"

            echo "$activity" | jq -r '.[] | "\(.repo)|\(.runs_last_hour)|\(.in_progress)|\(.queued)|\(.top_workflows[0].name // "N/A") (\(.top_workflows[0].count // 0))"' | while IFS='|' read -r repo runs in_prog queued top_wf; do
              echo "| $repo | $runs | $in_prog | $queued | $top_wf |" >> "$GITHUB_STEP_SUMMARY"
            done

            echo "" >> "$GITHUB_STEP_SUMMARY"

            # Total activity summary
            total_runs=$(echo "$activity" | jq '[.[].runs_last_hour] | add // 0')
            total_in_progress=$(echo "$activity" | jq '[.[].in_progress] | add // 0')
            total_queued=$(echo "$activity" | jq '[.[].queued] | add // 0')

            echo "**Total across all repos:** $total_runs runs, $total_in_progress in progress, $total_queued queued" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Load balancing analysis
          echo "## ⚖️ Load Balancing Assessment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Count available tokens
          available_tokens=0
          [ "$gt" != "{}" ] && [ "$gt" != "null" ] && available_tokens=$((available_tokens + 1))
          [ "$pat" != "{}" ] && [ "$pat" != "null" ] && available_tokens=$((available_tokens + 1))
          [ "$app" != "{}" ] && [ "$app" != "null" ] && available_tokens=$((available_tokens + 1))

          echo "**Available Authentication Methods:** $available_tokens" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "$available_tokens" -ge 2 ]; then
            echo "✅ Multiple authentication methods are configured for load distribution" >> "$GITHUB_STEP_SUMMARY"

            # Check if load is balanced
            gt_core_pct=$(echo "$gt" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
            pat_core_pct=$(echo "$pat" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
            app_core_pct=$(echo "$app" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')

            # Use defaults if empty
            gt_core_pct=${gt_core_pct:-0}
            pat_core_pct=${pat_core_pct:-0}
            app_core_pct=${app_core_pct:-0}

            # Calculate max difference
            max_pct=$(echo "$gt_core_pct $pat_core_pct $app_core_pct" | tr ' ' '\n' | sort -rn | head -1)
            min_pct=$(echo "$gt_core_pct $pat_core_pct $app_core_pct" | tr ' ' '\n' | grep -v '^$' | sort -n | head -1)

            if [ -n "$max_pct" ] && [ -n "$min_pct" ]; then
              diff=$(echo "$max_pct - $min_pct" | bc -l 2>/dev/null || echo "0")
              if [ "$(echo "$diff > 30" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                echo "⚠️ Load is unevenly distributed (${diff}% difference). Consider reviewing token usage in workflows." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "✅ Load appears to be reasonably balanced across tokens" >> "$GITHUB_STEP_SUMMARY"
              fi
            fi
          else
            echo "⚠️ Only $available_tokens authentication method(s) configured. Consider adding:" >> "$GITHUB_STEP_SUMMARY"
            [ "$pat" = "{}" ] || [ "$pat" = "null" ] && echo "  - CODESPACES_WORKFLOWS PAT for cross-repo operations" >> "$GITHUB_STEP_SUMMARY"
            [ "$app" = "{}" ] || [ "$app" = "null" ] && echo "  - WORKFLOWS_APP GitHub App for higher rate limits" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Recommendations
          echo "## 💡 Recommendations" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "1. **GitHub App tokens** have higher rate limits (5000-15000/hour) than PATs (5000/hour)" >> "$GITHUB_STEP_SUMMARY"
          echo "2. **Installation tokens** (GITHUB_TOKEN) have even higher limits but limited scope" >> "$GITHUB_STEP_SUMMARY"
          echo "3. For high-volume operations, prefer GitHub App authentication" >> "$GITHUB_STEP_SUMMARY"
          echo "4. Implement retry logic with exponential backoff for rate-limited requests" >> "$GITHUB_STEP_SUMMARY"
          echo "5. Use conditional requests (ETags) to reduce API consumption" >> "$GITHUB_STEP_SUMMARY"

      - name: Set job status based on utilization
        env:
          SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}
        run: |
          # Check if any token is at critical utilization
          summary="${SUMMARY_JSON:-{}}"

          for token_path in ".tokens.github_token" ".tokens.pat" ".tokens.app"; do
            token_data=$(echo "$summary" | jq "$token_path // {}")
            if [ "$token_data" != "{}" ] && [ "$token_data" != "null" ]; then
              core_pct=$(echo "$token_data" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
              if [ -n "$core_pct" ] && [ "$(echo "$core_pct > 90" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                echo "::warning::Critical API rate limit utilization detected (${core_pct}%)"
              fi
            fi
          done

  alert-on-high-usage:
    name: Alert on High Usage
    runs-on: ubuntu-latest
    needs: [collect-rate-limits]
    if: always()
    env:
      SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}

    steps:
      - name: Check for critical utilization
        id: check
        run: |
          summary="${SUMMARY_JSON:-{}}"
          alert_needed=false

          for token_path in ".tokens.github_token" ".tokens.pat" ".tokens.app"; do
            token_data=$(echo "$summary" | jq "$token_path // {}")
            if [ "$token_data" != "{}" ] && [ "$token_data" != "null" ]; then
              core_pct=$(echo "$token_data" | jq -r '.core.pct // "0"' | sed 's/[^0-9.]//g')
              graphql_pct=$(echo "$token_data" | jq -r '.graphql.pct // "0"' | sed 's/[^0-9.]//g')

              if [ -n "$core_pct" ] && [ "$(echo "$core_pct > 85" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                alert_needed=true
              fi
              if [ -n "$graphql_pct" ] && [ "$(echo "$graphql_pct > 85" | bc -l 2>/dev/null || echo 0)" = "1" ]; then
                alert_needed=true
              fi
            fi
          done

          echo "alert_needed=$alert_needed" >> "$GITHUB_OUTPUT"

      - name: Create issue for high usage (if needed)
        if: steps.check.outputs.alert_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Check if an open issue already exists
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "api-rate-limit" --state open --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$existing" ]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "⚠️ API Rate Limit Alert: High Utilization Detected" \
              --label "api-rate-limit,automated" \
              --body "## API Rate Limit Alert

          The Health 75 API Rate Diagnostic workflow has detected high API rate limit utilization (>85%).

          **Detected at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          ### Recommended Actions

          1. Review recent workflow activity for unusual patterns
          2. Check if any workflows are making excessive API calls
          3. Consider implementing caching or reducing polling frequency
          4. Verify load is properly distributed across authentication methods

          This issue was automatically created and will be referenced if high usage persists."
            echo "Created new alert issue"
          else
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "🔄 **Update:** High API rate limit utilization continues.

          **Checked at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run:** $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Updated existing issue #$existing"
          fi
