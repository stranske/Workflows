name: Health 75 API Rate Diagnostic

# Evaluates API rate limit utilization across all repos for PATs and GitHub Apps.
# Purpose: Identify which processes are consuming API limits and how well the combined
# authentication methods share the load to prevent rate limit exhaustion.

on:
  schedule:
    - cron: '0 * * * *'  # Hourly snapshots strike a balance between coverage and API usage
  workflow_dispatch:
    inputs:
      include_consumer_repos:
        description: 'Include consumer repos in diagnostic (true/false)'
        type: boolean
        required: false
        default: false
      verbose:
        description: 'Include detailed resource breakdown'
        type: boolean
        required: false
        default: false
      report_mode:
        description: 'Report mode: current (live snapshot) or historical (date range)'
        type: choice
        required: false
        default: 'current'
        options:
          - current
          - historical
      start_date:
        description: 'Start date for historical report (YYYY-MM-DD or relative: 1d, 1w, 1m)'
        type: string
        required: false
        default: '1w'
      end_date:
        description: 'End date for historical report (YYYY-MM-DD or "now")'
        type: string
        required: false
        default: 'now'
      run_load_sharing_checks:
        description: 'Run the token rotation verification job (extra compute + auth mints)'
        type: boolean
        required: false
        default: false
      verify_actions_access:
        description: 'Query workflow runs with every token to verify scopes (extra API calls)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write
  actions: read  # Required for querying historical workflow runs

concurrency:
  group: api-rate-diagnostic-${{ github.repository }}
  cancel-in-progress: true

jobs:
  collect-rate-limits:
    name: Collect API Rate Limits
    runs-on: ubuntu-latest
    # Only run for current mode or scheduled triggers (not historical reports)
    if: ${{ inputs.report_mode != 'historical' }}
    outputs:
      github_token_rate: ${{ steps.github_token.outputs.rate_json }}
      pat_rate: ${{ steps.pat.outputs.rate_json }}
      service_bot_rate: ${{ steps.service_bot.outputs.rate_json }}
      app_rate: ${{ steps.app.outputs.rate_json }}
      keepalive_app_rate: ${{ steps.keepalive_app.outputs.rate_json }}
      gh_app_rate: ${{ steps.gh_app.outputs.rate_json }}
      summary_json: ${{ steps.aggregate.outputs.summary }}
    env:
      OWNER_PR_PAT: ${{ secrets.OWNER_PR_PAT || '' }}
      SERVICE_BOT_PAT: ${{ secrets.SERVICE_BOT_PAT || '' }}
      WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
      WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
      KEEPALIVE_APP_ID: ${{ secrets.KEEPALIVE_APP_ID || '' }}
      KEEPALIVE_APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY || '' }}
      GH_APP_ID: ${{ secrets.GH_APP_ID || '' }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Export load-balancer tokens
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Check GITHUB_TOKEN rate limits
        id: github_token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/rate_limits.js').runFetchRateLimitStep({source: 'GITHUB_TOKEN', displayName: 'GITHUB_TOKEN (Installation Token)', groupName: 'GITHUB_TOKEN Rate Limits', failureMessage: 'Failed to retrieve GITHUB_TOKEN rate limits'}).catch((error) => { console.error(error); process.exit(1); })"

      - name: Check PAT (OWNER_PR_PAT) rate limits
        id: pat
        if: ${{ env.OWNER_PR_PAT != '' }}
        env:
          GH_TOKEN: ${{ env.OWNER_PR_PAT }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/rate_limits.js').runFetchRateLimitStep({source: 'OWNER_PR_PAT', displayName: 'OWNER_PR_PAT', groupName: 'PAT Rate Limits', failureMessage: 'Failed to retrieve PAT rate limits'}).catch((error) => { console.error(error); process.exit(1); })"

      - name: Check SERVICE_BOT_PAT rate limits
        id: service_bot
        if: ${{ env.SERVICE_BOT_PAT != '' }}
        env:
          GH_TOKEN: ${{ env.SERVICE_BOT_PAT }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/rate_limits.js').runFetchRateLimitStep({source: 'SERVICE_BOT_PAT', displayName: 'SERVICE_BOT_PAT (stranske-automation-bot)', groupName: 'SERVICE_BOT_PAT Rate Limits', failureMessage: 'Failed to retrieve SERVICE_BOT_PAT rate limits'}).catch((error) => { console.error(error); process.exit(1); })"

      - name: Mint GitHub App token
        id: app_token
        if: ${{ env.WORKFLOWS_APP_ID != '' && env.WORKFLOWS_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check GitHub App rate limits
        id: app
        if: ${{ steps.app_token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/rate_limits.js').runFetchRateLimitStep({source: 'WORKFLOWS_APP', displayName: 'WORKFLOWS_APP (GitHub App)', groupName: 'GitHub App Rate Limits', failureMessage: 'Failed to retrieve GitHub App rate limits'}).catch((error) => { console.error(error); process.exit(1); })"

      - name: Mint KEEPALIVE_APP token
        id: keepalive_app_token
        if: ${{ env.KEEPALIVE_APP_ID != '' && env.KEEPALIVE_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ env.KEEPALIVE_APP_ID }}
          private-key: ${{ env.KEEPALIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check KEEPALIVE_APP rate limits
        id: keepalive_app
        if: ${{ steps.keepalive_app_token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.keepalive_app_token.outputs.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/rate_limits.js').runFetchRateLimitStep({source: 'KEEPALIVE_APP', displayName: 'KEEPALIVE_APP (GitHub App - Dedicated for Keepalive)', groupName: 'KEEPALIVE_APP Rate Limits', failureMessage: 'KEEPALIVE_APP not configured or failed'}).catch((error) => { console.error(error); process.exit(1); })"

      - name: Mint GH_APP token
        id: gh_app_token
        if: ${{ env.GH_APP_ID != '' && env.GH_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ env.GH_APP_ID }}
          private-key: ${{ env.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Check GH_APP rate limits
        id: gh_app
        if: ${{ steps.gh_app_token.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.gh_app_token.outputs.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/rate_limits.js').runFetchRateLimitStep({source: 'GH_APP', displayName: 'GH_APP (GitHub App - General Purpose)', groupName: 'GH_APP Rate Limits', failureMessage: 'GH_APP not configured or failed'}).catch((error) => { console.error(error); process.exit(1); })"

      - name: Verify Actions runs access per token
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_actions_access != false }}
        env:
          GITHUB_TOKEN_VALUE: ${{ github.token }}
          OWNER_PR_PAT_TOKEN: ${{ secrets.OWNER_PR_PAT || '' }}
          SERVICE_BOT_TOKEN: ${{ secrets.SERVICE_BOT_PAT || '' }}
          WORKFLOWS_APP_TOKEN: ${{ steps.app_token.outputs.token || '' }}
          KEEPALIVE_APP_TOKEN: ${{ steps.keepalive_app_token.outputs.token || '' }}
          GH_APP_TOKEN: ${{ steps.gh_app_token.outputs.token || '' }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/access_checks.js').checkActionsRunsAccess().catch((error) => { console.error(error); process.exit(1); })"

      - name: Aggregate and analyze results
        id: aggregate
        env:
          GITHUB_TOKEN_RATE: ${{ steps.github_token.outputs.rate_json }}
          PAT_RATE: ${{ steps.pat.outputs.rate_json }}
          SERVICE_BOT_RATE: ${{ steps.service_bot.outputs.rate_json || '{}' }}
          APP_RATE: ${{ steps.app.outputs.rate_json }}
          KEEPALIVE_APP_RATE: ${{ steps.keepalive_app.outputs.rate_json || '{}' }}
          GH_APP_RATE: ${{ steps.gh_app.outputs.rate_json || '{}' }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/accumulate_history.js').runAggregateStep()"

  verify-load-sharing:
    name: Verify Load-Sharing (Token Rotation)
    runs-on: ubuntu-latest
    if: ${{ inputs.report_mode != 'historical' && github.event_name == 'workflow_dispatch' && inputs.run_load_sharing_checks != false }}
    needs: collect-rate-limits
    env:
      OWNER_PR_PAT: ${{ secrets.OWNER_PR_PAT || '' }}
      SERVICE_BOT_PAT: ${{ secrets.SERVICE_BOT_PAT || '' }}
      ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT || '' }}
      AGENTS_AUTOMATION_PAT: ${{ secrets.AGENTS_AUTOMATION_PAT || '' }}
      WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
      WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
      KEEPALIVE_APP_ID: ${{ secrets.KEEPALIVE_APP_ID || '' }}
      KEEPALIVE_APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY || '' }}
      GH_APP_ID: ${{ secrets.GH_APP_ID || '' }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY || '' }}
      APP_1_ID: ${{ secrets.APP_1_ID || '' }}
      APP_1_PRIVATE_KEY: ${{ secrets.APP_1_PRIVATE_KEY || '' }}
      APP_2_ID: ${{ secrets.APP_2_ID || '' }}
      APP_2_PRIVATE_KEY: ${{ secrets.APP_2_PRIVATE_KEY || '' }}
      TOKEN_ROTATION_JSON: ${{ secrets.TOKEN_ROTATION_JSON || '' }}
      TOKEN_ROTATION_ENV_KEYS: ${{ vars.TOKEN_ROTATION_ENV_KEYS || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install load balancer dependencies
        run: |
          set -euo pipefail
          # shellcheck disable=SC1009,SC1073,SC1039,SC1072
          npm install --no-save --no-package-lock @octokit/rest @octokit/auth-app

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Validate token rotation switching
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/rate_limits.js').validateLoadSharing().catch((error) => { console.error(error); process.exit(1); })"

  check-consumer-repos:
    name: Check Consumer Repo Activity
    runs-on: ubuntu-latest
    # Always run for current mode; steps short-circuit unless manual dispatch requests it
    if: ${{ inputs.report_mode != 'historical' }}
    needs: collect-rate-limits
    outputs:
      consumer_activity: ${{ steps.activity.outputs.activity_json }}
    env:
      OWNER_PR_PAT: ${{ secrets.OWNER_PR_PAT || '' }}
      RUN_CONSUMER_CHECKS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_consumer_repos != false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup API client
        if: ${{ env.RUN_CONSUMER_CHECKS == 'true' && env.OWNER_PR_PAT != '' }}
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Load registered consumer repos
        id: consumer-repos
        if: ${{ env.RUN_CONSUMER_CHECKS == 'true' && env.OWNER_PR_PAT != '' }}
        run: |
          repos=$(
            awk '
              /REGISTERED_CONSUMER_REPOS: \|/ { flag=1; next }
              flag && /^[^[:space:]]/ { flag=0 }
              flag {
                line=$0
                sub(/^[[:space:]]+/, "", line)
                if (length(line) > 0) print line
              }
            ' .github/workflows/maint-68-sync-consumer-repos.yml
          )
          {
            echo "list<<EOF"
            echo "$repos"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"


      - name: Check recent workflow runs across consumer repos
        id: activity
        env:
          GH_TOKEN: ${{ env.OWNER_PR_PAT }}
          REGISTERED_CONSUMER_REPOS: ${{ steps.consumer-repos.outputs.list }}
          RUN_CONSUMER_CHECKS: ${{ env.RUN_CONSUMER_CHECKS }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/consumer_activity.js').runConsumerActivityStep().catch((error) => { console.error(error); process.exit(1); })"

  generate-report:
    name: Generate Diagnostic Report
    runs-on: ubuntu-latest
    needs: [collect-rate-limits, check-consumer-repos]
    # Only run for current mode (not historical reports)
    if: ${{ always() && inputs.report_mode != 'historical' }}
    env:
      SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}
      CONSUMER_ACTIVITY: ${{ needs.check-consumer-repos.outputs.consumer_activity }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Generate comprehensive report
        id: report
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/render_report.js').runCurrentReportStep()"

      - name: Set job status based on utilization
        env:
          SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/detect_thresholds.js').runCriticalWarningStep()"

  alert-on-high-usage:
    name: Alert on High Usage
    runs-on: ubuntu-latest
    needs: [collect-rate-limits]
    # Only run for current mode (not historical reports)
    if: ${{ always() && inputs.report_mode != 'historical' }}
    env:
      SUMMARY_JSON: ${{ needs.collect-rate-limits.outputs.summary_json }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Export load-balancer tokens
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}
      - name: Check for critical utilization
        id: check
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/detect_thresholds.js').runAlertCheckStep()"

      - name: Create issue for high usage (if needed)
        if: steps.check.outputs.alert_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/issue_alerts.js').createOrUpdateHighUsageIssue().catch((error) => { console.error(error); process.exit(1); })"

  alert-on-repeat-failure:
    name: Alert on Repeated Failure
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Export load-balancer tokens
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}
      - name: Create issue on repeated failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/issue_alerts.js').createOrUpdateRepeatedFailureIssue().catch((error) => { console.error(error); process.exit(1); })"

  generate-historical-report:
    name: Generate Historical Report
    runs-on: ubuntu-latest
    if: ${{ inputs.report_mode == 'historical' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Export load-balancer tokens
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}
      - name: Parse date range
        id: dates
        run: |
          set -euo pipefail
          START_INPUT="${{ inputs.start_date }}" END_INPUT="${{ inputs.end_date }}" node -e "require('./.github/scripts/api_rate_diagnostic/history.js').runParseDateRangeStep()"

      - name: Mint workflows app token
        id: workflows_app_token
        env:
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
        if: ${{ env.WORKFLOWS_APP_ID != '' && env.WORKFLOWS_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Fetch historical workflow runs
        id: history
        env:
          APP_GH_TOKEN: ${{ steps.workflows_app_token.outputs.token || '' }}
          PRIMARY_GH_TOKEN: ${{ secrets.OWNER_PR_PAT || '' }}
          FALLBACK_GH_TOKEN: ${{ github.token }}
          START_DATE: ${{ steps.dates.outputs.start_date }}
          END_DATE: ${{ steps.dates.outputs.end_date }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/history.js').runFetchHistoricalRunsStep().catch((error) => { console.error(error); process.exit(1); })"

      - name: List historical workflow runs
        id: list_runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/history.js').limitRunsForDisplay()"

      - name: Generate historical summary report
        env:
          START_DATE: ${{ steps.dates.outputs.start_date }}
          END_DATE: ${{ steps.dates.outputs.end_date }}
          RUN_COUNT: ${{ steps.history.outputs.run_count }}
        run: |
          set -euo pipefail
          node -e "require('./.github/scripts/api_rate_diagnostic/render_report.js').runHistoricalReportStep()"
