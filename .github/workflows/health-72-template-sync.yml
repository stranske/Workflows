name: Health 72 Template Sync

on:
  pull_request:
    paths:
      - '.github/scripts/**/*.js'
      - 'templates/consumer-repo/.github/scripts/**/*.js'
  push:
    branches: [main]
    paths:
      - '.github/scripts/**/*.js'
      - 'templates/consumer-repo/.github/scripts/**/*.js'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install sync dependencies
        run: pip install pyyaml

      - name: Auto-sync templates for PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          ./scripts/sync_templates.sh
          if [ -n "$(git status --porcelain templates/consumer-repo/.github/scripts)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add templates/consumer-repo/.github/scripts
            git commit -m "chore: sync template scripts" || true
            git push origin "HEAD:${HEAD_REF}"
          else
            echo "No template changes to sync."
          fi

      - name: Validate template sync
        run: |
          if ! python scripts/validate_template_sync.py; then
            echo ""
            echo "❌ FAILED: Template files are out of sync!"
            echo ""
            echo "To fix this error:"
            echo "  1. Run: ./scripts/sync_templates.sh"
            echo "  2. Commit the changes to templates/consumer-repo/"
            echo "  3. Push to your branch"
            echo ""
            exit 1
          fi
