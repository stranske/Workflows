name: Health 72 Template Sync

on:
  pull_request:
    paths:
      - '.github/sync-manifest.yml'
      - '.github/scripts/**/*.js'
      - 'scripts/aggregate_agent_metrics.py'
      - 'scripts/langchain/checklist_utils.py'
      - 'scripts/sync_templates.sh'
      - 'scripts/validate_template_sync.py'
      - 'tools/requirements-llm.txt'
      - 'templates/consumer-repo/.github/scripts/**/*.js'
  push:
    branches: [main]
    paths:
      - '.github/sync-manifest.yml'
      - '.github/scripts/**/*.js'
      - 'scripts/aggregate_agent_metrics.py'
      - 'scripts/langchain/checklist_utils.py'
      - 'scripts/sync_templates.sh'
      - 'scripts/validate_template_sync.py'
      - 'tools/requirements-llm.txt'
      - 'templates/consumer-repo/.github/scripts/**/*.js'

permissions:
  # The sync push uses the Workflows App token; GITHUB_TOKEN only reads.
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # A push made with GITHUB_TOKEN starts no workflow runs, so a sync commit pushed
      # with it left the PR head with no checks. The auto-sync push uses the Workflows
      # App token; without one, the sync step fails with an instruction instead.
      - name: Mint Workflows App token for the sync push
        id: app_token
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ steps.app_token.outputs.token || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install sync dependencies
        run: pip install pyyaml

      - name: Auto-sync templates for PRs
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          APP_TOKEN_MINTED: ${{ steps.app_token.outputs.token != '' }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          ./scripts/sync_templates.sh
          if [ -n "$(git status --porcelain templates/consumer-repo)" ]; then
            if [ "$APP_TOKEN_MINTED" != "true" ]; then
              echo "::error::templates/consumer-repo is out of sync with its sources. Health 72 pushes the sync commit only with the Workflows App token (a GITHUB_TOKEN push starts no checks on the new head), and no App token was minted. Run ./scripts/sync_templates.sh, commit templates/consumer-repo/ and push, or restore the WORKFLOWS_APP_ID / WORKFLOWS_APP_PRIVATE_KEY secrets."
              git status --porcelain templates/consumer-repo
              exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add templates/consumer-repo
            git commit -m "chore: sync consumer templates" || true
            git push origin "HEAD:${HEAD_REF}"
          else
            echo "No template changes to sync."
          fi

      - name: Validate template sync
        run: |
          if ! python scripts/validate_template_sync.py; then
            echo ""
            echo "❌ FAILED: Template files are out of sync!"
            echo ""
            echo "To fix this error:"
            echo "  1. Run: ./scripts/sync_templates.sh"
            echo "  2. Commit the changes to templates/consumer-repo/"
            echo "  3. Push to your branch"
            echo ""
            exit 1
          fi
