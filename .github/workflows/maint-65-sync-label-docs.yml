name: Maint 65 Sync Label Docs

on:
  push:
    branches: [main]
    paths:
      - 'templates/consumer-repo/docs/LABELS.md'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without pushing'
        type: boolean
        default: false
      repos:
        description: 'Comma-separated list of repos to sync (empty for all configured)'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync labels documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            templates/consumer-repo/docs/LABELS.md
            .github/workflows/maint-68-sync-consumer-repos.yml
            scripts/list_registered_consumer_repos.py
            scripts/sync_label_docs.py
          sparse-checkout-cone-mode: false

      - name: Verify source file exists
        run: |
          if [ ! -f "templates/consumer-repo/docs/LABELS.md" ]; then
            echo "::error::Source file templates/consumer-repo/docs/LABELS.md not found"
            exit 1
          fi
          echo "Source file found: templates/consumer-repo/docs/LABELS.md"
          wc -l templates/consumer-repo/docs/LABELS.md

      - name: Prepare sync token
        id: token
        env:
          OWNER_PAT: ${{ secrets.OWNER_PR_PAT }}
          SERVICE_PAT: ${{ secrets.SERVICE_BOT_PAT }}
        run: |
          if [ -n "${OWNER_PAT}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "Using OWNER_PR_PAT token"
          elif [ -n "${SERVICE_PAT}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "Using SERVICE_BOT_PAT token"
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: No sync token available - sync will be skipped"
          fi

      - name: Load default consumer repos
        id: repos
        run: |
          canonical_repos=$(python scripts/list_registered_consumer_repos.py --separator ',')
          combined_repos="stranske/Workflows-Integration-Tests,${canonical_repos}"
          echo "default_repos=${combined_repos}" >> "$GITHUB_OUTPUT"

      - name: Sync to consumer repos
        if: steps.token.outputs.token_available == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          CUSTOM_REPOS: ${{ inputs.repos }}
          DEFAULT_REPOS: ${{ steps.repos.outputs.default_repos }}
        run: |
          set -euo pipefail

          if [ -n "${CUSTOM_REPOS:-}" ]; then
            repos="${CUSTOM_REPOS}"
          else
            repos="${DEFAULT_REPOS}"
          fi

          echo "Syncing to repos: ${repos}"
          python scripts/sync_label_docs.py \
            --repos "${repos}" \
            --source templates/consumer-repo/docs/LABELS.md

      - name: Summary
        run: |
          {
            echo "## Label Documentation Sync"
            echo ""
            echo "Synced \`templates/consumer-repo/docs/LABELS.md\` to consumer repositories as \`docs/LABELS.md\`."
            echo ""
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "**Mode:** Dry run (no changes made)"
            else
              echo "**Mode:** Live sync"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
