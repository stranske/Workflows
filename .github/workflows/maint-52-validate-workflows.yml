name: Maint 52 Validate Workflows

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Parse and lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache workflow linters
        id: cache-linters
        uses: actions/cache@v5
        with:
          path: ~/.local/bin
          key: workflow-linters-actionlint-1.7.3-yq-4.44.3

      - name: Install workflow linters
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"

          if [ ! -x "$HOME/.local/bin/actionlint" ]; then
            actionlint_base="https://github.com/rhysd/actionlint/releases/download/v1.7.3"
            actionlint_url="${actionlint_base}/actionlint_1.7.3_linux_amd64.tar.gz"
            curl -sSL "$actionlint_url" \
              | tar -xz -C "$HOME/.local/bin" actionlint
            chmod +x "$HOME/.local/bin/actionlint"
          fi

          if [ ! -x "$HOME/.local/bin/yq" ]; then
            yq_base="https://github.com/mikefarah/yq/releases/download/v4.44.3"
            yq_url="${yq_base}/yq_linux_amd64.tar.gz"
            curl -sSL "$yq_url" \
              | tar -xz -C "$HOME/.local/bin"
            mv "$HOME/.local/bin/yq_linux_amd64" "$HOME/.local/bin/yq"
            chmod +x "$HOME/.local/bin/yq"
          fi

      - name: Add linters to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Dry-parse workflow files with yq
        run: |
          set -euo pipefail

          mapfile -t workflow_files < <(
            find .github/workflows -type f \( -name '*.yml' -o -name '*.yaml' \) | sort
          )
          if [ "${#workflow_files[@]}" -eq 0 ]; then
            echo "No workflow files found." >&2
            exit 1
          fi

          for file in "${workflow_files[@]}"; do
            echo "Validating YAML syntax for ${file}"
            yq eval '.' "$file" >/dev/null
          done

      - name: Build actionlint allowlist arguments
        id: allowlist
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          allowlist = Path('.github/actionlint-allowlist.txt')
          args_path = Path('actionlint-allowlist.args')

          entries: list[str] = []
          if allowlist.is_file():
              for raw in allowlist.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if not line or line.startswith('#'):
                      continue
                  entries.append(line)

          args_path.write_text('\n'.join(f'-ignore={entry}' for entry in entries), encoding='utf-8')
          PY

      - name: Run actionlint
        run: |
          set -euo pipefail
          mapfile -t extra_args < <(sed -e 's/[[:space:]]*$//' -e '/^$/d' actionlint-allowlist.args)
          actionlint "${extra_args[@]}" -oneline

      - name: Check GitHub API wrapper usage
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          set -euo pipefail
          python scripts/check_api_wrapper_guard.py --base-ref "${BASE_REF:-main}"
