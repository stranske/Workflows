# Bot Comment Handler - Thin caller for consumer repos
#
# Addresses unresolved review comments from bots (Copilot, CodeRabbit, etc.)
# by dispatching the configured agent to fix them.
#
# Triggers:
# - PR labeled with 'autofix:bot-comments' (manual trigger)
# - Gate workflow completion (automatic for agent PRs)
# - Manual dispatch for testing
#
# Agent selection:
# - Uses PR's agent:* label (agent:codex, agent:claude, etc.)
# - Falls back to Codex if no agent label
#
# Workflow file: .github/workflows/agents-bot-comment-handler.yml

name: Agents Bot Comment Handler

on:
  # Manual trigger via label
  pull_request:
    types: [labeled]

  # Automatic trigger after Gate completes (for agent PRs)
  # Note: branches-ignore is not supported for workflow_run, filtering is done in job logic
  workflow_run:
    workflows: ["Gate"]
    types: [completed]

  # Manual dispatch for testing
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to process'
        required: true
        type: string
      dry_run:
        description: 'Preview without making changes'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: bot-comments-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  # Resolve PR number from different trigger types
  resolve:
    name: Resolve PR
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      should_run: ${{ steps.resolve.outputs.should_run }}
      workflow_app_auth_mode: ${{ steps.workflow-app-creds.outputs.workflow_app_auth_mode }}
    steps:
      - name: Detect workflow App credentials
        id: workflow-app-creds
        env:
          WORKFLOWS_APP_CLIENT_ID: ${{ secrets.WORKFLOWS_APP_CLIENT_ID }}
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
        run: |
          client_id_configured=false
          legacy_app_id_configured=false
          private_key_configured=false
          use_client=false
          use_legacy=false
          workflow_app_auth_mode=none
          if [ -n "${WORKFLOWS_APP_CLIENT_ID}" ]; then
            client_id_configured=true
          fi
          if [ -n "${WORKFLOWS_APP_ID}" ]; then
            legacy_app_id_configured=true
          fi
          if [ -n "${WORKFLOWS_APP_PRIVATE_KEY}" ]; then
            private_key_configured=true
          fi
          if [ -n "${WORKFLOWS_APP_CLIENT_ID}" ] && [ -n "${WORKFLOWS_APP_PRIVATE_KEY}" ]; then
            use_client=true
            workflow_app_auth_mode=client-id
          elif [ -n "${WORKFLOWS_APP_ID}" ] && [ -n "${WORKFLOWS_APP_PRIVATE_KEY}" ]; then
            use_legacy=true
            workflow_app_auth_mode=legacy-app-id
            echo "::warning title=Legacy Workflows App ID fallback::Configure WORKFLOWS_APP_CLIENT_ID to avoid the deprecated app-id path."
          fi
          {
            echo "client_id_configured=${client_id_configured}"
            echo "legacy_app_id_configured=${legacy_app_id_configured}"
            echo "private_key_configured=${private_key_configured}"
            echo "use_client=${use_client}"
            echo "use_legacy=${use_legacy}"
            echo "workflow_app_auth_mode=${workflow_app_auth_mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Write wrapper App auth coverage
        if: always()
        env:
          WORKFLOW_APP_AUTH_MODE: ${{ steps.workflow-app-creds.outputs.workflow_app_auth_mode }}
          WORKFLOW_APP_CLIENT_ID_CONFIGURED: ${{ steps.workflow-app-creds.outputs.client_id_configured }}
          WORKFLOW_APP_LEGACY_APP_ID_CONFIGURED: ${{ steps.workflow-app-creds.outputs.legacy_app_id_configured }}
          WORKFLOW_APP_PRIVATE_KEY_CONFIGURED: ${{ steps.workflow-app-creds.outputs.private_key_configured }}
        run: |
          mkdir -p bot-comment-auth-coverage
          node <<'NODE'
          const fs = require('fs');
          const truthy = (value) => String(value || '').toLowerCase() === 'true';
          const record = {
            schema: 'workflows-bot-comment-auth-coverage/v1',
            component: 'agents-bot-comment-handler-wrapper',
            repository: process.env.GITHUB_REPOSITORY || '',
            workflow: process.env.GITHUB_WORKFLOW || '',
            run_id: process.env.GITHUB_RUN_ID || '',
            run_attempt: process.env.GITHUB_RUN_ATTEMPT || '',
            event_name: process.env.GITHUB_EVENT_NAME || '',
            auth_mode: process.env.WORKFLOW_APP_AUTH_MODE || 'none',
            client_id_configured: truthy(process.env.WORKFLOW_APP_CLIENT_ID_CONFIGURED),
            legacy_app_id_configured: truthy(process.env.WORKFLOW_APP_LEGACY_APP_ID_CONFIGURED),
            private_key_configured: truthy(process.env.WORKFLOW_APP_PRIVATE_KEY_CONFIGURED),
            fallback_warning_active: process.env.WORKFLOW_APP_AUTH_MODE === 'legacy-app-id',
            direct_jobs_covered: ['resolve', 'cleanup'],
          };
          fs.writeFileSync(
            'bot-comment-auth-coverage/wrapper.json',
            `${JSON.stringify(record, null, 2)}\n`
          );
          NODE

      - name: Upload wrapper App auth coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bot-comment-auth-coverage-wrapper-${{ github.run_id }}
          path: bot-comment-auth-coverage/wrapper.json
          if-no-files-found: error
          retention-days: 14

      - name: Mint GitHub App Token (client ID)
        id: app_token_client
        uses: actions/create-github-app-token@v3
        if: steps.workflow-app-creds.outputs.use_client == 'true'
        continue-on-error: true
        with:
          client-id: ${{ secrets.WORKFLOWS_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Mint GitHub App Token (legacy App ID)
        id: app_token_legacy
        uses: actions/create-github-app-token@v3
        if: steps.workflow-app-creds.outputs.use_legacy == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout retry helpers
        uses: actions/checkout@v6
        with:

          token: ${{ steps.app_token_client.outputs.token || steps.app_token_legacy.outputs.token || github.token }}
          repository: ${{ github.repository }}
          ref: >-
            ${{
              github.event.pull_request.base.sha ||
              github.event.pull_request.base.ref ||
              github.event.repository.default_branch ||
              github.ref_name
            }}
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false
      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
      - name: Install GitHub API dependencies
        run: npm install --no-save --no-package-lock @octokit/rest @octokit/auth-app
      - name: Resolve PR number and check conditions
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath) ? require(retryHelperPath) : null;
            let withRetry = (fn) => fn();
            if (retryHelpers?.createTokenAwareRetry) {
              ({ withRetry } = await retryHelpers.createTokenAwareRetry({
                github,
                core,
                task: 'bot-comment-handler',
              }));
            } else if (retryHelpers?.withRetry) {
              ({ withRetry } = retryHelpers);
            }

            const eventName = context.eventName;
            let prNumber = null;
            let shouldRun = false;

            if (eventName === 'workflow_dispatch') {
              prNumber = '${{ inputs.pr_number }}';
              shouldRun = true;
              console.log(`Manual dispatch for PR #${prNumber}`);
            }
            else if (eventName === 'pull_request') {
              // Only run if labeled with autofix:bot-comments
              const label = context.payload.label?.name;
              if (label === 'autofix:bot-comments') {
                prNumber = context.payload.pull_request.number;
                shouldRun = true;
                console.log(`Label trigger for PR #${prNumber}`);
              } else {
                console.log(`Ignoring label: ${label}`);
              }
            }
            else if (eventName === 'workflow_run') {
              // Only run if Gate succeeded and PR has agent:* label
              const workflowRun = context.payload.workflow_run;

              let defaultBranch = context.payload.repository?.default_branch;
              if (!defaultBranch) {
                const repoResponse = await withRetry((client) => client.rest.repos.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo
                }));
                defaultBranch = repoResponse.data?.default_branch;
              }
              if (!defaultBranch) {
                console.log('Could not determine default branch; skipping.');
                core.setOutput('should_run', 'false');
                return;
              }

              // Skip default branch
              if (workflowRun.head_branch === defaultBranch) {
                console.log(`Skipping default branch ${defaultBranch}`);
                core.setOutput('should_run', 'false');
                return;
              }

              if (workflowRun.conclusion !== 'success') {
                console.log(`Gate did not succeed (${workflowRun.conclusion}), skipping`);
                core.setOutput('should_run', 'false');
                return;
              }

              // Get PR from workflow run
              const prs = workflowRun.pull_requests;
              if (!prs || prs.length === 0) {
                console.log('No PR associated with workflow run');
                core.setOutput('should_run', 'false');
                return;
              }

              prNumber = prs[0].number;

              // Check if PR has agent label
              let pr;
              try {
                const response = await withRetry((client) => client.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber
                }));
                pr = response.data;
              } catch (error) {
                const errorMessage = error.message || error;
                console.log(`Failed to fetch PR #${prNumber} details; skipping.`);
                console.log(`Error: ${errorMessage}`);
                core.setOutput('should_run', 'false');
                return;
              }

              const hasAgentLabel = pr.labels.some(l => /^agent:/.test(l.name));
              if (!hasAgentLabel) {
                console.log(`PR #${prNumber} has no agent label, skipping`);
                core.setOutput('should_run', 'false');
                return;
              }

              // Skip auto-pilot PRs — auto-pilot manages its own quality flow
              const hasAutoPilot = pr.labels.some(l => l.name === 'agents:auto-pilot');
              if (hasAutoPilot) {
                console.log(`PR #${prNumber} is auto-pilot managed, skipping bot-comment handler`);
                core.setOutput('should_run', 'false');
                return;
              }

              shouldRun = true;
              console.log(`Gate completion trigger for agent PR #${prNumber}`);
            }

            core.setOutput('pr_number', prNumber || '');
            core.setOutput('should_run', shouldRun ? 'true' : 'false');

  # Call the reusable workflow
  handle:
    name: Handle bot comments
    needs: resolve
    if: needs.resolve.outputs.should_run == 'true'
    uses: stranske/Workflows/.github/workflows/reusable-bot-comment-handler.yml@main
    with:
      pr_number: ${{ needs.resolve.outputs.pr_number }}
      dry_run: ${{ inputs.dry_run == true }}
      ignored_paths: '.agents/,scripts/langchain/prompts/,docs/,templates/'
    secrets:
      service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
      gh_app_client_id: ${{ secrets.WORKFLOWS_APP_CLIENT_ID }}
      gh_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
      gh_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

  # Remove the trigger label after processing
  cleanup:
    name: Cleanup
    needs: [resolve, handle]
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      github.event.label.name == 'autofix:bot-comments'
    runs-on: ubuntu-latest
    steps:
      - name: Detect workflow App credentials
        id: workflow-app-creds
        env:
          WORKFLOWS_APP_CLIENT_ID: ${{ secrets.WORKFLOWS_APP_CLIENT_ID }}
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
        run: |
          client_id_configured=false
          legacy_app_id_configured=false
          private_key_configured=false
          use_client=false
          use_legacy=false
          workflow_app_auth_mode=none
          if [ -n "${WORKFLOWS_APP_CLIENT_ID}" ]; then
            client_id_configured=true
          fi
          if [ -n "${WORKFLOWS_APP_ID}" ]; then
            legacy_app_id_configured=true
          fi
          if [ -n "${WORKFLOWS_APP_PRIVATE_KEY}" ]; then
            private_key_configured=true
          fi
          if [ -n "${WORKFLOWS_APP_CLIENT_ID}" ] && [ -n "${WORKFLOWS_APP_PRIVATE_KEY}" ]; then
            use_client=true
            workflow_app_auth_mode=client-id
          elif [ -n "${WORKFLOWS_APP_ID}" ] && [ -n "${WORKFLOWS_APP_PRIVATE_KEY}" ]; then
            use_legacy=true
            workflow_app_auth_mode=legacy-app-id
            echo "::warning title=Legacy Workflows App ID fallback::Configure WORKFLOWS_APP_CLIENT_ID to avoid the deprecated app-id path."
          fi
          {
            echo "client_id_configured=${client_id_configured}"
            echo "legacy_app_id_configured=${legacy_app_id_configured}"
            echo "private_key_configured=${private_key_configured}"
            echo "use_client=${use_client}"
            echo "use_legacy=${use_legacy}"
            echo "workflow_app_auth_mode=${workflow_app_auth_mode}"
          } >> "$GITHUB_OUTPUT"

      - name: Mint GitHub App Token (client ID)
        id: app_token_client
        uses: actions/create-github-app-token@v3
        if: steps.workflow-app-creds.outputs.use_client == 'true'
        continue-on-error: true
        with:
          client-id: ${{ secrets.WORKFLOWS_APP_CLIENT_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Mint GitHub App Token (legacy App ID)
        id: app_token_legacy
        uses: actions/create-github-app-token@v3
        if: steps.workflow-app-creds.outputs.use_legacy == 'true'
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Checkout retry helpers with the best token available.
      - name: Checkout retry helpers
        uses: actions/checkout@v6
        with:

          token: ${{ steps.app_token_client.outputs.token || steps.app_token_legacy.outputs.token || github.token }}
          repository: ${{ github.repository }}
          ref: >-
            ${{
              github.event.pull_request.base.sha ||
              github.event.pull_request.base.ref ||
              github.event.repository.default_branch ||
              github.ref_name
            }}
          sparse-checkout: |
            .github/scripts/github-api-with-retry.js
            .github/actions/setup-api-client
            .github/scripts/github-rate-limited-wrapper.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Remove trigger label
        uses: actions/github-script@v9
        with:

          github-token: ${{ steps.app_token_client.outputs.token || steps.app_token_legacy.outputs.token || github.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            try {
              await withRetry(() => github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: 'autofix:bot-comments'
              }));
              console.log('Removed autofix:bot-comments label');
            } catch (error) {
              console.log(`Could not remove label: ${error.message}`);
            }
