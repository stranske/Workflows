name: Health 50 Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

env:
  CODEQL_TOKEN: ${{ secrets.ACTIONS_BOT_PAT || secrets.SERVICE_BOT_PAT || secrets.AGENTS_AUTOMATION_PAT || github.token }}
  CODEQL_TOKEN_SOURCE: ${{ secrets.ACTIONS_BOT_PAT && 'pat' || secrets.SERVICE_BOT_PAT && 'pat' || secrets.AGENTS_AUTOMATION_PAT && 'pat' || 'installation' }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        github-token: ${{ env.CODEQL_TOKEN }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
      with:
        github-token: ${{ env.CODEQL_TOKEN }}

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      continue-on-error: ${{ env.CODEQL_TOKEN_SOURCE == 'installation' }}
      with:
        category: "/language:python"
        github-token: ${{ env.CODEQL_TOKEN }}
