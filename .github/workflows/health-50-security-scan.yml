name: Health 50 Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

env:
  CODEQL_TOKEN: >-
    ${{
      secrets.CODESPACES_WORKFLOWS ||
      secrets.ACTIONS_BOT_PAT ||
      secrets.SERVICE_BOT_PAT ||
      secrets.AGENTS_AUTOMATION_PAT ||
      github.token
    }}
  CODEQL_TOKEN_SOURCE: >-
    ${{
      secrets.CODESPACES_WORKFLOWS && 'codespaces-workflows-pat' ||
      secrets.ACTIONS_BOT_PAT && 'actions-bot-pat' ||
      secrets.SERVICE_BOT_PAT && 'service-bot-pat' ||
      secrets.AGENTS_AUTOMATION_PAT && 'agents-automation-pat' ||
      'installation'
    }}

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: python
        github-token: ${{ env.CODEQL_TOKEN }}

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
      with:
        github-token: ${{ env.CODEQL_TOKEN }}

    - name: Perform CodeQL Analysis
      id: codeql_analyze
      uses: github/codeql-action/analyze@v4
      # Always continue on error - rate limit failures during SARIF upload shouldn't block PRs.
      # The analysis itself completes successfully; only telemetry/upload may fail.
      continue-on-error: true
      with:
        category: "/language:python"
        github-token: ${{ env.CODEQL_TOKEN }}

    - name: Report CodeQL status
      if: always()
      run: |
        if [ "${{ steps.codeql_analyze.outcome }}" = "failure" ]; then
          echo "::warning::CodeQL analysis step failed (likely rate limit)."
          echo "::warning::Results may not be uploaded."
        else
          echo "CodeQL analysis completed successfully."
        fi
