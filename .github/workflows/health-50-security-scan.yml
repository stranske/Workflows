name: Health 50 Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 1 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_security_relevant: ${{ steps.classify.outputs.is-security-relevant || 'true' }}
      classification_rationale: >-
        ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/path-classifier
        with:
          force-full: ${{ github.event_name == 'schedule' }}

  codeql:
    name: CodeQL
    needs: classify
    if: ${{ needs.classify.outputs.is_security_relevant == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        id: codeql_analyze
        uses: github/codeql-action/analyze@v4
        # Always continue on error - rate limit failures during SARIF upload shouldn't block PRs.
        # The analysis itself completes successfully; only telemetry/upload may fail.
        continue-on-error: true
        with:
          category: "/language:python"

      - name: Report CodeQL status
        if: always()
        run: |
          if [ "${{ steps.codeql_analyze.outcome }}" = "failure" ]; then
            echo "::warning::CodeQL analysis step failed (likely rate limit)."
            echo "::warning::Results may not be uploaded."
          else
            echo "CodeQL analysis completed successfully."
          fi
