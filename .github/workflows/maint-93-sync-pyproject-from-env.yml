# Repairs source pin drift on a maintainer-selected topic branch. Gate checks
# the committed pins before merge, and the canonical updater prepares routine PRs.

name: Maint 93 Sync Pyproject from Versions Env

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Keep the same cancellation group for runs already queued under the former name.
  group: Maint - Sync pyproject from versions.env-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-source-files:
    if: >-
      github.ref_type == 'branch' &&
      github.event.repository.default_branch != '' &&
      github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Align source files from canonical pin file
        run: |
          set -euo pipefail
          python scripts/sync_tool_versions.py --apply
          python scripts/sync_dev_dependencies.py --apply --lockfile --pre-commit

      - name: Commit and push to the selected topic if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- \
            .github/workflows/autofix-versions.env \
            .pre-commit-config.yaml \
            pyproject.toml \
            requirements.lock \
            templates/consumer-repo/.github/workflows/autofix-versions.env \
            templates/integration-repo/.github/workflows/autofix-versions.env; then
              echo "No source alignment changes to commit"
              exit 0
          fi

          git add \
            .github/workflows/autofix-versions.env \
            .pre-commit-config.yaml \
            pyproject.toml \
            requirements.lock \
            templates/consumer-repo/.github/workflows/autofix-versions.env \
            templates/integration-repo/.github/workflows/autofix-versions.env
          git commit -m "chore: align autofix source pins"
          git push origin "HEAD:${GITHUB_REF}"
