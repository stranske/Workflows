name: Selftest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: selftest-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_docs_only: ${{ steps.classify.outputs.is-docs-only || 'false' }}
      classification_rationale: >-
        ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/path-classifier
        with:
          force-full: ${{ github.event_name == 'workflow_dispatch' }}

  test-javascript:
    name: JavaScript Tests
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Run JavaScript tests
        run: node --test .github/scripts/__tests__/*.test.js

      - name: Replay path classifier against recent merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PATH_CLASSIFIER_REPLAY: '1'
        run: node --test .github/scripts/__tests__/path-classifier-replay.test.js

  test-python:
    name: Python Tests
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pyyaml requests numpy pandas

      - name: Run Python tests
        run: |
          python -m pytest tests/workflows/ -v

  lint-and-validate:
    name: Lint, Format & YAML Validation
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tools
        run: pip install black ruff pyyaml

      - name: Check Black formatting
        run: black --check --line-length 100 .

      - name: Run Ruff linting
        run: ruff check .

      - name: Validate workflow YAML files
        run: |
          python -c "
          import yaml
          import sys
          from pathlib import Path

          errors = []
          for f in Path('.github/workflows').glob('*.yml'):
              try:
                  yaml.safe_load(f.read_text())
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          workflow_count = len(list(Path('.github/workflows').glob('*.yml')))
          print(f'Validated {workflow_count} workflow files')
          "
