name: Selftest CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: selftest-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_docs_only: ${{ steps.classify.outputs.is-docs-only || 'false' }}
      classification_rationale: >-
        ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/path-classifier
        with:
          force-full: ${{ github.event_name == 'workflow_dispatch' }}

  test-javascript:
    name: JavaScript Tests
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Run JavaScript tests
        run: node --test .github/scripts/__tests__/*.test.js

      - name: Replay path classifier against recent merged PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PATH_CLASSIFIER_REPLAY: '1'
        run: node --test .github/scripts/__tests__/path-classifier-replay.test.js

  # Gate owns the full PR matrix. Main pushes and explicit Selftest dispatches
  # still exercise that same canonical suite instead of a separately maintained subset.
  python-ci:
    name: canonical Python suite
    needs: classify
    if: >-
      ${{ github.event_name != 'pull_request' &&
      (github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true') }}
    uses: ./.github/workflows/reusable-10-ci-python.yml
    permissions:
      contents: read
      actions: read
    with:
      workflows_ref: ${{ github.sha }}
      primary-python-version: '3.13'
      python-versions: '["3.13", "3.14"]'
      pytest_markers: 'not quarantine and not slow'
      pytest-workers: '4'
      lint: false
      format_check: false
      typecheck: false
      run-mypy: false
      coverage: true
      coverage-min: '70'
      artifact-prefix: 'selftest-'

  autofix-compatibility:
    name: slow compatibility (${{ matrix.python }})
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: python -m pip install --requirement requirements.lock
      - name: Run Python tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Fail before collection if missing tools would turn these checks into skips.
          python -c "import black, docformatter, isort, mypy, ruff"
          python -m pytest \
            tests/workflows/test_autofix_pipeline.py \
            tests/workflows/test_autofix_full_pipeline.py \
            tests/workflows/test_autofix_pipeline_diverse.py \
            tests/scripts/test_update_versions_from_pypi.py \
            -m 'slow and not quarantine' -n 4 --dist=loadgroup \
            --cov --cov-config=pyproject.toml \
            --cov-report=xml:coverage.xml --cov-report=json:coverage.json \
            --junitxml=pytest-junit.xml -q
      - name: Retain compatibility evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: selftest-autofix-${{ matrix.python }}
          retention-days: 30
          path: |
            pytest-junit.xml
            coverage.xml
            coverage.json

  test-python:
    # Keep the established check name while its assertions move to canonical CI
    # and the intentionally separate autofix/PyPI slow compatibility matrix.
    name: Python Tests
    needs: [classify, python-ci, autofix-compatibility]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require the applicable Python checks
        env:
          CLASSIFY: ${{ needs.classify.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.is_docs_only }}
          CANONICAL: ${{ needs.python-ci.result }}
          COMPATIBILITY: ${{ needs.autofix-compatibility.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$CLASSIFY" = success
          if [ "$DOCS_ONLY" = true ] && [ "$EVENT_NAME" != workflow_dispatch ]; then
            test "$CANONICAL" = skipped
            test "$COMPATIBILITY" = skipped
          else
            test "$COMPATIBILITY" = success
            if [ "$EVENT_NAME" = pull_request ]; then
              test "$CANONICAL" = skipped
            else
              test "$CANONICAL" = success
            fi
          fi

  packages-pdf-extract:
    name: stranske-pdf-extract package tests
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/stranske_pdf_extract
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: packages/stranske_pdf_extract/pyproject.toml

      - name: Install package test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run package test suite
        env:
          PYTHONPATH: src
        run: python -m pytest tests

  lint-and-validate:
    name: Lint, Format & YAML Validation
    needs: classify
    if: ${{ github.event_name == 'workflow_dispatch' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install tools
        run: pip install black ruff pyyaml

      - name: Check Black formatting
        run: black --check --line-length 100 .

      - name: Run Ruff linting
        run: ruff check .

      - name: Validate workflow YAML files
        run: |
          python -c "
          import yaml
          import sys
          from pathlib import Path

          errors = []
          for f in Path('.github/workflows').glob('*.yml'):
              try:
                  yaml.safe_load(f.read_text())
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)
          workflow_count = len(list(Path('.github/workflows').glob('*.yml')))
          print(f'Validated {workflow_count} workflow files')
          "


  gate-tracker-replay:
    name: Gate tracker replay receipt
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Replay authored tracker without live issue writes
        env:
          TRACKER_REPLAY_OUTPUT: ${{ github.workspace }}/artifacts/gate-tracker-replay
        run: |
          mkdir -p artifacts/gate-tracker-replay
          set -o pipefail
          node --test --test-name-pattern='authored Gate tracker replays' .github/scripts/__tests__/maint-post-ci.test.js | tee artifacts/gate-tracker-replay/console.txt
      - name: Upload tracker replay receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gate-tracker-replay
          path: artifacts/gate-tracker-replay/
          if-no-files-found: error
          retention-days: 14
