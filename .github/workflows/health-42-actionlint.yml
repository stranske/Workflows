name: Health 42 Actionlint

on:
  workflow_call:
    inputs:
      reporter:
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: actionlint-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: workflow lint (maint-36)
    runs-on: ubuntu-latest
    env:
      # ACTIONLINT_VERSION comes from .github/config/workflow-linters.env (one pin, B16).
      REVIEWDOG_VERSION: '0.21.0'
      # sha256 of reviewdog_${REVIEWDOG_VERSION}_Linux_x86_64.tar.gz from that release's
      # checksums.txt. Change both lines together.
      REVIEWDOG_SHA256: 'ad5ce7d5ffa52aaa7ec8710a8fa764181b6cecaab843cc791e1cce1680381569'
    steps:
      - name: Compute REPORTER value
        id: set-reporter
        env:
          # `inputs` covers workflow_call AND workflow_dispatch, so no JSON
          # round-trip is needed. The previous expression was
          # fromJson(github.event.inputs || '{}'), which FAILS on
          # workflow_dispatch: github.event.inputs is an OBJECT there, not a JSON
          # string, so the run never starts -
          # "Unexpected character encountered while parsing value: O".
          # Scheduled and pull_request runs passed because inputs is null there,
          # which is why this stayed hidden since 2026-06.
          REPORTER_FROM_CALL: ${{ inputs.reporter || '' }}
          REPORTER_FROM_VAR: ${{ vars.HEALTH42_REPORTER || '' }}
          EVENT_NAME: ${{ github.event_name }}
          FORK_PULL_REQUEST: >-
            ${{ github.event_name == 'pull_request' &&
                github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "${REPORTER_FROM_CALL}" ]; then
            reporter="${REPORTER_FROM_CALL}"
          elif [ -n "${REPORTER_FROM_VAR}" ]; then
            reporter="${REPORTER_FROM_VAR}"
          elif [ "${EVENT_NAME}" = "pull_request" ]; then
            reporter="github-pr-review"
          else
            reporter="github-check"
          fi

          # Fork PR tokens cannot write reviews. Reviewdog can emit runner
          # annotations with read access to the PR diff.
          if [ "${FORK_PULL_REQUEST}" = "true" ] && [ "$reporter" = "github-pr-review" ]; then
            reporter="github-annotations"
          fi
          echo "reporter=${reporter}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7

      - name: Load the shared actionlint pin
        shell: bash
        run: grep -E '^[A-Z_]+=[^[:space:]]+$' .github/config/workflow-linters.env >> "$GITHUB_ENV"

      - name: Restore cached actionlint
        id: actionlint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/actionlint"
          actionlint_prefix="https://github.com/rhysd/actionlint/releases/download"
          actionlint_base="${actionlint_prefix}/v${ACTIONLINT_VERSION}"
          actionlint_url="${actionlint_base}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSL "$actionlint_url" | tar -xz -C "$HOME/.cache/actionlint" actionlint
          chmod +x "$HOME/.cache/actionlint/actionlint"

      - name: Restore cached reviewdog
        id: reviewdog-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/reviewdog
          key: reviewdog-${{ runner.os }}-${{ env.REVIEWDOG_VERSION }}-${{ env.REVIEWDOG_SHA256 }}

      - name: Install reviewdog
        if: steps.reviewdog-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cache/reviewdog"
          reviewdog_prefix="https://github.com/reviewdog/reviewdog/releases/download"
          reviewdog_base="${reviewdog_prefix}/v${REVIEWDOG_VERSION}"
          reviewdog_archive="$RUNNER_TEMP/reviewdog.tar.gz"
          curl -sSLf -o "$reviewdog_archive" \
            "${reviewdog_base}/reviewdog_${REVIEWDOG_VERSION}_Linux_x86_64.tar.gz"
          echo "${REVIEWDOG_SHA256}  ${reviewdog_archive}" | sha256sum --check --strict -
          tar -xzf "$reviewdog_archive" -C "$HOME/.cache/reviewdog" reviewdog

      - name: Add linters to PATH
        shell: bash
        run: |
          echo "$HOME/.cache/actionlint" >> "$GITHUB_PATH"
          echo "$HOME/.cache/reviewdog" >> "$GITHUB_PATH"

      - name: Show tool versions
        shell: bash
        run: |
          actionlint -version
          reviewdog -version

      - name: Run actionlint
        id: actionlint
        shell: bash
        env:
          REPORTER: ${{ steps.set-reporter.outputs.reporter }}
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          mapfile -t extra_args < <(python -I - <<'PY'
          import sys
          from pathlib import Path

          allowlist = Path('.github/actionlint-allowlist.txt')
          if allowlist.is_file():
              for line in allowlist.read_text(encoding='utf-8').splitlines():
                  entry = line.strip()
                  if entry and not entry.startswith('#'):
                      sys.stdout.buffer.write(f'-ignore={entry}\n'.encode('utf-8'))
          PY
          )
          # mapfile does not propagate the input reader's exit status.
          wait "$!"

          extra_args+=("-no-color")

          tmpdir="$(mktemp -d)"
          oneline_output="${tmpdir}/actionlint.oneline"

          lint_status=0
          actionlint "${extra_args[@]}" -oneline >"${oneline_output}" || lint_status=$?
          if [ "$lint_status" -ne 0 ]; then
            echo '::group::actionlint (text output)'
            cat "${oneline_output}"
            echo '::endgroup::'
          fi

          rd_status=0
          # actionlint -oneline emits file:line:column: message.
          reviewdog -efm="%f:%l:%c: %m" \
              -name="maint-36 actionlint" \
              -reporter="$REPORTER" \
              -filter-mode="nofilter" \
              -level="warning" \
              -fail-level="error" <"${oneline_output}" || rd_status=$?

          rm -rf "${tmpdir}"

          if [ "$lint_status" -ne 0 ]; then
            exit "$lint_status"
          fi

          exit "$rd_status"

      - name: Publish lint summary
        if: always()
        env:
          REPORTER: ${{ steps.set-reporter.outputs.reporter }}
        run: |
          if [ -n "${{ steps.actionlint.outcome }}" ]; then
            {
              echo '## maint-36 actionlint'
              echo "- Outcome: ${{ steps.actionlint.outcome }}"
              if [ -n "${REPORTER}" ]; then
                echo "- Reporter: ${REPORTER}"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
