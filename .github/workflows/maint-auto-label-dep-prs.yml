name: Auto-label dependency PRs
# Applies agents:allow-change to dependency-bot PRs (dependabot[bot] and
# renovate[bot]). Renamed from the dependabot-specific file/name once Renovate
# became the fleet's bumper; not a gate check, so the check-run rename is safe.

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    # Dependabot and Renovate both produce dependency PRs that should carry agents:allow-change.
    if: github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Add agents:allow-change label
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "agents:allow-change"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
