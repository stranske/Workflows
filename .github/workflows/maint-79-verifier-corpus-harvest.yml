name: Maint 79 Verifier Corpus Harvest

# Grows the frozen verifier evaluation corpus from realized PR outcomes
# (stranske/Workflows#2819, move 2). High-confidence cases (stable merges,
# reverts, resolved verifier follow-ups) auto-promote via an auto-merging PR;
# ambiguous cases land in an FYI-only, auto-expiring staging file. No human
# action is required — the PR is the audit trail, not a gate.
#
# On pull_request touching the harvester/config it only runs the unit tests
# (the corpus is grown from live data, so there is no deterministic drift gate).

on:
  schedule:
    # Weekly, Monday 05:40 UTC (after maint-68 sync + maint-77 freshness).
    - cron: "40 5 * * 1"
  workflow_dispatch:
    inputs:
      write:
        description: "Persist and open a PR (false = dry-run summary only)."
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The harvester's unit tests run in the standard python-ci suite
# (tests/tools/test_harvest_verifier_corpus.py); this workflow only runs the
# scheduled/dispatch harvest.
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Harvest realized-outcome cases
        env:
          # Cross-repo read; github.token is scoped to Workflows only.
          GH_TOKEN: ${{ secrets.OWNER_PR_PAT }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.write }}" != "true" ]; then
            python -m tools.harvest_verifier_corpus | tee harvest.log
          else
            python -m tools.harvest_verifier_corpus --write | tee harvest.log
          fi
          {
            echo '## Verifier corpus harvest'
            echo '```'
            cat harvest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Open auto-merging corpus-growth PR
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.write)
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.OWNER_PR_PAT }}
          branch: verifier-corpus-harvest/auto
          base: main
          title: "corpus: harvest realized-outcome verifier cases"
          commit-message: "corpus: grow verifier eval corpus from realized PR outcomes"
          labels: "automation,model-selection"
          delete-branch: true
          body: |
            Automated corpus growth (stranske/Workflows#2819 move 2).

            High-confidence cases derived from realized PR outcomes — see the run
            summary for the promoted case list. Ambiguous cases were routed to the
            auto-expiring staging file, not here.

            Expected verdicts here come from what the world already adjudicated by
            merging or reverting each PR. The semantic NON_PASS categories
            (stale-verifier-claim, review-thread-debt, missing-acceptance-criterion)
            remain owner-sourced and are never machine-added.
      - name: Enforce review window before auto-merge
        if: steps.cpr.outputs.pull-request-number
        id: review_window
        env:
          GH_TOKEN: ${{ secrets.OWNER_PR_PAT }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -uo pipefail

          initial_head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          if [ -z "$initial_head" ]; then
            echo "::warning::Unable to identify the corpus PR head; auto-merge remains disabled."
            exit 0
          fi

          # A newly pushed head must remain available for review for seven full
          # minutes before this workflow can arm or execute its merge.
          sleep 420

          current_head="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          if [ "$current_head" != "$initial_head" ]; then
            echo "::notice::Corpus PR head changed during the review window; auto-merge remains disabled."
            exit 0
          fi

          # Do not arm auto-merge until required checks have actually reported
          # and passed on the unchanged head. A timeout leaves the PR for the
          # next maintenance run rather than merging on an incomplete signal.
          if ! required_checks="$(timeout 1200 gh pr checks "$PR_NUMBER" --required --watch --interval 30 2>&1)"; then
            printf '%s\n' "$required_checks"
            echo "::notice::Required checks are incomplete or failing; auto-merge remains disabled."
            exit 0
          fi
          if [ -z "$required_checks" ]; then
            echo "::warning::No required checks reported; auto-merge remains disabled."
            exit 0
          fi

          echo "initial_head=$initial_head" >> "$GITHUB_OUTPUT"
          echo "checks_passed=true" >> "$GITHUB_OUTPUT"
      - name: Re-read exact head and active review threads
        if: steps.review_window.outputs.checks_passed == 'true'
        id: review_gate
        uses: actions/github-script@v9
        env:
          INITIAL_HEAD: ${{ steps.review_window.outputs.initial_head }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT }}
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'verifier-corpus-review-gate',
              capabilities: ['pulls:read'],
            });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const number = Number(process.env.PR_NUMBER);
            const query = `
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    headRefOid
                    mergeStateStatus
                    reviewThreads(first: 100) {
                      nodes { isResolved isOutdated }
                    }
                  }
                }
              }
            `;
            const data = await withRetry((client) => client.graphql(query, {
              owner,
              repo,
              number,
            }));
            const pr = data.repository.pullRequest;
            const activeThreads = pr.reviewThreads.nodes.filter(
              (thread) => !thread.isResolved && !thread.isOutdated,
            ).length;
            if (activeThreads !== 0) {
              core.notice(`${activeThreads} active review thread(s) remain; auto-merge remains disabled.`);
              return;
            }
            if (pr.headRefOid !== process.env.INITIAL_HEAD || pr.mergeStateStatus !== 'CLEAN') {
              core.notice('Corpus PR changed or is not clean after gate re-read; auto-merge remains disabled.');
              return;
            }
            core.setOutput('review_window_passed', 'true');
      - name: Enable auto-merge
        if: steps.review_gate.outputs.review_window_passed == 'true'
        env:
          GH_TOKEN: ${{ secrets.OWNER_PR_PAT }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: gh pr merge "$PR_NUMBER" --squash --auto
