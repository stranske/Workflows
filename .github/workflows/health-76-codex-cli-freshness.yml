name: Health 76 Codex CLI Freshness

on:
  schedule:
    - cron: "35 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  codex-cli-freshness:
    name: Check verifier Codex CLI freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/reusable-agents-verifier.yml
            scripts/check_codex_cli_freshness.py
            tests/workflows/test_verifier_terminal_disposition.py
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Emit Codex CLI freshness contract
        run: |
          python scripts/check_codex_cli_freshness.py \
            --output-json codex-cli-freshness.json \
            --output-md codex-cli-freshness.md \
            --output-ndjson codex-cli-freshness.ndjson

      - name: Attach freshness summary
        if: ${{ always() }}
        run: |
          if [ -f codex-cli-freshness.md ]; then
            cat codex-cli-freshness.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Codex CLI freshness contract
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: codex-cli-freshness-${{ github.run_id }}
          path: |
            codex-cli-freshness.json
            codex-cli-freshness.md
            codex-cli-freshness.ndjson
          if-no-files-found: error
          retention-days: 30
