name: Verify-to-New-PR Auto-Pilot Continuation

on:
  workflow_run:
    workflows: ["Create New PR from Verification"]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  continue-auto-pilot:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Export load-balancer tokens
        uses: ./.github/actions/export-load-balancer-tokens
      - name: Install GitHub API dependencies
        run: npm install --no-save --no-package-lock @octokit/rest @octokit/auth-app
      - name: Download follow-up issue metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1009,SC1073,SC1039,SC1072
          node - <<'NODE'
          const fs = require('fs');
          const { Octokit } = require('@octokit/rest');
          const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
          const core = { info: () => {}, warning: console.warn, debug: () => {} };
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const runId = Number(process.env.RUN_ID);
          const artifactName = 'verify-create-new-pr-output';
          (async () => {
            const github = new Octokit({ auth: process.env.GH_TOKEN || process.env.GITHUB_TOKEN });
            const { paginateWithRetry, withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'agents-verify-to-new-pr-autopilot',
              capabilities: ['actions:read']
            });
            const artifacts = await paginateWithRetry(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: runId,
              per_page: 100
            });
            const artifact = artifacts.find((item) => item.name === artifactName);
            if (!artifact) {
              console.error(`Missing ${artifactName} artifact for run ${runId}`);
              process.exit(1);
            }
            const response = await withRetry((client) => client.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: artifact.id,
              archive_format: 'zip'
            }));
            const data = response.data;
            const buffer = Buffer.isBuffer(data)
              ? data
              : Buffer.from(data instanceof ArrayBuffer ? new Uint8Array(data) : data);
            fs.writeFileSync('artifact.zip', buffer);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          tmp_output="${RUNNER_TEMP:-/tmp}/followup_issue_output.json"
          unzip -p artifact.zip followup_issue_output.json > "${tmp_output}"
          mv "${tmp_output}" followup_issue_output.json

      - name: Dispatch auto-pilot from optimize step
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          issue_number=$(jq -r '.issue_number' followup_issue_output.json)
          if [ -z "${issue_number}" ] || [ "${issue_number}" = "null" ]; then
            echo "Missing issue_number in followup_issue_output.json" >&2
            exit 1
          fi
            # shellcheck disable=SC1009,SC1073,SC1039,SC1072
            ISSUE_NUMBER="${issue_number}" node - <<'NODE'
          const { Octokit } = require('@octokit/rest');
          const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
          const core = { info: () => {}, warning: console.warn, debug: () => {} };
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const issueNumber = process.env.ISSUE_NUMBER;
          const defaultBranch = process.env.DEFAULT_BRANCH;
          (async () => {
            const github = new Octokit({ auth: process.env.GH_TOKEN || process.env.GITHUB_TOKEN });
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'agents-verify-to-new-pr-autopilot-dispatch',
              capabilities: ['actions:write']
            });
            await withRetry((client) => client.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'agents-auto-pilot.yml',
              ref: defaultBranch,
              inputs: {
                issue_number: String(issueNumber),
                force_step: 'optimize'
              }
            }));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
