# Sync Manifest Validation - Ensures sync-manifest.yml is complete
#
# This workflow validates that:
# 1. Every file in templates/consumer-repo/ is accounted for in sync-manifest.yml
# 2. Every workflow in .github/workflows/ is categorized (reusable-*, maint-*, or in manifest)
# 3. Every prompt in .github/codex/prompts/ is in the manifest
# 4. No orphaned files exist that should be synced but aren't declared
#
# POLICY ENFORCEMENT: This workflow fails PRs that add sync-able files without
# updating the manifest, preventing the "forgot to wire it up" failure mode.

name: Validate Sync Manifest

on:
  pull_request:
    paths:
      - '.github/sync-manifest.yml'
      - '.github/workflows/**'
      - '.github/codex/**'
      - '.github/scripts/**'
      - 'scripts/check_workflow_action_pins.py'
      - 'templates/consumer-repo/**'
  push:
    branches: [main]
    paths:
      - '.github/sync-manifest.yml'
      - '.github/workflows/**'
      - '.github/codex/**'
      - '.github/scripts/**'
      - 'scripts/check_workflow_action_pins.py'
      - 'templates/consumer-repo/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest:
    name: Validate sync manifest completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate manifest
        id: validate
        run: |
          python scripts/validate_template_completeness.py \
            --workflows-dir ".github/workflows" \
            --template-dir "templates/consumer-repo/.github/workflows" \
            --manifest ".github/sync-manifest.yml" \
            --source "sync-manifest" \
            --strict
      - name: Validate workflow action pins
        run: |
          mkdir -p artifacts/workflow-action-pins
          python scripts/check_workflow_action_pins.py \
            .github/workflows/agents-verify-to-new-pr.yml \
            templates/consumer-repo/.github/workflows \
            --output-json artifacts/workflow-action-pins/workflow-action-pins.json \
            --output-md artifacts/workflow-action-pins/workflow-action-pins.md
      - name: Upload action pin contract
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: workflow-action-pins
          path: artifacts/workflow-action-pins/
          if-no-files-found: warn
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
                        const defaultHelpers = {
                            withRetry: (fn) => fn(),
                            paginateWithRetry: (githubInstance, method, params) => {
                                return githubInstance.paginate(method, params);
                            },
                        };
                        const retryHelpers = fs.existsSync(retryHelperPath)
                            ? require(retryHelperPath)
                            : defaultHelpers;
            const { withRetry } = retryHelpers;
            const body = `## ❌ Sync Manifest Validation Failed

            This PR modifies files that should be synced to consumer repos,
            but the sync manifest is incomplete.

              **Required action:** Update \`.github/sync-manifest.yml\` to include the
              new/modified files.

            ### Why this matters
            Files not declared in the manifest won't be synced to consumer repos
            (Template, Manager-Database, trip-planner, Travel-Plan-Permission),
            causing features to silently not work in those repos.

            ### How to fix
            1. Open \`.github/sync-manifest.yml\`
            2. Add your new files to the appropriate section (workflows, prompts, scripts, etc.)
            3. Include a \`description\` explaining what the file does
            4. If the file should NOT be synced, add it to \`excluded:\` with a reason

            See the workflow logs for specific files that need to be added.`;

                        const createComment = () => {
                            return github.rest.issues.createComment({
                                owner: context.repo.owner,
                                repo: context.repo.repo,
                                issue_number: context.issue.number,
                                body,
                            });
                        };
                        await withRetry(createComment);
