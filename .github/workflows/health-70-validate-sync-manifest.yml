# Validate the sync manifest and its declared sources.
# Require an explicit disposition for a copy target dropped from the manifest.
# Check consumer-workflow names against template files and manifest targets.
# Report action pin violations in the selected hosted and consumer workflows.

name: Validate Sync Manifest

on:
  pull_request:
    paths:
      - '.github/sync-manifest.yml'
      - 'config/llm_slots.json'
      - 'config/model_registry.json'
      - 'config/verifier_semantic_rules.json'
      - '.github/workflows/**'
      - '.github/codex/**'
      - '.github/scripts/**'
      - 'scripts/check_workflow_action_pins.py'
      - 'scripts/sync_manifest_compiler.py'
      - 'scripts/validate_sync_target_dispositions.py'
      - 'templates/consumer-repo/**'
  push:
    branches: [main]
    paths:
      - '.github/sync-manifest.yml'
      - 'config/llm_slots.json'
      - 'config/model_registry.json'
      - 'config/verifier_semantic_rules.json'
      - '.github/workflows/**'
      - '.github/codex/**'
      - '.github/scripts/**'
      - 'scripts/check_workflow_action_pins.py'
      - 'scripts/sync_manifest_compiler.py'
      - 'scripts/validate_sync_target_dispositions.py'
      - 'templates/consumer-repo/**'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest:
    name: Validate sync manifest completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}



      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: pip install pyyaml
      - name: Validate manifest schema
        id: manifest_schema
        run: >-
          python scripts/sync_manifest_compiler.py
          --manifest .github/sync-manifest.yml
          --output-json /tmp/consumer-sync-plan.json
      - name: Validate removed sync target dispositions
        id: target_dispositions
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || "$BASE_SHA" =~ ^0+$ ]]; then
            echo "::error::The sync target disposition check requires the exact event base SHA."
            exit 1
          fi
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git show "$BASE_SHA:.github/sync-manifest.yml" > "$RUNNER_TEMP/base-sync-manifest.yml"
          python -m scripts.validate_sync_target_dispositions \
            --base-manifest "$RUNNER_TEMP/base-sync-manifest.yml" \
            --manifest .github/sync-manifest.yml
      - name: Validate manifest
        id: validate
        run: |
          python scripts/validate_template_completeness.py \
            --workflows-dir ".github/workflows" \
            --template-dir "templates/consumer-repo/.github/workflows" \
            --manifest ".github/sync-manifest.yml" \
            --source "sync-manifest" \
            --strict
      - name: Validate workflow action pins
        id: action_pins
        run: |
          mkdir -p artifacts/workflow-action-pins
          python scripts/check_workflow_action_pins.py \
            .github/workflows/agents-verify-to-new-pr.yml \
            templates/consumer-repo/.github/workflows \
            --output-json artifacts/workflow-action-pins/workflow-action-pins.json \
            --output-md artifacts/workflow-action-pins/workflow-action-pins.md
      - name: Upload action pin contract
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          retention-days: 30
          name: workflow-action-pins
          path: artifacts/workflow-action-pins/
          if-no-files-found: warn
      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        env:
          MANIFEST_SCHEMA_OUTCOME: ${{ steps.manifest_schema.outcome }}
          TARGET_DISPOSITIONS_OUTCOME: ${{ steps.target_dispositions.outcome }}
          TEMPLATE_COMPLETENESS_OUTCOME: ${{ steps.validate.outcome }}
          ACTION_PINS_OUTCOME: ${{ steps.action_pins.outcome }}
        with:
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
                        const defaultHelpers = {
                            withRetry: (fn) => fn(),
                            paginateWithRetry: (githubInstance, method, params) => {
                                return githubInstance.paginate(method, params);
                            },
                        };
                        const retryHelpers = fs.existsSync(retryHelperPath)
                            ? require(retryHelperPath)
                            : defaultHelpers;
            const { withRetry } = retryHelpers;
            const guidance = [];
            if (process.env.MANIFEST_SCHEMA_OUTCOME === 'failure') {
              guidance.push('**Validate manifest schema:** Follow the compiler error in the job log. ' +
                'Correct the reported manifest field or restore the declared source.');
            }
            if (process.env.TARGET_DISPOSITIONS_OUTCOME === 'failure') {
              guidance.push('**Validate removed sync target dispositions:** Check the exact PR base and named target in the job log. Add an explicit removal or reasoned exclusion for any dropped target.');
            }
            if (process.env.TEMPLATE_COMPLETENESS_OUTCOME === 'failure') {
              guidance.push('**Validate manifest:** Review the named workflow in the job log. ' +
                'For a workflow intended for consumers, make sure it has a template and a manifest target. ' +
                'For a hosted-only workflow, check the existing rules in ' +
                '`scripts/validate_template_completeness.py`.');
            }
            if (process.env.ACTION_PINS_OUTCOME === 'failure') {
              guidance.push('**Validate workflow action pins:** See the failing step or the ' +
                '`workflow-action-pins` artifact for the reference. Use a full action commit SHA ' +
                'and keep its readable version comment.');
            }
            if (guidance.length === 0) {
              guidance.push('Open the validation job log and address the failing step shown there.');
            }
            const body = ['## ❌ Sync Manifest Validation Failed', ...guidance].join('\n\n');

                        const createComment = () => {
                            return github.rest.issues.createComment({
                                owner: context.repo.owner,
                                repo: context.repo.repo,
                                issue_number: context.issue.number,
                                body,
                            });
                        };
                        await withRetry(createComment);
