name: Maint 61 Create Floating v1 Tag

# DEPRECATED: This workflow is disabled in favor of maint-73-refresh-reusable-tags.yml
# which tracks main HEAD instead of releases for immediate fix propagation.
# The v1 tag now follows a main-tracking strategy, not a release-tracking strategy.

on:
  workflow_dispatch:
    inputs:
      deprecated_notice:
        description: 'DEPRECATED - Use maint-73-refresh-reusable-tags.yml instead'
        required: false
        type: string
  # Disabled triggers - use maint-73 for tag updates
  # schedule:
  #   - cron: "30 3 * * *"
  # release:
  #   types:
  #     - published

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  create-floating-v1-tag:
    name: Create or refresh floating v1 tag
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || startsWith(github.event.release.tag_name, 'v1.')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:

          token: ${{ steps.app_token.outputs.token || github.token }}
          fetch-depth: 0

      - name: Ensure floating v1 tag points to latest v1.x
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALLOW_MISSING_RELEASES: 1
        run: |
          scripts/update-floating-tag.sh v1 v1.
