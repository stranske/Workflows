name: Maint 62 Integration Consumer

on:
  schedule:
    - cron: '5 5 * * *'
  pull_request:
    paths:
      - '.github/workflows/maint-62-integration-consumer.yml'
      - '.github/workflows/reusable-10-ci-python.yml'
      - 'scripts/reusable_ci_scope.py'
      - 'templates/integration-repo/**'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-scenarios:
    name: Select integration scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      selected_count: ${{ steps.scope.outputs.selected_count }}
      rationale: ${{ steps.scope.outputs.rationale }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_SHA}" ]; then
            git diff --name-only "${BASE_SHA}" HEAD > changed_files.txt
          else
            : > changed_files.txt
          fi

      - name: Select scenarios
        id: scope
        env:
          FORCE_FULL: >-
            ${{
              github.event_name == 'schedule' ||
              github.event_name == 'workflow_dispatch' ||
              github.event_name == 'release'
            }}
        run: |
          python - <<'PY'
          import json
          import os

          from scripts.reusable_ci_scope import SelectionOptions, describe_selection, select_scenarios

          common_scope = [
              ".github/workflows/maint-62-integration-consumer.yml",
              ".github/workflows/reusable-10-ci-python.yml",
              "scripts/reusable_ci_scope.py",
              "templates/integration-repo/**",
          ]
          matrix = {
              "include": [
                  {
                      "name": "basic",
                      "python-versions": '["3.12"]',
                      "coverage": False,
                      "format-check": False,
                      "lint": False,
                      "typecheck": False,
                      "enable-soft-gate": False,
                      "enable-coverage-delta": False,
                      "enable-metrics": False,
                      "enable-history": False,
                      "baseline-coverage": "0",
                      "coverage-alert-drop": "0",
                      "scope": {"paths": common_scope},
                  },
                  {
                      "name": "full",
                      "python-versions": '["3.12","3.13"]',
                      "coverage": True,
                      "format-check": True,
                      "lint": True,
                      "typecheck": True,
                      "enable-soft-gate": True,
                      "enable-coverage-delta": True,
                      "enable-metrics": True,
                      "enable-history": True,
                      "baseline-coverage": "80",
                      "coverage-alert-drop": "2",
                      "scope": {"paths": common_scope + ["scripts/ci_*.py", "tools/**"]},
                  },
                  {
                      "name": "monorepo",
                      "python-versions": '["3.12"]',
                      "coverage": True,
                      "format-check": True,
                      "lint": True,
                      "typecheck": True,
                      "enable-soft-gate": False,
                      "enable-coverage-delta": False,
                      "enable-metrics": False,
                      "enable-history": False,
                      "baseline-coverage": "70",
                      "coverage-alert-drop": "1",
                      "scope": {"paths": common_scope},
                  },
              ]
          }
          changed_files = [
              line.strip()
              for line in open("changed_files.txt", encoding="utf-8")
              if line.strip()
          ]
          selected = select_scenarios(
              "maint-62-integration-consumer",
              changed_files,
              matrix,
              SelectionOptions(force_full=(os.environ.get("FORCE_FULL") or "false") == "true"),
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  "matrix="
                  + json.dumps(selected.matrix, separators=(",", ":"), sort_keys=True)
                  + "\n"
              )
              handle.write(f"selected_count={selected.selected_count}\n")
              handle.write(f"rationale={describe_selection(selected, matrix)}\n")
          print(describe_selection(selected, matrix))
          PY

  scenarios:
    name: Integration - ${{ matrix.name }}
    needs: select-scenarios
    if: ${{ needs.select-scenarios.outputs.selected_count != '0' }}
    uses: ./.github/workflows/reusable-10-ci-python.yml
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-scenarios.outputs.matrix) }}
    with:
      working-directory: templates/integration-repo
      python-versions: ${{ matrix['python-versions'] }}
      coverage: ${{ matrix.coverage }}
      format_check: ${{ matrix['format-check'] }}
      lint: ${{ matrix.lint }}
      typecheck: ${{ matrix.typecheck }}
      enable-soft-gate: ${{ matrix['enable-soft-gate'] }}
      enable-coverage-delta: ${{ matrix['enable-coverage-delta'] }}
      enable-metrics: ${{ matrix['enable-metrics'] }}
      enable-history: ${{ matrix['enable-history'] }}
      baseline-coverage: ${{ matrix['baseline-coverage'] }}
      coverage-alert-drop: ${{ matrix['coverage-alert-drop'] }}
      changed-files-json: '[]'
      force-full: ${{ github.event_name != 'pull_request' }}
      artifact-prefix: integration-${{ matrix.name }}-
    secrets: inherit

  report:
    name: Report integration status
    needs:
      - scenarios
      - select-scenarios
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      actions: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RESULT: ${{ needs.scenarios.result }}
      SCOPE_RATIONALE: ${{ needs.select-scenarios.outputs.rationale }}
    steps:
      - name: Summarize outcome
        run: |
          {
            echo "## Integration consumer status"
            echo "Result: ${RESULT}"
            echo "Scope: ${SCOPE_RATIONALE}"
            echo "Run: ${RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout retry helpers
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Open or update failure issue
        if: ${{ needs.scenarios.result != 'success' }}
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Integration consumer failures';
            const label = 'integration-test';
            const runUrl = process.env.RUN_URL;
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            async function ensureLabel() {
              try {
                await withRetry(() =>
                  github.rest.issues.getLabel({
                    owner,
                    repo,
                    name: label,
                  })
                );
              } catch (error) {
                if (error.status === 404) {
                  await withRetry(() =>
                    github.rest.issues.createLabel({
                      owner,
                      repo,
                      name: label,
                      color: 'd73a4a',
                      description: 'Integration consumer workflow failures',
                    })
                  );
                } else {
                  throw error;
                }
              }
            }

            await ensureLabel();

            const { data: issues } = await withRetry(() =>
              github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: label,
                per_page: 30,
              })
            );
            const existing = issues.find((issue) => issue.title === title);
            const body = `Integration consumer workflow failed.\n\nRun: ${runUrl}`;

            if (existing) {
              await withRetry(() =>
                github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: existing.number,
                  body,
                })
              );
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await withRetry(() =>
                github.rest.issues.create({
                  owner,
                  repo,
                  title,
                  body,
                  labels: [label],
                })
              );
              core.info(`Created issue #${created.data.number}`);
            }

      - name: Resolve open issue on success
        if: ${{ needs.scenarios.result == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Integration consumer failures';
            const label = 'integration-test';
            const runUrl = process.env.RUN_URL;
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            const { data: issues } = await withRetry(() =>
              github.rest.issues.listForRepo({
                owner,
                repo,
                state: 'open',
                labels: label,
                per_page: 30,
              })
            );
            const existing = issues.find((issue) => issue.title === title);
            if (!existing) {
              core.info('No open integration failure issue to resolve.');
              return;
            }

            await withRetry(() =>
              github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `Latest integration consumer run succeeded.\n\nRun: ${runUrl}`,
              })
            );
            await withRetry(() =>
              github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              })
            );
            core.info(`Closed issue #${existing.number}`);
