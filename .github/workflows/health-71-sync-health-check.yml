name: Health 71 Sync Health Check

# Daily check that consumer repo sync is healthy
#
# This workflow monitors the sync workflow and creates an issue if:
# 1. The last N sync runs have all failed
# 2. The sync hasn't run successfully in X days
#
# This catches silent failures where the sync workflow keeps failing
# but nobody notices because it's not blocking any PRs.

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      lookback_runs:
        description: 'Number of recent runs to check'
        type: string
        default: 5
      max_age_hours:
        description: 'Max hours since last successful sync'
        type: string
        default: 72

permissions:
  contents: read
  issues: write
  actions: read

# Consumer repos registered for automatic sync (single source of truth)
# Keep in sync with maint-68-sync-consumer-repos.yml
env:
  CONSUMER_REPOS: |
    stranske/Template
    stranske/trip-planner
    stranske/Manager-Database
    stranske/Travel-Plan-Permission
    stranske/Portable-Alpha-Extension-Model
    stranske/Trend_Model_Project
    stranske/Collab-Admin

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-sync-health:
    name: Check sync workflow health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Export load-balancer tokens
        uses: ./.github/actions/export-load-balancer-tokens
      - name: Check recent sync runs
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOKBACK: ${{ inputs.lookback_runs || 5 }}
          MAX_AGE_HOURS: ${{ inputs.max_age_hours || 72 }}
        run: |
          echo "Checking last $LOOKBACK sync workflow runs..."

          # Get recent sync workflow runs
          runs=$(node - <<-'NODE'
          const { Octokit } = require('@octokit/rest');
          const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
          const core = { info: () => {}, warning: console.warn, debug: () => {} };
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          const lookback = Number(process.env.LOOKBACK) || 5;
          (async () => {
            const github = new Octokit({ auth: process.env.GH_TOKEN || process.env.GITHUB_TOKEN });
            const { paginateWithRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'health-71-sync-health-check',
              capabilities: ['actions:read']
            });
            const runs = await paginateWithRetry(github.rest.actions.listWorkflowRuns, {
              owner,
              repo,
              workflow_id: 'maint-68-sync-consumer-repos.yml',
              per_page: 100
            });
            process.stdout.write(JSON.stringify(runs.slice(0, lookback)));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
	NODE
          )

          total_runs=$(echo "$runs" | jq 'length')
          echo "Found $total_runs runs"

          if [ "$total_runs" -eq 0 ]; then
            echo "status=no_runs" >> "$GITHUB_OUTPUT"
            echo "message=No sync workflow runs found in the lookback window" >> "$GITHUB_OUTPUT"
            echo "::warning::No sync workflow runs found!"
            exit 0
          fi

          # Count failures, successes, and other states (cancelled, skipped, timed_out, in_progress)
          failed_count=$(echo "$runs" | jq '[.[] | select(.conclusion == "failure")] | length')
          success_runs=$(echo "$runs" | jq '[.[] | select(.conclusion == "success")]')
          success_count=$(echo "$success_runs" | jq 'length')
          other_count=$((total_runs - failed_count - success_count))

          echo "Results: $success_count success, $failed_count failure, $other_count other out of $total_runs runs"

          # Check if ALL recent runs failed
          if [ "$failed_count" -eq "$total_runs" ]; then
            echo "status=all_failed" >> "$GITHUB_OUTPUT"
            echo "message=All last $total_runs sync runs have failed!" >> "$GITHUB_OUTPUT"
            echo "::error::All recent sync runs have failed!"
            exit 0
          fi

          # Check if there are NO successful runs (could be cancelled, skipped, in-progress)
          if [ "$success_count" -eq 0 ]; then
            echo "status=no_success" >> "$GITHUB_OUTPUT"
            echo "message=No successful sync runs in the last $total_runs runs ($failed_count failed, $other_count other states)" >> "$GITHUB_OUTPUT"
            echo "::warning::No successful sync runs found!"
            exit 0
          fi

          # Check time since last success
          last_success_time=$(echo "$success_runs" | jq -r '.[0].created_at')
          last_success_epoch=$(date -d "$last_success_time" +%s)
          now_epoch=$(date +%s)
          hours_since=$(((now_epoch - last_success_epoch) / 3600))

          echo "Last successful sync: $last_success_time ($hours_since hours ago)"
          echo "hours_since_success=$hours_since" >> "$GITHUB_OUTPUT"

          if [ "$hours_since" -gt "$MAX_AGE_HOURS" ]; then
            echo "status=stale" >> "$GITHUB_OUTPUT"
            echo "message=Last successful sync was $hours_since hours ago (threshold: $MAX_AGE_HOURS hours)" >> "$GITHUB_OUTPUT"
            echo "::warning::Sync is stale - last success was $hours_since hours ago"
            exit 0
          fi

          echo "status=healthy" >> "$GITHUB_OUTPUT"
          echo "message=Sync is healthy - last success $hours_since hours ago" >> "$GITHUB_OUTPUT"
          echo "✓ Sync workflow is healthy"

      - name: Check for existing issue
        if: steps.check.outputs.status != 'healthy'
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list \
            --label "sync-failure,automated" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "existing_issue=${existing:-}" >> "$GITHUB_OUTPUT"

      - name: Ensure labels exist
        if: steps.check.outputs.status != 'healthy' && steps.existing.outputs.existing_issue == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "sync-failure" \
            --description "Consumer repo sync workflow failed" \
            --color "B60205" --force || true
          gh label create "automated" \
            --description "Automatically created issue" \
            --color "0e8a16" --force || true

      - name: Create or update issue
        if: steps.check.outputs.status != 'healthy'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATUS: ${{ steps.check.outputs.status }}
          MESSAGE: ${{ steps.check.outputs.message }}
          EXISTING_ISSUE: ${{ steps.existing.outputs.existing_issue }}
          HOURS_SINCE: ${{ steps.check.outputs.hours_since_success }}
        run: |
          sync_url="${{ github.server_url }}/${{ github.repository }}/actions/workflows/maint-68-sync-consumer-repos.yml"

          case "$STATUS" in
            all_failed)
              title="🚨 Consumer Repo Sync Completely Broken - All Recent Runs Failed"
              severity="CRITICAL"
              ;;
            no_success)
              title="⚠️ Consumer Repo Sync Unhealthy - No Successful Runs"
              severity="WARNING"
              ;;
            stale)
              title="⚠️ Consumer Repo Sync Stale - No Success in ${HOURS_SINCE}+ Hours"
              severity="WARNING"
              ;;
            no_runs)
              title="❓ Consumer Repo Sync - No Runs Found"
              severity="INFO"
              ;;
            *)
              title="🔍 Consumer Repo Sync Health Issue"
              severity="UNKNOWN"
              ;;
          esac

          # Format consumer repos as markdown list
          affected_repos=$(echo "$CONSUMER_REPOS" | sed '/^$/d' | sed 's/^/          - /')

          body="## Consumer Repo Sync Health Alert

          **Severity:** ${severity}
          **Status:** ${STATUS}
          **Details:** ${MESSAGE}

          ### What This Means
          Consumer repositories are not receiving updates from the Workflows repo.
          New features, bug fixes, and security patches are NOT being deployed.

          ### Affected Repos
          ${affected_repos}

          ### Actions Required
          1. [View sync workflow runs](${sync_url})
          2. Check the failed runs for error messages
          3. Common issues:
             - Lint errors in Python scripts
             - YAML syntax errors in templates
             - Missing files in manifest
          4. Fix the issue and either:
             - Push a change to \`templates/consumer-repo/\` or \`.github/sync-manifest.yml\`
             - Manually trigger: \`gh workflow run 'Maint 68 Sync Consumer Repos'\`

          ### Prevention
          - Run \`ruff check scripts/\` before pushing
          - Validate YAML syntax before committing workflow changes

          ---
          *Detected by daily sync health check at $(date -u '+%Y-%m-%d %H:%M:%S UTC')*"

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body "### 📊 Daily Health Check Update

          **Status:** ${STATUS}
          **Details:** ${MESSAGE}
          **Checked:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          The sync workflow is still unhealthy. Please investigate."
            echo "Updated existing issue #$EXISTING_ISSUE"
          else
            gh issue create \
              --title "$title" \
              --body "$body" \
              --label "sync-failure,automated,bug"
            echo "Created new sync health issue"
          fi

      - name: Summary
        run: |
          {
            echo "## Sync Health Check Results"
            echo ""
            echo "**Status:** ${{ steps.check.outputs.status }}"
            if [ -n "${{ steps.check.outputs.message }}" ]; then
              echo "**Details:** ${{ steps.check.outputs.message }}"
            fi
            if [ -n "${{ steps.check.outputs.hours_since_success }}" ]; then
              echo "**Hours since last success:** ${{ steps.check.outputs.hours_since_success }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
