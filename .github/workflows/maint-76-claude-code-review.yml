name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  detect-secret:
    name: Detect Claude token
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
      token_reason: ${{ steps.check.outputs.token_reason }}
      token_status: ${{ steps.check.outputs.token_status }}
    steps:
      - id: check
        env:
          CLAUDE_CODE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          token_reason="missing"
          token_status="unknown"
          if [ -z "${CLAUDE_CODE_TOKEN}" ]; then
            echo "has_token=false" >>"$GITHUB_OUTPUT"
            echo "token_reason=${token_reason}" >>"$GITHUB_OUTPUT"
            echo "token_status=${token_status}" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          api_url="${GITHUB_API_URL:-https://api.github.com}/rate_limit"
          status="$(curl -sS -o /tmp/claude-token-check.json -w "%{http_code}" \
            -H "Authorization: Bearer ${CLAUDE_CODE_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api_url}" || true)"

          if [ "${status}" = "200" ]; then
            echo "has_token=true" >>"$GITHUB_OUTPUT"
            echo "token_reason=valid" >>"$GITHUB_OUTPUT"
            echo "token_status=${status}" >>"$GITHUB_OUTPUT"
          else
            echo "has_token=false" >>"$GITHUB_OUTPUT"
            echo "token_reason=invalid" >>"$GITHUB_OUTPUT"
            echo "token_status=${status:-unknown}" >>"$GITHUB_OUTPUT"
            echo "::warning title=Claude token invalid::GitHub API returned HTTP ${status:-unknown} when validating CLAUDE_CODE_OAUTH_TOKEN."
          fi

  claude-review:
    needs: detect-secret
    if: ${{ needs.detect-secret.outputs.has_token == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/anthropics/claude-code.git
          plugins: code-review@claude-code-plugins
          prompt: >-
            /code-review:code-review
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}

  claude-review-missing-secret:
    needs: detect-secret
    if: ${{ needs.detect-secret.outputs.token_reason == 'missing' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip review (secret missing)
        run: |
          cat <<'EOF' >>"$GITHUB_STEP_SUMMARY"
          ### Claude Code Review skipped
          The `CLAUDE_CODE_OAUTH_TOKEN` secret is not configured.
          Add it to enable automated reviews.
          EOF

  claude-review-invalid-secret:
    needs: detect-secret
    if: ${{ needs.detect-secret.outputs.token_reason == 'invalid' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Skip review (token invalid)
        env:
          STATUS: ${{ needs.detect-secret.outputs.token_status }}
        run: |
          cat <<'EOF' >>"$GITHUB_STEP_SUMMARY"
          ### Claude Code Review skipped
          The `CLAUDE_CODE_OAUTH_TOKEN` secret is configured but appears to be invalid (GitHub API returned status ${STATUS:-unknown}).
          Update the token to allow automated reviews.
          EOF
