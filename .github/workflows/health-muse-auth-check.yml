# Daily health check for the Muse runner (Workflows#3931).
#
# META_API_KEY must be the console key the Muse Code SUBSCRIPTION login creates (never a
# Default Project key: those meter pay-as-you-go). Muse has no free authentication probe, so
# this check is presence-only for the key, plus the two things that fail a round on a runner
# regardless of the key: the CLI installing/starting, and Muse startup/sandbox helper selection Meta requires
# on Linux CI. Only the local echo provider is used; no model API call is made, so this never spends.
#
# A failure raises (or refreshes) one alert issue and a pass closes it, through the shared
# auth-alert-issue composite (cohesion review A5b). Before that, a failure only exited 1.
name: Health 79 Muse Auth Check

on:
  schedule:
    - cron: '43 9 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout alert helper
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/auth-alert-issue
            .github/scripts/resolve_alert_issue.py
          sparse-checkout-cone-mode: false

      - name: Check META_API_KEY presence
        id: key
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$META_API_KEY" ]; then
            echo "status=present" >> "$GITHUB_OUTPUT"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Muse CLI and sandbox
        id: cli
        if: steps.key.outputs.status == 'present'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          installer="$(mktemp)"
          curl -fsSL https://dev.meta.ai/install.sh -o "$installer"
          bash "$installer"
          rm -f "$installer"
          if muse --version >/dev/null 2>&1; then
            echo "cli=ok" >> "$GITHUB_OUTPUT"
          else
            echo "cli=failed" >> "$GITHUB_OUTPUT"
          fi
          # Exercise Muse's own startup and sandbox-helper selection. The echo
          # provider is local and deterministic; it cannot make a billable model call.
          probe_dir="$(mktemp -d)"
          if (
            cd "$probe_dir"
            META_API_KEY='' MUSE_NO_AUTO_UPDATE=1 timeout 60 muse exec \
              --provider echo --sandbox-network restricted --disable-write \
              --disable-web-tools --disable-reminders --no-foreign-personal-context \
              --no-session-log --approval-judge off 'sandbox startup health check' \
              >/dev/null 2>&1
          ); then
            echo "sandbox=ok" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=failed" >> "$GITHUB_OUTPUT"
          fi
          rmdir "$probe_dir" 2>/dev/null || true

      - name: Summary
        id: verdict
        if: always()
        env:
          KEY_STATUS: ${{ steps.key.outputs.status }}
          CLI_STATUS: ${{ steps.cli.outputs.cli }}
          SANDBOX_STATUS: ${{ steps.cli.outputs.sandbox }}
        run: |
          set -euo pipefail
          {
            echo "## Muse auth check"
            echo ""
            echo "- META_API_KEY: **${KEY_STATUS:-unknown}** (presence-only; Muse has no free auth probe)"
            echo "- muse CLI: **${CLI_STATUS:-not checked}**"
            echo "- Muse sandbox startup: **${SANDBOX_STATUS:-not checked}**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${KEY_STATUS:-}" != "present" ]; then
            reason="META_API_KEY is not set; Muse workflows cannot authenticate."
          elif [ "${CLI_STATUS:-}" != "ok" ] || [ "${SANDBOX_STATUS:-}" != "ok" ]; then
            reason="Muse CLI or sandbox is not usable on this runner (cli=${CLI_STATUS:-?}, sandbox=${SANDBOX_STATUS:-?})."
          else
            reason=""
          fi
          if [ -n "$reason" ]; then
            echo "status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "status=ok" >> "$GITHUB_OUTPUT"
          fi
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Raise or resolve the Muse auth alert
        if: always()
        continue-on-error: true
        uses: ./.github/actions/auth-alert-issue
        with:
          status: ${{ steps.verdict.outputs.status || 'failed' }}
          title: '🚨 Muse runner check failed - Muse runs cannot start'
          workflow: Health 79 Muse Auth Check
          github-token: ${{ github.token }}
          detail: |
            ${{ steps.verdict.outputs.reason || 'The check did not reach a verdict; open the run.' }}

            **To clear:** if the key is missing, set the `META_API_KEY` repository secret to the
            Muse Code subscription console key (never a Default Project key). If the CLI or
            sandbox failed, open the run log for the installer or `muse exec` error.

      - name: Verdict
        if: always()
        env:
          VERDICT: ${{ steps.verdict.outputs.status }}
          REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          if [ "${VERDICT:-}" != "ok" ]; then
            echo "::error::${REASON:-Muse auth check did not reach a verdict.}"
            exit 1
          fi
