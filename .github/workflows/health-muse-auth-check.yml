# Daily health check for the Muse runner (Workflows#3931).
#
# META_API_KEY must be the console key the Muse Code SUBSCRIPTION login creates (never a
# Default Project key: those meter pay-as-you-go). Muse has no free authentication probe, so
# this check is presence-only for the key, plus the two things that fail a round on a runner
# regardless of the key: the CLI installing/starting, and Muse startup/sandbox helper selection Meta requires
# on Linux CI. Only the local echo provider is used; no model API call is made, so this never spends.
name: Health 79 Muse Auth Check

on:
  schedule:
    - cron: '43 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check META_API_KEY presence
        id: key
        env:
          META_API_KEY: ${{ secrets.META_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$META_API_KEY" ]; then
            echo "status=present" >> "$GITHUB_OUTPUT"
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Muse CLI and sandbox
        id: cli
        if: steps.key.outputs.status == 'present'
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          installer="$(mktemp)"
          curl -fsSL https://dev.meta.ai/install.sh -o "$installer"
          bash "$installer"
          rm -f "$installer"
          if muse --version >/dev/null 2>&1; then
            echo "cli=ok" >> "$GITHUB_OUTPUT"
          else
            echo "cli=failed" >> "$GITHUB_OUTPUT"
          fi
          # Exercise Muse's own startup and sandbox-helper selection. The echo
          # provider is local and deterministic; it cannot make a billable model call.
          probe_dir="$(mktemp -d)"
          if (
            cd "$probe_dir"
            META_API_KEY= MUSE_NO_AUTO_UPDATE=1 timeout 60 muse exec \
              --provider echo --sandbox-network restricted --disable-write \
              --disable-web-tools --disable-reminders --no-foreign-personal-context \
              --no-session-log --approval-judge off 'sandbox startup health check' \
              >/dev/null 2>&1
          ); then
            echo "sandbox=ok" >> "$GITHUB_OUTPUT"
          else
            echo "sandbox=failed" >> "$GITHUB_OUTPUT"
          fi
          rmdir "$probe_dir" 2>/dev/null || true

      - name: Summary and verdict
        if: always()
        env:
          KEY_STATUS: ${{ steps.key.outputs.status }}
          CLI_STATUS: ${{ steps.cli.outputs.cli }}
          SANDBOX_STATUS: ${{ steps.cli.outputs.sandbox }}
        run: |
          set -euo pipefail
          {
            echo "## Muse auth check"
            echo ""
            echo "- META_API_KEY: **${KEY_STATUS:-unknown}** (presence-only; Muse has no free auth probe)"
            echo "- muse CLI: **${CLI_STATUS:-not checked}**"
            echo "- Muse sandbox startup: **${SANDBOX_STATUS:-not checked}**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${KEY_STATUS:-}" != "present" ]; then
            echo "::error::META_API_KEY is not set; Muse workflows cannot authenticate."
            exit 1
          fi
          if [ "${CLI_STATUS:-}" != "ok" ] || [ "${SANDBOX_STATUS:-}" != "ok" ]; then
            echo "::error::Muse CLI or sandbox is not usable on this runner (cli=${CLI_STATUS:-?}, sandbox=${SANDBOX_STATUS:-?})."
            exit 1
          fi
