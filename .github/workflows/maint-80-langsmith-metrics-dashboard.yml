name: LangSmith Metrics Dashboard

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Number of days to look back for metrics'
        required: false
        default: '7'
        type: string
      create_issue:
        description: 'Create issue with report (vs just artifact)'
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  generate-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests jsonschema

      - name: Download recent metrics artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Create output directory
          mkdir -p .metrics-tmp

          # Calculate date cutoff (default 7 days back)
          DAYS_BACK="${{ inputs.days_back || '7' }}"
          CUTOFF_DATE=$(date -u -d "$DAYS_BACK days ago" +%Y-%m-%dT%H:%M:%SZ)

          echo "📊 Downloading metrics artifacts from last $DAYS_BACK days..."
          echo "Cutoff date: $CUTOFF_DATE"

          # Get workflow runs from metric-producing workflows.
          : > .metrics-tmp/run_ids.txt
          : > .metrics-tmp/workflow_errors.log
          for WORKFLOW_PATH in agents-auto-pilot.yml reusable-agents-verifier.yml; do
            if ! gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/${{ github.repository }}/actions/workflows/$WORKFLOW_PATH/runs" \
              -F per_page=100 -F status=completed \
              --jq ".workflow_runs[] | select(.created_at >= \"$CUTOFF_DATE\") | .id" \
              >> .metrics-tmp/run_ids.txt 2>> .metrics-tmp/workflow_errors.log; then
              echo "::warning title=LangSmith workflow lookup failed::$WORKFLOW_PATH"
            fi
          done
          sort -u .metrics-tmp/run_ids.txt -o .metrics-tmp/run_ids.txt
          RUN_COUNT=$(grep -Ec '^[0-9]+$' .metrics-tmp/run_ids.txt || true)
          echo "LANGSMITH_METRICS_RUN_COUNT=$RUN_COUNT" >> "$GITHUB_ENV"

          # Download artifacts from each run
          COUNT=0
          while IFS= read -r run_id; do
            if [ -z "$run_id" ]; then
              continue
            fi
            echo "Checking run $run_id for metrics artifacts..."

            # List artifacts for this run
            gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] |
                select(
                  (.name | startswith("autopilot-metrics-")) or
                  (.name == "agents-verifier-metrics")
                ) |
                [.name, .id] | @tsv' \
              > ".metrics-tmp/artifacts_${run_id}.json" || continue

            # Download each artifact
            while IFS=$'\t' read -r artifact_name artifact_id; do
              if [ -z "$artifact_name" ] || [ -z "$artifact_id" ]; then
                continue
              fi

              echo "  Downloading artifact: $artifact_name (ID: $artifact_id)"

              # Download artifact zip
              zip_path=".metrics-tmp/${run_id}_${artifact_id}_${artifact_name}.zip"
              gh api --method GET \
                -H "Accept: application/vnd.github+json" \
                "/repos/${{ github.repository }}/actions/artifacts/$artifact_id/zip" \
                > "$zip_path" || continue

              # Extract NDJSON from each artifact into a unique directory so
              # fixed artifact filenames from multiple runs do not overwrite.
              artifact_dir=".metrics-tmp/extracted/${run_id}_${artifact_id}"
              mkdir -p "$artifact_dir"
              unzip -q -o "$zip_path" -d "$artifact_dir" || continue
              rm "$zip_path"

              COUNT=$((COUNT + 1))
            done < ".metrics-tmp/artifacts_${run_id}.json"
          done < .metrics-tmp/run_ids.txt

          echo "✅ Downloaded $COUNT metrics artifacts"
          echo "LANGSMITH_METRICS_ARTIFACT_COUNT=$COUNT" >> "$GITHUB_ENV"

          # Combine all NDJSON files into one
          find .metrics-tmp -name "*.ndjson" -exec cat {} \; \
            > .metrics-tmp/combined-metrics.ndjson || \
            touch .metrics-tmp/combined-metrics.ndjson

          LINES=$(wc -l < .metrics-tmp/combined-metrics.ndjson)
          echo "📈 Combined metrics: $LINES total operations"
          echo "LANGSMITH_METRICS_LINE_COUNT=$LINES" >> "$GITHUB_ENV"

          cat > .metrics-tmp/diagnostics.md <<EOF
          # LangSmith Metrics Download Diagnostics

          - Days back: $DAYS_BACK
          - Cutoff date: $CUTOFF_DATE
          - Completed metric-producing runs found: $RUN_COUNT
          - Metrics artifacts downloaded: $COUNT
          - Combined NDJSON records: $LINES

          ## Workflow Lookup Errors

          \`\`\`
          $(cat .metrics-tmp/workflow_errors.log)
          \`\`\`
          EOF

      - name: Validate fleet artifacts
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REGISTRY=config/langsmith_fleet_registry.json
          mkdir -p .metrics-tmp/fleet
          # Always start from an empty combined file so repos with no artifact
          # surface as "missing" (the registry-driven rollup never skips them).
          : > .metrics-tmp/fleet/combined-fleet.ndjson

          # Enumerate (repo, artifact_name) from the registry.
          python - "$REGISTRY" > .metrics-tmp/fleet/repos.tsv <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as fh:
              registry = json.load(fh)
          for entry in registry.get("repos", []):
              repo = entry.get("repo", "")
              artifact = entry.get("artifact_name", "langsmith-fleet.ndjson")
              if repo:
                  print(f"{repo}\t{artifact}")
          PY

          # Cross-repo download is best-effort: a repo with no uploaded artifact
          # (the current fleet-wide reality — no consumer uploads one yet) is
          # treated as "missing", never as a job failure.
          while IFS=$'\t' read -r repo artifact_name; do
            [ -z "$repo" ] && continue
            echo "🔎 Resolving $artifact_name in $repo ..."
            artifact_id=$(gh api --paginate --slurp --method GET \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$repo/actions/artifacts?per_page=100" \
              --jq "[.[].artifacts[]? | select(.name == \"$artifact_name\" and .expired == false)] | sort_by(.created_at) | last | .id" \
              2>> .metrics-tmp/fleet/fleet_errors.log || echo "")
            if [ -z "$artifact_id" ] || [ "$artifact_id" = "null" ]; then
              echo "  ↪ no current artifact for $repo (missing)"
              continue
            fi
            safe_repo="${repo//\//_}"
            zip_path=".metrics-tmp/fleet/${safe_repo}.zip"
            if gh api --method GET \
              -H "Accept: application/vnd.github+json" \
              "/repos/$repo/actions/artifacts/$artifact_id/zip" \
              > "$zip_path" 2>> .metrics-tmp/fleet/fleet_errors.log; then
              extract_dir=".metrics-tmp/fleet/extracted/${safe_repo}"
              mkdir -p "$extract_dir"
              if unzip -q -o "$zip_path" -d "$extract_dir" 2>> .metrics-tmp/fleet/fleet_errors.log; then
                while IFS= read -r ndjson_file; do
                  cat "$ndjson_file" >> .metrics-tmp/fleet/combined-fleet.ndjson
                  printf '\n' >> .metrics-tmp/fleet/combined-fleet.ndjson
                done < <(find "$extract_dir" -name "*.ndjson" -print)
              else
                echo "  ↪ unzip failed for $repo (missing)"
              fi
              rm -f "$zip_path"
            else
              echo "  ↪ artifact download failed for $repo (missing)"
            fi
          done < .metrics-tmp/fleet/repos.tsv

          # Reuse the already-tested rollup. The registry drives the table, so
          # every registered repo gets a row even with zero combined records.
          python scripts/langsmith_fleet.py .metrics-tmp/fleet/combined-fleet.ndjson \
            --registry "$REGISTRY" --summary --format markdown \
            > .metrics-tmp/fleet/fleet-status.md
          python scripts/langsmith_fleet.py .metrics-tmp/fleet/combined-fleet.ndjson \
            --registry "$REGISTRY" --summary --format json \
            > .metrics-tmp/fleet/fleet-status.json

          echo "FLEET_STATUS_AVAILABLE=true" >> "$GITHUB_ENV"

          # Warning-only (mirrors the existing "::warning" precedent in this
          # workflow): never hard-fail the dashboard on incomplete adoption.
          read -r INVALID MISSING < <(python - <<'PY'
          import json

          with open(".metrics-tmp/fleet/fleet-status.json", encoding="utf-8") as fh:
              counts = json.load(fh).get("status_counts", {})
          print(counts.get("invalid", 0), counts.get("missing", 0))
          PY
          )
          echo "LANGSMITH_FLEET_INVALID=${INVALID:-0}" >> "$GITHUB_ENV"
          echo "LANGSMITH_FLEET_MISSING=${MISSING:-0}" >> "$GITHUB_ENV"
          if [ "${INVALID:-0}" != "0" ] || [ "${MISSING:-0}" != "0" ]; then
            echo "::warning title=LangSmith fleet artifacts incomplete::invalid=${INVALID:-0} missing=${MISSING:-0} (see LangSmith Fleet Artifact Status table)"
          fi

      - name: Generate metrics report
        run: |
          : > .metrics-tmp/report.md
          METRICS_AVAILABLE=false
          if [ -f .metrics-tmp/combined-metrics.ndjson ] && \
             [ -s .metrics-tmp/combined-metrics.ndjson ]; then
            METRICS_AVAILABLE=true

            # Generate markdown report
            python scripts/aggregate_metrics.py \
              --metrics-file .metrics-tmp/combined-metrics.ndjson \
              --output-format markdown \
              >> .metrics-tmp/report.md

            # Generate JSON summary
            python scripts/aggregate_metrics.py \
              --metrics-file .metrics-tmp/combined-metrics.ndjson \
              --output-format json \
              > .metrics-tmp/summary.json

            echo "✅ Generated trace-coverage report"
          else
            echo "⚠️ No autopilot/verifier trace metrics found for this period"
            {
              echo "## LangSmith Trace Coverage"
              echo ""
              echo "_No autopilot/verifier trace metrics were found for this period._"
            } >> .metrics-tmp/report.md
          fi

          # Always append the fleet artifact status section so the dashboard
          # surfaces adoption/freshness even when no trace metrics exist.
          if [ -f .metrics-tmp/fleet/fleet-status.md ]; then
            {
              echo ""
              echo "---"
              echo ""
              cat .metrics-tmp/fleet/fleet-status.md
            } >> .metrics-tmp/report.md
            echo "✅ Appended LangSmith fleet artifact status"
          fi

          # The dashboard is publishable when either data source produced content.
          if [ "$METRICS_AVAILABLE" = "true" ] || \
             [ -f .metrics-tmp/fleet/fleet-status.md ]; then
            echo "REPORT_AVAILABLE=true" >> "$GITHUB_ENV"
          else
            echo "REPORT_AVAILABLE=false" >> "$GITHUB_ENV"
          fi

      - name: Upload dashboard diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: langsmith-metrics-diagnostics-${{ github.run_id }}
          path: |
            .metrics-tmp/diagnostics.md
            .metrics-tmp/workflow_errors.log
            .metrics-tmp/run_ids.txt
            .metrics-tmp/combined-metrics.ndjson
            .metrics-tmp/fleet/fleet-status.md
            .metrics-tmp/fleet/fleet-status.json
            .metrics-tmp/fleet/fleet_errors.log
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload report artifact
        if: env.REPORT_AVAILABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: langsmith-metrics-report-${{ github.run_id }}
          path: |
            .metrics-tmp/report.md
            .metrics-tmp/summary.json
            .metrics-tmp/combined-metrics.ndjson
            .metrics-tmp/fleet/fleet-status.md
            .metrics-tmp/fleet/fleet-status.json
          if-no-files-found: ignore
          retention-days: 90

      - name: Create dashboard issue
        if: >
          env.REPORT_AVAILABLE == 'true' &&
          (github.event_name == 'schedule' || inputs.create_issue == true)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read report
          REPORT=$(cat .metrics-tmp/report.md)

          # Get date range
          DAYS_BACK="${{ inputs.days_back || '7' }}"
          START_DATE=$(date -u -d "$DAYS_BACK days ago" +%Y-%m-%d)
          END_DATE=$(date -u +%Y-%m-%d)

          # Create issue body
          cat > .metrics-tmp/issue-body.md <<EOF
          # LangSmith Trace Coverage Report

          **Period:** $START_DATE to $END_DATE
          **Generated:** $(date -u +"%Y-%m-%d %H:%M UTC")
          **Workflow Run:** [#${{ github.run_id }}](
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

          ---

          $REPORT

          ---

          ## About This Report

          This automated report tracks LangSmith trace coverage across all LLM
          operations in the repository. Trace IDs allow us to:
          - Debug LLM calls via the LangSmith dashboard
          - Analyze model performance and costs
          - Correlate issues with specific inference runs

          **Target Coverage:** 90%+

          **Related Documentation:**
          - [LangSmith Integration Status](../blob/main/docs/LANGSMITH_INTEGRATION_STATUS.md)
          - [E2E Validation Report](../blob/main/docs/LANGSMITH_E2E_VALIDATION.md)
          - [Integration Skill](../blob/main/.claude/skills/langsmith-integration/skill.md)

          ---

          <sub>This report is generated automatically every Monday. To regenerate
          manually, trigger the [LangSmith Metrics Dashboard workflow](
          ../actions/workflows/maint-80-langsmith-metrics-dashboard.yml).</sub>
          EOF

          # Create issue
          gh issue create \
            --title "📊 LangSmith Trace Coverage Report - Week of $START_DATE" \
            --body-file .metrics-tmp/issue-body.md \
            --label "metrics,langsmith,automated"

      - name: Update dashboard file
        if: env.REPORT_AVAILABLE == 'true'
        run: |
          # Create/update dashboard markdown file
          mkdir -p docs/dashboards

          cat > docs/dashboards/langsmith-metrics.md <<EOF
          # LangSmith Metrics Dashboard

          > **Last Updated:** $(date -u +"%Y-%m-%d %H:%M UTC")
          > **Period:** Last ${{ inputs.days_back || '7' }} days

          ---

          $(cat .metrics-tmp/report.md)

          ---

          ## How to Read This Dashboard

          ### Overall Trace Coverage

          The **trace coverage percentage** indicates what portion of LLM
          operations successfully captured a LangSmith trace ID.

          - ✅ **90%+** - Excellent coverage
          - ⚠️ **70-89%** - Good, but investigate gaps
          - ❌ **<70%** - Action required

          ### Coverage by Operation Type

          Different operation types (from \`metric_type\` field):
          - **step** - Autopilot pipeline steps (format, optimize, etc.)
          - **evaluation** - PR verification evaluations
          - **generation** - Issue/followup generation

          ### Coverage by Autopilot Step

          Traces grouped by \`step_name\` for autopilot operations.

          ---

          ## Accessing Traces

          1. **In PR comments:** Look for "🔍 LangSmith Trace" section in verifier reports
          2. **In workflow logs:** Check for GitHub notices titled "LangSmith Trace"
          3. **In LangSmith UI:** Visit [https://smith.langchain.com](https://smith.langchain.com)

          ---

          ## Related Links

          - [Integration Status](../LANGSMITH_INTEGRATION_STATUS.md)
          - [E2E Validation](../LANGSMITH_E2E_VALIDATION.md)
          - [Integration Skill](../../.claude/skills/langsmith-integration/skill.md)
          - [Weekly Reports (Issues)](../../issues?q=is%3Aissue+label%3Alangsmith+label%3Ametrics)

          EOF

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/dashboards/langsmith-metrics.md

          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Update LangSmith metrics dashboard

          Automated update from workflow run ${{ github.run_id }}
          Period: Last ${{ inputs.days_back || '7' }} days"

            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Updated docs/dashboards/langsmith-metrics.md"
          fi

      - name: Summary
        if: always()
        run: |
          if [ "$REPORT_AVAILABLE" == "true" ]; then
            echo "✅ LangSmith metrics dashboard generated successfully"
            echo ""
            echo "📊 Report locations:"
            echo "  - Artifact: langsmith-metrics-report-${{ github.run_id }}"
            echo "  - Dashboard file: docs/dashboards/langsmith-metrics.md"
            if [ "${{ github.event_name }}" == "schedule" ] || \
               [ "${{ inputs.create_issue }}" == "true" ]; then
              echo "  - Issue: Created with label 'langsmith,metrics'"
            fi
          else
            echo "⚠️ No metrics data available for the specified period"
            echo ""
            echo "Diagnostics:"
            echo "  - Completed runs found: ${LANGSMITH_METRICS_RUN_COUNT:-0}"
            echo "  - Metrics artifacts downloaded: ${LANGSMITH_METRICS_ARTIFACT_COUNT:-0}"
            echo "  - Combined NDJSON records: ${LANGSMITH_METRICS_LINE_COUNT:-0}"
            echo "  - Artifact: langsmith-metrics-diagnostics-${{ github.run_id }}"
            echo ""
            if [ "${LANGSMITH_METRICS_RUN_COUNT:-0}" != "0" ] && \
               [ "${LANGSMITH_METRICS_ARTIFACT_COUNT:-0}" = "0" ]; then
              echo "::warning title=Missing metrics artifacts::Runs found; no artifacts."
            fi
          fi
