name: Maint 47 Disable Legacy Workflows

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Set to true to preview without disabling"
        type: choice
        options: ["false", "true"]
        default: "false"
      extra_allowlist:
        description: "Comma-separated additional workflow names or filenames to keep"
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disable:
    name: Disable legacy workflows
    runs-on: ubuntu-latest
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Disable retired workflows
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXTRA_ALLOWLIST: ${{ inputs.extra_allowlist }}
        run: |
          python tools/disable_legacy_workflows.py
