name: Fix Integration Tests Formatting

# Manual workflow to fix formatting issues in the Integration-Tests repository
# This is triggered manually when Integration CI fails due to format issues

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the fix'
        required: false
        default: 'fix: Auto-format files to meet lint standards'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-formatting:
    name: Apply formatting fixes
    runs-on: ubuntu-latest
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app_token.outputs.token || github.token }}
          token: ${{ steps.app_token.outputs.token || github.token }}
      - name: Export load-balancer tokens
        uses: ./.github/actions/setup-api-client
      - name: Resolve integration repo default branch
        id: integration_ref
        uses: actions/github-script@v8
        with:
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-70-fix-integration-formatting',
              capabilities: ['contents:read']
            });
            const { data } = await withRetry((client) => client.rest.repos.get({
              owner: 'stranske',
              repo: 'Workflows-Integration-Tests'
            }));
            if (!data?.default_branch) {
              core.setFailed('Could not determine integration repo default branch');
              return;
            }
            core.setOutput('ref', data.default_branch);
          github-token: ${{ steps.app_token.outputs.token || github.token }}
      - name: Checkout Integration-Tests repo
        uses: actions/checkout@v6
        with:
          repository: stranske/Workflows-Integration-Tests
          ref: ${{ steps.integration_ref.outputs.ref }}
          token: ${{ steps.app_token.outputs.token || github.token }}
          token: ${{ steps.app_token.outputs.token || github.token }}
          path: integration-tests

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install formatting tools
        run: |
          python3 -m pip install black ruff

      - name: Apply formatting fixes
        run: |
          cd integration-tests
          echo "Running black on Python files (using pyproject.toml config)..."
          # Black will use line-length=100 from pyproject.toml
          black --exclude '\.workflows-lib' . || true

          echo "Running ruff fixes..."
          ruff check --fix --exclude '.workflows-lib' . || true

      - name: Check for changes
        id: changes
        run: |
          cd integration-tests
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ No formatting changes needed"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "📝 Formatting changes detected:"
            git --no-pager diff --stat
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd integration-tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "${{ inputs.commit_message }}" \
            -m "" \
            -m "Applied by: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git push

      - name: Summary
        run: |
          cd integration-tests
          {
            echo "## Integration Tests Formatting Fix"
            echo ""
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "✅ Formatting fixes applied and pushed"
              echo ""
              echo "### Changes Made"
              echo "\`\`\`"
              git --no-pager log -1 --stat
              echo "\`\`\`"
            else
              echo "✅ No formatting changes were needed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
