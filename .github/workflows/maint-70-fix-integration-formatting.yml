name: Fix Integration Tests Formatting

# Manual workflow to fix formatting issues in the Integration-Tests repository
# This is triggered manually when Integration CI fails due to format issues

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: 'Commit message for the fix'
        required: false
        default: 'fix: Auto-format files to meet lint standards'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-formatting:
    name: Apply formatting fixes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Export load-balancer tokens
        uses: ./.github/actions/setup-api-client
      - name: Prepare integration repo token
        id: integration_token
        env:
          OWNER_PAT: ${{ secrets.OWNER_PR_PAT }}
          SERVICE_PAT: ${{ secrets.SERVICE_BOT_PAT }}
        run: |
          if [ -n "${OWNER_PAT}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "SYNC_TOKEN=${OWNER_PAT}" >> "$GITHUB_ENV"
          elif [ -n "${SERVICE_PAT}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "SYNC_TOKEN=${SERVICE_PAT}" >> "$GITHUB_ENV"
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: No integration repo token available; skipping sync steps."
          fi

      - name: Resolve integration repo default branch
        id: integration_ref
        uses: actions/github-script@v9
        with:
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-70-fix-integration-formatting',
              capabilities: ['contents:read']
            });
            const { data } = await withRetry((client) => client.rest.repos.get({
              owner: 'stranske',
              repo: 'Workflows-Integration-Tests'
            }));
            if (!data?.default_branch) {
              core.setFailed('Could not determine integration repo default branch');
              return;
            }
            core.setOutput('ref', data.default_branch);
          github-token: ${{ github.token }}
      - name: Checkout Integration-Tests repo
        if: steps.integration_token.outputs.token_available == 'true'
        uses: actions/checkout@v7
        with:
          repository: stranske/Workflows-Integration-Tests
          ref: ${{ steps.integration_ref.outputs.ref }}
          token: ${{ env.SYNC_TOKEN }}
          path: integration-tests

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install formatting tools
        run: |
          python3 -m pip install black ruff

      - name: Apply formatting fixes
        id: formatting
        if: steps.integration_token.outputs.token_available == 'true'
        run: |
          set -euo pipefail
          cd integration-tests
          echo "Running black on Python files (using pyproject.toml config)..."
          # Black will use line-length=100 from pyproject.toml
          black --exclude '\.workflows-lib' .

          echo "Running ruff fixes..."
          diagnostics=$(mktemp)
          trap 'rm -f "$diagnostics"' EXIT
          ruff_status=0
          ruff check --fix --output-format json --exclude '.workflows-lib' . > "$diagnostics" || ruff_status=$?
          if [ "$ruff_status" -gt 1 ]; then
            echo "::error::Ruff did not complete (exit $ruff_status)."
            exit "$ruff_status"
          fi
          if [ "$ruff_status" -eq 1 ]; then
            python3 - "$diagnostics" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          try:
              diagnostics = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, ValueError):
              diagnostics = None

          # Exit 1 also covers syntax diagnostics. Accept only ordinary lint rules.
          if not isinstance(diagnostics, list) or not diagnostics or any(
              not isinstance(item, dict)
              or not isinstance(code := item.get("code"), str)
              or not re.fullmatch(r"[A-Z]+[0-9]+", code)
              or code in {"E902", "E999"}
              for item in diagnostics
          ):
              sys.exit("::error::Ruff reported incomplete formatting or unreadable diagnostics.")
          codes = ", ".join(sorted({item["code"] for item in diagnostics}))
          print(f"::warning::Ruff completed with remaining lint diagnostics: {codes}.")
          PY
          fi

      - name: Check for changes
        if: steps.integration_token.outputs.token_available == 'true'
        id: changes
        run: |
          cd integration-tests
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "✅ No formatting changes needed"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "📝 Formatting changes detected:"
            git --no-pager diff --stat
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
        run: |
          cd integration-tests
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          git add -A
          git commit -m "$COMMIT_MESSAGE" \
            -m "" \
            -m "Applied by: ${run_url}"

          git push

      - name: Summarize incomplete formatting
        if: failure() && steps.formatting.outcome == 'failure'
        run: |
          {
            echo "## Integration Tests Formatting Fix"
            echo ""
            echo "Formatting did not complete. No changes were pushed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        run: |
          if [ "${{ steps.integration_token.outputs.token_available }}" != "true" ]; then
            {
              echo "## Integration Tests Formatting Fix"
              echo ""
              echo "⚠️ Skipped: no integration repo token available."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd integration-tests
          {
            echo "## Integration Tests Formatting Fix"
            echo ""
            if [ "${{ steps.changes.outputs.has_changes }}" = "true" ]; then
              echo "✅ Formatting fixes applied and pushed"
              echo ""
              echo "### Changes Made"
              echo "\`\`\`"
              git --no-pager log -1 --stat
              echo "\`\`\`"
            else
              echo "✅ No formatting changes were needed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
