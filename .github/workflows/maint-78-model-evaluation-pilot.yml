name: Maint 78 Model Evaluation Pilot

on:
  workflow_dispatch: {}
  # Auto-run when the catalog changes so a newly-current model is piloted without
  # anyone editing the candidate list (stranske/Workflows#2819, move 1).
  push:
    branches: [main]
    paths:
      - config/model_registry.json
      - config/model_eval_candidates.json
  # Weekly safety net in case a catalog change landed via a path the push filter missed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pull-requests: read
  models: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Refresh candidates from the registry
        # Derive the candidate set from the current catalog so the pilot always
        # tests every now-current model, even if the committed file lagged.
        run: python -m tools.refresh_model_eval_candidates --write
      - name: Run paired 30-case pilot
        env:
          # Cross-repo read token; github.token is scoped to Workflows only.
          GH_TOKEN: ${{ secrets.OWNER_PR_PAT }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_STRANSKE: ${{ secrets.CLAUDE_API_STRANSKE }}
        run: |
          uv run --extra dev --extra langchain \
            python -m tools.run_model_eval_pilot --output pilot-results.json
      - name: Summarize pilot
        if: always()
        run: |
          if [ ! -f pilot-results.json ]; then
            echo '## Verifier model pilot' >> "$GITHUB_STEP_SUMMARY"
            echo 'The pilot failed before producing a results artifact; inspect the run step.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Verifier model pilot'
            echo 'The pilot narrows candidates only; approval still requires the 75-case corpus.'
            echo '```json'
            jq '{schema, corpus_version, rows:(.results|length),
              errors:([.results[]|select(.schema_valid == false)]|length),
              category_report:.summary.candidates}' \
              pilot-results.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: verifier-model-pilot-${{ github.run_id }}
          path: |
            pilot-results.json
            pilot-preflight.json
          if-no-files-found: warn
