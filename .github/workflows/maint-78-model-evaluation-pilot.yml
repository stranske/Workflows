name: Maint 78 Verifier Model Cost and Quality
run-name: MAINT-78 ${{ inputs.mode || 'plan' }} source ${{ inputs.candidates_source_run_id || 'repository' }}

on:
  workflow_dispatch:
    inputs:
      candidates_source_run_id:
        description: MAINT-77 run id containing newly discovered candidates.
        required: false
        type: string
      mode:
        description: Plan/capture are free; screen uses subscription; confirm and source-held verify-paired use capped APIs.
        type: choice
        options: [plan, capture, screen, confirm, verify-paired]
        default: plan
      capture_targets:
        description: Capture mode only; 1-8 comma-separated owner/repo#PR entries, no model calls.
        required: false
        type: string
      screen_source_run_id:
        description: Required for confirm; completed MAINT-78 screen run id with paired case IDs.
        required: false
        type: string
      api_only_candidate:
        description: Optional explicit API-only model absent from the pinned CLI; confirm mode only.
        required: false
        type: string
      models:
        description: Comma-separated priced OpenAI models for the 8-case CLI screen (maximum four).
        type: string
        default: gpt-5.6-terra,gpt-6-luna,gpt-6.1-sol
  push:
    branches: [main]
    paths:
      - config/model_registry.json
      - config/model_eval_candidates.json
      - config/model_eval_pilot.json
      - config/model_selection_policy.json
      - tools/plan_model_eval.py
      - tools/run_model_eval_cli_screen.py

permissions:
  contents: read
  pull-requests: read
  actions: read

concurrency:
  group: maint-78-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assess:
    if: inputs.mode != 'verify-paired'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download MAINT-77 pilot candidates
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.candidates_source_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: maint-77-pilot-candidates
          run-id: ${{ inputs.candidates_source_run_id }}
          github-token: ${{ github.token }}
          path: config
      - name: Refresh candidates from the registry
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.candidates_source_run_id == ''
        run: python -m tools.refresh_model_eval_candidates --write
      - name: Set up Node for pinned CLI catalog
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install pinned Codex CLI
        run: |
          set -euo pipefail
          npm ci --prefix .github/actions/maint78-codex-cli --ignore-scripts
          echo "$(pwd)/.github/actions/maint78-codex-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Read pinned CLI catalog without model calls
        run: codex debug models --bundled > cli-catalog.json
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Publish no-spend readiness report
        run: >-
          uv run --extra dev --extra langchain python -m tools.plan_model_eval
          --output model-eval-plan.json
          --cli-catalog cli-catalog.json --summary "$GITHUB_STEP_SUMMARY"
      - name: Capture production verifier inputs without model calls
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'capture'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CAPTURE_TARGETS: ${{ inputs.capture_targets }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { captureModelEvalInputs } = require('./tools/capture_model_eval_inputs.js');
            await captureModelEvalInputs({
              github, context, core, targets: process.env.CAPTURE_TARGETS,
            });
      - name: Download completed CLI screen for API confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'confirm'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: maint-78-decision-readiness-${{ inputs.screen_source_run_id }}
          run-id: ${{ inputs.screen_source_run_id }}
          github-token: ${{ github.token }}
          path: prior-screen
      - name: Configure isolated Codex subscription auth
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'screen'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo '::error::CODEX_AUTH_JSON is required for the subscription screen.'
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/maint78-codex-home"
          printf '%s' "$CODEX_AUTH_JSON" > "$RUNNER_TEMP/maint78-codex-home/auth.json"
          chmod 600 "$RUNNER_TEMP/maint78-codex-home/auth.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "maint78-codex-home/auth.json"
          auth = json.loads(path.read_text())
          if auth.get("auth_mode") != "chatgpt" or auth.get("OPENAI_API_KEY"):
              raise SystemExit(
                  "MAINT-78 screen requires ChatGPT subscription auth, not API-key billing"
              )
          PY
      - name: Run bounded Codex CLI screen
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'screen'
        env:
          CODEX_HOME: ${{ runner.temp }}/maint78-codex-home
          SCREEN_MODELS: ${{ inputs.models }}
        run: |
          uv run --extra dev --extra langchain \
            python -m tools.run_model_eval_cli_screen \
            --models "$SCREEN_MODELS" \
            --output cli-screen-results.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - name: Run capped paired API confirmation
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'confirm'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_ONLY_CANDIDATE: ${{ inputs.api_only_candidate }}
          SCREEN_SOURCE_RUN_ID: ${{ inputs.screen_source_run_id }}
        run: |
          set -euo pipefail
          if [ -z "$SCREEN_SOURCE_RUN_ID" ]; then
            echo '::error::screen_source_run_id is required for confirm mode.'
            exit 1
          fi
          uv run --extra dev --extra langchain \
            python -m tools.run_model_eval_api_confirm \
            --screen prior-screen/cli-screen-results.json \
            --cli-catalog cli-catalog.json \
            --api-only-candidate "$API_ONLY_CANDIDATE" \
            --output api-confirmation-results.json \
            --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          retention-days: 30
          name: maint-78-decision-readiness-${{ github.run_id }}
          path: |
            model-eval-plan.json
            cli-screen-results.json
            api-confirmation-results.json
            captured-inputs/**/verifier-context.md
            captured-inputs/**/verifier-diff-summary.md
            captured-inputs/**/verifier-pr-diff.patch
            captured-inputs/**/verifier-input-manifest.json
          if-no-files-found: warn

  verify-paired:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.mode == 'verify-paired' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install the existing frozen Python requirements
        run: |
          source .github/workflows/ci-python-versions.env
          uv venv --python "$CI_PYTHON_VERSION" "$RUNNER_TEMP/verify-paired-venv"
          uv pip sync --python "$RUNNER_TEMP/verify-paired-venv/bin/python" requirements.lock
      - name: Run fixed public paired Verify screen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_STRANSKE: ${{ secrets.CLAUDE_API_STRANSKE }}
        run: >-
          timeout --signal=KILL 600s "$RUNNER_TEMP/verify-paired-venv/bin/python"
          -m tools.run_verify_paired --execute
      - name: Retain paired Verify evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maint-78-verify-paired-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verify-paired
          include-hidden-files: false
          retention-days: 7
          if-no-files-found: error
