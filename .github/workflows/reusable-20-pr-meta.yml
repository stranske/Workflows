# Reusable PR Meta workflow for consumer repos
# Updates the PR body sections (pr_body_update). Scripts are fetched from stranske/Workflows -
# no local scripts needed in consumer repo.
#
# The keepalive comment lane (keepalive_dispatch / keepalive_orchestrator / keepalive_from_gate)
# was removed 2026-11-28 (cohesion round 2, D2): it sent a `codex-pr-comment-command`
# repository_dispatch that no consumer workflow listens for (only the Workflows-local
# agents-keepalive-dispatch-handler.yml does). Consumer keepalive runs from agents-81 on Gate
# completion, label events and the hourly sweep. The keepalive inputs below stay accepted so
# existing callers keep validating; they are ignored.
name: Reusable 20 PR Meta

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      comment_id:
        description: 'Comment ID that triggered the workflow (for issue_comment events)'
        required: false
        type: string
        default: ''
      comment_body:
        description: 'Comment body (for issue_comment events)'
        required: false
        type: string
        default: ''
      event_name:
        description: 'GitHub event name (issue_comment, pull_request, workflow_run)'
        required: true
        type: string
      event_action:
        description: 'GitHub event action'
        required: false
        type: string
        default: ''
      allowed_keepalive_logins:
        description: 'Logins allowed to trigger keepalive (ignored; kept for callers)'
        required: false
        type: string
        default: 'stranske'
      keepalive_marker:
        description: 'Keepalive comment marker (ignored; kept for callers)'
        required: false
        type: string
        default: '<!-- codex-keepalive-marker -->'
      dry_run:
        description: 'Preview mode - no write operations'
        required: false
        type: boolean
        default: false
      allow_replay:
        description: 'Gate replay of keepalive comments (ignored; kept for callers)'
        required: false
        type: boolean
        default: false
    secrets:
      service_bot_pat:
        description: 'PAT for service bot operations (stranske-automation-bot)'
        required: false
      ACTIONS_BOT_PAT:
        description: 'PAT for dispatching workflows'
        required: false
      AGENTS_AUTOMATION_PAT:
        description: 'PAT for agent automation'
        required: false
      WORKFLOWS_APP_ID:
        description: 'GitHub App ID for minting installation tokens'
        required: false
      WORKFLOWS_APP_PRIVATE_KEY:
        description: 'GitHub App private key for minting installation tokens'
        required: false
      TOKEN_ROTATION_JSON:
        description: 'Token rotation JSON payload'
        required: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr_body_update:
    name: Update PR body sections
    runs-on: ubuntu-latest
    # The existing renderer writes directly, so stop manual previews before the job.
    if: >-
      inputs.event_name == 'pull_request' ||
      (inputs.event_name == 'workflow_dispatch' &&
       github.event_name == 'workflow_dispatch' &&
       github.event.inputs.handler == 'pr-meta' &&
       inputs.dry_run == false &&
       github.event.inputs.dry_run != 'true')
    steps:
      - name: Checkout Workflows scripts
        uses: actions/checkout@v7
        with:
          repository: stranske/Workflows
          ref: main
          sparse-checkout: |
            .github/scripts
            .github/actions/setup-api-client
            scripts/runner_lib/acceptance_gate.py
          sparse-checkout-cone-mode: false
          path: workflows-lib
          token: >-
            ${{
              secrets.ACTIONS_BOT_PAT ||
              secrets.service_bot_pat ||
              github.token
            }}
          fetch-depth: 1

      - name: Set scripts path
        run: |
          echo "WORKFLOWS_SCRIPTS_PATH=${GITHUB_WORKSPACE}/workflows-lib" >> "$GITHUB_ENV"

      - name: Setup API client
        uses: ./workflows-lib/.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.service_bot_pat }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          install_dir: ${{ github.workspace }}/workflows-lib/.github/scripts

      - name: Upsert PR body sections
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { run } = require(`${scriptsPath}/.github/scripts/agents_pr_meta_update_body.js`);
            await run({
              github, context, core,
              inputs: {
                pr_number: process.env.PR_NUMBER,
                dry_run: process.env.DRY_RUN === 'true',
              },
            });
