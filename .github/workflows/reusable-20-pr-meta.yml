# Reusable PR Meta workflow for consumer repos
# Provides keepalive detection and dispatch functionality using dual checkout pattern
# Scripts are fetched from stranske/Workflows - no local scripts needed in consumer repo
name: Reusable 20 PR Meta

on:
  workflow_call:
    inputs:
      pr_number:
        description: 'Pull request number'
        required: true
        type: number
      comment_id:
        description: 'Comment ID that triggered the workflow (for issue_comment events)'
        required: false
        type: string
        default: ''
      comment_body:
        description: 'Comment body (for issue_comment events)'
        required: false
        type: string
        default: ''
      event_name:
        description: 'GitHub event name (issue_comment, pull_request, workflow_run)'
        required: true
        type: string
      event_action:
        description: 'GitHub event action'
        required: false
        type: string
        default: ''
      allowed_keepalive_logins:
        description: 'Comma-separated list of logins allowed to trigger keepalive'
        required: false
        type: string
        default: 'stranske'
      keepalive_marker:
        description: 'HTML comment marker that identifies keepalive comments'
        required: false
        type: string
        default: '<!-- codex-keepalive-marker -->'
      dry_run:
        description: 'Preview mode - no write operations'
        required: false
        type: boolean
        default: false
      allow_replay:
        description: 'Enable replay mode for workflow_run triggers (re-evaluates keepalive after Gate completes)'
        required: false
        type: boolean
        default: false
    secrets:
      service_bot_pat:
        description: 'PAT for service bot operations (stranske-automation-bot)'
        required: false
      ACTIONS_BOT_PAT:
        description: 'PAT for dispatching workflows'
        required: false
      AGENTS_AUTOMATION_PAT:
        description: 'PAT for agent automation'
        required: false
      WORKFLOWS_APP_ID:
        description: 'GitHub App ID for minting installation tokens'
        required: false
      WORKFLOWS_APP_PRIVATE_KEY:
        description: 'GitHub App private key for minting installation tokens'
        required: false
      TOKEN_ROTATION_JSON:
        description: 'Token rotation JSON payload'
        required: false
    outputs:
      keepalive_detected:
        description: 'Whether a keepalive comment was detected'
        value: ${{ jobs.keepalive_dispatch.outputs.dispatch }}
      keepalive_reason:
        description: 'Reason for keepalive dispatch decision'
        value: ${{ jobs.keepalive_dispatch.outputs.reason }}

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  keepalive_dispatch:
    name: Detect keepalive comments
    runs-on: ubuntu-latest
    if: inputs.event_name == 'issue_comment' && inputs.event_action == 'created'
    outputs:
      dispatch: ${{ steps.detect.outputs.dispatch }}
      reason: ${{ steps.detect.outputs.reason || steps.pre_gate.outputs.reason }}
      issue: ${{ steps.detect.outputs.issue }}
      round: ${{ steps.detect.outputs.round }}
      branch: ${{ steps.detect.outputs.branch }}
      base: ${{ steps.detect.outputs.base }}
      trace: ${{ steps.detect.outputs.trace }}
      pr: ${{ steps.detect.outputs.pr }}
      author: ${{ steps.detect.outputs.author }}
      comment_id: ${{ steps.detect.outputs.comment_id }}
      comment_url: ${{ steps.detect.outputs.comment_url }}
      instruction_body: ${{ steps.detect.outputs.instruction_body }}
      gate_ok: ${{ steps.pre_gate.outputs.ok }}
      agent_alias: ${{ steps.pre_gate.outputs.agent_alias }}
      head_sha: ${{ steps.pre_gate.outputs.head_sha }}
    steps:
      # Mint GitHub App token early to use for checkouts (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        if: inputs.event_name == 'pull_request' && secrets.WORKFLOWS_APP_ID != ''
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      # Dual checkout pattern: consumer repo for context, Workflows repo for scripts
      - name: Checkout consumer repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          path: consumer
          token: ${{ steps.app_token.outputs.token || secrets.ACTIONS_BOT_PAT || secrets.service_bot_pat || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Setup API client
        uses: ./consumer/.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Resolve Workflows default branch
        id: workflows_ref
        uses: actions/github-script@v8
        with:
          script: |
            const payloadDefault = context.payload?.repository?.default_branch;
            if (payloadDefault) {
              core.setOutput('ref', payloadDefault);
              return;
            }

            const { createTokenAwareRetry } = require(
              './consumer/.github/scripts/github-api-with-retry.js'
            );

            const { withRetry, github: retryGithub } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'pr-meta-workflows-ref',
              capabilities: ['read-repo'],
            });

            const client = retryGithub || github;
            try {
              const { data } = await withRetry((octokit) =>
                octokit.rest.repos.get({ owner: 'stranske', repo: 'Workflows' })
              );
              if (data?.default_branch) {
                core.setOutput('ref', data.default_branch);
                return;
              }
            } catch (error) {
              core.warning(`Failed to resolve Workflows default branch: ${error.message}`);
            }

            core.warning('Falling back to Workflows ref "main".');
            core.setOutput('ref', 'main');

      - name: Checkout Workflows scripts
        uses: actions/checkout@v6
        with:
          repository: stranske/Workflows
          ref: main
          sparse-checkout: |
            scripts
            .github/scripts
          sparse-checkout-cone-mode: false
          path: workflows-lib
          fetch-depth: 1
          token: ${{ steps.app_token.outputs.token || secrets.ACTIONS_BOT_PAT || secrets.service_bot_pat || github.token }}

      - name: Set scripts path
        run: |
          echo "WORKFLOWS_SCRIPTS_PATH=${GITHUB_WORKSPACE}/workflows-lib" >> "$GITHUB_ENV"
          echo "CONSUMER_PATH=${GITHUB_WORKSPACE}/consumer" >> "$GITHUB_ENV"

      - name: Evaluate keepalive pre-gate
        id: pre_gate
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
        with:
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { evaluateKeepaliveGate } = require(`${scriptsPath}/.github/scripts/keepalive_gate.js`);
            const result = await evaluateKeepaliveGate({
              core, github, context,
              options: {
                prNumber: Number(process.env.PR_NUMBER || 0),
                comments: process.env.COMMENT_BODY ? [{
                  id: Number(process.env.COMMENT_ID || 0),
                  body: process.env.COMMENT_BODY
                }] : [],
                requireHumanActivation: true,
                requireGateSuccess: true,
              },
            });
            const bool = (v) => (v ? 'true' : 'false');
            core.setOutput('ok', bool(result.ok));
            core.setOutput('reason', result.reason || '');
            core.setOutput('agent_alias', result.primaryAgent || '');
            core.setOutput('head_sha', result.headSha || '');
            core.setOutput('run_cap', String(result.runCap ?? ''));
            core.setOutput('active_runs', String(result.activeRuns ?? ''));

      - name: Evaluate keepalive comment
        id: detect
        uses: actions/github-script@v8
        env:
          ALLOWED_LOGINS: ${{ inputs.allowed_keepalive_logins }}
          KEEPALIVE_MARKER: ${{ inputs.keepalive_marker }}
          GATE_OK: ${{ steps.pre_gate.outputs.ok || 'false' }}
          GATE_REASON: ${{ steps.pre_gate.outputs.reason || '' }}
          PR_NUMBER: ${{ inputs.pr_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          ALLOW_REPLAY: ${{ inputs.allow_replay }}
        with:
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { detectKeepalive } = require(`${scriptsPath}/.github/scripts/agents_pr_meta_keepalive.js`);
            await detectKeepalive({ core, github, context, env: process.env });

      - name: Write keepalive dispatch summary (comment lane)
        if: always()
        run: |
          bash "${GITHUB_WORKSPACE}/workflows-lib/.github/scripts/write_dispatch_summary.sh"
        env:
          PATH_LABEL: comment
          DISPATCH: ${{ steps.detect.outputs.dispatch || 'false' }}
          DISPATCH_REASON: ${{ steps.detect.outputs.reason || steps.pre_gate.outputs.reason || '' }}
          PR_NUMBER: ${{ steps.detect.outputs.pr || inputs.pr_number || '' }}
          FALLBACK_PR: ${{ inputs.pr_number || '' }}
          ACTIVATION_ID: ${{ steps.detect.outputs.comment_id || inputs.comment_id || '' }}
          DISPATCH_AGENT: ${{ steps.pre_gate.outputs.agent_alias || '' }}
          HEAD_SHA: ${{ steps.pre_gate.outputs.head_sha || '' }}
          RUN_CAP: ${{ steps.pre_gate.outputs.run_cap || '' }}
          ACTIVE_RUNS: ${{ steps.pre_gate.outputs.active_runs || '' }}
          TRACE: ${{ steps.detect.outputs.trace || '' }}

  keepalive_orchestrator:
    needs: keepalive_dispatch
    if: needs.keepalive_dispatch.outputs.dispatch == 'true'
    name: Dispatch keepalive orchestrator
    runs-on: ubuntu-latest
    env:
      SERVICE_BOT_PAT: ${{ secrets.service_bot_pat || '' }}
      ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT || '' }}
      AGENTS_AUTOMATION_PAT: ${{ secrets.AGENTS_AUTOMATION_PAT || '' }}
    steps:
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        if: secrets.WORKFLOWS_APP_ID != ''
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Workflows scripts
        uses: actions/checkout@v6
        with:
          repository: stranske/Workflows
          ref: main
          sparse-checkout: |
            .github/scripts
            .github/actions/setup-api-client
          sparse-checkout-cone-mode: false
          path: workflows-lib
          token: ${{ steps.app_token.outputs.token || secrets.ACTIONS_BOT_PAT || secrets.service_bot_pat || github.token }}
          fetch-depth: 1

      - name: Set scripts path
        run: |
          echo "WORKFLOWS_SCRIPTS_PATH=${GITHUB_WORKSPACE}/workflows-lib" >> "$GITHUB_ENV"

      - name: Setup API client
        uses: ./workflows-lib/.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Mint GitHub App token (preferred)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Run orchestrator
        uses: actions/github-script@v8
        env:
          INSTRUCTION_BODY: ${{ needs.keepalive_dispatch.outputs.instruction_body }}
        with:
          github-token: ${{ steps.app_token.outputs.token || secrets.ACTIONS_BOT_PAT || secrets.SERVICE_BOT_PAT || secrets.AGENTS_AUTOMATION_PAT || github.token }}
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { runKeepaliveOrchestrator } = require(`${scriptsPath}/.github/scripts/agents_pr_meta_orchestrator.js`);
            const result = await runKeepaliveOrchestrator({
              github, context, core,
              inputs: {
                commentId: '${{ needs.keepalive_dispatch.outputs.comment_id }}',
                prNumber: '${{ needs.keepalive_dispatch.outputs.pr }}',
                issue: '${{ needs.keepalive_dispatch.outputs.issue }}',
                branch: '${{ needs.keepalive_dispatch.outputs.branch }}',
                base: '${{ needs.keepalive_dispatch.outputs.base }}',
                round: '${{ needs.keepalive_dispatch.outputs.round }}',
                trace: '${{ needs.keepalive_dispatch.outputs.trace }}',
                agentAlias: '${{ needs.keepalive_dispatch.outputs.agent_alias }}',
                instructionBody: process.env.INSTRUCTION_BODY,
                commentUrl: '${{ needs.keepalive_dispatch.outputs.comment_url }}',
              },
              secrets: {
                AGENTS_AUTOMATION_PAT: process.env.AGENTS_AUTOMATION_PAT ? true : false,
                ACTIONS_BOT_PAT: process.env.ACTIONS_BOT_PAT ? true : false,
                SERVICE_BOT_PAT: process.env.SERVICE_BOT_PAT ? true : false,
              },
            });
            if (!result.ok) core.setFailed(result.reason);

  # Resume keepalive after Gate completes - handles race where comment arrives before Gate finishes
  keepalive_from_gate:
    name: Resume keepalive after Gate
    runs-on: ubuntu-latest
    if: inputs.event_name == 'workflow_run' && inputs.allow_replay == true
    outputs:
      dispatch: ${{ steps.detect.outputs.dispatch }}
      reason: ${{ steps.gate.outputs.reason }}
    steps:
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        if: secrets.WORKFLOWS_APP_ID != ''
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Workflows scripts
        uses: actions/checkout@v6
        with:
          repository: stranske/Workflows
          ref: main
          sparse-checkout: |
            .github/scripts
            .github/actions/setup-api-client
          sparse-checkout-cone-mode: false
          path: workflows-lib
          token: ${{ steps.app_token.outputs.token || secrets.ACTIONS_BOT_PAT || secrets.service_bot_pat || github.token }}
          fetch-depth: 1

      - name: Set scripts path
        run: |
          echo "WORKFLOWS_SCRIPTS_PATH=${GITHUB_WORKSPACE}/workflows-lib" >> "$GITHUB_ENV"

      - name: Setup API client
        uses: ./workflows-lib/.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Evaluate keepalive gate
        id: gate
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { evaluateKeepaliveGate } = require(`${scriptsPath}/.github/scripts/keepalive_gate.js`);
            const result = await evaluateKeepaliveGate({
              core, github, context,
              options: {
                prNumber: Number(process.env.PR_NUMBER || 0),
                requireHumanActivation: true,
                requireGateSuccess: true,
              },
            });
            const bool = (v) => (v ? 'true' : 'false');
            core.setOutput('ok', bool(result.ok));
            core.setOutput('reason', result.reason || '');
            core.setOutput('agent_alias', result.primaryAgent || '');
            core.setOutput('head_sha', result.headSha || '');
            core.setOutput('run_cap', String(result.runCap ?? ''));
            core.setOutput('active_runs', String(result.activeRuns ?? ''));
            core.setOutput('pr_number', result.prNumber || process.env.PR_NUMBER);
            core.setOutput('activation_comment', result.activationComment ? JSON.stringify(result.activationComment) : '');
            core.setOutput('activation_comment_id', result.activationComment?.id ? String(result.activationComment.id) : '');

      - name: Detect keepalive from activation
        id: detect
        if: steps.gate.outputs.ok == 'true' && steps.gate.outputs.activation_comment != ''
        uses: actions/github-script@v8
        env:
          ALLOWED_LOGINS: ${{ inputs.allowed_keepalive_logins }}
          KEEPALIVE_MARKER: ${{ inputs.keepalive_marker }}
          ACTIVATION_COMMENT: ${{ steps.gate.outputs.activation_comment }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          GATE_OK: ${{ steps.gate.outputs.ok }}
          ALLOW_REPLAY: 'true'
        with:
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { detectKeepalive } = require(`${scriptsPath}/.github/scripts/agents_pr_meta_keepalive.js`);
            const comment = JSON.parse(process.env.ACTIVATION_COMMENT || '{}');
            // Synthesize context payload to match issue_comment structure
            const detectionContext = {
              ...context,
              payload: { comment, issue: { number: Number(process.env.PR_NUMBER) } },
            };
            await detectKeepalive({ core, github, context: detectionContext, env: process.env });

      - name: Mint GitHub App token for gate orchestrator
        id: app_token_gate
        if: steps.gate.outputs.ok == 'true' && steps.detect.outputs.dispatch == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Run orchestrator from gate
        if: steps.gate.outputs.ok == 'true' && steps.detect.outputs.dispatch == 'true'
        uses: actions/github-script@v8
        env:
          SERVICE_BOT_PAT: ${{ secrets.service_bot_pat || '' }}
          ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT || '' }}
          AGENTS_AUTOMATION_PAT: ${{ secrets.AGENTS_AUTOMATION_PAT || '' }}
          INSTRUCTION_BODY: ${{ steps.detect.outputs.instruction_body }}
        with:
          github-token: ${{ steps.app_token_gate.outputs.token || secrets.ACTIONS_BOT_PAT || secrets.service_bot_pat || secrets.AGENTS_AUTOMATION_PAT || github.token }}
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { runKeepaliveOrchestrator } = require(`${scriptsPath}/.github/scripts/agents_pr_meta_orchestrator.js`);
            const result = await runKeepaliveOrchestrator({
              github, context, core,
              inputs: {
                commentId: '${{ steps.detect.outputs.comment_id }}',
                prNumber: '${{ steps.detect.outputs.pr || steps.gate.outputs.pr_number }}',
                issue: '${{ steps.detect.outputs.issue }}',
                branch: '${{ steps.detect.outputs.branch }}',
                base: '${{ steps.detect.outputs.base }}',
                round: '${{ steps.detect.outputs.round }}',
                trace: '${{ steps.detect.outputs.trace }}',
                agentAlias: '${{ steps.gate.outputs.agent_alias }}',
                instructionBody: process.env.INSTRUCTION_BODY,
                commentUrl: '${{ steps.detect.outputs.comment_url }}',
              },
              secrets: {
                AGENTS_AUTOMATION_PAT: process.env.AGENTS_AUTOMATION_PAT ? true : false,
                ACTIONS_BOT_PAT: process.env.ACTIONS_BOT_PAT ? true : false,
                SERVICE_BOT_PAT: process.env.SERVICE_BOT_PAT ? true : false,
              },
            });
            if (!result.ok) core.setFailed(result.reason);

      - name: Write keepalive dispatch summary (gate lane)
        if: always()
        run: |
          bash "${GITHUB_WORKSPACE}/workflows-lib/.github/scripts/write_dispatch_summary.sh"
        env:
          PATH_LABEL: gate
          DISPATCH: ${{ steps.detect.outputs.dispatch || 'false' }}
          DISPATCH_REASON: ${{ steps.detect.outputs.reason || steps.gate.outputs.reason || '' }}
          PR_NUMBER: ${{ steps.detect.outputs.pr || steps.gate.outputs.pr_number || '' }}
          FALLBACK_PR: ${{ steps.gate.outputs.pr_number || inputs.pr_number || '' }}
          ACTIVATION_ID: ${{ steps.detect.outputs.comment_id || '' }}
          ACTIVATION_FALLBACK: ${{ steps.gate.outputs.activation_comment_id || '' }}
          DISPATCH_AGENT: ${{ steps.gate.outputs.agent_alias || '' }}
          HEAD_SHA: ${{ steps.gate.outputs.head_sha || '' }}
          RUN_CAP: ${{ steps.gate.outputs.run_cap || '' }}
          ACTIVE_RUNS: ${{ steps.gate.outputs.active_runs || '' }}
          TRACE: ${{ steps.detect.outputs.trace || '' }}

  pr_body_update:
    name: Update PR body sections
    runs-on: ubuntu-latest
    if: inputs.event_name == 'pull_request'
    steps:
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        if: secrets.WORKFLOWS_APP_ID != ''
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Workflows scripts
        uses: actions/checkout@v6
        with:
          repository: stranske/Workflows
          ref: main
          sparse-checkout: |
            .github/scripts
            .github/actions/setup-api-client
          sparse-checkout-cone-mode: false
          path: workflows-lib
          token: ${{ steps.app_token.outputs.token || secrets.ACTIONS_BOT_PAT || secrets.service_bot_pat || github.token }}
          fetch-depth: 1

      - name: Set scripts path
        run: |
          echo "WORKFLOWS_SCRIPTS_PATH=${GITHUB_WORKSPACE}/workflows-lib" >> "$GITHUB_ENV"

      - name: Setup API client
        uses: ./workflows-lib/.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Upsert PR body sections
        uses: actions/github-script@v8
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const scriptsPath = process.env.WORKFLOWS_SCRIPTS_PATH;
            const { run } = require(`${scriptsPath}/.github/scripts/agents_pr_meta_update_body.js`);
            await run({
              github, context, core,
              inputs: {
                pr_number: process.env.PR_NUMBER,
                dry_run: process.env.DRY_RUN === 'true',
              },
            });
