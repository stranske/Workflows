# Reusable Agents Verifier workflow
# Runs post-merge to verify acceptance criteria were met
#
# This workflow:
# 1. Builds context from merged PR and linked issues
# 2. Runs Codex in verifier mode to check acceptance criteria
# 3. Opens a follow-up issue if criteria weren't met
name: Reusable Agents Verifier

on:
  workflow_call:
    inputs:
      ci_workflows:
        description: 'JSON array of CI workflow filenames to wait for'
        required: false
        type: string
        default: '["ci.yml", "pr-00-gate.yml"]'
      ci_wait_timeout_ms:
        description: 'Max time to wait for CI workflows (ms)'
        required: false
        type: number
        default: 300000
      mode:
        description: 'Verification mode: checkbox (default), evaluate (LLM-based), or compare (multi-provider)'
        required: false
        type: string
        default: 'checkbox'
      model:
        description: 'LLM model to use for evaluation (e.g., gpt-4o, gpt-4o-mini, o1-mini). Defaults to gpt-4o-mini.'
        required: false
        type: string
        default: 'gpt-5.2'
    secrets:
      CODEX_AUTH_JSON:
        required: false
        description: 'Codex authentication JSON from codex login (required for checkbox/compare modes)'
      OPENAI_API_KEY:
        required: false
        description: 'OpenAI API key for evaluate/compare modes (enables model selection beyond GitHub Models)'

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  verifier:
    name: Run post-merge verifier
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout Workflows scripts
        uses: actions/checkout@v6
        with:
          repository: stranske/Workflows
          ref: main
          sparse-checkout: |
            .github/scripts
            .github/codex/prompts
            scripts/langchain
            tools
          sparse-checkout-cone-mode: false
          path: .workflows-lib
          fetch-depth: 1

      - name: Wait for CI workflows to complete
        id: wait_ci
        uses: actions/github-script@v8
        env:
          CI_WORKFLOWS: ${{ inputs.ci_workflows }}
          CI_WAIT_TIMEOUT_MS: ${{ inputs.ci_wait_timeout_ms }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr || !pr.merged) {
              core.info('PR not merged; skipping CI wait.');
              return;
            }

            const targetSha = pr.merge_commit_sha;
            if (!targetSha) {
              core.setFailed('Merged PR is missing merge_commit_sha.');
              return;
            }

            const ciWorkflows = JSON.parse(process.env.CI_WORKFLOWS || '[]');
            const maxWaitMs = Number(process.env.CI_WAIT_TIMEOUT_MS) || 300000;
            const pollIntervalMs = 15000;
            const startTime = Date.now();

            core.info(`Waiting for CI workflows to complete for SHA ${targetSha}...`);

            while (Date.now() - startTime < maxWaitMs) {
              let allComplete = true;
              let anyFound = false;

              for (const workflowFile of ciWorkflows) {
                try {
                  const { data: runs } = await github.rest.actions.listWorkflowRuns({
                    ...context.repo,
                    workflow_id: workflowFile,
                    head_sha: targetSha,
                    per_page: 1,
                  });

                  if (runs.workflow_runs.length > 0) {
                    anyFound = true;
                    const run = runs.workflow_runs[0];
                    core.info(`${workflowFile}: status=${run.status}, conclusion=${run.conclusion || 'pending'}`);
                    if (run.status !== 'completed') {
                      allComplete = false;
                    }
                  }
                } catch (err) {
                  core.warning(`Failed to check ${workflowFile}: ${err.message}`);
                }
              }

              if (anyFound && allComplete) {
                core.info('All CI workflows have completed.');
                return;
              }

              core.info(`Waiting ${pollIntervalMs / 1000}s for CI to complete...`);
              await new Promise(resolve => setTimeout(resolve, pollIntervalMs));
            }

            core.warning(`CI wait timed out after ${maxWaitMs / 1000}s.`);

      - name: Build verifier context
        id: context
        uses: actions/github-script@v8
        env:
          CI_WORKFLOWS: ${{ inputs.ci_workflows }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { buildVerifierContext } = require('./.workflows-lib/.github/scripts/agents_verifier_context.js');
            const ciWorkflows = process.env.CI_WORKFLOWS || '[]';
            await buildVerifierContext({ github, context, core, ciWorkflows });

      - name: Stop when verifier is skipped
        if: steps.context.outputs.should_run != 'true'
        run: |
          echo "Verifier skipped: ${{ steps.context.outputs.skip_reason || 'no reason provided' }}"

      - name: Prepare verifier prompt
        if: steps.context.outputs.should_run == 'true'
        id: prepare
        run: |
          set -euo pipefail
          # Use prompt from Workflows repo
          base_prompt=".workflows-lib/.github/codex/prompts/verifier_acceptance_check.md"
          context_file="${{ steps.context.outputs.context_path }}"
          combined="verifier-prompt.md"

          if [ ! -f "$base_prompt" ]; then
            echo "::error::Base prompt file missing: $base_prompt"
            exit 1
          fi
          if [ ! -f "$context_file" ]; then
            echo "::error::Context file missing: $context_file"
            exit 1
          fi

          {
            cat "$base_prompt"
            printf '\n\n---\n\n'
            cat "$context_file"
          } > "$combined"
          echo "prompt_file=$combined" >> "$GITHUB_OUTPUT"

      - name: Validate Codex auth for checkbox/compare modes
        if: steps.context.outputs.should_run == 'true' && inputs.mode != 'evaluate'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON secret is required for ${{ inputs.mode }} mode but not provided"
            exit 1
          fi

      - name: Setup Codex auth
        if: steps.context.outputs.should_run == 'true' && inputs.mode != 'evaluate'
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
          CODEX_HOME: ${{ runner.temp }}/.codex-verifier
        run: |
          set -euo pipefail
          mkdir -p ~/.codex "$CODEX_HOME"
          echo "$CODEX_AUTH_JSON" > ~/.codex/auth.json
          chmod 600 ~/.codex/auth.json
          cp ~/.codex/auth.json "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          echo "Codex auth configured"

      - name: Install Codex CLI
        if: steps.context.outputs.should_run == 'true' && inputs.mode != 'evaluate'
        run: npm install -g @openai/codex

      - name: Run verifier (checkbox mode)
        id: codex
        if: steps.context.outputs.should_run == 'true' && inputs.mode != 'evaluate'
        continue-on-error: true
        env:
          CODEX_HOME: ${{ runner.temp }}/.codex-verifier
        run: |
          set -euo pipefail
          PROMPT_FILE="${{ steps.prepare.outputs.prompt_file }}"

          set +e
          codex exec \
            --sandbox read-only \
            --skip-git-repo-check \
            --output-last-message codex-output.md \
            "$(cat "$PROMPT_FILE")"
          codex_exit_code=$?
          set -euo pipefail

          echo "Codex verifier completed (exit code: ${codex_exit_code})"
          if [ -f codex-output.md ]; then
            echo "=== Verifier Output ==="
            cat codex-output.md
          fi
          exit "${codex_exit_code}"

      - name: Parse verifier verdict (checkbox mode)
        id: verdict
        if: steps.context.outputs.should_run == 'true' && inputs.mode != 'evaluate'
        run: |
          set -euo pipefail
          verdict="unknown"

          # Check if the codex step failed (continue-on-error means we still get here)
          codex_outcome="${{ steps.codex.outcome }}"
          if [ "$codex_outcome" = "failure" ]; then
            # Codex crashed - treat as error verdict for follow-up
            verdict="error"
          elif [ -f "codex-output.md" ]; then
            if grep -qiE 'verdict:[[:space:]]*fail' "codex-output.md"; then
              verdict="fail"
            elif grep -qiE 'verdict:[[:space:]]*pass' "codex-output.md"; then
              verdict="pass"
            fi
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # === LLM Evaluation Mode (when mode=evaluate) ===
      - name: Setup Python for LLM evaluation
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'evaluate'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install LLM evaluation dependencies
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'evaluate'
        run: |
          pip install pydantic langchain-openai

      - name: Run LLM evaluation
        id: llm_evaluate
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'evaluate'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .workflows-lib
        run: |
          set -euo pipefail
          context_file="${{ steps.context.outputs.context_path }}"
          diff_file="${{ steps.context.outputs.diff_summary_path }}"
          model="${{ inputs.model }}"

          # Build args array
          args=(--context-file "$context_file" --json)
          if [ -n "$diff_file" ] && [ -f "$diff_file" ]; then
            args+=(--diff-file "$diff_file")
          fi
          if [ -n "$model" ]; then
            args+=(--model "$model")
          fi
          args+=(--create-issue --issue-label agent:codex --issue-label verify:evaluate)

          # Run evaluator (stderr to separate file to avoid corrupting JSON)
          python .workflows-lib/scripts/langchain/pr_verifier.py "${args[@]}" > evaluation.json 2> evaluation-stderr.log || true

          # Parse result
          if [ -f evaluation.json ]; then
            verdict=$(python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('verdict','CONCERNS'))" < evaluation.json 2>/dev/null || echo "CONCERNS")
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

            # Format output for comment
            python3 - <<'PYFORMAT'
          import json
          import sys

          try:
              with open('evaluation.json') as f:
                  data = json.load(f)

              lines = ["## LLM Evaluation Report", ""]
              lines.append(f"**Verdict:** {data.get('verdict', 'UNKNOWN')}")
              lines.append("")

              if data.get('summary'):
                  lines.append(f"**Summary:** {data['summary']}")
                  lines.append("")

              scores = data.get('scores')
              if scores:
                  lines.append("### Scores")
                  lines.append("| Criterion | Score |")
                  lines.append("|-----------|-------|")
                  for key in ['correctness', 'completeness', 'quality', 'testing', 'risks']:
                      score = scores.get(key, 'N/A')
                      lines.append(f"| {key.capitalize()} | {score}/10 |")
                  lines.append("")

              concerns = data.get('concerns', [])
              if concerns:
                  lines.append("### Concerns")
                  for c in concerns:
                      if c:
                          lines.append(f"- {c}")
                  lines.append("")

              if data.get('error'):
                  lines.append(f"**Note:** {data['error']}")

              with open('evaluation-comment.md', 'w') as f:
                  f.write('\n'.join(lines))
          except Exception as e:
              with open('evaluation-comment.md', 'w') as f:
                  f.write(f"## LLM Evaluation\n\nEvaluation encountered an error: {e}")
          PYFORMAT

            cat evaluation-comment.md
          else
            echo "verdict=CONCERNS" >> "$GITHUB_OUTPUT"
            printf "%s\n" "## LLM Evaluation" "" "Evaluation could not run (missing output)." > evaluation-comment.md
          fi

      - name: Post LLM evaluation comment
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'evaluate' && steps.llm_evaluate.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.context.outputs.pr_number }}"
          if [ -n "$pr_number" ] && [ -f "evaluation-comment.md" ]; then
            gh pr comment "$pr_number" --body-file evaluation-comment.md || echo "Warning: Could not post comment"
          fi


      # === Multi-Provider Comparison Mode (when mode=compare) ===
      - name: Setup Python for comparison
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'compare'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install comparison dependencies
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'compare'
        run: |
          pip install pydantic langchain-openai

      - name: Run multi-provider comparison
        id: llm_compare
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'compare'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: .workflows-lib
        run: |
          set -euo pipefail
          context_file="${{ steps.context.outputs.context_path }}"
          diff_file="${{ steps.context.outputs.diff_summary_path }}"

          # Build args array
          args=(--context-file "$context_file" --compare --json)
          if [ -n "$diff_file" ] && [ -f "$diff_file" ]; then
            args+=(--diff-file "$diff_file")
          fi

          # Run comparison (stderr to separate file to avoid corrupting JSON)
          python .workflows-lib/scripts/langchain/pr_verifier.py "${args[@]}" > comparison.json 2> comparison-stderr.log || true

          # Parse result
          if [ -f comparison.json ]; then
            # Extract consensus verdict from results
            verdict=$(python3 -c "import sys,json; d=json.load(sys.stdin); results=d.get('results',[]); verdicts=[r.get('verdict','CONCERNS') for r in results]; print('PASS' if all(v=='PASS' for v in verdicts) else 'CONCERNS')" < comparison.json 2>/dev/null || echo "CONCERNS")
            echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

            # Extract the formatted report
            python3 -c "import json; d=json.load(open('comparison.json')); print(d.get('report', '## Comparison Report\n\nNo report generated.'))" > comparison-comment.md

            cat comparison-comment.md
          else
            echo "verdict=CONCERNS" >> "$GITHUB_OUTPUT"
            printf "%s\n" "## Multi-Provider Comparison" "" "Comparison could not run (missing output)." > comparison-comment.md
          fi

      - name: Post comparison report comment
        if: steps.context.outputs.should_run == 'true' && inputs.mode == 'compare' && steps.llm_compare.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr_number="${{ steps.context.outputs.pr_number }}"
          if [ -n "$pr_number" ] && [ -f "comparison-comment.md" ]; then
            gh pr comment "$pr_number" --body-file comparison-comment.md || echo "Warning: Could not post comment"
          fi

      - name: Set unified verdict
        id: unified_verdict
        if: steps.context.outputs.should_run == 'true'
        run: |
          # Combine verdicts from all modes
          checkbox_verdict="${{ steps.verdict.outputs.verdict }}"
          llm_verdict="${{ steps.llm_evaluate.outputs.verdict }}"
          compare_verdict="${{ steps.llm_compare.outputs.verdict }}"

          if [ "${{ inputs.mode }}" = "evaluate" ]; then
            final_verdict="${llm_verdict:-unknown}"
          elif [ "${{ inputs.mode }}" = "compare" ]; then
            final_verdict="${compare_verdict:-unknown}"
          else
            final_verdict="${checkbox_verdict:-unknown}"
          fi

          echo "verdict=$final_verdict" >> "$GITHUB_OUTPUT"
          echo "Final verdict: $final_verdict"

      - name: Open follow-up issue on verifier failure
        id: failure_issue
        if: steps.context.outputs.should_run == 'true' && (steps.unified_verdict.outputs.verdict == 'fail' || steps.unified_verdict.outputs.verdict == 'error' || steps.unified_verdict.outputs.verdict == 'FAIL' || steps.unified_verdict.outputs.verdict == 'CONCERNS')
        uses: actions/github-script@v8
        env:
          PR_URL: ${{ steps.context.outputs.pr_html_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { formatFollowUpIssue, formatSimpleFollowUpIssue } = require('./.workflows-lib/.github/scripts/verifier_issue_formatter.js');

            const rawPrNumber = Number('${{ steps.context.outputs.pr_number }}');
            const prNumber = !Number.isNaN(rawPrNumber) && rawPrNumber > 0 ? rawPrNumber : null;
            const issueNumbers = JSON.parse('${{ steps.context.outputs.issue_numbers || '[]' }}');
            const verdict = '${{ steps.verdict.outputs.verdict }}';
            const prUrl = process.env.PR_URL || '';
            const runUrl = process.env.RUN_URL || '';

            // Handle Codex crash/error case
            if (verdict === 'error') {
              const title = prNumber ? `[Verifier Error] PR #${prNumber} verification failed` : '[Verifier Error] Verification failed';
              const body = `## Verifier Error\n\nThe verifier encountered an error while checking acceptance criteria.\n\n**PR:** ${prUrl || `#${prNumber}` || 'unknown'}\n**Run:** ${runUrl}\n\nPlease review the workflow run logs for details.`;
              const { data: issue } = await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['agent:codex', 'bug'],
              });
              core.setOutput('issue_number', issue?.number ? String(issue.number) : '');
              core.info(`Created error follow-up issue #${issue.number}: ${title}`);
              return;
            }

            // Normal failure case - verifier ran but criteria weren't met
            let verifierOutput = '';
            try {
              verifierOutput = fs.readFileSync('codex-output.md', 'utf8');
            } catch (err) {
              core.warning(`Could not read codex-output.md: ${err.message}`);
              verifierOutput = '_Verifier output not available_';
            }

            let prBody = '';
            if (prNumber) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  ...context.repo,
                  pull_number: prNumber,
                });
                prBody = pr.body || '';
              } catch (err) {
                core.warning(`Failed to fetch PR body: ${err.message}`);
              }
            }

            const issues = [];
            for (const issueNum of issueNumbers) {
              try {
                const { data: issue } = await github.rest.issues.get({
                  ...context.repo,
                  issue_number: issueNum,
                });
                issues.push({
                  number: issue.number,
                  title: issue.title || '',
                  body: issue.body || '',
                });
              } catch (err) {
                core.warning(`Failed to fetch issue #${issueNum}: ${err.message}`);
              }
            }

            let result;
            if (prBody || issues.length > 0) {
              result = formatFollowUpIssue({
                verifierOutput,
                prBody,
                issues,
                prNumber,
                prUrl,
                runUrl,
              });
            } else {
              result = formatSimpleFollowUpIssue({
                verifierOutput,
                prNumber,
                prUrl,
                issueNumbers,
                runUrl,
              });
            }

            // Skip issue creation if there's no substantive content
            // (e.g., all sections are placeholder text or empty)
            if (!result.hasSubstantiveContent) {
              core.info('Skipping issue creation: no substantive content to act on (all placeholder sections)');
              core.setOutput('issue_number', '');
              core.setOutput('skipped', 'true');
              return;
            }

            const { data: issue } = await github.rest.issues.create({
              ...context.repo,
              title: result.title,
              body: result.body,
              labels: ['agent:codex'],
            });
            core.setOutput('issue_number', issue?.number ? String(issue.number) : '');
            core.setOutput('skipped', 'false');
            core.info(`Created follow-up issue #${issue.number}: ${result.title}`);

      - name: Collect verifier metrics
        if: always()
        id: collect_metrics
        env:
          SHOULD_RUN: ${{ steps.context.outputs.should_run }}
          PR_NUMBER: ${{ steps.context.outputs.pr_number }}
          VERDICT: ${{ steps.verdict.outputs.verdict }}
          CONTEXT_PATH: ${{ steps.context.outputs.context_path }}
          ISSUE_NUMBER: ${{ steps.failure_issue.outputs.issue_number }}
          SKIP_REASON: ${{ steps.context.outputs.skip_reason }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          from datetime import datetime, timezone

          def count_checkboxes(text):
              return sum(1 for line in text.splitlines() if re.match(r"^\s*[-*]\s+\[[ xX]\]", line))

          should_run = (os.environ.get("SHOULD_RUN") or "").lower() == "true"
          pr_number = int(os.environ.get("PR_NUMBER") or 0)
          verdict = os.environ.get("VERDICT") or "unknown"
          context_path = Path(os.environ.get("CONTEXT_PATH") or "")
          skip_reason = os.environ.get("SKIP_REASON") or ""
          issue_number = os.environ.get("ISSUE_NUMBER") or ""

          if not should_run:
              verdict = "skipped"

          issues_created = 1 if issue_number else 0
          issue_numbers = [issue_number] if issue_number else []

          acceptance_criteria_count = 0
          if context_path.is_file():
              acceptance_criteria_count = count_checkboxes(context_path.read_text(encoding="utf-8"))

          checks_run = 0
          codex_output = Path("codex-output.md")
          if codex_output.is_file():
              content = codex_output.read_text(encoding="utf-8")
              # Count checkbox items (e.g., "- [x] ..." or "- [ ] ...") in verifier output
              for line in content.splitlines():
                  if re.match(r"^\s*[-*]\s+\[[ xX]\]", line):
                      checks_run += 1

          metrics = {
              "pr_number": pr_number,
              "verdict": verdict,
              "issues_created": issues_created,
              "issue_numbers": issue_numbers,
              "acceptance_criteria_count": acceptance_criteria_count,
              "checks_run": checks_run,
              "skip_reason": skip_reason,
              "recorded_at": datetime.now(timezone.utc).isoformat(),
          }

          print(json.dumps(metrics, indent=2))
          with open(os.environ["GITHUB_OUTPUT"], "a") as fp:
              fp.write(f"metrics_json={json.dumps(metrics)}\n")
          PY

      - name: Write verifier summary
        if: always()
        env:
          METRICS_JSON: ${{ steps.collect_metrics.outputs.metrics_json }}
        run: |
          set -euo pipefail
          if [ -z "${METRICS_JSON:-}" ]; then
            echo "No verifier metrics captured."
            exit 0
          fi
          python3 - <<'PY'
          import json, os
          metrics = json.loads(os.environ["METRICS_JSON"])
          lines = ["## Verifier metrics", "", "| Field | Value |", "| --- | --- |"]
          for key in ["pr_number", "verdict", "issues_created", "acceptance_criteria_count", "checks_run", "skip_reason"]:
              lines.append(f"| {key} | `{metrics.get(key, '')}` |")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a") as fp:
                  fp.write("\n".join(lines) + "\n")

          with open("verifier-metrics.ndjson", "a") as fp:
              fp.write(json.dumps(metrics) + "\n")
          PY

      - name: Upload verifier metrics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agents-verifier-metrics
          path: verifier-metrics.ndjson
          retention-days: 30
