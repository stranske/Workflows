name: Agents Issue Optimizer

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to optimize"
        required: true
        type: string
      phase:
        description: "Phase to run (analyze, apply, or format)"
        required: true
        type: choice
        options:
          - analyze
          - apply
          - format

concurrency:
  group: agents-issue-optimizer-${{ github.repository }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  optimize_issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
      models: read

    steps:
      - name: Check trigger conditions
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABEL_NAME: ${{ github.event.label.name }}
          DISPATCH_PHASE: ${{ inputs.phase }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "phase=$DISPATCH_PHASE"
              echo "issue_number=${{ inputs.issue_number }}"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$LABEL_NAME" == "agents:optimize" ]]; then
            {
              echo "phase=analyze"
              echo "issue_number=${{ github.event.issue.number }}"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$LABEL_NAME" == "agents:apply-suggestions" ]]; then
            {
              echo "phase=apply"
              echo "issue_number=${{ github.event.issue.number }}"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$LABEL_NAME" == "agents:format" ]]; then
            {
              echo "phase=format"
              echo "issue_number=${{ github.event.issue.number }}"
              echo "should_run=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Node.js
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install load balancer dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock @octokit/rest @octokit/auth-app

      - name: Export load balancer tokens
        if: steps.check.outputs.should_run == 'true'
        uses: ./.github/actions/export-load-balancer-tokens
        with:
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          codespaces_workflows: ${{ secrets.CODESPACES_WORKFLOWS }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}
          token_rotation_json: ${{ secrets.TOKEN_ROTATION_JSON }}
          token_rotation_env_keys: ${{ vars.TOKEN_ROTATION_ENV_KEYS }}

      - name: Set up Python
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Install langchain dependencies
          pip install langchain langchain-core langchain-openai langchain-community

      - name: Get issue body
        if: steps.check.outputs.should_run == 'true'
        id: get_issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
        run: |
          node - <<'NODE'
          (async () => {
            const fs = require('fs');
            const { Octokit } = require('@octokit/rest');
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const core = { info: () => {}, warning: console.warn, debug: () => {} };
            const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'issue-optimizer',
              capabilities: ['issues:read'],
            });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const { data } = await withRetry((client) => client.rest.issues.get({
              owner,
              repo,
              issue_number: issueNumber,
            }));
            fs.writeFileSync('/tmp/issue.json', JSON.stringify(data, null, 2));
            fs.writeFileSync('/tmp/issue_body.md', data.body || '');
            console.log('Issue body saved to /tmp/issue_body.md');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
NODE

      - name: Phase 1 - Analyze Issue
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.phase == 'analyze'
        id: analyze
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Running analysis on issue #${ISSUE_NUMBER}"
          python scripts/langchain/issue_optimizer.py \
            --input-file /tmp/issue_body.md \
            --json > /tmp/suggestions.json

          # Format the comment
          python -c "
          import json
          import sys
          sys.path.insert(0, 'scripts/langchain')
          from issue_optimizer import IssueOptimizationResult, format_suggestions_comment

          with open('/tmp/suggestions.json') as f:
              data = json.load(f)

          result = IssueOptimizationResult(
              task_splitting=data.get('task_splitting', []),
              blocked_tasks=data.get('blocked_tasks', []),
              objective_criteria=data.get('objective_criteria', []),
              missing_sections=data.get('missing_sections', []),
              formatting_issues=data.get('formatting_issues', []),
              overall_notes=data.get('overall_notes', ''),
              provider_used=data.get('provider_used')
          )

          comment = format_suggestions_comment(result)
          with open('/tmp/comment.md', 'w') as f:
              f.write(comment)
          " || {
            echo "Failed to format comment, using raw JSON"
            cat /tmp/suggestions.json > /tmp/comment.md
          }

          # Post comment
          node - <<'NODE'
          (async () => {
            const fs = require('fs');
            const { Octokit } = require('@octokit/rest');
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const core = { info: () => {}, warning: console.warn, debug: () => {} };
            const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'issue-optimizer',
              capabilities: ['issues:write'],
            });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const body = fs.readFileSync('/tmp/comment.md', 'utf8');
            await withRetry((client) => client.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            }));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
NODE

          echo "Analysis complete. Review suggestions and add 'agents:apply-suggestions' label to apply."

      - name: Advisory issue dedup check
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.phase == 'analyze'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Checking for potential duplicate issues (advisory)"
          node - <<'NODE'
          (async () => {
            const fs = require('fs');
            const { Octokit } = require('@octokit/rest');
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const core = { info: () => {}, warning: console.warn, debug: () => {} };
            const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const { paginateWithRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'issue-optimizer',
              capabilities: ['issues:read'],
            });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const openIssues = await paginateWithRetry(
              github.rest.issues.listForRepo,
              { owner, repo, state: 'open', per_page: 100 }
            );
            const comments = await paginateWithRetry(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );
            fs.writeFileSync('/tmp/open_issues.json', JSON.stringify(openIssues, null, 2));
            fs.writeFileSync('/tmp/dedup_comments.json', JSON.stringify(comments, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
NODE

          python - <<'PY' || true
          import json
          from scripts.langchain import issue_dedup

          with open('/tmp/issue.json', encoding='utf-8') as f:
              issue = json.load(f)
          with open('/tmp/open_issues.json', encoding='utf-8') as f:
              open_issues = json.load(f)
            with open('/tmp/dedup_comments.json', encoding='utf-8') as f:
              comments = json.load(f)

            marker = issue_dedup.SIMILAR_ISSUES_MARKER
            for comment in comments or []:
              body = (comment or {}).get('body') or ''
              if marker in body:
                raise SystemExit(0)

          # Conservative defaults; can be tuned later.
          threshold = 0.82
            store = issue_dedup.build_issue_vector_store(open_issues)
            if store is None:
              raise SystemExit(0)

            title = (issue.get('title') or '').strip()
            body = (issue.get('body') or '').strip()
            query = f"{title}\n{body}".strip() if body else title
            if not query:
              raise SystemExit(0)

            matches = issue_dedup.find_similar_issues(store, query, threshold=threshold, k=5)
            comment = issue_dedup.format_similar_issues_comment(matches, max_items=5)
            if comment:
              with open('/tmp/dedup_comment.md', 'w', encoding='utf-8') as out:
                out.write(comment)
          PY

          if [[ -f /tmp/dedup_comment.md ]]; then
            node - <<'NODE'
            (async () => {
              const fs = require('fs');
              const { Octokit } = require('@octokit/rest');
              const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
              const core = { info: () => {}, warning: console.warn, debug: () => {} };
              const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
              const { withRetry } = await createTokenAwareRetry({
                github,
                core,
                env: process.env,
                task: 'issue-optimizer',
                capabilities: ['issues:write'],
              });
              const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
              const issueNumber = Number(process.env.ISSUE_NUMBER);
              const body = fs.readFileSync('/tmp/dedup_comment.md', 'utf8');
              try {
                await withRetry((client) => client.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body,
                }));
              } catch (error) {
                console.warn(`Dedup comment failed: ${error.message}`);
              }
            })().catch((error) => {
              console.error(error);
              process.exit(1);
            });
NODE
          else
            echo "No likely duplicates detected."
          fi

      - name: Phase 2 - Apply Suggestions
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.phase == 'apply'
        id: apply
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Extracting suggestions from comments on issue #${ISSUE_NUMBER}"

          # Get all comments and find the one with suggestions JSON
          node - <<'NODE'
          (async () => {
            const fs = require('fs');
            const { Octokit } = require('@octokit/rest');
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const core = { info: () => {}, warning: console.warn, debug: () => {} };
            const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const { paginateWithRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'issue-optimizer',
              capabilities: ['issues:read'],
            });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const comments = await paginateWithRetry(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber, per_page: 100 }
            );
            fs.writeFileSync('/tmp/comments.json', JSON.stringify(comments, null, 2));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
NODE

          # Extract suggestions JSON from comment
          python -c "
          import json
          import sys
          import re
          sys.path.insert(0, 'scripts/langchain')
          from issue_optimizer import _extract_suggestions_json, apply_suggestions

          with open('/tmp/comments.json') as f:
              comments = json.load(f)

          suggestions = None
          for comment in comments:
              body = comment.get('body', '')
              extracted = _extract_suggestions_json(body)
              if extracted:
                  suggestions = extracted
                  break

          if not suggestions:
              print('ERROR: No suggestions JSON found in comments')
              sys.exit(1)

          # Read current issue body
          with open('/tmp/issue_body.md') as f:
              issue_body = f.read()

          # Apply suggestions
          result = apply_suggestions(issue_body, suggestions, use_llm=False)

          with open('/tmp/updated_body.md', 'w') as f:
              f.write(result['formatted_body'])

          print('Suggestions applied successfully')
          " || exit 1

          # Update issue body
          node - <<'NODE'
          (async () => {
            const fs = require('fs');
            const { Octokit } = require('@octokit/rest');
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const core = { info: () => {}, warning: console.warn, debug: () => {} };
            const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'issue-optimizer',
              capabilities: ['issues:write'],
            });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const body = fs.readFileSync('/tmp/updated_body.md', 'utf8');
            await withRetry((client) => client.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            }));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
NODE

          echo "Issue body updated with applied suggestions"

      - name: Phase 3 - Format Issue
        if: steps.check.outputs.should_run == 'true' && steps.check.outputs.phase == 'format'
        id: format
        env:
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          echo "Formatting issue #${ISSUE_NUMBER} into AGENT_ISSUE_TEMPLATE structure"

          # Format the issue using issue_formatter.py
          python scripts/langchain/issue_formatter.py \
            --input-file /tmp/issue_body.md \
            --json > /tmp/format_result.json

          # Extract formatted body
          python -c "
          import json
          with open('/tmp/format_result.json') as f:
              result = json.load(f)
          formatted = result.get('formatted_body', '')
          if not formatted:
              print('ERROR: No formatted body returned')
              import sys
              sys.exit(1)
          with open('/tmp/formatted_body.md', 'w') as f:
              f.write(formatted)
          print('Issue formatted successfully')
          " || exit 1

          # Update issue body with formatted version
          node - <<'NODE'
          (async () => {
            const fs = require('fs');
            const { Octokit } = require('@octokit/rest');
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const core = { info: () => {}, warning: console.warn, debug: () => {} };
            const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'issue-optimizer',
              capabilities: ['issues:write'],
            });
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const body = fs.readFileSync('/tmp/formatted_body.md', 'utf8');
            await withRetry((client) => client.rest.issues.update({
              owner,
              repo,
              issue_number: issueNumber,
              body,
            }));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
NODE

          echo "Issue body updated with formatted structure"

      - name: Manage labels
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.check.outputs.issue_number }}
          PHASE: ${{ steps.check.outputs.phase }}
        run: |
          if [[ "$PHASE" == "apply" ]]; then
            # Remove both optimization labels and add formatted label
            node - <<'NODE'
            (async () => {
              const { Octokit } = require('@octokit/rest');
              const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
              const core = { info: () => {}, warning: console.warn, debug: () => {} };
              const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
              const { withRetry } = await createTokenAwareRetry({
                github,
                core,
                env: process.env,
                task: 'issue-optimizer',
                capabilities: ['issues:write'],
              });
              const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
              const issueNumber = Number(process.env.ISSUE_NUMBER);
              const labelsToRemove = ['agents:optimize', 'agents:apply-suggestions'];
              for (const label of labelsToRemove) {
                try {
                  await withRetry((client) => client.rest.issues.removeLabel({
                    owner,
                    repo,
                    issue_number: issueNumber,
                    name: label,
                  }));
                } catch (error) {
                  if (!String(error.message || '').includes('Label does not exist')) {
                    console.warn(`Failed to remove label ${label}: ${error.message}`);
                  }
                }
              }
              try {
                await withRetry((client) => client.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['agents:formatted'],
                }));
              } catch (error) {
                console.warn(`Failed to add formatted label: ${error.message}`);
              }
            })().catch((error) => {
              console.error(error);
              process.exit(1);
            });
NODE
            echo "Labels updated: removed optimize/apply-suggestions, added formatted"
          elif [[ "$PHASE" == "format" ]]; then
            # Remove format trigger label and add formatted result label
            node - <<'NODE'
            (async () => {
              const { Octokit } = require('@octokit/rest');
              const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
              const core = { info: () => {}, warning: console.warn, debug: () => {} };
              const github = new Octokit({ auth: process.env.GITHUB_TOKEN });
              const { withRetry } = await createTokenAwareRetry({
                github,
                core,
                env: process.env,
                task: 'issue-optimizer',
                capabilities: ['issues:write'],
              });
              const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
              const issueNumber = Number(process.env.ISSUE_NUMBER);
              try {
                await withRetry((client) => client.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  name: 'agents:format',
                }));
              } catch (error) {
                if (!String(error.message || '').includes('Label does not exist')) {
                  console.warn(`Failed to remove format label: ${error.message}`);
                }
              }
              try {
                await withRetry((client) => client.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  labels: ['agents:formatted'],
                }));
              } catch (error) {
                console.warn(`Failed to add formatted label: ${error.message}`);
              }
            })().catch((error) => {
              console.error(error);
              process.exit(1);
            });
NODE
            echo "Labels updated: removed format, added formatted"
          fi
