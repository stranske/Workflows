name: Maint Sync Action Versions

# Sync GitHub Action versions from .github/workflows to templates
# after Dependabot merges action version updates.
#
# This ensures templates stay in sync with the latest action versions
# that Dependabot updates in the main workflows.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-versions:
    name: Sync action versions to templates
    runs-on: ubuntu-latest
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:

          token: ${{ steps.app_token.outputs.token || github.token }}
          fetch-depth: 0

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}




      - name: Extract action versions from workflows
        id: extract
        run: |
          set -euo pipefail

          # Extract unique action versions from .github/workflows/
          declare -A versions

          for file in .github/workflows/*.yml; do
            while IFS= read -r line; do
              # Match 'uses: owner/action@version'
              if [[ "$line" =~ uses:[[:space:]]*([^[:space:]]+)@(v[0-9]+) ]]; then
                action="${BASH_REMATCH[1]}"
                version="${BASH_REMATCH[2]}"
                # Use numeric comparison for versions
                if [[ -z "${versions[$action]:-}" ]]; then
                  versions["$action"]="$version"
                else
                  new_num="${version#v}"
                  current_num="${versions[$action]#v}"
                  if (( new_num > current_num )); then
                    versions["$action"]="$version"
                  fi
                fi
              fi
            done < "$file"
          done

          # Output versions for key actions (grouped redirects for SC2129)
          {
            echo "checkout=${versions[actions/checkout]:-v4}"
            echo "github_script=${versions[actions/github-script]:-v7}"
            echo "upload_artifact=${versions[actions/upload-artifact]:-v4}"
            echo "download_artifact=${versions[actions/download-artifact]:-v4}"
            echo "cache=${versions[actions/cache]:-v4}"
          } >> "$GITHUB_OUTPUT"

          echo "Detected versions:"
          for action in "${!versions[@]}"; do
            echo "  $action: ${versions[$action]}"
          done

      - name: Update templates with synced versions
        id: update
        run: |
          set -euo pipefail

          checkout="${{ steps.extract.outputs.checkout }}"
          github_script="${{ steps.extract.outputs.github_script }}"
          upload_artifact="${{ steps.extract.outputs.upload_artifact }}"
          download_artifact="${{ steps.extract.outputs.download_artifact }}"
          cache="${{ steps.extract.outputs.cache }}"

          # Update all YAML files in templates/ (using find -exec for SC2044)
          find templates/ -name "*.yml" -type f -exec sh -c '
            for file do
              orig_hash=$(md5sum "$file" | cut -d" " -f1)

              sed -i \
                -e "s|actions/checkout@v[0-9]\+|actions/checkout@'"${checkout}"'|g" \
                -e "s|actions/github-script@v[0-9]\+|actions/github-script@'"${github_script}"'|g" \
                -e "s|actions/upload-artifact@v[0-9]\+|actions/upload-artifact@'"${upload_artifact}"'|g" \
                -e "s|actions/download-artifact@v[0-9]\+|actions/download-artifact@'"${download_artifact}"'|g" \
                -e "s|actions/cache@v[0-9]\+|actions/cache@'"${cache}"'|g" \
                "$file"

              new_hash=$(md5sum "$file" | cut -d" " -f1)
              if [ "$orig_hash" != "$new_hash" ]; then
                echo "Updated: $file"
              fi
            done
          ' sh {} +

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet templates/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes to templates"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git diff --stat templates/
          fi

      - name: Create branch and push
        if: steps.check.outputs.has_changes == 'true'
        id: branch
        run: |
          set -euo pipefail

          branch="auto/sync-action-versions-$(date +%Y%m%d%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$branch"
          git add templates/
          git commit -m "ci(deps): sync action versions to templates

          Automated sync from .github/workflows/ to templates/

          Updated versions:
          - actions/checkout: ${{ steps.extract.outputs.checkout }}
          - actions/github-script: ${{ steps.extract.outputs.github_script }}
          - actions/upload-artifact: ${{ steps.extract.outputs.upload_artifact }}
          - actions/download-artifact: ${{ steps.extract.outputs.download_artifact }}
          - actions/cache: ${{ steps.extract.outputs.cache }}"

          git push origin "$branch"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create PR
        if: steps.check.outputs.has_changes == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.app_token.outputs.token || github.token }}
          github-token: ${{ steps.app_token.outputs.token || github.token }}
        env:
          BRANCH: ${{ steps.branch.outputs.branch }}
          CHECKOUT_VERSION: ${{ steps.extract.outputs.checkout }}
          GITHUB_SCRIPT_VERSION: ${{ steps.extract.outputs.github_script }}
          UPLOAD_ARTIFACT_VERSION: ${{ steps.extract.outputs.upload_artifact }}
          DOWNLOAD_ARTIFACT_VERSION: ${{ steps.extract.outputs.download_artifact }}
          CACHE_VERSION: ${{ steps.extract.outputs.cache }}
        with:
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'sync-action-versions-pr',
              capabilities: ['pull-requests:write', 'contents:read']
            });
            const { owner, repo } = context.repo;
            const branch = process.env.BRANCH;
            const title = 'ci(deps): sync action versions to templates';
            const body = [
              'Automated PR to sync GitHub Action versions from `.github/workflows/` to `templates/.`',
              '',
              'This ensures templates stay in sync with Dependabot updates.',
              '',
              '**Updated versions:**',
              `- actions/checkout: \`${process.env.CHECKOUT_VERSION}\``,
              `- actions/github-script: \`${process.env.GITHUB_SCRIPT_VERSION}\``,
              `- actions/upload-artifact: \`${process.env.UPLOAD_ARTIFACT_VERSION}\``,
              `- actions/download-artifact: \`${process.env.DOWNLOAD_ARTIFACT_VERSION}\``,
              `- actions/cache: \`${process.env.CACHE_VERSION}\``
            ].join('\n');

            const { data: pr } = await withRetry((client) => client.rest.pulls.create({
              owner,
              repo,
              title,
              head: branch,
              base: context.ref.replace('refs/heads/', ''),
              body
            }));

            await withRetry((client) => client.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pr.number,
              labels: ['dependencies', 'github-actions']
            }));

            core.info(`Created PR #${pr.number}`);
