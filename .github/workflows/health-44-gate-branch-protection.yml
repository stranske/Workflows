name: Health 44 Gate Branch Protection

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read
  actions: write

env:
  ENFORCE_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN }}
  SNAPSHOT_DIR: gate-branch-protection

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: classify changed paths
    runs-on: ubuntu-latest
    outputs:
      is_docs_only: ${{ steps.classify.outputs.is-docs-only || 'false' }}
      classification_rationale: >-
        ${{ steps.classify.outputs.classification-rationale || 'path classifier unavailable' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: classify
        uses: ./.github/actions/path-classifier
        with:
          force-full: ${{ github.event_name != 'pull_request' }}

  enforce:
    needs: classify
    if: ${{ github.event_name != 'pull_request' || needs.classify.outputs.is_docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Compute state fingerprint
        id: fingerprint
        env:
          # Repo-variable storage requires a token with Variables permission.
          # GITHUB_TOKEN can't access actions/variables even with actions: write.
          # Prefer BRANCH_PROTECTION_TOKEN (already used downstream); fall back to
          # GITHUB_TOKEN — the helper handles 401/403 by skipping the optimization.
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.BRANCH_PROTECTION_TOKEN || github.token }}
          DEFAULT_BRANCH: >-
            ${{
              github.event.repository.default_branch ||
              github.event.pull_request.base.repo.default_branch ||
              'main'
            }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            {
              echo "should_run=true"
              echo "reason=pull-request-no-repo-variable"
              echo "current_hash="
              echo "prior_hash="
            } >> "$GITHUB_OUTPUT"
            printf '%s%s\n' \
              '{"should_run":"true","reason":"pull-request-no-repo-variable",' \
              '"current_hash":"","prior_hash":""}'
            exit 0
          fi

          python - <<'PY' > /tmp/state-fingerprint-inputs.json
          import hashlib
          import json
          import os

          with open(".github/config/required-contexts.json", encoding="utf-8") as handle:
              required_contexts = json.load(handle)
          context_hash = hashlib.sha256(
              json.dumps(required_contexts, sort_keys=True, separators=(",", ":")).encode("utf-8")
          ).hexdigest()
          payload = {
              "default_branch": os.environ.get("DEFAULT_BRANCH", "main"),
              "required_contexts_hash": context_hash,
          }
          print(json.dumps(payload, sort_keys=True))
          PY

          python scripts/state_fingerprint.py compare \
            --workflow "${GITHUB_WORKFLOW}" \
            --inputs "$(cat /tmp/state-fingerprint-inputs.json)" \
            --storage repo-variable

      - name: Report unchanged state skip
        if: steps.fingerprint.outputs.should_run == 'false'
        run: echo "Skipped - ${{ steps.fingerprint.outputs.reason }}"

      - name: Setup API client
        if: steps.fingerprint.outputs.should_run == 'true'
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}




      - name: Determine default branch
        id: default-branch
        if: steps.fingerprint.outputs.should_run == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'health-44-default-branch',
              capabilities: ['contents:read']
            });

            const payload = context.payload || {};
            const eventDefault = payload.repository?.default_branch
              || payload.pull_request?.base?.repo?.default_branch
              || payload.workflow_run?.repository?.default_branch
              || null;

            if (eventDefault && typeof eventDefault === 'string') {
              core.info(`Using default branch from event payload: ${eventDefault}`);
              core.setOutput('name', eventDefault);
              return;
            }

            const resolvedFallback = payload.repository?.default_branch || null;

            try {
              const response = await withRetry((client) => client.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              }));
              const resolved = response.data.default_branch || resolvedFallback;
              if (!resolved) {
                core.setFailed('Repository default branch not available');
                return;
              }
              core.setOutput('name', resolved);
            } catch (error) {
              const detail = error?.message || '';
              const status = error?.status || error?.response?.status;
              const rateLimited =
                status === 429 ||
                (status === 403 && /rate limit/i.test(detail));
              if (rateLimited) {
                if (!resolvedFallback) {
                  core.setFailed('Repository default branch not available');
                  return;
                }
                core.warning('Rate limit while resolving default branch.');
                core.warning(`Using fallback "${resolvedFallback}".`);
                core.setOutput('name', resolvedFallback);
              } else {
                throw error;
              }
            }

      - name: Export default branch variable
        if: steps.fingerprint.outputs.should_run == 'true'
        run: |
          echo "DEFAULT_BRANCH_NAME=${DEFAULT_BRANCH}" >> "$GITHUB_ENV"
        env:
          DEFAULT_BRANCH: >-
            ${{ steps.default-branch.outputs.name || github.event.repository.default_branch }}

      - uses: actions/setup-python@v6
        if: steps.fingerprint.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.fingerprint.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Log enforcement configuration
        if: steps.fingerprint.outputs.should_run == 'true'
        run: |
          if [ -z "${ENFORCE_TOKEN}" ]; then
            echo "BRANCH_PROTECTION_TOKEN is not configured; enforcement step will be skipped."
            echo "The verification step will still fail if Gate or Health 45 Agents Guard is"
            echo "not required on the default branch."
          elif [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            echo "BRANCH_PROTECTION_TOKEN detected but pull_request events run in dry-run mode."
            echo "Schedule and workflow_dispatch events will apply the desired configuration."
          else
            echo "BRANCH_PROTECTION_TOKEN detected; enforcement step will run before verification."
          fi

      - name: Enforce gate branch protection
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          env.ENFORCE_TOKEN != '' &&
          github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ env.ENFORCE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH_NAME }}
        run: |
          python tools/enforce_gate_branch_protection.py \
            --apply \
            --config .github/config/required-contexts.json \
            --no-clean \
            --snapshot "${SNAPSHOT_DIR}/enforcement.json"

      - name: Verify gate branch protection is required (admin scope)
        id: verify-admin
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          env.ENFORCE_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ env.ENFORCE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH_NAME }}
        run: |
          timeout 5m python tools/enforce_gate_branch_protection.py \
            --check \
            --require-strict \
            --config .github/config/required-contexts.json \
            --no-clean \
            --snapshot "${SNAPSHOT_DIR}/verification.json"

      - name: Verify gate branch protection is required (read-only)
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        if: >-
          steps.fingerprint.outputs.should_run == 'true' &&
          (env.ENFORCE_TOKEN == '' ||
          (github.event_name == 'pull_request' && steps.verify-admin.outcome != 'success'))
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ env.DEFAULT_BRANCH_NAME }}
        run: |
          python tools/enforce_gate_branch_protection.py \
            --check \
            --config .github/config/required-contexts.json \
            --no-clean \
            --snapshot "${SNAPSHOT_DIR}/verification.json"

      - name: Restore previous branch protection snapshots
        if: always() && steps.fingerprint.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_RUN_ID: ${{ github.run_id }}
        run: |
          if timeout 5m python .github/scripts/restore_branch_snapshots.py; then
            exit 0
          fi
          status=$?
          if [ "${status}" -eq 124 ]; then
            echo "[summary] Snapshot restore timed out; continuing without previous snapshots"
            exit 0
          fi
          exit "${status}"

      - name: Record unified guard summary
        if: always() && steps.fingerprint.outputs.should_run == 'true'
        env:
          HAS_ENFORCE_TOKEN: ${{ env.ENFORCE_TOKEN != '' }}
        run: |
          python .github/scripts/health_summarize.py \
            --signature-jobs .github/signature-fixtures/basic_jobs.json \
            --signature-expected .github/signature-fixtures/basic_hash.txt \
            --snapshot-dir "${SNAPSHOT_DIR}" \
            --has-enforce-token "${HAS_ENFORCE_TOKEN}" \
            --write-json "${SNAPSHOT_DIR}/health-summary.json" \
            --write-summary "${GITHUB_STEP_SUMMARY}"
      - name: Upload branch protection snapshots
        if: always() && steps.fingerprint.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: gate-branch-protection-${{ github.run_id }}
          path: ${{ env.SNAPSHOT_DIR }}
          if-no-files-found: ignore
