name: Maint 84 Prune Agent Stubs

on:
  schedule:
    # Weekly on Monday at 08:00 UTC (after Dependabot sweep, before metrics runs)
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview deletions without removing any files"
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

concurrency:
  group: maint-prune-agent-stubs-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prune:
    name: Prune closed-issue agent stubs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run pruner
        id: prune
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python scripts/prune_agent_stubs.py --repo stranske/Workflows --dry-run
          else
            python scripts/prune_agent_stubs.py --repo stranske/Workflows
            if ! git diff --quiet -- agents/; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Open or update the stub cleanup pull request
        if: steps.prune.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.OWNER_PR_PAT }}
          base: ${{ github.event.repository.default_branch }}
          branch: maint/prune-closed-agent-stubs
          add-paths: agents/*.md
          commit-message: "maint: prune closed-issue agent stubs"
          title: "maint: prune closed-issue agent stubs"
          body: |
            Maint 84 selected bootstrap stubs whose linked issues are closed.
            Review the deletions and required checks before merging.
