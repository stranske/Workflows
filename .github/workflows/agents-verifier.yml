# Thin caller for Agents Verifier - delegates to Workflows repo reusable workflow
# Verifies acceptance criteria were met and opens follow-up issues if not
#
# Triggers:
# - Label 'verify:checkbox' added to merged PR (opt-in checkbox verification)
# - Label 'verify:evaluate' added to merged PR (LLM-based evaluation)
# - Label 'verify:compare' added to merged PR (compare-based verification)
# - Manual dispatch from Actions tab (allows model/provider selection)
# Note: No longer runs automatically on every merge. Add a verify:* label to trigger.
#
# Explicit reusable secret allowlist (declared by workflow_call):
# - CODEX_AUTH_JSON: Authentication for Codex API
# - OPENAI_API_KEY: For OpenAI provider (optional, falls back to Claude/GitHub Models)
# - CLAUDE_API_STRANSKE: For Claude provider (optional, falls back to GitHub Models)
# - LANGSMITH_API_KEY: For LangSmith tracing (optional, enables trace URL generation)
# - Ensure repository/org secrets are configured for verification to work
#
# Note: Uses pull_request_target instead of pull_request to ensure secrets
# are available for PRs from forks after merge.
name: Agents Verifier

on:
  # Post-merge fork verification needs base-repo secrets. Only trusted github.sha
  # is executed; PR head/diff/artifacts are data. See the maintenance trust boundary.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify (must be merged)'
        required: true
        type: string
      mode:
        description: 'Verification mode'
        required: true
        type: choice
        options:
          - evaluate
          - checkbox
          - compare
        default: 'evaluate'
      model:
        description: >-
          Model override for evaluation. Leave empty to use slot 1.
          For stricter evaluation, use compare mode with different providers.
        required: false
        type: string
        default: ''
      model2:
        description: >-
          Second model for compare mode (cross-provider verification).
          Leave empty to use slot 2.
        required: false
        type: string
        default: ''
      evidence_profile:
        description: 'Bounded input limits; expanded retries documented input truncation only'
        required: false
        type: choice
        options: [standard, expanded]
        default: 'standard'
      provider:
        description: 'LLM provider override (auto uses slot order)'
        required: true
        type: choice
        options:
          - auto
          - github-models
          - openai
          - anthropic
        default: 'auto'

permissions: {}

concurrency:
  group: agents-verifier-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # Gate: only proceed if PR is merged AND has verify:* label (for label trigger)
  # Or if triggered manually via workflow_dispatch
  check:
    # Before checkout or secrets: require an authorized merged-PR label or dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       contains(fromJSON('["verify:checkbox", "verify:evaluate", "verify:compare"]'), github.event.label.name))
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      mode: ${{ steps.check.outputs.mode }}
      model: ${{ steps.check.outputs.model }}
      model2: ${{ steps.check.outputs.model2 }}
      provider: ${{ steps.check.outputs.provider }}
      pr_number: ${{ steps.check.outputs.pr_number }}
    steps:
      - name: Checkout retry helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false
      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}


      - name: Check trigger conditions
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  createTokenAwareRetry: async ({ github }) => ({
                    github,
                    withRetry: (fn) => fn(github),
                  }),
                };
            const { github: balancedGithub, withRetry } = await retryHelpers.createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'verifier',
              capabilities: ['read-repo'],
              minRemaining: 50,
            });
            github = balancedGithub;

            // Handle workflow_dispatch trigger
            if (context.eventName === 'workflow_dispatch') {
              const prNumber = context.payload.inputs.pr_number;
              const mode = context.payload.inputs.mode;
              const model = context.payload.inputs.model;
              const model2 = context.payload.inputs.model2 || '';
              const provider = context.payload.inputs.provider;

              // Verify PR exists and is merged
              try {
                const { data: pr } = await withRetry((client) => client.rest.pulls.get({
                  ...context.repo,
                  pull_number: parseInt(prNumber),
                }));

                if (!pr.merged) {
                  const msg = `PR #${prNumber} is not merged. Verifier only runs on merged PRs.`;
                  core.setFailed(msg);
                  core.setOutput('should_run', 'false');
                  return;
                }

                const logMsg = `Manual dispatch: PR #${prNumber}, mode=${mode}`;
                core.info(`${logMsg}, model=${model}, model2=${model2}, provider=${provider}`);
                core.setOutput('should_run', 'true');
                core.setOutput('mode', mode);
                core.setOutput('model', model);
                core.setOutput('model2', model2);
                core.setOutput('provider', provider);
                core.setOutput('pr_number', prNumber);
                return;
              } catch (err) {
                core.setFailed(`Failed to get PR #${prNumber}: ${err.message}`);
                core.setOutput('should_run', 'false');
                return;
              }
            }

            // Handle pull_request_target trigger (label added)
            const pr = context.payload.pull_request;
            const label = context.payload.label;

            // Must be a merged PR
            if (!pr || !pr.merged) {
              core.info('PR not merged; skipping verifier.');
              core.setOutput('should_run', 'false');
              return;
            }

            // Must be a verify:* label
            const labelName = label?.name || '';
            const verifyModes = {
              'verify:checkbox': 'checkbox',
              'verify:evaluate': 'evaluate',
              'verify:compare': 'compare',
            };

            const mode = verifyModes[labelName];
            if (!mode) {
              core.info(`Label '${labelName}' is not a verify trigger; skipping.`);
              core.setOutput('should_run', 'false');
              return;
            }

            core.info(`Verifier triggered with mode: ${mode}`);
            core.setOutput('should_run', 'true');
            core.setOutput('mode', mode);
            // For compare mode, use slot defaults (OpenAI + Claude)
            if (mode === 'compare') {
              core.setOutput('model', '');
              core.setOutput('model2', '');
            } else {
              core.setOutput('model', '');
              core.setOutput('model2', '');
            }
            core.setOutput('provider', '');
            core.setOutput('pr_number', pr.number.toString());

  verifier:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      models: read
    uses: stranske/Workflows/.github/workflows/reusable-agents-verifier.yml@main
    with:
      # Post-merge push workflows only: Gate is PR-only.
      ci_workflows: '["pr-11-ci-smoke.yml", "selftest-ci.yml"]'
      # Verification mode from label or manual input
      mode: ${{ needs.check.outputs.mode }}
      # PR number from label trigger or manual dispatch
      pr_number: ${{ needs.check.outputs.pr_number }}
      # Model selection (empty string uses default)
      model: ${{ needs.check.outputs.model }}
      # Provider selection (empty string uses default)
      provider: ${{ needs.check.outputs.provider }}
      # Second model for compare mode (empty string uses default)
      model2: ${{ needs.check.outputs.model2 }}
      # Standard aggregates available result rows; PASS alone does not prove two judges ran.
      # Expanded recovery needs a real truncation report and complete PASS from both slots.
      # Inspect both provider results before claiming dual-model acceptance.
      evidence_profile: ${{ inputs.evidence_profile || 'standard' }}
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CLAUDE_API_STRANSKE: ${{ secrets.CLAUDE_API_STRANSKE }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
      workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

  acceptance-gates:
    name: Prepare acceptance commands or required merge CI gate
    needs: verifier
    if: needs.verifier.outputs.should_run == 'true' && needs.verifier.outputs.verdict == 'UNVERIFIABLE_INPUT'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout trusted gate runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stranske/Workflows
          ref: ${{ needs.verifier.outputs.workflows_ref }}
          path: gate-runner
          persist-credentials: false
          sparse-checkout: scripts/runner_lib
      - name: Download trusted plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verifier-closure-plans-${{ github.run_id }}
          path: closure-plans
      - name: Checkout immutable merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verifier.outputs.target_sha }}
          path: acceptance-head
          persist-credentials: false
      - name: Run acceptance commands without workflow secrets
        timeout-minutes: 30
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path
          results = []
          for index, plan in enumerate(json.loads(Path('closure-plans/plans.json').read_text())):
              if plan.get('plan_error'):
                  continue
              if plan.get('gate_source') == 'required-ci' and not plan['commands']:
                  results.append({**plan, 'results': []})
                  continue
              source = Path(f'/tmp/closure-plan-{index}.json')
              output = Path(f'/tmp/closure-result-{index}.json')
              source.write_text(json.dumps(plan))
              subprocess.run([sys.executable, 'gate-runner/scripts/runner_lib/acceptance_gate.py',
                  '--prepare', '--plan', str(source), '--cwd', 'acceptance-head',
                  '--output', str(output)], check=True)
              results.append(json.loads(output.read_text()))
          Path('closure-results.json').write_text(json.dumps(results))
          PY
      - name: Upload merge gate results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verifier-closure-results-${{ github.run_id }}
          path: closure-results.json
          retention-days: 14

  close-sources:
    name: Apply verified source issue closure rule
    needs: [verifier, acceptance-gates]
    if: >-
      always() && needs.verifier.result == 'success' &&
      needs.verifier.outputs.should_run == 'true' &&
      needs.verifier.outputs.verdict != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      actions: read
    steps:
      - name: Checkout trusted closure code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: stranske/Workflows
          ref: ${{ needs.verifier.outputs.workflows_ref }}
          persist-credentials: false
      - name: Download closure plans
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verifier-closure-plans-${{ github.run_id }}
          path: closure-plans
      - name: Download merge gate results
        if: needs.verifier.outputs.verdict == 'UNVERIFIABLE_INPUT' && needs.acceptance-gates.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verifier-closure-results-${{ github.run_id }}
          path: closure-results
      - name: Close eligible source issues with rule receipt
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERDICT: ${{ needs.verifier.outputs.verdict }}
          TARGET_SHA: ${{ needs.verifier.outputs.target_sha }}
          PR_NUMBER: ${{ needs.verifier.outputs.pr_number }}
          CI_WORKFLOWS: '["pr-11-ci-smoke.yml", "selftest-ci.yml"]'
        with:
          script: |
            const fs = require('fs');
            const { queryVerifierCiResults } = require('./.github/scripts/verifier_ci_query.js');
            const { closeVerifiedSources } = require('./.github/scripts/verifier_closure.js');
            const workflows = JSON.parse(process.env.CI_WORKFLOWS).map(workflow_id => ({ workflow_id }));
            const ci = await queryVerifierCiResults({ github, context, core,
              targetSha: process.env.TARGET_SHA, workflows, includeHeadSha: true });
            const resultsPath = 'closure-results/closure-results.json';
            const closed = await closeVerifiedSources({ github, context, core,
              verdict: process.env.VERDICT, mergeSha: process.env.TARGET_SHA,
              prNumber: Number(process.env.PR_NUMBER), ci,
              plans: JSON.parse(fs.readFileSync('closure-plans/plans.json', 'utf8')),
              results: fs.existsSync(resultsPath) ? JSON.parse(fs.readFileSync(resultsPath, 'utf8')) : [] });
            core.info(`Closed source issues: ${closed.join(', ') || 'none'}`);
