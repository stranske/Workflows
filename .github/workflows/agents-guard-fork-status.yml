name: Agents Guard Fork Status Publisher

'on':
  # zizmor: ignore[dangerous-triggers] Trusted default-branch code only; no PR
  # checkout, artifacts, or cache; exact run-attempt/head binding is enforced.
  workflow_run:
    workflows:
      - Health 45 Agents Guard
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: >-
    ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow.path == '.github/workflows/agents-guard.yml' && github.event.workflow.id == github.event.workflow_run.workflow_id && format('agents-guard-status-{0}', github.event.workflow_run.head_sha) || format('agents-guard-fork-status-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish trusted fork Agents Guard status
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow.path == '.github/workflows/agents-guard.yml' && github.event.workflow.id == github.event.workflow_run.workflow_id }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/error_classifier.js
            .github/scripts/agents-guard-fork-status-publication.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/github-rate-limited-wrapper.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Publish exact-head Agents Guard status
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { publishGuardForkStatus } = require('./.github/scripts/agents-guard-fork-status-publication.js');
            await publishGuardForkStatus({ github, context, core });
