name: Agents 73 Dispatch Codex Belt Conveyor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the selected queue without invoking the conveyor'
        type: boolean
        default: true
      max_promotions:
        description: 'Maximum ready PRs to select (0–5)'
        type: number
        default: 2

permissions: {}

concurrency:
  group: agents-73-codex-belt-conveyor-dispatch
  cancel-in-progress: false

jobs:
  belt-scan-ready-prs:
    name: Scan belt promotion queue
    if: >-
      github.repository == 'stranske/Workflows' && github.ref_protected &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.dry_run && 'agent-standard' || 'agent-high-privilege' }}
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    outputs:
      items: ${{ steps.scan.outputs.items || '[]' }}
    env:
      MAX_PROMOTIONS: ${{ inputs.max_promotions }}
    steps:
      - name: Validate selection limit
        shell: bash
        run: |
          if [[ ! "$MAX_PROMOTIONS" =~ ^[0-5]$ ]]; then
            echo '::error::Maximum promotions must be an integer between 0 and 5.'
            exit 1
          fi
          if [[ "$MAX_PROMOTIONS" == '0' ]]; then
            echo 'No belt PRs requested.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout conveyor helpers
        if: inputs.max_promotions > 0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/agents/registry.yml
            .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Setup API client
        if: inputs.max_promotions > 0
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}
          service_bot_pat: ${{ !inputs.dry_run && secrets.SERVICE_BOT_PAT || '' }}
          actions_bot_pat: ${{ !inputs.dry_run && secrets.ACTIONS_BOT_PAT || '' }}
          owner_pr_pat: ${{ !inputs.dry_run && secrets.OWNER_PR_PAT || '' }}
          workflows_app_id: ${{ !inputs.dry_run && secrets.WORKFLOWS_APP_ID || '' }}
          workflows_app_private_key: ${{ !inputs.dry_run && secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}

      - name: Preflight API budget and identify ready belt PRs
        if: inputs.max_promotions > 0
        id: scan
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { ensureRateLimitWrapped } = require('./.github/scripts/github-rate-limited-wrapper.js');
            const { checkRateLimitStatus } = require('./.github/scripts/github-api-with-retry.js');
            const { identifyReadyBeltPRs } = require('./.github/scripts/agents_belt_scan.js');
            const api = await ensureRateLimitWrapped({ github, core, env: process.env });
            const status = await checkRateLimitStatus(api, {
              threshold: 0,
              // Keep the stricter of the former Init (250) and scan (200) budgets.
              reserveFraction: 0.15,
              estimatedCost: 250,
              failOpen: false,
              core,
              env: process.env,
            });
            core.setOutput('credential_pool_id', status.credentialPoolId || 'unknown');
            core.setOutput('rate_limit_state', status.state || 'unknown');
            if (!status.safe || status.state !== 'safe') {
              core.setOutput('items', '[]');
              const detail = status.error
                ? `probe failed for pool ${status.credentialPoolId || 'unknown'}: ${status.error}`
                : `pool ${status.credentialPoolId || 'unknown'} has ${status.remaining}/` +
                  `${status.limit}; ${status.requiredRemaining} required for reserve + forecast`;
              core.setFailed(`Belt scan deferred — ${detail}`);
              return;
            }
            await identifyReadyBeltPRs({ github: api, context, core, env: process.env });

  belt-conveyor:
    name: Promote belt PRs
    needs: belt-scan-ready-prs
    if: >-
      !inputs.dry_run && inputs.max_promotions > 0 &&
      needs.belt-scan-ready-prs.outputs.items != '' && needs.belt-scan-ready-prs.outputs.items != '[]'
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    strategy:
      matrix:
        pr: ${{ fromJSON(needs.belt-scan-ready-prs.outputs.items) }}
    uses: ./.github/workflows/agents-73-codex-belt-conveyor.yml
    with:
      issue: ${{ matrix.pr.issue || 0 }}
      branch: ${{ matrix.pr.branch }}
      pr_number: ${{ matrix.pr.pr }}
      head_sha: ${{ matrix.pr.head_sha }}
      dry_run: false
    secrets:
      ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT }}
