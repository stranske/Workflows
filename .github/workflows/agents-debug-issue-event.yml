name: Agents Debug Issue Event
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to inspect
        required: true
        type: string
      event_id:
        description: Optional issue event ID to inspect a specific label change
        required: false
        type: string

permissions:
  issues: read

jobs:
  debug_dump:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect issue and label event
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_ID: ${{ inputs.event_id }}
        with:
          script: |
            function positiveId(value, name) {
              const id = Number(value);
              if (!/^[1-9]\d*$/.test(value) || !Number.isSafeInteger(id)) {
                throw new Error(`${name} must be a positive integer`);
              }
              return id;
            }
            const issueNumber = positiveId(process.env.ISSUE_NUMBER, 'issue_number');
            const hasAgentPrefix = name => /^(agent|agents):/.test(name);
            const { data: issue } = await github.rest.issues.get({
              ...context.repo, issue_number: issueNumber,
            });
            if (issue.pull_request) throw new Error(`#${issueNumber} is a pull request`);
            const labels = issue.labels.map(label => typeof label === 'string' ? label : label.name);
            const report = {
              issue: issue.number,
              current_labels: labels,
              current_agent_labels: labels.filter(hasAgentPrefix),
            };
            if (process.env.EVENT_ID) {
              const id = positiveId(process.env.EVENT_ID, 'event_id');
              const { data: event } = await github.rest.issues.getEvent({
                ...context.repo, event_id: id,
              });
              if (event.issue?.number !== issueNumber || !['labeled', 'unlabeled'].includes(event.event)) {
                throw new Error(`Event ${id} must be a label change on issue #${issueNumber}`);
              }
              report.label_event = {
                id: event.id, action: event.event, label: event.label.name,
                agent_label: hasAgentPrefix(event.label.name),
              };
            }
            core.info(JSON.stringify(report));
