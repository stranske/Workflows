name: Dependabot Weekly Sweep (Consumers)

on:
  schedule:
    # Mondays after Dependabot weekly updates (UTC)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sweep:
    name: Enable Dependabot auto-merge
    runs-on: ubuntu-latest
    env:
      REPO_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT }}
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@v6

      - name: Load registered consumer repos
        run: |
          repos=$(python - <<'PY'
          from __future__ import annotations

          import re
          from pathlib import Path

          path = Path('.github/workflows/maint-68-sync-consumer-repos.yml')
          lines = path.read_text(encoding='utf-8').splitlines()

          start_index = None
          for index, line in enumerate(lines):
            if re.search(r'\bREGISTERED_CONSUMER_REPOS\s*:\s*\|\s*$', line):
              start_index = index + 1
              break

          if start_index is None:
            raise SystemExit('Could not find REGISTERED_CONSUMER_REPOS: | block')

          block_indent = None
          repos: list[str] = []
          for raw_line in lines[start_index:]:
            if raw_line.strip() == '':
              continue

            indent = len(raw_line) - len(raw_line.lstrip(' '))
            if block_indent is None:
              block_indent = indent

            if indent < (block_indent or 0):
              break

            value = raw_line.strip()
            if value:
              repos.append(value)

          print('\n'.join(repos))
          PY
          )
          {
            echo "REGISTERED_CONSUMER_REPOS<<EOF"
            echo "$repos"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Validate token
        run: |
          if [ -z "${REPO_TOKEN:-}" ]; then
            echo "::error::OWNER_PR_PAT or SERVICE_BOT_PAT is required for cross-repo merges."
            exit 1
          fi

      - name: Sweep consumer repos
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
        run: |
          set -euo pipefail

          repos=$(echo "$REGISTERED_CONSUMER_REPOS" | sed '/^$/d')

          while read -r repo; do
            echo "=== ${repo} ==="
              prs=$(gh pr list \
                --repo "$repo" \
                --author app/dependabot \
                --state open \
                --json number \
                --jq '.[].number' \
                || true)

            if [ -z "$prs" ]; then
              echo "No Dependabot PRs."
              continue
            fi

            for pr in $prs; do
              echo "Processing ${repo}#${pr}"

              auto_out=$(gh pr merge "$pr" --repo "$repo" --auto --merge 2>&1) || true
              echo "$auto_out"

              if echo "$auto_out" | grep -qi "Protected branch rules not configured"; then
                checks_json=$(gh pr view "$pr" \
                  --repo "$repo" \
                  --json statusCheckRollup,mergeable,mergeStateStatus)
                mergeable=$(echo "$checks_json" | jq -r '.mergeable')
                merge_state=$(echo "$checks_json" | jq -r '.mergeStateStatus')

                if [ "$mergeable" != "MERGEABLE" ]; then
                  echo "PR not mergeable; skipping."
                  continue
                fi
                if [ "$merge_state" = "BLOCKED" ]; then
                  echo "PR merge state blocked (reviews or policy required); skipping."
                  continue
                fi

                failed=$(echo "$checks_json" | jq -r '
                  [.statusCheckRollup[]
                   | select(
                      .status=="COMPLETED" and
                        (
                          .conclusion != "SUCCESS" and
                          .conclusion != "SKIPPED" and
                          .conclusion != "NEUTRAL"
                        )
                    )
                  ] | length
                ')
                pending=$(echo "$checks_json" | jq -r '
                  [.statusCheckRollup[] | select(.status != "COMPLETED")] | length
                ')

                if [ "$failed" -eq 0 ] && [ "$pending" -eq 0 ]; then
                  if ! gh pr merge "$pr" --repo "$repo" --merge; then
                    echo "Merge failed; continuing to next PR."
                    continue
                  fi
                else
                  echo "Checks pending or failing; leaving open."
                fi
              fi
            done
          done <<< "$repos"
