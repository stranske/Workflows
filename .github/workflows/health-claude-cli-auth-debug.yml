name: Health Claude CLI Auth Debug

# Throwaway workflow to isolate Claude Code CLI auth from keepalive plumbing.
# Delete after debugging is complete.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-auth-isolation-test:
    name: "Claude CLI auth (isolated)"
    runs-on: ubuntu-latest
    environment: agent-standard
    timeout-minutes: 10
    steps:
      # ── 1. Environment baseline ──────────────────────────────────
      - name: "1. Environment baseline"
        run: |
          echo "=== Runtime environment ==="
          echo "HOME=$HOME"
          echo "XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-<not set>}"
          echo "CI=${CI:-<not set>}"
          echo "GITHUB_ACTIONS=${GITHUB_ACTIONS:-<not set>}"
          echo "NODE_VERSION=$(node --version 2>&1 || echo 'none')"
          echo "NPM_VERSION=$(npm --version 2>&1 || echo 'none')"
          echo ""
          echo "=== Relevant env vars ==="
          env | grep -iE 'claude|anthropic' || echo "(none)"

      # ── 2. Install Claude Code CLI ───────────────────────────────
      - name: "2. Install Claude Code CLI"
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code 2>&1 | tail -5
          echo ""
          echo "Binary: $(which claude 2>&1 || echo 'NOT FOUND')"
          echo "Version: $(claude --version 2>&1 || echo 'unknown')"

      # ── 3. Discover where CLI expects auth ───────────────────────
      - name: "3. Check CLI help for auth clues"
        run: |
          set +e
          echo "=== claude --help (first 60 lines) ==="
          claude --help 2>&1 | head -60
          echo ""
          echo "=== Checking for auth/login/config subcommands ==="
          for cmd in "auth status" "auth whoami" "config list" "whoami"; do
            echo "--- claude $cmd ---"
            # shellcheck disable=SC2086  # intentional word-splitting of subcommand
            claude $cmd 2>&1 || true
            echo ""
          done

      # ── 4. Normalize and write credentials ──────────────────────
      - name: "4. Normalize and write credentials"
        env:
          AUTH_JSON: ${{ secrets.CLAUDE_AUTH_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${AUTH_JSON:-}" ]; then
            echo "::error::CLAUDE_AUTH_JSON secret is empty/missing"
            exit 1
          fi

          # Normalize: CLI expects "accessToken", some auth flows produce "token"
          NORMALIZED=$(python3 -c "
          import json, sys
          data = json.loads(sys.stdin.read())
          oauth = data.get('claudeAiOauth', {})
          if 'token' in oauth and 'accessToken' not in oauth:
              oauth['accessToken'] = oauth.pop('token')
              data['claudeAiOauth'] = oauth
              print('NORMALIZED: renamed token -> accessToken', file=sys.stderr)
          print(json.dumps(data))
          " <<< "$AUTH_JSON" 2> >(tee /dev/stderr))

          # Write to primary location (~/.claude/.credentials.json)
          # and legacy location (~/.config/claude-code/auth.json)
          for dir in "$HOME/.claude" "$HOME/.config/claude-code"; do
            mkdir -p "$dir"
            target="$dir/.credentials.json"
            [ "$dir" = "$HOME/.config/claude-code" ] && target="$dir/auth.json"
            printf '%s' "$NORMALIZED" > "$target"
            chmod 0600 "$target"
            echo "Written to: $target ($(wc -c < "$target") bytes)"
          done

          echo ""
          python3 << 'PYEOF'
          import json, pathlib
          p = pathlib.Path.home() / ".claude" / ".credentials.json"
          data = json.loads(p.read_text())
          SENSITIVE = {'accessToken', 'refreshToken', 'token', 'apiKey', 'api_key', 'sessionKey', 'access_token'}
          def describe(obj, indent=0):
              pfx = "  " * indent
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if isinstance(v, dict):
                          print(f"{pfx}{k}: (object, {len(v)} keys)")
                          describe(v, indent + 1)
                      elif isinstance(v, str):
                          if k in SENSITIVE:
                              print(f"{pfx}{k}: str len={len(v)} [REDACTED]")
                          else:
                              safe = v[:10] + "..." if len(v) > 12 else v
                              print(f"{pfx}{k}: str len={len(v)} [{safe}]")
                      elif isinstance(v, (int, float)):
                          print(f"{pfx}{k}: {type(v).__name__}={v}")
                      elif isinstance(v, bool):
                          print(f"{pfx}{k}: bool={v}")
                      elif v is None:
                          print(f"{pfx}{k}: null")
                      else:
                          print(f"{pfx}{k}: {type(v).__name__}")
          describe(data)
          PYEOF

          echo ""
          echo "=== All config directories ==="
          ls -la "$HOME/.claude/" 2>&1 || true
          ls -la "$HOME/.config/claude-code/" 2>&1 || true

      # ── 5. Check auth status after writing ───────────────────────
      - name: "5. Check auth status after writing config"
        run: |
          set +e
          echo "=== claude auth status ==="
          claude auth status 2>&1 || true
          echo ""
          echo "=== claude whoami ==="
          claude whoami 2>&1 || true
          echo ""
          echo "=== claude config list ==="
          claude config list 2>&1 || true

      # ── 6. Attempt minimal prompt ────────────────────────────────
      - name: "6. Run claude -p (minimal prompt)"
        run: |
          set +e
          echo "=== Attempt 1: claude -p ==="
          timeout 90 claude -p "Respond with exactly the word: AUTH_OK" 2>&1
          echo "Exit code: $?"
          echo ""

          echo "=== Attempt 2: claude -p --max-turns 1 ==="
          timeout 90 claude -p "Respond with exactly the word: AUTH_OK" --max-turns 1 2>&1
          echo "Exit code: $?"

      # ── 7. Check if credentials were modified by the CLI ─────────
      - name: "7. Check if CLI modified credentials (token refresh)"
        run: |
          echo "=== Checking for CLI-side token refresh ==="
          for f in "$HOME/.claude/.credentials.json" "$HOME/.config/claude-code/auth.json"; do
            if [ -f "$f" ]; then
              echo "$f:"
              echo "  Size: $(wc -c < "$f") bytes"
              echo "  Modified: $(stat -c %y "$f" 2>/dev/null || echo unknown)"
              python3 -c "
          import json
          with open('$f') as fh:
              data = json.load(fh)
          oauth = data.get('claudeAiOauth', {})
          tok = oauth.get('accessToken', oauth.get('token', ''))
          print(f'  accessToken length: {len(tok)}')
          print(f'  accessToken present: {bool(tok)}')
          exp = oauth.get('expiresAt', 'missing')
          print(f'  expiresAt: {exp}')
          " 2>/dev/null || echo "  (could not parse)"
              echo ""
            fi
          done

      # ── 8. Verbose/debug attempt ─────────────────────────────────
      - name: "8. Verbose run for debug output"
        run: |
          set +e
          echo "=== Running with --verbose flag ==="
          timeout 90 claude -p "Say OK" --verbose 2>&1 | head -80
          rc1=$?
          echo ""
          echo "Exit code: $rc1"
          echo ""
          echo "=== Trying CLAUDE_CODE_DEBUG=1 ==="
          CLAUDE_CODE_DEBUG=1 timeout 90 claude -p "Say OK" 2>&1 | head -80
          rc2=$?
          echo ""
          echo "Exit code: $rc2"
