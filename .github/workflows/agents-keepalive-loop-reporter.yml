name: Keepalive Loop Reporter

on:
  workflow_run:
    workflows: ["Agents Gate Followups", "Agents Keepalive Loop"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR whose current authority obligations should be replayed'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  resolve-target:
    name: Resolve reporter target
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      skip: ${{ steps.applicability.outputs.skip }}
      lock_pr_number: ${{ steps.applicability.outputs.lock_pr_number }}
      pr_number: ${{ steps.applicability.outputs.pr_number }}
      ordinary_target: ${{ steps.applicability.outputs.ordinary_target }}
    steps:
      - name: Checkout reporter classifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Classify unassociated dispatch
        id: applicability
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ github.token }}
          script: |
            const { classifyReporterRun } =
              require('./.github/scripts/keepalive_reporter_applicability.js');
            try {
              if (context.eventName === 'workflow_dispatch') {
                const resolved = Number(context.payload.inputs?.pr_number || 0);
                if (!Number.isSafeInteger(resolved) || resolved <= 0 ||
                    String(resolved) !== String(context.payload.inputs?.pr_number || '')) {
                  throw new Error('Authority replay requires a canonical positive PR number');
                }
                core.setOutput('skip', 'false');
                core.setOutput('lock_pr_number', String(resolved));
                core.setOutput('pr_number', String(resolved));
                core.setOutput('ordinary_target', 'false');
                return;
              }
              const result = await classifyReporterRun({
                github, owner: context.repo.owner, repo: context.repo.repo,
                run: context.payload.workflow_run,
              });
              const associated = Number(context.payload.workflow_run.pull_requests?.[0]?.number || 0);
              const resolved = Number(result.prNumber || associated || 0);
              if (result.status !== 'skip' &&
                  (!Number.isSafeInteger(resolved) || resolved <= 0)) {
                throw new Error('Reporter target did not resolve to a positive PR number');
              }
              core.setOutput('skip', result.status === 'skip' ? 'true' : 'false');
              core.setOutput('lock_pr_number', resolved > 0 ? String(resolved) : '');
              core.setOutput('pr_number', result.targetSource === 'ordinary-run-name' ?
                String(result.prNumber) : '');
              core.setOutput('ordinary_target',
                result.targetSource === 'ordinary-run-name' ? 'true' : 'false');
            } catch (error) {
              core.setFailed(`Reporter applicability unavailable: ${error.message}`);
            }

  report:
    name: Report keepalive completion
    needs: resolve-target
    if: >-
      needs.resolve-target.result == 'success' &&
      needs.resolve-target.outputs.skip != 'true' &&
      needs.resolve-target.outputs.lock_pr_number != '' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion != 'success' &&
      github.event.workflow_run.conclusion != 'skipped'))
    concurrency:
      group: keepalive-loop-reporter-${{ needs.resolve-target.outputs.lock_pr_number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout keepalive scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            .github/agents/registry.yml
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 1

      - name: Set up Node.js
        if: needs.resolve-target.outputs.skip != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Setup API client
        if: needs.resolve-target.outputs.skip != 'true'
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}

      - name: Mint KEEPALIVE_APP reporter token
        id: reporter_keepalive_app_token
        if: >-
          needs.resolve-target.outputs.skip != 'true' &&
          github.event.workflow_run.conclusion != 'success' &&
          env.KEEPALIVE_APP_ID != '' &&
          env.KEEPALIVE_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        continue-on-error: true
        env:
          KEEPALIVE_APP_ID: ${{ secrets.KEEPALIVE_APP_ID || '' }}
          KEEPALIVE_APP_PRIVATE_KEY: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY || '' }}
        with:
          client-id: ${{ env.KEEPALIVE_APP_ID }}
          private-key: ${{ env.KEEPALIVE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read

      - name: Mint WORKFLOWS_APP reporter token
        id: reporter_workflows_app_token
        if: >-
          needs.resolve-target.outputs.skip != 'true' &&
          github.event.workflow_run.conclusion != 'success' &&
          steps.reporter_keepalive_app_token.outputs.token == '' &&
          env.WORKFLOWS_APP_ID != '' &&
          env.WORKFLOWS_APP_PRIVATE_KEY != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        env:
          WORKFLOWS_APP_ID: ${{ secrets.WORKFLOWS_APP_ID || '' }}
          WORKFLOWS_APP_PRIVATE_KEY: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || '' }}
        with:
          client-id: ${{ env.WORKFLOWS_APP_ID }}
          private-key: ${{ env.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read

      - name: Require trusted keepalive reporter writer
        if: >-
          needs.resolve-target.outputs.skip != 'true' &&
          github.event.workflow_run.conclusion != 'success'
        env:
          KEEPALIVE_REPORTER_TOKEN: >-
            ${{
              steps.reporter_keepalive_app_token.outputs.token ||
              steps.reporter_workflows_app_token.outputs.token ||
              ''
            }}
        run: |
          if [ -z "$KEEPALIVE_REPORTER_TOKEN" ]; then
            echo "::error::A dedicated keepalive or Workflows App token is required to report trusted keepalive state."
            exit 1
          fi

      - name: Update summary for cancelled/failed runs
        id: update-summary
        if: >-
          needs.resolve-target.outputs.skip != 'true' &&
          github.event.workflow_run.conclusion != 'success'
        uses: actions/github-script@v9
        env:
          CLASSIFIED_PR_NUMBER: ${{ needs.resolve-target.outputs.pr_number || '' }}
          LOCK_PR_NUMBER: ${{ needs.resolve-target.outputs.lock_pr_number || '' }}
          CLASSIFIED_ORDINARY_TARGET: ${{ needs.resolve-target.outputs.ordinary_target || 'false' }}
          KEEPALIVE_SUMMARY_WRITER: >-
            ${{
              steps.reporter_keepalive_app_token.outputs.token != '' &&
              'stranske-keepalive[bot]' ||
              'agents-workflows-bot[bot]'
            }}
        with:
          github-token: >-
            ${{
              steps.reporter_keepalive_app_token.outputs.token ||
              steps.reporter_workflows_app_token.outputs.token
            }}
          script: |
            const run = context.payload?.workflow_run || {};
            const { replayReporterAuthority } =
              require('./.github/scripts/keepalive_reporter_applicability.js');
            const replayPrNumber = Number(
              process.env.LOCK_PR_NUMBER ||
              process.env.CLASSIFIED_PR_NUMBER ||
              run.pull_requests?.[0]?.number ||
              0
            );
            let replay = { results: [] };
            try {
              replay = await replayReporterAuthority({
                github, context, prNumber: replayPrNumber,
                writerLogin: process.env.KEEPALIVE_SUMMARY_WRITER || '',
              });
              core.info(`Authority replay outcomes: ${JSON.stringify(replay.results)}`);
            } catch (error) {
              if (context.eventName === 'workflow_dispatch') {
                throw error;
              }
              core.warning(
                `Authority replay failed: ${error.message}; continuing to reconciliation.`,
              );
            }
            if (context.eventName === 'workflow_dispatch') {
              return;
            }
            let prNumber = Number(
              run.pull_requests?.[0]?.number || process.env.CLASSIFIED_PR_NUMBER || 0
            );

            const conclusion = String(run.conclusion || run.status || '').toLowerCase();
            if (!conclusion || conclusion === 'success' || conclusion === 'skipped') {
              core.info(
                `Keepalive run conclusion=${conclusion || 'unknown'}; ` +
                'no post summary needed.'
              );
              return;
            }

            const { loadKeepaliveState } = require('./.github/scripts/keepalive_state.js');
            const { updateKeepaliveLoopSummary } = require('./.github/scripts/keepalive_loop.js');
            const { getWorkerExecutionEvidence } = require('./.github/scripts/keepalive_worker_evidence.js');
            const { recoverReporterAuthority } =
              require('./.github/scripts/keepalive_reporter_applicability.js');

            const workerEvidence = await getWorkerExecutionEvidence(
              github, context.repo.owner, context.repo.repo, run.id, run.run_attempt || 1,
              run.head_sha || ''
            );
            core.info(`Originating worker execution evidence: ${workerEvidence}`);
            if (workerEvidence === 'unknown') {
              core.setFailed('Originating worker execution evidence is unknown; retry this reporter');
              return;
            }
            let authorityRecovery;
            try {
              authorityRecovery = await recoverReporterAuthority({
                github, context, run, workerEvidence,
                writerLogin: process.env.KEEPALIVE_SUMMARY_WRITER || '', prNumber,
              });
            } catch (error) {
              core.setFailed(`Authority reconciliation unavailable: ${error.message}`);
              return;
            }
            prNumber = authorityRecovery.prNumber;
            const authorityTarget = authorityRecovery.authorityTarget;
            const ownerAttempt = authorityRecovery.ownerAttempt;
            core.info(
              `Attempt-bound authority reconciliation: ` +
              `${authorityRecovery.reconciliation?.status || authorityRecovery.status}`
            );
            if (['projected', 'superseded'].includes(authorityRecovery.status)) {
              return;
            }

            const { state } = await loadKeepaliveState({ github, context, prNumber, trace: '' });
            if (process.env.CLASSIFIED_ORDINARY_TARGET === 'true' &&
                state?.running_owner_attempt !== ownerAttempt) {
              core.info(
                'Ordinary dispatch target no longer belongs to the originating run attempt; ' +
                'skipping stale cleanup.'
              );
              return;
            }
            if (!state || state.running !== true) {
              core.info('Keepalive state not marked as running; skipping post summary.');
              return;
            }

            const inputs = {
              pr_number: prNumber,
              head_sha: authorityTarget?.state?.head_sha || run.head_sha || '',
              action: 'run',
              reason: '',
              agent_execution_started: workerEvidence === 'started' ? true :
                workerEvidence === 'not-started' ? false : '',
              authority_owner_attempt:
                ownerAttempt,
              gate_conclusion: state.gate_conclusion || '',
              iteration: state.iteration || 0,
              max_iterations: state.max_iterations || 0,
              failure_threshold: state.failure_threshold || 3,
              tasks_total: state.tasks?.total ?? 0,
              tasks_unchecked: state.tasks?.unchecked ?? 0,
              keepalive_enabled: state.keepalive_enabled ?? 'true',
              autofix_enabled: state.autofix_enabled ?? '',
              agent_type: state.agent_type || 'codex',
              trace: state.trace || '',
              run_result: conclusion,
              run_url: run.html_url || '',
              rounds_without_task_completion: state.rounds_without_task_completion || 0,
              trusted_summary_author: process.env.KEEPALIVE_SUMMARY_WRITER || '',
            };

            await updateKeepaliveLoopSummary({ github, context, core, inputs });
