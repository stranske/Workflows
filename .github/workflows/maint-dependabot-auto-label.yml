name: Auto-label Dependabot PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  label:
    # Dependabot and Renovate both produce dependency PRs that should carry agents:allow-change.
    if: github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Add agents:allow-change label
        run: gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "agents:allow-change"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
