name: Health 53 Scorecard

on:
  schedule:
    - cron: '30 1 * * 1'
  # push to the default branch and branch_protection_rule are required for
  # ossf/scorecard-action publish_results to update the public Scorecard API;
  # workflow_dispatch allows manual advisory runs.
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        continue-on-error: true  # advisory/report-only; a transient Scorecard
                                 # failure must not fail the whole workflow
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ hashFiles('results.sarif') != '' }}
        continue-on-error: true
        with:
          sarif_file: results.sarif
          category: scorecard
