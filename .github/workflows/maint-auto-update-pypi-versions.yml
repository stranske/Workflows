# Auto-update dev tool versions from PyPI
#
# This workflow ensures autofix-versions.env stays current with PyPI releases.
# Routine proposals run once each Monday and create at most one source PR.
#
# CRITICAL: This workflow MUST run before maint-52-sync-dev-versions.yml
# to ensure we never ship stale versions to consumer repos.

name: Maint Auto-Update PyPI Versions

on:
  schedule:
    # Monday 03:00 UTC, before the consumer propagation window.
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without creating PR'
        type: boolean
        default: false
      security_override:
        description: 'Allow a reviewed security update outside the routine weekly window'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-update:
    name: Check PyPI for updates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflows
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Enforce the canonical source proposal policy
        id: policy
        env:
          SECURITY_OVERRIDE: ${{ inputs.security_override }}
        run: |
          set -euo pipefail
          args=()
          if [ "$SECURITY_OVERRIDE" = "true" ]; then
            args+=(--security-override)
          fi
          python scripts/dev_tool_update_policy.py "${args[@]}" | tee /tmp/source_policy.txt
          cat /tmp/source_policy.txt >> "$GITHUB_OUTPUT"

      - name: Check for outdated versions
        id: check
        run: |
          echo "🔍 Checking PyPI for latest versions..."
          python scripts/update_versions_from_pypi.py --check 2>&1 | tee /tmp/check_output.txt
          # Script exits 0 even for outdated (use --fail-on-outdated for non-zero)
          # Check output directly for "outdated" to determine if updates are needed
          if grep -q "outdated" /tmp/check_output.txt; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/check_output.txt

      - name: Update versions
        id: update
        if: >-
          steps.check.outputs.has_updates == 'true'
          && steps.policy.outputs.should_propose == 'true'
          && inputs.dry_run != true
        run: |
          echo "📦 Updating autofix-versions.env with latest PyPI versions..."
          python scripts/update_versions_from_pypi.py --apply 2>&1 | tee /tmp/update_output.txt

          # Extract update summary for PR body
          {
            echo "summary<<EOF"
            cat /tmp/update_output.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Sync pyproject, lockfile, and templates
        if: >-
          steps.check.outputs.has_updates == 'true'
          && steps.policy.outputs.should_propose == 'true'
          && inputs.dry_run != true
        run: |
          echo "🔄 Syncing pyproject.toml + requirements.lock + templates"
          python scripts/sync_tool_versions.py --apply
          python scripts/sync_dev_dependencies.py --apply --lockfile --pre-commit

      # security_override may bypass the weekly window, but never this gate.
      - name: Validate synchronized pins before proposal
        if: >-
          steps.check.outputs.has_updates == 'true'
          && steps.policy.outputs.should_propose == 'true'
          && inputs.dry_run != true
        run: |
          set -euo pipefail
          echo "🧪 Validating synchronized pin surfaces before opening a source PR..."
          python scripts/sync_tool_versions.py --check
          python scripts/sync_dev_dependencies.py --check --lockfile --pre-commit

      - name: Create PR
        id: create_pr
        if: >-
          steps.check.outputs.has_updates == 'true'
          && steps.policy.outputs.should_propose == 'true'
          && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are actual changes
          if git diff --quiet -- \
            .github/workflows/autofix-versions.env \
            .pre-commit-config.yaml \
            pyproject.toml \
            requirements.lock \
            templates/consumer-repo/.github/workflows/autofix-versions.env \
            templates/integration-repo/.github/workflows/autofix-versions.env; then
            echo "No changes to commit"
            exit 0
          fi

          # One mutable source PR per weekly window. A security override uses
          # the same branch if the routine window already has a proposal.
          branch="auto/weekly-dev-tool-update-$(date +%G-W%V)"
          existing_pr=$(gh pr list --head "$branch" --state open --json number -q '.[0].number' || true)
          # A prior run can leave the weekly branch behind without an open PR.
          # Capture its remote tip when present so the force-with-lease below
          # is both retry-safe and able to refresh that branch.
          git fetch origin "$branch:refs/remotes/origin/$branch" 2>/dev/null || true
          expected_sha=""
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            expected_sha=$(git rev-parse "refs/remotes/origin/$branch")
          fi
          git checkout -B "$branch"

          # Commit changes
          git add \
            .github/workflows/autofix-versions.env \
            .pre-commit-config.yaml \
            pyproject.toml \
            requirements.lock \
            templates/consumer-repo/.github/workflows/autofix-versions.env \
            templates/integration-repo/.github/workflows/autofix-versions.env
          git commit -m "chore: update dev tool versions from PyPI

          Auto-generated by maint-auto-update-pypi-versions workflow.

          ${{ steps.update.outputs.summary }}"

          # Push and create or refresh the one source PR for this window.
          if [ -n "$expected_sha" ]; then
            git push --force-with-lease="refs/heads/$branch:$expected_sha" -u origin "$branch"
          else
            git push --force-with-lease -u origin "$branch"
          fi

          pr_body="## Summary

          This PR updates the pinned dev tool versions in \`autofix-versions.env\`.
          It matches the latest releases on PyPI.

          ### Changes
          \`\`\`
          ${{ steps.update.outputs.summary }}
          \`\`\`

          ### Why this matters
          Keeping dev tool versions current ensures:
          - Consumer repos receive the latest bug fixes and features
          - We don't ship known-vulnerable or outdated tooling
          - Version drift between repos is minimized

          ---
          *Auto-generated by the maint-auto-update-pypi-versions workflow*"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "chore: update dev tool versions from PyPI" --body "$pr_body"
            echo "source_pr=$existing_pr" >> "$GITHUB_OUTPUT"
          else
            new_pr=$(gh pr create \
              --title "chore: update dev tool versions from PyPI" \
              --body "$pr_body" \
              --label "dependencies" \
              --label "automation")
            # gh pr create prints the URL; extract the trailing number.
            echo "source_pr=${new_pr##*/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Supersede overlapping dependency-bot PRs
        if: >-
          steps.check.outputs.has_updates == 'true'
          && steps.policy.outputs.should_propose == 'true'
          && inputs.dry_run != true
          && steps.create_pr.outputs.source_pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_PR: ${{ steps.create_pr.outputs.source_pr }}
        run: |
          set -euo pipefail
          # Close open Dependabot/Renovate PRs that touch the Workflows-owned
          # pin surfaces only after the canonical source proposal exists.
          source_patches=$(mktemp)
          bot_patches=$(mktemp)
          trap 'rm -f "$source_patches" "$bot_patches"' EXIT
          gh pr diff "$SOURCE_PR" > "$source_patches"
          mapfile -t bot_prs < <(
            gh pr list --state open --limit 100 \
              --json number,author \
              --jq '.[] | select(
                  .author.login == "dependabot[bot]"
                  or .author.login == "renovate[bot]"
                ) | .number'
          )
          for pr in "${bot_prs[@]:-}"; do
            [ -n "$pr" ] || continue
            gh pr diff "$pr" > "$bot_patches"
            if python - "$source_patches" "$bot_patches" <<'PY'
          import re
          import sys
          from pathlib import Path

          MANAGED_PATHS = {
              ".github/workflows/autofix-versions.env",
              "pyproject.toml",
              "requirements.lock",
              "templates/consumer-repo/.github/workflows/autofix-versions.env",
              "templates/integration-repo/.github/workflows/autofix-versions.env",
          }


          def changed_pin_keys(path: str) -> set[str]:
              keys: set[str] = set()
              current_path = None
              for raw_line in Path(path).read_text(encoding="utf-8").splitlines():
                  if raw_line.startswith("diff --git a/"):
                      current_path = raw_line.split(" b/", 1)[-1]
                      continue
                  if current_path not in MANAGED_PATHS:
                      continue
                  if not raw_line.startswith(("+", "-")) or raw_line.startswith(("+++", "---")):
                      continue
                  line = raw_line[1:].strip()
                  match = re.match(r"([A-Za-z0-9_.-]+)(?:\[[^]]+\])?\s*(?:==|!=|~=|>=|<=|>|<|=)", line)
                  if match:
                      keys.add(match.group(1).lower().replace("_", "-"))
              return keys


          sys.exit(not bool(changed_pin_keys(sys.argv[1]) & changed_pin_keys(sys.argv[2])))
          PY
            then
              gh pr close "$pr" --comment "Superseded by canonical dev-tool source proposal #$SOURCE_PR. Workflows-owned pin updates land only through maint-auto-update-pypi-versions.yml."
              echo "Closed dependency-bot PR #$pr with an overlapping canonical pin update"
            fi
          done

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          echo "🔍 Dry run - would have made these updates:"
          python scripts/update_versions_from_pypi.py --check
