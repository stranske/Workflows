# ---------------------------------------------------------------------------
# Reusable Agents PR Health
# ---------------------------------------------------------------------------
# Periodic scanner for open PRs that detects merge conflicts and failing
# checks, then routes remediation to the coding agent that most recently
# worked on each PR.
#
# Designed to close the gap where:
#   - Branch sync only auto-resolves lock-file conflicts
#   - Autofix loop requires Gate to have run (impossible on conflicting PRs)
#   - No existing workflow periodically scans for stale/stuck PRs
#
# Integrates with:
#   - agents-keepalive-branch-sync.yml  (simple merges / lock files)
#   - reusable-codex-run.yml            (Codex agent for complex conflicts)
#   - reusable-claude-run.yml           (Claude agent for complex conflicts)
#   - agents-autofix-loop.yml           (failing check re-dispatch)
#   - .github/agents/registry.yml       (agent routing)
#
# Consumer repos call this via a thin wrapper: agents-pr-health.yml
#
# Architecture: scan → artifact upload (JSON files) → single jobs that
# loop (download artifact, iterate).  This avoids GitHub Actions' secret
# masking which silently suppresses job outputs containing substrings
# that match any repository secret.
#
# Required secrets:
#   - WORKFLOWS_APP_ID / WORKFLOWS_APP_PRIVATE_KEY (preferred)
#   - ACTIONS_BOT_PAT or SERVICE_BOT_PAT (fallback)
#   - CODEX_AUTH_JSON (for Codex agent dispatch)
#   - CLAUDE_CODE_OAUTH_TOKEN or CLAUDE_AUTH_JSON (for Claude agent dispatch)
# ---------------------------------------------------------------------------

name: Reusable Agents PR Health

on:
  workflow_call:
    inputs:
      dry_run:
        description: 'Preview mode — report but do not push or dispatch (true/false)'
        type: string
        default: 'false'
      max_prs:
        description: 'Maximum PRs to process per run'
        type: string
        default: '10'
      max_agent_dispatches:
        description: 'Maximum agent dispatches per run (cost guard)'
        type: string
        default: '3'
      skip_conflict_resolution:
        description: 'Skip conflict resolution (scan + report only) (true/false)'
        type: string
        default: 'false'
      skip_check_fix:
        description: 'Skip failing check re-dispatch (true/false)'
        type: string
        default: 'false'
      skip_stall_nudge:
        description: 'Skip stalled PR nudge (label rotation) (true/false)'
        type: string
        default: 'false'
      cron_interval_hours:
        description: >-
          Run interval in hours for scheduled triggers (0 = disabled).
          Set via repo variable PR_HEALTH_INTERVAL_HOURS to control
          frequency without a code change.
        type: string
        default: '1'
      is_scheduled_trigger:
        description: >-
          Whether this run was triggered by a cron schedule.
          Callers should pass: github.event_name == 'schedule'.
          Required because github.event_name inside a reusable
          workflow is always 'workflow_call', not the caller's event.
        type: string
        default: 'false'
    secrets:
      service_bot_pat:
        required: false
      ACTIONS_BOT_PAT:
        required: false
      WORKFLOWS_APP_ID:
        required: false
      WORKFLOWS_APP_PRIVATE_KEY:
        required: false
      CODEX_AUTH_JSON:
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false
      CLAUDE_AUTH_JSON:
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  # -----------------------------------------------------------------------
  # 0. Schedule gate — skip if this hour is not aligned to the interval
  # -----------------------------------------------------------------------
  gate:
    name: Schedule gate
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Evaluate schedule interval
        id: check
        env:
          INTERVAL: ${{ inputs.cron_interval_hours }}
          IS_SCHEDULED: ${{ inputs.is_scheduled_trigger }}
        run: |
          set -euo pipefail
          interval="${INTERVAL:-1}"

          # Validate interval — must be a non-negative integer.
          # Repo variables are free-text; guard against '6h', '6.0', etc.
          if ! [[ "$interval" =~ ^[0-9]+$ ]]; then
            echo "::warning::Invalid cron_interval_hours='$interval' — defaulting to 1"
            interval=1
          fi

          # Non-scheduled triggers (manual dispatch) always proceed.
          # Note: github.event_name inside a reusable workflow is always
          # 'workflow_call', so callers pass is_scheduled_trigger instead.
          if [ "$IS_SCHEDULED" != "true" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger — always proceeding"
            exit 0
          fi

          # Interval 0 = disabled
          if [ "$interval" = "0" ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "PR Health disabled (cron_interval_hours=0)"
            exit 0
          fi

          # Interval 1 = every hour (always aligned with hourly cron)
          if [ "$interval" = "1" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running every hour (interval=1)"
            exit 0
          fi

          # Check UTC hour alignment
          current_hour=$(date -u +%-H)
          remainder=$((current_hour % interval))
          if [ "$remainder" -ne 0 ]; then
            # Find the actual next aligned hour on a 24h clock.
            # Avoids the simple (n/i+1)*i%24 formula which is wrong
            # for intervals that don't evenly divide 24.
            next_hour="$current_hour"
            while :; do
              next_hour=$(( (next_hour + 1) % 24 ))
              if [ $((next_hour % interval)) -eq 0 ]; then
                break
              fi
            done
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping — UTC hour $current_hour not aligned to ${interval}h interval (next at hour $next_hour)"
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Running — UTC hour $current_hour aligned to ${interval}h interval"
          fi

  # -----------------------------------------------------------------------
  # 1. Scan all open PRs and categorise
  # -----------------------------------------------------------------------
  scan:
    name: Scan open PRs
    needs: gate
    if: needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      conflict_count: ${{ steps.categorise.outputs.conflict_count }}
      failing_count: ${{ steps.categorise.outputs.failing_count }}
      stalled_scan_count: ${{ steps.categorise.outputs.stalled_scan_count }}
      healthy_count: ${{ steps.categorise.outputs.healthy_count }}
      total_open: ${{ steps.categorise.outputs.total_open }}
      has_work: ${{ steps.categorise.outputs.has_work }}
    steps:
      - name: Mint GitHub App token (preferred)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Select authentication token
        id: auth
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT }}
          SERVICE_BOT_PAT: ${{ secrets.service_bot_pat }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
            echo "source=app-token" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACTIONS_BOT_PAT:-}" ]; then
            echo "token=$ACTIONS_BOT_PAT" >> "$GITHUB_OUTPUT"
            echo "source=actions-bot-pat" >> "$GITHUB_OUTPUT"
          elif [ -n "${SERVICE_BOT_PAT:-}" ]; then
            echo "token=$SERVICE_BOT_PAT" >> "$GITHUB_OUTPUT"
            echo "source=service-bot-pat" >> "$GITHUB_OUTPUT"
          else
            echo "token=$GITHUB_TOKEN_FALLBACK" >> "$GITHUB_OUTPUT"
            echo "source=github-token" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout Workflows helpers
        uses: actions/checkout@v7
        with:
          repository: stranske/Workflows
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Categorise PRs
        id: categorise
        uses: actions/github-script@v9
        env:
          MAX_PRS: ${{ inputs.max_prs }}
          MAX_DISPATCHES: ${{ inputs.max_agent_dispatches }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            // # best-effort: this ancillary API failure is logged; reconciliation or the primary workflow result remains authoritative.
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry, paginateWithRetry } = await createTokenAwareRetry({
              github, core, task: 'pr-health-scan',
            });

            const maxPrs = parseInt(process.env.MAX_PRS || '10', 10);
            const maxDispatches = parseInt(process.env.MAX_DISPATCHES || '3', 10);
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Paginate open PRs (handles repos with >100 open PRs)
            // Note: bound paginateWithRetry takes (method, params) — do NOT
            // pass github as the first arg (that's the module-level signature).
            const prs = await paginateWithRetry(
              github.rest.pulls.list,
              { owner, repo, state: 'open', per_page: 100 }
            );

            core.info(`Found ${prs.length} open PRs`);

            const conflictPrs = [];
            const failingPrs = [];
            let healthyCount = 0;

            for (const pr of prs) {
              if (pr.draft) continue;

              // Skip PRs with deleted head (e.g. deleted fork)
              if (!pr.head || !pr.head.ref) {
                core.warning(`PR #${pr.number} has no head ref (deleted fork?) — skipping`);
                continue;
              }

              // Determine agent from branch prefix
              const headRef = pr.head.ref;
              let agentType = 'codex'; // default
              if (headRef.startsWith('claude/')) {
                agentType = 'claude';
              } else if (headRef.startsWith('codex/')) {
                agentType = 'codex';
              }

              // Check mergeable state (may need a moment to compute)
              let mergeableState = pr.mergeable_state;
              let mergeable = pr.mergeable;

              core.info(`PR #${pr.number}: mergeable=${mergeable} (${typeof mergeable}), state=${mergeableState} (${typeof mergeableState})`);

              // If unknown, fetch individually to trigger computation
              if (mergeable == null || !mergeableState || mergeableState === 'unknown') {
                await new Promise(r => setTimeout(r, 1000));
                const { data: fresh } = await withRetry((client) =>
                  client.rest.pulls.get({
                    owner, repo, pull_number: pr.number,
                  })
                );
                mergeableState = fresh.mergeable_state;
                mergeable = fresh.mergeable;
              }

              const prInfo = {
                number: pr.number,
                head_ref: headRef,
                base_ref: pr.base.ref,
                agent_type: agentType,
                title: pr.title,
              };

              // Categorise: conflicting
              if (mergeable === false || mergeableState === 'dirty') {
                conflictPrs.push(prInfo);
                continue;
              }

              // Categorise: failing checks
              if (mergeableState === 'unstable' || mergeableState === 'blocked') {
                // Check combined status
                try {
                  const { data: status } = await withRetry((client) =>
                    client.rest.repos.getCombinedStatusForRef({
                      owner, repo, ref: pr.head.sha,
                    })
                  );
                  if (status.state === 'failure') {
                    failingPrs.push(prInfo);
                    continue;
                  }
                  // Also check check runs
                  const { data: checks } = await withRetry((client) =>
                    client.rest.checks.listForRef({
                      owner, repo, ref: pr.head.sha, per_page: 100,
                    })
                  );
                  const hasFailure = checks.check_runs.some(
                    cr => cr.conclusion === 'failure' && cr.name !== 'automerge'
                  );
                  if (hasFailure) {
                    failingPrs.push(prInfo);
                    continue;
                  }
                } catch (e) {
                  core.warning(`Could not check status for PR #${pr.number}: ${e.message}`);
                }
              }

              healthyCount++;
            }

            // Limit output — respect both max_prs (scan cap) and
            // max_agent_dispatches (cost guard for agent invocations).
            // Conflicts that need agents count toward the dispatch cap;
            // simple auto-merges are free so we keep all of those in the
            // list and let the loop step handle them.
            const limitedConflicts = conflictPrs.slice(0, Math.min(maxPrs, maxDispatches));
            const limitedFailing = failingPrs.slice(0, Math.min(maxPrs, maxDispatches));

            // ----- Second pass: detect stalled PRs with incomplete tasks -----
            function extractStatusSummary(body) {
              if (!body) return '';
              const startMarker = '<!-- auto-status-summary:start -->';
              const endMarker = '<!-- auto-status-summary:end -->';
              const start = body.indexOf(startMarker);
              const end = body.indexOf(endMarker);
              if (start === -1 || end === -1 || end <= start) return '';
              return body.slice(start + startMarker.length, end);
            }

            // Heading patterns that indicate an acceptance criteria section.
            // Cascade is disabled inside these sections — each criterion must
            // be independently verified.
            const ACCEPTANCE_HEADING_RE = [
              /acceptance\s*criteria/i,
              /definition\s*of\s*done/i,
              /done\s*criteria/i,
            ];

            /**
             * Count checkboxes with parent→child cascade, matching the
             * semantics of keepalive_loop.js:cascadeParentCheckboxes +
             * countCheckboxes.  When a parent checkbox is checked, all
             * indented children are treated as effectively checked — except
             * inside acceptance-criteria sections.
             */
            function countCheckboxes(markdown) {
              const result = { total: 0, checked: 0, unchecked: 0 };
              if (!markdown) return result;

              const lines = markdown.split('\n');
              const cbLineRe = /^(\s*)([-*+]|\d+[.)])\s*\[([ xX])\]/;
              let parentIndent = null;
              let inCodeBlock = false;
              let inAcceptanceSection = false;

              for (const line of lines) {
                // Toggle code fences
                if (/^\s*(`{3,}|~{3,})/.test(line)) {
                  inCodeBlock = !inCodeBlock;
                  parentIndent = null;
                  continue;
                }
                if (inCodeBlock) continue;

                // Detect section headings
                if (/^#{1,6}\s/.test(line)) {
                  parentIndent = null;
                  const stripped = line.replace(/^#{1,6}\s+/, '').replace(/\*\*/g, '').trim();
                  inAcceptanceSection = ACCEPTANCE_HEADING_RE.some(p => p.test(stripped));
                  continue;
                }

                const cbMatch = line.match(cbLineRe);
                if (!cbMatch) {
                  if (/^\s*$/.test(line)) parentIndent = null;
                  continue;
                }

                const indent = cbMatch[1].length;
                const directChecked = cbMatch[3].toLowerCase() === 'x';

                // Inside acceptance criteria — no cascade
                if (inAcceptanceSection) {
                  result.total += 1;
                  if (directChecked) { result.checked += 1; } else { result.unchecked += 1; }
                  continue;
                }

                // Cascade: child of a checked parent → effectively checked
                if (parentIndent !== null && indent > parentIndent) {
                  result.total += 1;
                  result.checked += 1; // cascaded
                  continue;
                }

                // Same or lesser indent — may be a new parent
                parentIndent = null;
                if (directChecked) parentIndent = indent;
                result.total += 1;
                if (directChecked) { result.checked += 1; } else { result.unchecked += 1; }
              }
              return result;
            }

            const BLOCKING_LABELS = ['agent:needs-attention', 'agent:rate-limited'];
            const PAUSE_LABELS = ['agents:pause', 'agents:paused'];
            const stalledPrs = [];

            for (const pr of prs) {
              if (pr.draft) continue;
              if (!pr.head || !pr.head.ref) continue;  // deleted fork

              const labels = (pr.labels || []).map(l => l.name);
              // Skip paused PRs — user intentionally paused
              if (labels.some(l => PAUSE_LABELS.includes(l))) continue;
              // Only consider PRs that carry a blocking label
              const blockingHits = labels.filter(l => BLOCKING_LABELS.includes(l));
              if (blockingHits.length === 0) continue;

              const statusBlock = extractStatusSummary(pr.body);
              const boxes = countCheckboxes(statusBlock);

              // Stalled = has incomplete checkboxes AND a blocking label
              if (boxes.unchecked > 0) {
                const headRef = pr.head.ref;
                let agentType = 'codex';
                if (headRef.startsWith('claude/')) agentType = 'claude';
                else if (headRef.startsWith('codex/')) agentType = 'codex';

                stalledPrs.push({
                  number: pr.number,
                  head_ref: headRef,
                  base_ref: pr.base.ref,
                  agent_type: agentType,
                  title: pr.title,
                  blocking_labels: blockingHits,
                  unchecked: boxes.unchecked,
                  total: boxes.total,
                  checked: boxes.checked,
                });
              }
            }

            const limitedStalled = stalledPrs.slice(0, Math.min(maxPrs, maxDispatches));
            const hasWork = limitedConflicts.length > 0 || limitedFailing.length > 0 || limitedStalled.length > 0;

            // Write PR data to files for artifact upload.
            // Avoid job outputs for structured data — GitHub Actions' secret masking
            // suppresses any output value containing substrings matching secrets.
            const fs = require('fs');
            fs.writeFileSync('/tmp/conflict_prs.json', JSON.stringify(limitedConflicts));
            fs.writeFileSync('/tmp/failing_prs.json', JSON.stringify(limitedFailing));
            fs.writeFileSync('/tmp/stalled_prs.json', JSON.stringify(limitedStalled));

            // Only scalar counts as outputs (safe from masking)
            core.setOutput('conflict_count', String(limitedConflicts.length));
            core.setOutput('failing_count', String(limitedFailing.length));
            core.setOutput('stalled_scan_count', String(stalledPrs.length));
            core.setOutput('healthy_count', String(healthyCount));
            core.setOutput('total_open', String(prs.length));
            core.setOutput('has_work', String(hasWork));

            core.info(`Conflicts: ${limitedConflicts.length}, Failing: ${limitedFailing.length}, Stalled: ${limitedStalled.length}, Healthy: ${healthyCount}`);

            // Step summary
            let summary = `## PR Health Scan\n\n`;
            summary += `| Metric | Count |\n|--------|-------|\n`;
            summary += `| Total open | ${prs.length} |\n`;
            summary += `| Conflicting | ${conflictPrs.length} |\n`;
            summary += `| Failing checks | ${failingPrs.length} |\n`;
            summary += `| Stalled (incomplete + blocked) | ${stalledPrs.length} |\n`;
            summary += `| Healthy | ${healthyCount} |\n\n`;

            if (limitedConflicts.length > 0) {
              summary += `### Conflicting PRs\n`;
              for (const pr of limitedConflicts) {
                summary += `- #${pr.number} (\`${pr.head_ref}\`) → agent: **${pr.agent_type}**\n`;
              }
              summary += '\n';
            }
            if (limitedFailing.length > 0) {
              summary += `### PRs with Failing Checks\n`;
              for (const pr of limitedFailing) {
                summary += `- #${pr.number} (\`${pr.head_ref}\`) → agent: **${pr.agent_type}**\n`;
              }
              summary += '\n';
            }
            if (limitedStalled.length > 0) {
              summary += `### Stalled PRs (incomplete tasks + blocking labels)\n`;
              for (const pr of limitedStalled) {
                summary += `- #${pr.number} (\`${pr.head_ref}\`) — ${pr.checked}/${pr.total} tasks ✓ — labels: ${pr.blocking_labels.join(', ')}\n`;
              }
            }
            core.summary.addRaw(summary);
            await core.summary.write();

      - name: Upload scan data
        if: steps.categorise.outputs.has_work == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: pr-health-scan-${{ github.run_id }}
          path: |
            /tmp/conflict_prs.json
            /tmp/failing_prs.json
            /tmp/stalled_prs.json
          retention-days: 1

  # -----------------------------------------------------------------------
  # 2. Resolve merge conflicts
  # -----------------------------------------------------------------------
  resolve-conflicts:
    name: Resolve conflicts
    needs: scan
    if: >-
      needs.scan.outputs.has_work == 'true'
      && needs.scan.outputs.conflict_count != '0'
      && inputs.skip_conflict_resolution != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (preferred)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Select authentication token
        id: auth
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACTIONS_BOT_PAT:-}" ]; then
            echo "token=$ACTIONS_BOT_PAT" >> "$GITHUB_OUTPUT"
          elif [ -n "${SERVICE_BOT_PAT:-}" ]; then
            echo "token=$SERVICE_BOT_PAT" >> "$GITHUB_OUTPUT"
          else
            echo "token=$GITHUB_TOKEN_FALLBACK" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT }}
          SERVICE_BOT_PAT: ${{ secrets.service_bot_pat }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}

      - name: Download scan data
        uses: actions/download-artifact@v8
        with:
          name: pr-health-scan-${{ github.run_id }}
          path: /tmp/scan-data

      - name: Checkout Workflows helpers
        uses: actions/checkout@v7
        with:
          repository: stranske/Workflows
          sparse-checkout: |
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Resolve each conflict
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            // # best-effort: this ancillary API failure is logged; reconciliation or the primary workflow result remains authoritative.
            const fs = require('fs');
            const conflicts = JSON.parse(fs.readFileSync('/tmp/scan-data/conflict_prs.json', 'utf8'));

            if (conflicts.length === 0) {
              core.info('No conflicts to resolve');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = process.env.DRY_RUN === 'true';

            for (const pr of conflicts) {
              core.info(`\n--- Processing PR #${pr.number} (${pr.head_ref}) ---`);

              try {
                // Try auto-merge (update branch)
                try {
                  await github.rest.pulls.updateBranch({
                    owner, repo,
                    pull_number: pr.number,
                  });
                  core.info(`PR #${pr.number}: Auto-merge succeeded`);
                  continue;
                } catch (mergeErr) {
                  core.info(`PR #${pr.number}: Auto-merge failed — ${mergeErr.message}`);
                }

                // Auto-merge failed — dispatch agent if not dry run
                if (dryRun) {
                  core.info(`PR #${pr.number}: [DRY RUN] Would dispatch ${pr.agent_type} agent`);
                  continue;
                }

                // Get current head SHA for the dispatch
                const { data: prData } = await github.rest.pulls.get({
                  owner, repo, pull_number: pr.number,
                });

                core.info(`PR #${pr.number}: Dispatching ${pr.agent_type} agent for conflict resolution`);

                await github.rest.repos.createDispatchEvent({
                  owner, repo,
                  event_type: `${pr.agent_type}-agent-fix`,
                  client_payload: {
                    pr_number: pr.number,
                    head_ref: pr.head_ref,
                    base_ref: pr.base_ref,
                    head_sha: prData.head.sha,
                    issue_type: 'merge-conflict',
                    agent_type: pr.agent_type,
                  },
                });
                core.info(`PR #${pr.number}: Agent dispatched`);

              } catch (err) {
                core.warning(`PR #${pr.number}: Failed — ${err.message}`);
              }
            }

            core.info(`\nProcessed ${conflicts.length} conflicting PRs`);

  # -----------------------------------------------------------------------
  # 3. Re-dispatch autofix for failing checks
  # -----------------------------------------------------------------------
  fix-checks:
    name: Fix failing checks
    needs: scan
    if: >-
      needs.scan.outputs.has_work == 'true'
      && needs.scan.outputs.failing_count != '0'
      && inputs.skip_check_fix != 'true'
      && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (preferred)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Select authentication token
        id: auth
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACTIONS_BOT_PAT:-}" ]; then
            echo "token=$ACTIONS_BOT_PAT" >> "$GITHUB_OUTPUT"
          elif [ -n "${SERVICE_BOT_PAT:-}" ]; then
            echo "token=$SERVICE_BOT_PAT" >> "$GITHUB_OUTPUT"
          else
            echo "token=$GITHUB_TOKEN_FALLBACK" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT }}
          SERVICE_BOT_PAT: ${{ secrets.service_bot_pat }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}

      - name: Download scan data
        uses: actions/download-artifact@v8
        with:
          name: pr-health-scan-${{ github.run_id }}
          path: /tmp/scan-data

      - name: Fix each failing PR
        uses: actions/github-script@v9
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            // # best-effort: this ancillary API failure is logged; reconciliation or the primary workflow result remains authoritative.
            const fs = require('fs');
            const failing = JSON.parse(fs.readFileSync('/tmp/scan-data/failing_prs.json', 'utf8'));

            if (failing.length === 0) {
              core.info('No failing PRs to fix');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            for (const pr of failing) {
              core.info(`\n--- Processing PR #${pr.number} (${pr.head_ref}) ---`);

              try {
                // Use keepalive loop which handles agent routing and can
                // trigger autofix internally.  We do NOT dispatch
                // agents-autofix-loop.yml directly because it requires
                // gate_run_id (a required input we cannot supply here).
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo,
                  workflow_id: 'agents-keepalive-loop.yml',
                  ref: pr.head_ref,
                  inputs: {
                    pr_number: String(pr.number),
                    force_retry: 'true',
                  },
                });
                core.info(`PR #${pr.number}: Dispatched keepalive loop (agent: ${pr.agent_type})`);

              } catch (err) {
                core.warning(`PR #${pr.number}: Failed to dispatch — ${err.message}`);
              }
            }

            core.info(`\nProcessed ${failing.length} failing PRs`);

  # -----------------------------------------------------------------------
  # 4. Nudge stalled PRs (add agent:retry, remove blocking labels)
  # -----------------------------------------------------------------------
  nudge-stalled:
    name: Nudge stalled PRs
    needs: scan
    if: >-
      needs.scan.outputs.has_work == 'true'
      && needs.scan.outputs.stalled_scan_count != '0'
      && inputs.skip_stall_nudge != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mint GitHub App token (preferred)
        id: app_token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}

      - name: Select authentication token
        id: auth
        run: |
          set -euo pipefail
          if [ -n "${APP_TOKEN:-}" ]; then
            echo "token=$APP_TOKEN" >> "$GITHUB_OUTPUT"
          elif [ -n "${ACTIONS_BOT_PAT:-}" ]; then
            echo "token=$ACTIONS_BOT_PAT" >> "$GITHUB_OUTPUT"
          elif [ -n "${SERVICE_BOT_PAT:-}" ]; then
            echo "token=$SERVICE_BOT_PAT" >> "$GITHUB_OUTPUT"
          else
            echo "token=$GITHUB_TOKEN_FALLBACK" >> "$GITHUB_OUTPUT"
          fi
        env:
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          ACTIONS_BOT_PAT: ${{ secrets.ACTIONS_BOT_PAT }}
          SERVICE_BOT_PAT: ${{ secrets.service_bot_pat }}
          GITHUB_TOKEN_FALLBACK: ${{ github.token }}

      - name: Download scan data
        uses: actions/download-artifact@v8
        with:
          name: pr-health-scan-${{ github.run_id }}
          path: /tmp/scan-data

      - name: Checkout Workflows helpers
        uses: actions/checkout@v7
        with:
          repository: stranske/Workflows
          sparse-checkout: |
            .github/scripts/error_classifier.js
            .github/scripts/github-api-with-retry.js
            .github/scripts/token_load_balancer.js
          sparse-checkout-cone-mode: false

      - name: Nudge each stalled PR
        uses: actions/github-script@v9
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ steps.auth.outputs.token }}
          script: |
            const fs = require('fs');
            const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { withRetry } = await createTokenAwareRetry({
              github, core, task: 'pr-health-nudge',
              capabilities: ['issues:write'],
            });

            const stalled = JSON.parse(fs.readFileSync('/tmp/scan-data/stalled_prs.json', 'utf8'));

            if (stalled.length === 0) {
              core.info('No stalled PRs to nudge');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const PAUSE_LABELS = ['agents:pause', 'agents:paused'];

            for (const pr of stalled) {
              core.info(`\n--- Nudging PR #${pr.number} (${pr.head_ref}) ---`);
              core.info(`Blocking labels: ${(pr.blocking_labels || []).join(', ')}`);
              core.info(`Tasks: ${pr.checked}/${pr.total} checked, ${pr.unchecked} unchecked`);

              try {
                // Re-fetch current labels to guard against race conditions
                // (PR may have been paused between scan and this job).
                const { data: currentLabels } = await withRetry((client) =>
                  client.rest.issues.listLabelsOnIssue({
                    owner, repo, issue_number: pr.number, per_page: 100,
                  })
                );
                const currentNames = currentLabels.map(l => l.name);
                if (currentNames.some(l => PAUSE_LABELS.includes(l))) {
                  core.info(`PR #${pr.number} is now paused — skipping nudge`);
                  continue;
                }

                if (dryRun) {
                  core.info(`PR #${pr.number}: [DRY RUN] Would add agent:retry and remove blocking labels`);
                  continue;
                }

                // Ensure agent:retry triggers a fresh labeled event.
                // If the label is already present, addLabels is a no-op and
                // no pull_request:labeled event fires.  Remove first (404-safe),
                // then re-add so the event always fires.
                try {
                  await withRetry((client) =>
                    client.rest.issues.removeLabel({
                      owner, repo, issue_number: pr.number,
                      name: 'agent:retry',
                    })
                  );
                  core.info(`PR #${pr.number}: Removed existing agent:retry label`);
                } catch (error) {
                  if (error.status === 404) {
                    core.info(`PR #${pr.number}: agent:retry not present — will add fresh`);
                  } else {
                    throw error;
                  }
                }
                await withRetry((client) =>
                  client.rest.issues.addLabels({
                    owner, repo, issue_number: pr.number,
                    labels: ['agent:retry'],
                  })
                );
                core.info(`PR #${pr.number}: Added label: agent:retry`);

                // Remove each blocking label (404-safe — label may already be gone)
                const blockingLabels = pr.blocking_labels || [];
                for (const label of blockingLabels) {
                  try {
                    await withRetry((client) =>
                      client.rest.issues.removeLabel({
                        owner, repo, issue_number: pr.number,
                        name: label,
                      })
                    );
                    core.info(`PR #${pr.number}: Removed label: ${label}`);
                  } catch (error) {
                    if (error.status === 404) {
                      core.info(`PR #${pr.number}: Label already absent: ${label}`);
                    } else {
                      throw error;
                    }
                  }
                }

                core.info(`PR #${pr.number}: Nudged successfully`);

              } catch (err) {
                core.warning(`PR #${pr.number}: Failed — ${err.message}`);
              }
            }

            core.info(`\nProcessed ${stalled.length} stalled PRs`);

  # -----------------------------------------------------------------------
  # 5. Summary
  # -----------------------------------------------------------------------
  summary:
    name: Health summary
    needs: [gate, scan, resolve-conflicts, fix-checks, nudge-stalled]
    if: always() && needs.gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        env:
          TOTAL: ${{ needs.scan.outputs.total_open }}
          CONFLICTS: ${{ needs.scan.outputs.conflict_count }}
          FAILING: ${{ needs.scan.outputs.failing_count }}
          STALLED_COUNT: ${{ needs.scan.outputs.stalled_scan_count }}
          HEALTHY: ${{ needs.scan.outputs.healthy_count }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFLICT_RESULT: ${{ needs.resolve-conflicts.result }}
          CHECK_RESULT: ${{ needs.fix-checks.result }}
          NUDGE_RESULT: ${{ needs.nudge-stalled.result }}
        run: |
          set -euo pipefail

          conflict_count="$CONFLICTS"
          failing_count="$FAILING"
          {
            echo "## PR Health Summary"
            echo ""
            if [ "$DRY_RUN" = "true" ]; then
              echo "> **DRY RUN** — no changes were pushed or dispatched"
              echo ""
            fi
            echo "| Category | Count | Action |"
            echo "|----------|-------|--------|"
            echo "| Total open PRs | $TOTAL | — |"
            echo "| Conflicting | $conflict_count | resolve-conflicts: **${CONFLICT_RESULT:-skipped}** |"
            echo "| Failing checks | $failing_count | fix-checks: **${CHECK_RESULT:-skipped}** |"
            echo "| Stalled (nudged) | ${STALLED_COUNT:-0} | nudge-stalled: **${NUDGE_RESULT:-skipped}** |"
            echo "| Healthy | $HEALTHY | — |"
          } >> "$GITHUB_STEP_SUMMARY"
