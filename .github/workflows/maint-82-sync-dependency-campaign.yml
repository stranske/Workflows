name: Sync/Dependency Campaign
# Watches dependency-bot PRs (renovate[bot]; legacy dependabot[bot]) + consumer
# sync drift. Internal identifiers (repository_dispatch type, concurrency group,
# and artifact/state-file names below) intentionally keep the historical
# "sync-dependabot-campaign" slug for dispatcher + persisted-state continuity.

on:
  schedule:
    # Remote discovery runs on GitHub capacity. The local watcher only starts
    # Codex when the campaign issue has a needs-local-codex queue item.
    - cron: "17 */6 * * *"
    # A focused pass after the usual weekly Dependabot update window.
    - cron: "30 10 * * 1"
  workflow_dispatch:
    inputs:
      repos:
        description: "Repos to inspect (comma-separated, or 'all')"
        required: false
        type: string
        default: "all"
      dry_run:
        description: "Preview the campaign issue without updating it"
        required: false
        type: boolean
        default: false
      max_repos:
        description: "Optional repo limit for testing; 0 means no limit"
        required: false
        type: string
        default: "0"
  repository_dispatch:
    types: [sync-dependabot-campaign]

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: sync-dependabot-campaign-${{ github.repository }}
  cancel-in-progress: false

jobs:
  campaign:
    name: Refresh campaign queue
    runs-on: ubuntu-latest
    env:
      CAMPAIGN_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load registered consumer repos
        id: registered
        run: |
          repos=$(python scripts/list_registered_consumer_repos.py --separator ',')
          echo "repos=${repos}" >> "$GITHUB_OUTPUT"

      - name: Compute current sync hash
        id: hash
        run: |
          hash=$({
            find templates/consumer-repo -type f -exec sha256sum {} \;
            find tools -name "*.py" -type f -exec sha256sum {} \; 2>/dev/null || true
            find scripts -name "*.py" -type f -exec sha256sum {} \; 2>/dev/null || true
            find scripts -name "*.sh" -type f -exec sha256sum {} \; 2>/dev/null || true
            find .github/scripts -type f -exec sha256sum {} \;
            sha256sum .github/sync-manifest.yml
          } | sort | sha256sum | cut -d' ' -f1)
          echo "hash=${hash:0:12}" >> "$GITHUB_OUTPUT"
          echo "Current sync hash: ${hash:0:12}"

      - name: Resolve inputs
        id: inputs
        env:
          DISPATCH_REPOS: ${{ github.event.client_payload.repos || '' }}
          DISPATCH_DRY_RUN: ${{ github.event.client_payload.dry_run || '' }}
          DISPATCH_MAX_REPOS: ${{ github.event.client_payload.max_repos || '' }}
          INPUT_REPOS: ${{ inputs.repos || '' }}
          INPUT_DRY_RUN: ${{ inputs.dry_run || false }}
          INPUT_MAX_REPOS: ${{ inputs.max_repos || '0' }}
        run: |
          repos="${DISPATCH_REPOS:-${INPUT_REPOS:-all}}"
          dry_run="${DISPATCH_DRY_RUN:-${INPUT_DRY_RUN:-false}}"
          max_repos="${DISPATCH_MAX_REPOS:-${INPUT_MAX_REPOS:-0}}"

          {
            echo "repos=${repos}"
            echo "dry_run=${dry_run}"
            echo "max_repos=${max_repos}"
          } >> "$GITHUB_OUTPUT"

      - name: Refresh campaign issue
        id: campaign
        uses: actions/github-script@v9
        env:
          REGISTERED_REPOS: ${{ steps.registered.outputs.repos }}
          REQUESTED_REPOS: ${{ steps.inputs.outputs.repos }}
          CAMPAIGN_DRY_RUN: ${{ steps.inputs.outputs.dry_run }}
          CAMPAIGN_MAX_REPOS: ${{ steps.inputs.outputs.max_repos }}
          CURRENT_SYNC_HASH: ${{ steps.hash.outputs.hash }}
        with:
          github-token: ${{ env.CAMPAIGN_TOKEN }}
          script: |
            const {
              formatCampaignRunSummaryMarkdown,
              runCampaign,
            } = require('./.github/scripts/sync_dependency_campaign.js');
            const fs = require('fs');

            const registeredRepos = process.env.REGISTERED_REPOS
              .split(',')
              .map((repo) => repo.trim())
              .filter(Boolean);
            const requestedRepos = process.env.REQUESTED_REPOS;
            const repos = !requestedRepos || requestedRepos === 'all'
              ? registeredRepos
              : requestedRepos.split(',').map((repo) => repo.trim()).filter(Boolean);
            const dryRun = process.env.CAMPAIGN_DRY_RUN === 'true';
            const maxRepos = Number(process.env.CAMPAIGN_MAX_REPOS) || 0;
            const currentSyncHash = process.env.CURRENT_SYNC_HASH;
            const deliveryHandoffRecords =
              context.payload.client_payload?.delivery_handoff_records || [];

            const result = await runCampaign({
              github,
              context,
              core,
              repos,
              dryRun,
              maxRepos,
              currentSyncHash,
              deliveryHandoffRecords,
            });

            const stats = result.state.stats || {};
            fs.writeFileSync(
              'sync-dependabot-campaign-state.json',
              `${JSON.stringify(result.state, null, 2)}\n`
            );
            fs.writeFileSync(
              'sync-dependabot-campaign-summary.md',
              formatCampaignRunSummaryMarkdown(result.state, result.issue)
            );
            const sourceSyncCounts = stats.source_sync_status_counts || {};
            const sourceSyncStates = ['current', 'superseded', 'unknown']
              .filter((status) => Number(sourceSyncCounts[status] || 0) > 0)
              .map((status) => `${status}=${Number(sourceSyncCounts[status] || 0)}`)
              .join(', ') || '-';
            const unpublishedResults = stats.items_unpublished_source_results || 0;
            await core.summary
              .addHeading('Sync/Dependency Campaign')
              .addList([
                `Current sync hash: ${result.state.current_sync_hash || '-'}`,
                `Repos checked: ${stats.repos_checked || 0}/${stats.repos_requested || 0}`,
                `Open sync PRs: ${stats.sync_prs_open || 0}`,
                `Open Dependabot PRs: ${stats.dependabot_prs_open || 0}`,
                `Active review threads queued: ${stats.active_review_threads || 0}`,
                `Items needing local Codex: ${stats.items_needing_local_codex || 0}`,
                `Actionable local Codex items: ${stats.items_actionable_local_codex || 0}`,
                `Claimable local Codex items: ${stats.items_claimable_local_codex || 0}`,
                `Source-fixed candidates: ${stats.items_source_fixed_candidates || 0}`,
                `Superseded sync candidates: ${stats.items_superseded_sync_candidates || 0}`,
                `Source sync states: ${sourceSyncStates}`,
                `Maint 71 handoffs observed: ${stats.delivery_handoffs_observed || 0}`,
                `Finished local results without published source changes: ${unpublishedResults}`,
                `Campaign issue: ${result.issue?.html_url || '(dry run)'}`,
              ])
              .write();

      - name: Upload campaign state
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: sync-dependabot-campaign-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            sync-dependabot-campaign-state.json
            sync-dependabot-campaign-summary.md
          if-no-files-found: warn
          retention-days: 30

      - name: Log watcher signal
        if: steps.campaign.outputs.needs_local_codex == 'true'
        run: |
          echo "Local Codex work is queued on ${{ steps.campaign.outputs.campaign_issue_url }}"
