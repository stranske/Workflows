# Backplane Contract Integrity - validates the run-contract/v1 contract set
#
# Workflows-internal gate (NOT a consumer workflow). Runs on PRs that touch the
# contract, schemas, registry, validator, or fixtures and asserts:
#   1. the three schemas are valid JSON Schema (draft 2020-12) and load;
#   2. config/backplane_participants.json validates against its meta-schema shape
#      (every participant has the required keys; contract_version is known;
#      excluded repos carry a reason; LMS is a candidate consumer, not active);
#   3. the bundled valid fixtures pass the validator and each invalid fixture
#      fails it (the validator self-test / self-smoke).
#
# Modeled on health-70-validate-sync-manifest.yml (validate -> upload -> comment).

name: Backplane Contract Integrity

on:
  pull_request:
    paths:
      - 'docs/contracts/run-contract-v1.md'
      - 'docs/contracts/research-backplane-contract.md'
      - 'docs/contracts/identity-map-conventions.md'
      - 'docs/contracts/document-identity-conventions.md'
      - 'docs/contracts/schemas/**'
      - 'config/backplane_participants.json'
      - 'scripts/validate_run_contract.py'
      - 'scripts/validate_backplane_registry.py'
      - 'tests/fixtures/backplane/**'
      - 'tests/contracts/**'
      - 'tests/test_backplane_registry.py'
      - 'docs/reports/backplane_registry_status.md'
      - '.github/workflows/health-78-backplane-contract.yml'
  push:
    branches: [main]
    paths:
      - 'docs/contracts/schemas/**'
      - 'config/backplane_participants.json'
      - 'scripts/validate_run_contract.py'
      - 'scripts/validate_backplane_registry.py'
      - 'docs/reports/backplane_registry_status.md'
      - 'tests/fixtures/backplane/**'
  # Weekly warning-only freshness surfacing (mirrors the langsmith contract's
  # scheduled path). Reference-run staleness is a ::warning:: here, not a failure,
  # so an aged reference baseline is visible on cadence without wedging CI. Use the
  # manual dispatch (enforce_freshness=true) for a deliberate freshness gate.
  schedule:
    - cron: '43 6 * * 1'
  workflow_dispatch:
    inputs:
      enforce_freshness:
        description: 'Fail the run on reference-run staleness (default: warning-only)'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  # publish-freshness-tracker maintains one marker-deduplicated issue.
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-integrity:
    name: Validate backplane contract integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install jsonschema rfc3339-validator rfc3986-validator pytest PyYAML

      - name: Validator self-smoke (schemas load + fixtures behave)
        run: |
          set -o pipefail
          mkdir -p artifacts/backplane-contract
          python scripts/validate_run_contract.py \
            --self-smoke \
            --require-bundled-fixtures \
            --registry config/backplane_participants.json \
            --schema-dir docs/contracts/schemas \
            --repo stranske/Workflows \
            tests/fixtures/backplane/valid_run.json \
            | tee artifacts/backplane-contract/self-smoke.txt

      - name: Registry lifecycle and evidence validation
        # Structural defects always fail. Reference-run staleness is warning-only
        # (surfaced as a ::warning:: annotation) unless a manual dispatch opts into
        # enforcement, so an expired freshness window never wedges the fleet.
        env:
          ENFORCE_FRESHNESS: ${{ github.event.inputs.enforce_freshness == 'true' }}
        run: |
          set -o pipefail
          enforce_flag=""
          if [ "${ENFORCE_FRESHNESS}" = "true" ]; then
            enforce_flag="--enforce-freshness"
          fi
          python scripts/validate_backplane_registry.py --json ${enforce_flag} \
            | tee artifacts/backplane-contract/registry-status.json

      - name: Publish freshness tracker
        id: publish-freshness-tracker
        # Turns the warning-only freshness report into one marker-deduplicated
        # tracker issue (docs/contracts/research-backplane-contract.md). Scheduled
        # and manual runs on main only; never PRs or pushes. always() keeps it
        # running when enforce_freshness=true makes validation exit nonzero.
        if: >-
          always() &&
          github.event_name != 'pull_request' &&
          github.event_name != 'push' &&
          github.ref_name == 'main'
        uses: actions/github-script@v9
        env:
          REPORT_PATH: artifacts/backplane-contract/registry-status.json
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        with:
          script: |
            const fs = require('fs');
            const os = require('os');
            const path = require('path');
            const { execFileSync } = require('child_process');
            const { withRetry, paginateWithRetry } = require('./.github/scripts/github-api-with-retry.js');
            const { owner, repo } = context.repo;
            const marker = '<!-- backplane-freshness-tracker:v1 -->';

            // Find the tracker by body marker, never by title. Search is eventually
            // consistent, so the label listing backs it up for back-to-back runs.
            const candidates = new Map();
            const search = await withRetry(() => github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:body "backplane-freshness-tracker:v1"`,
              per_page: 50,
            }));
            for (const item of search.data.items || []) candidates.set(item.number, item);
            const labelled = await paginateWithRetry(github, github.rest.issues.listForRepo, {
              owner, repo, state: 'all', labels: 'automated', per_page: 100,
            });
            for (const item of labelled) {
              if (!item.pull_request) candidates.set(item.number, item);
            }
            const matches = [...candidates.values()]
              .filter((item) => (item.body || '').includes(marker))
              .sort((a, b) => a.number - b.number);
            // Prefer the oldest open tracker; otherwise the oldest closed one.
            const existing = matches.find((item) => item.state === 'open') || matches[0] || null;
            if (matches.length > 1) {
              core.warning(`Found ${matches.length} marker trackers; using #${existing.number}.`);
            }

            const args = [
              'scripts/validate_backplane_registry.py',
              '--tracker-report', process.env.REPORT_PATH,
              '--run-url', process.env.RUN_URL,
              '--head-sha', process.env.HEAD_SHA,
              '--tracker-existing-state', existing ? existing.state : 'none',
            ];
            if (existing) {
              const bodyPath = path.join(os.tmpdir(), 'backplane-tracker-body.md');
              fs.writeFileSync(bodyPath, existing.body || '');
              args.push('--tracker-existing-body', bodyPath);
            }
            const plan = JSON.parse(execFileSync('python', args, { encoding: 'utf8' }));
            core.setOutput('decision', plan.decision);
            core.info(
              `decision=${plan.decision} blocking_count=${plan.blocking_count ?? 'n/a'} ` +
              `stale_count=${plan.stale_count ?? 'n/a'} drainable_count=${plan.drainable_count ?? 'n/a'}`
            );

            if (plan.decision === 'refuse') {
              // Never read an unusable report as "drained". A missing or malformed
              // report is a publisher defect, so fail loudly; blocking findings
              // already failed the validation step.
              if (plan.refuse_kind === 'report') {
                core.setFailed(`Freshness tracker refused: ${plan.reason}`);
              } else {
                core.warning(`Freshness tracker refused: ${plan.reason}`);
              }
              return;
            }
            const labels = ['automated'];
            if (plan.decision === 'create') {
              const created = await withRetry(() => github.rest.issues.create({
                owner, repo, title: plan.title, body: plan.body, labels,
              }));
              core.notice(`Opened backplane freshness tracker #${created.data.number}`);
              return;
            }
            if (plan.decision === 'close') {
              if (!existing || existing.state !== 'open') {
                core.notice('Backplane freshness fully drained (stale_count=0); no open tracker.');
                return;
              }
              await withRetry(() => github.rest.issues.update({
                owner, repo, issue_number: existing.number, body: plan.body,
              }));
              await withRetry(() => github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body: plan.comment,
              }));
              await withRetry(() => github.rest.issues.update({
                owner, repo, issue_number: existing.number, state: 'closed', state_reason: 'completed',
              }));
              core.notice(`Closed backplane freshness tracker #${existing.number}: fully drained`);
              return;
            }
            // update | reopen
            const update = { owner, repo, issue_number: existing.number, body: plan.body };
            if (plan.decision === 'reopen') update.state = 'open';
            await withRetry(() => github.rest.issues.update(update));
            await withRetry(() => github.rest.issues.addLabels({
              owner, repo, issue_number: existing.number, labels,
            }));
            core.notice(`${plan.decision === 'reopen' ? 'Reopened' : 'Updated'} backplane freshness tracker #${existing.number}`);

      - name: Registry status markdown freshness
        run: |
          python scripts/validate_backplane_registry.py \
            --check-status docs/reports/backplane_registry_status.md

      - name: Documented invalid-fixture smoke (must exit 1)
        run: |
          set +e
          python scripts/validate_run_contract.py \
            tests/fixtures/backplane/missing_cost.json \
            --registry config/backplane_participants.json \
            --schema-dir docs/contracts/schemas \
            --repo stranske/Pension-Data
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "Expected exit 1 for missing_cost.json, got $rc" >&2
            exit 1
          fi
          echo "OK: invalid fixture missing_cost.json exited 1 as required."

      - name: Contract test suite
        run: |
          set -o pipefail
          python -m pytest tests/contracts/ -q \
            | tee artifacts/backplane-contract/pytest.txt

      - name: Upload contract integrity report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          retention-days: 30
          name: backplane-contract-integrity
          path: artifacts/backplane-contract/
          if-no-files-found: warn

      - name: Comment on PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const defaultHelpers = {
              withRetry: (fn) => fn(),
              paginateWithRetry: (githubInstance, method, params) => {
                return githubInstance.paginate(method, params);
              },
            };
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : defaultHelpers;
            const { withRetry } = retryHelpers;
            const body = [
              '## Backplane Contract Integrity Failed',
              '',
              'A change to the `run-contract/v1` contract set (schemas, registry,',
              'validator, or fixtures) failed the Workflows-internal integrity gate.',
              '',
              'Check that:',
              '- the three schemas load as valid draft 2020-12 JSON Schema,',
              '- `config/backplane_participants.json` keeps the required shape',
              '  (role/status/contract_version; excluded repos carry a reason),',
              '- the valid fixtures still pass and the invalid fixtures still fail.',
              '',
              'See `docs/contracts/research-backplane-contract.md`.',
            ].join('\n');
            const createComment = () => {
              return github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            };
            await withRetry(createComment);
