name: Maint 69 Sync Integration Repo

# Push template updates to Workflows-Integration-Tests repository
# Triggered after template changes or manually

on:
  push:
    branches: [main]
    paths:
      - 'templates/integration-repo/**'
      - 'templates/consumer-repo/.github/workflows/agents-80-pr-event-hub.yml'
      - 'templates/consumer-repo/.github/workflows/agents-81-gate-followups.yml'
      - '.github/workflows/autofix-versions.env'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without pushing'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # Required to create failure notification issues

env:
  INTEGRATION_REPO: stranske/Workflows-Integration-Tests
  WORKFLOW_REF: stranske/Workflows/.github/workflows/reusable-10-ci-python.yml@main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    name: Sync integration-repo templates
    runs-on: ubuntu-latest
    outputs:
      token_available: ${{ steps.token.outputs.token_available }}
    steps:
      - name: Checkout Workflows repo
        uses: actions/checkout@v7
        with:
          path: workflows
          sparse-checkout: |
            templates/integration-repo
            templates/consumer-repo/.github/workflows/agents-80-pr-event-hub.yml
            templates/consumer-repo/.github/workflows/agents-81-gate-followups.yml
            .github/workflows/autofix-versions.env
            .github/actions/setup-api-client
            .github/scripts/github-api-with-retry.js
            .github/scripts/sync_tracker_state
            scripts/sync_dev_dependencies.py
          sparse-checkout-cone-mode: false

      - name: Prepare sync token
        id: token
        env:
          OWNER_PAT: ${{ secrets.OWNER_PR_PAT }}
          SERVICE_PAT: ${{ secrets.SERVICE_BOT_PAT }}
        run: |
          if [ -n "${OWNER_PAT}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "Using OWNER_PR_PAT token"
          elif [ -n "${SERVICE_PAT}" ]; then
            echo "token_available=true" >> "$GITHUB_OUTPUT"
            echo "Using SERVICE_BOT_PAT token"
          else
            echo "token_available=false" >> "$GITHUB_OUTPUT"
            echo "WARNING: No sync token available - sync will be skipped"
          fi

      - name: Clone Integration-Tests repo
        if: steps.token.outputs.token_available == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT }}
        run: |
          git clone --depth 1 \
            "https://x-access-token:${SYNC_TOKEN}@github.com/${INTEGRATION_REPO}.git" \
            integration-tests

      - name: Set up Python
        if: steps.token.outputs.token_available == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install uv
        if: steps.token.outputs.token_available == 'true'
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Apply template updates
        if: steps.token.outputs.token_available == 'true'
        run: |
          set -euo pipefail

          cd integration-tests

          # Sync ci.yml - replace __WORKFLOW_REF__ placeholder with actual reference
          if [ -f "../workflows/templates/integration-repo/.github/workflows/ci.yml" ]; then
            sed "s|__WORKFLOW_REF__|${WORKFLOW_REF}|g" \
              "../workflows/templates/integration-repo/.github/workflows/ci.yml" \
              > .github/workflows/ci.yml
            echo "✅ Updated ci.yml with workflow reference"
          fi

          # Sync autofix-versions.env from canonical workflow
          if [ -f "../workflows/.github/workflows/autofix-versions.env" ]; then
            cp "../workflows/.github/workflows/autofix-versions.env" \
              .github/workflows/autofix-versions.env
            echo "✅ Updated autofix-versions.env"
          fi

          # Align integration repo dev-tool pins with the canonical env before
          # regenerating the lock, otherwise reusable CI may install conflicting pins.
          if [ -f "pyproject.toml" ]; then
            python "../workflows/scripts/sync_dev_dependencies.py" \
              --apply \
              --pre-commit \
              --pin-file ".github/workflows/autofix-versions.env" \
              --pyproject "pyproject.toml"
            echo "✅ Synced pyproject.toml dev tool pins"
          fi

          # Sync notify-workflows.yml (handles bidirectional sync)
          if [ -f \
            "../workflows/templates/integration-repo/.github/workflows/notify-workflows.yml" \
          ]; then
            cp \
              "../workflows/templates/integration-repo/.github/workflows/notify-workflows.yml" \
              .github/workflows/notify-workflows.yml
            echo "✅ Updated notify-workflows.yml"
          fi

          # Sync consumer-template PR/keepalive hubs required for WIT PR automation.
          for workflow in agents-80-pr-event-hub.yml agents-81-gate-followups.yml; do
            src="../workflows/templates/consumer-repo/.github/workflows/${workflow}"
            if [ -f "${src}" ]; then
              cp "${src}" ".github/workflows/${workflow}"
              echo "✅ Updated ${workflow}"
            else
              echo "::error::Missing consumer-template workflow: ${src}"
              exit 1
            fi
          done

          # Sync scripts directory (if exists in templates)
          if [ -d "../workflows/templates/integration-repo/scripts" ]; then
            mkdir -p scripts
            cp -r "../workflows/templates/integration-repo/scripts/." scripts/
            echo "✅ Synced scripts directory from templates"
          fi

          # Regenerate requirements.lock to match updated autofix-versions.env
          if [ -f "pyproject.toml" ]; then
            echo "🔄 Regenerating requirements.lock with updated tool versions..."
            uv pip compile --python-version 3.12 --upgrade pyproject.toml \
              --extra test --extra dev --universal \
              --output-file requirements.lock
            echo "✅ Updated requirements.lock"
          fi

      - name: Check for changes
        if: steps.token.outputs.token_available == 'true'
        id: changes
        run: |
          cd integration-tests

          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes needed"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected:"
            git --no-pager diff --stat
          fi

      - name: Show diff in dry run
        if: |
          steps.token.outputs.token_available == 'true' &&
          steps.changes.outputs.has_changes == 'true' &&
          inputs.dry_run == true
        run: |
          cd integration-tests
          echo "## Dry Run - Changes Preview" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`diff" >> "$GITHUB_STEP_SUMMARY"
          git --no-pager diff >> "$GITHUB_STEP_SUMMARY" || true
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push changes
        if: |
          steps.token.outputs.token_available == 'true' &&
          steps.changes.outputs.has_changes == 'true' &&
          inputs.dry_run != true
        run: |
          cd integration-tests

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows/ pyproject.toml requirements.lock scripts/
          if [ -f .pre-commit-config.yaml ]; then
            git add .pre-commit-config.yaml
          fi
          git commit \
            -m "sync: Update workflow templates from stranske/Workflows" \
            -m "" \
            -m "This sync updates integration-repo templates to match the source" \
            -m "of truth in the Workflows repository." \
            -m "" \
            -m "Updated files:" \
            -m "- ci.yml (with workflow reference)" \
            -m "- autofix-versions.env (version pins)" \
            -m "- notify-workflows.yml (bidirectional sync trigger)" \
            -m "- agents-80-pr-event-hub.yml (consumer PR event hub)" \
            -m "- agents-81-gate-followups.yml (consumer Gate followups hub)" \
            -m "- scripts/ (synced from templates)" \
            -m "- requirements.lock (regenerated with updated tool versions)" \
            -m "" \
            -m "Auto-synced by:" \
            -m "https://github.com/stranske/Workflows/actions/workflows/" \
            -m "maint-69-sync-integration-repo.yml"

          if git push; then
            echo "✅ Successfully pushed changes to ${INTEGRATION_REPO}"
            echo "## Sync Successful" >> "$GITHUB_STEP_SUMMARY"
            echo "Changes pushed to ${INTEGRATION_REPO}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Failed to push changes"
            exit 1
          fi

      - name: Summary
        run: |
          {
            echo "## Integration Repo Sync"
            echo ""
            echo "**Target repo:** ${INTEGRATION_REPO}"
            echo ""
            if [ "${{ steps.token.outputs.token_available }}" != "true" ]; then
              echo "❌ Sync skipped - no token available"
            elif [ "${{ steps.changes.outputs.has_changes }}" != "true" ]; then
              echo "✅ No changes needed - already in sync"
            elif [ "${{ inputs.dry_run }}" = "true" ]; then
              echo "✅ Dry run complete - see diff above"
            else
              echo "✅ Sync complete - templates pushed to Integration-Tests"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup API client
        if: >-
          steps.token.outputs.token_available == 'true' &&
          inputs.dry_run != true &&
          success()
        uses: ./workflows/.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          install_dir: workflows/.github/scripts

      - name: Resolve recovered integration sync alert
        if: >-
          steps.token.outputs.token_available == 'true' &&
          inputs.dry_run != true &&
          success()
        uses: actions/github-script@v9
        with:
          script: |
            const { createTokenAwareRetry } = require(
              './workflows/.github/scripts/github-api-with-retry.js'
            );
            const { github: api, withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-69-resolve-integration-sync-alert',
              capabilities: ['issues:write'],
            });
            const {
              appendTrackerComment,
              clearStuckWindowBody,
              extractDurableTrackerHeader,
              findOrCreateTracker,
              updateTrackerBody,
            } = require('./workflows/.github/scripts/sync_tracker_state');
            const alert = await findOrCreateTracker({
              github: api,
              context,
              label: 'integration-sync-failure',
              titlePattern: /^🚨 Integration-Tests Sync Failed/,
              createIfMissing: false,
              core,
              withRetry,
            });
            if (!alert) {
              return;
            }
            let recoveredBody = clearStuckWindowBody(alert.body || '');
            const durableHeader = extractDurableTrackerHeader(recoveredBody);
            if (durableHeader) {
              recoveredBody = recoveredBody
                .replace(durableHeader, '')
                .replace(/\n{3,}/g, '\n\n')
                .trim();
            }
            await updateTrackerBody({
              github: api,
              context,
              tracker: alert,
              title: '✅ Integration-Tests Sync Recovered',
              newBody: recoveredBody,
              preserveDurableHeader: false,
              core,
              withRetry,
            });
            await appendTrackerComment({
              github: api,
              context,
              tracker: alert,
              core,
              withRetry,
              comment: `### ✅ Integration sync recovered\n\n${context.workflow} run ${context.runId} completed successfully. This transient alert is now resolved.`,
            });
            try {
              await withRetry((client) => client.rest.issues.removeLabel({
                ...context.repo,
                issue_number: alert.number,
                name: 'tracker:durable',
              }));
            } catch (error) {
              // # best-effort: legacy alerts may never have carried the durable label.
              if (error.status !== 404) throw error;
            }
            await withRetry((client) => client.rest.issues.update({
              ...context.repo,
              issue_number: alert.number,
              state: 'closed',
              state_reason: 'completed',
            }));

  # ============================================================================
  # FAILURE NOTIFICATION: Create issue when sync fails
  # ============================================================================
  # Catches both auth failures (expired/invalid PAT at git push) and the
  # silent-skip case (no token available). Without this, red runs on this
  # workflow have historically gone unnoticed for weeks while drift accumulates.
  notify-failure:
    name: Create failure issue
    needs: [sync]
    runs-on: ubuntu-latest
    if: failure() || needs.sync.outputs.token_available == 'false'
    steps:
      - name: Determine failure reason
        id: failure
        env:
          SYNC_RESULT: ${{ needs.sync.result }}
          TOKEN_AVAILABLE: ${{ needs.sync.outputs.token_available }}
        run: |
          if [ "$TOKEN_AVAILABLE" = "false" ]; then
            echo "reason=missing-token" >> "$GITHUB_OUTPUT"
            echo "summary=No sync PAT available - sync was skipped" >> "$GITHUB_OUTPUT"
          elif [ "$SYNC_RESULT" = "failure" ]; then
            echo "reason=sync-failed" >> "$GITHUB_OUTPUT"
            echo "summary=Sync job failed (likely expired PAT or push error)" >> "$GITHUB_OUTPUT"
          else
            echo "reason=unknown" >> "$GITHUB_OUTPUT"
            echo "summary=Sync workflow concluded with non-success status" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tracker helper
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/sync_tracker_state
          sparse-checkout-cone-mode: false

      - name: Create or update failure issue
        uses: actions/github-script@v9
        env:
          FAILURE_REASON: ${{ steps.failure.outputs.reason }}
          FAILURE_SUMMARY: ${{ steps.failure.outputs.summary }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref_name }}
        with:
          script: |
            const {
              appendTrackerComment,
              findOrCreateTracker,
              markStuckWindowBody,
              parseStuckWindow,
              updateTrackerBody,
            } = require('./.github/scripts/sync_tracker_state');
            const title = '🚨 Integration-Tests Sync Failed - Action Required';
            const now = new Date().toISOString();
            const baseBody = `## 🚨 Integration-Tests Sync Failed

            > **Transient alert** — this issue remains open only while the integration sync is failing. The next successful non-dry run closes it automatically.

            The maint-69 sync workflow failed to push template updates to \`stranske/Workflows-Integration-Tests\`.

            ### Failure Details
            - **Reason:** ${process.env.FAILURE_SUMMARY}
            - **Trigger:** Push to \`${process.env.TRIGGER_REF}\` (${(process.env.TRIGGER_SHA || '').slice(0, 7)})
            - **Run:** [View workflow run](${process.env.RUN_URL})
            - **Time:** ${now}

            ### Impact
            \`Workflows-Integration-Tests\` is NOT receiving the latest templates, autofix version pins, or scripts. Drift will accumulate until this is fixed and the next push to \`templates/integration-repo/**\` or \`.github/workflows/autofix-versions.env\` re-triggers the sync.

            ### Common Causes
            1. **Expired PAT** — \`OWNER_PR_PAT\` or \`SERVICE_BOT_PAT\` rotated / expired. Push step fails with \`Authentication failed\`.
            2. **Missing PAT** — neither secret is set; sync skipped at the \`Prepare sync token\` step (\`token_available=false\`).
            3. **Lock regeneration error** — \`uv pip compile\` fails on the integration repo's \`pyproject.toml\`.

            ### Resolution Steps
            1. Open the [failed run](${process.env.RUN_URL}) and check the \`Commit and push\` step for the actual error.
            2. If auth failed: rotate \`OWNER_PR_PAT\` (preferred) or \`SERVICE_BOT_PAT\` in repo secrets.
            3. Re-trigger: \`gh workflow run 'Maint 69 Sync Integration Repo' --repo ${context.repo.owner}/${context.repo.repo}\`
            4. Confirm the next successful non-dry run closes this alert automatically.

            ---
            *Automatically created by the maint-69 failure handler.*`;

            const existing = await findOrCreateTracker({
              github,
              context,
              label: 'integration-sync-failure',
              titlePattern: /^🚨 Integration-Tests Sync Failed/,
              createIfMissing: false,
              core,
            });
            const since = parseStuckWindow(existing?.body || '')?.since || now;
            const body = markStuckWindowBody(baseBody, since, {
              updatedAt: now,
              reason: process.env.FAILURE_REASON,
            });
            const tracker = await findOrCreateTracker({
              github,
              context,
              label: 'integration-sync-failure',
              titlePattern: /^🚨 Integration-Tests Sync Failed/,
              title,
              body,
              labels: ['bug'],
              durable: false,
              core,
            });
            if (tracker.sync_tracker_created) {
              core.warning(`Created new integration sync failure tracker #${tracker.number}`);
              return;
            }
            await updateTrackerBody({
              github,
              context,
              tracker,
              newBody: body,
              title,
              preserveDurableHeader: false,
              core,
            });
            await appendTrackerComment({
              github,
              context,
              tracker,
              core,
              comment: `### 🔄 Sync failed again

            - **Run:** [View workflow run](${process.env.RUN_URL})
            - **Reason:** ${process.env.FAILURE_SUMMARY}
            - **Time:** ${now}

            The sync workflow continues to fail. Please investigate.`,
            });
            core.warning(`Updated existing integration sync failure tracker #${tracker.number}`);
