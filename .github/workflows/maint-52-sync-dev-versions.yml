name: Maint 52 Sync Dev Versions

# Sync dev tool versions from Workflows autofix-versions.env to consumer repos
#
# This workflow ensures all consumer repos use consistent dev tool versions
# (ruff, mypy, pytest, etc.) by updating their pyproject.toml files.
#
# Freshness is reported here for visibility, but it is not a sync blocker.
# maint-auto-update-pypi-versions.yml owns opening source PRs when newer PyPI
# versions exist.
#
# If a repo has pyproject.toml but no dev dependencies, it will add them.
#
# Triggered:
# - When autofix-versions.env changes in Workflows
# - Weekly schedule to catch any drift
# - Manual dispatch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/autofix-versions.env'
  schedule:
    # Weekly on Sundays at 5:00 UTC
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos to sync (empty for all registered)'
        type: string
        required: false
      dry_run:
        description: 'Preview changes without creating PRs'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Report freshness before syncing, but do not block canonical pin propagation.
  verify-versions-current:
    name: Report version freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Workflows
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/autofix-versions.env
            scripts/update_versions_from_pypi.py
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Report versions against PyPI
        run: |
          echo "Checking autofix-versions.env freshness against PyPI..."
          python scripts/update_versions_from_pypi.py --check
          echo ""
          echo "Freshness report complete. maint-auto-update-pypi-versions.yml owns source bump PRs; continuing with canonical pins."

  prepare:
    name: Prepare version sync
    needs: verify-versions-current
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.matrix }}
      versions_hash: ${{ steps.hash.outputs.hash }}
      canonical_source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout Workflows
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/workflows/autofix-versions.env
            .github/workflows/maint-68-sync-consumer-repos.yml
            scripts/list_registered_consumer_repos.py
            scripts/sync_dev_dependencies.py
          sparse-checkout-cone-mode: false

      - name: Compute wave hash
        id: hash
        run: |
          # Include the propagation implementation so a script-only repair opens
          # a replacement wave instead of skipping PRs from the prior behavior.
          hash=$(
            sha256sum \
              .github/workflows/autofix-versions.env \
              scripts/sync_dev_dependencies.py \
              | sha256sum \
              | cut -d' ' -f1
          )
          echo "hash=${hash:0:12}" >> "$GITHUB_OUTPUT"
          echo "Wave hash: ${hash:0:12}"
          echo ""
          echo "Current versions:"
          grep -v '^#' .github/workflows/autofix-versions.env | grep '='

      - name: Record settled canonical source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build repo matrix
        id: repos
        env:
          INPUT_REPOS: ${{ inputs.repos }}
        run: |
          if [ -n "$INPUT_REPOS" ]; then
            repos="$INPUT_REPOS"
          else
            repos=$(python scripts/list_registered_consumer_repos.py --separator ',')
          fi
          json_array=$(echo "$repos" \
            | tr ',' '\n' \
            | grep -v '^$' \
            | jq -R -s -c '
              split("\n")
              | map(select(. != ""))
              | map(gsub("^\\s+|\\s+$"; ""))
            ')
          invalid_repos=$(jq -r '.[] | select(test("^[A-Za-z0-9][A-Za-z0-9_.-]*/[A-Za-z0-9][A-Za-z0-9_.-]*$") | not)' <<<"$json_array")
          if [ -n "$invalid_repos" ]; then
            echo "Invalid owner/repository value(s): $invalid_repos" >&2
            exit 1
          fi
          echo "matrix={\"repo\":$json_array}" >> "$GITHUB_OUTPUT"
          echo "Repos to sync: $json_array"

      - name: Upload sync script
        uses: actions/upload-artifact@v7
        with:
          name: sync-script
          path: |
            scripts/sync_dev_dependencies.py
            .github/workflows/autofix-versions.env
          retention-days: 1

  sync:
    name: Sync ${{ matrix.repo }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.repos) }}
    env:
      REPO_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT }}
    steps:
      - name: Clone consumer repo
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
          MATRIX_REPO: ${{ matrix.repo }}
        run: |
          gh repo clone "$MATRIX_REPO" consumer -- --depth=1

      - name: Download sync script
        uses: actions/download-artifact@v8
        with:
          name: sync-script

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Check for pyproject.toml
        id: check
        run: |
          if [ -f "consumer/pyproject.toml" ]; then
            echo "has_pyproject=true" >> "$GITHUB_OUTPUT"

            # Check if it has dev dependencies
            if grep -q '\[project.optional-dependencies\]' consumer/pyproject.toml; then
              if grep -qE '^dev\s*=' consumer/pyproject.toml; then
                echo "has_dev_deps=true" >> "$GITHUB_OUTPUT"
              else
                echo "has_dev_deps=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "has_dev_deps=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_pyproject=false" >> "$GITHUB_OUTPUT"
            echo "has_dev_deps=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync versions (existing dev deps)
        id: sync
        if: steps.check.outputs.has_dev_deps == 'true'
        run: |
          set -euo pipefail
          # Copy pin file to expected location
          mkdir -p consumer/.github/workflows
          cp .github/workflows/autofix-versions.env consumer/.github/workflows/

          cd consumer

          uv_lock_stale=false
          if [ -f uv.lock ]; then
            python -m pip install --disable-pip-version-check 'uv>=0.5'
            if ! uv lock --check; then
              uv_lock_stale=true
            fi
          fi

          # Run sync check first
          if python ../scripts/sync_dev_dependencies.py \
            --check 2>&1 \
            | tee /tmp/sync_output.txt; then
            if [ "$uv_lock_stale" = "true" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              if [ "${{ inputs.dry_run }}" != "true" ]; then
                uv lock
              fi
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            # Apply if not dry run
            if [ "${{ inputs.dry_run }}" != "true" ]; then
              python ../scripts/sync_dev_dependencies.py --apply
              if [ -f uv.lock ]; then
                uv lock
              fi
            fi
          fi

          # Save output for PR body
          cat /tmp/sync_output.txt > ../sync_summary.txt

      - name: Add dev dependencies (missing dev deps)
        id: add_deps
        if: >-
          steps.check.outputs.has_pyproject == 'true'
          && steps.check.outputs.has_dev_deps != 'true'
        run: |
          set -euo pipefail
          # Copy pin file to expected location
          mkdir -p consumer/.github/workflows
          cp .github/workflows/autofix-versions.env consumer/.github/workflows/

          cd consumer

          echo "Adding dev dependencies section to pyproject.toml..."

          # Use --create-if-missing to add dev deps
          if python ../scripts/sync_dev_dependencies.py \
            --apply \
            --create-if-missing 2>&1 \
            | tee /tmp/sync_output.txt; then
            if grep -q "version updates" /tmp/sync_output.txt; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            fi
            if [ "${{ inputs.dry_run }}" != "true" ] && [ -f uv.lock ]; then
              python -m pip install --disable-pip-version-check 'uv>=0.5'
              uv lock
            fi
          else
            exit 1
          fi

          # Save output for PR body
          cat /tmp/sync_output.txt > ../sync_summary.txt

      - name: Skip - no pyproject.toml
        if: steps.check.outputs.has_pyproject != 'true'
        env:
          MATRIX_REPO: ${{ matrix.repo }}
        run: |
          echo "Skipping $MATRIX_REPO: no pyproject.toml found"

      - name: Create sync PR
        if: >-
          (steps.sync.outputs.has_changes == 'true' || steps.add_deps.outputs.has_changes == 'true')
          && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
          DELIVERY_PLAN_ID: dev-tool-${{ needs.prepare.outputs.versions_hash }}
          DELIVERY_GENERATION: ${{ needs.prepare.outputs.versions_hash }}
          DELIVERY_REPOSITORY: ${{ matrix.repo }}
          CANONICAL_SOURCE_SHA: ${{ needs.prepare.outputs.canonical_source_sha }}
        run: |
          cd consumer

          branch_name="deps/sync-dev-versions-$DELIVERY_GENERATION"

          # Preserve the PR for this wave when it already exists, but rebuild
          # its branch from current main if either the base or generated tree
          # has changed. This avoids needlessly restarting checks on an
          # unchanged open PR while still repairing a stale/conflicted branch.
          existing_pr=$(gh pr list --head "$branch_name" --json number -q '.[0].number' || echo "")

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2016 # GH_TOKEN expands at runtime
          credential_helper='!f() { echo "username=x-access-token";'
          credential_helper+=" echo \"password=${GH_TOKEN}\";"
          credential_helper+=' }; f'
          git config credential.helper "$credential_helper"

          # Create the desired generated tree from the current default branch.
          base_sha=$(git rev-parse HEAD)
          git checkout -B "$branch_name"
          # Add supported lockfiles if they exist and were modified.
          git add pyproject.toml .github/workflows/autofix-versions.env
          if [ -f requirements.lock ]; then git add requirements.lock; fi
          if [ -f requirements-dev.lock ]; then git add requirements-dev.lock; fi
          if [ -f requirements-dev.txt ]; then git add requirements-dev.txt; fi
          if [ -f uv.lock ]; then git add uv.lock; fi

          matching_existing=false
          if [ -n "$existing_pr" ]; then
            git fetch origin "$branch_name"
            existing_head=$(git rev-parse FETCH_HEAD)
            existing_base=$(git rev-parse "${existing_head}^")
            existing_tree=$(git rev-parse "${existing_head}^{tree}")
            desired_tree=$(git write-tree)
            if [ "$existing_base" = "$base_sha" ] && [ "$existing_tree" = "$desired_tree" ]; then
              matching_existing=true
              echo "Existing PR #$existing_pr already matches current main and generated files; refreshing lease"
            fi
          fi

          if [ "$matching_existing" != "true" ]; then
            # Commit with multi-line message
            commit_msg="deps: sync dev tool versions from Workflows

            Automated sync from stranske/Workflows autofix-versions.env
            Versions hash: $DELIVERY_GENERATION

            This ensures consistent dev tool versions across all repos."
            git commit -m "$commit_msg"

            git push --force -u origin "$branch_name"
          fi

          changed_files="$(git show --name-only --format= HEAD)"
          if printf '%s\n' "$changed_files" | grep -qx 'pyproject.toml'; then
            pr_scope="This PR updates dev tool versions in \`pyproject.toml\` and related generated dependency files to match the central version pins from [stranske/Workflows](https://github.com/stranske/Workflows)."
          else
            pr_scope="This PR updates generated dev-tool pin files to match the central version pins from [stranske/Workflows](https://github.com/stranske/Workflows)."
          fi

          # Create PR body.  Each generated PR is a leased delivery attempt;
          # the durable campaign issue keeps the coordination history.
          desired_tree_hash=${desired_tree:-$(git rev-parse 'HEAD^{tree}')}
          lease_expires_at=$(date -u -d '+72 hours' +%Y-%m-%dT%H:%M:%SZ)
          delivery_marker=$(jq -nc \
            --arg schema "sync-pr-delivery-record/v1" \
            --arg durable_issue_url "https://github.com/stranske/Workflows/issues/1836" \
            --arg plan_id "$DELIVERY_PLAN_ID" \
            --arg generation "$DELIVERY_GENERATION" \
            --arg repository "$DELIVERY_REPOSITORY" \
            --arg desired_tree_hash "$desired_tree_hash" \
            --arg source_commit "$CANONICAL_SOURCE_SHA" \
            --arg lease_expires_at "$lease_expires_at" \
            '{schema:$schema,durable_issue_url:$durable_issue_url,plan_id:$plan_id,generation:$generation,repository:$repository,desired_tree_hash:$desired_tree_hash,source_commit:$source_commit,lease_expires_at:$lease_expires_at,predecessor_prs:[],successor_prs:[]}')
          pr_body="## Dev Tool Version Sync

          ${pr_scope}

          ### Changes
          \`\`\`
          $(cat ../sync_summary.txt)
          \`\`\`

          ### Why
          Consistent dev tool versions across repos ensures:
          - CI behaviors match between repos
          - No surprises from version drift
          - Easier debugging when tools behave the same everywhere

          ---
          **Source:** \`.github/workflows/autofix-versions.env\`
          **Settled source commit:** \`$CANONICAL_SOURCE_SHA\`

          <!-- sync-pr-delivery-record:v1 $delivery_marker -->"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body "$pr_body"
            echo "Refreshed delivery lease for existing PR #$existing_pr"
          else
            gh pr create \
              --head "$branch_name" \
              --title "deps: sync dev tool versions" \
              --body "$pr_body"
          fi

      - name: Dry run summary
        if: >-
          inputs.dry_run == true
          && (
            steps.sync.outputs.has_changes == 'true'
            || steps.add_deps.outputs.has_changes == 'true'
          )
        run: |
          {
            echo "## Dry Run - ${{ matrix.repo }}"
            echo ""
            echo "Would update:"
            echo "\`\`\`"
            cat sync_summary.txt
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Summary
    needs: [prepare, sync]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate summary
        env:
          VERSIONS_HASH: ${{ needs.prepare.outputs.versions_hash }}
          CANONICAL_SOURCE_SHA: ${{ needs.prepare.outputs.canonical_source_sha }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REPOS_JSON: ${{ needs.prepare.outputs.repos }}
        run: |
          {
            echo "## Dev Version Sync Summary"
            echo ""
            echo "**Versions Hash:** $VERSIONS_HASH"
            echo "**Settled source commit:** $CANONICAL_SOURCE_SHA"
            echo "**Dry Run:** $DRY_RUN"
            echo ""
            echo "### Repos Processed"
            printf '%s\n' "$REPOS_JSON" | jq -r '.repo[]' | while read -r repo; do
              echo "- $repo"
            done
          } >> "$GITHUB_STEP_SUMMARY"
