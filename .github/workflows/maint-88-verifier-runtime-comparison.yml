name: Maint 88 Verifier Runtime Comparison

# One finite #3904 experiment over the reviewed PR #4527 source pair.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-runtime-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - name: Checkout reviewed harness and immutable source objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up common interpreter without dependency cache
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch reviewed source pair and verify immutable identity
        run: |
          git fetch --no-tags origin 00f43f81e51c4f8b9a057ac51f7e3c2d870d7769
          test "$(git rev-parse FETCH_HEAD)" = "00f43f81e51c4f8b9a057ac51f7e3c2d870d7769"
          git fetch --no-tags origin 8c0afc3ef0263cf85949b6167435ceabed5dd2a3
          test "$(git rev-parse FETCH_HEAD)" = "8c0afc3ef0263cf85949b6167435ceabed5dd2a3"
      - name: Prepare immutable arms
        run: >-
          python scripts/measure_verifier_runtime.py prepare --output measurement
          --baseline 00f43f81e51c4f8b9a057ac51f7e3c2d870d7769
          --candidate 8c0afc3ef0263cf85949b6167435ceabed5dd2a3
      - name: Install one common immutable dependency lock
        env:
          PIP_NO_CACHE_DIR: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: python -m pip install --requirement measurement/candidate/requirements.lock
      - name: Run both arms with identical coverage and four workers
        run: python scripts/measure_verifier_runtime.py run --output measurement
      - name: Upload exact source manifests and raw evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verifier-runtime-${{ matrix.python }}-${{ github.run_id }}
          retention-days: 30
          path: |
            measurement/manifest.json
            measurement/result.json
            measurement/*.log
            measurement/baseline/coverage.json
            measurement/baseline/coverage.xml
            measurement/baseline/pytest-junit.xml
            measurement/candidate/coverage.json
            measurement/candidate/coverage.xml
            measurement/candidate/pytest-junit.xml
