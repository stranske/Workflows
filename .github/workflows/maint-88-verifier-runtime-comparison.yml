name: Maint 88 Verifier Runtime Comparison

# One finite #3904 experiment. Manual dispatch after ordinary review/merge only.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verifier-runtime-comparison
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14']
    steps:
      - name: Checkout reviewed harness and immutable source objects
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up common interpreter without dependency cache
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Fetch retained pre-squash candidate and verify immutable identity
        run: |
          git fetch --no-tags origin refs/pull/3950/head
          test "$(git rev-parse FETCH_HEAD)" = "999ffe5fa00ac9c8ae8a807447f053277032b670"
      - name: Prepare immutable arms
        run: python scripts/measure_verifier_runtime.py prepare --output measurement
      - name: Install one common immutable dependency lock
        env:
          PIP_NO_CACHE_DIR: '1'
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: python -m pip install --requirement measurement/candidate/requirements.lock
      - name: Run both arms with identical coverage and four workers
        run: python scripts/measure_verifier_runtime.py run --output measurement
      - name: Upload exact source manifests and raw evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verifier-runtime-${{ matrix.python }}-${{ github.run_id }}
          retention-days: 30
          path: |
            measurement/manifest.json
            measurement/result.json
            measurement/*.log
            measurement/baseline/coverage.json
            measurement/baseline/coverage.xml
            measurement/baseline/pytest-junit.xml
            measurement/candidate/coverage.json
            measurement/candidate/coverage.xml
            measurement/candidate/pytest-junit.xml
