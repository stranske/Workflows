name: Maint 68 Sync Consumer Repos

# Push workflow template updates to registered consumer repositories
#
# ARCHITECTURE: This workflow is MANIFEST-DRIVEN
# All sync targets are declared in .github/sync-manifest.yml
# DO NOT add hardcoded file lists here - update the manifest instead
#
# Triggered after releases, template changes, or manually

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'templates/consumer-repo/**'
      - '.github/sync-manifest.yml'
      # All directories referenced by sync-manifest.yml as source paths.
      # The sync is idempotent (hash-compares before creating PRs), so extra
      # triggers only cost a ~30s no-op run when nothing actually changed.
      - '.github/scripts/**'
      - '.github/codex/**'
      - '.github/actions/setup-api-client/**'
      - '.github/actions/export-load-balancer-tokens/**'
      - '.github/copilot-instructions.md'
      - '.github/copilot-skills/**'
      - '.github/dependabot.yml'
      - '.github/templates/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'scripts/langchain/**'
      - 'scripts/sync_dev_dependencies.py'
      - 'scripts/sync_test_dependencies.py'
      - 'scripts/check_test_dependencies.sh'
      - 'scripts/autopilot_step_timer.py'
      - 'scripts/autopilot_metrics_collector.py'
      - 'scripts/ci_*.py'
      - 'scripts/coverage_history_append.py'
      - 'tools/resolve_mypy_pin.py'
      - 'tools/coverage_trend.py'
      - 'tools/llm_provider.py'
      - 'tools/langchain_client.py'
      - 'config/llm_slots.json'
      - 'config/model_registry.json'
      - 'docs/AGENT_ISSUE_FORMAT.md'
      - 'docs/CI_SYSTEM_GUIDE.md'
      - 'docs/LABELS.md'
      - 'docs/CODEX_TOKEN_REFRESH.md'
      - 'CLAUDE.md'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Comma-separated repos to sync (empty for all registered)'
        type: string
        required: false
      dry_run:
        description: 'Preview changes without creating PRs'
        type: boolean
        default: false
      force:
        description: 'Force sync even if no changes detected'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write  # Required to create failure notification issues

env:
  # Consumer repos registered for automatic sync
  REGISTERED_CONSUMER_REPOS: |
    stranske/Travel-Plan-Permission
    stranske/Template
    stranske/trip-planner
    stranske/Manager-Database
    stranske/Portable-Alpha-Extension-Model
    stranske/Trend_Model_Project
    stranske/Collab-Admin

concurrency:
  group: sync-consumer-repos-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PREPARE: Load manifest and build repo matrix
  # ============================================================================
  prepare:
    name: Prepare sync from manifest
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.matrix }}
      template_hash: ${{ steps.hash.outputs.hash }}
      manifest_json: ${{ steps.manifest.outputs.json }}
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:

          token: ${{ steps.app_token.outputs.token || github.token }}
          sparse-checkout: |
            templates/consumer-repo
            .github/sync-manifest.yml
            .github/scripts
            scripts
            tools
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Load and validate manifest
        id: manifest
        run: |
          python3 << 'MANIFEST_SCRIPT'
          import yaml
          import json
          import os
          import sys

          manifest_path = '.github/sync-manifest.yml'
          if not os.path.exists(manifest_path):
              print("::error::sync-manifest.yml not found!")
              sys.exit(1)

          with open(manifest_path) as f:
              manifest = yaml.safe_load(f)

          # Validate required sections exist
          required_sections = ['workflows', 'prompts', 'scripts', 'actions']
          for section in required_sections:
              if section not in manifest:
                  print(f"::warning::Manifest missing '{section}' section")
                  manifest[section] = []

          # Convert to JSON for workflow consumption
          manifest_json = json.dumps(manifest, separators=(',', ':'))

          # GitHub has output size limits, so we'll write to file too
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"json={manifest_json}\n")

          print(f"Loaded manifest with:")
          print(f"  - {len(manifest.get('workflows', []))} workflows")
          print(f"  - {len(manifest.get('prompts', []))} prompts")
          print(f"  - {len(manifest.get('scripts', []))} scripts")
          print(f"  - {len(manifest.get('codex_config', []))} codex configs")
          print(f"  - {len(manifest.get('actions', []))} actions")
          print(f"  - {len(manifest.get('docs', []))} docs")
          print(f"  - {len(manifest.get('llm_config', []))} llm configs")
          print(f"  - {len(manifest.get('git_config', []))} git configs")
          print(f"  - {len(manifest.get('issue_templates', []))} issue templates")
          print(f"  - {len(manifest.get('user_docs', []))} user docs")
          MANIFEST_SCRIPT

      - name: Compute template hash
        id: hash
        run: |
          # Hash includes all directories that contain synced files
          hash=$({
            find templates/consumer-repo -type f -exec sha256sum {} \;
            find tools -name "*.py" -type f -exec sha256sum {} \; 2>/dev/null || true
            find scripts -name "*.py" -type f -exec sha256sum {} \; 2>/dev/null || true
            find scripts -name "*.sh" -type f -exec sha256sum {} \; 2>/dev/null || true
            find .github/scripts -type f -exec sha256sum {} \;
            sha256sum .github/sync-manifest.yml
          } | sort | sha256sum | cut -d' ' -f1)
          echo "hash=${hash:0:12}" >> "$GITHUB_OUTPUT"
          echo "Template hash: ${hash:0:12}"

      - name: Build repo matrix
        id: repos
        run: |
          if [ -n "${{ inputs.repos }}" ]; then
            repos='${{ inputs.repos }}'
          else
            repos=$(echo "$REGISTERED_CONSUMER_REPOS" | tr '\n' ',' | sed 's/,$//')
          fi
          json_array=$(echo "$repos" | tr ',' '\n' | grep -v '^$' | jq -R -s -c 'split("\n") | map(select(. != "")) | map(gsub("^\\s+|\\s+$"; ""))')
          echo "matrix={\"repo\":$json_array}" >> "$GITHUB_OUTPUT"
          echo "Repos to sync: $json_array"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v6
        with:
          name: sync-manifest
          path: manifest.json
          retention-days: 1

  # ============================================================================
  # VALIDATE: Ensure files pass lint before syncing
  # ============================================================================
  validate:
    name: Validate sync files
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: pip install ruff pyyaml

      - name: Download manifest
        uses: actions/download-artifact@v7
        with:
          name: sync-manifest

      - name: Validate Python scripts
        run: |
          set -euo pipefail

          # Read scripts from manifest
          scripts=$(python3 -c "
          import json
          with open('manifest.json') as f:
              m = json.load(f)
          for s in m.get('scripts', []):
              src = s.get('source', '')
              if src.endswith('.py'):
                  print(src)
          ")

          failed=0
          for script in $scripts; do
            if [ -f "$script" ]; then
              echo "Checking $script..."
              if ! ruff check --select="E,W,F,I,B" "$script"; then
                echo "::error::$script fails lint"
                failed=1
              fi
            fi
          done

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "✓ All Python scripts pass lint"

      - name: Validate YAML syntax
        run: |
          set -euo pipefail

          # Read workflows from manifest
          workflows=$(python3 -c "
          import json
          with open('manifest.json') as f:
              m = json.load(f)
          for w in m.get('workflows', []):
              src = w.get('source', '')
              if src.endswith('.yml') or src.endswith('.yaml'):
                  print(src)
          ")

          for workflow in $workflows; do
            template_path="templates/consumer-repo/$workflow"
            if [ -f "$template_path" ]; then
              echo "Validating $template_path..."
              python3 -c "import yaml; yaml.safe_load(open('$template_path'))"
            fi
          done
          echo "✓ All workflow YAML is valid"

  # ============================================================================
  # SYNC: Apply template to each consumer repo
  # ============================================================================
  sync:
    name: Sync ${{ matrix.repo }}
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.repos) }}
    env:
      # Job-level alias for repo token (uses OWNER_PR_PAT or SERVICE_BOT_PAT)
      REPO_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT }}
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Checkout Workflows
        uses: actions/checkout@v6
        with:

          token: ${{ steps.app_token.outputs.token || github.token }}
          path: workflows

      - name: Clone consumer repo
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
        run: |
          gh repo clone ${{ matrix.repo }} consumer -- --depth=1

      - name: Download manifest
        uses: actions/download-artifact@v7
        with:
          name: sync-manifest

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Detect and apply changes
        id: sync
        env:
          CURRENT_REPO: ${{ matrix.repo }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 << 'SYNC_SCRIPT'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          # Load manifest
          with open('manifest.json') as f:
              manifest = json.load(f)

          current_repo = os.environ.get('CURRENT_REPO', '')
          dry_run = os.environ.get('DRY_RUN', 'false') == 'true'
          force = os.environ.get('FORCE', 'false') == 'true'

          # Repos with custom Gate workflows
          custom_gate_repos = ['stranske/trip-planner', 'stranske/Manager-Database']

          changes = []
          skipped = []

          def files_differ(src, dst):
              """Compare files, ignoring header comments (first 10 lines)."""
              if not dst.exists():
                  return True
              if not src.exists():
                  return False

              src_lines = src.read_text().splitlines()
              dst_lines = dst.read_text().splitlines()

              # For short files, compare everything
              if len(src_lines) < 15 or len(dst_lines) < 15:
                  return src_lines != dst_lines

              # Skip header (first 10 lines) for comparison
              return src_lines[10:] != dst_lines[10:]

          def sync_file(source_path, target_path, description, skip_condition=None):
              """Sync a single file from template to consumer."""
              src = Path(source_path)
              dst = Path(target_path)

              if skip_condition and skip_condition():
                  skipped.append(f"{dst.name}: {skip_condition.__doc__}")
                  return False

              if not src.exists():
                  print(f"  ⚠ Source missing: {src}")
                  return False

              if force or files_differ(src, dst):
                  if not dry_run:
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
                  changes.append(f"{dst.name}: {description}")
                  return True
              return False

          def sync_directory(source_path, target_path, description):
              """Sync an entire directory from template to consumer."""
              src = Path(source_path)
              dst = Path(target_path)

              if not src.exists() or not src.is_dir():
                  print(f"  ⚠ Source directory missing: {src}")
                  return False

              dir_changes = []
              for src_file in src.rglob('*'):
                  if src_file.is_file():
                      rel_path = src_file.relative_to(src)
                      dst_file = dst / rel_path
                      if force or files_differ(src_file, dst_file):
                          if not dry_run:
                              dst_file.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(src_file, dst_file)
                          dir_changes.append(str(rel_path))

              if dir_changes:
                  changes.append(f"{dst.name}/ ({len(dir_changes)} files): {description}")
              return len(dir_changes) > 0

          def remove_path(target_path, description):
              """Remove an obsolete path from the consumer repo."""
              dst = Path(target_path)
              if not dst.exists():
                  return False
              if not dry_run:
                  if dst.is_dir():
                      shutil.rmtree(dst)
                  else:
                      dst.unlink()
              changes.append(f"removed {dst}: {description}")
              return True

          # Process workflows
          print("Processing workflows...")
          for item in manifest.get('workflows', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              sync_mode = item.get('sync_mode', 'sync')

              # Build paths
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source

              # Skip conditions
              def skip_custom_gate():
                  """Repo has custom Gate workflow"""
                  return 'pr-00-gate' in source and current_repo in custom_gate_repos

              def skip_create_only():
                  """File exists and sync_mode is create_only"""
                  return sync_mode == 'create_only' and consumer_dst.exists()

              # Determine skip function: check create_only first (covers most cases),
              # then custom_gate for legacy repos that have completely custom Gates
              skip_fn = None
              if sync_mode == 'create_only':
                  skip_fn = skip_create_only
              elif 'pr-00-gate' in source and current_repo in custom_gate_repos:
                  skip_fn = skip_custom_gate

              sync_file(template_src, consumer_dst, description, skip_fn)

          # Process prompts
          print("Processing prompts...")
          for item in manifest.get('prompts', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source
              sync_file(template_src, consumer_dst, description)

          # Process scripts
          print("Processing scripts...")
          for item in manifest.get('scripts', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              is_directory = item.get('is_directory', False)
              # Scripts come from .github/scripts/, not templates
              template_src = Path('workflows') / source
              consumer_dst = Path('consumer') / source
              if is_directory:
                  sync_directory(template_src, consumer_dst, description)
              else:
                  sync_file(template_src, consumer_dst, description)

          # Process codex_config
          print("Processing codex config...")
          for item in manifest.get('codex_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source
              sync_file(template_src, consumer_dst, description)

          # Process copilot_config
          print("Processing copilot config...")
          for item in manifest.get('copilot_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              is_directory = item.get('is_directory', False)
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source

              if is_directory:
                  sync_directory(template_src, consumer_dst, description)
              else:
                  sync_file(template_src, consumer_dst, description)

          # Process templates (markdown templates, instructions, etc.)
          print("Processing templates...")
          for item in manifest.get('templates', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              # Templates come from .github/templates/, same as scripts pattern
              template_src = Path('workflows') / source
              consumer_dst = Path('consumer') / source
              sync_file(template_src, consumer_dst, description)

          # Process actions
          print("Processing actions...")
          for item in manifest.get('actions', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              is_directory = item.get('is_directory', False)
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source

              if is_directory:
                  sync_directory(template_src, consumer_dst, description)
              else:
                  sync_file(template_src, consumer_dst, description)

          # Process docs
          print("Processing docs...")
          for item in manifest.get('docs', []):
              source = item.get('source', '')
              target = item.get('target', source)
              description = item.get('description', 'No description')
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / target
              sync_file(template_src, consumer_dst, description)

          # Process llm_config
          print("Processing llm config...")
          for item in manifest.get('llm_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              sync_mode = item.get('sync_mode', 'sync')
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source
              skip_fn = None
              if sync_mode == 'create_only':
                  skip_fn = lambda: consumer_dst.exists()
              sync_file(template_src, consumer_dst, description, skip_fn)

          # Process git_config
          print("Processing git config...")
          for item in manifest.get('git_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source
              sync_file(template_src, consumer_dst, description)

          # Process issue_templates
          print("Processing issue templates...")
          for item in manifest.get('issue_templates', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / source
              sync_file(template_src, consumer_dst, description)

          # Process user_docs
          print("Processing user docs...")
          for item in manifest.get('user_docs', []):
              source = item.get('source', '')
              target = item.get('target', source)
              description = item.get('description', 'No description')
              template_src = Path('workflows/templates/consumer-repo') / source
              consumer_dst = Path('consumer') / target
              sync_file(template_src, consumer_dst, description)

          # Process removals
          print("Processing removals...")
          for item in manifest.get('removals', []) or []:
              target = item.get('target', '')
              description = item.get('description', 'No description')
              if not target:
                  continue
              consumer_dst = Path('consumer') / target
              remove_path(consumer_dst, description)

          # Output results
          print(f"\n{'='*60}")
          print(f"SYNC RESULTS for {current_repo}")
          print(f"{'='*60}")

          if changes:
              print(f"\n✓ {len(changes)} files to sync:")
              for c in changes:
                  print(f"  - {c}")
          else:
              print("\n✓ No changes needed")

          if skipped:
              print(f"\n⊘ {len(skipped)} files skipped:")
              for s in skipped:
                  print(f"  - {s}")

          repo_dirty = False
          if not dry_run:
              status = subprocess.run(
                  ["git", "-C", "consumer", "status", "--porcelain"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              repo_dirty = bool(status.stdout.strip())

          has_changes = bool(changes) if dry_run else repo_dirty

          # Set outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"changes_count={len(changes)}\n")
              f.write(f"has_changes={'true' if has_changes else 'false'}\n")

          # Write change summary for PR body
          with open('sync_summary.md', 'w') as f:
              f.write("## Sync Summary\n\n")
              if changes:
                  f.write("### Files Updated\n")
                  for c in changes:
                      f.write(f"- {c}\n")
              if skipped:
                  f.write("\n### Files Skipped\n")
                  for s in skipped:
                      f.write(f"- {s}\n")
          SYNC_SCRIPT

      - name: Check for required labels
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
        run: |
          cd consumer

          # Required labels for sync PRs
          required_labels=("sync" "automated")

          for label in "${required_labels[@]}"; do
            if ! gh label list --json name -q ".[].name" | grep -q "^${label}$"; then
              echo "Creating label: $label"
              gh label create "$label" --description "Automated sync from Workflows" --color "0e8a16" || true
            fi
          done

          # LangChain Phase 1 labels (agents:format workflow)
          # These labels are required for the issue formatting and optimization workflows
          echo "Ensuring LangChain agent labels exist..."

          gh label create "agents:format" \
            --description "Triggers direct issue formatting to AGENT_ISSUE_TEMPLATE" \
            --color "0E8A16" --force || true

          gh label create "agents:formatted" \
            --description "Issue has been formatted to AGENT_ISSUE_TEMPLATE" \
            --color "1D76DB" --force || true

          gh label create "agents:optimize" \
            --description "Triggers issue analysis with optimization suggestions" \
            --color "FBCA04" --force || true

          gh label create "agents:apply-suggestions" \
            --description "Applies optimization suggestions from agents:optimize" \
            --color "0E8A16" --force || true

      - name: Create sync PR
        if: steps.sync.outputs.has_changes == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
        run: |
          cd consumer

          branch_name="sync/workflows-${{ needs.prepare.outputs.template_hash }}"

          # Check if branch/PR already exists
          existing_pr=$(gh pr list --head "$branch_name" --json number -q '.[0].number' || echo "")
          if [ -n "$existing_pr" ]; then
            echo "PR #$existing_pr already exists for this sync"
            echo "::notice::Existing PR: #$existing_pr"
            exit 0
          fi

          # Configure git for push authentication using credential helper
          # This avoids exposing token in git remote URL or command output
          # Must be configured before any git operations that need auth
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2016 # Single quotes intentional - ${GH_TOKEN} expands at runtime in credential helper
          git config credential.helper '!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f'

          # Remote branch exists but no PR was found (from a failed previous run) - deleting and recreating
          if git ls-remote --exit-code origin "refs/heads/$branch_name" >/dev/null 2>&1; then
            echo "Remote branch $branch_name exists but no PR was found (from a failed previous run) - deleting and recreating"
            # Delete the remote branch so we can push fresh
            delete_output=$(git push origin --delete "$branch_name" 2>&1) || {
              if printf '%s\n' "$delete_output" | grep -qiE 'remote ref .* not found|remote ref does not exist|could not find remote ref'; then
                echo "Remote branch $branch_name no longer exists; continuing"
              else
                printf '%s\n' "$delete_output" >&2
                exit 1
              fi
            }
          fi

          # Create branch and commit
          git checkout -b "$branch_name"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit after sync; skipping PR creation."
            exit 0
          fi

          git commit -m "chore: sync workflow templates from Workflows repo

          Automated sync from stranske/Workflows
          Template hash: ${{ needs.prepare.outputs.template_hash }}

          Changes synced from sync-manifest.yml"

          git push --quiet -u origin "$branch_name"

          # Create PR
          pr_body=$(cat ../sync_summary.md)
          pr_body="$pr_body

          ---

          ### Review Checklist
          - [ ] CI passes with updated workflows
          - [ ] No repo-specific customizations were overwritten

          **Source:** [stranske/Workflows](https://github.com/stranske/Workflows)
          **Manifest:** [\`.github/sync-manifest.yml\`](https://github.com/stranske/Workflows/blob/main/.github/sync-manifest.yml)"

          gh pr create \
            --head "$branch_name" \
            --title "chore: sync workflow templates" \
            --body "$pr_body" \
            --label "sync,automated"

      - name: Dry run summary
        if: inputs.dry_run == true
        run: |
          {
            echo "## Dry Run Summary"
            echo ""
            echo "**Repo:** ${{ matrix.repo }}"
            echo "**Changes:** ${{ steps.sync.outputs.changes_count }}"
            echo ""
            cat sync_summary.md
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # SUMMARY: Generate overall sync report
  # ============================================================================
  summary:
    name: Generate summary
    needs: [prepare, validate, sync]
    runs-on: ubuntu-latest
    if: always()
    steps:
      # Mint GitHub App token early to use for API calls (avoids rate limits)
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Generate summary
        run: |
          {
            echo "## Consumer Repo Sync Summary"
            echo ""
            echo "**Template Hash:** ${{ needs.prepare.outputs.template_hash }}"
            echo "**Dry Run:** ${{ inputs.dry_run || 'false' }}"
            echo ""
            echo "### Repos Processed"
            echo '${{ needs.prepare.outputs.repos }}' | jq -r '.repo[]' | while read -r repo; do
              echo "- $repo"
            done
            echo ""
            echo "---"
            echo "*Sync driven by [sync-manifest.yml](https://github.com/stranske/Workflows/blob/main/.github/sync-manifest.yml)*"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # FAILURE NOTIFICATION: Create issue when sync fails
  # ============================================================================
  notify-failure:
    name: Create failure issue
    needs: [prepare, validate, sync]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Mint GitHub App Token
        id: app_token
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID || '0' }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY || 'dummy' }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:

          token: ${{ steps.app_token.outputs.token || github.token }}
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      - name: Determine failure details
        id: failure
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          failed_jobs=""
          if [ "$PREPARE_RESULT" = "failure" ]; then
            failed_jobs="prepare (manifest loading)"
          fi
          if [ "$VALIDATE_RESULT" = "failure" ]; then
            failed_jobs="${failed_jobs:+$failed_jobs, }validate (lint/syntax check)"
          fi
          if [ "$SYNC_RESULT" = "failure" ]; then
            failed_jobs="${failed_jobs:+$failed_jobs, }sync (consumer repo updates)"
          fi
          echo "failed_jobs=${failed_jobs:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Check for existing open issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look for existing open sync failure issues
          existing=$(gh issue list \
            --label "sync-failure,automated" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "existing_issue=$existing" >> "$GITHUB_OUTPUT"
            echo "Found existing sync failure issue: #$existing"
          else
            echo "existing_issue=" >> "$GITHUB_OUTPUT"
            echo "No existing sync failure issue found"
          fi

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "sync-failure" \
            --description "Consumer repo sync workflow failed" \
            --color "B60205" --force || true
          gh label create "automated" \
            --description "Automatically created issue" \
            --color "0e8a16" --force || true

      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_ISSUE: ${{ steps.check.outputs.existing_issue }}
          FAILED_JOBS: ${{ steps.failure.outputs.failed_jobs }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref_name }}
        run: |
          # Format consumer repos as markdown list
          affected_repos=$(echo "$REGISTERED_CONSUMER_REPOS" | sed '/^$/d' | sed 's/^/          - /')

          issue_body="## 🚨 Consumer Repo Sync Failed

          The sync workflow failed to push updates to consumer repositories.

          ### Failure Details
          - **Failed Jobs:** ${FAILED_JOBS}
          - **Trigger:** Push to \`${TRIGGER_REF}\` (${TRIGGER_SHA:0:7})
          - **Run:** [View workflow run](${RUN_URL})
          - **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### Impact
          Consumer repos are NOT receiving the latest workflow templates, scripts, and prompts.
          This means new features and bug fixes are not being deployed to:
          ${affected_repos}

          ### Common Causes
          1. **Lint errors** in Python scripts listed in \`sync-manifest.yml\`
          2. **YAML syntax errors** in workflow templates
          3. **Missing files** referenced in the manifest
          4. **API/auth failures** when pushing to consumer repos

          ### Resolution Steps
          1. Check the [failed workflow run](${RUN_URL}) for specific error messages
          2. Fix the underlying issue (lint errors, syntax errors, etc.)
          3. The sync will automatically retry on next push to \`templates/consumer-repo/\` or \`sync-manifest.yml\`
          4. Or manually trigger: \`gh workflow run 'Maint 68 Sync Consumer Repos'\`

          ### Prevention
          Run \`ruff check --select='E,W,F,I,B' scripts/\` locally before pushing changes to synced scripts.

          ---
          *This issue was automatically created by the sync workflow failure handler.*"

          if [ -n "$EXISTING_ISSUE" ]; then
            # Add comment to existing issue
            gh issue comment "$EXISTING_ISSUE" --body "### 🔄 Sync failed again

          - **Run:** [View workflow run](${RUN_URL})
          - **Failed Jobs:** ${FAILED_JOBS}
          - **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          The sync workflow continues to fail. Please investigate."
            echo "::warning::Added comment to existing issue #$EXISTING_ISSUE"
          else
            # Create new issue
            gh issue create \
              --title "🚨 Consumer Repo Sync Failed - Action Required" \
              --body "$issue_body" \
              --label "sync-failure,automated,bug"
            echo "::warning::Created new sync failure issue"
          fi
