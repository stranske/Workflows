name: Maint 68 Sync Consumer Repos
run-name: Maint 68 ${{ inputs.phase || 'canary' }} ${{ inputs.delivery_scope || 'auto' }}

# Push workflow template updates to registered consumer repositories
#
# ARCHITECTURE: This workflow is MANIFEST-DRIVEN
# All sync targets are declared in .github/sync-manifest.yml
# DO NOT add hardcoded file lists here - update the manifest instead
#
# Triggered by one daily coalescing run or an explicit operator dispatch.

on:
  schedule:
    # Debounced sync: coalesce template changes into ONE daily run rather than a
    # per-push PR wave across the consumer fleet (the dominant sync-PR-volume driver,
    # per docs/review-2026-05-29/sync-system/). The prepare job hash-compares before
    # creating any PR, so a scheduled run with nothing to sync is a ~30s no-op (zero
    # PRs). Runtime behavior already reaches consumers instantly via @main; only the
    # synced file COPIES wait for this run. For an immediate sync, use the manual
    # workflow_dispatch below. Release publication deliberately does not create
    # a second delivery cycle. Daily ordering:
    #   05:00 maint-68 sync  ->  05:10 Health 68 drift scan  ->  05:30 maint-71 janitor.
    # (Removing the push trigger also moots the G2 push-allowlist-vs-manifest drift.)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      repos:
        description: 'Optional repo subset (canary phase accepts configured canaries only)'
        type: string
        required: false
      dry_run:
        description: 'Preview changes without creating PRs'
        type: boolean
        default: false
      force:
        description: 'Force sync even if no changes detected'
        type: boolean
        default: false
      phase:
        description: 'Run preview (read-only), canary, or promote after green canary evidence'
        type: choice
        options: [preview, canary, promote]
        default: canary
      canary_evidence_json:
        description: 'Maint 71 canary evidence JSON for the exact plan ID (required to promote)'
        type: string
        required: false
      delivery_scope:
        description: 'Plan scope: full, exact source delta, or infer from promotion evidence'
        type: choice
        options: [auto, full, source-delta]
        default: auto
      scope_base_sha:
        description: 'Exact source-range base commit (required for source-delta canary)'
        type: string
        required: false
      scope_head_sha:
        description: 'Exact source-range head commit (defaults to this workflow source)'
        type: string
        required: false

permissions:
  contents: read
  issues: write  # Required to create failure notification issues

env:
  # Consumer repos registered for automatic sync
  REGISTERED_CONSUMER_REPOS: |
    stranske/Travel-Plan-Permission
    stranske/Template
    stranske/Counter_Risk
    stranske/Pension-Data
    stranske/Inv-Man-Intake
    stranske/Ready
    stranske/trip-planner
    stranske/Manager-Database
    stranske/Portable-Alpha-Extension-Model
    stranske/Trend_Model_Project
    stranske/Collab-Admin
    stranske/learning-management-system
    stranske/Fine-Art-Archive

concurrency:
  group: sync-consumer-repos-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # PREPARE: Load manifest and build repo matrix
  # ============================================================================
  prepare:
    name: Prepare sync from manifest
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.repos.outputs.matrix }}
      template_hash: ${{ steps.manifest.outputs.template_hash }}
      plan_id: ${{ steps.manifest.outputs.plan_id }}
      phase: ${{ steps.repos.outputs.phase }}
      sync_branch: ${{ steps.repos.outputs.sync_branch }}
      plan_scope: ${{ steps.manifest.outputs.plan_scope }}
      scope_base_sha: ${{ steps.manifest.outputs.scope_base_sha }}
      source_commit: ${{ steps.manifest.outputs.source_commit }}
      has_plan_items: ${{ steps.manifest.outputs.has_plan_items }}
    steps:
      - name: Resolve immutable plan scope
        id: scope_request
        env:
          REQUESTED_SCOPE: ${{ inputs.delivery_scope || 'auto' }}
          INPUT_BASE_SHA: ${{ inputs.scope_base_sha || '' }}
          INPUT_HEAD_SHA: ${{ inputs.scope_head_sha || '' }}
          REQUESTED_PHASE: ${{ inputs.phase || 'canary' }}
          CANARY_EVIDENCE_JSON: ${{ inputs.canary_evidence_json || '' }}
        run: |
          set -euo pipefail
          scope="$REQUESTED_SCOPE"
          base_sha="$INPUT_BASE_SHA"
          source_commit="$INPUT_HEAD_SHA"

          if [ "$REQUESTED_PHASE" = "promote" ]; then
            [ -n "$CANARY_EVIDENCE_JSON" ] || {
              echo "::error::Promotion requires canary evidence"
              exit 1
            }
            evidence_rows=$(jq -ce '
              if type == "array" then .
              elif (.results | type) == "array" then .results
              else error("promotion evidence must be an array or contain results")
              end
            ' <<<"$CANARY_EVIDENCE_JSON")
            evidence_scope=$(jq -er '
              [.[].plan_scope // "full"] | unique |
              if length == 1 then .[0]
              else error("mixed plan scopes in canary evidence")
              end
            ' <<<"$evidence_rows")
            if [ "$scope" = "auto" ]; then
              scope="$evidence_scope"
            elif [ "$scope" != "$evidence_scope" ]; then
              echo "::error::Requested scope $scope does not match promotion evidence scope $evidence_scope"
              exit 1
            fi

            # Promotion evidence is authoritative for every plan scope. Falling
            # back to the dispatch workflow's GITHUB_SHA can mix a later main
            # commit into an already-authorized full-plan delivery.
            source_commit=$(jq -er '
              [.[].source_commit // ""] | unique |
              if length == 1 and .[0] != "" then .[0]
              else error("missing or mixed promotion source commit")
              end
            ' <<<"$evidence_rows")

            if [ "$scope" = "source-delta" ]; then
              base_sha=$(jq -er '
                [.[].scope_base_sha // ""] | unique |
                if length == 1 and .[0] != "" then .[0]
                else error("missing or mixed source-delta base SHA")
                end
              ' <<<"$evidence_rows")
            else
              jq -e 'all(.[]; (.scope_base_sha // "") == "")' \
                <<<"$evidence_rows" >/dev/null || {
                echo "::error::Full-plan promotion evidence must not contain a source-range base"
                exit 1
              }
              base_sha=""
            fi
          elif [ "$scope" = "auto" ]; then
            scope="full"
          fi

          case "$scope" in
            full)
              base_sha=""
              source_commit="${source_commit:-$GITHUB_SHA}"
              ;;
            source-delta)
              [ -n "$base_sha" ] || {
                echo "::error::source-delta scope requires scope_base_sha"
                exit 1
              }
              source_commit="${source_commit:-$GITHUB_SHA}"
              ;;
            *)
              echo "::error::Unsupported delivery scope: $scope"
              exit 1
              ;;
          esac

          sha_re='^[0-9a-fA-F]{40,64}$'
          [[ "$source_commit" =~ $sha_re ]] || {
            echo "::error::Invalid source commit: $source_commit"
            exit 1
          }
          if [ -n "$base_sha" ]; then
            [[ "$base_sha" =~ $sha_re ]] || {
              echo "::error::Invalid source-range base: $base_sha"
              exit 1
            }
          fi
          source_commit=$(printf '%s' "$source_commit" | tr '[:upper:]' '[:lower:]')
          base_sha=$(printf '%s' "$base_sha" | tr '[:upper:]' '[:lower:]')
          {
            echo "plan_scope=$scope"
            echo "scope_base_sha=$base_sha"
            echo "source_commit=$source_commit"
          } >> "$GITHUB_OUTPUT"
          echo "Plan scope: $scope"
          echo "Source commit: $source_commit"
          [ -z "$base_sha" ] || echo "Scope base: $base_sha"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.scope_request.outputs.source_commit }}
          fetch-depth: 0
          sparse-checkout: |
            templates/consumer-repo
            .gitattributes
            .github/sync-manifest.yml
            .github/templates
            .github/actions
            .github/agents
            .github/PULL_REQUEST_TEMPLATE.md
            .github/path-classification.yml
            .github/scripts
            config
            docs
            scripts
            tools
          sparse-checkout-cone-mode: false

      - name: Validate immutable source reachability
        env:
          SOURCE_COMMIT: ${{ steps.scope_request.outputs.source_commit }}
          SCOPE_BASE_SHA: ${{ steps.scope_request.outputs.scope_base_sha }}
        run: |
          set -euo pipefail
          checked_out=$(git rev-parse HEAD)
          [ "$checked_out" = "$SOURCE_COMMIT" ] || {
            echo "::error::Checked-out source does not match the resolved source commit"
            exit 1
          }
          git cat-file -e "${GITHUB_SHA}^{commit}" || {
            echo "::error::The workflow dispatch ref commit is not reachable locally"
            exit 1
          }
          git merge-base --is-ancestor "$SOURCE_COMMIT" "$GITHUB_SHA" || {
            echo "::error::Resolved source commit is not in the workflow dispatch ref history"
            exit 1
          }
          if [ -n "$SCOPE_BASE_SHA" ]; then
            git merge-base --is-ancestor "$SCOPE_BASE_SHA" "$SOURCE_COMMIT" || {
              echo "::error::Source-delta base is not an ancestor of the source commit"
              exit 1
            }
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Compile typed consumer sync plan
        run: |
          python scripts/sync_manifest_compiler.py \
            --manifest .github/sync-manifest.yml \
            --output-json manifest.full.json

      - name: Select full or exact source-delta plan
        id: manifest
        env:
          PLAN_SCOPE: ${{ steps.scope_request.outputs.plan_scope }}
          SCOPE_BASE_SHA: ${{ steps.scope_request.outputs.scope_base_sha }}
          SOURCE_COMMIT: ${{ steps.scope_request.outputs.source_commit }}
        run: |
          python scripts/scope_consumer_sync_plan.py \
            --plan manifest.full.json \
            --mode "$PLAN_SCOPE" \
            --base-ref "$SCOPE_BASE_SHA" \
            --head-ref "$SOURCE_COMMIT" \
            --repo-root . \
            --output-json manifest.json \
            --scope-evidence-json sync-plan-scope.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Build phase-gated repo matrix
        id: repos
        env:
          CANARY_EVIDENCE_JSON: ${{ inputs.canary_evidence_json || '' }}
          REQUESTED_PHASE: ${{ inputs.phase || 'canary' }}
          REPOS_INPUT: ${{ inputs.repos }}
          TEMPLATE_HASH: ${{ steps.manifest.outputs.template_hash }}
        run: |
          if [ -n "$REPOS_INPUT" ]; then
            repos="$REPOS_INPUT"
          else
            repos=$(echo "$REGISTERED_CONSUMER_REPOS" | tr '\n' ',' | sed 's/,$//')
          fi

          # Scheduled and release runs intentionally begin with canaries. Promotion is
          # a later explicit run with Maint 71's plan-bound evidence; no workflow waits
          # for cross-repo CI inside this run.
          phase="$REQUESTED_PHASE"
          selected_repos_args=()
          if [ -n "$REPOS_INPUT" ]; then
            selected_repos_args=(--selected-repos "$repos")
          fi
          python scripts/select_consumer_sync_phase.py \
            --plan manifest.json \
            --phase "$phase" \
            --registered-repos "$(echo "$REGISTERED_CONSUMER_REPOS" | tr '\n' ',' | sed 's/,$//')" \
            "${selected_repos_args[@]}" \
            --canaries config/consumer_sync_canaries.json \
            --canary-evidence-json "$CANARY_EVIDENCE_JSON" \
            --output sync-phase-selection.json
          echo "matrix=$(jq -c '.matrix' sync-phase-selection.json)" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          if [ "$phase" = "canary" ]; then
            # Candidate corrections update the same bounded PR in each canary.
            sync_branch="sync/workflows-candidate"
          else
            # Promotion also uses one stable delivery PR per repository. The
            # plan/hash remains immutable in the delivery record rather than in
            # a replacement branch name.
            sync_branch="sync/workflows-delivery"
          fi
          echo "sync_branch=$sync_branch" >> "$GITHUB_OUTPUT"
          echo "Selected phase: $phase"
          echo "Sync branch: $sync_branch"
          jq -r '.selected_repos[]' sync-phase-selection.json

      - name: Upload plan and prospective-diff evidence
        uses: actions/upload-artifact@v7
        with:
          name: sync-plan-and-prospective-diffs
          path: |
            manifest.full.json
            manifest.json
            sync-plan-scope.json
            sync-phase-selection.json
          retention-days: 1

  # ============================================================================
  # VALIDATE: Ensure files pass lint before syncing
  # ============================================================================
  validate:
    name: Validate sync files
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install lint tools
        run: pip install ruff pyyaml

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: sync-plan-and-prospective-diffs

      - name: Validate Python scripts
        run: |
          set -euo pipefail

          # Read scripts from manifest
          scripts=$(python3 -c "
          import json
          with open('manifest.json') as f:
              m = json.load(f)
          for s in m.get('entries', []):
              if s.get('section') != 'scripts':
                  continue
              src = s.get('resolved_source', '')
              if src.endswith('.py'):
                  print(src)
          ")

          failed=0
          for script in $scripts; do
            if [ -f "$script" ]; then
              echo "Checking $script..."
              # Use ruff without --select override so
              # pyproject.toml rules apply (matches CI).
              if ! ruff check "$script"; then
                echo "::error::$script fails lint"
                failed=1
              fi
            fi
          done

          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "✓ All Python scripts pass lint"

      - name: Validate YAML syntax
        run: |
          set -euo pipefail

          # Read workflows from manifest
          workflows=$(python3 -c "
          import json
          with open('manifest.json') as f:
              m = json.load(f)
          for w in m.get('entries', []):
              if w.get('section') != 'workflows':
                  continue
              src = w.get('resolved_source', '')
              if src.endswith('.yml') or src.endswith('.yaml'):
                  print(src)
          ")

          for workflow in $workflows; do
            if [ -f "$workflow" ]; then
              echo "Validating $workflow..."
              python3 -c "import yaml; yaml.safe_load(open('$workflow'))"
            fi
          done
          echo "✓ All workflow YAML is valid"

  # ============================================================================
  # SYNC: Apply template to each consumer repo
  # ============================================================================
  sync:
    name: Sync ${{ matrix.repo }}
    needs: [prepare, validate]
    if: needs.prepare.outputs.phase != 'preview' && needs.prepare.outputs.has_plan_items == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.repos) }}
    env:
      # Job-level alias for repo token (uses OWNER_PR_PAT or SERVICE_BOT_PAT)
      REPO_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT }}
      TARGET_REPOSITORY: ${{ matrix.repo }}
      PLAN_ID: ${{ needs.prepare.outputs.plan_id }}
      PLAN_SCOPE: ${{ needs.prepare.outputs.plan_scope }}
      SCOPE_BASE_SHA: ${{ needs.prepare.outputs.scope_base_sha }}
      PLAN_SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
      SYNC_PHASE: ${{ needs.prepare.outputs.phase }}
      CANARY_EVIDENCE_JSON: ${{ inputs.canary_evidence_json || '' }}
      DURABLE_ISSUE_URL: https://github.com/stranske/Workflows/issues/1836
    steps:
      - name: Compute result artifact name
        id: repo_meta
        run: |
          repo_full="$TARGET_REPOSITORY"
          case "$repo_full" in
            */*) ;;
            *) echo "::error::Consumer repository must use owner/name form: $repo_full"; exit 1 ;;
          esac
          repo_owner=${repo_full%%/*}
          repo_name=${repo_full#*/}
          safe_name=$(printf '%s' "$repo_full" \
            | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^-+|-+$//g')
          {
            echo "artifact_name=${safe_name:-unknown-repo}"
            echo "repo_owner=$repo_owner"
            echo "repo_name=$repo_name"
          } >> "$GITHUB_OUTPUT"

      - name: Mint Workflows App commit token
        id: workflows_app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.WORKFLOWS_APP_ID }}
          private-key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          owner: ${{ steps.repo_meta.outputs.repo_owner }}
          repositories: ${{ steps.repo_meta.outputs.repo_name }}
          permission-contents: write
          permission-workflows: write

      - name: Checkout Workflows
        uses: actions/checkout@v7
        with:
          path: workflows
          ref: ${{ needs.prepare.outputs.source_commit }}

      - name: Clone consumer repo
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
        run: |
          gh repo clone "$TARGET_REPOSITORY" consumer -- --depth=1

      - name: Record exact consumer base
        id: consumer_base
        run: |
          set -euo pipefail
          consumer_head_sha=$(git -C consumer rev-parse HEAD)
          [[ "$consumer_head_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Unable to resolve the consumer base commit"
            exit 1
          }
          echo "sha=$consumer_head_sha" >> "$GITHUB_OUTPUT"

      - name: Download manifest
        uses: actions/download-artifact@v8
        with:
          name: sync-plan-and-prospective-diffs

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Detect and apply changes
        id: sync
        env:
          CURRENT_REPO: ${{ matrix.repo }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 << 'SYNC_SCRIPT'
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          # Load manifest
          with open('manifest.json') as f:
              manifest = json.load(f)

          if manifest.get('schema') != 'workflows.consumer-sync-plan/v1':
              raise ValueError('unsupported consumer sync plan schema')
          entries = manifest.get('entries')
          removals = manifest.get('removals')
          if not isinstance(entries, list) or not isinstance(removals, list):
              raise ValueError('consumer sync plan entries/removals must be arrays')

          # Write the complete list of manifest-declared sync targets so the PR
          # creation step can stage ONLY intended files.
          #
          # This prevents sync PRs from accidentally including consumer repo
          # artifacts (e.g., requirements.lock, *.pyc, *.egg-info) that may be
          # tracked in some repos or generated by CI/autofix.
          targets = {
              item['target']
              for item in [*entries, *removals]
              if item.get('target')
          }

          Path('sync_targets.txt').write_text(
              ''.join(f"{path}\n" for path in sorted(targets) if path),
              encoding='utf-8',
          )

          # Preserve the established section-specific copy behavior while making
          # the compiler's normalized plan the only source of path resolution.
          by_section = {}
          for entry in entries:
              by_section.setdefault(entry['section'], []).append(entry)
          manifest = {**by_section, 'removals': removals}

          current_repo = os.environ.get('CURRENT_REPO', '')
          dry_run = os.environ.get('DRY_RUN', 'false') == 'true'
          force = os.environ.get('FORCE', 'false') == 'true'

          changes = []
          skipped = []

          def manifest_skip_reason(item, repo):
              """Return the manifest-declared skip reason for this repo, if any."""
              if repo in (item.get('skip_repos') or []):
                  reasons = item.get('skip_reasons') or {}
                  return str(reasons.get(repo) or 'Manifest skip for repo')
              return ''

          def repo_overwrites_create_only(item, repo):
              """Return whether repo should ignore create_only for this manifest item."""
              overwrite_repos = item.get('overwrite_repos', [])
              return isinstance(overwrite_repos, list) and repo in overwrite_repos

          def comparable_lines(path):
              """Return file lines after leading comment/blank header lines."""
              lines = path.read_text().splitlines()
              index = 0
              while index < len(lines):
                  stripped = lines[index].strip()
                  if stripped == '' or stripped.startswith('#'):
                      index += 1
                      continue
                  break
              return lines[index:]

          def files_differ(src, dst):
              """Compare files, ignoring only leading comment headers."""
              if not dst.exists():
                  return True
              if not src.exists():
                  return False

              return comparable_lines(src) != comparable_lines(dst)

          def sync_file(source_path, target_path, description, skip_condition=None, item=None):
              """Sync a single file from template to consumer."""
              src = Path(source_path)
              dst = Path(target_path)
              relative_target = (
                  str(dst.relative_to(Path('consumer')))
                  if dst.is_absolute() is False and str(dst).startswith('consumer/')
                  else str(dst)
              )

              skip_reason = manifest_skip_reason(item or {}, current_repo)
              if skip_reason:
                  skipped.append(f"{relative_target}: {skip_reason}")
                  return False

              if skip_condition and skip_condition():
                  skipped.append(f"{dst.name}: {skip_condition.__doc__}")
                  return False

              if not src.exists():
                  print(f"  ⚠ Source missing: {src}")
                  return False

              if force or files_differ(src, dst):
                  if not dry_run:
                      dst.parent.mkdir(parents=True, exist_ok=True)
                      shutil.copy2(src, dst)
                  changes.append(f"{dst.name}: {description}")
                  return True
              return False

          def sync_directory(source_path, target_path, description, item=None):
              """Sync an entire directory from template to consumer."""
              src = Path(source_path)
              dst = Path(target_path)
              relative_target = (
                  str(dst.relative_to(Path('consumer')))
                  if dst.is_absolute() is False and str(dst).startswith('consumer/')
                  else str(dst)
              )

              skip_reason = manifest_skip_reason(item or {}, current_repo)
              if skip_reason:
                  skipped.append(f"{relative_target}: {skip_reason}")
                  return False

              if not src.exists() or not src.is_dir():
                  print(f"  ⚠ Source directory missing: {src}")
                  return False

              dir_changes = []
              for src_file in src.rglob('*'):
                  if src_file.is_file():
                      rel_path = src_file.relative_to(src)
                      dst_file = dst / rel_path
                      if force or files_differ(src_file, dst_file):
                          if not dry_run:
                              dst_file.parent.mkdir(parents=True, exist_ok=True)
                              shutil.copy2(src_file, dst_file)
                          dir_changes.append(str(rel_path))

              if dir_changes:
                  changes.append(f"{dst.name}/ ({len(dir_changes)} files): {description}")
              return len(dir_changes) > 0

          def remove_path(target_path, description):
              """Remove an obsolete path from the consumer repo."""
              dst = Path(target_path)
              if not dst.exists():
                  return False
              if not dry_run:
                  if dst.is_dir():
                      shutil.rmtree(dst)
                  else:
                      dst.unlink()
              changes.append(f"removed {dst}: {description}")
              return True

          # Process workflows
          print("Processing workflows...")
          for item in manifest.get('workflows', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              sync_mode = item.get('sync_mode', 'sync')

              # Build paths
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']

              # Skip conditions
              def skip_create_only():
                  """File exists and sync_mode is create_only"""
                  return (
                      sync_mode == 'create_only'
                      and consumer_dst.exists()
                      and not repo_overwrites_create_only(item, current_repo)
                  )

              # Determine skip function. Repo-specific exclusions (e.g. Manager-Database's
              # fully custom Gate) now come from the manifest's skip_repos and are enforced
              # inside sync_file via manifest_skip_reason, so no per-file special-casing here.
              skip_fn = skip_create_only if sync_mode == 'create_only' else None

              sync_file(template_src, consumer_dst, description, skip_fn, item)

          # Process prompts
          print("Processing prompts...")
          for item in manifest.get('prompts', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']
              sync_file(template_src, consumer_dst, description, item=item)

          # Process scripts
          print("Processing scripts...")
          for item in manifest.get('scripts', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              is_directory = item.get('is_directory', False)
              # Scripts come from .github/scripts/, not templates
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']
              if is_directory:
                  sync_directory(template_src, consumer_dst, description, item)
              else:
                  sync_file(template_src, consumer_dst, description, item=item)

          # Process codex_config
          print("Processing codex config...")
          for item in manifest.get('codex_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']
              sync_file(template_src, consumer_dst, description, item=item)

          # Process copilot_config
          print("Processing copilot config...")
          for item in manifest.get('copilot_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              is_directory = item.get('is_directory', False)
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']

              if is_directory:
                  sync_directory(template_src, consumer_dst, description, item)
              else:
                  sync_file(template_src, consumer_dst, description, item=item)

          # Process templates (markdown templates, instructions, etc.)
          print("Processing templates...")
          for item in manifest.get('templates', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              # Templates come from .github/templates/, same as scripts pattern
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']
              sync_file(template_src, consumer_dst, description, item=item)

          # Process actions
          print("Processing actions...")
          for item in manifest.get('actions', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              is_directory = item.get('is_directory', False)
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']

              if is_directory:
                  sync_directory(template_src, consumer_dst, description, item)
              else:
                  sync_file(template_src, consumer_dst, description, item=item)

          # Process docs
          print("Processing docs...")
          for item in manifest.get('docs', []):
              source = item.get('source', '')
              target = item.get('target', source)
              description = item.get('description', 'No description')
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / target
              sync_file(template_src, consumer_dst, description, item=item)

          # Process llm_config
          print("Processing llm config...")
          for item in manifest.get('llm_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              sync_mode = item.get('sync_mode', 'sync')
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']
              skip_fn = None
              if sync_mode == 'create_only':
                  skip_fn = lambda: (
                      consumer_dst.exists()
                      and not repo_overwrites_create_only(item, current_repo)
                  )
              sync_file(template_src, consumer_dst, description, skip_fn, item)

          # Process git_config
          print("Processing git config...")
          for item in manifest.get('git_config', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']
              sync_file(template_src, consumer_dst, description, item=item)

          # Process issue_templates
          print("Processing issue templates...")
          for item in manifest.get('issue_templates', []):
              source = item.get('source', '')
              description = item.get('description', 'No description')
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / item['target']
              sync_file(template_src, consumer_dst, description, item=item)

          # Process user_docs
          print("Processing user docs...")
          for item in manifest.get('user_docs', []):
              source = item.get('source', '')
              target = item.get('target', source)
              description = item.get('description', 'No description')
              template_src = Path('workflows') / item['resolved_source']
              consumer_dst = Path('consumer') / target
              sync_file(template_src, consumer_dst, description, item=item)

          # Process removals
          print("Processing removals...")
          for item in manifest.get('removals', []) or []:
              target = item.get('target', '')
              description = item.get('description', 'No description')
              if not target:
                  continue
              consumer_dst = Path('consumer') / target
              remove_path(consumer_dst, description)

          # Output results
          print(f"\n{'='*60}")
          print(f"SYNC RESULTS for {current_repo}")
          print(f"{'='*60}")

          if changes:
              print(f"\n✓ {len(changes)} files to sync:")
              for c in changes:
                  print(f"  - {c}")
          else:
              print("\n✓ No changes needed")

          if skipped:
              print(f"\n⊘ {len(skipped)} files skipped:")
              for s in skipped:
                  print(f"  - {s}")

          # The managed .gitignore block is a plan-wide reconciliation, not an
          # implicit source-delta target.  Restrict it to a full plan so an exact
          # source-delta can stage only paths selected by its immutable plan ID.
          # Within a full plan, evaluate both dry and live runs so block-only drift
          # participates in has_changes and PR creation.
          import sys
          sys.path.insert(0, str(Path('workflows')))
          from scripts.sync_status_file_ignores import apply_block_to_file

          plan_scope = os.environ.get('PLAN_SCOPE', '')
          if plan_scope == 'full':
              targets_path = Path('sync_targets.txt')
              target_lines = (
                  targets_path.read_text(encoding='utf-8').splitlines()
                  if targets_path.is_file()
                  else []
              )
              if '.gitignore' not in target_lines:
                  target_lines.append('.gitignore')
                  targets_path.write_text(
                      ''.join(f"{line}\n" for line in sorted(set(filter(None, target_lines)))),
                      encoding='utf-8',
                  )

              gitignore_result = apply_block_to_file(
                  Path('consumer/.gitignore'),
                  dry_run=dry_run,
              )
              if gitignore_result.get('changed'):
                  action = gitignore_result.get('action', 'updated')
                  changes.append(f".gitignore (managed block {action})")

          repo_dirty = False
          if not dry_run:
              status = subprocess.run(
                  ["git", "-C", "consumer", "status", "--porcelain"],
                  check=False,
                  capture_output=True,
                  text=True,
              )
              repo_dirty = bool(status.stdout.strip())

          has_changes = bool(changes) if dry_run else repo_dirty

          # Set outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"changes_count={len(changes)}\n")
              f.write(f"has_changes={'true' if has_changes else 'false'}\n")

          # Write change summary for PR body
          with open('sync_summary.md', 'w') as f:
              f.write("## Sync Summary\n\n")
              if changes:
                  f.write("### Files Updated\n")
                  for c in changes:
                      f.write(f"- {c}\n")
              if skipped:
                  f.write("\n### Files Skipped\n")
                  for s in skipped:
                      f.write(f"- {s}\n")
          SYNC_SCRIPT

      - name: Check for required labels
        id: labels
        if: steps.sync.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
        run: |
          cd consumer

          # Required labels for sync PRs
          required_labels=("sync" "automated" "sync:delivery-staging" "sync:delivery-ready")

          for label in "${required_labels[@]}"; do
            if ! gh label list --json name -q ".[].name" | grep -q "^${label}$"; then
              echo "Creating label: $label"
              description="Automated sync from Workflows"
              color="0e8a16"
              if [ "$label" = "sync:delivery-staging" ]; then
                description="Generated delivery is mutable and must not merge"
                color="d93f0b"
              elif [ "$label" = "sync:delivery-ready" ]; then
                description="Generated delivery is sealed to its exact reviewed head"
                color="0e8a16"
              fi
              gh label create "$label" --description "$description" --color "$color" || true
            fi
          done

          # LangChain Phase 1 labels (agents:format workflow)
          # These labels are required for the issue formatting and optimization workflows
          echo "Ensuring LangChain agent labels exist..."

          gh label create "agents:format" \
            --description "Triggers direct issue formatting to AGENT_ISSUE_TEMPLATE" \
            --color "0E8A16" --force || true

          gh label create "agents:formatted" \
            --description "Issue has been formatted to AGENT_ISSUE_TEMPLATE" \
            --color "1D76DB" --force || true

          gh label create "agents:optimize" \
            --description "Triggers issue analysis with optimization suggestions" \
            --color "FBCA04" --force || true

          gh label create "agents:apply-suggestions" \
            --description "Applies optimization suggestions from agents:optimize" \
            --color "0E8A16" --force || true

      - name: Check for existing sync PR
        id: open_pr
        if: steps.sync.outputs.has_changes == 'true' && inputs.dry_run != true
        uses: actions/github-script@v9
        env:
          SYNC_BRANCH: ${{ needs.prepare.outputs.sync_branch }}
        with:
          github-token: ${{ env.REPO_TOKEN }}
          script: |
            const { isConsumerOpenPr } = require('./workflows/.github/scripts/sync_tracker_state');
            const branchName = process.env.SYNC_BRANCH;
            const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const exists = await isConsumerOpenPr({
              github,
              consumerRepo: process.env.TARGET_REPOSITORY,
              branchPattern: new RegExp(`^${escapeRegex(branchName)}$`),
              core,
            });
            core.setOutput('exists', exists ? 'true' : 'false');
            if (exists) {
              core.notice(`Existing sync PR is already open for ${branchName}`);
            }

      - name: Create sync PR
        id: create_pr
        if: steps.sync.outputs.has_changes == 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ env.REPO_TOKEN }}
          SIGNED_COMMIT_TOKEN: ${{ steps.workflows_app_token.outputs.token }}
          DELIVERY_GENERATION: ${{ needs.prepare.outputs.template_hash }}
          DELIVERY_REPOSITORY: ${{ matrix.repo }}
          SYNC_BRANCH: ${{ needs.prepare.outputs.sync_branch }}
          CHANGES_COUNT: ${{ steps.sync.outputs.changes_count || '0' }}
        run: |
          cd consumer

          branch_name="$SYNC_BRANCH"

          # Configure git for push/fetch authentication using credential helper
          # This avoids exposing token in git remote URL or command output.
          # Must be configured before any git operations that need auth
          # (including the early fetch of an existing sync branch).
          credential_helper="!f() { echo \"username=x-access-token\"; echo \"password=\$GH_TOKEN\"; }; f"
          git config credential.helper "$credential_helper"

          hold_ready_pr() {
            local pr_number="$1"
            local expected_head="$2"
            local pr_json
            local pr_state
            local pr_head
            local pr_is_draft
            local pr_has_auto_merge

            pr_json=$(gh pr view "$pr_number" \
              --json state,headRefOid,isDraft,autoMergeRequest)
            pr_state=$(jq -r .state <<<"$pr_json")
            pr_head=$(jq -r .headRefOid <<<"$pr_json")
            pr_is_draft=$(jq -r .isDraft <<<"$pr_json")
            pr_has_auto_merge=$(jq -r '.autoMergeRequest != null' <<<"$pr_json")
            if [ "$pr_state" != "OPEN" ] || [ "$pr_head" != "$expected_head" ]; then
              echo "::error::Existing PR #$pr_number changed before refresh; refusing to overwrite it."
              return 1
            fi

            # Maint 71 is the sole merge authority. Disable any inherited
            # auto-merge before readiness, body, label, or head mutations.
            if [ "$pr_has_auto_merge" = "true" ]; then
              if ! gh pr merge "$pr_number" --disable-auto; then
                echo "::error::Could not disable auto-merge for PR #$pr_number."
                return 1
              fi
            fi
            if [ "$pr_is_draft" = "true" ]; then
              if ! gh pr ready "$pr_number"; then
                echo "::error::Could not mark legacy draft PR #$pr_number ready for review."
                return 1
              fi
            fi

            pr_json=$(gh pr view "$pr_number" \
              --json state,headRefOid,isDraft,autoMergeRequest)
            pr_state=$(jq -r .state <<<"$pr_json")
            pr_head=$(jq -r .headRefOid <<<"$pr_json")
            pr_is_draft=$(jq -r .isDraft <<<"$pr_json")
            pr_has_auto_merge=$(jq -r '.autoMergeRequest != null' <<<"$pr_json")
            if [ "$pr_state" != "OPEN" ] \
              || [ "$pr_head" != "$expected_head" ] \
              || [ "$pr_is_draft" != "false" ] \
              || [ "$pr_has_auto_merge" != "false" ]; then
                echo "::error::PR #$pr_number is not safely held ready for review."
                return 1
            fi
          }

          # Keep one generated PR per lane current. Both candidate and promoted
          # deliveries use stable branches; immutable plan/hash identity lives in
          # the delivery marker rather than in a replacement PR branch.
          existing_pr=$(gh pr list --head "$branch_name" \
            --json number,headRefName,isCrossRepository \
            | jq -r --arg branch "$branch_name" \
              '.[] | select(.headRefName == $branch and .isCrossRepository == false) | .number' \
            | head -n 1 || echo "")
          existing_head=""
          existing_base=""
          existing_tree=""
          existing_refreshable=false
          existing_refresh_reason="none"
          existing_lifecycle_initialized=false
          existing_verified=false
          existing_verification_reason="not-checked"
          delivery_state="staging"
          review_started_at=""
          sealed_at=""
          sealed_head_sha=""
          review_evidence='{}'
          head_observed_sha=""
          head_observed_at=""
          if [ -n "$existing_pr" ]; then
            echo "Inspecting existing sync PR #$existing_pr for same-generation refresh"
            # Capture the remote head now so a later force push cannot overwrite
            # an intervening consumer edit.
            git fetch origin "$branch_name"
            existing_head=$(git rev-parse FETCH_HEAD)
            existing_base=$(git rev-parse "${existing_head}^")
            existing_tree=$(git rev-parse "${existing_head}^{tree}")
            existing_verification=$(node \
              ../workflows/.github/scripts/create_signed_sync_commit.js \
              --operation verify-commit \
              --repository "$TARGET_REPOSITORY" \
              --commit-sha "$existing_head")
            existing_verified=$(jq -r '.verified // false' <<<"$existing_verification")
            existing_verification_reason=$(jq -r '.verification_reason // "missing"' <<<"$existing_verification")
            existing_body_file=$(mktemp)
            gh pr view "$existing_pr" --json body -q .body >"$existing_body_file" || true
            # shellcheck disable=SC2016 # The embedded Node source must remain literal.
            refresh_json=$(
              EXISTING_BODY_FILE="$existing_body_file" \
              DELIVERY_GENERATION="$DELIVERY_GENERATION" \
              PLAN_ID="$PLAN_ID" \
              DELIVERY_REPOSITORY="$DELIVERY_REPOSITORY" \
              SYNC_PHASE="$SYNC_PHASE" \
              SYNC_BRANCH="$branch_name" \
              node -e '
                const fs = require("fs");
                const { parseDeliveryRecord, mergeEligibility } = require("../workflows/.github/scripts/sync_pr_lease_contract");
                const body = fs.readFileSync(process.env.EXISTING_BODY_FILE || "", "utf8");
                const record = parseDeliveryRecord(body);
                if (!record) {
                  process.stdout.write(JSON.stringify({refreshable:false, reason:"missing_or_invalid"}));
                  process.exit(0);
                }
                const expectedStableBranch = process.env.SYNC_PHASE === "canary"
                  ? "sync/workflows-candidate"
                  : "sync/workflows-delivery";
                const isStableDelivery = process.env.SYNC_BRANCH === expectedStableBranch;
                if (isStableDelivery) {
                  if (record.repository !== (process.env.DELIVERY_REPOSITORY || "")) {
                    process.stdout.write(JSON.stringify({refreshable:false, reason:"repository_mismatch"}));
                    process.exit(0);
                  }
                  if (record.terminal_disposition) {
                    process.stdout.write(JSON.stringify({
                      refreshable: false,
                      reason: `terminal:${record.terminal_disposition}`,
                    }));
                    process.exit(0);
                  }
                  process.stdout.write(JSON.stringify({
                    refreshable: true,
                    reason: "stable_plan_rotation",
                    lifecycle_initialized: Boolean(record.delivery_state),
                    delivery_state: record.delivery_state || "staging",
                    review_started_at: record.review_started_at || "",
                    sealed_at: record.sealed_at || "",
                    sealed_head_sha: record.sealed_head_sha || "",
                    review_evidence: record.review_evidence || {},
                    head_observed_sha: record.head_observed_sha || "",
                    head_observed_at: record.head_observed_at || "",
                  }));
                  process.exit(0);
                }
                if (record.generation !== (process.env.DELIVERY_GENERATION || "")) {
                  process.stdout.write(JSON.stringify({refreshable:false, reason:"generation_mismatch"}));
                  process.exit(0);
                }
                const result = mergeEligibility(record, {
                  planId: process.env.PLAN_ID || "",
                  repository: process.env.DELIVERY_REPOSITORY || "",
                });
                process.stdout.write(JSON.stringify({
                  refreshable: result.eligible,
                  reason: result.reason,
                  lifecycle_initialized: Boolean(record.delivery_state),
                  delivery_state: record.delivery_state || "",
                  review_started_at: record.review_started_at || "",
                  sealed_at: record.sealed_at || "",
                  sealed_head_sha: record.sealed_head_sha || "",
                  review_evidence: record.review_evidence || {},
                  head_observed_sha: record.head_observed_sha || "",
                  head_observed_at: record.head_observed_at || "",
                }));
              '
            )
            rm -f "$existing_body_file"
            existing_refreshable=$(jq -r '.refreshable // false' <<<"$refresh_json")
            existing_refresh_reason=$(jq -r '.reason // "unknown"' <<<"$refresh_json")
            existing_lifecycle_initialized=$(jq -r '.lifecycle_initialized // false' <<<"$refresh_json")
            delivery_state=$(jq -r '.delivery_state // "staging"' <<<"$refresh_json")
            review_started_at=$(jq -r '.review_started_at // ""' <<<"$refresh_json")
            sealed_at=$(jq -r '.sealed_at // ""' <<<"$refresh_json")
            sealed_head_sha=$(jq -r '.sealed_head_sha // ""' <<<"$refresh_json")
            review_evidence=$(jq -c '.review_evidence // {}' <<<"$refresh_json")
            head_observed_sha=$(jq -r '.head_observed_sha // ""' <<<"$refresh_json")
            head_observed_at=$(jq -r '.head_observed_at // ""' <<<"$refresh_json")
            echo "Existing PR #$existing_pr refreshable=${existing_refreshable} reason=${existing_refresh_reason}"
          fi

          # Remote branch exists but no PR was found
          # (likely from a failed previous run) - deleting and recreating
          if [ -z "$existing_pr" ] && git ls-remote --exit-code origin "refs/heads/$branch_name" >/dev/null 2>&1; then
              echo "Remote branch $branch_name exists but no PR was found."
              echo "Deleting and recreating branch from previous failed run."
            # Delete the remote branch so we can push fresh
            delete_output=$(git push origin --delete "$branch_name" 2>&1) || {
                not_found_re='remote ref .* not found'
                not_found_re+='|remote ref does not exist'
                not_found_re+='|could not find remote ref'
                if printf '%s\n' "$delete_output" | grep -qiE "$not_found_re"; then
                echo "Remote branch $branch_name no longer exists; continuing"
              else
                printf '%s\n' "$delete_output" >&2
                exit 1
              fi
            }
          fi

          # Create the current-generation branch from the current consumer base.
          base_sha=$(git rev-parse HEAD)
          git checkout -B "$branch_name"

          # Stage ONLY manifest-declared targets, to avoid accidentally committing
          # consumer-specific artifacts (e.g. requirements.lock, *.pyc, *.egg-info).
          if [ -f "../sync_targets.txt" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              if [ -e "$path" ]; then
                # Use --force so consumer .gitignore rules cannot silently
                # exclude files that the sync manifest declares.
                git add --force -- "$path"
              else
                # Stage deletions for removal targets (or files removed by sync).
                git add -u -- "$path" >/dev/null 2>&1 || true
              fi
            done < "../sync_targets.txt"
          else
            echo "::warning::sync_targets.txt missing; falling back to git add -A"
            git add --force -A
          fi

          desired_tree_hash=$(git write-tree)
          matching_existing=false
          migrating_legacy_lifecycle=false
          if [ -n "$existing_pr" ] \
            && [ "$existing_refreshable" = "true" ] \
            && [ "$existing_base" = "$base_sha" ] \
            && [ "$existing_tree" = "$desired_tree_hash" ] \
            && [ "$existing_verified" = "true" ]; then
            matching_existing=true
            if [ "$existing_lifecycle_initialized" = "true" ]; then
              echo "Existing PR #$existing_pr already matches this base and desired tree; preserving its review lifecycle while refreshing metadata"
            else
              migrating_legacy_lifecycle=true
              delivery_state="staging"
              review_started_at=""
              sealed_at=""
              sealed_head_sha=""
              review_evidence='{}'
              echo "Existing PR #$existing_pr already matches this base and desired tree; migrating its legacy metadata into the staged delivery lifecycle"
            fi
            if [ "$head_observed_sha" != "$existing_head" ] || [ -z "$head_observed_at" ]; then
              head_observed_sha="$existing_head"
              head_observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            fi
          elif [ -n "$existing_pr" ] \
            && [ "$existing_refreshable" = "true" ] \
            && [ "$existing_base" = "$base_sha" ] \
            && [ "$existing_tree" = "$desired_tree_hash" ]; then
            echo "Existing PR #$existing_pr matches the desired tree but its head is not verified."
            echo "Reason: ${existing_verification_reason}; replacing it with a signed commit."
          elif [ -n "$existing_pr" ] && [ "$existing_refreshable" != "true" ]; then
            echo "Existing PR #$existing_pr is not refreshable (${existing_refresh_reason}); leaving it for Maint 71 disposition."
            echo "status=existing_pr_not_refreshable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --cached --quiet && [ "$matching_existing" != "true" ]; then
            echo "No changes to commit after sync; skipping PR creation."
            echo "status=no_committed_changes" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$existing_pr" ] \
            && { [ "$matching_existing" != "true" ] || [ "$migrating_legacy_lifecycle" = "true" ]; }; then
              # Revalidate the selected head, then close every automatic merge
              # path immediately before mutating it. The staging label is
              # enforced by all shared merger lanes and by Gate until Maint 71
              # seals the exact head; PRs remain ready for review throughout.
              if ! hold_ready_pr "$existing_pr" "$existing_head"; then
                echo "status=existing_pr_changed" >> "$GITHUB_OUTPUT"
                exit 1
              fi
              gh pr edit "$existing_pr" --add-label "sync:delivery-staging"
              gh pr edit "$existing_pr" --remove-label "sync:delivery-ready" >/dev/null 2>&1 || true
          fi

          if [ "$matching_existing" != "true" ]; then
            delivery_state="staging"
            review_started_at=""
            sealed_at=""
            sealed_head_sha=""
            review_evidence='{}'
            head_observed_sha=""
            head_observed_at=""
            commit_message_file=$(mktemp)
            signed_result_file=$(mktemp)
            signed_temp_branch="${branch_name}-signed-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            cleanup_signed_commit() {
              if [ -n "${signed_temp_branch:-}" ]; then
                git push --quiet origin --delete "$signed_temp_branch" >/dev/null 2>&1 || true
              fi
              rm -f "${commit_message_file:-}" "${signed_result_file:-}"
            }
            trap cleanup_signed_commit EXIT
            promotion_evidence_line=""
            if [ "$SYNC_PHASE" = "promote" ]; then
              if ! jq -e . >/dev/null 2>&1 <<<"$CANARY_EVIDENCE_JSON"; then
                echo "::error::Promotion evidence is missing or invalid"
                exit 1
              fi
              promotion_evidence_base64=$(printf '%s' "$CANARY_EVIDENCE_JSON" | base64 -w 0)
              promotion_evidence_line="Canary evidence JSON (base64): $promotion_evidence_base64"
            fi
            cat >"$commit_message_file" <<COMMIT_MESSAGE
          chore: sync workflow templates from Workflows repo

          Automated sync from stranske/Workflows
          Template hash: $DELIVERY_GENERATION

          Changes synced from sync-manifest.yml
          Consumer-sync plan ID: $PLAN_ID
          Plan scope: $PLAN_SCOPE
          Scope base SHA: ${SCOPE_BASE_SHA:-full}
          Source commit: $PLAN_SOURCE_COMMIT
          $promotion_evidence_line
          COMMIT_MESSAGE

            GH_TOKEN="$SIGNED_COMMIT_TOKEN" node \
              ../workflows/.github/scripts/create_signed_sync_commit.js \
              --operation create-commit \
              --repository "$TARGET_REPOSITORY" \
              --base-sha "$base_sha" \
              --expected-tree-sha "$desired_tree_hash" \
              --message-file "$commit_message_file" \
              --cwd "$PWD" >"$signed_result_file"
            signed_commit_sha=$(jq -er '.sha' "$signed_result_file")
            signed_credential=$(jq -er '.credential' "$signed_result_file")
            echo "Created verified sync commit $signed_commit_sha using $signed_credential"

            # Give the API-created commit a temporary reachable ref, fetch it
            # locally, then retain git push --force-with-lease as the atomic
            # compare-and-swap for the stable delivery branch.
            GH_TOKEN="$SIGNED_COMMIT_TOKEN" node \
              ../workflows/.github/scripts/create_signed_sync_commit.js \
              --operation create-ref \
              --repository "$TARGET_REPOSITORY" \
              --ref "refs/heads/$signed_temp_branch" \
              --commit-sha "$signed_commit_sha" >/dev/null
            git fetch --quiet origin "$signed_temp_branch"
            fetched_signed_sha=$(git rev-parse FETCH_HEAD)
            fetched_signed_tree=$(git rev-parse "${fetched_signed_sha}^{tree}")
            if [ "$fetched_signed_sha" != "$signed_commit_sha" ] \
              || [ "$fetched_signed_tree" != "$desired_tree_hash" ]; then
              echo "::error::Fetched signed commit does not match the expected commit/tree"
              exit 1
            fi

            if [ -n "$existing_pr" ]; then
              if ! hold_ready_pr "$existing_pr" "$existing_head"; then
                echo "::error::Existing PR #$existing_pr changed during signed commit preparation."
                echo "::error::Refusing to overwrite the changed head."
                exit 1
              fi
              git push --quiet \
                --force-with-lease="refs/heads/$branch_name:$existing_head" \
                origin "$signed_commit_sha:refs/heads/$branch_name"
            else
              git push --quiet origin "$signed_commit_sha:refs/heads/$branch_name"
            fi

            published_verification=$(node \
              ../workflows/.github/scripts/create_signed_sync_commit.js \
              --operation verify-commit \
              --repository "$TARGET_REPOSITORY" \
              --commit-sha "$signed_commit_sha")
            published_verified=$(jq -r '.verified // false' <<<"$published_verification")
            published_reason=$(jq -r '.verification_reason // "missing"' <<<"$published_verification")
            if [ "$published_verified" != "true" ] || [ "$published_reason" != "valid" ]; then
              echo "::error::Published sync head is not verified (reason=$published_reason)"
              exit 1
            fi
            head_observed_sha="$signed_commit_sha"
            head_observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            git push --quiet origin --delete "$signed_temp_branch" >/dev/null
            signed_temp_branch=""
            rm -f "$commit_message_file" "$signed_result_file"
            trap - EXIT
          fi

          # Create PR
          lease_expires_at=$(date -u -d '+72 hours' +%Y-%m-%dT%H:%M:%SZ)
          sync_marker=$(jq -nc \
            --arg schema "workflows-consumer-sync-pr/v1" \
            --arg consumer_repo "$TARGET_REPOSITORY" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$PLAN_SOURCE_COMMIT" \
            --arg template_hash "$DELIVERY_GENERATION" \
            --arg plan_id "$PLAN_ID" \
            --arg plan_scope "$PLAN_SCOPE" \
            --arg scope_base_sha "$SCOPE_BASE_SHA" \
            --arg source_commit "$PLAN_SOURCE_COMMIT" \
            --arg sync_phase "$SYNC_PHASE" \
            --arg sync_branch "$branch_name" \
            --arg manifest ".github/sync-manifest.yml" \
            --arg lifecycle_state "$delivery_state" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            --argjson changes_count "$CHANGES_COUNT" \
            '{
              schema: $schema,
              consumer_repo: $consumer_repo,
              source_repository: $source_repository,
              source_sha: $source_sha,
              template_hash: $template_hash,
              plan_id: $plan_id,
              plan_scope: $plan_scope,
              scope_base_sha: $scope_base_sha,
              source_commit: $source_commit,
              sync_phase: $sync_phase,
              sync_branch: $sync_branch,
              manifest: $manifest,
              lifecycle_state: $lifecycle_state,
              run_id: $run_id,
              run_attempt: $run_attempt,
              changes_count: $changes_count
            }')
          delivery_marker=$(jq -nc \
            --arg schema "sync-pr-delivery-record/v1" \
            --arg durable_issue_url "$DURABLE_ISSUE_URL" \
            --arg plan_id "$PLAN_ID" \
            --arg generation "$DELIVERY_GENERATION" \
            --arg repository "$DELIVERY_REPOSITORY" \
            --arg desired_tree_hash "$desired_tree_hash" \
            --arg source_commit "$PLAN_SOURCE_COMMIT" \
            --arg head_observed_sha "$head_observed_sha" \
            --arg head_observed_at "$head_observed_at" \
            --arg lease_expires_at "$lease_expires_at" \
            --arg delivery_state "$delivery_state" \
            --arg review_started_at "$review_started_at" \
            --arg sealed_at "$sealed_at" \
            --arg sealed_head_sha "$sealed_head_sha" \
            --argjson review_evidence "$review_evidence" \
            '{schema:$schema,durable_issue_url:$durable_issue_url,plan_id:$plan_id,generation:$generation,repository:$repository,desired_tree_hash:$desired_tree_hash,source_commit:$source_commit,head_observed_sha:$head_observed_sha,head_observed_at:$head_observed_at,lease_expires_at:$lease_expires_at,predecessor_prs:[],successor_prs:[],delivery_state:$delivery_state,review_started_at:$review_started_at,sealed_at:$sealed_at,sealed_head_sha:$sealed_head_sha,review_evidence:$review_evidence}')
          pr_body=$(cat ../sync_summary.md)
          pr_body="$pr_body

          ---

          ### Review Checklist
          - [ ] CI passes with updated workflows
          - [ ] No repo-specific customizations were overwritten

          **Source:** stranske/Workflows
          **Source SHA:** \`$PLAN_SOURCE_COMMIT\`
          **Template hash:** \`$DELIVERY_GENERATION\`
          **Consumer-sync plan ID:** \`$PLAN_ID\`
          **Plan scope:** \`$PLAN_SCOPE\`
          **Scope base SHA:** \`${SCOPE_BASE_SHA:-full}\`
          **Sync phase:** \`$SYNC_PHASE\`
          **Sync branch:** \`$branch_name\`
          **Consumer repo:** \`$TARGET_REPOSITORY\`
          **Manifest:** \`.github/sync-manifest.yml\`

          <!-- workflows-consumer-sync:v1 $sync_marker -->
          <!-- sync-pr-delivery-record:v1 $delivery_marker -->

          autofix: false"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --body "$pr_body"
            pr_number="$existing_pr"
            pr_url="https://github.com/$TARGET_REPOSITORY/pull/$existing_pr"
            status="refreshed_pr"
          else
            pr_url=$(gh pr create \
              --head "$branch_name" \
              --title "chore: sync workflow templates" \
              --body "$pr_body" \
              --label "sync,automated,sync:delivery-staging")
            pr_number=$(gh pr list --head "$branch_name" \
              --json number,headRefName,isCrossRepository \
              | jq -r --arg branch "$branch_name" \
                '.[] | select(.headRefName == $branch and .isCrossRepository == false) | .number' \
              | head -n 1 || echo "")
            status="created_pr"
          fi
          {
            echo "status=$status"
            echo "pr_number=$pr_number"
            echo "pr_url=$pr_url"
          } >> "$GITHUB_OUTPUT"

      - name: Dry run summary
        if: inputs.dry_run == true
        env:
          CHANGES_COUNT: ${{ steps.sync.outputs.changes_count }}
        run: |
          {
            echo "## Dry Run Summary"
            echo ""
            echo "**Repo:** $TARGET_REPOSITORY"
            echo "**Changes:** $CHANGES_COUNT"
            echo ""
            cat sync_summary.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write sync result artifact
        if: always()
        env:
          REPO: ${{ matrix.repo }}
          TEMPLATE_HASH: ${{ needs.prepare.outputs.template_hash }}
          PLAN_ID: ${{ needs.prepare.outputs.plan_id }}
          PLAN_SCOPE: ${{ needs.prepare.outputs.plan_scope }}
          SCOPE_BASE_SHA: ${{ needs.prepare.outputs.scope_base_sha }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          CONSUMER_HEAD_SHA: ${{ steps.consumer_base.outputs.sha || '' }}
          SYNC_PHASE: ${{ needs.prepare.outputs.phase }}
          SYNC_BRANCH: ${{ needs.prepare.outputs.sync_branch }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE: ${{ inputs.force || 'false' }}
          SYNC_OUTCOME: ${{ steps.sync.outcome || 'skipped' }}
          LABELS_OUTCOME: ${{ steps.labels.outcome || 'skipped' }}
          CREATE_PR_OUTCOME: ${{ steps.create_pr.outcome || 'skipped' }}
          CREATE_PR_STATUS: ${{ steps.create_pr.outputs.status || '' }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pr_number || '' }}
          PR_URL: ${{ steps.create_pr.outputs.pr_url || '' }}
          HAS_CHANGES: ${{ steps.sync.outputs.has_changes || 'false' }}
          CHANGES_COUNT: ${{ steps.sync.outputs.changes_count || '0' }}
        run: |
          mkdir -p artifacts/consumer-sync-results
          python3 << 'RESULT_SCRIPT'
          import json
          import os
          import re
          from pathlib import Path

          repo = os.environ["REPO"]
          safe_repo = re.sub(r"[^A-Za-z0-9_.-]+", "-", repo).strip("-") or "unknown-repo"
          dry_run = os.environ.get("DRY_RUN", "false") == "true"
          has_changes = os.environ.get("HAS_CHANGES", "false") == "true"
          changes_count = int(os.environ.get("CHANGES_COUNT") or "0")
          sync_outcome = os.environ.get("SYNC_OUTCOME", "skipped")
          labels_outcome = os.environ.get("LABELS_OUTCOME", "skipped")
          create_outcome = os.environ.get("CREATE_PR_OUTCOME", "skipped")
          create_status = os.environ.get("CREATE_PR_STATUS", "")

          if sync_outcome == "failure":
              status = "sync_failed"
          elif labels_outcome == "failure":
              status = "label_failed"
          elif not has_changes:
              status = "no_changes"
          elif dry_run:
              status = "dry_run_changes"
          elif create_outcome == "failure":
              status = "create_pr_failed"
          else:
              status = create_status or "error"

          result = {
              "repo": repo,
              "status": status,
              "template_hash": os.environ.get("TEMPLATE_HASH", ""),
              "plan_id": os.environ.get("PLAN_ID", ""),
              "plan_scope": os.environ.get("PLAN_SCOPE", "") or "full",
              "scope_base_sha": os.environ.get("SCOPE_BASE_SHA", ""),
              "source_commit": os.environ.get("SOURCE_COMMIT", ""),
              "consumer_head_sha": os.environ.get("CONSUMER_HEAD_SHA", ""),
              "sync_phase": os.environ.get("SYNC_PHASE", ""),
              "expected_branch": os.environ.get("SYNC_BRANCH", ""),
              "dry_run": dry_run,
              "force": os.environ.get("FORCE", "false") == "true",
              "has_changes": has_changes,
              "changes_count": changes_count,
              "outcomes": {
                  "sync": sync_outcome,
                  "labels": labels_outcome,
                  "create_pr": create_outcome,
              },
          }
          pr_number = os.environ.get("PR_NUMBER", "")
          if pr_number:
              result["pr"] = int(pr_number)
          pr_url = os.environ.get("PR_URL", "")
          if pr_url:
              result["pr_url"] = pr_url

          Path(f"artifacts/consumer-sync-results/{safe_repo}.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          RESULT_SCRIPT

      - name: Upload sync result artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-sync-result-${{ steps.repo_meta.outputs.artifact_name || 'unknown-repo' }}
          path: artifacts/consumer-sync-results/*.json
          retention-days: 14

  # ============================================================================
  # SUMMARY: Generate overall sync report
  # ============================================================================
  summary:
    name: Generate summary
    needs: [prepare, validate, sync]
    runs-on: ubuntu-latest
    if: always()
    env:
      CONSUMER_SYNC_RUN_REPORT_JSON: artifacts/consumer-sync-run-report.json
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts/sync_run_contract.js
          sparse-checkout-cone-mode: false

      - name: Download sync result artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: consumer-sync-result-*
          path: artifacts/consumer-sync-results
          merge-multiple: true

      - name: Build sync run report
        run: |
          mkdir -p artifacts
          node << 'REPORT_SCRIPT'
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            buildMarkdownSummary,
            buildSyncRunReport,
          } = require('./.github/scripts/sync_run_contract');

          function parseRepos(value) {
            if (!value) return [];
            const parsed = JSON.parse(value);
            return Array.isArray(parsed.repo) ? parsed.repo : [];
          }

          const resultsDir = 'artifacts/consumer-sync-results';
          const results = fs.existsSync(resultsDir)
            ? fs.readdirSync(resultsDir)
                .filter((name) => name.endsWith('.json'))
                .sort()
                .map((name) => JSON.parse(
                  fs.readFileSync(path.join(resultsDir, name), 'utf8'),
                ))
            : [];

          const registeredRepos = (process.env.REGISTERED_CONSUMER_REPOS || '')
            .split(/\r?\n/)
            .map((repo) => repo.trim())
            .filter(Boolean);

          const report = buildSyncRunReport({
            results,
            targetRepos: parseRepos(process.env.TARGET_REPOS_JSON || ''),
            registeredRepos,
            templateHash: process.env.TEMPLATE_HASH || '',
            dryRun: process.env.DRY_RUN === 'true',
            force: process.env.FORCE === 'true',
            run: {
              repository: process.env.GITHUB_REPOSITORY,
              run_id: Number(process.env.GITHUB_RUN_ID || 0),
              run_number: Number(process.env.GITHUB_RUN_NUMBER || 0),
              workflow: process.env.GITHUB_WORKFLOW,
              ref: process.env.GITHUB_REF,
              sha: process.env.GITHUB_SHA,
            },
          });

          fs.writeFileSync(
            process.env.CONSUMER_SYNC_RUN_REPORT_JSON,
            `${JSON.stringify(report, null, 2)}\n`,
            'utf8',
          );
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, buildMarkdownSummary(report), 'utf8');
          REPORT_SCRIPT
        env:
          TARGET_REPOS_JSON: ${{ needs.prepare.outputs.repos || '{"repo":[]}' }}
          TEMPLATE_HASH: ${{ needs.prepare.outputs.template_hash || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          FORCE: ${{ inputs.force || 'false' }}

      - name: Generate summary
        env:
          TEMPLATE_HASH: ${{ needs.prepare.outputs.template_hash }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          TARGET_REPOS_JSON: ${{ needs.prepare.outputs.repos }}
        run: |
          {
            echo "## Consumer Repo Sync Details"
            echo ""
            echo "**Template Hash:** $TEMPLATE_HASH"
            echo "**Dry Run:** $DRY_RUN"
            echo ""
            echo "### Repos Processed"
            printf '%s\n' "$TARGET_REPOS_JSON" \
              | jq -r '.repo[]' \
              | while read -r repo; do
              echo "- $repo"
            done
            echo ""
            echo "---"
            echo "*Sync driven by .github/sync-manifest.yml*"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sync run report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-sync-run-report
          path: ${{ env.CONSUMER_SYNC_RUN_REPORT_JSON }}
          retention-days: 14
          if-no-files-found: warn

  continue-delivery:
    name: Start generated delivery reconciliation
    needs: [prepare, sync]
    if: >-
      ${{
        always() &&
        needs.prepare.result == 'success' &&
        needs.sync.result == 'success' &&
        needs.prepare.outputs.has_plan_items == 'true' &&
        (inputs.dry_run || false) != true &&
        needs.prepare.outputs.phase != 'preview'
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Checkout API retry helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions/setup-api-client
            .github/scripts
            config/consumer_sync_canaries.json
          sparse-checkout-cone-mode: false

      - name: Download per-repository sync results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: consumer-sync-result-*
          path: artifacts/consumer-sync-results
          merge-multiple: true

      - name: Build exact no-change canary evidence
        id: baseline
        env:
          SYNC_PHASE: ${{ needs.prepare.outputs.phase }}
          PLAN_ID: ${{ needs.prepare.outputs.plan_id }}
          PLAN_SCOPE: ${{ needs.prepare.outputs.plan_scope }}
          SCOPE_BASE_SHA: ${{ needs.prepare.outputs.scope_base_sha }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          CANARY_EVIDENCE_JSON: ${{ inputs.canary_evidence_json || '' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const {
            buildNoChangeEvidence,
            buildNoChangeCanaryEvidence,
            mergeCampaignNoChangeEvidence,
          } = require('./.github/scripts/sync_run_contract.js');
          const canaryConfig = JSON.parse(
            fs.readFileSync('config/consumer_sync_canaries.json', 'utf8'),
          );
          const expectedCanaries = (canaryConfig.canaries || [])
            .map((entry) => String(entry.repo || '').trim())
            .filter(Boolean);
          const resultsDir = 'artifacts/consumer-sync-results';
          const results = fs.existsSync(resultsDir)
            ? fs.readdirSync(resultsDir)
                .filter((name) => name.endsWith('.json'))
                .sort()
                .map((name) => JSON.parse(
                  fs.readFileSync(path.join(resultsDir, name), 'utf8'),
                ))
            : [];
          const baseline = buildNoChangeCanaryEvidence({
            results,
            expectedCanaries,
            planId: process.env.PLAN_ID,
            planScope: process.env.PLAN_SCOPE,
            scopeBaseSha: process.env.SCOPE_BASE_SHA,
            sourceCommit: process.env.SOURCE_COMMIT,
          });
          if (!baseline.ok) {
            throw new Error(
              `Unsafe no-change canary evidence: ${baseline.errors.join(', ')}`,
            );
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `evidence_json=${JSON.stringify(baseline.evidence)}\n`,
          );
          let campaignEvidence = {
            schema: 'workflows.consumer-sync-no-change-evidence/v1',
            version: 1,
            results: [],
          };
          if (process.env.SYNC_PHASE === 'promote') {
            const nonAdminRepos = String(process.env.REGISTERED_CONSUMER_REPOS || '')
              .split(/\s+/)
              .map((repo) => repo.trim())
              .filter((repo) => repo && repo !== 'stranske/Collab-Admin');
            const deliveryBaseline = buildNoChangeEvidence({
              results,
              expectedRepositories: nonAdminRepos,
              planId: process.env.PLAN_ID,
              planScope: process.env.PLAN_SCOPE,
              scopeBaseSha: process.env.SCOPE_BASE_SHA,
              sourceCommit: process.env.SOURCE_COMMIT,
            });
            if (!deliveryBaseline.ok) {
              throw new Error(
                `Unsafe no-change delivery evidence: ${deliveryBaseline.errors.join(', ')}`,
              );
            }
            const rawCanaryEvidence = JSON.parse(process.env.CANARY_EVIDENCE_JSON || '{}');
            const canaryRows = (rawCanaryEvidence.results || []).filter(
              (row) => row.evidence_source === 'no-change-canary',
            );
            campaignEvidence = mergeCampaignNoChangeEvidence(
              canaryRows,
              deliveryBaseline.evidence,
            );
          }
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `campaign_evidence_json=${JSON.stringify(campaignEvidence)}\n`,
          );
          NODE

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}

      - name: Dispatch Maint 71 for the generated lane
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SYNC_PHASE: ${{ needs.prepare.outputs.phase }}
          PLAN_ID: ${{ needs.prepare.outputs.plan_id }}
          PLAN_SCOPE: ${{ needs.prepare.outputs.plan_scope }}
          SCOPE_BASE_SHA: ${{ needs.prepare.outputs.scope_base_sha }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source_commit }}
          CANARY_BASELINE_EVIDENCE_JSON: ${{ steps.baseline.outputs.evidence_json }}
          CAMPAIGN_NO_CHANGE_EVIDENCE_JSON: ${{ steps.baseline.outputs.campaign_evidence_json }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-68-continue-generated-delivery',
              capabilities: ['actions:write'],
            });
            const phase = process.env.SYNC_PHASE;
            // Candidate heads stay open after canary validation. Promotion prepares
            // the non-canary delivery heads, then Maint 71 commits both stable lanes
            // from one exact-head campaign authorization.
            const activeSyncHash = phase === 'canary' ? 'candidate' : 'campaign';
            const nonAdminRepos = String(process.env.REGISTERED_CONSUMER_REPOS || '')
              .split(/\s+/)
              .map((repo) => repo.trim())
              .filter((repo) => repo && repo !== 'stranske/Collab-Admin');
            const inputs = {
              active_sync_hash: activeSyncHash,
              auto_merge: 'true',
              dry_run: 'false',
              cleanup_branches: 'true',
              immutable_handoff_json: JSON.stringify({
                plan_id: process.env.PLAN_ID,
                plan_scope: process.env.PLAN_SCOPE,
                scope_base_sha: process.env.SCOPE_BASE_SHA,
                source_commit: process.env.SOURCE_COMMIT,
              }),
            };
            if (activeSyncHash === 'candidate') {
              inputs.canary_baseline_evidence_json =
                process.env.CANARY_BASELINE_EVIDENCE_JSON || '';
            }
            if (activeSyncHash === 'campaign') {
              inputs.campaign_no_change_evidence_json =
                process.env.CAMPAIGN_NO_CHANGE_EVIDENCE_JSON || '';
            }
            if (activeSyncHash === 'campaign') inputs.repos = nonAdminRepos.join(',');
            await withRetry((client) => client.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'maint-71-merge-sync-prs.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs,
            }));
            core.notice(`Dispatched Maint 71 ${activeSyncHash} reconciliation`);

  # ============================================================================
  # FAILURE NOTIFICATION: Create issue when sync fails
  # ============================================================================
  notify-failure:
    name: Create failure issue
    needs: [prepare, validate, sync]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
          sparse-checkout-cone-mode: false

      - name: Determine failure details
        id: failure
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SYNC_RESULT: ${{ needs.sync.result }}
        run: |
          failed_jobs=""
          if [ "$PREPARE_RESULT" = "failure" ]; then
            failed_jobs="prepare (manifest loading)"
          fi
          if [ "$VALIDATE_RESULT" = "failure" ]; then
            failed_jobs="${failed_jobs:+$failed_jobs, }validate (lint/syntax check)"
          fi
          if [ "$SYNC_RESULT" = "failure" ]; then
            failed_jobs="${failed_jobs:+$failed_jobs, }sync (consumer repo updates)"
          fi
          echo "failed_jobs=${failed_jobs:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Check for existing open issue
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look for existing open sync failure issues
          existing=$(gh issue list \
            --label "sync-failure,automated" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "existing_issue=$existing" >> "$GITHUB_OUTPUT"
            echo "Found existing sync failure issue: #$existing"
          else
            echo "existing_issue=" >> "$GITHUB_OUTPUT"
            echo "No existing sync failure issue found"
          fi

      - name: Ensure labels exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "sync-failure" \
            --description "Consumer repo sync workflow failed" \
            --color "B60205" --force || true
          gh label create "automated" \
            --description "Automatically created issue" \
            --color "0e8a16" --force || true

      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXISTING_ISSUE: ${{ steps.check.outputs.existing_issue }}
          FAILED_JOBS: ${{ steps.failure.outputs.failed_jobs }}
          RUN_URL: >-
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
          TRIGGER_REF: ${{ github.ref_name }}
        run: |
          # Format consumer repos as markdown list
          affected_repos=$(echo "$REGISTERED_CONSUMER_REPOS" \
            | sed '/^$/d' \
            | sed 's/^/          - /')

          issue_body="## 🚨 Consumer Repo Sync Failed

          The sync workflow failed to push updates to consumer repositories.

          ### Failure Details
          - **Failed Jobs:** ${FAILED_JOBS}
          - **Trigger:** Push to \`${TRIGGER_REF}\` (${TRIGGER_SHA:0:7})
          - **Run:** [View workflow run](${RUN_URL})
          - **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          ### Impact
          Consumer repos are NOT receiving the latest workflow templates, scripts, and prompts.
          This means new features and bug fixes are not being deployed to:
          ${affected_repos}

          ### Common Causes
          1. **Lint errors** in Python scripts listed in \`sync-manifest.yml\`
          2. **YAML syntax errors** in workflow templates
          3. **Missing files** referenced in the manifest
          4. **API/auth failures** when pushing to consumer repos

          ### Resolution Steps
          1. Check the [failed workflow run](${RUN_URL}) for specific error messages
          2. Fix the underlying issue (lint errors, syntax errors, etc.)
           3. The sync will automatically retry on next push to \`templates/consumer-repo/\`
             or \`sync-manifest.yml\`
          4. Or manually trigger: \`gh workflow run 'Maint 68 Sync Consumer Repos'\`

          ### Prevention
          Run \`ruff check scripts/\` locally before pushing changes to synced scripts.

          ---
          *This issue was automatically created by the sync workflow failure handler.*"

          if [ -n "$EXISTING_ISSUE" ]; then
            # Add comment to existing issue
            gh issue comment "$EXISTING_ISSUE" --body "### 🔄 Sync failed again

          - **Run:** [View workflow run](${RUN_URL})
          - **Failed Jobs:** ${FAILED_JOBS}
          - **Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          The sync workflow continues to fail. Please investigate."
            echo "::warning::Added comment to existing issue #$EXISTING_ISSUE"
          else
            # Create new issue
            gh issue create \
              --title "🚨 Consumer Repo Sync Failed - Action Required" \
              --body "$issue_body" \
              --label "sync-failure,automated,bug"
            echo "::warning::Created new sync failure issue"
          fi
