# .github/workflows/maint-sync-labels.yml
# Syncs core functional labels to consumer repos.
# Only labels in labels-core.yml are synced - these are required for the
# workflow system to function. Repo-specific informational labels are NOT synced.
name: Maint 69 Sync Labels

on:
  push:
    branches: [main]
    paths:
      - ".github/labels-core.yml"
  workflow_dispatch:
    inputs:
      repos:
        description: "Comma-separated list of repos (owner/repo) or 'all' for all consumer repos"
        required: false
        default: "all"
      dry_run:
        description: "Dry run - show what would be synced without making changes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write # Required to create/update labels

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}

      - name: Install js-yaml
        run: npm install --no-save --no-package-lock js-yaml

      - name: Parse labels-core.yml
        id: parse
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const yaml = require('js-yaml');

            const labelsFile = fs.readFileSync('.github/labels-core.yml', 'utf8');
            const labels = yaml.load(labelsFile);

            core.info(`Parsed ${labels.length} core labels from labels-core.yml`);
            core.setOutput('labels', JSON.stringify(labels));

      - name: Determine target repos
        id: repos
        run: |
          if [ "${{ inputs.repos }}" != "all" ] && [ -n "${{ inputs.repos }}" ]; then
            repos="${{ inputs.repos }}"
          else
            repos=$(python scripts/list_registered_consumer_repos.py --separator ',')
          fi
          json_array=$(echo "$repos" \
            | tr ',' '\n' \
            | grep -v '^$' \
            | jq -R -s -c '
              split("\n")
              | map(select(. != ""))
              | map(gsub("^\\s+|\\s+$"; ""))
            ')
          echo "repos=${json_array}" >> "$GITHUB_OUTPUT"
          echo "Target repos: $json_array"

      - name: Assert cross-repo token is present
        if: inputs.dry_run != true
        env:
          REPO_TOKEN: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT }}
        run: |
          if [ -z "${REPO_TOKEN}" ]; then
            echo "::error::Neither OWNER_PR_PAT nor SERVICE_BOT_PAT is set. Cross-repo label writes cannot succeed with the default GITHUB_TOKEN; refusing to report a green run that syncs nothing."
            exit 1
          fi
          echo "Cross-repo token present."

      - name: Sync labels to repos
        uses: actions/github-script@v9
        env:
          LABELS_JSON: ${{ steps.parse.outputs.labels }}
          REPOS_JSON: ${{ steps.repos.outputs.repos }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        with:
          # Live writes require a cross-repo PAT (asserted above). A tokenless dry
          # run performs reads only, so retain the repository token as its fallback.
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const labels = JSON.parse(process.env.LABELS_JSON);
            const repos = JSON.parse(process.env.REPOS_JSON);
            const dryRun = process.env.DRY_RUN === 'true';
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            const summary = [];
            // Aggregated across every repo so a failed write can fail the JOB. Without this,
            // each error was only appended to the run summary and the job still concluded
            // success — a sync that created zero labels looked identical to a clean run.
            let totalErrors = 0;
            const failedRepos = [];
            summary.push('# Label Sync Results\n');
            summary.push(`Mode: ${dryRun ? '🔍 Dry Run' : '✅ Live'}\n`);
            summary.push(`Labels: ${labels.length} core labels\n`);
            summary.push(`Repos: ${repos.length}\n\n`);

            for (const repoFullName of repos) {
              const [owner, repo] = repoFullName.split('/');
              summary.push(`## ${repoFullName}\n`);

              let created = 0, updated = 0, unchanged = 0, errors = 0;

              // Get existing labels
              let existingLabels = [];
              try {
                const { data } = await withRetry(() => github.rest.issues.listLabelsForRepo({
                  owner,
                  repo,
                  per_page: 100
                }));
                existingLabels = data;
              } catch (e) {
                summary.push(`❌ Failed to fetch labels: ${e.message}\n\n`);
                totalErrors++;
                failedRepos.push(`${repoFullName} (label fetch failed)`);
                continue;
              }

              const existingMap = new Map(existingLabels.map(l => [l.name, l]));

              for (const label of labels) {
                const existing = existingMap.get(label.name);

                if (!existing) {
                  // Create new label
                  if (dryRun) {
                    summary.push(`  🆕 Would create: \`${label.name}\`\n`);
                    created++;
                  } else {
                    try {
                      await withRetry(() => github.rest.issues.createLabel({
                        owner,
                        repo,
                        name: label.name,
                        color: label.color,
                        description: label.description
                      }));
                      summary.push(`  ✅ Created: \`${label.name}\`\n`);
                      created++;
                    } catch (e) {
                      summary.push(`  ❌ Failed to create \`${label.name}\`: ${e.message}\n`);
                      errors++;
                    }
                  }
                } else if (
                  existing.color !== label.color ||
                  existing.description !== label.description
                ) {
                  // Update existing label
                  if (dryRun) {
                    summary.push(`  🔄 Would update: \`${label.name}\`\n`);
                    updated++;
                  } else {
                    try {
                      await withRetry(() => github.rest.issues.updateLabel({
                        owner,
                        repo,
                        name: label.name,
                        color: label.color,
                        description: label.description
                      }));
                      summary.push(`  🔄 Updated: \`${label.name}\`\n`);
                      updated++;
                    } catch (e) {
                      summary.push(`  ❌ Failed to update \`${label.name}\`: ${e.message}\n`);
                      errors++;
                    }
                  }
                } else {
                  unchanged++;
                }
              }

              summary.push(
                `\n📊 Summary: ${created} created, ${updated} updated, ` +
                  `${unchanged} unchanged, ${errors} errors\n\n`,
              );

              if (errors > 0) {
                totalErrors += errors;
                failedRepos.push(`${repoFullName} (${errors})`);
              }
            }

            // Write summary
            await core.summary.addRaw(summary.join('')).write();

            core.info(summary.join(''));

            if (totalErrors > 0) {
              core.setFailed(
                `Label sync failed: ${totalErrors} label sync error(s) across ` +
                  `${failedRepos.length} repo(s): ${failedRepos.join(', ')}`,
              );
            }
