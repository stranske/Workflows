# Automate merging sync PRs in consumer repos
#
# This workflow handles the common cycle of:
# 1. Check sync PR status in all consumer repos
# 2. Merge PRs that pass validation
# 3. Clean up stale branches
#
# Triggers:
# - Manual dispatch (default)
# - Can be called from sync workflow
# - Repository dispatch (event_type: merge-sync-prs) for Codespace triggers
#
# Safety:
# - Merges trusted generated delivery PRs (sync/workflows-* and deps/sync-dev-versions-*)
# - Requires all checks to pass
# - Uses merge commit (not squash) to preserve sync history

name: Merge Sync PRs
run-name: >-
  Merge Sync PRs
  [${{ inputs.active_sync_hash ||
    github.event.client_payload.active_sync_hash ||
    'unscoped' }}]
  ${{ inputs.continuation_key || github.event.client_payload.continuation_key || '' }}

on:
  schedule:
    # Daily janitor pass: auto-merge ready sync PRs, close superseded ones, and prune
    # leftover branches without waiting for a manual dispatch. Health 68 runs from this
    # workflow's successful completion, so it evaluates the post-janitor state.
    # A schedule event carries no inputs, so parseBooleanInput applies its defaults:
    # auto_merge=true, dry_run=false, cleanup_branches=true, repos=all.
    - cron: '30 5 * * *'
  repository_dispatch:
    types: [merge-sync-prs]
  workflow_dispatch:
    inputs:
      repos:
        description: "Repos to check (comma-separated, or 'all')"
        required: false
        type: string
        default: "all"
      auto_merge:
        description: "Auto-merge if checks pass"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run (report only, no merge)"
        required: false
        type: boolean
        default: false
      active_sync_hash:
        description: >-
          Active sync selector (candidate, campaign, or delivery; legacy hash accepted)
        required: false
        type: string
        default: ""
      cleanup_branches:
        description: "Delete sync/workflows-* branches left behind by closed or merged sync PRs"
        required: false
        type: boolean
        default: true
      review_resolution_json:
        description: "Exact-head source-fix proofs for specific review threads"
        required: false
        type: string
        default: ""
      immutable_handoff_json:
        description: >-
          JSON plan binding from Maint 68: plan_id, plan_scope, scope_base_sha, source_commit
        required: false
        type: string
        default: ""
      canary_baseline_evidence_json:
        description: "Exact no-change canary evidence emitted by Maint 68"
        required: false
        type: string
        default: ""
      campaign_no_change_evidence_json:
        description: "Plan-bound exact-head evidence for fleet repositories with no delivery diff"
        required: false
        type: string
        default: ""
      continuation_key:
        description: "Idempotency key for a durable continuation"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      repos:
        description: "Repos to check (comma-separated, or 'all')"
        required: false
        type: string
        default: "all"
      auto_merge:
        description: "Auto-merge if checks pass"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run (report only, no merge)"
        required: false
        type: boolean
        default: false
      active_sync_hash:
        description: >-
          Active sync selector (candidate, campaign, or delivery; legacy hash accepted)
        required: false
        type: string
        default: ""
      sync_hash:
        description: "Deprecated alias for active_sync_hash"
        required: false
        type: string
        default: ""
      cleanup_branches:
        description: "Delete sync/workflows-* branches left behind by closed or merged sync PRs"
        required: false
        type: boolean
        default: true
      review_resolution_json:
        description: "Exact-head source-fix proofs for specific review threads"
        required: false
        type: string
        default: ""
      expected_plan_id:
        description: "Exact consumer-sync plan expected from the calling Maint 68 run"
        required: false
        type: string
        default: ""
      expected_plan_scope:
        description: "Expected plan scope for candidate evidence"
        required: false
        type: string
        default: ""
      expected_scope_base_sha:
        description: "Expected source-delta base SHA, or empty for full scope"
        required: false
        type: string
        default: ""
      expected_source_commit:
        description: "Expected immutable Workflows source commit"
        required: false
        type: string
        default: ""
      canary_baseline_evidence_json:
        description: "Exact no-change canary evidence emitted by Maint 68"
        required: false
        type: string
        default: ""
      campaign_no_change_evidence_json:
        description: "Plan-bound exact-head evidence for fleet repositories with no delivery diff"
        required: false
        type: string
        default: ""
      continuation_key:
        description: "Idempotency key for a durable continuation"
        required: false
        type: string
        default: ""

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: >-
    merge-sync-prs-${{ github.repository }}-${{
      inputs.active_sync_hash ||
      github.event.client_payload.active_sync_hash ||
      'unscoped'
    }}
  cancel-in-progress: false

jobs:
  merge_sync_prs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
      statuses: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          github_token: ${{ github.token }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}

      - name: Extract consumer repos from sync workflow
        id: repos
        run: |
          repos=$(python scripts/list_registered_consumer_repos.py --separator ',')
          echo "list=${repos}" >> "$GITHUB_OUTPUT"
          echo "Extracted repos: ${repos}"

      - name: Resolve immutable handoff inputs
        id: handoff
        env:
          IMMUTABLE_HANDOFF_JSON: >-
            ${{ inputs.immutable_handoff_json ||
                github.event.client_payload.immutable_handoff_json || '' }}
          EXPECTED_PLAN_ID_RAW: >-
            ${{ inputs.expected_plan_id ||
                github.event.client_payload.expected_plan_id || '' }}
          EXPECTED_PLAN_SCOPE_RAW: >-
            ${{ inputs.expected_plan_scope ||
                github.event.client_payload.expected_plan_scope || '' }}
          EXPECTED_SCOPE_BASE_SHA_RAW: >-
            ${{ inputs.expected_scope_base_sha ||
                github.event.client_payload.expected_scope_base_sha || '' }}
          EXPECTED_SOURCE_COMMIT_RAW: >-
            ${{ inputs.expected_source_commit ||
                github.event.client_payload.expected_source_commit || '' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pick = (value) => String(value || '').trim();
          let planId = pick(process.env.EXPECTED_PLAN_ID_RAW);
          let planScope = pick(process.env.EXPECTED_PLAN_SCOPE_RAW);
          let scopeBaseSha = pick(process.env.EXPECTED_SCOPE_BASE_SHA_RAW);
          let sourceCommit = pick(process.env.EXPECTED_SOURCE_COMMIT_RAW);
          const rawJson = pick(process.env.IMMUTABLE_HANDOFF_JSON);
          if (rawJson) {
            try {
              const parsed = JSON.parse(rawJson);
              if (parsed.plan_id != null) planId = pick(parsed.plan_id);
              if (parsed.plan_scope != null) planScope = pick(parsed.plan_scope);
              if (parsed.scope_base_sha != null) scopeBaseSha = pick(parsed.scope_base_sha);
              if (parsed.source_commit != null) sourceCommit = pick(parsed.source_commit);
            } catch (error) {
              throw new Error(`immutable_handoff_json is not valid JSON: ${error.message}`);
            }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_plan_id=${planId}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_plan_scope=${planScope}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_scope_base_sha=${scopeBaseSha}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `expected_source_commit=${sourceCommit}\n`);
          NODE

      - name: Resolve candidate evidence mode
        id: candidate_mode
        env:
          INPUT_ACTIVE_SYNC_HASH: ${{ inputs.active_sync_hash || '' }}
          INPUT_SYNC_HASH: ${{ inputs.sync_hash || '' }}
          DISPATCH_ACTIVE_SYNC_HASH: ${{ github.event.client_payload.active_sync_hash || '' }}
          DISPATCH_SYNC_HASH: ${{ github.event.client_payload.sync_hash || '' }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const prefix = 'sync/workflows-';
          const raw = [
            process.env.INPUT_ACTIVE_SYNC_HASH,
            process.env.INPUT_SYNC_HASH,
            process.env.DISPATCH_ACTIVE_SYNC_HASH,
            process.env.DISPATCH_SYNC_HASH,
          ].map((value) => String(value || '').trim()).find(Boolean) || '';
          const selector = raw.startsWith(prefix) ? raw.slice(prefix.length) : raw;
          if (selector && !['candidate', 'campaign'].includes(selector)) {
            throw new Error('active sync selector must be candidate or campaign');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `selector=${selector}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `candidate=${selector === 'candidate'}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `campaign=${selector === 'campaign'}\n`);
          NODE

      - name: Apply proof-bound candidate review resolutions
        id: candidate_review_resolution
        if: >-
          ${{
            (steps.candidate_mode.outputs.candidate == 'true' ||
             steps.candidate_mode.outputs.campaign == 'true') &&
            inputs.review_resolution_json != ''
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REPOS_INPUT: all
          AUTO_MERGE_INPUT: "false"
          DRY_RUN_INPUT: "true"
          ACTIVE_SYNC_HASH_INPUT: ${{ steps.candidate_mode.outputs.selector }}
          EXPECTED_PLAN_ID_INPUT: ${{ steps.handoff.outputs.expected_plan_id }}
          EXPECTED_PLAN_SCOPE_INPUT: ${{ steps.handoff.outputs.expected_plan_scope }}
          EXPECTED_SCOPE_BASE_SHA_INPUT: ${{ steps.handoff.outputs.expected_scope_base_sha }}
          EXPECTED_SOURCE_COMMIT_INPUT: ${{ steps.handoff.outputs.expected_source_commit }}
          CANARY_BASELINE_EVIDENCE_JSON: ${{ inputs.canary_baseline_evidence_json || github.event.client_payload.canary_baseline_evidence_json || '' }}
          CAMPAIGN_NO_CHANGE_EVIDENCE_JSON: ${{ inputs.campaign_no_change_evidence_json || github.event.client_payload.campaign_no_change_evidence_json || '' }}
          CLEANUP_BRANCHES_INPUT: "false"
          EVIDENCE_ONLY_INPUT: "false"
          RESOLUTION_ONLY_INPUT: "true"
          CONSUMER_SYNC_CANARIES_PATH: config/consumer_sync_canaries.json
          CONSUMER_SYNC_REVIEW_POLICY_PATH: config/consumer_sync_review_policy.json
          TRUSTED_SYNC_ACTORS: stranske,stranske-automation-bot,github-actions[bot]
          TRUSTED_REVIEW_RESOLUTION_ACTORS: stranske,stranske-automation-bot
          REVIEW_RESOLUTION_JSON: ${{ inputs.review_resolution_json }}
          EXCLUDED_REPOS_INPUT: stranske/Collab-Admin
          SYNC_PR_MERGE_REPORT_JSON: artifacts/sync-review-resolution-report.json
          REGISTERED_REPOS_INPUT: ${{ steps.repos.outputs.list }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT }}
          script: |
            const { run } = require("./.github/scripts/maint71_merge_sync_prs.js");
            await run({ github, context, core });

      - name: Collect and validate canary evidence before merge
        id: candidate_evidence
        if: ${{ always() && steps.candidate_mode.outputs.candidate == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REPOS_INPUT: ${{ inputs.repos || github.event.client_payload.repos || 'all' }}
          AUTO_MERGE_INPUT: "false"
          DRY_RUN_INPUT: "true"
          ACTIVE_SYNC_HASH_INPUT: ${{ steps.candidate_mode.outputs.selector }}
          EXPECTED_PLAN_ID_INPUT: ${{ steps.handoff.outputs.expected_plan_id }}
          EXPECTED_PLAN_SCOPE_INPUT: ${{ steps.handoff.outputs.expected_plan_scope }}
          EXPECTED_SCOPE_BASE_SHA_INPUT: ${{ steps.handoff.outputs.expected_scope_base_sha }}
          EXPECTED_SOURCE_COMMIT_INPUT: ${{ steps.handoff.outputs.expected_source_commit }}
          CANARY_BASELINE_EVIDENCE_JSON: ${{ inputs.canary_baseline_evidence_json || github.event.client_payload.canary_baseline_evidence_json || '' }}
          CLEANUP_BRANCHES_INPUT: "false"
          EVIDENCE_ONLY_INPUT: "true"
          CONSUMER_SYNC_CANARIES_PATH: config/consumer_sync_canaries.json
          CONSUMER_SYNC_REVIEW_POLICY_PATH: config/consumer_sync_review_policy.json
          TRUSTED_SYNC_ACTORS: stranske,stranske-automation-bot,github-actions[bot]
          TRUSTED_REVIEW_RESOLUTION_ACTORS: stranske,stranske-automation-bot
          REVIEW_RESOLUTION_JSON: ${{ inputs.review_resolution_json || '' }}
          EXCLUDED_REPOS_INPUT: stranske/Collab-Admin
          SYNC_PR_MERGE_REPORT_JSON: artifacts/sync-pr-premerge-report.json
          REGISTERED_REPOS_INPUT: ${{ steps.repos.outputs.list }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT }}
          script: |
            const { run } = require("./.github/scripts/maint71_merge_sync_prs.js");
            await run({ github, context, core });

      - name: Persist pre-merge canary evidence
        id: candidate_artifact
        if: ${{ always() && steps.candidate_mode.outputs.candidate == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-canary-evidence-premerge
          path: |
            artifacts/sync-pr-premerge-report.json
            artifacts/sync-canary-evidence.json
          if-no-files-found: error

      - name: Validate complete pre-merge canary evidence
        id: candidate_evidence_validation
        if: >-
          ${{
            always() &&
            steps.candidate_mode.outputs.candidate == 'true' &&
            steps.candidate_evidence.outcome == 'success' &&
            steps.candidate_artifact.outcome == 'success'
          }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const {
            validateCanaryEvidence,
          } = require('./.github/scripts/sync_pr_merge_contract.js');
          const evidence = JSON.parse(
            fs.readFileSync('artifacts/sync-canary-evidence.json', 'utf8'),
          );
          const canaryConfig = JSON.parse(
            fs.readFileSync('config/consumer_sync_canaries.json', 'utf8'),
          );
          const expectedCanaries = (canaryConfig.canaries || [])
            .map((entry) => String(entry.repo || '').trim())
            .filter(Boolean);
          const rows = Array.isArray(evidence) ? evidence : evidence.results;
          const validation = validateCanaryEvidence(rows, expectedCanaries);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `authorized=${validation.ok}\n`);
          if (!validation.ok) {
            console.log(
              `Pre-merge canary evidence remains incomplete: ${validation.errors.join(', ')}`,
            );
          } else {
            console.log(`Validated complete pre-merge evidence for ${validation.plan_id}`);
          }
          NODE

      - name: Check and merge sync PRs
        id: merge
        if: >-
          ${{
            always() &&
            steps.repos.outcome == 'success' &&
            steps.candidate_mode.outcome == 'success'
          }}
        # The executable lives in maint71_merge_sync_prs.js to keep this workflow
        # below GitHub's expression-size limit.  That module owns the
        # sync_pr_merge_contract.js selection, isTrustedGeneratedDeliveryPr,
        # collectDeletableSyncBranches, parseBooleanInput, branch_delete_failed,
        # runtime_ac_merge_guard.js / assertRuntimeAcMergeAllowed, and the
        # sync-pr-merge-report report-only-mode behavior.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REPOS_INPUT: ${{ inputs.repos || github.event.client_payload.repos || 'all' }}
          AUTO_MERGE_INPUT: ${{ inputs.auto_merge }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          ACTIVE_SYNC_HASH_INPUT: ${{ steps.candidate_mode.outputs.selector }}
          EXPECTED_PLAN_ID_INPUT: ${{ steps.handoff.outputs.expected_plan_id }}
          EXPECTED_PLAN_SCOPE_INPUT: ${{ steps.handoff.outputs.expected_plan_scope }}
          EXPECTED_SCOPE_BASE_SHA_INPUT: ${{ steps.handoff.outputs.expected_scope_base_sha }}
          EXPECTED_SOURCE_COMMIT_INPUT: ${{ steps.handoff.outputs.expected_source_commit }}
          CANARY_BASELINE_EVIDENCE_JSON: ${{ inputs.canary_baseline_evidence_json || github.event.client_payload.canary_baseline_evidence_json || '' }}
          CAMPAIGN_NO_CHANGE_EVIDENCE_JSON: ${{ inputs.campaign_no_change_evidence_json || github.event.client_payload.campaign_no_change_evidence_json || '' }}
          CANDIDATE_EVIDENCE_AUTHORIZED: ${{ steps.candidate_evidence_validation.outputs.authorized || 'false' }}
          CANDIDATE_ARTIFACT_RESULT: ${{ steps.candidate_artifact.outcome }}
          PREPARE_ONLY_INPUT: ${{ steps.candidate_mode.outputs.candidate == 'true' || steps.candidate_mode.outputs.campaign == 'true' }}
          CLEANUP_BRANCHES_INPUT: ${{ inputs.cleanup_branches }}
          CONSUMER_SYNC_CANARIES_PATH: config/consumer_sync_canaries.json
          CONSUMER_SYNC_REVIEW_POLICY_PATH: config/consumer_sync_review_policy.json
          TRUSTED_SYNC_ACTORS: stranske,stranske-automation-bot,github-actions[bot]
          TRUSTED_REVIEW_RESOLUTION_ACTORS: stranske,stranske-automation-bot
          REVIEW_RESOLUTION_JSON: ${{ inputs.review_resolution_json || '' }}
          EXCLUDED_REPOS_INPUT: stranske/Collab-Admin
          SYNC_PR_MERGE_REPORT_JSON: artifacts/sync-pr-merge-report.json
          REGISTERED_REPOS_INPUT: ${{ steps.repos.outputs.list }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT }}
          script: |
            const { run } = require("./.github/scripts/maint71_merge_sync_prs.js");
            await run({ github, context, core });

      - name: Authorize exact-head fleet commit
        id: campaign_authorization
        if: >-
          ${{
            always() &&
            steps.candidate_mode.outputs.campaign == 'true' &&
            steps.merge.outcome == 'success'
          }}
        env:
          EXPECTED_PLAN_ID: ${{ steps.handoff.outputs.expected_plan_id }}
          EXPECTED_SOURCE_COMMIT: ${{ steps.handoff.outputs.expected_source_commit }}
          REGISTERED_REPOS_INPUT: ${{ steps.repos.outputs.list }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const {
            buildCampaignCommitAuthorization,
          } = require('./.github/scripts/sync_pr_merge_contract.js');
          const report = JSON.parse(
            fs.readFileSync('artifacts/sync-pr-merge-report.json', 'utf8'),
          );
          const expectedRepositories = String(process.env.REGISTERED_REPOS_INPUT || '')
            .split(',')
            .map((value) => value.trim())
            .filter((value) => value && value !== 'stranske/Collab-Admin');
          const authorization = buildCampaignCommitAuthorization({
            report,
            expectedRepositories,
            planId: process.env.EXPECTED_PLAN_ID,
            sourceCommit: process.env.EXPECTED_SOURCE_COMMIT,
          });
          fs.writeFileSync(
            'artifacts/sync-campaign-commit-authorization.json',
            `${JSON.stringify(authorization, null, 2)}\n`,
          );
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `authorized=${authorization.authorized}\n`);
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `authorization_json=${JSON.stringify(authorization)}\n`,
          );
          if (!authorization.authorized) {
            console.log(`Fleet commit remains held: ${authorization.errors.join(', ')}`);
          } else {
            console.log(`Authorized exact-head fleet commit for ${authorization.plan_id}`);
          }
          NODE

      - name: Commit prepared sync campaign
        id: campaign_commit
        if: >-
          ${{
            always() &&
            steps.candidate_mode.outputs.campaign == 'true' &&
            steps.campaign_authorization.outputs.authorized == 'true'
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          REPOS_INPUT: ${{ inputs.repos || github.event.client_payload.repos || 'all' }}
          AUTO_MERGE_INPUT: "true"
          DRY_RUN_INPUT: "false"
          PREPARE_ONLY_INPUT: "false"
          ACTIVE_SYNC_HASH_INPUT: campaign
          EXPECTED_PLAN_ID_INPUT: ${{ steps.handoff.outputs.expected_plan_id }}
          EXPECTED_PLAN_SCOPE_INPUT: ${{ steps.handoff.outputs.expected_plan_scope }}
          EXPECTED_SCOPE_BASE_SHA_INPUT: ${{ steps.handoff.outputs.expected_scope_base_sha }}
          EXPECTED_SOURCE_COMMIT_INPUT: ${{ steps.handoff.outputs.expected_source_commit }}
          CAMPAIGN_NO_CHANGE_EVIDENCE_JSON: ${{ inputs.campaign_no_change_evidence_json || github.event.client_payload.campaign_no_change_evidence_json || '' }}
          CAMPAIGN_COMMIT_AUTHORIZATION_JSON: ${{ steps.campaign_authorization.outputs.authorization_json }}
          CLEANUP_BRANCHES_INPUT: "false"
          CONSUMER_SYNC_CANARIES_PATH: config/consumer_sync_canaries.json
          CONSUMER_SYNC_REVIEW_POLICY_PATH: config/consumer_sync_review_policy.json
          TRUSTED_SYNC_ACTORS: stranske,stranske-automation-bot,github-actions[bot]
          TRUSTED_REVIEW_RESOLUTION_ACTORS: stranske,stranske-automation-bot
          EXCLUDED_REPOS_INPUT: stranske/Collab-Admin
          SYNC_PR_MERGE_REPORT_JSON: artifacts/sync-pr-merge-report.json
          REGISTERED_REPOS_INPUT: ${{ steps.repos.outputs.list }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT }}
          script: |
            const { run } = require("./.github/scripts/maint71_merge_sync_prs.js");
            await run({ github, context, core });

      - name: Measure completed campaign efficiency
        if: >-
          ${{
            always() &&
            steps.candidate_mode.outputs.campaign == 'true' &&
            steps.campaign_commit.outcome == 'success'
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          CAMPAIGN_PLAN_ID: ${{ steps.handoff.outputs.expected_plan_id }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { github: api, paginateWithRetry, withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-71-measure-completed-campaign',
              capabilities: ['actions:write'],
            });
            const report = JSON.parse(
              fs.readFileSync('artifacts/sync-pr-merge-report.json', 'utf8'),
            );
            const allowed = new Set([
              'merged',
              'branch_deleted',
              'branch_delete_failed',
              'stale_closed',
              'campaign_no_change_verified',
            ]);
            const incomplete = (report.results || []).filter(
              (result) => !allowed.has(String(result.status || '')),
            );
            if (incomplete.length > 0) {
              core.notice(
                `Campaign measurement held: ${incomplete.length} delivery row(s) remain nonterminal`,
              );
              return;
            }
            const planId = String(process.env.CAMPAIGN_PLAN_ID || '').trim();
            if (!planId) {
              core.warning('Campaign completed without an immutable plan id; Health 83 not dispatched');
              return;
            }
            const title = `Health 83 Dependency Sync Efficiency [${planId}]`;
            const runs = await paginateWithRetry(api.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'health-83-dependency-sync-efficiency.yml',
              event: 'workflow_dispatch',
              per_page: 100,
            });
            if (runs.some((run) => run.display_title === title)) {
              core.notice(`Health 83 already recorded for ${planId}`);
              return;
            }
            await withRetry((client) => client.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'health-83-dependency-sync-efficiency.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: {
                campaign_plan_id: planId,
                trigger_reason: 'campaign-complete',
              },
            }));
            core.notice(`Dispatched Health 83 completion measurement for ${planId}`);

      - name: Upload sync PR merge report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sync-pr-merge-and-canary-evidence
          path: |
            artifacts/sync-pr-merge-report.json
            artifacts/sync-canary-evidence.json
            artifacts/sync-campaign-commit-authorization.json
          if-no-files-found: warn

      - name: Refresh stale candidate bases
        id: refresh_candidate
        if: >-
          ${{
            always() &&
            steps.candidate_mode.outputs.candidate == 'true' &&
            steps.merge.outcome == 'success'
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-71-refresh-stale-candidate-bases',
              capabilities: ['actions:write'],
            });
            const {
              candidateRefreshDecision,
            } = require('./.github/scripts/sync_pr_merge_contract.js');
            const report = JSON.parse(
              fs.readFileSync('artifacts/sync-pr-merge-report.json', 'utf8'),
            );
            const decision = candidateRefreshDecision({ report });
            if (!decision.eligible) {
              core.notice(`Candidate refresh not required: ${decision.errors.join(', ')}`);
              return;
            }
            const { data: runs } = await withRetry((client) =>
              client.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'maint-68-sync-consumer-repos.yml',
                per_page: 20,
              }),
            );
            const activeSync = (runs.workflow_runs || []).find((run) =>
              ['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)
              && (
                String(run.display_title || '').includes('Maint 68 canary')
                || String(run.display_title || '').includes('Maint 68 promote')
              ),
            );
            if (activeSync) {
              core.notice(
                `Maint 68 ${activeSync.id} is already active; candidate refresh remains queued`,
              );
              return;
            }
            await withRetry((client) => client.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'maint-68-sync-consumer-repos.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: {
                phase: 'canary',
                delivery_scope: 'full',
                dry_run: 'false',
                force: 'false',
              },
            }));
            core.notice(
              `Dispatched no-filter canary refresh for ${decision.repositories.join(', ')}`,
            );

      - name: Refresh stale delivery bases
        id: refresh_delivery
        if: >-
          ${{
            always() &&
            (steps.candidate_mode.outputs.selector == 'delivery' ||
             steps.candidate_mode.outputs.campaign == 'true') &&
            steps.merge.outcome == 'success'
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-71-refresh-stale-delivery-bases',
              capabilities: ['actions:write'],
            });
            const {
              deliveryRefreshDecision,
            } = require('./.github/scripts/sync_pr_merge_contract.js');
            const report = JSON.parse(
              fs.readFileSync('artifacts/sync-pr-merge-report.json', 'utf8'),
            );
            const canaryConfig = JSON.parse(
              fs.readFileSync('config/consumer_sync_canaries.json', 'utf8'),
            );
            const expectedCanaries = (canaryConfig.canaries || [])
              .map((entry) => String(entry.repo || '').trim())
              .filter(Boolean);
            const decision = deliveryRefreshDecision({ report, expectedCanaries });
            if (!decision.eligible) {
              core.notice(`Delivery refresh not required: ${decision.errors.join(', ')}`);
              return;
            }
            const { data: runs } = await withRetry((client) =>
              client.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'maint-68-sync-consumer-repos.yml',
                per_page: 20,
              }),
            );
            const activeSync = (runs.workflow_runs || []).find((run) =>
              ['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)
              && (
                String(run.display_title || '').includes('Maint 68 canary')
                || String(run.display_title || '').includes('Maint 68 promote')
              ),
            );
            if (activeSync) {
              core.notice(
                `Maint 68 ${activeSync.id} is already active; delivery refresh remains queued`,
              );
              return;
            }
            await withRetry((client) => client.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'maint-68-sync-consumer-repos.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: {
                phase: 'promote',
                canary_evidence_json: JSON.stringify(decision.evidence),
                delivery_scope: 'auto',
                dry_run: 'false',
                force: 'false',
              },
            }));
            core.notice(
              `Replayed exact-plan promotion ${decision.plan_id} for ` +
                `${decision.repositories.join(', ')}`,
            );

      - name: Promote complete exact-plan canary evidence
        id: promote
        if: >-
          ${{
            always() &&
            steps.candidate_mode.outputs.candidate == 'true' &&
            steps.candidate_evidence_validation.outcome == 'success' &&
            steps.candidate_evidence_validation.outputs.authorized == 'true' &&
            steps.candidate_artifact.outcome == 'success' &&
            steps.merge.outcome == 'success'
          }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const { createTokenAwareRetry } = require(
              './.github/scripts/github-api-with-retry.js'
            );
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-71-promote-canary-evidence',
              capabilities: ['actions:write'],
            });
            const {
              candidatePromotionDecision,
            } = require('./.github/scripts/sync_pr_merge_contract.js');
            const report = JSON.parse(
              fs.readFileSync('artifacts/sync-pr-merge-report.json', 'utf8'),
            );
            const evidence = JSON.parse(
              fs.readFileSync('artifacts/sync-canary-evidence.json', 'utf8'),
            );
            const canaryConfig = JSON.parse(
              fs.readFileSync('config/consumer_sync_canaries.json', 'utf8'),
            );
            const expectedCanaries = (canaryConfig.canaries || [])
              .map((entry) => String(entry.repo || '').trim())
              .filter(Boolean);
            const decision = candidatePromotionDecision({ report, evidence, expectedCanaries });
            if (!decision.eligible) {
              core.notice(`Promotion remains held: ${decision.errors.join(', ')}`);
              return;
            }
            const { data: runs } = await withRetry((client) =>
              client.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'maint-68-sync-consumer-repos.yml',
                per_page: 20,
              }),
            );
            const activePromotion = (runs.workflow_runs || []).find((run) =>
              ['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)
              && String(run.display_title || '').includes('Maint 68 promote'),
            );
            if (activePromotion) {
              core.notice(`Exact-plan promotion already active in run ${activePromotion.id}`);
              return;
            }
            await withRetry((client) => client.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'maint-68-sync-consumer-repos.yml',
              ref: context.payload.repository?.default_branch || 'main',
              inputs: {
                phase: 'promote',
                canary_evidence_json: JSON.stringify(evidence),
                delivery_scope: 'auto',
                dry_run: 'false',
                force: 'false',
              },
            }));
            core.notice(`Dispatched exact-plan promotion for ${decision.plan_id}`);
