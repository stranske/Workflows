# Automate merging sync PRs in consumer repos
#
# This workflow handles the common cycle of:
# 1. Check sync PR status in all consumer repos
# 2. Merge PRs that pass validation
# 3. Clean up stale branches
#
# Triggers:
# - Manual dispatch (default)
# - Can be called from sync workflow
# - Repository dispatch (event_type: merge-sync-prs) for Codespace triggers
#
# Safety:
# - Only merges PRs with sync/workflows-* branch names
# - Requires all checks to pass
# - Uses merge commit (not squash) to preserve sync history

name: Merge Sync PRs

on:
  schedule:
    # Daily janitor pass: auto-merge ready sync PRs, close superseded ones, and prune
    # leftover branches without waiting for a manual dispatch. Runs just after Health 68's
    # drift scan (cron '10 5') so it acts on a fresh picture. A schedule event carries no
    # inputs, so the script's parseBooleanInput defaults apply unchanged:
    # auto_merge=true, dry_run=false, cleanup_branches=true, repos=all.
    - cron: '30 5 * * *'
  repository_dispatch:
    types: [merge-sync-prs]
  workflow_dispatch:
    inputs:
      repos:
        description: "Repos to check (comma-separated, or 'all')"
        required: false
        type: string
        default: "all"
      auto_merge:
        description: "Auto-merge if checks pass"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run (report only, no merge)"
        required: false
        type: boolean
        default: false
      sync_hash:
        description: "Optional sync hash to keep active (accepts hash or sync/workflows-* branch)"
        required: false
        type: string
        default: ""
      cleanup_branches:
        description: "Delete sync/workflows-* branches left behind by closed or merged sync PRs"
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      repos:
        description: "Repos to check (comma-separated, or 'all')"
        required: false
        type: string
        default: "all"
      auto_merge:
        description: "Auto-merge if checks pass"
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run (report only, no merge)"
        required: false
        type: boolean
        default: false
      sync_hash:
        description: "Optional sync hash to keep active (accepts hash or sync/workflows-* branch)"
        required: false
        type: string
        default: ""
      cleanup_branches:
        description: "Delete sync/workflows-* branches left behind by closed or merged sync PRs"
        required: false
        type: boolean
        default: true

permissions:
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: merge-sync-prs-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  merge_sync_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          secrets: ${{ toJSON(secrets) }}
          github_token: ${{ github.token }}



      - name: Extract consumer repos from sync workflow
        id: repos
        run: |
          repos=$(python scripts/list_registered_consumer_repos.py --separator ',')
          echo "list=${repos}" >> "$GITHUB_OUTPUT"
          echo "Extracted repos: ${repos}"

      - name: Check and merge sync PRs
        uses: actions/github-script@v9
        env:
          REPOS_INPUT: ${{ inputs.repos || 'all' }}
          AUTO_MERGE_INPUT: ${{ inputs.auto_merge }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
          SYNC_HASH_INPUT: ${{ inputs.sync_hash || '' }}
          CLEANUP_BRANCHES_INPUT: ${{ inputs.cleanup_branches }}
          SYNC_PR_MERGE_REPORT_JSON: artifacts/sync-pr-merge-report.json
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const defaultOwner = context.repo.owner;
            const fs = require('fs');
            const path = require('path');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const {
              buildMarkdownSummary,
              buildMergeReport,
              collectDeletableSyncBranches,
              normalizeSyncHash,
              parseBooleanInput,
              selectActiveSyncPr,
            } = require('./.github/scripts/sync_pr_merge_contract.js');
            // Support repository_dispatch (no inputs) with sensible defaults
            const inputRepos =
              process.env.REPOS_INPUT ||
              (context.payload.client_payload && context.payload.client_payload.repos) ||
              'all';
            const autoMerge = parseBooleanInput(
              process.env.AUTO_MERGE_INPUT ||
                (context.payload.client_payload && context.payload.client_payload.auto_merge),
              true,
            );
            const dryRun = parseBooleanInput(
              process.env.DRY_RUN_INPUT ||
                (context.payload.client_payload && context.payload.client_payload.dry_run),
              false,
            );
            const cleanupBranches = parseBooleanInput(
              process.env.CLEANUP_BRANCHES_INPUT ||
                (context.payload.client_payload && context.payload.client_payload.cleanup_branches),
              true,
            );
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { createTokenAwareRetry } = retryHelpers;
            const { withRetry } = createTokenAwareRetry
              ? await createTokenAwareRetry({
                  github,
                  core,
                  env: process.env,
                  task: 'maint-71-merge-sync-prs',
                  capabilities: [
                    'pull-requests:read',
                    'pull-requests:write',
                    'checks:read',
                    'contents:write',
                  ],
                })
              : { github, withRetry: (fn) => fn(github) };

            // Parse repos from previous step
            const registeredRepos = '${{ steps.repos.outputs.list }}'
              .split(',')
              .map(r => r.trim())
              .filter(Boolean);

            // Determine which repos to process
            const targetRepos = inputRepos === 'all'
              ? registeredRepos
              : inputRepos.split(',').map(r => r.trim());
            const requestedSyncHash = normalizeSyncHash(
              process.env.SYNC_HASH_INPUT ||
                (context.payload.client_payload && context.payload.client_payload.sync_hash) ||
                '',
            );

            console.log(`Registered consumer repos: ${registeredRepos.join(', ')}`);
            console.log(`Processing repos: ${targetRepos.join(', ')}`);
            console.log(`Auto-merge: ${autoMerge}, Dry run: ${dryRun}`);
            console.log(`Cleanup stale sync branches: ${cleanupBranches}\n`);
            if (requestedSyncHash) {
              console.log(`Target sync hash: ${requestedSyncHash}`);
            }

            const results = [];

            for (const repoEntry of targetRepos) {
              const [entryOwner, entryRepo] = repoEntry.includes('/')
                ? repoEntry.split('/')
                : [defaultOwner, repoEntry];
              const owner = entryOwner || defaultOwner;
              const repo = entryRepo;

              console.log(`\n=== ${owner}/${repo} ===`);

              try {
                // Find open sync PRs
                const { data: prs } = await withRetry((client) => client.rest.pulls.list({
                  owner,
                  repo,
                  state: 'open',
                  per_page: 20
                }));

                const syncPRs = prs.filter(pr => pr.head.ref.startsWith('sync/workflows-'));

                if (cleanupBranches) {
                  try {
                    const [branches, closedPRs] = await Promise.all([
                      withRetry((client) => client.paginate(client.rest.repos.listBranches, {
                        owner,
                        repo,
                        per_page: 100,
                      })),
                      withRetry((client) => client.paginate(client.rest.pulls.list, {
                        owner,
                        repo,
                        state: 'closed',
                        per_page: 100,
                      })),
                    ]);
                    const branchesToDelete = collectDeletableSyncBranches({
                      branches,
                      openPullRequests: syncPRs,
                      closedPullRequests: closedPRs,
                    });

                    if (branchesToDelete.length > 0) {
                      console.log(
                        `Found ${branchesToDelete.length} closed sync PR branch(es) to clean up`,
                      );
                    }

                    for (const branch of branchesToDelete) {
                      if (dryRun) {
                        console.log(`[DRY RUN] Would delete ${branch}`);
                        results.push({
                          owner,
                          repo,
                          branch,
                          status: 'branch_deleted',
                          dry_run: true,
                        });
                        continue;
                      }

                      try {
                        await withRetry((client) => client.rest.git.deleteRef({
                          owner,
                          repo,
                          ref: `heads/${branch}`,
                        }));
                        console.log(`✓ Deleted leftover branch ${branch}`);
                        results.push({ owner, repo, branch, status: 'branch_deleted' });
                      } catch (branchErr) {
                        console.log(`⚠ Could not delete leftover branch ${branch}: ${branchErr.message}`);
                        results.push({
                          owner,
                          repo,
                          branch,
                          status: 'branch_delete_failed',
                          error: branchErr.message,
                        });
                      }
                    }
                  } catch (cleanupErr) {
                    console.log(`⚠ Sync branch cleanup failed: ${cleanupErr.message}`);
                    results.push({
                      owner,
                      repo,
                      status: 'branch_delete_failed',
                      error: cleanupErr.message,
                    });
                  }
                }

                if (syncPRs.length === 0) {
                  console.log('No sync PRs found');
                  results.push({ owner, repo, status: 'no_prs' });
                  continue;
                }

                const selection = selectActiveSyncPr(syncPRs, requestedSyncHash);
                if (selection.missingExpected) {
                  console.log(
                    `Expected sync PR branch ${selection.expectedBranch} was not found; leaving ` +
                      `${syncPRs.length} sync PRs untouched`,
                  );
                  results.push({
                    owner,
                    repo,
                    status: 'target_missing',
                    expected_branch: selection.expectedBranch,
                    open_sync_prs: syncPRs.map((item) => ({
                      number: item.number,
                      branch: item.head.ref,
                      url: item.html_url,
                    })),
                  });
                  continue;
                }

                // If multiple sync PRs exist, close older ones as stale
                if (selection.stale.length > 0) {
                  console.log(
                    `Found ${syncPRs.length} sync PRs - closing ${selection.stale.length} stale PRs`,
                  );

                  for (const stalePR of selection.stale) {
                    console.log(`\nClosing stale PR #${stalePR.number}: ${stalePR.title}`);
                    console.log(`Branch: ${stalePR.head.ref}, Created: ${stalePR.created_at}`);

                    if (!dryRun) {
                      try {
                        // Close PR
                        await withRetry((client) => client.rest.pulls.update({
                          owner,
                          repo,
                          pull_number: stalePR.number,
                          state: 'closed'
                        }));
                        console.log('✓ Closed');

                        // Delete branch
                        try {
                          await withRetry((client) => client.rest.git.deleteRef({
                            owner,
                            repo,
                            ref: `heads/${stalePR.head.ref}`
                          }));
                          console.log('✓ Branch deleted');
                        } catch (delErr) {
                          console.log(`⚠ Branch delete failed: ${delErr.message}`);
                        }
                        results.push({
                          owner,
                          repo,
                          pr: stalePR.number,
                          branch: stalePR.head.ref,
                          status: 'stale_closed',
                        });
                      } catch (staleErr) {
                        console.log(`✗ Stale close failed: ${staleErr.message}`);
                        results.push({
                          owner,
                          repo,
                          pr: stalePR.number,
                          branch: stalePR.head.ref,
                          status: 'stale_close_failed',
                          error: staleErr.message,
                        });
                      }
                    } else {
                      console.log('[DRY RUN] Would close and delete branch');
                      results.push({
                        owner,
                        repo,
                        pr: stalePR.number,
                        branch: stalePR.head.ref,
                        status: 'stale_closed',
                        dry_run: true,
                      });
                    }
                  }
                }

                // Process the selected active PR
                const pr = selection.active;
                console.log(`\nProcessing active PR #${pr.number}: ${pr.title}`);
                console.log(`Branch: ${pr.head.ref}`);
                console.log(`Created: ${pr.created_at}`);

                // Check PR status
                await withRetry((client) => client.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: pr.head.sha
                }));

                // Check check runs
                const { data: checkRuns } = await withRetry((client) =>
                  client.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: pr.head.sha
                }),
                );

                const allChecks = checkRuns.check_runs || [];
                const orderedChecks = [...allChecks].sort((a, b) => {
                  const aTime = new Date(a.started_at || a.completed_at || 0).getTime();
                  const bTime = new Date(b.started_at || b.completed_at || 0).getTime();
                  return bTime - aTime;
                });
                const matrixPlaceholder = '${' + '{ matrix.';
                const matrixPlaceholderPython = 'matrix.python-version';
                const latestChecksByName = new Map();
                for (const check of orderedChecks) {
                  if (!latestChecksByName.has(check.name)) {
                    latestChecksByName.set(check.name, check);
                  }
                }
                const requiredChecks = [...latestChecksByName.values()].filter(c =>
                  !c.name.includes('Detect keepalive') &&
                  !c.name.includes('pr_meta') &&
                  !c.name.includes('resolve_pr') &&
                  !c.name.includes('Cleanup') &&
                  !c.name.includes(matrixPlaceholder) &&
                  !c.name.includes(matrixPlaceholderPython) &&
                  c.conclusion !== 'skipped' &&
                  c.conclusion !== 'neutral' &&
                  c.conclusion !== 'cancelled'
                );

                const failedChecks = requiredChecks.filter(c =>
                  c.conclusion !== 'success' && c.conclusion !== null
                );

                const pendingChecks = requiredChecks.filter(c =>
                  c.status !== 'completed'
                );

                console.log(
                  `Checks: ${requiredChecks.length} total, ${failedChecks.length} failed, ` +
                    `${pendingChecks.length} pending`,
                );

                if (failedChecks.length > 0) {
                  console.log('Failed checks:');
                  failedChecks.forEach(c => console.log(`  - ${c.name}: ${c.conclusion}`));
                  results.push({
                    owner,
                    repo,
                    pr: pr.number,
                    branch: pr.head.ref,
                    status: 'checks_failed',
                    failed_checks: failedChecks.map((check) => ({
                      name: check.name,
                      conclusion: check.conclusion,
                      status: check.status,
                    })),
                  });
                  continue;
                }

                if (pendingChecks.length > 0) {
                  console.log('Waiting for checks to complete');
                  results.push({
                    owner,
                    repo,
                    pr: pr.number,
                    branch: pr.head.ref,
                    status: 'checks_pending',
                    pending_checks: pendingChecks.map((check) => ({
                      name: check.name,
                      conclusion: check.conclusion,
                      status: check.status,
                    })),
                  });
                  continue;
                }

                // All checks passed
                if (!autoMerge) {
                  console.log('✓ Ready to merge (auto-merge disabled)');
                  results.push({ owner, repo, pr: pr.number, branch: pr.head.ref, status: 'ready' });
                  continue;
                }

                if (dryRun) {
                  console.log('✓ Would merge (dry run)');
                  results.push({
                    owner,
                    repo,
                    pr: pr.number,
                    branch: pr.head.ref,
                    status: 'dry_run_merge',
                  });
                  continue;
                }

                // Merge the PR
                try {
                  const mergeMethods = ['merge', 'squash', 'rebase'];
                  let merged = false;
                  let lastError = null;

                  for (const merge_method of mergeMethods) {
                    try {
                      await withRetry((client) => client.rest.pulls.merge({
                        owner,
                        repo,
                        pull_number: pr.number,
                        merge_method,
                        commit_title: pr.title,
                        commit_message:
                          `Automated merge of sync PR\n\n` +
                          `Sync hash: ${pr.head.ref.split('-').pop()}`
                      }));
                      console.log(`✓ Merged successfully (method=${merge_method})`);
                      merged = true;
                      break;
                    } catch (e) {
                      lastError = e;
                      const message = String(e?.message || 'unknown error');
                      console.log(`⚠ Merge attempt failed (method=${merge_method}): ${message}`);
                      if (!message.toLowerCase().includes('repository rule violations')) {
                        break;
                      }
                    }
                  }

                  if (!merged) {
                    throw lastError || new Error('Merge failed');
                  }

                  // Delete the branch
                  try {
                    await withRetry((client) => client.rest.git.deleteRef({
                      owner,
                      repo,
                      ref: `heads/${pr.head.ref}`
                    }));
                    console.log('✓ Branch deleted');
                    results.push({ owner, repo, pr: pr.number, branch: pr.head.ref, status: 'branch_deleted' });
                  } catch (e) {
                    console.log(`⚠ Could not delete branch: ${e.message}`);
                    results.push({
                      owner,
                      repo,
                      pr: pr.number,
                      branch: pr.head.ref,
                      status: 'branch_delete_failed',
                      error: e.message,
                    });
                  }

                  results.push({ owner, repo, pr: pr.number, branch: pr.head.ref, status: 'merged' });
                } catch (e) {
                  console.log(`✗ Merge failed: ${e.message}`);
                  results.push({
                    owner,
                    repo,
                    pr: pr.number,
                    branch: pr.head.ref,
                    status: 'merge_failed',
                    error: e.message,
                  });
                }
              } catch (e) {
                console.log(`✗ Error processing ${repo}: ${e.message}`);
                results.push({ owner, repo, status: 'error', error: e.message });
              }
            }

            // Summary
            console.log('\n=== Summary ===');
            console.log(JSON.stringify(results, null, 2));
            const report = buildMergeReport({
              results,
              registeredRepos,
              targetRepos,
              autoMerge,
              dryRun,
              syncHash: requestedSyncHash,
              run: {
                repository: `${context.repo.owner}/${context.repo.repo}`,
                run_id: context.runId,
                run_number: context.runNumber,
                workflow: context.workflow,
                ref: context.ref,
                sha: context.sha,
              },
            });
            const reportPath = process.env.SYNC_PR_MERGE_REPORT_JSON;
            fs.mkdirSync(path.dirname(reportPath), { recursive: true });
            fs.writeFileSync(reportPath, `${JSON.stringify(report, null, 2)}\n`, 'utf8');
            await core.summary.addRaw(buildMarkdownSummary(report)).write();

            const merged = report.summary.merged;
            const stale = report.summary.stale_closed;
            const branchesDeleted = report.summary.branch_deleted;
            // A consumer's own red CI (checks_failed) is outside this workflow's control,
            // so it must NOT fail the fleet janitor run — otherwise one red consumer turns
            // every scheduled flush red and forces re-runs. Only genuine sync-system action
            // failures (merge/cleanup/missing-target) are blocking; consumer CI health is
            // surfaced via the merge report and Health 68 instead.
            const blockingFailures = results.filter(
              (r) =>
                r.status === 'merge_failed' ||
                r.status === 'stale_close_failed' ||
                r.status === 'branch_delete_failed' ||
                r.status === 'target_missing',
            );
            const checksFailed = results.filter((r) => r.status === 'checks_failed');
            if (checksFailed.length > 0) {
              core.notice(
                `${checksFailed.length} consumer sync PR(s) have failing checks (consumer CI); ` +
                  `left open, not treated as a janitor failure.`,
              );
            }
            const failed = dryRun ? 0 : blockingFailures.length;
            const pending = report.summary.checks_pending;
            const ready = report.summary.ready;

            console.log(`\nMerged: ${merged}`);
            console.log(`Stale closed: ${stale}`);
            console.log(`Leftover branches deleted: ${branchesDeleted}`);
            console.log(`Failed: ${failed}`);
            console.log(`Pending: ${pending}`);
            console.log(`Ready (not auto-merged): ${ready}`);
            if (dryRun && blockingFailures.length > 0) {
              core.notice(
                `Dry run observed ${blockingFailures.length} blocking result(s); report-only mode remains successful.`,
              );
            }

            if (failed > 0) {
              core.setFailed(`${failed} PRs failed to merge`);
            }

      - name: Upload sync PR merge report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-pr-merge-report
          path: artifacts/sync-pr-merge-report.json
          if-no-files-found: warn
