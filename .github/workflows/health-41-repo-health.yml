name: Health 41 Repo Health

on:
  schedule:
    # 07:15 UTC each Monday keeps results inside a quiet window.
    - cron: '15 7 * * 1'
  workflow_dispatch:
    inputs:
      include_branches:
        description: 'Include stale-branch scan (set false to skip heavy branch enumeration)'
        type: boolean
        default: true
      include_prs:
        description: 'Include stale PR scan (set false to skip PR enumeration)'
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

concurrency:
  group: repo-health-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Rate limit gate: skip non-critical health checks when API quota is low
  # This ensures keepalive and core workflows get priority (threshold: 2000)
  rate-limit-check:
    name: Rate limit gate
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed || 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}



      - name: Check API quota
        id: check
        uses: actions/github-script@v9
        env:
          # Higher threshold than orchestrator (1000) so keepalive runs first
          RATE_LIMIT_THRESHOLD: '2000'
        with:
          script: |
            // # best-effort: this ancillary API failure is logged; reconciliation or the primary workflow result remains authoritative.
            const threshold = parseInt(process.env.RATE_LIMIT_THRESHOLD || '2000', 10);
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;
            try {
              const { data } = await withRetry(() => github.rest.rateLimit.get());
              const remaining = data?.resources?.core?.remaining || 0;
              const limit = data?.resources?.core?.limit || 5000;
              const proceed = remaining >= threshold;

              core.setOutput('proceed', proceed ? 'true' : 'false');
              core.setOutput('remaining', String(remaining));

              if (!proceed) {
                const reset = data?.resources?.core?.reset || 0;
                const resetTime = new Date(reset * 1000).toISOString();
                const notice = `Deferring repo health: API quota low (${remaining}/${limit}).`;
                core.notice(`${notice} Resets at ${resetTime}`);
                  const quotaMessage = [
                    'API quota too low for non-critical health checks',
                    `(${remaining}/${limit} remaining).`,
                  ].join(' ');
                  await core.summary
                  .addHeading('Repo Health Deferred', 3)
                    .addRaw(quotaMessage)
                  .addEOL()
                  .addRaw(`Threshold: ${threshold}. Resets at: ${resetTime}`)
                  .write();
              }
            } catch (error) {
              core.warning(`Rate limit check failed: ${error.message}. Proceeding anyway.`);
              core.setOutput('proceed', 'true');
            }
  weekly-sweep:
    name: Weekly repository health sweep
    needs: rate-limit-check
    if: needs.rate-limit-check.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    env:
      STALE_BRANCH_DAYS: ${{ vars.REPO_HEALTH_STALE_BRANCH_DAYS || '30' }}
      STALE_PR_DAYS: ${{ vars.REPO_HEALTH_STALE_PR_DAYS || '30' }}
      MAX_TABLE_ROWS: '20'
      INCLUDE_BRANCHES: 'true'
      INCLUDE_PRS: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup API client
        uses: ./.github/actions/setup-api-client
        with:
          # named inputs, not the whole secrets context (see #3185)
          github_token: ${{ github.token }}
          service_bot_pat: ${{ secrets.SERVICE_BOT_PAT }}
          actions_bot_pat: ${{ secrets.ACTIONS_BOT_PAT }}
          owner_pr_pat: ${{ secrets.OWNER_PR_PAT }}
          agents_automation_pat: ${{ secrets.AGENTS_AUTOMATION_PAT }}
          workflows_app_id: ${{ secrets.WORKFLOWS_APP_ID }}
          workflows_app_private_key: ${{ secrets.WORKFLOWS_APP_PRIVATE_KEY }}
          keepalive_app_id: ${{ secrets.KEEPALIVE_APP_ID }}
          keepalive_app_private_key: ${{ secrets.KEEPALIVE_APP_PRIVATE_KEY }}
          gh_app_id: ${{ secrets.GH_APP_ID }}
          gh_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          app_1_id: ${{ secrets.APP_1_ID }}
          app_1_private_key: ${{ secrets.APP_1_PRIVATE_KEY }}
          app_2_id: ${{ secrets.APP_2_ID }}
          app_2_private_key: ${{ secrets.APP_2_PRIVATE_KEY }}
      - name: Apply workflow_dispatch overrides
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 <<'PY'
          import json
          import os

          def normalize(value: str | None, default: str) -> str:
              if value is None:
                  return default
              return 'false' if str(value).lower() == 'false' else 'true'

          event_path = os.environ["GITHUB_EVENT_PATH"]
          include_branches = os.environ.get("INCLUDE_BRANCHES", "true")
          include_prs = os.environ.get("INCLUDE_PRS", "true")

          with open(event_path, encoding="utf-8") as handle:
              data = json.load(handle)

          inputs = data.get("inputs") or {}
          include_branches = normalize(inputs.get("include_branches"), include_branches)
          include_prs = normalize(inputs.get("include_prs"), include_prs)

          env_path = os.environ["GITHUB_ENV"]
          with open(env_path, "a", encoding="utf-8") as handle:
              handle.write(f"INCLUDE_BRANCHES={include_branches}\n")
              handle.write(f"INCLUDE_PRS={include_prs}\n")
          PY

      - name: Summarise repository health signals
        id: summarise
        uses: actions/github-script@v9
        with:
          script: |
            // # best-effort: this ancillary API failure is logged; reconciliation or the primary workflow result remains authoritative.
            // Note: 'core' is already provided by github-script, no require needed
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry, paginateWithRetry } = retryHelpers;

            const includeBranches =
              (process.env.INCLUDE_BRANCHES || 'true').toLowerCase() !== 'false';
            const includePrs = (process.env.INCLUDE_PRS || 'true').toLowerCase() !== 'false';

            const staleBranchDays = parseInt(process.env.STALE_BRANCH_DAYS || '30', 10);
            const stalePrDays = parseInt(process.env.STALE_PR_DAYS || '30', 10);
            const maxRows = parseInt(process.env.MAX_TABLE_ROWS || '20', 10);
            const now = new Date();
            const staleCutoff = new Date(now.getTime() - staleBranchDays * 24 * 60 * 60 * 1000);
            const stalePrCutoff = new Date(now.getTime() - stalePrDays * 24 * 60 * 60 * 1000);

            const repoInfo = await withRetry(() => github.rest.repos.get(context.repo));
            const defaultBranch = repoInfo.data.default_branch;

            core.setOutput('default-branch', defaultBranch);

            // --- Stale Branches ---
            let staleBranches = [];
            if (includeBranches) {
              const branches = await paginateWithRetry(github, github.rest.repos.listBranches, {
                ...context.repo,
                per_page: 100,
              });

              for (const branch of branches) {
                if (!branch || branch.name === defaultBranch) {
                  continue;
                }

                try {
                  const commitSha = branch.commit?.sha;
                  if (!commitSha) {
                    continue;
                  }

                  const commit = await withRetry(() => github.rest.repos.getCommit({
                    ...context.repo,
                    ref: commitSha,
                  }));

                  const commitDateRaw =
                    commit.data.commit?.committer?.date ||
                    commit.data.commit?.author?.date;
                  if (!commitDateRaw) {
                    continue;
                  }

                  const commitDate = new Date(commitDateRaw);
                  if (Number.isNaN(commitDate.getTime())) {
                    continue;
                  }

                  if (commitDate <= staleCutoff) {
                    const ageDays = Math.floor(
                      (now.getTime() - commitDate.getTime()) / (24 * 60 * 60 * 1000),
                    );
                    staleBranches.push({
                      name: branch.name,
                      lastCommit: commitDate.toISOString().slice(0, 10),
                      ageDays,
                    });
                  }
                } catch (error) {
                  core.warning(`Failed to inspect branch ${branch.name}: ${error.message}`);
                }
              }

              staleBranches.sort((a, b) => b.ageDays - a.ageDays);
            } else {
              core.info('Skipping stale branch scan per workflow_dispatch input.');
            }

            // --- Stale PRs ---
            let stalePrs = [];
            if (includePrs) {
              const openPrs = await paginateWithRetry(github, github.rest.pulls.list, {
                ...context.repo,
                state: 'open',
                per_page: 100,
              });

              for (const pr of openPrs) {
                const updatedDate = new Date(pr.updated_at);
                if (updatedDate <= stalePrCutoff) {
                  const ageDays = Math.floor(
                    (now.getTime() - updatedDate.getTime()) / (24 * 60 * 60 * 1000),
                  );
                  stalePrs.push({
                    number: pr.number,
                    title: pr.title,
                    url: pr.html_url,
                    updatedAt: updatedDate.toISOString().slice(0, 10),
                    ageDays,
                    user: pr.user.login,
                  });
                }
              }
              stalePrs.sort((a, b) => b.ageDays - a.ageDays);
            } else {
              core.info('Skipping stale PR scan per workflow_dispatch input.');
            }

            // --- Unassigned Issues ---
            const openItems = await paginateWithRetry(github, github.rest.issues.listForRepo, {
              ...context.repo,
              per_page: 100,
              state: 'open',
              filter: 'all',
            });

            const unassignedIssues = openItems
              .filter(item => !item.pull_request)
              .filter(issue => !issue.assignees || issue.assignees.length === 0)
              .map(issue => ({
                number: issue.number,
                title: issue.title || '(no title)',
                url: issue.html_url,
                updatedAt: issue.updated_at,
              }))
              .sort((a, b) => new Date(a.updatedAt) - new Date(b.updatedAt));

            // --- Summary Output ---
            const summary = core.summary;
            summary.addHeading('Repository health weekly sweep', 1);
            summary.addRaw(`Generated on ${now.toUTCString()}`, true);
            summary.addBreak();
            summary.addTable([
              [
                { data: 'Signal', header: true },
                { data: 'Count', header: true },
              ],
              [
                `Stale branches (>${staleBranchDays}d)`,
                `${staleBranches.length}`,
              ],
              [
                `Stale PRs (>${stalePrDays}d)`,
                `${stalePrs.length}`,
              ],
              [
                'Open issues without assignees',
                `${unassignedIssues.length}`,
              ],
            ]);

            // Report Stale Branches
            if (staleBranches.length > 0) {
              summary.addHeading('Stale branches', 2);
              const branchRows = staleBranches.slice(0, maxRows).map(branch => [
                branch.name,
                branch.lastCommit,
                branch.ageDays.toString(),
              ]);
              summary.addTable([
                [
                  { data: 'Branch', header: true },
                  { data: 'Last commit (UTC)', header: true },
                  { data: 'Age (days)', header: true },
                ],
                ...branchRows,
              ]);

              if (staleBranches.length > maxRows) {
                summary.addRaw(`…and ${staleBranches.length - maxRows} more branches.`, true);
              }
            } else {
              summary.addHeading('Stale branches', 2);
              summary.addRaw('No stale branches detected 🎉', true);
            }

            // Report Stale PRs
            if (stalePrs.length > 0) {
              summary.addHeading('Stale PRs', 2);
              const prRows = stalePrs.slice(0, maxRows).map(pr => [
                `[#${pr.number}](${pr.url})`,
                pr.title,
                pr.user,
                pr.ageDays.toString(),
              ]);
              summary.addTable([
                [
                  { data: 'PR', header: true },
                  { data: 'Title', header: true },
                  { data: 'Author', header: true },
                  { data: 'Inactive (days)', header: true },
                ],
                ...prRows,
              ]);
               if (stalePrs.length > maxRows) {
                summary.addRaw(`…and ${stalePrs.length - maxRows} more PRs.`, true);
              }
            } else {
              summary.addHeading('Stale PRs', 2);
              summary.addRaw('No stale PRs detected 🎉', true);
            }

            // Report Unassigned Issues
            if (unassignedIssues.length > 0) {
              summary.addHeading('Open issues without assignees', 2);
              const issueRows = unassignedIssues.slice(0, maxRows).map(issue => [
                `[#${issue.number}](${issue.url})`,
                issue.title,
              ]);
              summary.addTable([
                [
                  { data: 'Issue', header: true },
                  { data: 'Title', header: true },
                ],
                ...issueRows,
              ]);

              if (unassignedIssues.length > maxRows) {
                summary.addRaw(`…and ${unassignedIssues.length - maxRows} more issues.`, true);
              }
            } else {
              summary.addHeading('Open issues without assignees', 2);
              summary.addRaw('All open issues have at least one assignee ✅', true);
            }

            await summary.write();
            core.info('Repository health summary written to workflow run.');

      - name: Verify default branch protection
        uses: actions/github-script@v9
        env:
          DEFAULT_BRANCH: ${{ steps.summarise.outputs.default-branch }}
        with:
          script: |
            // Note: 'core' is already provided by github-script, no require needed
            const fs = require('fs');
            const retryHelperPath = './.github/scripts/github-api-with-retry.js';
            const retryHelpers = fs.existsSync(retryHelperPath)
              ? require(retryHelperPath)
              : {
                  withRetry: (fn) => fn(),
                  paginateWithRetry: (githubInstance, method, params) =>
                    githubInstance.paginate(method, params),
                };
            const { withRetry } = retryHelpers;

            const defaultBranch = process.env.DEFAULT_BRANCH || null;
            if (!defaultBranch) {
              const failure = [
                'Default branch name was not provided by the summary step.',
                'Ensure the summarise step completed successfully and',
                'outputs.default-branch is set.',
              ].join(' ');
              core.setFailed(failure);
              return;
            }

            const requiredContextsPath = './.github/config/required-contexts.json';
            let expectedContexts = [];
            try {
              const rawConfig = fs.readFileSync(requiredContextsPath, 'utf8');
              const payload = JSON.parse(rawConfig);
              const contextsValue = payload?.required_contexts ?? payload?.contexts;
              if (Array.isArray(contextsValue)) {
                expectedContexts = contextsValue
                  .map((value) => `${value}`.trim())
                  .filter(Boolean);
              }
            } catch (error) {
              core.setFailed(
                `Unable to load required contexts from ${requiredContextsPath}: ${error.message}`,
              );
              return;
            }

            const observedBySource = {
              branchRules: [],
              classicProtection: [],
            };
            let strict = null;
            let branchRulesRead = false;
            let classicProtectionRead = false;
            const readErrors = [];

            const appendClassicChecks = (requiredStatusChecks) => {
              if (!requiredStatusChecks) {
                return;
              }
              const contexts = requiredStatusChecks.contexts;
              if (Array.isArray(contexts)) {
                for (const value of contexts) {
                  const normalized = `${value}`.trim();
                  if (normalized) {
                    observedBySource.classicProtection.push(normalized);
                  }
                }
              }
              for (const check of requiredStatusChecks.checks || []) {
                const normalized = `${check?.context || ''}`.trim();
                if (normalized) {
                  observedBySource.classicProtection.push(normalized);
                }
              }
              if (typeof requiredStatusChecks.strict === 'boolean') {
                strict = requiredStatusChecks.strict;
              }
            };

            try {
              const rules = await withRetry(() => github.paginate(
                github.rest.repos.getBranchRules,
                {
                  ...context.repo,
                  branch: defaultBranch,
                  per_page: 100,
                },
              ));
              branchRulesRead = true;
              if (Array.isArray(rules)) {
                for (const rule of rules) {
                  if (rule?.type !== 'required_status_checks') {
                    continue;
                  }
                  const parameters = rule?.parameters || {};
                  for (const check of parameters.required_status_checks || []) {
                    const normalized = `${check?.context || ''}`.trim();
                    if (normalized) {
                      observedBySource.branchRules.push(normalized);
                    }
                  }
                  if (typeof parameters.strict_required_status_checks_policy === 'boolean') {
                    strict = parameters.strict_required_status_checks_policy;
                  }
                }
              }
            } catch (error) {
              const status = error?.status || error?.response?.status;
              readErrors.push(
                `branch rules: ${error.message}${status ? ` (HTTP ${status})` : ''}`,
              );
            }

            try {
              const protection = await withRetry(() => github.rest.repos.getBranchProtection({
                ...context.repo,
                branch: defaultBranch,
              }));
              classicProtectionRead = true;
              appendClassicChecks(protection.data?.required_status_checks);
            } catch (error) {
              const status = error?.status || error?.response?.status;
              const useMetadataFallback = status === 404 || status === 403;
              if (useMetadataFallback) {
                if (status === 404) {
                  classicProtectionRead = true;
                  core.warning(
                    `Classic branch protection is not configured for ${defaultBranch}: ${error.message}`,
                  );
                } else {
                  core.warning(
                    `Falling back to branch metadata for protection details: ${error.message}`,
                  );
                }
                try {
                  const branch = await withRetry(() => github.rest.repos.getBranch({
                    ...context.repo,
                    branch: defaultBranch,
                  }));
                  appendClassicChecks(branch.data?.protection?.required_status_checks);
                  if (status === 403) {
                    classicProtectionRead = true;
                  }
                } catch (fallbackError) {
                  const fallbackStatus = fallbackError?.status || fallbackError?.response?.status;
                  if (status === 403) {
                    readErrors.push(
                      `branch protection: ${error.message}${status ? ` (HTTP ${status})` : ''}`,
                    );
                  }
                  if (fallbackStatus !== 404) {
                    readErrors.push(
                      `branch metadata: ${fallbackError.message}${
                        fallbackStatus ? ` (HTTP ${fallbackStatus})` : ''
                      }`,
                    );
                  }
                }
              } else {
                readErrors.push(
                  `branch protection: ${error.message}${status ? ` (HTTP ${status})` : ''}`,
                );
              }
            }

            const sourceLabels = [];
            if (observedBySource.branchRules.length > 0) {
              sourceLabels.push('branchRules');
            }
            if (observedBySource.classicProtection.length > 0) {
              sourceLabels.push('classicProtection');
            }
            const protectionSource =
              sourceLabels.length > 0 ? sourceLabels.join(' + ') : 'none';

            if (!branchRulesRead && !classicProtectionRead && readErrors.length > 0) {
              core.setFailed(
                `Unable to read branch protection configuration for ${defaultBranch}: ${
                  readErrors.join('; ')
                }`,
              );
              return;
            }

            const uniqueContexts = Array.from(
              new Set(
                [...observedBySource.branchRules, ...observedBySource.classicProtection].filter(
                  Boolean,
                ),
              ),
            ).sort((a, b) => a.localeCompare(b));
            const expectedSorted = [...expectedContexts].sort((a, b) => a.localeCompare(b));
            const missing = expectedSorted.filter(
              (contextName) => !uniqueContexts.includes(contextName),
            );
            const unexpected = uniqueContexts.filter(
              (contextName) => !expectedSorted.includes(contextName),
            );

            const summary = core.summary;
            const expectedListForPointer =
              expectedSorted.length > 0 ? expectedSorted.join(', ') : 'no required checks';
            const actualListForPointer =
              uniqueContexts.length > 0 ? uniqueContexts.join(', ') : 'no required checks';

            core.info(`Expected required contexts: ${expectedListForPointer}`);
            core.info(`Observed required contexts: ${actualListForPointer}`);
            summary.addHeading('Default branch protection', 2);
            const expectedContextsText =
              expectedContexts.length > 0 ? expectedContexts.join(', ') : '–';
            const requiredContextsText =
              uniqueContexts.length > 0 ? uniqueContexts.join(', ') : '–';
            const upToDateText =
              strict === null
                ? 'unknown'
                : String(strict);
            summary.addTable([
              [
                { data: 'Property', header: true },
                { data: 'Value', header: true },
              ],
              ['Branch', defaultBranch],
              ['Source', protectionSource],
              ['Expected contexts', expectedContextsText],
              ['Required contexts', requiredContextsText],
              ['Required “up to date”', upToDateText],
            ]);

            if (missing.length > 0 || unexpected.length > 0) {
              const problems = [];
              if (missing.length > 0) {
                problems.push(`missing contexts: ${missing.join(', ')}`);
              }
              if (unexpected.length > 0) {
                problems.push(`unexpected contexts: ${unexpected.join(', ')}`);
              }
              const failurePrefix = `Branch protection drift detected for ${defaultBranch}`;
              summary.addRaw(`❌ ${failurePrefix} — ${problems.join('; ')}`, true);
              const pointer = [
                '➡️ Update branch protection (Settings → Branches →',
                `${defaultBranch}) so required status checks are exactly:`,
                `${expectedListForPointer}.`,
              ].join(' ');
              summary.addRaw(pointer, true);

              await summary.write();

              if (missing.length > 0 && !branchRulesRead) {
                const rulesError = readErrors.find((entry) => entry.startsWith('branch rules:'));
                if (rulesError) {
                  core.setFailed(
                    [
                      `Unable to verify required contexts for ${defaultBranch} because branch rules could not be read.`,
                      rulesError,
                      `Expected configured contexts: ${expectedListForPointer}.`,
                      `Observed from readable sources: ${actualListForPointer}.`,
                    ].join(' '),
                  );
                  return;
                }
              }

              if (missing.length > 0 && !classicProtectionRead) {
                const protectionError = readErrors.find((entry) =>
                  entry.startsWith('branch protection:'),
                );
                if (protectionError) {
                  core.setFailed(
                    [
                      `Unable to verify required contexts for ${defaultBranch} because branch protection could not be read.`,
                      protectionError,
                      `Expected configured contexts: ${expectedListForPointer}.`,
                      `Observed from readable sources: ${actualListForPointer}.`,
                    ].join(' '),
                  );
                  return;
                }
              }

              const driftFailure = [
                `${failurePrefix}.`,
                `Expected: ${expectedListForPointer}.`,
                `Actual: ${actualListForPointer}.`,
                `(${problems.join('; ')}).`,
                'Update branch protection (Settings → Branches →',
                `${defaultBranch}) so required status checks are exactly:`,
                `${expectedListForPointer}.`,
              ].join(' ');
              core.setFailed(driftFailure);
              return;
            }

            summary.addRaw('✅ Branch protection contexts match the expected configuration.', true);
            await summary.write();

            core.info('Branch protection configuration matches expectations.');
