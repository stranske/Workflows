name: Maint 66 Monthly Audit

on:
  schedule:
    # Run on the 1st of each month at 6:00 AM UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'Number of days to analyze'
        type: string
        default: 30
      create_issue:
        description: 'Create audit issue'
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Generate workflow audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Export load-balancer tokens
        uses: ./.github/actions/setup-api-client

      - name: Collect workflow statistics
        id: stats
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || 30 }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC1009,SC1073,SC1039,SC1072

          # Bind collection, the checklist and its issue title to one UTC instant.
          IFS='|' read -r END_DATE audit_month <<< "$(LC_ALL=C date -u '+%Y-%m-%dT%H:%M:%SZ|%B %Y')"
          START_DATE=$(date -u -d "${END_DATE} ${LOOKBACK_DAYS} days ago" +%Y-%m-%dT00:00:00Z)
          export START_DATE END_DATE
          echo "Collecting runs created from ${START_DATE} through ${END_DATE}"
          {
            echo "generated_at=${END_DATE}"
            echo "audit_month=${audit_month}"
          } >> "$GITHUB_OUTPUT"

          # Get all workflow runs
          runs=$(node - <<-'NODE'
          const { Octokit } = require('@octokit/rest');
          const { createTokenAwareRetry } = require('./.github/scripts/github-api-with-retry.js');
          const { collectRunWindow } = require('./.github/scripts/dependency_sync_run_window.js');
          const core = { info: () => {}, warning: console.warn, debug: () => {} };
          const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
          (async () => {
            const github = new Octokit({ auth: process.env.GH_TOKEN || process.env.GITHUB_TOKEN });
            const { withRetry } = await createTokenAwareRetry({
              github,
              core,
              env: process.env,
              task: 'maint-66-monthly-audit',
              capabilities: ['actions:read']
            });
            const runs = await collectRunWindow({
              start: process.env.START_DATE,
              end: process.env.END_DATE,
              listPage: async (params) => {
                const { data } = await withRetry((client) =>
                  client.rest.actions.listWorkflowRunsForRepo({ owner, repo, ...params })
                );
                // Keep the monthly inventory small while retaining IDs for completeness checks.
                return { data: {
                  total_count: data.total_count,
                  workflow_runs: data.workflow_runs.map(({ id, created_at, name, conclusion, workflow_id, path, status }) =>
                    ({ id, created_at, name, conclusion, workflow_id, path, status })
                  ),
                } };
              },
            });
            process.stdout.write(JSON.stringify(runs));
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          )

          # Generate statistics
          echo "${runs}" | jq '
            def conclusion_key:
              if .conclusion != null then .conclusion
              elif .status != null and .status != "completed" then "pending:" + .status
              else "unknown" end;
            map(. + {workflow_key: (
              if .workflow_id != null then "id:" + (.workflow_id | tostring)
              elif .path != null then "path:" + (.path | split("@")[0])
              else "legacy-name:" + (.name // "unknown") end
            )}) |
            group_by(.workflow_key) |
            map({
              workflow_key: .[0].workflow_key,
              name: (sort_by(.created_at) | last | .name // "unknown"),
              paths: ([.[].path // empty | split("@")[0]] | unique),
              total: length,
              success: map(select(.conclusion == "success")) | length,
              failure: map(select(.conclusion == "failure")) | length,
              cancelled: map(select(.conclusion == "cancelled")) | length,
              other: map(select(
                .conclusion != "success"
                and .conclusion != "failure"
                and .conclusion != "cancelled"
              )) | length,
              conclusions: (group_by(conclusion_key) | map({
                key: (.[0] | conclusion_key), value: length
              }) | from_entries)
            }) |
            map(. + {failed_outcomes: (
              .failure + (.conclusions.timed_out // 0)
              + (.conclusions.startup_failure // 0) + (.conclusions.action_required // 0)
            )}) |
            map(. + {decisive: (.success + .failed_outcomes)}) |
            map(. + {failure_rate: (
              if .decisive > 0 then .failed_outcomes / .decisive else null end
            )}) |
            sort_by(-.total, .workflow_key)
          ' > /tmp/workflow_stats.json

          # Calculate summary
          total_runs=$(echo "${runs}" | jq 'length')
          total_success=$(echo "${runs}" | jq \
            '[.[] | select(.conclusion == "success")] | length')
          total_failure=$(echo "${runs}" | jq \
            '[.[] | select(.conclusion == "failure")] | length')

          total_failed_outcomes=$(jq '[.[].failed_outcomes] | add // 0' /tmp/workflow_stats.json)
          total_decisive=$(jq '[.[].decisive] | add // 0' /tmp/workflow_stats.json)

          {
            echo "total_failed_outcomes=${total_failed_outcomes}"
            echo "total_decisive=${total_decisive}"
            echo "total_runs=${total_runs}"
            echo "total_success=${total_success}"
            echo "total_failure=${total_failure}"
          } >> "$GITHUB_OUTPUT"

      - name: Scan API wrapper usage
        id: api_guard
        run: |
          set -euo pipefail
          python scripts/check_api_wrapper_guard.py --all --output /tmp/api_guard.md || true
          {
            echo "report<<EOF"
            cat /tmp/api_guard.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Identify workflows needing attention
        id: attention
        run: |
          set -euo pipefail

          # Rank actual failed outcomes, not skipped/cancelled runs as failures.
          # Five decisive outcomes minimum; smaller failure samples remain visible separately.
          failing=$(jq -r '
            sort_by(-(.failure_rate // 0), -.failed_outcomes, .workflow_key) | .[] |
            select(.decisive >= 5 and .failed_outcomes > 0 and .failure_rate > 0.5) |
            "- **\(.name)** [\(.workflow_key)]: \((.failure_rate * 1000 | round) / 10)% failed outcomes (\(.failed_outcomes)/\(.decisive) decisive; \(.total) total runs)"
          ' /tmp/workflow_stats.json)
          warning=$(jq -r '
            sort_by(-(.failure_rate // 0), -.failed_outcomes, .workflow_key) | .[] |
            select(.decisive >= 5 and .failed_outcomes > 0 and .failure_rate > 0.2 and .failure_rate <= 0.5) |
            "- **\(.name)** [\(.workflow_key)]: \((.failure_rate * 1000 | round) / 10)% failed outcomes (\(.failed_outcomes)/\(.decisive) decisive; \(.total) total runs)"
          ' /tmp/workflow_stats.json)
          small_sample=$(jq -r '
            sort_by(-.failed_outcomes, .workflow_key) | .[] |
            select(.decisive < 5 and .failed_outcomes > 0) |
            "- **\(.name)** [\(.workflow_key)]: \(.failed_outcomes)/\(.decisive) decisive outcomes failed; insufficient sample for rate ranking"
          ' /tmp/workflow_stats.json)
          conclusion_mix=$(jq -r '
            ([.[].conclusions | to_entries[]] | group_by(.key) |
              map("\(.[0].key)=\(map(.value) | add)") | join(", ")),
            "", "Per-workflow detail:",
            (.[] | "- **\(.name)** [\(.workflow_key)]: " +
            (.conclusions | to_entries | sort_by(.key) | map("\(.key)=\(.value)") | join(", ")))
          ' /tmp/workflow_stats.json)

          # Check for workflows that haven't run
          workflow_files=$(find .github/workflows \
            -maxdepth 1 \
            -name '*.yml' \
            -exec basename {} .yml \;)
          ran_workflows=$(jq -r '.[].paths[]' /tmp/workflow_stats.json)

          not_run=""
          for wf in ${workflow_files}; do
            # Skip reusable workflows
            if grep -q "workflow_call:" ".github/workflows/${wf}.yml" 2>/dev/null; then
                trigger_regex='workflow_dispatch:|schedule:|push:|pull_request'
                if ! grep -q "$trigger_regex" ".github/workflows/${wf}.yml" 2>/dev/null; then
                continue
              fi
            fi
            # Check if workflow ran
              wf_name=$(
                grep -m1 "^name:" ".github/workflows/${wf}.yml" 2>/dev/null \
                  | sed 's/name: *//' \
                  || echo "$wf"
              )
            if ! echo "$ran_workflows" | grep -qxF ".github/workflows/${wf}.yml"; then
              not_run="${not_run}\n- ${wf}.yml (${wf_name})"
            fi
          done

          # Preserve complete rankings and counts before bounding cross-step output.
          # No run payloads or secrets are included in this artifact.
          mkdir -p /tmp/monthly-audit-details
          cp /tmp/workflow_stats.json /tmp/monthly-audit-details/workflow_stats.json
          bound_section() {
            local section="$1"
            python3 -c '
          import pathlib, sys
          name = sys.argv[1]
          text = sys.stdin.read()
          pathlib.Path("/tmp/monthly-audit-details", name + ".txt").write_text(text)
          lines = text.splitlines()
          kept, size = [], 0
          for line in lines:
              if size + len(line.encode("utf-8")) + 1 > 6000:
                  break
              kept.append(line)
              size += len(line.encode("utf-8")) + 1
          print("\n".join(kept))
          omitted = len(lines) - len(kept)
          if omitted:
              print(f"\n**{omitted} additional lines omitted here; see the complete {name}.txt in the monthly-audit-details artifact linked below.**")
          ' "$section"
          }
          failing=$(printf '%s' "$failing" | bound_section failing)
          warning=$(printf '%s' "$warning" | bound_section warning)
          small_sample=$(printf '%s' "$small_sample" | bound_section small_sample)
          conclusion_mix=$(printf '%s' "$conclusion_mix" | bound_section conclusion_mix)
          not_run=$(printf '%b' "$not_run" | bound_section not_run)

          # Save outputs (handle multiline)
          {
            echo "failing<<EOF"
            echo "${failing:-None}"
            echo "EOF"
            echo "warning<<EOF"
            echo "${warning:-None}"
            echo "EOF"
            echo "small_sample<<EOF"
            echo "${small_sample:-None}"
            echo "EOF"
            echo "conclusion_mix<<EOF"
            echo "${conclusion_mix:-None}"
            echo "EOF"
            echo "not_run<<EOF"
            echo -e "${not_run:-None}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Preserve complete audit detail
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: monthly-audit-details
          overwrite: true # A rerun replaces only this run's prior audit artifact.
          path: /tmp/monthly-audit-details/
          retention-days: 90
          if-no-files-found: error

      - name: Generate audit checklist
        id: checklist
        env:
          AUDIT_MONTH: ${{ steps.stats.outputs.audit_month }}
          GENERATED_AT: ${{ steps.stats.outputs.generated_at }}
          FAILING: ${{ steps.attention.outputs.failing }}
          WARNING: ${{ steps.attention.outputs.warning }}
          SMALL_SAMPLE: ${{ steps.attention.outputs.small_sample }}
          CONCLUSION_MIX: ${{ steps.attention.outputs.conclusion_mix }}
          NOT_RUN: ${{ steps.attention.outputs.not_run }}
          TOTAL_RUNS: ${{ steps.stats.outputs.total_runs }}
          TOTAL_SUCCESS: ${{ steps.stats.outputs.total_success }}
          TOTAL_FAILURE: ${{ steps.stats.outputs.total_failure }}
          TOTAL_FAILED_OUTCOMES: ${{ steps.stats.outputs.total_failed_outcomes }}
          TOTAL_DECISIVE: ${{ steps.stats.outputs.total_decisive }}
          DETAIL_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          LOOKBACK: ${{ inputs.lookback_days || 30 }}
          API_GUARD: ${{ steps.api_guard.outputs.report }}
        run: |
          set -euo pipefail

          total_runs="${TOTAL_RUNS:-0}"
          total_success="${TOTAL_SUCCESS:-0}"
          if [ "$total_runs" -gt 0 ]; then
            SUCCESS_RATE=$(( total_success * 100 / total_runs ))
          else
            SUCCESS_RATE=0
          fi
          TOTAL_OTHER=$(( total_runs - total_success - ${TOTAL_FAILURE:-0} ))
          export SUCCESS_RATE TOTAL_OTHER

          cat > /tmp/audit_body.md << 'AUDIT_EOF'
          ## Monthly Workflow Audit - ${AUDIT_MONTH}

          **Audit Period:** Last ${LOOKBACK} days
          **Generated:** ${GENERATED_AT}

          ### Summary Statistics

          | Metric | Count |
          |--------|-------|
          | Total Runs | ${TOTAL_RUNS} |
          | Successful | ${TOTAL_SUCCESS} |
          | Failure conclusion | ${TOTAL_FAILURE} |
          | Failed outcomes (ranking numerator) | ${TOTAL_FAILED_OUTCOMES} |
          | Decisive outcomes (ranking denominator) | ${TOTAL_DECISIVE} |
          | Other conclusions (including cancelled) | ${TOTAL_OTHER} |
          | Success Rate (all runs, descriptive only) | ${SUCCESS_RATE}% |

          Ranking uses failed outcomes / decisive outcomes (success + failed outcomes),
          with at least five decisive outcomes. Failed outcomes are `failure`, `timed_out`,
          `startup_failure`, and `action_required` (blocked pending action).
          Neutral, skipped, cancelled, stale, null and unrecognized conclusions are
          excluded from that denominator, not counted as failures. Null conclusions on
          non-completed runs are listed as `pending:<status>`; completed or missing-status
          nulls are `unknown`.

          **Complete detail:** [monthly-audit-details artifact on this audit run](${DETAIL_URL})
          retains every workflow, conclusion count, and full ranked list for 90 days.
          Sections below are bounded to 6,000 bytes plus explicit omission notices;
          omitted rankings remain in the artifact, not silently discarded.

          ### Workflows Requiring Immediate Attention (>50% failed decisive outcomes)

          ${FAILING}

          ### Workflows Requiring Review (>20% through 50% failed decisive outcomes)

          ${WARNING}

          ### Failures With Fewer Than Five Decisive Outcomes

          ${SMALL_SAMPLE}

          ### Conclusion Mix (aggregate, then bounded per-workflow detail)

          ${CONCLUSION_MIX}

          ### Workflows Not Run This Period

          ${NOT_RUN}

          ---

          ### API Wrapper Guard

          ${API_GUARD}

          ---

          ## Audit Checklist

          ### Critical Items
          - [ ] Review workflows with >50% failed decisive outcomes and investigate small-sample failures
          - [ ] Archive workflows that consistently fail and cannot be fixed
          - [ ] Verify archived workflows are documented

          ### Standard Review
          - [ ] Review workflows with >20% through 50% failed decisive outcomes
          - [ ] Check if workflows that haven't run are still needed
          - [ ] Review any new workflow additions this month

          ### Optimization
          - [ ] Check for opportunities to parallelize jobs
          - [ ] Review workflow run times for optimization
          - [ ] Verify caching is effective

          ### Documentation
          - [ ] Update LABELS.md if label triggers changed
          - [ ] Update WORKFLOW_GUIDE.md if needed
          - [ ] Sync documentation to consumer repos

          ---

          **Previous audit:** Check for issues with label `workflow-audit`
          **Documentation:** See
          [Monthly workflow audit procedure](https://github.com/stranske/Workflows/blob/main/docs/ci/WORKFLOW_AUDIT_PROCEDURE.md)
          and
          [archived audit reports](https://github.com/stranske/Workflows/blob/main/docs/archive/ARCHIVE_PLANS.md#workflow-audit-reports)
          AUDIT_EOF

          # Substitute environment variables
          # shellcheck disable=SC2016
          envsubst '${AUDIT_MONTH} ${LOOKBACK} ${GENERATED_AT} ${TOTAL_RUNS}
            ${TOTAL_SUCCESS} ${TOTAL_FAILURE} ${TOTAL_FAILED_OUTCOMES} ${TOTAL_DECISIVE}
            ${DETAIL_URL} ${TOTAL_OTHER} ${SUCCESS_RATE}
            ${FAILING} ${WARNING} ${SMALL_SAMPLE} ${CONCLUSION_MIX} ${NOT_RUN} ${API_GUARD}' \
            < /tmp/audit_body.md > /tmp/audit_final.md

          # Fail visibly before crossing the issue-body or per-environment-value limit.
          # Complete details have already been uploaded even if another report grows.
          if [ "$(wc -c < /tmp/audit_final.md)" -gt 60000 ]; then
            echo "Audit body exceeds safe 60,000-byte limit; see monthly-audit-details artifact" >&2
            exit 1
          fi

          {
            echo "body<<EOF"
            cat /tmp/audit_final.md
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update audit issue
        if: github.event_name == 'schedule' || inputs.create_issue
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_BODY: ${{ steps.checklist.outputs.body }}
          AUDIT_MONTH: ${{ steps.stats.outputs.audit_month }}
        run: |
          set -euo pipefail

          title="[Monthly Audit] Workflow Health Check - ${AUDIT_MONTH}"

          # Check for existing open audit issue
          existing=$(gh issue list --repo "${{ github.repository }}" \
            --label "workflow-audit" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "${existing}" ]; then
            echo "Updating existing issue #${existing}"
            gh issue edit "${existing}" \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "${AUDIT_BODY}"
            echo "Updated issue: https://github.com/${{ github.repository }}/issues/${existing}"
          else
            echo "Creating new audit issue"
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${title}" \
              --body "${AUDIT_BODY}" \
              --label "workflow-audit,maintenance"
            echo "Created new audit issue"
          fi

      - name: Post summary
        run: |
          {
            echo "## Workflow Audit Complete"
            echo ""
            echo "**Period:** Last ${{ inputs.lookback_days || 30 }} days"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| Total Runs | ${{ steps.stats.outputs.total_runs }} |"
            total_runs="${{ steps.stats.outputs.total_runs }}"
            total_success="${{ steps.stats.outputs.total_success }}"
            if [ "$total_runs" -gt 0 ]; then
              rate=$(( total_success * 100 / total_runs ))
            else
              rate=0
            fi
            echo "| Success Rate (all runs, descriptive only) | ${rate}% |"
            echo ""
            if [ "${{ inputs.create_issue }}" != "false" ]; then
              echo "📋 Audit issue created/updated with full checklist"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
