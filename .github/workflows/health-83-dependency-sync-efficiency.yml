name: Health 83 Dependency Sync Efficiency

on:
  schedule:
    - cron: '15 11 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Load registered consumers
        id: consumers
        run: echo "repos=$(python scripts/list_registered_consumer_repos.py --separator ',')" >> "$GITHUB_OUTPUT"

      - name: Collect bounded GitHub evidence
        uses: actions/github-script@v9
        env:
          REGISTERED_REPOS: ${{ steps.consumers.outputs.repos }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const repos = [...new Set([
              context.repo.repo,
              ...String(process.env.REGISTERED_REPOS || '').split(',').filter(Boolean),
              'Collab-Admin',
            ])];
            const pulls = [];
            const workflow_runs = [];
            for (const repo of repos) {
              const [owner, name] = repo.includes('/') ? repo.split('/') : [context.repo.owner, repo];
              const prPage = await github.rest.pulls.list({owner, repo: name, state: 'all', sort: 'updated', direction: 'desc', per_page: 100});
              for (const pr of prPage.data) {
                pulls.push({repo: `${owner}/${name}`, number: pr.number, title: pr.title, body: pr.body, state: pr.state, author: pr.user?.login, head_ref: pr.head?.ref, head_sha: pr.head?.sha, created_at: pr.created_at, updated_at: pr.updated_at, merged_at: pr.merged_at, closed_at: pr.closed_at});
              }
              const runPage = await github.rest.actions.listWorkflowRunsForRepo({owner, repo: name, per_page: 100});
              for (const run of runPage.data.workflow_runs) {
                workflow_runs.push({repo: `${owner}/${name}`, head_sha: run.head_sha, status: run.status, conclusion: run.conclusion, created_at: run.created_at});
              }
            }
            fs.writeFileSync('dependency-sync-efficiency-input.json', JSON.stringify({
              period: {kind: 'latest-100-updated-items-per-repo'},
              collection: {history_complete: false, limitations: ['Each repository is bounded to its latest 100 updated PRs and workflow runs; historical pagination is intentionally not claimed.']},
              pulls, workflow_runs,
            }, null, 2));

      - name: Calculate advisory SLOs
        run: |
          python scripts/dependency_sync_efficiency_metrics.py \
            --input dependency-sync-efficiency-input.json \
            --json-out dependency-sync-efficiency.json \
            --markdown-out dependency-sync-efficiency.md
          echo "fingerprint=$(python -c 'import json; from scripts.dependency_sync_efficiency_metrics import fingerprint; print(fingerprint(json.load(open("dependency-sync-efficiency.json"))))')" >> "$GITHUB_OUTPUT"
        id: metrics

      - name: Comment only on material tracker evidence changes
        uses: actions/github-script@v9
        env:
          FINGERPRINT: ${{ steps.metrics.outputs.fingerprint }}
        with:
          github-token: ${{ secrets.OWNER_PR_PAT || secrets.SERVICE_BOT_PAT || github.token }}
          script: |
            const fs = require('fs');
            const marker = `dependency-sync-efficiency:v1 fingerprint=${process.env.FINGERPRINT}`;
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: 1836, per_page: 100});
            if (!comments.some((comment) => comment.body.includes(marker))) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1836, body: `<!-- ${marker} -->\n${fs.readFileSync('dependency-sync-efficiency.md', 'utf8')}`});
            }

      - name: Upload report artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dependency-sync-efficiency-${{ github.run_id }}
          path: |
            dependency-sync-efficiency-input.json
            dependency-sync-efficiency.json
            dependency-sync-efficiency.md
