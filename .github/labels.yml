# .github/labels.yml
# Agent assignment labels
- name: agent:codex
  color: 0e8a16
  description: Assign to Codex agent
- name: agent:claude
  color: 5319e7
  description: Assign to Claude agent
- name: agent:cursor
  color: 00b8d9
  description: Assign to Cursor agent (cursor-agent CLI)
- name: agent:gemini
  color: 1a73e8
  description: Assign to Gemini agent (gemini CLI)
- name: agent:aider
  color: 8d6e63
  description: Assign to Aider agent (cheap, low-complexity tasks)
- name: agent:copilot
  color: 1d76db
  description: Assign to Copilot
- name: agent:auto
  color: ededed
  description: Let the system choose an agent (policy-driven)

# Agent workflow labels
- name: agents
  color: fbca04
  description: Agent automation
- name: agents:activated
  color: ededed
  description: Agent has been activated
- name: agents:keepalive
  color: 1d76db
  description: Enable keepalive monitoring on PR
- name: agents:pause
  color: b60205
  description: Pause agent work
- name: agents:paused
  color: c2e0c6
  description: Pause keepalive for this PR
- name: agents:allow-change
  color: ededed
  description: Permit workflow edits when justification provided

# Agent status labels (for human visibility)
- name: agent:rate-limited
  color: d93f0b
  description: Agent paused due to API rate limits
- name: agent:retry
  color: 0e8a16
  description: Add to trigger agent retry after rate limit or pause
- name: agent:needs-attention
  color: fbca04
  description: Agent needs human review or intervention
- name: agent-high-privilege
  color: d93f0b
  description: Marks PRs that require high-privilege agent environments

# PR origin labels
- name: from:codex
  color: 0e8a16
  description: PR was created by or for Codex
- name: from:claude
  color: 5319e7
  description: PR was created by or for Claude
- name: from:copilot
  color: 0366d6
  description: PR was created by or for Copilot

# Workflow source labels
- name: workflow:source-issue
  color: 0e8a16
  description: PR source is a GitHub issue
- name: workflow:source-local-request
  color: 0e8a16
  description: PR source is a local Codex or user request
- name: workflow:source-automation
  color: ededed
  description: PR source is an automation or workflow run
- name: workflow:source-sync
  color: 1d76db
  description: PR source is a sync or maintenance campaign
- name: workflow:source-dependabot
  color: 0366d6
  description: PR source is Dependabot or dependency automation
- name: workflow:source-review-followup
  color: 5319e7
  description: PR source is follow-up from review feedback
- name: workflow:source-direct-pr
  color: fbca04
  description: PR was started directly on GitHub without a source issue
- name: workflow:no-automation
  color: b60205
  description: Do not let workflow automation manage this PR unless checks fail
- name: workflow:source-needed
  color: d93f0b
  description: Workflow source context is missing or ambiguous

# Autofix labels
- name: autofix
  color: 0366d6
  description: Let bots format/lint automatically
- name: autofix:applied
  color: 7057ff
  description: Autofix was applied
- name: autofix:clean
  color: 0e8a16
  description: Autofix passed - no changes needed
- name: autofix:patch
  color: ededed
  description: Autofix patch available

# Automerge labels
- name: automerge
  color: 0052cc
  description: Eligible for auto-merge when checks pass

# Verification follow-up labels
- name: verify:create-new-pr
  color: 5319e7
  description: Create a follow-up issue and new PR from verification results

# Risk assessment labels
- name: risk:low
  color: 0e8a16
  description: Small, safe change (automerge candidate)
- name: risk:medium
  color: fbca04
  description: Moderate change
- name: risk:high
  color: d73a4a
  description: Large or sensitive change

# Status labels (used by agents)
- name: status:in-progress
  color: fbca04
  description: Agent work in progress
- name: status:ready
  color: 0052cc
  description: Ready for agent pickup

# Reminder label (for scheduled tasks)
- name: reminder
  color: d4c5f9
  description: Reminder for future action
