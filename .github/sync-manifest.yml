  - source: .github/workflows/agents-verifier.yml
    description: "Verifier - validates agent work meets acceptance criteria"

  - source: .github/workflows/list-llm-models.yml
    description: "List LLM Models - helper to show available models for verifier"

  - source: .github/workflows/agents-bot-comment-handler.yml
    description: "Bot comment handler - dispatches agents to address bot review comments (deprecated; replaced by agents-80-pr-event-hub.yml, removal no earlier than 2026-02-15)"

  - source: .github/workflows/agents-issue-optimizer.yml
    description: "Issue optimizer - LangChain-based issue formatting and optimization (Phase 1)"

  - source: .github/workflows/agents-verify-to-issue.yml
    description: "Verify to issue v1 (DEPRECATED) - disabled workflow, replaced by v2"

  - source: .github/workflows/agents-verify-to-issue-v2.yml
    description: "Verify to issue v2 - creates follow-up issues from verification feedback with LLM curation (Phase 4E; deprecated for agents-80-pr-event-hub.yml, removal no earlier than 2026-02-15)"

  - source: .github/workflows/agents-verify-to-new-pr.yml
    description: "Verify to new PR - creates follow-up issue and triggers auto-pilot to prepare a new PR"

  - source: .github/workflows/agents-verify-to-new-pr-autopilot.yml
    description: "Verify to new PR continuation - workflow_run bridge to auto-pilot after follow-up issue creation"

  - source: .github/workflows/agents-auto-label.yml
    description: "Auto-label - suggests/applies labels based on semantic matching (Phase 5A)"

  - source: .github/workflows/agents-capability-check.yml
    description: "Capability check - pre-flight agent feasibility gate (Phase 3A)"

  - source: .github/workflows/agents-decompose.yml
    description: "Task decomposition - breaks large issues into sub-tasks (Phase 3B)"

  - source: .github/workflows/agents-dedup.yml
    description: "Duplicate detection - flags similar open issues (Phase 3C)"

  - source: .github/workflows/agents-guard.yml
    description: "Agents guard - enforces agents workflow protections (Health 45)"

  - source: .github/workflows/agents-auto-pilot.yml
    description: "Auto-pilot - end-to-end automation orchestrator (format → optimize → agent → verify)"

  # Maintenance workflows
  - source: .github/workflows/maint-coverage-guard.yml
    description: "Coverage guard - daily baseline monitoring with automatic issue creation"

  # Version pins
  - source: .github/workflows/autofix-versions.env
    description: "Autofix tool version pins - shared dev tool versions (synced)"

  # Dependabot configuration and automation
  - source: .github/dependabot.yml
    description: "Dependabot config - ignores dev tools synced via maint-52"
    sync_mode: create_only

  - source: .github/workflows/dependabot-automerge.yml
    description: "Dependabot auto-merge - automatically merges dependabot PRs when checks pass"


  # Reusable PR context workflow (medium-effort rate limit optimization)
  - source: .github/workflows/reusable-pr-context.yml
    description: "Reusable PR context workflow - centralized PR data fetching via GraphQL"

# Files to remove from consumer repos (obsolete / harmful when present)
removals:
  - target: .github/workflows/agents-63-issue-intake.yml
    description: "Remove deprecated issue intake workflow (replaced by agents-64/70)"
  - target: .workflows-lib
    description: "Remove deprecated workflows lib submodule"
