[build-system]
requires = ["setuptools>=69.5.1", "wheel>=0.43.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workflows"
version = "0.1.0"
description = "Reusable GitHub Actions workflows and automation infrastructure"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "Workflow Contributors"}
]
keywords = ["github-actions", "workflows", "ci-cd", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/stranske/Workflows"
Issues = "https://github.com/stranske/Workflows/issues"

[project.optional-dependencies]
app = []
dev = [
    "pre-commit==4.5.1",
    "black==26.1.0",
    "ruff==0.15.0",
    "isort==7.0.0",
    "docformatter==1.7.7",
    "mypy==1.19.1",
    "flake8==7.3.0",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
    "coverage==7.13.3",
    "pytest-xdist==3.8.0",

    # Required by repo dependency checks / CI fallback checks
    "hypothesis>=6.0.0",
    "pandas",
    "numpy<3.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "jsonschema>=4.0.0",
    "PyYAML>=6.0.0",

    # Used by scripts/sync_test_dependencies.py to edit pyproject.toml
    "tomlkit>=0.13.0",
]

# LangChain integration for LLM-enhanced task analysis
# Install with: pip install -e ".[langchain]"
# Versions auto-updated by scripts/update_langchain_versions.py
langchain = [
    "langchain>=1.2,<1.3",
    "langchain-core>=1.2,<1.3",
    "langchain-community>=0.4,<0.5",
    "langchain-openai>=1.1,<1.2",
    "langchain-anthropic>=0.3,<1.4",
    "faiss-cpu>=1.8,<2.0; python_version < \"3.12\"",  # Vector store for dedup workflow
]

[tool.setuptools]
# This repo is primarily automation + scripts; avoid setuptools trying to auto-discover
# random top-level dirs as importable packages (which breaks editable installs).
packages = []

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # Exclude standard directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | archive
  | \.extraction
)/
'''

[tool.isort]
profile = "black"
line_length = 100
known_first_party = []
skip_glob = ["archive/*", ".extraction/*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = []

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade - modern Python syntax
    "SIM", # flake8-simplify - code simplification
]
ignore = [
    "E501",  # Line too long (handled by black)
]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E501", "W503"]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "archive",
    ".extraction",
    "build",
    "dist",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
files = ["src"]
disable_error_code = "import-untyped"
exclude = [
    "^archive/",
    "^\\.extraction/",
    "^templates/",
    "^[^/]+\\.py$",
]

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["scripts.*", "tools.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "integration: marks tests as integration tests (may require external resources)",
    "cosmetic: marks tests for cosmetic/formatting changes",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "serial: marks tests that must run serially",
    "xdist_group: marks tests that must share a single xdist worker",
]
filterwarnings = [
    "error",
]

[tool.coverage.run]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/.venv/*",
    "archive/*",
    ".extraction/*",
    # CI autofix test fixtures - not production code
    "src/trend_analysis/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
